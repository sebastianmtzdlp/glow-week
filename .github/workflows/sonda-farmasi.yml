name: Sonda Farmasi (temporal)
on:
  push:
    branches: [precios-auto]
    paths: [".github/workflows/sonda-farmasi.yml"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          mkdir out; cd out
          curl -sSL -A "$UA" -o tienda.html -w "tienda %{http_code} %{url_effective}\n" https://mx.farmasi.com/selenevehe
          curl -sSL -A "$UA" -o detalle.html -w "detalle %{http_code}\n" https://www.mx.farmasi.com/farmasi/product-detail/nutriplus-creatina
          wc -c *.html
          head -c 3000 tienda.html; echo
          grep -oE '(src|href)="[^"]+\.js[^"]*"' tienda.html | head -40
          grep -oE 'https?://[a-zA-Z0-9.-]*(api|service|gateway)[a-zA-Z0-9./-]*' tienda.html detalle.html | sort -u | head
          for js in $(grep -oE 'src="[^"]+\.js[^"]*"' tienda.html | sed 's/src="//;s/"$//' | head -30); do
            case "$js" in http*) u=$js;; //*) u=https:$js;; *) u=https://mx.farmasi.com$js;; esac
            curl -sSL -A "$UA" "$u" -o b.js; echo "== $u $(wc -c <b.js)"
            grep -oE 'https?://[a-zA-Z0-9.-]+farmasi[a-zA-Z0-9./_-]*' b.js | sort -u | head -20
            grep -oE '"/?api/[a-zA-Z0-9/_{}.$-]+' b.js | sort -u | head -40
          done
          grep -o '__NEXT_DATA__' tienda.html detalle.html
          python3 - <<'P'
          import re
          s=open('detalle.html',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'(price|Price|precio)[^<]{0,120}', s):
              print(m.group(0)[:160])
              if m.start()>len(s): break
          P
