name: Fotos de productos

# Guarda una copia de la foto de cada producto en ventas-de-whatsapp/fotos/
# para que las tarjetas de /ventas-de-whatsapp/ salgan con foto.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 7 * * 1"   # lunes, 01:40 hora de México
  push:
    branches: [main]
    paths: ["_data/catalogo-farmasi.json", "_data/fuera-de-catalogo.json", "_data/promos-base.json", "scripts/fotos_productos.py"]

permissions:
  contents: write

concurrency:
  group: fotos-productos
  cancel-in-progress: false

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar las fotos que faltan
        run: python3 scripts/fotos_productos.py
      - name: Publicar cambios
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add ventas-de-whatsapp/fotos
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "Fotos de productos (automático)"
            git pull -q --rebase origin main && git push -q origin HEAD:main
          fi
