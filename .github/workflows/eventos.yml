name: Eventos

# Los eventos viven en Supabase (tabla eventos). Cada 10 minutos se copian a _data/eventos.json
# (scripts/eventos_supabase.py) y se regeneran las páginas (scripts/eventos.py), así que un evento
# nuevo en la tabla sale solo en mitienda.beauty/eventos. También corre al cambiar las plantillas.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["_data/eventos.json", "_data/equipo.json", "scripts/eventos.py", "scripts/eventos_supabase.py", "scripts/evento_*.html", "scripts/serie_*.html"]

permissions:
  contents: write
  pages: write

concurrency:
  group: eventos
  cancel-in-progress: false

jobs:
  eventos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Leer eventos de Supabase
        run: python3 scripts/eventos_supabase.py
      - name: Generar páginas
        run: python3 scripts/eventos.py
      - name: Publicar cambios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _data/eventos.json eventos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Eventos actualizados desde Supabase (automático)"
          git pull -q --rebase origin main && git push -q origin HEAD:main
          # Los push con el token de la acción no publican Pages solos
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
