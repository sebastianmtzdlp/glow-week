name: Eventos

# Regenera las páginas de /eventos/<slug>/ cuando cambia _data/eventos.json
# o la plantilla, para que agregar un evento sea solo editar el JSON.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["_data/eventos.json", "scripts/eventos.py", "scripts/evento_plantilla.html"]

permissions:
  contents: write

concurrency:
  group: eventos
  cancel-in-progress: false

jobs:
  eventos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar páginas
        run: python3 scripts/eventos.py
      - name: Publicar cambios
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -A eventos
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "Páginas de eventos actualizadas (automático)"
            git pull -q --rebase origin main && git push -q origin HEAD:main
          fi
