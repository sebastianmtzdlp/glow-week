name: Precios

# Revisa que los precios de las tiendas cuadren entre archivos y que no estén viejos.
# Si hay algo que ver, abre (o actualiza) un aviso en Issues asignado a Pasha, que le llega por correo.
# Cuando todo vuelve a cuadrar, cierra el aviso solo.
# Farmasi no deja que GitHub lea su tienda (responde 403), así que los precios se actualizan
# pegando el texto en el proyecto: scripts/precios.py actualiza <archivo>.
on:
  workflow_dispatch:
  schedule:
    - cron: "15 14 * * 1,4"   # lunes y jueves, 08:15 hora de México
  push:
    branches: [main]
    paths: ["_data/catalogo-farmasi.json", "_data/catalogo.json", "_data/fuera-de-catalogo.json", "_data/promos-base.json", "scripts/precios.py"]

permissions:
  contents: read
  issues: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  revisa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar precios
        id: rev
        run: |
          if python3 scripts/precios.py revisa --dias 14; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi
          cat precios-revision.md >> "$GITHUB_STEP_SUMMARY"
      - name: Avisar a Pasha
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: "Revisar precios de las tiendas"
        run: |
          n=$(gh issue list --state open --search "\"$TITULO\" in:title" --json number -q '.[0].number')
          if [ "${{ steps.rev.outputs.ok }}" = "1" ]; then
            if [ -n "$n" ]; then gh issue close "$n" --comment "Todo cuadra y los precios están al día. Cierro el aviso."; fi
            exit 0
          fi
          printf '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' >> precios-revision.md
          if [ -n "$n" ]; then
            if ! gh issue view "$n" --json body -q .body | diff -q - <(sed '1d' precios-revision.md) >/dev/null 2>&1; then
              gh issue edit "$n" --body-file <(sed '1d' precios-revision.md)
            fi
          else
            gh issue create --title "$TITULO" --body-file <(sed '1d' precios-revision.md) --assignee "${{ github.repository_owner }}"
          fi
