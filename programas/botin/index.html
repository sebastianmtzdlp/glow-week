<style>

var LESSONS_MD="@@ 0 | Empieza aquí | Bienvenida al Botín | Cómo usar el curso\nEste curso es para que dejes de esperar una idea \"original\" y empieces a crear con lo que ya te inspira. Son 10 clases cortas sobre creatividad, aterrizadas a tu contenido, tu marca y tu negocio.\n\n## De qué va\nCasi todas creemos que las personas creativas sacan sus ideas de la nada. No es así. Las que crean mucho son las que **miran con atención, juntan lo que les gusta, lo mezclan y lo comparten**. Eso se aprende, y se practica.\n\nAquí no vas a aprender a copiar el video de otra. Vas a aprender a estudiar lo que admiras, entender por qué funciona y convertirlo en algo que solo tú puedes hacer.\n\n## Lo que te llevas\n- Tu **Cajón**: un lugar donde guardas todo lo que te inspira.\n- Tu **árbol de maestras**: las personas de las que vas a aprender a propósito.\n- Una **mesa de papel** para pensar sin la presión de la pantalla.\n- Un **proyecto aparte** que sea solo tuyo.\n- El hábito de **compartir tu proceso**, no solo el resultado.\n- Tu **cadena de X** y tu **bitácora**, para crear todos los días sin depender de la inspiración.\n- Tus **reglas**: lo que decides dejar fuera para que tu contenido tenga cara propia.\n\n## Cómo aprovecharlo\n1. **Lee una clase por semana.** Son unos 5 minutos.\n2. **Haz el ejercicio en tu cuaderno**, que viene al final de cada clase y se guarda en tu celular.\n3. **Haz la tarea esa semana**, aunque sea en chiquito.\n4. **Comparte en el grupo.** Lo que compartes, alguien más lo aprovecha, y tú aprendes de lo que comparten las demás.\n\n> Todo consejo es una carta a quien eras antes. Toma lo que te sirva y deja lo demás.\n\n## 🪞 Mírate al espejo\n¿Cuántas veces has dejado de publicar algo porque sentiste que \"ya lo hizo alguien más\"?\n\n## ✍️ Ejercicio\nEscribe tres cuentas, marcas o personas cuyo contenido te encanta. Junto a cada una, anota en una línea qué es lo que te gusta: no lo que hacen, sino **por qué te atrapa**.\n\n## ✅ Tu tarea de la semana\nElige el día y la hora de la semana en que vas a leer tu clase y ponlo en tu calendario.\n\n## 💬 Para compartir en el grupo\nComparte una de tus tres cuentas favoritas y qué es lo que te atrapa de ella.\n\n@@ 1 | Clase 1 | Roba como artista | Nada sale de la nada\nLa pregunta que todas las creadoras escuchan es \"¿de dónde sacas tus ideas?\". La respuesta honesta casi siempre es la misma: de otras ideas.\n\n## Nada es original, y qué bueno\nCuando alguien dice que algo es \"muy original\", casi siempre es porque no conoce de dónde salió. Todo lo que se crea se construye sobre algo que existía antes. Las canciones, las recetas, los looks de maquillaje, los formatos de video.\n\nEsto puede sonar desanimante, pero es una liberación. Si nada es completamente nuevo, ya no tienes que inventar desde cero. Puedes dejar de huir de tus influencias y empezar a usarlas.\n\n## Bueno o malo deja de importar\nCuando miras así, dejas de preguntarte si algo está \"bien\" o \"mal\". Solo te preguntas: **¿vale la pena llevármelo?** Una transición de un video, la forma en que una vendedora contesta una objeción, la luz de una foto, el orden de una vitrina. Si hoy no le ves uso, a lo mejor en un mes sí.\n\n## La tercera línea\nDibuja dos líneas paralelas en una hoja. ¿Cuántas hay? Dos, más una tercera: el espacio que queda entre ellas. Así funcionan las ideas nuevas: **una mezcla de dos o más ideas que ya existían**, que forman algo que ninguna tenía sola.\n\nTú también eres eso. Tienes rasgos de tu mamá y de tu papá, pero no eres ninguno de los dos. Y así como tienes familia de sangre, tienes una familia de ideas: no la eliges al nacer, pero sí eliges a quién lees, a quién sigues, qué escuchas y qué ves. **Eres la suma de lo que dejas entrar.**\n\n## Junta buena basura\nPor eso importa tanto lo que consumes. Si tu feed está lleno de contenido flojo, tu contenido va a salir flojo. Sé coleccionista, no acumuladora: la acumuladora guarda todo; la coleccionista solo guarda lo que de verdad le mueve algo.\n\n## Tu árbol de maestras\nNo intentes estudiar a todo el mundo a la vez: te vas a ahogar. Elige a **una persona** que te inspire mucho y aprende todo de ella. Luego busca a tres personas que la inspiraron a ella y estúdialas. Repite. Así armas un árbol, y cuando lo tengas, te toca crecer tu propia rama.\n\nLo bonito es que las maestras a las que no conoces no te pueden decir que no. Dejaron su forma de trabajar en lo que publicaron.\n\n## Sé tu propia escuela\nIr a la escuela es una cosa; aprender es otra. Busca todo. Cuando te surja una duda, investígala antes de preguntarla: o encuentras la respuesta o te sale una pregunta mejor. Lee, ve videos, sigue cada referencia hasta el final.\n\n## Tu Cajón\nLleva siempre dónde anotar: una libreta, una carpeta de capturas, un tablero. Ahí guardas todo lo que vale la pena llevarte. ¿Viste algo bueno? Al Cajón. ¿Te falta inspiración? Abre el Cajón. La herramienta **Tu Cajón** te dice cómo armarlo.\n\n> No le copies la apariencia a nadie. Roba la forma de pensar.\n\n## 🪞 Mírate al espejo\n¿Qué tipo de contenido consumes más en un día normal? ¿Te está haciendo mejor creadora o solo te está entreteniendo?\n\n## ✍️ Ejercicio\n1. Escribe el nombre de una persona que te inspira mucho (de tu industria o de cualquier otra).\n2. Busca y anota a tres personas o marcas que la inspiraron a ella.\n3. Escribe una cosa concreta que puedes aprender de cada una.\n\n## ✅ Tu tarea de la semana\nArma tu Cajón (una carpeta en tu celular sirve) y guarda ahí al menos 10 cosas que te inspiren esta semana.\n\n## 💬 Para compartir en el grupo\nComparte la mejor cosa que guardaste en tu Cajón y qué te llevarías de ella.\n\n@@ 2 | Clase 2 | No esperes a saber quién eres | Empieza haciendo\nSi esperas a tener clara tu marca, tu estilo y tu voz antes de empezar, nunca vas a empezar. Te descubres haciendo, no pensando.\n\n## Todas nos sentimos impostoras\nEsa sensación de \"no sé lo que estoy haciendo y en cualquier momento se van a dar cuenta\" tiene nombre: síndrome de la impostora. Y la tiene casi todo el mundo. Las que crean mucho no es que no lo sientan; es que se presentan a trabajar de todas formas, todos los días.\n\n## Hazle como si ya fueras\nHay dos formas de entender \"finge hasta que lo logres\":\n1. **Actúa como la creadora que quieres ser** hasta que lo seas.\n2. **Haz el trabajo como si ya fuera tu trabajo** hasta que de verdad lo sea.\n\nLas dos sirven. Piensa en tu trabajo creativo como una obra de teatro: el escenario es tu rincón de grabar, el vestuario es lo que te pones para sentirte en modo creadora, la utilería son tus productos y tu luz, y el guion es el tiempo que te apartas para hacerlo.\n\n## Copia para aprender\nNadie nace con estilo. Aprendimos a escribir copiando letras y a hablar imitando. Las músicas empiezan tocando canciones de otros; las maquillistas, recreando looks que vieron.\n\nCopiar para practicar **no es plagio**. Plagio es decir que algo ajeno es tuyo. Copiar para aprender es como desarmar un reloj para entender cómo funciona.\n\n## A quién y qué copiar\n- **A quién:** a tus favoritas, a las que de verdad admiras. Y no a una sola: a muchas. Si copias a una, eres su sombra. Si aprendes de veinte, te vuelves tú.\n- **Qué:** no la apariencia, sino **el pensamiento** detrás. No quieres verte como ella; quieres ver el mundo como ella. ¿Por qué abrió el video así? ¿Por qué eligió esa palabra? ¿Qué entendió de su clienta?\n\n## Donde fallas, ahí está tu sello\nLlega un momento en que dejas de imitar y empiezas a emular: tomas lo aprendido y lo llevas a algo tuyo. Y casi siempre pasa sin querer: intentas hacerlo igual que tu favorita, no te sale igual... y ese \"no me sale igual\" es justo lo que te hace única. Tu acento, tu humor, tu manera de explicar.\n\n> Fíjate en qué no te sale igual que a tu favorita. Eso no es un error: es tu estilo asomándose.\n\n## 🪞 Mírate al espejo\n¿Qué estás esperando \"tener claro\" antes de empezar? ¿Es real o es miedo con otro nombre?\n\n## ✍️ Ejercicio\n1. Elige un video o publicación de alguien que admiras.\n2. Escribe paso a paso cómo está hecho: cómo abre, qué dice, cómo cierra, cuánto dura.\n3. Recréalo con tu producto y tus palabras.\n4. Anota qué te salió distinto. Esa es tu primera pista de estilo.\n\n## ✅ Tu tarea de la semana\nPublica tu versión del ejercicio. No tiene que salir perfecta: tiene que salir.\n\n## 💬 Para compartir en el grupo\nComparte qué te salió distinto a la original. Las demás te van a ayudar a ver tu sello.\n\n@@ 3 | Clase 3 | Haz lo que te gustaría ver | Crea lo que tú consumirías\nEl consejo de \"habla de lo que sabes\" suele dar contenido aburrido. Es mejor hablar de lo que te gusta.\n\n## Toda creación empieza siendo de fan\nHacemos cosas porque amamos cosas. Nos jalan ciertos videos, ciertas cuentas, ciertas historias, porque algo de ellas nos inspira. En el fondo, mucho de lo que creamos es contenido de fan: queremos más de lo que nos gusta.\n\n## Escribe la secuela\nCuando te encanta una serie, te quedas con ganas de la siguiente temporada. Usa esa sensación. Piensa en tu creadora favorita y pregúntate:\n- ¿Qué le falta a su contenido?\n- ¿Qué tema nunca toca y a ti te encantaría ver?\n- Si juntaras a tus tres creadoras favoritas en un solo video, ¿cómo sería?\n\nEse video que se te ocurrió es el que te toca hacer.\n\n## Haz el trabajo que quieres que exista\nToma las fotos que te gustaría ver. Haz el tutorial que buscaste y no encontraste. Arma la rutina de skincare que te habría servido cuando empezaste. Escribe la publicación que te habría convencido a ti.\n\n## Cuando no sepas qué sigue\nPara tu contenido y para tu vida, cuando no sepas qué paso dar, pregúntate: **¿qué sería una mejor historia?** Casi siempre la respuesta es la opción con un poco más de valor.\n\n> El contenido que tú guardarías es el que vale la pena publicar.\n\n## 🪞 Mírate al espejo\n¿Qué video buscaste alguna vez y no encontraste?\n\n## ✍️ Ejercicio\n1. Escribe 5 videos que te encantaría ver y que nadie ha hecho como tú los imaginas.\n2. Para cada uno, anota por qué te gustaría verlo.\n3. Elige el que más ganas te dé hacer.\n\n## ✅ Tu tarea de la semana\nGraba ese video. Si no lo publicas esta semana, por lo menos guárdalo en borradores.\n\n## 💬 Para compartir en el grupo\nComparte tu lista de 5 videos. Tal vez a otra del equipo le dé una idea.\n\n@@ 4 | Clase 4 | Usa tus manos | Sal de la pantalla para pensar\nEl celular es buenísimo para editar y publicar. Para tener ideas, no tanto.\n\n## Pensar con el cuerpo\nCuando todo pasa en la pantalla, se siente que solo tecleas y deslizas. Pero el cuerpo y el cerebro se hablan en los dos sentidos: cuando mueves las manos, la cabeza empieza a pensar. Por eso a veces las mejores ideas llegan mientras te maquillas, mientras acomodas tus productos o mientras haces garabatos en una libreta.\n\n## La pantalla te vuelve perfeccionista\nEn la computadora o en el celular es demasiado fácil borrar. Empiezas a corregir ideas que ni siquiera terminaste de tener. En una libreta, todo es posible: tachas, dibujas flechas, pegas cosas, y nada está terminado todavía.\n\n## Mesa de papel y mesa de pantalla\nSi tienes espacio, arma dos lugares:\n- **La mesa de papel.** Sin aparatos. Plumas, plumones, post-its, revistas, tijeras, tus productos. Aquí se generan las ideas: escribes guiones a mano, dibujas los cuadros de un video, pegas en la pared lo que te gusta y buscas patrones.\n- **La mesa de pantalla.** Tu celular, tu compu, tu aro de luz. Aquí se graba, se edita y se publica.\n\nSi no tienes dos mesas, que sean dos momentos: primero papel, después pantalla. Y si a mitad de la edición te quedas sin ideas, regresa al papel.\n\n> Las ideas nacen en papel. La pantalla es para terminarlas.\n\n## 🪞 Mírate al espejo\n¿Cuántas de tus ideas de contenido pensaste mientras veías el contenido de alguien más en el celular?\n\n## ✍️ Ejercicio\n1. Toma una hoja y un plumón. Sin celular cerca.\n2. Dibuja en 6 cuadros tu siguiente video: qué se ve y qué se dice en cada uno.\n3. Ahora sí, grábalo siguiendo tus cuadros.\n\n## ✅ Tu tarea de la semana\nArma tu mesa de papel (o tu caja de papel, si no tienes mesa) con lo mínimo: libreta, plumones y post-its.\n\n## 💬 Para compartir en el grupo\nComparte una foto de tus cuadros dibujados. No importa si dibujas feo: eso es lo divertido.\n\n@@ 5 | Clase 5 | Proyectos aparte y pasatiempos | Lo que haces por gusto también cuenta\nMuchas veces, lo que haces \"solo por jugar\" es lo que termina despegando.\n\n## Saltar de proyecto\nTen más de un proyecto a la vez. Cuando te canses de uno, pásate a otro, y cuando ese te canse, regresa al primero. No es falta de enfoque: es una forma de no quedarte atorada. A eso le llamamos **saltar de proyecto**: posponer una cosa haciendo otra que también vale.\n\nFíjate en qué haces cuando estás \"perdiendo el tiempo\". A lo mejor ahí está el trabajo que deberías estar haciendo.\n\n## Date permiso de aburrirte\nCuando estás ocupadísima, no se te ocurre nada. Las ideas necesitan espacio vacío. Lava los trastes, sal a caminar, plancha, mira por la ventana. Aburrirte no es perder el tiempo: es darle lugar a tu cabeza para conectar cosas.\n\n## No tires ninguna parte de ti\nSi te apasionan dos o tres cosas, no sientas que tienes que elegir una. Te gusta el maquillaje, la cocina y bailar; no son mundos separados. Déjalos que se mezclen y algo nuevo va a salir de ahí. Cuando sueltas una pasión por completo, tarde o temprano sientes que algo te falta.\n\n## Ten un pasatiempo que sea solo tuyo\nAlgo creativo que no tenga que dar dinero ni seguidores. Lo haces porque te hace feliz. Un pasatiempo te da energía en lugar de quitártela, y esa energía regresa a tu trabajo.\n\nNo te preocupes porque todo lo que haces \"tenga sentido junto\". Lo que une tu trabajo es que es tuyo. Con el tiempo, mirando hacia atrás, vas a ver cómo se conectan los puntos.\n\n> Lo que une todo lo que haces es que lo haces tú.\n\n## 🪞 Mírate al espejo\n¿Qué pasión dejaste de lado porque \"no tenía que ver con el negocio\"?\n\n## ✍️ Ejercicio\n1. Escribe tres cosas que te encantan y que no tienen nada que ver con lo que vendes.\n2. Para cada una, piensa una forma de mezclarla con tu contenido. Ejemplo: te encanta cocinar, entonces \"lo que me pongo en la cara vs. lo que me como en el desayuno\".\n\n## ✅ Tu tarea de la semana\nDedica una hora a tu pasatiempo, sin culpa y sin grabarlo.\n\n## 💬 Para compartir en el grupo\n¿Cuál es tu pasatiempo? A lo mejor descubres que otra del equipo comparte el tuyo.\n\n@@ 6 | Clase 6 | Haz buen trabajo y compártelo | El secreto no tan secreto\nLa fórmula para que te conozcan tiene solo dos pasos: haz un buen trabajo y compártelo con la gente.\n\n## Al principio, que no te vean es una ventaja\nCuando nadie te conoce, no hay presión. Puedes experimentar, equivocarte, probar formatos raros y hacer cosas solo por diversión. No tienes una imagen que cuidar. Aprovecha esa libertad mientras dura; cuando la gente empiece a mirarte, ya no la vas a tener igual.\n\n## Paso uno: haz buen trabajo\nEs la parte difícil y no tiene atajos. Hacer cosas todos los días. Aceptar que por un tiempo te va a salir mal. Fallar, ajustar y volver a hacerlo.\n\n## Paso dos: compártelo\nHoy compartir es facilísimo: lo subes. Y aquí está el truco: **enseña lo que sabes**. Fíjate en algo que te apasione y luego invita a otras a fijarse contigo. Si todas hablan de lo mismo, habla de lo que nadie está viendo.\n\nLas artistas no son magas: no pierdes nada por enseñar tus trucos. Cuando explicas cómo eliges un tono de base, cómo armas tus pedidos o cómo grabas con poca luz, la gente se acerca más a ti, confía y te compra.\n\n## Comparte para encontrar qué decir\nNo necesitas tener todo resuelto para publicar. Publicar también sirve para **descubrir qué tienes que decir**. Tu perfil puede ser un lugar donde las ideas crecen, no solo donde muestras lo terminado.\n\nY como lo último que subes es lo primero que ven, tener un espacio vacío por llenar te da un empujón para seguir creando.\n\n## No tienes que enseñarlo todo\nComparte un pedacito: un boceto, un antes, una parte de tu proceso, un buen consejo, un libro que te gustó. Si te preocupa revelar demasiado, comparte los puntos sin unirlos. Tú decides cuánto y qué.\n\n> Enseñar tus trucos no te quita clientas. Te las acerca.\n\n## 🪞 Mírate al espejo\n¿Qué sabes hacer que a ti te parece obvio pero a otras les costaría?\n\n## ✍️ Ejercicio\n1. Escribe 10 cosas que sabes hacer en tu negocio o con tus productos.\n2. Marca las 3 que a una clienta le gustaría aprender.\n3. Convierte una en un video tipo \"así lo hago yo\".\n\n## ✅ Tu tarea de la semana\nPublica algo de tu proceso, no solo el resultado: cómo preparas un pedido, cómo eliges tus tonos, cómo planeas tu semana.\n\n## 💬 Para compartir en el grupo\nComparte tu \"así lo hago yo\" y aprende de los trucos de las demás.\n\n@@ 7 | Clase 7 | La geografía ya no manda | Construye tu propio mundo\nNo necesitas vivir en una gran ciudad ni tener gente creativa a tu alrededor para pertenecer a una comunidad.\n\n## Tu comunidad puede estar en cualquier lado\nMuchas de las personas que más te inspiran y te enseñan probablemente no viven en tu ciudad. Las conoces por internet. Si te sientes sola en lo que haces, o lejos de donde \"pasan las cosas\", no te rindas: hay una comunidad con la que te puedes conectar desde donde estás. Tu equipo es parte de ella.\n\n## Arma tu rincón\nSi el mundo que te rodea no te inspira, crea uno. Rodéate de cosas que te gusten, pega en la pared lo que te mueve, ponte tu música. Lo único que necesitas es **un poco de espacio para trabajar y un poco de tiempo para hacerlo**.\n\n## Ratitos a solas\nEstar siempre conectada no deja espacio para pensar. Busca momentos sin celular: la fila del banco, la sala de espera, el rato en el coche esperando a los niños. Lleva una libreta. Esos ratitos de soledad son de los mejores para que se te ocurran cosas.\n\n## Sal de tu casa\nCuando tu cabeza se acostumbra a lo de siempre, deja de ver. Un lugar distinto, aunque sea otro barrio, otro mercado u otra ciudad cercana, te hace ver todo nuevo. Y cuando regresas, aunque todo esté igual, tú ya no ves igual.\n\nRodéate también de gente interesante que no sea de tu mundo: alguien que cocina, alguien que programa, alguien que pinta. Te dan ideas que nunca te daría alguien que hace lo mismo que tú.\n\n> No tienes que mudarte para encontrar a tu gente. Tienes que buscarla.\n\n## 🪞 Mírate al espejo\n¿Dónde te sientes más creativa? ¿Cuándo fue la última vez que estuviste ahí?\n\n## ✍️ Ejercicio\n1. Escribe tres lugares cerca de ti que no conozcas o que no visites desde hace mucho.\n2. Escribe tres personas de otros mundos (no de ventas, no de belleza) de las que podrías aprender algo.\n\n## ✅ Tu tarea de la semana\nVe a uno de esos tres lugares y regresa con tres cosas para tu Cajón.\n\n## 💬 Para compartir en el grupo\nComparte una foto de algo que viste esta semana y que te dio una idea.\n\n@@ 8 | Clase 8 | Sé amable | El mundo es un pueblo chico\nEn internet todo se sabe. Si hablas de alguien, tarde o temprano se entera. Así que la regla de oro vale más que nunca.\n\n## Haz amigas, ignora a las enemigas\nLa mejor forma de lidiar con quien te critica en internet es no darle tu energía. La mejor forma de hacer amigas es decir cosas buenas de ellas. Y entre compañeras, celebrar los logros de otra no te quita nada.\n\n## Júntate con talento\nEres tan buena como la gente de la que te rodeas. En redes eso significa **seguir a quien sabe más que tú** y fijarte en lo que comparte, lo que hace y lo que recomienda. Busca a la persona más talentosa del lugar, ponte cerca y ofrece tu ayuda. Y si un día eres tú la más talentosa del lugar, busca otro lugar donde aprender.\n\n## Convierte el enojo en trabajo\nVas a ver cosas que te parecen mal hechas y te van a dar ganas de pelearte en los comentarios. No lo hagas. Usa ese coraje: si te molesta cómo otras explican algo, haz tú el video que lo explica bien. **Quéjate haciendo.**\n\n## Cartas de fan públicas\nEscribirle a alguien que admiras esperando que te conteste pone mucha presión. Mejor haz algo público: una publicación sobre por qué admiras su trabajo, una respuesta a una pregunta que hizo, un video inspirado en lo suyo dándole crédito. Si lo ve, qué bonito; si no, ya diste las gracias y aprendiste algo.\n\n## No esperes aprobación\nUna vez que publicas algo, no controlas cómo lo recibe la gente. Te van a malinterpretar, a ignorar y a veces a criticar. El truco es estar tan ocupada haciendo que no te dé tiempo de preocuparte.\n\n## La carpeta de porras\nGuarda cada mensaje bonito que recibas: la clienta que te agradeció, el comentario que te hizo el día. Los mensajes feos van a la basura. Cuando tengas un día malo, abre tu carpeta, lee un par y regresa a trabajar. Solo no te quedes a vivir ahí.\n\n> Celebrar a otra no te quita nada. Te pone en el lugar correcto.\n\n## 🪞 Mírate al espejo\n¿A quién del equipo o de tu industria admiras y nunca se lo has dicho?\n\n## ✍️ Ejercicio\n1. Escribe el nombre de alguien que admiras y tres cosas concretas que le has aprendido.\n2. Piensa cómo podrías darle crédito en público.\n3. Haz tu carpeta de porras: una carpeta en tu celular para capturas de mensajes bonitos.\n\n## ✅ Tu tarea de la semana\nHaz tu carta de fan pública: una publicación o historia que celebre el trabajo de alguien, con crédito.\n\n## 💬 Para compartir en el grupo\nCelebra a una compañera del equipo por algo concreto que hizo este mes.\n\n@@ 9 | Clase 9 | Sé aburrida | La rutina es lo que te deja crear\nLa imagen de la artista que vive en el caos es un cuento. Crear cansa, y para tener energía hay que tener una vida ordenada.\n\n## Cuídate\nCome bien, muévete, camina, duerme lo suficiente. Ve al dentista. Suena básico, pero si gastas tu energía en todo lo demás, no te queda para crear. Piensa a largo plazo: quieres seguir creando por muchos años.\n\n## Cuida tu dinero\nAprende de dinero lo antes posible, aunque te dé flojera. No importa tanto cuánto ganas como cuánto guardas. Haz un presupuesto, vive con lo que tienes y no te endeudes por \"invertir en ti\". Decirle que no a compras que no necesitas también es libertad.\n\n## No sueltes lo que te sostiene\nSi hoy tienes un trabajo o un ingreso fijo, no lo dejes por un sueño que todavía no paga. Un trabajo te da dinero, contacto con gente y una rutina. No tener presión económica te da libertad para crear lo que quieres. Además, en cualquier trabajo aprendes cosas que después te sirven.\n\nLo que de verdad importa es **tener una rutina** y apartar tu tiempo para crear dentro de ella. Mejor un poco todos los días que mucho de vez en cuando.\n\n## La cadena de X\nHacer mucho es la suma de hacer poquito muchas veces. Una publicación al día, por un año, son 365. Consigue un calendario que muestre todo el año. Cada día que hagas tu trabajo creativo, ponle una X grande. Después de unos días, tienes una cadena. Tu único trabajo es **no romper la cadena**.\n\n## Tu bitácora\nAsí como el calendario ve hacia adelante, la bitácora ve hacia atrás. No es un diario: es una lista corta de lo que hiciste cada día. Qué grabaste, qué vendiste, con quién hablaste. Con el tiempo te muestra cuánto has avanzado. Un tip: en lugar de preguntarte \"¿qué pasó hoy?\", pregúntate **\"¿qué fue lo mejor de hoy?\"**.\n\n## Elige bien a tu gente\nCon quién compartes la vida es de las decisiones más importantes, y no solo tu pareja: también tus socias, tus amigas, tu equipo. Rodéate de gente que te sostenga cuando crear se pone pesado.\n\n> Ordenada en tu vida, para poder ser atrevida en tu trabajo.\n\n## 🪞 Mírate al espejo\n¿Qué parte de tu vida (sueño, dinero, salud) te está quitando la energía para crear?\n\n## ✍️ Ejercicio\n1. Elige tu \"X\": la acción creativa diaria más pequeña que puedas sostener. Ejemplo: una historia al día, 10 minutos de guion, una foto de producto.\n2. Escribe a qué hora del día la vas a hacer.\n3. Escribe tu primera entrada de bitácora: lo mejor de hoy.\n\n## ✅ Tu tarea de la semana\nEmpieza tu cadena de X y lleva tu bitácora toda la semana. La herramienta **Tu cadena y tu bitácora** te dice cómo.\n\n## 💬 Para compartir en el grupo\nComparte cuántas X llevas al final de la semana. Si se rompió la cadena, empieza otra; no pasa nada.\n\n@@ 10 | Clase 10 | Crear es elegir qué dejar fuera | Tus límites son tu estilo\nHoy hay tanto de todo que lo difícil no es encontrar ideas, sino decidir cuáles dejar fuera.\n\n## Demasiadas opciones paralizan\n\"Puedes hacer lo que quieras\" suena bonito, pero da miedo. Cuando hay posibilidades infinitas, no arrancas. La salida es ponerte **límites a propósito**.\n\n## Los límites te liberan\nParece al revés, pero funciona: graba un video solo con luz natural. Haz una semana de contenido usando un solo producto. Explica algo en 15 segundos. Toma fotos solo de tus manos. Cuando te pones una regla, tu cabeza se pone creativa para cumplirla.\n\nHay un ejemplo famoso de un autor de cuentos infantiles al que le apostaron que no podía escribir un libro con solo 50 palabras distintas. Lo escribió, y se volvió uno de los libros infantiles más vendidos de la historia.\n\n## No pongas pretextos\nNo esperes la cámara buena, el aro de luz nuevo o el estudio bonito. Haz cosas con el tiempo, el espacio y lo que tienes **hoy**.\n\n## Lo que no muestras también habla\nLo que hace interesante a una creadora no es solo lo que pone, sino lo que decide no poner. Tu estilo también se forma con tus \"no\": no uso filtros, no hablo de precios en público, no bailo, solo grabo con mis manos. Esas decisiones son tu cara propia.\n\n> La creatividad es lo que usas y también lo que decides no usar.\n\n## 🪞 Mírate al espejo\n¿Qué estás esperando tener para empezar algo que ya podrías hacer con lo que tienes?\n\n## ✍️ Ejercicio\n1. Escribe tus 3 reglas de contenido: tres cosas que vas a dejar fuera a propósito.\n2. Escribe un reto con límite para esta semana. Ejemplo: \"5 videos, solo con mi celular, en mi cocina, de menos de 20 segundos\".\n\n## ✅ Tu tarea de la semana\nHaz tu reto con límite y fíjate cómo te obliga a encontrar ideas nuevas.\n\n## 💬 Para compartir en el grupo\nComparte tus 3 reglas. Las de cada una son distintas, y eso es lo bonito.\n\n@@ 11 | Herramientas | Tu Cajón | Dónde guardar lo que te inspira\nTu Cajón es el lugar donde guardas todo lo que vale la pena llevarte. Puede ser de papel, digital o las dos cosas. Lo que importa es que lo uses.\n\n## Qué guardar\n- Videos con una transición, una apertura o un cierre que te gustó.\n- Frases de clientas: cómo describen su problema y por qué te compraron.\n- Fotos con una luz, un fondo o un color que te llamó la atención.\n- Publicaciones que te hicieron guardar, comentar o comprar.\n- Cosas de otros mundos: un anuncio en la calle, una vitrina, el menú de un café, una canción.\n\n## Cómo armarlo\n1. **Una carpeta de capturas** en tu celular con el nombre \"Cajón\".\n2. **Una nota o un tablero** donde pegas enlaces.\n3. **Una libreta de bolsillo** para lo que oyes y piensas en la calle.\n\nAl guardar algo, escribe en una línea **qué te gustó y por qué**. Sin eso, en un mes ya no vas a saber para qué lo guardaste.\n\n## Cómo usarlo\n- Cuando no sepas qué publicar, abre el Cajón y mezcla dos cosas que no tengan que ver.\n- Una vez a la semana, revisa lo que guardaste y borra lo que ya no te mueve.\n- Busca patrones: si guardas muchos videos de cierto tipo, a lo mejor ahí está tu estilo.\n\n> Si no te mueve algo, no entra al Cajón. Coleccionista, no acumuladora.\n\n@@ 12 | Herramientas | Tu cadena y tu bitácora | Crear todos los días sin depender de la inspiración\nDos hábitos chiquitos que juntos te sostienen: el calendario mira hacia adelante y la bitácora hacia atrás.\n\n## La cadena de X\n1. Consigue un calendario de todo el año, de pared o impreso.\n2. Elige tu X: la acción creativa diaria más pequeña que puedas sostener.\n3. Cada día que la hagas, tacha el día con una X grande.\n4. No rompas la cadena. Si se rompe, empieza una nueva al día siguiente, sin drama.\n\nIdeas de X para el equipo:\n- Una historia al día.\n- 10 minutos de guion a mano.\n- Una foto de producto.\n- Una conversación real con una clienta.\n- Guardar 3 cosas en tu Cajón.\n\n## La bitácora\nUna libreta chiquita o una nota en tu celular. Cada noche, en 2 minutos:\n- ¿Qué hice hoy? (qué grabé, qué publiqué, con quién hablé)\n- ¿Qué fue lo mejor de hoy?\n- ¿Qué me llevo para mañana?\n\n## Una vez a la semana\nLee tu bitácora de los últimos 7 días y pregúntate qué funcionó, qué no y qué quieres repetir.\n\n> La inspiración llega, pero te tiene que encontrar trabajando.\n\n@@ 13 | Herramientas | ¿Y ahora qué? | Nueve cosas para hacer después del curso\nTerminaste las clases. Esto es lo que sigue, en el orden que quieras.\n\n## Tu lista\n1. **Sal a caminar.** Sin audífonos, si puedes.\n2. **Abre tu Cajón** y guárdale algo hoy.\n3. **Ve a una biblioteca o librería** y piérdete un rato entre libros.\n4. **Compra una libreta y úsala.** De verdad úsala.\n5. **Consigue un calendario** y empieza tu cadena de X.\n6. **Empieza tu bitácora.**\n7. **Regala lo que aprendiste:** comparte este curso con alguien que lo necesite.\n8. **Empieza a compartir tu proceso** en tus redes.\n9. **Tómate una siesta.** Descansar también es parte del trabajo.\n\n## Recuerda\nNo todo consejo le queda a todas. Toma lo que te sirva y deja lo demás. Aquí no hay reglas, solo ideas para probar.\n\n> Mira, junta, mezcla, comparte. Y vuelve a empezar.\n";
var FAQ_MD="## Empezar | 0\n\n### ¿Este curso es solo para artistas?\nNo. Es para cualquiera que quiera poner más creatividad en su trabajo: tu contenido, tus fotos de producto, tu forma de vender y de explicar. Si creas algo, es para ti.\n\n### ¿Tengo que tomar las clases en orden?\nLa primera vez te conviene, porque la Clase 1 y la 2 son la base de todo lo demás. Después puedes saltar a la que necesites desde la lista.\n\n### ¿Dónde guardo mis respuestas?\nEn el cuaderno al final de cada clase. Se guarda solo en este celular y este navegador. Si cambias de teléfono o borras los datos del navegador, se pierde, así que copia lo importante a tu libreta.\n\n### No me siento creativa. ¿Sirve de algo?\nSí, justo para eso es. La creatividad no es un don con el que naces; es una forma de mirar, juntar y mezclar que se practica. Empieza por la Clase 1 y arma tu Cajón.\n\n## Copiar sin plagiar | 2\n\n### ¿Robar ideas no es lo mismo que copiar?\nNo. Copiar el video de alguien tal cual y presentarlo como tuyo es plagio, y no se vale. Robar como artista es estudiar por qué algo funciona, aprender de muchas personas a la vez y convertirlo en algo con tu voz. La Clase 2 lo explica a fondo.\n\n### ¿Cómo sé si me estoy pasando de copiar?\nPregúntate tres cosas: ¿aprendí de una sola persona o de muchas?, ¿cambié el pensamiento o solo la apariencia?, ¿le daría pena a la original verlo? Si aprendiste de varias, lo pasaste por tu historia y das crédito cuando toca, vas bien.\n\n### ¿Tengo que dar crédito?\nCuando tomas algo muy reconocible de alguien (un formato propio, una frase, una idea concreta), sí. Dar crédito no te hace menos: te hace parte de una comunidad. La Clase 8 habla de las cartas de fan públicas.\n\n### Todas venden lo mismo que yo. ¿Cómo me diferencio?\nPor lo que no te sale igual. Cuando intentas hacer lo que hace tu favorita y te sale distinto, ahí está tu sello: tu acento, tu humor, tu forma de explicar. Y por lo que decides dejar fuera, que es la Clase 10.\n\n## Ideas y contenido | 3\n\n### No sé de qué publicar.\nAbre tu Cajón y mezcla dos cosas que no tengan que ver. O hazte la pregunta de la Clase 3: ¿qué video te gustaría ver que nadie ha hecho como tú lo imaginas?\n\n### Se me ocurren ideas, pero en el celular me bloqueo.\nEs normal: la pantalla invita a corregir antes de terminar de pensar. Piensa primero en papel, con tu libreta o dibujando cuadros, y usa el celular solo para grabar y editar. Está en la Clase 4.\n\n### Tengo muchas ideas y no termino ninguna.\nTen dos o tres proyectos y salta entre ellos cuando uno te canse (Clase 5). Y ponte límites: menos opciones te ayuda a terminar (Clase 10).\n\n### No tengo buena cámara ni buena luz.\nNo la necesitas para empezar. Usa lo que tienes hoy y conviértelo en tu regla: solo luz natural, solo tu cocina, solo tus manos. Los límites te hacen más creativa.\n\n## Compartir | 6\n\n### Me da pena publicar porque casi nadie me ve.\nEso es una ventaja. Cuando pocas te ven, puedes experimentar sin presión. Aprovecha para probar formatos y encontrar tu voz antes de que llegue la atención.\n\n### Si enseño cómo hago las cosas, ¿no me van a quitar clientas?\nAl contrario. Cuando enseñas tu proceso, la gente confía más en ti y quiere comprarte a ti. Y si te preocupa, comparte solo un pedacito: tú decides cuánto.\n\n### Me dejaron un comentario feo. ¿Le contesto?\nNo le des tu energía. Si el comentario te molestó porque hay algo que explicar mejor, haz un video que lo explique bien. Y guarda los comentarios bonitos en tu carpeta de porras. Está en la Clase 8.\n\n## Hábitos | 9\n\n### No tengo tiempo para crear.\nElige una X tan pequeña que no tengas pretexto: una historia al día o 10 minutos de guion. Lo importante es la cadena, no el tamaño. La herramienta Tu cadena y tu bitácora te dice cómo.\n\n### Se me rompió la cadena. ¿Ya valió?\nNo. Empieza una nueva mañana, sin castigarte. La cadena sirve para ayudarte, no para que te sientas mal.\n\n### ¿Debo dejar mi trabajo para dedicarme a crear?\nNo lo dejes por un sueño que todavía no te paga. Un ingreso fijo te da tranquilidad y libertad para crear lo que quieres. Lo importante es apartar un tiempo fijo dentro de tu rutina.\n\n### ¿Cuánto voy a ganar si aplico el curso?\nNadie te lo puede garantizar. El curso te ayuda a tener más ideas, crear con constancia y compartir mejor; los resultados dependen de tu negocio, tu constancia y muchas cosas más.\n\n## La mentora | 0\n\n### ¿Qué es \"Tu mentora\"?\nEs Botín, la mentora de Sel dentro de Claude. Te da las clases una por una, te ayuda a armar tu Cajón y tu árbol de maestras, y convierte lo que te inspira en ideas de contenido con tu voz.\n\n### ¿Tengo que pagar Claude?\nNo. Funciona con la cuenta gratis de claude.ai. La cuenta gratis tiene un límite de mensajes por día.\n\n### ¿Cómo la instalo?\nDescarga la mentora (.zip) en la pestaña Tu mentora. En Claude entra a Customize → Skills, toca \"+\", luego \"Create skill\" → \"Upload a skill\" y sube el zip sin descomprimir.\n";

var ICONS=["🪞","✍️","✅","💬","🎯","📝","🧠","📌","🔥","⭐","📱","🎬","💡","🗓️","✨"];

function openLesson(id,trigger){

  $("#scroll",sh).scrollTop=0;

  g.addEventListener("pointermove",function(e){if(y0==null)return;dy=e.clientY-y0;sh.style.transform="translateY("+(dy<0?dy*.15:dy)+"px)";});
  function end(){if(y0==null)return;var v=dy/Math.max(1,performance.now()-t0);sh.classList.remove("drag");sh.style.transform="";y0=null;if(dy>140||v>.5)closeLesson();}
