<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:3px}
.wrap{max-width:var(--maxw,1040px);margin:0 auto;padding-inline:16px;padding-block:0 64px;display:flex;flex-direction:column;gap:var(--gap,28px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.press{transition:transform .16s cubic-bezier(.23,1,.32,1)}
.press:active{transform:scale(.97)}

/* tabs */
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:center;margin-inline:-16px;padding:10px 16px}
.tabbar::before{content:"";position:absolute;inset:0;background:var(--bg);opacity:.94;z-index:-1}
.tabs{display:flex;gap:4px;max-width:100%;overflow-x:auto;padding:4px;border-radius:var(--tabs-r,999px);background:var(--surface);border:1px solid var(--line)}
.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:15px;padding:10px 18px;border-radius:var(--tabs-r,999px);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* shared buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:15px;padding:12px 18px;border-radius:var(--btn-r,999px);cursor:pointer;text-decoration:none;transition:transform .16s cubic-bezier(.23,1,.32,1)}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.35;cursor:default}

/* section heads (faq + mentor) */
.sec-h{margin:0;font:var(--h2-font);letter-spacing:var(--h2-track,-.01em);text-wrap:balance}
.sec-p{margin:8px 0 0;color:var(--muted);max-width:56ch}

/* faq */
.faqv{display:flex;flex-direction:column;gap:16px;max-width:780px}
.f-search{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--field-r,999px);padding:0 18px}
.f-search svg{width:20px;height:20px;flex:none;color:var(--muted)}
.f-search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:17px/1.3 var(--body);padding:14px 0}
.f-search input:focus{outline:none}
.f-search:focus-within{border-color:var(--accent)}
.f-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.f-count{margin:0;color:var(--muted);font-size:14px}
.fgroup h3{margin:18px 0 8px;font:var(--h3-font)}
details.qa{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,16px);margin-bottom:8px}
details.qa summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 18px;font-weight:600;font-size:16.5px;line-height:1.35}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary i{flex:none;font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink);transition:transform .2s cubic-bezier(.23,1,.32,1)}
details.qa[open] summary i{transform:rotate(45deg);background:var(--accent);color:var(--accent-ink)}
.ans{padding:0 18px 18px}
.ans p{margin:0 0 .7em;max-width:64ch}.ans p:last-child{margin:0}
.ans ul,.ans ol{margin:0 0 .8em;padding-left:1.3em}
.ans .go{margin-top:10px}
mark{background:var(--mark,rgba(255,200,0,.35));color:inherit;border-radius:3px;padding:0 2px}

/* mentor */
.mentorv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 40px;align-items:start}
@media (max-width:780px){.mentorv{grid-template-columns:minmax(0,1fr)}}
.m-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.m-can{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.m-can li{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,16px);padding:14px 16px}
.m-can b{display:block;font-weight:700}
.m-can span{color:var(--muted);font-size:15px}
.m-dl{display:flex;flex-wrap:wrap;gap:10px}
.m-note{margin:0;color:var(--muted);font-size:14px}
.m-h{margin:0;font:var(--h3-font)}
.m-steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.m-steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:baseline}
.m-steps li::before{counter-increment:s;content:counter(s);font:var(--num-font,700 22px/1 var(--display));color:var(--accent-text,var(--accent))}
.m-prompts{display:grid;gap:8px}
.m-prompt{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,14px);padding:10px 12px 10px 16px}
.m-prompt q{quotes:none;min-width:0;font-size:15.5px}
.m-prompt .btn{padding:8px 14px;font-size:13.5px;flex:none}
.m-limits{display:flex;flex-wrap:wrap;gap:8px}
.m-limits span{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted)}
footer.foot{text-align:center;font-size:14px;color:var(--muted);padding-top:20px}

/* ---------- reader sheet (the lights come on) ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;transition:opacity .45s cubic-bezier(.32,.72,0,1)}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;top:calc(12px + env(safe-area-inset-top,0px));margin:0 auto;max-width:800px;background:var(--r-bg);color:var(--r-ink);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:0 -12px 50px rgba(0,0,0,.35);font-family:var(--r-body,var(--body))}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{flex:none;touch-action:none;cursor:grab;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 14px 10px 20px;border-bottom:1px solid var(--r-line);position:relative}
.grab::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--r-line)}
.grab .where{font-size:14px;font-weight:600;color:var(--r-muted);padding-top:8px}
.grab .x{border:1px solid var(--r-line);background:transparent;color:var(--r-ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;margin-top:6px}
.sheet :focus-visible{outline:2px solid var(--r-accent);outline-offset:3px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:clamp(22px,5vw,48px) clamp(18px,5vw,56px) calc(56px + env(safe-area-inset-bottom,0px))}
.r-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:end;margin-bottom:18px}
.r-head.nonum{grid-template-columns:minmax(0,1fr)}
.r-num{grid-row:span 2;font:var(--r-num-font,800 96px/.8 var(--display));color:var(--r-accent);font-variant-numeric:tabular-nums}
.r-k{margin:0;font-size:14.5px;font-weight:600;color:var(--r-accent)}
.r-title{margin:0;font:var(--r-title-font,700 clamp(32px,6.5vw,48px)/1 var(--display));letter-spacing:var(--r-title-track,-.01em);text-wrap:balance}
.r-topic{margin:0 0 18px;font-size:20px;line-height:1.35;color:var(--r-muted)}
.r-intro{font-size:20px;line-height:1.5;margin:0 0 26px;padding-bottom:24px;border-bottom:1px solid var(--r-line)}
.lesson-body p,.lesson-body li{max-width:66ch}
.lesson-body p{margin:0 0 .9em}
.lesson-body ul,.lesson-body ol{margin:0 0 1em;padding-left:1.3em}
.lesson-body li{margin:.4em 0}
.lesson-body li::marker{color:var(--r-accent);font-weight:700}
.lesson-body strong{font-weight:700}
.lesson-body h3{font:var(--r-h3-font,700 26px/1.15 var(--display));margin:36px 0 10px;text-wrap:balance}
.callout{margin:28px 0;padding:22px 24px;border-radius:var(--card-r,18px);background:var(--r-callout-bg);color:var(--r-callout-ink)}
.callout p{margin:0;font:var(--r-callout-font,700 clamp(22px,4.6vw,28px)/1.2 var(--display));max-width:34ch;text-wrap:balance}
.turn{margin-top:40px;padding-top:26px;border-top:2px solid var(--r-ink);display:grid;gap:12px}
.turn h3{margin:0;font:var(--r-h3-font,700 26px/1.15 var(--display))}
.task{background:var(--r-surface);border:1px solid var(--r-line);border-radius:var(--card-r,16px);padding:16px 18px}
.task h4{margin:0 0 6px;font-size:17px}
.task p:last-child,.task ul:last-child,.task ol:last-child{margin-bottom:0}
.nb-l{font-weight:600;font-size:14px;color:var(--r-muted);margin-top:6px}
.sheet textarea{width:100%;min-height:150px;resize:vertical;font:16px/1.55 var(--r-body,var(--body));color:var(--r-ink);background:var(--r-surface);border:1px solid var(--r-line);border-radius:12px;padding:14px 16px}
.saved{font-size:13px;color:var(--r-muted);min-height:1.2em}
.r-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:34px;padding-top:22px;border-top:1px solid var(--r-line)}
.r-foot .nav{display:flex;gap:8px;flex-wrap:wrap}
.sheet .btn{border-color:var(--r-line);color:var(--r-ink)}
.sheet .btn.solid{background:var(--r-ink);border-color:var(--r-ink);color:var(--r-bg)}
.sheet .btn.done{background:var(--r-accent);border-color:var(--r-accent);color:var(--r-accent-ink,var(--r-bg))}
.r-next{width:100%;margin:0;font-size:14px;color:var(--r-muted)}
body.sheet-open{overflow:hidden}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.mentorv .sec-h{font-size:clamp(28px,6.4vw,46px)}

/* Tu Palabra: a dictionary page. Cool paper, ink, and one highlighter stroke for the word you own. */
:root{
  --bg:#F2F3EE; --surface:#FBFBF8; --ink:#16181D; --muted:#585D69; --line:#D6D9CF; --accent:#16181D; --accent-ink:#F7F8F3;
  --hl:#E1F45A; --hl-ink:#16181D; --blue:#2C41AE; --focus:#2C41AE; --mark:#E9F88E; --accent-text:#2C41AE;
  --display:"Newsreader","Iowan Old Style",Georgia,serif; --body:"Schibsted Grotesk",system-ui,-apple-system,sans-serif;
  --h2-font:500 clamp(40px,8vw,60px)/1 var(--display); --h2-track:-.02em; --h3-font:italic 500 25px/1.15 var(--display); --num-font:italic 500 26px/1 var(--display);
  --r-bg:#FBFBF8; --r-surface:#FFFFFF; --r-ink:#16181D; --r-muted:#585D69; --r-line:#E0E2DA; --r-accent:#2C41AE; --r-accent-ink:#FFFFFF; --r-callout-bg:transparent; --r-callout-ink:var(--hl-ink);
  --r-num-font:italic 400 clamp(84px,19vw,132px)/.8 var(--display); --r-title-font:500 clamp(36px,7.4vw,56px)/1.02 var(--display); --r-title-track:-.02em; --r-h3-font:500 28px/1.15 var(--display); --r-callout-font:italic 500 clamp(24px,5vw,31px)/1.32 var(--display);
  --card-r:6px; --btn-r:6px; --field-r:6px; --tabs-r:0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111215; --surface:#1A1C21; --ink:#ECEDE6; --muted:#A3A7B1; --line:#2E3139; --accent:#ECEDE6; --accent-ink:#111215;
  --hl:#D6EE3E; --hl-ink:#111215; --blue:#A3B0FF; --focus:#A3B0FF; --mark:#56621C; --accent-text:#A3B0FF;
  --r-bg:#16171B; --r-surface:#1E2026; --r-ink:#ECEDE6; --r-muted:#A3A7B1; --r-line:#2E3139; --r-accent:#A3B0FF; --r-accent-ink:#111215;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111215; --surface:#1A1C21; --ink:#ECEDE6; --muted:#A3A7B1; --line:#2E3139; --accent:#ECEDE6; --accent-ink:#111215;
  --hl:#D6EE3E; --hl-ink:#111215; --blue:#A3B0FF; --focus:#A3B0FF; --mark:#56621C; --accent-text:#A3B0FF;
  --r-bg:#16171B; --r-surface:#1E2026; --r-ink:#ECEDE6; --r-muted:#A3A7B1; --r-line:#2E3139; --r-accent:#A3B0FF; --r-accent-ink:#111215;
}
html,body{background:var(--bg)}
mark{color:var(--ink)}

/* tabs: dictionary section tabs, underline not pills */
.tabbar{justify-content:flex-start}
.tabs{gap:22px;padding:0;border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:0;width:100%}
.tab{padding:12px 0 10px;border-radius:0;font-size:15.5px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{background:transparent;color:var(--ink);border-bottom-color:var(--ink)}
.chip{border-radius:6px}

/* highlighter */
.hl{color:var(--hl-ink);background-image:linear-gradient(var(--hl),var(--hl));background-repeat:no-repeat;background-size:100% 78%;background-position:0 62%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .12em}
@media (prefers-reduced-motion:no-preference){
  .hl.swipe{background-size:0% 78%;animation:swipe .9s cubic-bezier(.65,0,.35,1) .45s forwards}
  @keyframes swipe{to{background-size:100% 78%}}
}

/* hero: the dictionary entry */
.p-hero{display:grid;gap:22px;padding-block:44px 8px;max-width:780px}
.p-src{margin:0;font-size:15px;color:var(--muted)}
.p-word{margin:0;font:500 clamp(64px,17vw,132px)/.86 var(--display);letter-spacing:-.035em}
.p-pron{margin:0;font:400 clamp(19px,3.6vw,23px)/1.3 var(--display);color:var(--muted)}
.p-pron i{font-style:italic;margin-left:.4em}
.p-defs{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:d}
.p-defs li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px;font:400 clamp(21px,4.2vw,27px)/1.32 var(--display)}
.p-defs li::before{counter-increment:d;content:counter(d) ".";font:600 16px/1.9 var(--body);color:var(--accent-text)}
.p-defs li em{font-style:italic}
.p-idx{display:grid;gap:10px}
.p-thumbs{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;max-width:560px}
.p-thumb{height:46px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px 4px 0 0;border-bottom-width:3px;font:500 17px/1 var(--display);cursor:pointer;padding:0;transition:transform .16s cubic-bezier(.23,1,.32,1),background .2s}
.p-thumb:active{transform:scale(.94)}
.p-thumb.seen{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.p-thumb.next{background:var(--hl);border-color:var(--ink);color:var(--hl-ink);font-weight:600}
.p-now{margin:0;font-size:15px;color:var(--muted)}
.p-now b{color:var(--ink)}
.p-cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.p-cta .btn{padding:14px 22px;font-size:16px}

/* índice */
.p-route{display:grid;gap:24px}
.p-welcome{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:baseline;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r);padding:18px 20px;cursor:pointer;width:100%}
.p-welcome b{font:500 26px/1.1 var(--display)}
.p-welcome small{grid-column:1;color:var(--muted);font-size:15px}
.p-welcome span.st{grid-row:1 / span 2;grid-column:2;align-self:center;font-size:14px;font-weight:600;color:var(--accent-text);white-space:nowrap}
.p-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px;border-top:1px solid var(--line)}
@media (max-width:760px){.p-list{grid-template-columns:minmax(0,1fr)}}
.p-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:0 12px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 0 15px;cursor:pointer;color:var(--ink)}
.p-row .n{font:italic 400 30px/1 var(--display);color:var(--muted);padding-top:2px}
.p-row b{font:500 24px/1.15 var(--display);letter-spacing:-.01em}
.p-row .law{display:block;margin-top:4px;font:italic 400 16px/1.3 var(--display);color:var(--accent-text)}
.p-row small{display:block;color:var(--muted);font-size:15px;line-height:1.4;margin-top:2px}
.p-row .st{font-size:13px;font-weight:600;white-space:nowrap;padding-top:6px;color:var(--muted)}
.p-row.seen .n{color:var(--ink)}
.p-row.next .st{color:var(--ink)}
@media (hover:hover){.p-row:hover b{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}}
.p-h{margin:14px 0 0;font:italic 500 28px/1 var(--display)}
.p-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.p-tool{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r);padding:16px 18px;cursor:pointer;color:var(--ink)}
.p-tool b{display:block;font:500 22px/1.15 var(--display)}
.p-tool small{color:var(--muted);font-size:15px}

/* reader */
.callout{padding:0;margin:30px 0}
.callout p{display:inline;color:var(--hl-ink);background:var(--hl);padding:.06em .2em;-webkit-box-decoration-break:clone;box-decoration-break:clone;max-width:none}
.turn{border-top-width:1px}
.lesson-body em{font-style:italic}
#rTitle:focus{outline:none}
.sheet .btn.done{color:var(--r-accent-ink)}

</style>
</head>
<body>
<div id="root"></div>
<script>
var LESSONS_MD="@@ 0 | Empieza aquí | Bienvenida | Cómo aprovechar este curso\nEste curso toma 22 leyes clásicas del marketing y las baja a tu negocio: tú, tus clientas, tu equipo y tu celular. Son 10 clases cortas y tres herramientas.\n\n## La idea que une todo\nEl marketing no pasa en tu catálogo ni en tu vitrina. Pasa en la cabeza de tu clienta. Ahí hay muy poco espacio, y cada marca (y cada persona que vende) pelea por un lugarcito. Las 22 leyes explican cómo funciona ese espacio y qué pasa cuando lo ignoras.\n\n> Gana la que ocupa una palabra en la mente de su clienta, no la que hace más ruido.\n\n## Lo que vas a construir\n- Tu **categoría**: el terreno donde sí puedes ser la primera.\n- Tu **palabra**: la idea que la gente asocia contigo y con nadie más.\n- Tu **escalón**: dónde estás hoy en la cabeza de tu clienta, sin cuentos.\n- Tu **sacrificio**: lo que dejas de comunicar para que lo demás se escuche.\n- Tu **frase sincera**: algo honesto que abre la puerta.\n- Tu **ficha de posicionamiento**: todo lo anterior en una sola página.\n\n## Cómo aprovecharlo\n1. **Una clase por semana.** Cada una se lee en unos 6 minutos.\n2. **Haz el ejercicio en el cuaderno** que viene al final de cada clase.\n3. **Haz la tarea esa semana.** Una ley que aplicas vale más que diez que te sabes.\n4. **Comparte en el grupo del equipo.** Lo que otra ve de ti desde afuera es justo lo que este curso necesita.\n\n## Antes de empezar\nMuchas de estas leyes van contra lo que parece lógico: venderle de todo a todas, cambiar de estrategia cada mes, decir que eres la mejor. Te van a incomodar un poco. Es buena señal.\n\n## 🪞 Mírate al espejo\nSi le preguntas a cinco clientas \"¿qué te viene a la mente cuando piensas en mí?\", ¿qué crees que contestarían?\n\n## ✍️ Ejercicio\n1. Escribe cómo crees que contestarían hoy.\n2. Escribe cómo te gustaría que contestaran dentro de 90 días.\n\n## ✅ Tu tarea de la semana\nHazle esa pregunta de verdad a tres personas: clientas, amigas o alguien del equipo. Anota sus palabras exactas, sin corregirlas.\n\n## 💬 Para compartir en el grupo\nComparte la respuesta que más te sorprendió.\n\n@@ 1 | Clase 1 | Llega primero a su mente | Leyes 1 y 3: ser la primera le gana a ser la mejor\nCasi todas creemos que gana el mejor producto. No es así: gana el que llega primero a la cabeza de la gente.\n\n## Haz la prueba\n¿Quién fue la primera persona en pisar la Luna? Seguro lo sabes. ¿Y la segunda? Casi nadie lo sabe, y llegó en el mismo viaje. Con las marcas pasa igual: la primera que entra a la mente en una categoría suele quedarse arriba muchos años. A veces su nombre hasta se vuelve la palabra común: pides \"un Kleenex\" aunque la caja diga otra marca.\n\n## La mente le gana al mostrador\nOjo: no se trata de quién sacó algo primero. Muchos inventores que llegaron antes que nadie hoy están olvidados. Lo que cuenta es quién entró primero **a la mente**. Una idea que nadie conoce no ocupa ningún lugar.\n\n## Las mentes no se cambian, se ocupan\nCuando alguien ya decidió quién es \"su\" persona para algo, casi nunca cambia de opinión. Tratar de convencerla de que tú eres mejor que la que ya le vende es pelear cuesta arriba. Es mucho más fácil llegar a una mente que todavía tiene ese lugar vacío.\n\nPor eso tampoco se entra despacito. A la mente se entra con algo claro y fácil de recordar. Un nombre simple ayuda muchísimo: \"Ana, la de las rutinas\" se queda; un usuario con números y guiones bajos, no.\n\n## En venta directa\nHay muchas personas vendiendo los mismos productos que tú. Si tu mensaje es \"yo también vendo esto\", llegas en el lugar quince. La pregunta útil no es \"¿cómo convenzo de que soy mejor?\" sino \"¿en qué puedo ser la primera?\". De eso trata la siguiente clase.\n\n> No compitas por ser la mejor. Busca dónde puedes ser la primera.\n\n## 🪞 Mírate al espejo\n¿En qué tema eres hoy la primera persona en la que piensa tu gente?\n\n## ✍️ Ejercicio\n1. Escribe cinco necesidades de tus clientas: maquillaje para un evento, una rutina para la cara, un regalo, un perfume, aprender a maquillarse.\n2. Al lado de cada una, escribe con honestidad a quién piensan primero (una marca, una tienda o una persona).\n3. Marca dónde apareces tú y dónde el lugar sigue vacío.\n\n## ✅ Tu tarea de la semana\nRevisa tu nombre de usuario y tu bio. Si no se recuerdan en tres segundos, simplifícalos.\n\n## 💬 Para compartir en el grupo\n¿En qué tema eres la primera para tu gente? Si todavía en ninguno, dilo también.\n\n@@ 2 | Clase 2 | Inventa tu categoría | Leyes 2 y 10: si no eres la primera, crea dónde serlo\nSi no puedes ser la primera en una categoría, crea una nueva en la que sí lo seas.\n\n## Cambia la pregunta\nLa tercera persona que cruzó el océano sola en avión no se recuerda como \"la tercera\". Se recuerda como la primera mujer en hacerlo. Mismo viaje, otra categoría, y de repente es la primera. Así nacieron muchas marcas fuertes: no fueron la primera cerveza importada, fueron la primera cerveza cara hecha en casa.\n\nCuando lances algo, no te preguntes \"¿en qué soy mejor?\". Pregúntate **\"¿la primera en qué?\"**.\n\n## Habla de la categoría, no de ti\nCuando alguien dice \"mi marca es mejor\", la gente se pone a la defensiva. Cuando alguien cuenta algo nuevo, la gente escucha. Si eres la primera en una categoría, promueve la categoría: explica por qué alguien necesitaría eso. Todavía no tienes competencia; tu trabajo es que la idea exista.\n\n## Las categorías se dividen\nCon el tiempo, toda categoría se parte en pedacitos. Las computadoras se volvieron de escritorio, portátiles, tabletas. El maquillaje hoy es de diario, de novia, para piel madura, para principiantes, en cinco minutos. Cada pedazo tiene su propio líder, y casi nunca es el líder de la categoría grande.\n\nCada división es una puerta nueva para ser la primera. No intentes ser de todo; elige tu rama.\n\n## Ejemplos para el equipo\n- En vez de \"vendo maquillaje\": \"maquillaje de cinco minutos para mamás que salen corriendo\".\n- En vez de \"vendo skincare\": \"rutinas sencillas para piel de más de 40\".\n- En vez de \"busco socias\": \"el equipo para mujeres que empiezan desde cero y con poco tiempo\".\n\nTiene que ser verdad y algo que puedas sostener. Una categoría inventada que no cumples es peor que ninguna.\n\n## Paciencia\nLlegar primero sirve si aguantas a que la categoría crezca. Las primeras semanas casi nadie entiende lo que haces. Eso es normal.\n\n> La pregunta no es \"¿en qué soy mejor?\", sino \"¿en qué soy la primera?\".\n\n## 🪞 Mírate al espejo\n¿En qué categoría compites hoy contra cientos de personas que dicen lo mismo?\n\n## ✍️ Ejercicio\n1. Escribe tu categoría general (por ejemplo, maquillaje).\n2. Divídela en cinco pedazos: por tipo de persona, por momento, por problema, por estilo o por edad.\n3. Elige uno donde en tu círculo no haya una referente clara.\n4. Completa: \"Soy la primera en ___ para ___.\"\n\n## ✅ Tu tarea de la semana\nPublica una pieza que hable de la categoría (por qué alguien necesitaría eso) sin vender ningún producto.\n\n## 💬 Para compartir en el grupo\nComparte tu \"soy la primera en…\" y pide que te digan si se entiende.\n\n@@ 3 | Clase 3 | Todo es percepción | Ley 4: lo que la gente cree es lo que cuenta\nEl marketing no es una pelea de productos. Es una pelea de percepciones.\n\n## No existe \"el mejor producto\"\nLo que existe es lo que la gente cree. Una misma marca de autos se vende como coche serio en un país y como \"la de las motos\" en otro. Los coches son idénticos; lo que cambia es lo que hay en la cabeza de cada mercado.\n\nHubo un refresco que ganó cientos de miles de pruebas de sabor y aun así fracasó, mientras el de siempre siguió arriba. La gente saborea lo que espera saborear.\n\n## \"Todo el mundo sabe\"\nLa mayoría decide con percepciones de segunda mano: lo que dicen las demás, lo que se comenta en el grupo de la escuela, lo que leyó en una reseña. Por eso una recomendación de una clienta pesa más que tu mejor explicación.\n\n## Lo que esto significa para ti\n- Explicar ingredientes y especificaciones convence menos de lo que crees.\n- Lo que la gente percibe de ti se construye con detalles: cómo respondes, cómo entregas, cómo te ves en tus historias, qué dicen otras de ti.\n- Si ya hay una percepción instalada, no la vas a borrar a puros datos. Trabaja con ella, no contra ella.\n\n## Cuida lo que sí controlas\nCada entrega a tiempo, cada mensaje contestado, cada queja bien atendida y cada publicación es un votito en la mente de alguien. La percepción no se decide en un anuncio; se va acumulando.\n\n> Para quien te compra, la percepción es la realidad.\n\n## 🪞 Mírate al espejo\n¿Qué cree la gente de la venta directa? ¿Y qué cree de ti en particular?\n\n## ✍️ Ejercicio\n1. Haz dos columnas: **Lo que yo sé que es verdad de mi negocio** y **Lo que la gente probablemente percibe**.\n2. Marca dónde está la diferencia más grande.\n3. Elige una percepción buena que vas a reforzar y una mala que vas a dejar de alimentar.\n\n## ✅ Tu tarea de la semana\nPídele a dos clientas contentas que te cuenten, en audio o en texto, qué cambió con tu atención o con su rutina. Con su permiso, compártelo.\n\n## 💬 Para compartir en el grupo\n¿Qué idea sobre la venta directa te gustaría cambiar con tu ejemplo?\n\n@@ 4 | Clase 4 | Tu palabra | Leyes 5 y 6: una palabra en la mente, y que sea solo tuya\nLo más poderoso que puedes tener en marketing es una palabra en la mente de tu clienta. Y dos no pueden tener la misma.\n\n## Una palabra, no cinco\nLas marcas que más pesan son dueñas de una sola palabra. Piensas en un auto **seguro** y te viene una marca. Piensas en un paquete que llegue **mañana** y te viene otra. Son palabras sencillas, de diccionario, y casi siempre hablan de un beneficio.\n\nAdemás, tener una palabra trae otras de regalo. Si eres \"la que te enseña con paciencia\", la gente también supone que eres confiable, que sabes y que no te vas a desaparecer.\n\n## La palabra tiene que estar libre\nSi alguien ya es dueña de una palabra, pelearla es inútil. Peor: cada vez que la usas le recuerdas a la gente quién la tiene. Una cadena de hamburguesas quiso ser \"la rápida\" cuando la rápida ya era otra, y le fue fatal.\n\n## \"Calidad\" no es una palabra\nNadie se anuncia como \"la que no tiene calidad\", así que todas dicen calidad y nadie se queda con ella. Lo mismo pasa con \"confianza\", \"excelente servicio\" o \"los mejores precios\". Tu palabra necesita tener un contrario que alguien podría defender.\n\n## Ejemplos para el equipo\n- **Paciencia:** la que te enseña sin prisa a maquillarte.\n- **Seguimiento:** la que te escribe para ver cómo te fue.\n- **Natural:** looks que no se notan.\n- **Regalos:** la que te salva cuando no sabes qué regalar.\n- **Empezar:** la líder para las que nunca han vendido.\n\n## Una vez que la tienes, cuídala\nCada publicación, historia y respuesta debería empujar tu palabra. Las marcas se pierden cuando sueltan la suya para perseguir la de otra.\n\n> No puedes representar algo si persigues todo.\n\n## 🪞 Mírate al espejo\nSi tu clienta tuviera que describirte con una sola palabra, ¿cuál usaría hoy?\n\n## ✍️ Ejercicio\n1. Escribe diez palabras candidatas.\n2. Tacha las que ya son de alguien en tu círculo y las que usa todo el mundo.\n3. Tacha las que no podrías sostener todos los días.\n4. Quédate con una y completa: \"Cuando piensen en ___, quiero que piensen en mí.\"\n\n## ✅ Tu tarea de la semana\nRevisa tus últimas nueve publicaciones. ¿Cuántas empujan tu palabra? Planea las siguientes tres para que sí lo hagan.\n\n## 💬 Para compartir en el grupo\nComparte tu palabra y pregunta si les suena a ti.\n\n@@ 5 | Clase 5 | Tu escalón | Leyes 7 y 8: dónde estás y por qué casi todo termina en dos\nTu estrategia depende del escalón que ocupas en la cabeza de tu clienta. Y con el tiempo, casi toda categoría se vuelve una carrera de dos.\n\n## Cada categoría es una escalera\nEn la mente, cada categoría es una escalera con pocos escalones; casi nadie recuerda más de siete nombres. Hubo una arrendadora de autos que perdió dinero años diciendo que era la mejor. Cuando por fin admitió \"somos la número dos, por eso nos esforzamos más\", empezó a ganar. Años después cambió a \"vamos a ser la número uno\" y la gente no se lo creyó.\n\nLa mente solo acepta lo que cuadra con su escalera. Lo demás lo ignora.\n\n## Di dónde estás\nSi estás empezando, no te presentes como \"la número uno en ventas\": nadie te lo va a creer. Algo como \"soy nueva, por eso te atiendo yo misma y te doy seguimiento\" sí cuadra, y abre la puerta.\n\n## Estanque grande o estanque chico\nA veces conviene más ser la tercera en una escalera grande que la primera en una diminuta. Un refresco de limón se volvió enorme cuando dejó de pelear en la escalera chica de los refrescos de limón y se presentó como la alternativa en la escalera gigante de los refrescos de cola.\n\n## Al final quedan dos\nCon el tiempo, cada mercado se vuelve una pelea de dos: la marca de siempre y su alternativa. El tercer lugar es incómodo. En tu círculo pasa igual: cuando alguien necesita algo, casi siempre recuerda dos nombres. Conviene ser uno de esos dos o subirte a otra escalera.\n\n## Escaleras, no pleitos\nEsto no es para pelearte con tus compañeras. Si alguien del equipo ya es \"la de skincare\" en un grupo de mamás, busca otra escalera y recomiéndense entre ustedes. Un equipo que se reparte las palabras crece junto.\n\n> Acepta dónde estás. Desde ahí se sube.\n\n## 🪞 Mírate al espejo\nCuando alguien de tu círculo necesita maquillaje, ¿quiénes son las dos primeras en su lista? ¿Estás tú?\n\n## ✍️ Ejercicio\n1. Dibuja la escalera de tu categoría con cinco escalones.\n2. Pon un nombre en cada escalón: una marca, una tienda o una persona.\n3. Marca dónde estás tú.\n4. Escribe qué podría decir alguien en tu escalón para que le crean.\n\n## ✅ Tu tarea de la semana\nEscribe y usa una frase honesta que te ubique en tu escalón. Por ejemplo: \"No soy la que más vende; soy la que más te acompaña.\"\n\n## 💬 Para compartir en el grupo\n¿En qué escalera estás y en qué escalón?\n\n@@ 6 | Clase 6 | Lo opuesto | Leyes 9 y 14: sé la alternativa, no la copia\nSi no eres la líder, no la imites. Conviértete en su alternativa.\n\n## La fuerza de la líder es tu puerta\nDonde la líder es fuerte, hay una debilidad escondida. Si la marca de siempre es \"la tradicional\", hay espacio para \"la de la nueva generación\". Así creció un refresco que llevaba años detrás del gigante.\n\nEn casi toda categoría hay dos tipos de clientas: las que quieren comprarle a la líder y las que no. La alternativa se queda con las segundas.\n\n## No intentes ser mejor, intenta ser diferente\nCuando una marca de enjuague bucal copió el ángulo científico de la líder, se hundió. Otra se presentó como lo contrario, \"el de buen sabor\", y se quedó con el segundo lugar. Copiar te pone a pelear el mismo lugar con alguien que llegó antes.\n\n## Por cada atributo, hay uno contrario\nSi alguien es dueña de \"grande\", queda espacio para \"pequeño\". Si alguien tiene a \"los niños\", queda espacio para \"los grandes\". Y nunca te rías de un atributo nuevo: las navajas desechables parecían una broma y terminaron siendo la mayoría del mercado.\n\n## Aplicado a ti, sin atacar a nadie\nAquí va una regla del equipo: lo opuesto se construye diciendo lo que **tú** ofreces, no lo que la otra hace mal. No se habla mal de otras marcas ni de compañeras.\n\n- Si en tu zona todas hacen transmisiones de una hora con treinta productos, tú: un producto, un minuto.\n- Si todas publican looks de noche, tú: looks de diario para la oficina.\n- Si la referente de tu círculo es la del glamour, tú la de lo práctico.\n\n> La palabra clave es opuesto. Parecido no sirve.\n\n## 🪞 Mírate al espejo\n¿A quién estás imitando sin darte cuenta?\n\n## ✍️ Ejercicio\n1. Escribe quién es la referente de tu categoría en tu círculo y cuál es su atributo fuerte.\n2. Escribe el atributo contrario.\n3. Describe a una clienta real que preferiría ese contrario.\n4. Escribe tu propuesta en una frase, sin mencionar a nadie.\n\n## ✅ Tu tarea de la semana\nHaz una publicación que muestre tu atributo contrario.\n\n## 💬 Para compartir en el grupo\nComparte tu atributo contrario y la clienta que lo prefiere.\n\n@@ 7 | Clase 7 | Menos es más | Leyes 12 y 13: no estires tu nombre, renuncia a algo\nLa ley que más se rompe es querer poner tu nombre en todo. Para ganar algo, tienes que renunciar a algo.\n\n## La tentación de estirar\nCuando algo funciona, dan ganas de ponerle el mismo nombre a todo. Una salsa famosa para carne sacó su versión para pollo, gastó millones y fracasó: en la mente de la gente ese nombre ya significaba \"salsa para carne\". Un refresco que agregó sabores y versiones terminó con menos de la mitad del mercado que tenía. Casi siempre, la líder de una categoría es la marca que no se estiró.\n\n## Lo que vale para las marcas vale para ti\n\"Vendo maquillaje, skincare, perfumes, suplementos, ropa, velas, y también hago uñas.\" La mente no sabe dónde guardarte. Puedes **vender** muchas cosas, pero **comunicas** una.\n\n## Los tres sacrificios\n1. **Lo que muestras.** No todo va en tu vitrina. Elige qué comunicas.\n2. **A quién le hablas.** No le hables a todas. Lo curioso es que a quien le hablas no es todo tu mercado: una bebida que le hablaba a \"la nueva generación\" la tomaban también personas de cincuenta que se sienten de treinta. Si le hablas a mamás que trabajan, también te van a comprar otras.\n3. **El cambio constante.** No cambies de estrategia cada mes. Una posición se construye repitiendo.\n\n## Especialista le gana a generalista\nLas tiendas que vendían de todo pasaron años difíciles mientras crecían las especialistas: solo juguetes, solo tenis, solo ropa de oficina. Cuando eres especialista, la gente sabe exactamente para qué buscarte.\n\n> Renunciar no es perder clientas. Es que por fin te encuentren.\n\n## 🪞 Mírate al espejo\n¿Qué te da miedo dejar de comunicar?\n\n## ✍️ Ejercicio\n1. Haz la lista de todo lo que ofreces.\n2. Encierra una sola cosa que vas a comunicar durante 90 días.\n3. Describe a una sola persona a la que le vas a hablar.\n4. Escribe qué no vas a cambiar en esos 90 días.\n\n## ✅ Tu tarea de la semana\nLimpia tu bio y tus historias destacadas para que cuenten solo tu oferta principal.\n\n## 💬 Para compartir en el grupo\n¿A qué estás renunciando esta temporada?\n\n@@ 8 | Clase 8 | Sinceridad y una sola jugada | Leyes 15 y 16: lo honesto abre la puerta\nAdmitir algo negativo hace que la gente te crea lo positivo. Y en cada momento, solo una jugada mueve las cosas de verdad.\n\n## La sinceridad desarma\nLo negativo que dices de ti se cree al instante. Lo positivo, la gente lo pone en duda. Por eso funcionan frases como \"el sabor que odias dos veces al día\" de un enjuague bucal, o una mermelada que se burla de su propio nombre raro. Al admitir algo obvio, la gente piensa \"es honesta\" y se abre a escuchar lo demás.\n\n## Cómo usarla bien\n1. **Lo negativo tiene que ser obvio.** Tu clienta debe pensar \"sí, es cierto\". Si no lo ve, solo la confundes.\n2. **Pasa rápido a lo positivo.** No es disculparte; es abrir la puerta al beneficio.\n\nEjemplos:\n- \"No soy maquillista profesional. Por eso te enseño lo que yo misma hago en cinco minutos.\"\n- \"Sí, soy de las que te escriben para ver cómo te fue.\"\n- \"Esta rutina no es la más barata. Es la que sí vas a terminar.\"\n\nNunca la uses para prometer resultados de salud o de piel que no puedes asegurar.\n\n## Una sola jugada\nEl éxito no es la suma de cien esfuercitos. En cada situación hay una jugada audaz que da resultados de verdad, casi siempre la que nadie espera. Encontrar una ya es difícil; encontrar varias, casi imposible. Por eso conviene poner ahí casi toda tu energía.\n\n## Se encuentra en el terreno\nEsa jugada no sale de una lluvia de frases bonitas. Sale de estar cerca de tus clientas: conversaciones, preguntas que se repiten, lo que te dicen al entregar. Esforzarte más en todo lo de siempre no cambia nada.\n\n> Esforzarte más no es la estrategia. Elegir bien la jugada, sí.\n\n## 🪞 Mírate al espejo\n¿Estás haciendo diez cosas a medias o una a fondo?\n\n## ✍️ Ejercicio\n1. Escribe una verdad incómoda de tu negocio que tu clienta ya sabe.\n2. Conviértela en una frase sincera que pase rápido a un beneficio.\n3. Haz la lista de todo lo que estás haciendo este mes para vender.\n4. Elige una sola jugada donde vas a poner la mayor parte de tu energía.\n\n## ✅ Tu tarea de la semana\nUsa tu frase sincera en una historia o en una conversación de venta.\n\n## 💬 Para compartir en el grupo\nComparte tu frase sincera para que el equipo te diga si suena natural.\n\n@@ 9 | Clase 9 | Juega a largo plazo | Leyes 11, 17, 20 y 21: tendencias, no ruido\nLo que funciona esta semana puede hundirte en seis meses. Nadie ve el futuro, el ruido engaña y lo que vale la pena son las tendencias, no las modas.\n\n## Corto plazo contra largo plazo\nUna promoción sube las ventas hoy, pero enseña a tus clientas a esperar la siguiente promoción. Hay tiendas que de tanto rematar quebraron, y marcas que ya no pueden dejar de dar cupones porque, en cuanto paran, las ventas se caen. Si siempre vendes con descuento, tus clientas aprenden a comprar solo con descuento. Usa las promociones con intención, no como costumbre.\n\n## Nadie predice el futuro\nLos planes que dependen de adivinar el futuro casi siempre fallan, porque nadie sabe qué van a hacer los demás. Lo que sí funciona: encontrar tu ángulo hoy (tu palabra) y mantener una **dirección** a largo plazo, aunque no tengas un plan a diez años. Y ser flexible para ajustar cuando algo cambie.\n\n## Desconfía del ruido\nLo que sale en todos lados no siempre es lo que gana. Muchas \"revoluciones\" anunciadas con bombo nunca llegaron, y las de verdad empezaron en silencio. Para ti: no te subas a cada app nueva o a cada formato \"que lo cambia todo\". Mira las señales chiquitas: lo que tus clientas te piden una y otra vez.\n\n## Tendencia, no moda\nUna moda es una ola: se ve mucho, sube y baja rápido. Una tendencia es la marea: casi no se nota, pero mueve todo. Un juguete que se puso en mil productos se acabó en dos años; una muñeca que no se sobreexplotó lleva generaciones. Las artistas que más duran no están en todos lados.\n\nPara ti: no satures a tu audiencia con publicaciones de venta. Que se queden con ganas.\n\n> Las olas se ven mucho. La marea es la que mueve.\n\n## 🪞 Mírate al espejo\n¿Qué haces hoy que te da ventas esta semana pero te puede costar clientas en seis meses?\n\n## ✍️ Ejercicio\n1. Haz la lista de lo que hiciste el mes pasado para vender.\n2. Marca cada cosa: ¿corto plazo, largo plazo o las dos?\n3. Escribe una tendencia (no una moda) que ves en lo que piden tus clientas.\n4. Decide cómo te vas a subir a esa tendencia este trimestre.\n\n## ✅ Tu tarea de la semana\nPrueba una semana sin descuentos: vende con valor (una historia, un tutorial, un seguimiento).\n\n## 💬 Para compartir en el grupo\n¿Qué tendencia ves en lo que piden tus clientas?\n\n@@ 10 | Clase 10 | Ego, errores y recursos | Leyes 18, 19 y 22: lo que nadie te dice del éxito\nEl éxito marea, el error a tiempo enseña y una buena idea sin recursos no despega.\n\n## El éxito marea\nCuando algo sale bien, es fácil creer que todo lo que tocas funciona. Ahí empiezan los problemas: le pones tu nombre a todo, dejas de escuchar y decides por ti en lugar de por tu clienta. Las mejores vendedoras piensan como su clienta, no como su ego. Mantente cerca: atiende tú misma, pregunta, y pide también las malas noticias.\n\n## Acepta el error a tiempo\nMuchas empresas prefieren \"reorganizarse\" antes que admitir que algo no funcionó. Sale más barato reconocerlo pronto y cortar las pérdidas. Una cadena enorme de tiendas tenía una regla sencilla: si pruebas algo y aprendes, se te reconoce; lo único que no se perdona es cometer el mismo error dos veces.\n\nEn equipo ayuda mucho cambiar el \"me equivoqué\" por el \"nos equivocamos\". Así nadie esconde lo que no salió.\n\n## Las ideas necesitan recursos\nLa mejor idea del mundo no llega lejos sin recursos para meterla en la mente de la gente. En tu negocio, los recursos no son solo dinero: también son tiempo, constancia, muestras, contenido y ayuda. Reinvierte una parte de lo que ganas en tu negocio, con números claros, y sin endeudarte.\n\n## Para las líderes\nCelebra los experimentos, no solo los resultados. Comparte tus errores para que otras no los repitan. Un equipo donde se vale fallar prueba más cosas, y encuentra antes la jugada que sí funciona.\n\n> Equivocarse una vez es aprender. Equivocarse igual dos veces es no escuchar.\n\n## 🪞 Mírate al espejo\n¿Qué estás sosteniendo por orgullo aunque ya sabes que no funciona?\n\n## ✍️ Ejercicio\n1. Escribe algo que ya no funciona y sigues haciendo.\n2. ¿Qué te costaría soltarlo?\n3. ¿Qué recursos (tiempo, dinero, ayuda) necesita tu palabra para llegar a tus clientas? Haz números realistas.\n\n## ✅ Tu tarea de la semana\nSuelta una cosa que no funciona y pídele a una clienta una crítica honesta. Después, llena tu **ficha de posicionamiento** en Herramientas.\n\n## 💬 Para compartir en el grupo\nComparte un error que ya no vas a repetir.\n\n@@ 11 | Herramientas | Las 22 leyes en una línea | Tu acordeón\nLas 22 leyes resumidas en palabras de todos los días, con la clase donde se explican.\n\n## Llegar y ocupar\n1. **Primero gana.** Ser la primera le gana a ser la mejor. *Clase 1*\n2. **Inventa tu categoría.** Si no eres la primera, crea dónde serlo. *Clase 2*\n3. **La mente antes que el mostrador.** Cuenta quién entra primero a la cabeza, no a la tienda. *Clase 1*\n4. **Todo es percepción.** Lo que la gente cree es lo que cuenta. *Clase 3*\n5. **Una palabra.** Lo más poderoso es ser dueña de una palabra. *Clase 4*\n6. **Nadie comparte palabra.** Si ya es de otra, búscate otra. *Clase 4*\n\n## Saber dónde estás\n7. **La escalera.** Tu estrategia depende de tu escalón. *Clase 5*\n8. **Al final son dos.** Casi todo termina en una carrera de dos. *Clase 5*\n9. **Lo opuesto.** Si no eres la líder, sé su alternativa. *Clase 6*\n10. **Todo se divide.** Las categorías se parten y cada pedazo tiene su líder. *Clase 2*\n11. **Corto y largo plazo.** Lo que hoy sube puede hundirte mañana. *Clase 9*\n\n## Enfocarte\n12. **No te estires.** Poner tu nombre en todo lo debilita. *Clase 7*\n13. **Renuncia a algo.** A lo que muestras, a quién le hablas o al cambio constante. *Clase 7*\n14. **El atributo contrario.** Por cada atributo hay otro igual de fuerte. *Clase 6*\n15. **Sinceridad.** Admite lo negativo y te creen lo positivo. *Clase 8*\n16. **Una sola jugada.** En cada momento, solo una mueve las cosas. *Clase 8*\n\n## Durar\n17. **Nadie ve el futuro.** Dirección sí, adivinanzas no. *Clase 9*\n18. **El éxito marea.** El ego es enemigo del marketing. *Clase 10*\n19. **Acepta el error.** Reconócelo pronto y corta pérdidas. *Clase 10*\n20. **Desconfía del ruido.** Lo que más se anuncia no siempre gana. *Clase 9*\n21. **Tendencia, no moda.** Súbete a la marea, no a la ola. *Clase 9*\n22. **Sin recursos no despega.** Una idea necesita con qué llegar a la mente. *Clase 10*\n\n> Si solo te acuerdas de una: ocupa una palabra en la mente de tu clienta.\n\n@@ 12 | Herramientas | Tu ficha de posicionamiento | Todo el curso en una página\nLlénala al terminar la Clase 10 y revísala cada tres meses. Si no puedes contestar una línea, regresa a su clase.\n\n## Las preguntas\n1. **Mi categoría:** ¿en qué pedazo del mercado juego? *(Clase 2)*\n2. **Soy la primera en:** ___ para ___. *(Clase 2)*\n3. **Mi palabra:** la idea que quiero que piensen al pensar en mí. *(Clase 4)*\n4. **Mi escalón hoy:** honesto, sin cuentos. *(Clase 5)*\n5. **Mi atributo contrario:** qué ofrezco que la referente no. *(Clase 6)*\n6. **A qué renuncio:** lo que no voy a comunicar estos 90 días. *(Clase 7)*\n7. **Mi frase sincera:** lo obvio que admito y el beneficio que sigue. *(Clase 8)*\n8. **Mi jugada del mes:** una sola. *(Clase 8)*\n9. **La tendencia que sigo:** lo que mis clientas piden cada vez más. *(Clase 9)*\n10. **Mis recursos:** tiempo, dinero y ayuda que le voy a dedicar. *(Clase 10)*\n\n## Tu frase final\nCon todo lo anterior, completa: \"Para ___ que ___, soy ___ porque ___.\"\n\nEjemplo: \"Para mamás que trabajan y no tienen tiempo de arreglarse, soy la de las rutinas de cinco minutos, porque yo también me arreglo en el coche.\"\n\n## ✍️ Llénala aquí\nEscribe tus diez respuestas y tu frase final en el cuaderno. Se guardan en este dispositivo.\n\n@@ 13 | Herramientas | Antes de publicar | La revisión de un minuto\nSiete preguntas para revisar una publicación, un mensaje de venta o una idea nueva antes de soltarla.\n\n## La revisión\n1. ¿Empuja **mi palabra** o la de otra?\n2. ¿Habla de **mi categoría** o de \"una más que vende lo mismo\"?\n3. ¿Es mi **oferta principal** o me estoy estirando?\n4. ¿Estoy **copiando** a la referente o mostrando lo opuesto?\n5. ¿Promete algo que **no puedo cumplir**? (resultados de salud, de piel o de dinero)\n6. ¿Es una **moda** que se va a ir o una **tendencia**?\n7. ¿Le dice a la persona **qué hacer** al terminar?\n\n> Si dos respuestas salen mal, no la publiques todavía. Ajústala.\n\n## Señales de alerta\n- Usa \"calidad\", \"lo mejor\" o \"precios increíbles\" como argumento principal.\n- Habla mal de otra marca o de otra persona.\n- Es la cuarta publicación seguida de venta directa.\n- Cambiaste de tema principal por tercera vez este mes.\n";
var FAQ_MD="## Empezar | 0\n\n### ¿Tengo que tomar las clases en orden?\nLa primera vez conviene, porque cada clase usa lo de la anterior: primero la categoría, luego la palabra, luego el escalón. Después puedes saltar a la que necesites desde el índice.\n\n### ¿Cuánto me toma cada clase?\nUnos 6 minutos de lectura, más el ejercicio. Funciona bien una clase por semana, con la tarea en medio.\n\n### ¿Dónde se guardan mis respuestas?\nEn el cuaderno al final de cada clase. Se guardan solo en este dispositivo y en este navegador. Si cambias de celular o borras los datos del navegador, se pierden, así que copia lo importante a tu libreta.\n\n### ¿De dónde salen estas leyes?\nDe un libro clásico de marketing que estudia por qué unas marcas ganan y otras desaparecen. Aquí están contadas con nuestras palabras y con ejemplos de venta directa.\n\n## Tu palabra | 4\n\n### ¿Qué palabra elijo si vendo lo mismo que todas?\nNo elijas por el producto; elige por la persona o por el momento. \"Paciencia\", \"seguimiento\", \"cinco minutos\" o \"regalos\" no dependen del catálogo. La Clase 4 tiene el ejercicio paso a paso.\n\n### ¿Puedo usar \"calidad\" o \"confianza\" como mi palabra?\nNo funcionan solas, porque todas las dicen y nadie dice lo contrario. Busca una palabra que tenga un opuesto que alguien podría defender.\n\n### ¿Y si otra persona del equipo ya tiene mi palabra?\nBusca otra. Dos no pueden ser dueñas de la misma palabra, y pelearla solo les resta a las dos. Mejor repártanse las palabras y recomiéndense entre ustedes.\n\n### ¿Cada cuánto puedo cambiar de palabra?\nLo menos posible. Una palabra tarda meses en quedarse en la mente de la gente. Si la cambias cada mes, nunca se queda ninguna.\n\n## Categoría y escalón | 2\n\n### ¿Inventar una categoría no es exagerar?\nSolo si no la cumples. \"Rutinas de cinco minutos para mamás\" es una categoría real si de verdad las enseñas así. Tiene que ser verdad y algo que puedas sostener.\n\n### Soy nueva. ¿Cómo compito con las que llevan años?\nNo compitas en su escalera. Busca un pedazo de la categoría donde nadie sea referente todavía (Clase 2) y di con honestidad dónde estás (Clase 5). \"Soy nueva, por eso te atiendo yo misma\" es una buena frase de arranque.\n\n### ¿Ser la alternativa significa hablar mal de la competencia?\nNo. Lo opuesto se construye diciendo lo que tú ofreces, no lo que la otra hace mal. En el equipo no se habla mal de otras marcas ni de compañeras.\n\n## Enfoque | 7\n\n### Vendo muchos productos. ¿Tengo que dejar de venderlos?\nNo. Puedes vender todo el catálogo, pero comunica una sola cosa como principal. La gente necesita saber para qué buscarte; lo demás lo descubre después.\n\n### Si le hablo solo a un tipo de clienta, ¿no pierdo a las demás?\nCasi nunca. A quien le hablas no es todo tu mercado: si le hablas a mamás que trabajan, también te compran sus amigas, sus hermanas y sus compañeras. Le hablas a una y te encuentran muchas.\n\n### ¿Cómo uso la sinceridad sin quedar mal?\nAdmite algo que tu clienta ya sabe y pasa rápido a un beneficio. \"No soy maquillista profesional, por eso te enseño lo que yo misma hago en cinco minutos.\" Nunca la uses para prometer resultados que no puedes asegurar.\n\n## Ventas y largo plazo | 9\n\n### ¿Las promociones están mal?\nNo, pero tienen un costo a largo plazo: si siempre vendes con descuento, tus clientas aprenden a esperar el descuento. Úsalas con intención y vende la mayor parte del tiempo con valor.\n\n### ¿Me subo a cada formato nuevo de redes?\nPrimero pregúntate si es moda o tendencia. Mira lo que tus clientas piden una y otra vez; ahí está la tendencia. La herramienta **Antes de publicar** te ayuda a decidir.\n\n### ¿Necesito invertir dinero para posicionarme?\nNecesitas recursos, pero no solo dinero: tiempo, constancia, muestras y contenido. Si inviertes, que sea con números claros y nunca endeudándote.\n\n### ¿Cuánto voy a vender si aplico las leyes?\nNadie te lo puede garantizar. Las leyes te ayudan a que la gente te recuerde y te elija; el resultado depende de tu negocio, tu constancia y muchas cosas más.\n\n## La mentora | 0\n\n### ¿Qué hace la mentora?\nEs Tu Palabra dentro de Claude. Te da el curso clase por clase, te ayuda a encontrar tu categoría y tu palabra, revisa tus publicaciones con las 22 leyes y te escribe bios y frases para tu nicho.\n\n### ¿Tengo que pagar Claude?\nNo. Funciona con la cuenta gratis de claude.ai, que tiene un límite de mensajes por día.\n\n### ¿Cómo la instalo?\nDescarga la mentora (.zip) en la pestaña **Tu mentora**. En Claude entra a Customize → Skills, toca \"+\", luego \"Create skill\" → \"Upload a skill\" y sube el zip sin descomprimir.\n";

  '<button class="tab" role="tab" id="tabM" aria-selected="false" aria-controls="mentorView" type="button">Tu '+mw+'</button></div></div>'+
  '<section id="progView" role="tabpanel" aria-labelledby="tabP"></section>'+
  '<section id="faqView" role="tabpanel" aria-labelledby="tabF" hidden><div class="faqv"><div><h2 class="sec-h">Preguntas</h2><p class="sec-p">'+esc(CFG.faqLead||"Las dudas que más salen en el equipo, con la clase que las responde.")+'</p></div>'+
  '<label class="sr" for="fq">Busca tu duda</label><div class="f-search">'+SEARCH+'<input id="fq" type="search" placeholder="'+esc(CFG.faqPh||"Busca tu duda")+'" autocomplete="off"></div><div class="f-chips" id="cats"></div><p class="f-count" id="fcount"></p><div id="faq"></div></div></section>'+
  '<section id="mentorView" role="tabpanel" aria-labelledby="tabM" hidden></section>'+
  (CFG.foot?'<footer class="foot">'+esc(CFG.foot)+"</footer>":"")+"</div>";

function renderHero(){$("#hero").innerHTML=SKIN.hero(CTX);var c=$("#cta");if(c)c.onclick=function(){var g=nextUp();if(g===null){setTab("P");$("#progView").scrollIntoView({behavior:"smooth"});}else openLesson(g);};$$("#hero [data-open]").forEach(wireOpen);}
function renderProgram(){$("#progView").innerHTML=SKIN.program(CTX);$$("#progView [data-open]").forEach(wireOpen);if(SKIN.mount)SKIN.mount(CTX,$("#progView"));}
function wireOpen(b){b.onclick=function(){openLesson(+b.getAttribute("data-open"),b);};}
function refresh(){renderHero();renderProgram();}

/* tabs */
var TABS={P:["#tabP","#progView"],F:["#tabF","#faqView"],M:["#tabM","#mentorView"]};
function setTab(t){Object.keys(TABS).forEach(function(k){$(TABS[k][0]).setAttribute("aria-selected",String(k===t));$(TABS[k][1]).hidden=k!==t;});}
Object.keys(TABS).forEach(function(k){$(TABS[k][0]).onclick=function(){setTab(k);};});

/* ---------- faq ---------- */
var norm=function(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");};
var STOP=new Set("que como para por con los las del una uno unos mis tus sus mas pero porque cuando donde esta este eso hay tengo puedo debo".split(" "));
function terms(s){return (norm(s).match(/[a-z0-9ñ]{3,}/g)||[]).filter(function(w){return !STOP.has(w);}).map(function(w){return w.length>5?w.slice(0,-1):w;});}
var FAQ=[],CATS=[];
FAQ_MD.split(/^## /m).filter(function(x){return x.trim();}).forEach(function(block){
  var lines=block.split("\n"),h=lines[0].split("|").map(function(x){return x.trim();});if(!h[0])return;CATS.push({cat:h[0],cls:+h[1]});
  lines.slice(1).join("\n").split(/^### /m).filter(function(x){return x.trim();}).forEach(function(qb){var i=qb.indexOf("\n");if(i<0)return;FAQ.push({cat:h[0],cls:+h[1],q:qb.slice(0,i).trim(),a:qb.slice(i+1).trim()});});
});
FAQ.forEach(function(f){f.n=norm(f.q+" "+f.a);});
function hl(html,ts){if(!ts.length)return html;return html.replace(/(>[^<]+<)/g,function(seg){var out=seg;ts.forEach(function(w){var re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").split("").map(function(ch){return ({a:"[aá]",e:"[eé]",i:"[ií]",o:"[oó]",u:"[uúü]",n:"[nñ]"})[ch]||ch;}).join("")+"[a-záéíóúñü]*)","gi");out=out.replace(re,"<mark>$1</mark>");});return out;});}
var fq=$("#fq"),faqEl=$("#faq"),fcount=$("#fcount"),curCat=null;
function isMentorCat(c){return /mentor/i.test(c);}
function renderCats(){var c=$("#cats");c.innerHTML="";[{cat:"Todas"}].concat(CATS).forEach(function(x){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=x.cat;b.setAttribute("aria-pressed",String((x.cat==="Todas"&&!curCat)||x.cat===curCat));b.onclick=function(){curCat=x.cat==="Todas"?null:x.cat;renderCats();renderFaq();};c.appendChild(b);});}
function renderFaq(){
  var qtxt=fq.value.trim(),ts=Array.from(new Set(terms(qtxt))),items=FAQ.filter(function(f){return !curCat||f.cat===curCat;});
  if(ts.length){items=items.map(function(f){return {f:f,s:ts.reduce(function(a,w){return a+(f.n.indexOf(w)>=0?(norm(f.q).indexOf(w)>=0?3:1):0);},0)};}).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;}).map(function(x){return x.f;});}
  faqEl.innerHTML="";
  var gs=ts.length?[[null,items]]:CATS.map(function(c){return [c.cat,items.filter(function(f){return f.cat===c.cat;})];}).filter(function(g){return g[1].length;});
  gs.forEach(function(g){var d=document.createElement("div");d.className="fgroup";if(g[0]){var h=document.createElement("h3");h.textContent=g[0];d.appendChild(h);}
    g[1].forEach(function(f,idx){var det=document.createElement("details");det.className="qa";var x=isMentorCat(f.cat)?null:L(f.cls);
      det.innerHTML="<summary><span>"+hl(">"+esc(f.q)+"<",ts).slice(1,-1)+'</span><i aria-hidden="true">+</i></summary><div class="ans">'+hl(md(f.a),ts)+(x?'<button class="btn go" type="button">Ver: '+esc(x.title)+"</button>":(isMentorCat(f.cat)?'<button class="btn go" type="button">Ir a Tu '+mw+"</button>":""))+"</div>";
      var go=det.querySelector(".go");if(go)go.onclick=function(){if(x)openLesson(f.cls);else setTab("M");};
      if(ts.length&&idx===0)det.open=true;d.appendChild(det);});faqEl.appendChild(d);});
  fcount.textContent=ts.length?(items.length?items.length+(items.length===1?" respuesta":" respuestas")+' para "'+qtxt+'"':'No hay una pregunta frecuente sobre "'+qtxt+'". Pregúntale a tu '+mw+"."):"";
}
var ft;fq.addEventListener("input",function(){clearTimeout(ft);ft=setTimeout(renderFaq,150);});

/* ---------- mentor ---------- */
(function(){
  var M=MENTOR,h='<div class="m-col"><div><h2 class="sec-h">'+esc(M.title)+'</h2><p class="sec-p">'+esc(M.intro)+"</p></div>"+
    '<ul class="m-can">'+M.can.map(function(c){return "<li><b>"+esc(c[0])+"</b><span>"+esc(c[1])+"</span></li>";}).join("")+"</ul>"+
    '<div class="m-dl"><button type="button" class="btn solid" id="dlZip" hidden>Descargar '+(mw==="mentor"?"el mentor":"la mentora")+' (.zip)</button>'+(CFG.mdVar?'<button type="button" class="btn" id="dlMd" hidden>Descargar las instrucciones (.md)</button>':"")+'</div><p class="m-note" id="dlMsg">'+esc(M.notes[0]||"")+"</p></div>"+
    '<div class="m-col"><h3 class="m-h">Cómo '+(mw==="mentor"?"instalarlo":"instalarla")+'</h3><ol class="m-steps">'+M.steps.map(function(s){return "<li><span>"+esc(s)+"</span></li>";}).join("")+"</ol>"+
    '<div class="m-prompts">'+M.prompts.map(function(p,i){return '<div class="m-prompt"><q id="mp'+i+'">'+esc(p)+'</q><button type="button" class="btn" data-copy="mp'+i+'">Copiar</button></div>';}).join("")+"</div>"+
    (M.notes[1]?'<p class="m-note">'+esc(M.notes[1])+"</p>":"")+(M.limits.length?'<div class="m-limits" aria-label="Límites">'+M.limits.map(function(s){return "<span>"+esc(s)+"</span>";}).join("")+"</div>":"")+"</div>";
  $("#mentorView").innerHTML='<div class="mentorv">'+h+"</div>";
  $$("[data-copy]").forEach(function(btn){btn.addEventListener("click",function(){var el=document.getElementById(btn.getAttribute("data-copy"));function selt(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="Seleccionado";}
    try{navigator.clipboard.writeText(el.textContent).then(function(){btn.textContent="Copiado";setTimeout(function(){btn.textContent="Copiar";},1600);},selt);}catch(e){selt();}});});
  if(!(window.claude&&window.claude.use)){var bz0=$("#dlZip"),bm0=$("#dlMd"),m0=$("#dlMsg");bz0.hidden=false;bz0.onclick=function(){location.href=CFG.zipName;};if(bm0){bm0.hidden=false;bm0.onclick=function(){location.href=CFG.mdName;};}m0.textContent=CFG.mdVar?"El .zip es el que se sube a Claude. El .md es el texto de las instrucciones, por si quieres leerlo.":"El .zip es el que se sube a Claude.";}
  if(window.claude&&window.claude.use){window.claude.use("downloads").then(function(dl){
    var msg=$("#dlMsg"),bz=$("#dlZip"),bm=$("#dlMd");if(!dl)return;
    bz.hidden=false;if(bm)bm.hidden=false;msg.textContent=CFG.mdVar?"El .zip es el que se sube a Claude. El .md es el texto de las instrucciones, por si quieres leerlo.":"El .zip es el que se sube a Claude.";
    function bytes(b64){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
    function save(name,data){dl.save({filename:name,data:data}).then(function(){msg.textContent="Listo: "+name+" descargado.";},function(e){var c=e&&e.code;
      if(c==="declined")msg.textContent="Descarga cancelada.";else if(c==="rate_limited")msg.textContent="Ya hay una descarga abierta. Termínala e intenta de nuevo.";else{msg.textContent=M.notes[0]||"Aquí no se puede descargar.";bz.hidden=true;if(bm)bm.hidden=true;}});}
    bz.onclick=function(){save(CFG.zipName,bytes(window[CFG.zipVar]));};if(bm)bm.onclick=function(){save(CFG.mdName,bytes(window[CFG.mdVar]));};
  });}
})();

/* ---------- reader sheet ---------- */
var cur=null;
function neighbours(id){var k=ORDER.indexOf(id);return {prev:ORDER[k-1],next:ORDER[k+1]};}
function where(x){if(x.id===0)return CFG.welcomeLabel||"Bienvenida";if(isStep(x.id)){var a=actOf(x.id);return label(x.id)+" de "+N+(a&&a.name!=="Clases"?", "+a.name:"");}return x.kicker;}
function sheetHTML(x){
  var b=lessonBody(x.body),nb=neighbours(x.id),s=seen.has(x.id),nx=nb.next!==undefined?L(nb.next):null;
  var num=isStep(x.id)?(SKIN.readerNum?SKIN.readerNum(x,CTX):String(x.id)):null;
  var turn=b.tasks.length?'<section class="turn"><h3>Tu turno</h3>'+b.tasks.map(function(t){return '<div class="task"><h4>'+esc(t.title)+"</h4>"+t.html+"</div>";}).join("")+
    '<label class="nb-l" for="nb">Tu cuaderno</label><textarea id="nb" placeholder="Escribe aquí tu ejercicio. Se guarda en este dispositivo."></textarea><span class="saved" id="nbs"></span></section>':"";
  return '<div class="grab" id="grab"><span class="where">'+esc(where(x))+'</span><button type="button" class="x" id="closeB">Cerrar</button></div><div class="scroll" id="scroll">'+
    '<div class="r-head'+(num?"":" nonum")+'">'+(num?'<span class="r-num" aria-hidden="true">'+esc(num)+"</span>":"")+'<p class="r-k">'+esc(isStep(x.id)?label(x.id):(x.id===0?(CFG.welcomeLabel||"Bienvenida"):x.kicker))+'</p><h1 class="r-title" id="rTitle">'+esc(ttl(x))+'</h1></div><p class="r-topic">'+esc(x.topic)+'</p><p class="r-intro">'+inline(esc(x.intro))+'</p><div class="lesson-body">'+b.html+"</div>"+turn+
    '<div class="r-foot"><div class="nav"><button class="btn" type="button" id="prevB" '+(nb.prev===undefined?"disabled":"")+'>Anterior</button><button class="btn solid" type="button" id="nextB" '+(nb.next===undefined?"disabled":"")+">Siguiente</button></div>"+
    (isStep(x.id)?'<button class="btn'+(s?" done":"")+'" type="button" id="seenB" aria-pressed="'+s+'">'+(s?"Completada ✓":"Marcar como completada")+"</button>":"")+
    (nx?'<p class="r-next">Sigue: '+esc(ttl(nx))+"</p>":"")+"</div></div>";
}
function openLesson(id,trigger){
  var x=L(id);if(!x)return;
  var fresh=!cur;
  if(fresh){
    var scrim=document.createElement("div");scrim.className="scrim";var sh=document.createElement("div");sh.className="sheet";sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");sh.setAttribute("aria-labelledby","rTitle");
    document.body.appendChild(scrim);document.body.appendChild(sh);document.body.classList.add("sheet-open");
    cur={scrim:scrim,sh:sh,trigger:trigger||document.activeElement};
    scrim.onclick=closeLesson;
  }
  cur.id=id;cur.sh.innerHTML=sheetHTML(x);
  var sh=cur.sh;
  if(fresh)requestAnimationFrame(function(){requestAnimationFrame(function(){sh.classList.add("on");cur&&cur.scrim.classList.add("on");});});
  $("#closeB",sh).onclick=closeLesson;var rt=$("#rTitle",sh);rt.setAttribute("tabindex","-1");rt.focus({preventScroll:true});
  var nb=neighbours(id);
  $("#prevB",sh).onclick=function(){openLesson(nb.prev);};
  $("#nextB",sh).onclick=function(){if((isStep(id)||id===0)&&!seen.has(id)){seen.add(id);saveSeen();refresh();}openLesson(nb.next);};
  var sb=$("#seenB",sh);if(sb)sb.onclick=function(){seen.has(id)?seen.delete(id):seen.add(id);saveSeen();var on=seen.has(id);sb.textContent=on?"Completada ✓":"Marcar como completada";sb.classList.toggle("done",on);sb.setAttribute("aria-pressed",String(on));refresh();};
  var ta=$("#nb",sh);if(ta){ta.value=notes[id]||"";var t;ta.oninput=function(){clearTimeout(t);t=setTimeout(function(){notes[id]=ta.value;store.set(CFG.key+"-notes",notes);$("#nbs",sh).textContent="Guardado en este dispositivo";},400);};}
  $("#scroll",sh).scrollTop=0;
  try{history.replaceState(null,"","#clase-"+id);}catch(e){}
  var g=$("#grab",sh),y0=null,dy=0,t0=0;
  g.addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;y0=e.clientY;dy=0;t0=performance.now();sh.classList.add("drag");try{g.setPointerCapture(e.pointerId);}catch(_){}});
  g.addEventListener("pointermove",function(e){if(y0==null)return;dy=e.clientY-y0;sh.style.transform="translateY("+(dy<0?dy*.15:dy)+"px)";});
  function end(){if(y0==null)return;var v=dy/Math.max(1,performance.now()-t0);sh.classList.remove("drag");sh.style.transform="";y0=null;if(dy>140||v>.5)closeLesson();}
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
}
function closeLesson(){
  if(!cur)return;var c=cur;cur=null;document.body.classList.remove("sheet-open");
  c.sh.classList.remove("on");c.scrim.classList.remove("on");setTimeout(function(){c.sh.remove();c.scrim.remove();},reduce?0:500);
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  var t=document.querySelector('#progView [data-open="'+c.id+'"]')||c.trigger;if(t&&t.focus)t.focus({preventScroll:false});
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&cur)closeLesson();});

/* ---------- boot ---------- */
renderCats();renderFaq();refresh();
var hm=(location.hash||"").replace("#",""),hh=hm.match(/clase-(\d+)/);
if(hh&&L(+hh[1]))openLesson(+hh[1]);else if(hm==="mentor"||hm==="mentora")setTab("M");else if(hm==="preguntas")setTab("F");
})();
