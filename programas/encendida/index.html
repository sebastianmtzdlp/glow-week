<style>

.sheet :focus-visible{outline:2px solid var(--r-accent);outline-offset:3px}

.r-num{grid-row:span 2;font:var(--r-num-font,800 96px/.8 var(--display));color:var(--r-accent);font-variant-numeric:tabular-nums}

.task{background:var(--r-surface);border:1px solid var(--r-line);border-radius:var(--card-r,16px);padding:16px 18px}

:root{

  --display:"Bungee","Arial Black",Impact,sans-serif; --body:"Nunito Sans",system-ui,-apple-system,sans-serif;
  --h2-font:400 clamp(32px,6.6vw,54px)/1 var(--display); --h3-font:400 20px/1.1 var(--display); --num-font:400 22px/1 var(--display); --accent-text:#C4114F;

/* programme */
.n-prog{display:grid;gap:24px}

<script>
var LESSONS_MD="@@ 0 | Empieza aqu\u00ed | Bienvenida a Encendida | Lo b\u00e1sico, bien hecho, en 40 d\u00edas\nEncendida es el punto de partida: el curso para dejar de ver las redes como algo abrumador y empezar a usarlas como una herramienta real para crecer. No es magia ni \"insp\u00edrate y ya\". Es estructura, claridad y hacer lo b\u00e1sico bien.\n\n## Qu\u00e9 vas a aprender\n- A entender para qu\u00e9 sirve cada red y cada formato.\n- A dejar tu perfil listo para atraer, no solo para existir.\n- A conocer a tu clienta ideal y hablarle directo.\n- A crear contenido con intenci\u00f3n, no por impulso.\n- A abrir conversaciones reales con tus historias.\n\n## C\u00f3mo funciona\nSon 9 clases cortas, 3 retos y 4 herramientas. Avanza a tu ritmo, pero ponte una meta: **terminar en 40 d\u00edas**. Puedes saltar a cualquier clase desde el men\u00fa; si es tu primera vez, te recomendamos ir en orden.\n\nTres momentos para revisarte:\n- **D\u00eda 1:** lee esta bienvenida, cambia algo de tu perfil y pres\u00e9ntate en el grupo.\n- **D\u00eda 20:** anota qu\u00e9 ya aplicaste y qu\u00e9 te falta.\n- **D\u00eda 40:** haz el cierre y decide tu siguiente paso.\n\n## Esto es un marat\u00f3n, no una carrera de 100 metros\nNadie corre un marat\u00f3n sin saber cu\u00e1l, d\u00f3nde ni cu\u00e1ndo. En redes pasa igual: si no sabes para qu\u00e9 publicas, c\u00f3mo vas a vender ni a qui\u00e9n le hablas, est\u00e1s corriendo sin rumbo. Define desde hoy qu\u00e9 vendes, a qui\u00e9n y cu\u00e1nto te gustar\u00eda que eso te dejara al mes. Ponerle n\u00famero a tu meta no es ambici\u00f3n fea: es direcci\u00f3n.\n\n## Seguidores no es lo mismo que ventas\nAqu\u00ed no estamos formando influencers. Estamos formando mujeres que venden un producto o servicio. Hay cuentas con cien mil seguidores que venden menos que una de diez mil. La diferencia est\u00e1 en la claridad, en la confianza que generas y en tener un sistema.\n\n## Los pensamientos que te van a querer frenar\n\"Me van a criticar\", \"nadie me ve\", \"esto no es para m\u00ed\". Esos pensamientos le llegan a todas, empiecen o lleven a\u00f1os. No se apagan con un n\u00famero de seguidores. La diferencia es si te quedas ah\u00ed o lo haces a pesar de ellos. Qu\u00e9date con la gente a la que s\u00ed inspiras: muchas te ven en silencio aunque no te escriban.\n\n> Lo que no est\u00e1 en tus h\u00e1bitos se siente dif\u00edcil. Crear contenido tiene que volverse tan normal como lavarte los dientes.\n\n## \ud83e\ude9e M\u00edrate al espejo\nDel 1 al 10, \u00bfqu\u00e9 tanto dominas hoy tus redes? S\u00e9 honesta. \u00bfQu\u00e9 piensas de las redes sociales: que son dif\u00edciles, que no son para ti, que son una oportunidad?\n\n## \u270d\ufe0f Ejercicio\n1. Escribe **qu\u00e9 vendes** y **a qui\u00e9n** en una sola frase.\n2. Escribe tu **meta para estos 40 d\u00edas** (algo que puedas medir: publicar 4 veces por semana, abrir 10 conversaciones, terminar tu perfil).\n3. Escribe **el pensamiento que m\u00e1s te frena** y una frase con la que le vas a contestar.\n\n## \u2705 Tu tarea\nSube una historia contando que empezaste este curso y por qu\u00e9 lo est\u00e1s haciendo.\n\n## \ud83d\udcac Para compartir en el grupo\nPres\u00e9ntate en una l\u00ednea: qu\u00e9 haces y para qui\u00e9n lo haces.\n\n@@ 1 | Clase 1 | Para qu\u00e9 sirven las redes | Primero entretienen, luego venden\nAntes de pensar en qu\u00e9 publicar, hay que entender para qu\u00e9 existen las redes y para qu\u00e9 te sirve cada una. Si no, terminas usando tu perfil como cat\u00e1logo y te preguntas por qu\u00e9 nadie compra.\n\n## Las redes se hicieron para entretener\nPregunta clave: \u00bfpara qu\u00e9 existen las redes sociales? No para vender. Se crearon para entretener, distraer y conectar, como en su momento la televisi\u00f3n. Los comerciales existen, pero no son el programa. El error m\u00e1s com\u00fan es querer vender primero y conectar despu\u00e9s. Es al rev\u00e9s: **entretienes, conectas emocionalmente y desde ah\u00ed te compran.**\n\n> La pregunta no es \"\u00bfc\u00f3mo vendo m\u00e1s?\". Es \"\u00bfc\u00f3mo puedo entretener a la gente que quiero atraer con lo que hago?\".\n\n## Instagram: presencia, comunidad y conversi\u00f3n\nEs visual, pero tiene mucho potencial para crear comunidad, posicionarte y vender. Sirve para construir una imagen coherente, mostrar tu proceso y tu estilo de vida, y educar. Aqu\u00ed publicas reels, carruseles, fotos, historias y lives, y conviertes seguidoras en clientas con destacadas, link y mensajes directos.\n\n## Facebook: comunidad, servicio y anuncios\nMucha gente cree que \"ya no se usa\", pero sigue siendo muy \u00fatil. Sirve para grupos privados, para una p\u00e1gina profesional donde centralizas tu informaci\u00f3n y para anuncios pagados (comparte sistema de anuncios con Instagram). Tiene botones como \"M\u00e1s informaci\u00f3n\" o \"WhatsApp\" para contacto directo.\n\n## TikTok: alcance org\u00e1nico y autenticidad\nEs la red de video corto que m\u00e1s alcance da a cuentas nuevas o peque\u00f1as. Sirve para que te descubra gente que todav\u00eda no te sigue, mostrar tu personalidad de forma simple y llevar tr\u00e1fico a tus otras redes.\n\n## \u00bfCu\u00e1l elijo primero?\nNo necesitas estar en todas al mismo tiempo. Empieza con la que te salga m\u00e1s natural y luego crece con estrategia.\n- \u00bfQuieres crear comunidad y mostrar tu proceso? \u2192 **Instagram**.\n- \u00bfQuieres algo m\u00e1s estructurado o hacer anuncios? \u2192 **Facebook**.\n- \u00bfQuieres que te descubra m\u00e1s gente aunque est\u00e9s empezando? \u2192 **TikTok**.\n\n## \ud83e\ude9e M\u00edrate al espejo\nHoy, \u00bftu perfil se parece m\u00e1s a un cat\u00e1logo o a un lugar donde la gente se queda?\n\n## \u270d\ufe0f Ejercicio\n1. Elige tu **red principal** para estos 40 d\u00edas y escribe por qu\u00e9.\n2. Responde la pregunta clave: escribe **5 formas de entretener** a tu clienta usando tu producto o servicio (usarlo en tu d\u00eda, un antes y despu\u00e9s, un error com\u00fan, una historia, un reto).\n\n## \u2705 Tu tarea\nPublica una de esas 5 ideas esta semana.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu mejor idea para entretener con lo que vendes.\n\n@@ 2 | Clase 2 | Tu vitrina de confianza | Publicar no es lo mismo que vender\nLas redes ya no son un hobby ni cuesti\u00f3n de suerte. Hoy son una vitrina donde la gente se asoma para decidir si conf\u00eda en ti.\n\n## Subir no es avanzar\nPasar ocho horas en el celular no es tener una estrategia. Publicar todos los d\u00edas sin rumbo cansa, frustra y te hace pensar \"esto no es para m\u00ed\". Es mejor publicar menos, con intenci\u00f3n, que publicar por publicar.\n\n## La joyer\u00eda\nImagina que entras a una joyer\u00eda. En segundos sabes si lo que ves se siente de calidad o se siente hueco. Tu perfil funciona igual: quien llega por primera vez decide en segundos si se queda, te sigue o se va.\n\n## Qu\u00e9 tiene que ver alguien que llega a tu perfil\n- **Tu promesa:** qu\u00e9 haces y para qui\u00e9n, clarito.\n- **Resultados y testimonios:** es lo que m\u00e1s genera confianza. Satura de resultados reales.\n- **Qui\u00e9n eres:** tu historia corta, para que conecten contigo.\n- **T\u00fa saliendo a cuadro:** las publicaciones donde sales t\u00fa casi siempre conectan m\u00e1s que las fotos de producto solas.\n- **Una forma f\u00e1cil de contactarte.**\n\n## El orden importa\nSi tu promesa es grande y lo primero que encuentran es el cat\u00e1logo de la empresa, la expectativa baja. Primero la promesa, luego la prueba (resultados), luego qui\u00e9n eres y al final el producto. Tu vida personal s\u00ed cabe, pero conectada a tu promesa.\n\n## Menos ruido, m\u00e1s claridad\nMuchas tipograf\u00edas, muchos colores, mucho texto o im\u00e1genes que no son tuyas saturan la vitrina. Humaniza tu marca: muestra tu proceso y sal t\u00fa.\n\n> Si alguien que no te conoce entra a tu perfil, \u00bfentender\u00eda en 5 segundos qu\u00e9 haces y por qu\u00e9 confiar en ti?\n\n## \ud83e\ude9e M\u00edrate al espejo\nEscribe en una frase qu\u00e9 crees que proyecta tu perfil. Luego p\u00eddele a alguien que no te conozca tanto que te diga qu\u00e9 proyecta. \u00bfCoincide?\n\n## \u270d\ufe0f Ejercicio\nUsa el **Checklist de tu vitrina** (en Herramientas) y calif\u00edcate del 1 al 10 en cada punto. Elige los 2 m\u00e1s bajos.\n\n## \u2705 Tu tarea\nArregla esos 2 puntos esta semana.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu perfil y la frase de lo que quieres que proyecte. Pide una opini\u00f3n honesta.\n\n@@ 3 | Clase 3 | Los formatos de Instagram | Cada uno tiene su trabajo\nEs normal confundirse con todo lo que ofrece Instagram. Cada formato tiene una funci\u00f3n. Saber cu\u00e1l usar te ahorra tiempo y hace que tu mensaje llegue.\n\n## Post\nUna imagen o video en tu cuadr\u00edcula. Es lo que ven cuando visitan tu perfil. Sirve para una idea puntual, una foto profesional, un resultado o una promoci\u00f3n. Es permanente. El dise\u00f1o y el texto importan: h\u00e1blale a tu clienta ideal, no a \"todo el mundo\".\n\n## Carrusel\nHasta 10 im\u00e1genes o textos que se deslizan. Sirve para ense\u00f1ar paso a paso, contar una historia, mostrar un antes y despu\u00e9s o dar varios consejos. Es de los mejores formatos para educar y vender sin ser invasiva. La primera imagen es el gancho: tiene que invitar a deslizar.\n\n## Reel\nVideo vertical corto. Es el formato que m\u00e1s alcance le da a gente que todav\u00eda no te sigue. Sirve para entretener, educar r\u00e1pido y mostrar tu personalidad.\n\n## Historias\nFotos o videos verticales que duran 24 horas. Sirven para tu d\u00eda a d\u00eda, detr\u00e1s de c\u00e1maras, encuestas y preguntas. Son tu espacio de cercan\u00eda. Lo imperfecto vende: no tienen que verse tan producidas.\n\n## Destacadas\nHistorias que guardas debajo de tu bio. Son el men\u00fa de tu perfil, como una mini p\u00e1gina web. Sirven para resumir qui\u00e9n eres, qu\u00e9 vendes, resultados, testimonios y preguntas frecuentes. Usa portadas coherentes y agrupa por tema.\n\n## No uses todo a la vez\nEmpieza por el que m\u00e1s te acomode. Pero recuerda: tu audiencia necesita verte, entenderte y sentir que est\u00e1s presente.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfQu\u00e9 formato usas m\u00e1s? \u00bfEs porque te funciona o porque es el m\u00e1s c\u00f3modo?\n\n## \u270d\ufe0f Ejercicio\nPara tu negocio, escribe **una idea para cada formato**: un post, un carrusel, un reel, una historia y una destacada.\n\n## \u2705 Tu tarea\nPublica tu primer carrusel educativo esta semana.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte la portada de tu carrusel y pregunta si te dan ganas de deslizar.\n\n@@ 4 | Clase 4 | Configura tu cuenta | Un local con letrero y luces prendidas\nUna cuenta mal configurada es como un local sin letrero, sin entrada clara y con las luces apagadas. Antes de pensar en qu\u00e9 publicar, deja tu perfil listo para recibir visitas y convertirlas.\n\n## Nombre de usuario y nombre de perfil\nPiensa c\u00f3mo te buscar\u00eda alguien que no te conoce pero te necesita. En el nombre de perfil incluye lo que haces o a qui\u00e9n ayudas, no solo tu nombre. As\u00ed apareces cuando buscan ese tema.\n\n## Tu bio: tu presentaci\u00f3n en segundos\nUna f\u00f3rmula sencilla:\n\n> Te ayudo a **[resolver qu\u00e9 problema]** \u00b7 **c\u00f3mo** lo hago \u00b7 **en cu\u00e1nto tiempo** o con qu\u00e9 resultado.\n\nUsa emojis para guiar la vista, no para rellenar. Evita frases vagas como \"hacemos tus ideas realidad\": di qu\u00e9 haces exactamente. Si tu promesa suena igual a la de todas, ponte creativa y especif\u00edcala m\u00e1s.\n\n## El link\nPonlo a trabajar. Si atiendes por WhatsApp, pon el link directo a WhatsApp: convierte m\u00e1s que mandar a la gente a otra red. Usa verbos de acci\u00f3n: \"Escr\u00edbeme\", \"Quiero mi gu\u00eda\", \"Agenda aqu\u00ed\".\n\n## Cuenta profesional\nSi tu cuenta es personal, c\u00e1mbiala a **Profesional** o **Creadora**. As\u00ed ves estad\u00edsticas y puedes agregar botones de contacto. Activa el bot\u00f3n de WhatsApp si atiendes por ah\u00ed.\n\n## Destacadas en orden\nUn orden que funciona:\n1. **Resultados / testimonios**\n2. **Qui\u00e9n soy** (tu historia corta)\n3. **Qu\u00e9 ofrezco** (producto o servicio)\n4. **Preguntas frecuentes**\n5. **C\u00f3mo empezar** (contacto)\n\nMantenlas al d\u00eda: una destacada con promociones de hace meses se ve abandonada.\n\n## \ud83e\ude9e M\u00edrate al espejo\nLee tu bio como si no te conocieras. \u00bfEntiendes qu\u00e9 haces, para qui\u00e9n y qu\u00e9 hacer despu\u00e9s?\n\n## \u270d\ufe0f Ejercicio\n1. Reescribe tu **nombre de perfil** con lo que haces.\n2. Escribe **3 versiones de tu bio** con la f\u00f3rmula y elige una.\n3. Haz la lista de tus **destacadas** en el orden de arriba.\n\n## \u2705 Tu tarea\nCambia tu bio, tu link y tus destacadas esta semana.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tus 3 versiones de bio y deja que el grupo vote.\n\n@@ 5 | Clase 5 | Tu clienta ideal | A qui\u00e9n le hablas cuando publicas\nSi le hablas a todo el mundo, nadie siente que le hablas a ella. Esta clase es para conocer a esa persona tan bien que sepas qu\u00e9 decirle antes de que conozca tu producto.\n\n## Ponle cara\nDale nombre, edad y ciudad. Luego responde:\n- \u00bfA qu\u00e9 se dedica?\n- \u00bfQu\u00e9 lugares frecuenta?\n- \u00bfQu\u00e9 hobbies tiene?\n- \u00bfQu\u00e9 es lo m\u00e1s importante para ella al comprar? (precio, calidad, rapidez, confianza)\n- \u00bfQu\u00e9 problema tiene hoy?\n\n## Qu\u00e9 consume\n\u00bfA qu\u00e9 cuentas sigue? \u00bfQu\u00e9 tienen en com\u00fan esas cuentas? \u00bfDe qu\u00e9 hablan? Observarlas te dice qu\u00e9 tipo de contenido ya le gusta. Y anota las **preguntas frecuentes** que busca resolver: cada una es un contenido.\n\n## La venta no depende del producto\nNi siquiera del precio. Depende de que tengas claro **el resultado final** que va a tener tu clienta. Lo que separa un producto que se vende de uno que no es el foco: saber qu\u00e9 gran problema resuelve.\n\n## Su d\u00eda antes y despu\u00e9s de ti\nLlena este cuadro:\n\n| | Antes de conocerte | Despu\u00e9s de conocerte |\n|---|---|---|\n| Tiene | | |\n| Siente | | |\n| Su d\u00eda es | | |\n| Su estado | | |\n\nEjemplo (servicio de organizaci\u00f3n para mam\u00e1s que trabajan): antes tiene pendientes por todos lados, siente que no le alcanza el d\u00eda, su d\u00eda es correr de un lado a otro. Despu\u00e9s tiene una rutina sencilla, se siente tranquila y le sobra un rato para ella.\n\n## Tu diferenciador\nTermina con tres preguntas:\n1. \u00bfCu\u00e1les son los beneficios de tu producto o servicio?\n2. \u00bfQu\u00e9 hace diferente tu propuesta?\n3. \u00bfQu\u00e9 pierde tu clienta si no lo tiene?\n\n> Vender no es solo dinero: es ayudar a alguien a tomar una buena decisi\u00f3n. All\u00e1 afuera hay alguien que necesita lo que t\u00fa tienes.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfTu clienta ideal se parece a ti antes de resolver lo que hoy ya resolviste?\n\n## \u270d\ufe0f Ejercicio\nLlena la **Ficha de tu clienta ideal** completa (en Herramientas), incluyendo el cuadro de antes y despu\u00e9s.\n\n## \u2705 Tu tarea\nConvierte 5 de sus preguntas frecuentes en 5 ideas de contenido.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu cuadro de antes y despu\u00e9s.\n\n@@ 6 | Clase 6 | Tu voz es tu diferencia | Ser repetitiva, verdadera y constante\nEl producto se lo pueden comprar a cualquiera. Lo que hace que te lo compren a ti es tu voz: c\u00f3mo explicas, c\u00f3mo acompa\u00f1as, lo que vives.\n\n## Qu\u00e9 es una marca personal\nEs todo lo que comunicas cuando hablas y cuando no hablas. Es lo que la gente dice de ti cuando no est\u00e1s. El objetivo: que cuando alguien tenga el problema que t\u00fa resuelves, la primera persona en la que piense seas t\u00fa.\n\n## El secreto: ser repetitiva\nLa gente pasa por 15 o 20 cuentas en menos de un minuto. Para que te recuerden, tu mensaje tiene que repetirse una y otra vez, de forma entretenida. No necesitas la estrategia m\u00e1s dif\u00edcil; necesitas la que puedas sostener.\n\n## La estrategia que s\u00ed sostienes es la verdadera\nLa que ya vives todos los d\u00edas. Si tu contenido sale de tu vida real, nunca se te acaba. Cuando dices \"no s\u00e9 qu\u00e9 subir\", muchas veces significa que no est\u00e1s aprendiendo nada nuevo. Lee, escucha, toma clases, practica: lo que aprendes y vives es contenido.\n\n## Tu resultado va de la mano de tu crecimiento\nNo se pueden vender sue\u00f1os luciendo como pesadilla. La primera que tiene que vivir inspirada eres t\u00fa. Y la inspiraci\u00f3n est\u00e1 en la acci\u00f3n: tu historia n\u00famero 50 hablando a c\u00e1mara va a ser mucho mejor que la primera, pero solo si haces la primera.\n\n## Sobre las cr\u00edticas\nMientras m\u00e1s p\u00fablica te haces, m\u00e1s vas a incomodar a cierto tipo de gente. No puedes controlar el ojo de quien te mira. Si quisieras gustarle a todo el mundo, no hay curso que ense\u00f1e eso. Qu\u00e9date con quienes s\u00ed inspiras.\n\n## Educar con autoridad\nSi sientes que te cuesta el contenido educativo, trabaja en tu tema: \u00bfdesde d\u00f3nde quieres que te vean como referente? Ninguna cuenta inspira \"nada m\u00e1s porque s\u00ed\": inspira porque se dedica a algo, porque muestra algo real.\n\n## \ud83e\ude9e M\u00edrate al espejo\nSi alguien tiene el problema que resuelves, \u00bfhoy pensar\u00eda en ti? \u00bfPor qu\u00e9 s\u00ed o por qu\u00e9 no?\n\n## \u270d\ufe0f Ejercicio\n1. Escribe **la frase** por la que quieres que te recuerden (tu mensaje repetitivo).\n2. Escribe **5 formas distintas** de decir ese mismo mensaje (historia, consejo, error com\u00fan, ejemplo de tu d\u00eda, pregunta).\n3. Elige **una cosa que vas a aprender** este mes para tener m\u00e1s que aportar.\n\n## \u2705 Tu tarea\nGraba una historia hablando a c\u00e1mara con tu mensaje, aunque no salga perfecta.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu frase y pide al grupo que te diga si te la creen.\n\n@@ 7 | Clase 7 | Los 3 pilares que s\u00ed venden | Qu\u00e9 subir y qu\u00e9 d\u00eda\nYa sabes a qui\u00e9n le hablas y desde d\u00f3nde. Ahora toca ordenar qu\u00e9 publicas. Tres tipos de contenido, en proporciones que no cansan a nadie.\n\n## Los tres pilares\n- **Estilo de vida y entretenimiento \u2014 40%:** tu d\u00eda, tu proceso, tus gustos, humor, detr\u00e1s de c\u00e1maras. Conecta.\n- **Educativo \u2014 40%:** ense\u00f1as algo \u00fatil de tu tema. Da autoridad.\n- **Venta \u2014 20%:** tu producto, tu servicio, tu invitaci\u00f3n. Convierte.\n\nVender s\u00ed se vale. Lo que no funciona es llenar tus historias de flyers de promoci\u00f3n.\n\n## Una semana sugerida\nCuatro publicaciones a la semana, m\u00e1s historias diarias:\n- **Lunes y martes \u2014 educativo.** La gente empieza la semana con ganas de aprender.\n- **Jueves \u2014 entretenimiento o venta.** Ya est\u00e1n cansadas y quieren distraerse.\n- **Domingo \u2014 motivaci\u00f3n y estilo de vida.** Es un d\u00eda m\u00e1s emocional: entra bien lo aspiracional y lo inspirador.\n\nNo est\u00e1 escrito en piedra. Es un punto de partida para probar.\n\n## Los horarios se testean\n\"\u00bfA qu\u00e9 hora subo?\" no tiene una respuesta para todas. Prueba en la ma\u00f1ana, en la tarde y en la noche, observa qu\u00e9 pasa con tu contenido y repite lo que mejor te funcione. Una pista: el educativo suele funcionar mejor en la ma\u00f1ana, cuando la gente est\u00e1 fresca, y el entretenimiento en la noche.\n\n## Vender de forma entretenida\nEn lugar de 10 historias con fotos de promociones, haz una historia bien pensada: te arreglas o usas los productos mientras platicas, muestras lo que est\u00e1 en promoci\u00f3n y cierras con \"escr\u00edbeme y te mando la lista\". Vendiste sin saturar.\n\n## \ud83e\ude9e M\u00edrate al espejo\nMira tus \u00faltimas 9 publicaciones. \u00bfQu\u00e9 porcentaje es venta? \u00bfCu\u00e1l pilar te falta?\n\n## \u270d\ufe0f Ejercicio\nLlena el **Plan semanal** (en Herramientas): una idea por d\u00eda con su pilar.\n\n## \u2705 Tu tarea\nPublica las 4 publicaciones de la semana y anota la hora en que subiste cada una.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu plan semanal.\n\n@@ 8 | Clase 8 | Organiza tu contenido | Ir un paso adelante\nLa organizaci\u00f3n es la base de una marca personal que se sostiene. Si vas al d\u00eda, el d\u00eda que se enferma tu hijo o tienes mucho trabajo, desapareces.\n\n## Un stock de una semana\nTen m\u00ednimo **una semana de contenido educativo listo** por adelantado. Algunas prefieren dos. As\u00ed, en una semana dif\u00edcil, lo \u00fanico que tienes que hacer es publicar. Las tendencias las agregas sobre la marcha.\n\n## Elige la herramienta que menos fricci\u00f3n te d\u00e9\nUn tablero digital (como Trello o Notion), las notas del celular o una libreta impresa. Lo importante es que vac\u00edes tus ideas por d\u00eda: qu\u00e9 vas a publicar, qu\u00e9 formato, qu\u00e9 texto lleva. Si una aplicaci\u00f3n te angustia, a la antig\u00fcita con tu libreta.\n\n## Menos es m\u00e1s\nAl inicio, empieza sencillo:\n- **Imagen:** cabello presentable, piel cuidada, maquillaje natural, ropa b\u00e1sica. Si la pared es de color, mejor una blusa lisa.\n- **Lugar:** encuentra tu rinc\u00f3n con buena luz y rep\u00edtelo.\n- **Edici\u00f3n:** cortes para quitar silencios, m\u00fasica bajita (como 5 de 100), tipograf\u00eda sencilla y centrada, dentro de la zona segura de la pantalla.\n- **Expresiones:** no tienes que exagerar para transmitir.\n\n## Tu dicci\u00f3n importa m\u00e1s que los efectos\nUn video sencillo, con buena luz y un mensaje claro, gana. Practica hablando frente al espejo, como si alguien te escuchara. Se entrena.\n\n## Consume lo que quieres crear\nMira cuentas que admires y f\u00edjate en sus tipograf\u00edas, audios, lugares y edici\u00f3n. As\u00ed se educa tu ojo.\n\n## El h\u00e1bito, como en el gimnasio\nAl inicio tienes que ser muy disciplinada. Si un d\u00eda fallas, no tires la semana: vuelves al d\u00eda siguiente. Ese es el h\u00e1bito.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfCu\u00e1ntas veces esta semana publicaste \"porque tocaba\" sin haberlo planeado?\n\n## \u270d\ufe0f Ejercicio\n1. Elige tu **herramienta** (tablero, notas o libreta).\n2. Escribe **7 ideas de contenido educativo** listas para grabar.\n3. Elige tu **rinc\u00f3n de grabaci\u00f3n** y pru\u00e9balo con luz de d\u00eda.\n\n## \u2705 Tu tarea\nGraba y deja listo tu stock de una semana.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte una foto de tu tablero o de tu libreta.\n\n@@ 9 | Clase 9 | Historias que retienen | Cu\u00e9ntalo en una, no en veinte\nLas historias son tu espacio diario de cercan\u00eda. Pero si cuentas algo en 20 historias, la gente se va a la tercera. Esta clase es para decir m\u00e1s con menos.\n\n## Edita antes de subir\nGraba con la c\u00e1mara del celular, corta silencios, repeticiones y lo que no aporta, y s\u00fabelo como una sola historia de un minuto. Una historia que retiene a la gente completa le dice a la plataforma que tu contenido entretiene.\n\n## La regla de las 6 o 7\nSi llevas 6 o 7 historias y no has terminado de contar lo que te pas\u00f3, hay que mejorar c\u00f3mo comunicas. Verte y editarte tambi\u00e9n te entrena a hablar mejor.\n\n## Observa tus n\u00fameros\nF\u00edjate en qu\u00e9 historia empiezan a irse. Si siempre bajan en la tercera, ah\u00ed est\u00e1 tu pista: m\u00e1s corto, m\u00e1s directo, m\u00e1s entretenido.\n\n## Promociones en dos historias\nReto creativo: muestra todo lo que tienes en promoci\u00f3n en **m\u00e1ximo dos historias**. Act\u00faa, maquilla a alguien, sal a la calle, cu\u00e9ntalo como si fuera un programa. Mientras m\u00e1s creativa, mejor.\n\n## Historias diarias, sin agotarte\nNo necesitas contar toda tu vida. Una ma\u00f1ana, un proceso, un aprendizaje, una pregunta. Poco, bien contado, todos los d\u00edas.\n\n## \ud83e\ude9e M\u00edrate al espejo\nRevisa tus historias de ayer. \u00bfCu\u00e1ntas eran? \u00bfEn cu\u00e1l empezaron a irse?\n\n## \u270d\ufe0f Ejercicio\nToma algo que contar\u00edas en 5 historias y escr\u00edbelo para contarlo en **1 historia de un minuto**: inicio que atrape, lo importante, cierre.\n\n## \u2705 Tu tarea\nHaz el reto de promociones en dos historias.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu historia del reto y lo que aprendiste editando.\n\n@@ 10 | Reto 1 | Cuatro historias que abren conversaci\u00f3n | Dolor, confrontaci\u00f3n, valor y palabra clave\nEste reto es para dejar de crear contenido que solo entretiene y empezar a abrir conversaciones reales. El objetivo es guiar a la persona correcta a tomar una decisi\u00f3n. Puedes hacer los retos en el orden que quieras; uno por semana es m\u00e1s que suficiente.\n\n## C\u00f3mo se hace\nSube 4 historias seguidas, habladas o con texto e imagen. No necesitas producci\u00f3n perfecta: lo que importa es el mensaje y el orden. No te saltes pasos ni mezcles historias.\n\n## Historia 1 \u00b7 Dolor\nAqu\u00ed no vendes, conectas. Habla de algo que tu clienta vive y ya normaliz\u00f3, aunque le cueste tiempo, energ\u00eda o dinero. Nada de soluciones ni de \"yo te ayudo\".\n\n> \"Sentirte ocupada todo el d\u00eda y aun as\u00ed sentir que no avanzaste no es falta de tiempo\u2026 es falta de estructura.\"\n\n## Historia 2 \u00b7 Confrontaci\u00f3n\nLa haces pensar. No atacas, pero incomodas lo suficiente para mover algo. Una pregunta o afirmaci\u00f3n directa que la invite a hacerse responsable, sin culpa.\n\n> \"\u00bfCu\u00e1ntas veces has dicho 'luego lo organizo'? Seguir sin un sistema tambi\u00e9n es una decisi\u00f3n.\"\n\n## Historia 3 \u00b7 Valor\nDemuestras que sabes. Una idea clara y pr\u00e1ctica que la haga pensar \"esto tiene sentido\". Nada de frases bonitas vac\u00edas.\n\n> \"Casi siempre te sientes saturada no por tener demasiadas cosas, sino por no tener prioridades. Elige solo 3 tareas clave al d\u00eda.\"\n\n## Historia 4 \u00b7 Palabra clave\nAhora s\u00ed invitas, sin pena. No vendes el producto: invitas a platicar. S\u00e9 clara, usa una palabra clave y que se sienta personal.\n\n> \"Si te sentiste identificada y quieres organizarte distinto, resp\u00f3ndeme 'ORDEN' y te cuento c\u00f3mo.\"\n\n## No funciona si\u2026\nQuieres vender desde la primera historia o suenas gen\u00e9rica. Funciona cuando respetas el orden, hablas claro y conf\u00edas en el proceso.\n\n## \u270d\ufe0f Ejercicio\nEscribe tus 4 historias en tu cuaderno antes de grabarlas, una por bloque.\n\n## \u2705 Tu tarea\nS\u00fabelas en un mismo d\u00eda y cuenta cu\u00e1ntas personas respondieron con tu palabra clave.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte captura de tus 4 historias para recibir comentarios.\n\n@@ 11 | Reto 2 | Mi verdadero diferencial | Lo com\u00fan, mi forma y por qu\u00e9 cambia todo\nDeja de decir \"soy diferente\" y empieza a explicar por qu\u00e9. No desde el ego, desde el enfoque. Este reto construye autoridad sin vender.\n\n## C\u00f3mo se hace\nTres historias seguidas. Nada de precios, promociones ni invitaciones. Habla desde tu experiencia, no desde la teor\u00eda.\n\nAntes de grabar, preg\u00fantate: \u00bfqu\u00e9 hace la mayor\u00eda en mi tema? \u00bfQu\u00e9 hago yo distinto en el proceso, no solo en el resultado?\n\n## Historia 1 \u00b7 Lo com\u00fan\nDescribe lo normal en tu industria. No ataques, solo observa. \"La mayor\u00eda se enfoca en\u2026\", \"Muchas hacen\u2026\".\n\n> \"La mayor\u00eda cree que ser productiva es hacer m\u00e1s.\"\n\n## Historia 2 \u00b7 Mi forma\nExplica tu enfoque. \"Yo trabajo desde\u2026\", \"Mi enfoque es\u2026\".\n\n> \"Yo trabajo desde la claridad de prioridades.\"\n\n## Historia 3 \u00b7 Por qu\u00e9 cambia todo\nConecta tu forma con lo que vive tu clienta. \"Y eso importa porque\u2026\".\n\n> \"Porque cuando sabes qu\u00e9 s\u00ed importa, dejas de vivir agotada.\"\n\n## Para qu\u00e9 te sirve\nPara comunicar tu valor sin forzarlo, diferenciarte sin gritar y empezar a sonar como referente. Y para dejar de compararte.\n\n## \u270d\ufe0f Ejercicio\nEscribe tus 3 historias usando las f\u00f3rmulas.\n\n## \u2705 Tu tarea\nS\u00fabelas y anota qu\u00e9 mensajes te llegaron.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu historia 2: tu forma.\n\n@@ 12 | Reto 3 | Un pensamiento que no digo seguido | Human\u00edzate sin desbordarte\nEste reto rompe la imagen de perfecci\u00f3n y genera cercan\u00eda real. No es terapia: es una verdad bien comunicada.\n\n## C\u00f3mo se hace\nUna sola historia hablada, de 30 a 60 segundos, sin leer guion y con tono tranquilo.\n\nAntes de grabar, preg\u00fantate: \u00bfqu\u00e9 pienso pero casi no digo por miedo a verme vulnerable?\n\n## La estructura\n1. **Nombra el pensamiento.**\n2. **Dilo sin drama.**\n3. **Cierra con conciencia**, no con una soluci\u00f3n.\n\n## Ejemplos\n> \"Hay d\u00edas en los que dudo si voy por buen camino. Y aun as\u00ed sigo, porque entend\u00ed que dudar no es retroceder.\"\n\n> \"A veces tambi\u00e9n me canso de sostener todo. La diferencia es que hoy ya no me juzgo por sentirlo.\"\n\n## Cuida el l\u00edmite\nComparte lo que ya procesaste, no una herida abierta. Si algo todav\u00eda te duele mucho, no es para historias: es para hablarlo con alguien de confianza.\n\n## Para qu\u00e9 te sirve\nM\u00e1s respuestas reales, m\u00e1s identificaci\u00f3n y menos miedo a mostrarte.\n\n## \u270d\ufe0f Ejercicio\nEscribe tu pensamiento en una frase y tu cierre en otra. Luego gr\u00e1balo sin leer.\n\n## \u2705 Tu tarea\nS\u00fabelo y responde con cari\u00f1o cada mensaje que te llegue.\n\n## \ud83d\udcac Para compartir en el grupo\nCuenta c\u00f3mo te sentiste antes y despu\u00e9s de subirlo.\n\n@@ 13 | Cierre | D\u00eda 40 | Lo que ya cambi\u00f3 y tu siguiente paso\nLlegaste al final. Eso no es casualidad: es una decisi\u00f3n que tomaste contigo. Ahora toca mirar hacia atr\u00e1s para ver lo que ya cambi\u00f3 y decidir qu\u00e9 sigue.\n\n## Revisa tu antes y despu\u00e9s\nCompara tu perfil de hoy con el del d\u00eda 1: tu bio, tus destacadas, tu forma de hablar en historias, tu constancia. T\u00f3male captura y gu\u00e1rdala.\n\n## Lo que ya tienes\n- Tu red principal elegida.\n- Tu perfil configurado para atraer.\n- Tu clienta ideal clara.\n- Tu mensaje repetitivo.\n- Tus 3 pilares y tu plan semanal.\n- Tu stock de contenido.\n- Tres retos que abren conversaciones.\n\n## Lo que sigue\nLo b\u00e1sico ya est\u00e1. Si quieres trabajar a fondo tu marca, tu historia y tus ventas, el siguiente paso natural es **Visible**. Si lo que m\u00e1s te cuesta es la constancia y organizarte, **Ritmo** es para ti.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfQu\u00e9 hiciste en estos 40 d\u00edas que antes no te atrev\u00edas a hacer?\n\n## \u270d\ufe0f Ejercicio\n1. Escribe **3 cosas que ya cambiaste**.\n2. Escribe **3 cosas que te faltan**.\n3. Elige **tu siguiente paso** y ponle fecha.\n\n## \u2705 Tu tarea\nSube una historia contando qu\u00e9 aprendiste en este curso.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu antes y despu\u00e9s de perfil.\n\n@@ 14 | Herramientas | Ficha de tu clienta ideal | Para hablarle directo\nLl\u00e9nala con calma. Mientras m\u00e1s concreta, m\u00e1s f\u00e1cil vas a saber qu\u00e9 publicar.\n\n## Datos b\u00e1sicos\n- Nombre:\n- Edad:\n- Ciudad:\n- \u00bfA qu\u00e9 se dedica?\n- \u00bfQu\u00e9 lugares frecuenta?\n- \u00bfQu\u00e9 hobbies tiene?\n- \u00bfQu\u00e9 le importa m\u00e1s al comprar?\n- \u00bfQu\u00e9 problema tiene hoy?\n- Descr\u00edbela en 10 palabras:\n\n## Lo que consume\n- 5 cuentas que sigue:\n- \u00bfQu\u00e9 tienen en com\u00fan esas cuentas?\n- \u00bfDe qu\u00e9 hablan?\n- 5 preguntas frecuentes que quiere resolver:\n\n## Antes y despu\u00e9s de ti\n| | Antes | Despu\u00e9s |\n|---|---|---|\n| Tiene | | |\n| Siente | | |\n| Su d\u00eda es | | |\n| Su estado | | |\n\n## Tu diferenciador\n- Beneficios de tu producto o servicio:\n- Lo que hace diferente tu propuesta:\n- Lo que pierde si no lo tiene:\n\n@@ 15 | Herramientas | Tu perfil en 10 minutos | Bio, link y destacadas\nUna gu\u00eda r\u00e1pida para dejar tu perfil listo.\n\n## Nombre de perfil\nTu nombre + lo que haces. Ejemplo: \"Ana \u00b7 Organizaci\u00f3n para mam\u00e1s\".\n\n## Bio\n> Te ayudo a [problema] \u00b7 [c\u00f3mo] \u00b7 [en cu\u00e1nto tiempo o con qu\u00e9 resultado]\n> [Una l\u00ednea de qui\u00e9n eres o tu toque personal]\n> \ud83d\udc47 [Llamada a la acci\u00f3n]\n\n## Link\nDirecto a WhatsApp o a lo que quieres que hagan. Texto con verbo: \"Escr\u00edbeme aqu\u00ed\".\n\n## Destacadas, en este orden\n1. Resultados / testimonios\n2. Qui\u00e9n soy\n3. Qu\u00e9 ofrezco\n4. Preguntas frecuentes\n5. C\u00f3mo empezar\n\n## Configuraci\u00f3n\n- Cuenta profesional o de creadora.\n- Bot\u00f3n de contacto o WhatsApp activado.\n- Foto de perfil donde se te vea la cara, con buena luz.\n\n@@ 16 | Herramientas | Plan semanal | Cuatro publicaciones con intenci\u00f3n\nCopia esta tabla en tu libreta o tablero cada semana.\n\n## La semana\n| D\u00eda | Pilar | Formato | Idea | Hora |\n|---|---|---|---|---|\n| Lunes | Educativo | | | |\n| Martes | Educativo | | | |\n| Jueves | Entretenimiento o venta | | | |\n| Domingo | Motivaci\u00f3n / estilo de vida | | | |\n\n## Historias diarias\n- Ma\u00f1ana: algo de tu d\u00eda o tu rutina.\n- Tarde: un aprendizaje, un proceso o una pregunta.\n- Una vez por semana: un reto o una invitaci\u00f3n con palabra clave.\n\n## Al final de la semana\n- \u00bfCu\u00e1l publicaci\u00f3n funcion\u00f3 mejor?\n- \u00bfA qu\u00e9 hora la subiste?\n- \u00bfQu\u00e9 repites la pr\u00f3xima semana?\n\n@@ 17 | Herramientas | Checklist de tu vitrina | Calif\u00edcate del 1 al 10\nRevisa tu perfil como si fueras alguien que llega por primera vez.\n\n## Califica cada punto del 1 al 10\n- Se entiende en 5 segundos qu\u00e9 hago y para qui\u00e9n.\n- Mi promesa es espec\u00edfica, no gen\u00e9rica.\n- Lo primero que se ve son resultados o testimonios reales.\n- Se ve qui\u00e9n soy y por qu\u00e9 confiar en m\u00ed.\n- Salgo yo a cuadro en varias publicaciones.\n- Mis destacadas est\u00e1n ordenadas y al d\u00eda.\n- El link lleva directo a contactarme.\n- Las tipograf\u00edas y colores no saturan.\n- Publico con constancia (al menos 4 veces por semana).\n- Mis historias cuentan algo en pocas historias.\n\n## Qu\u00e9 hacer con el resultado\nElige los 2 puntos m\u00e1s bajos y trab\u00e1jalos esta semana. Vuelve a calificarte al d\u00eda 40.\n";
var FAQ_MD="## Empezar | 0\n\n### \u00bfTengo que tomar las clases en orden?\nLa primera vez te lo recomendamos, porque cada clase usa lo de la anterior. Pero puedes saltar a cualquier clase o reto desde el men\u00fa.\n\n### \u00bfPor qu\u00e9 40 d\u00edas?\nEs una meta para que no se quede a medias. Son 9 clases y 3 retos: m\u00e1s o menos una clase cada 3 o 4 d\u00edas y un reto por semana.\n\n### \u00bfD\u00f3nde guardo mis ejercicios?\nEn el cuaderno al final de cada clase. Se guarda solo en este dispositivo y navegador. Si cambias de celular o borras los datos, se pierde, as\u00ed que copia lo importante.\n\n### Nunca he hecho contenido, \u00bfeste curso es para m\u00ed?\nS\u00ed. Encendida es justo para empezar desde cero: entender las redes, dejar tu perfil listo y crear tus primeros contenidos con intenci\u00f3n.\n\n## Perfil | 4\n\n### \u00bfQu\u00e9 pongo en mi bio?\nUsa la f\u00f3rmula: te ayudo a [problema], c\u00f3mo lo haces y en cu\u00e1nto tiempo o con qu\u00e9 resultado. Est\u00e1 en la Clase 4 y en la herramienta \"Tu perfil en 10 minutos\".\n\n### \u00bfPongo el link de mi Facebook o el de WhatsApp?\nSi atiendes por WhatsApp, pon el de WhatsApp. Es m\u00e1s f\u00e1cil que te escriban directo a que den una vuelta por otra red.\n\n### \u00bfQu\u00e9 destacadas debo tener?\nResultados o testimonios, qui\u00e9n soy, qu\u00e9 ofrezco, preguntas frecuentes y c\u00f3mo empezar. Mantenlas al d\u00eda.\n\n### \u00bfPuedo mostrar a mi familia y mi vida personal?\nS\u00ed, y conecta mucho. Solo cuida que est\u00e9 conectado con tu promesa y que no sea lo primero que alguien ve si llega buscando lo que vendes.\n\n## Contenido | 7\n\n### \u00bfCu\u00e1ntas veces a la semana publico?\nUna buena base: 4 publicaciones a la semana m\u00e1s historias diarias. Mejor menos y bien hecho que mucho sin rumbo.\n\n### \u00bfA qu\u00e9 hora publico?\nNo hay una hora m\u00e1gica. Prueba en distintos horarios, observa tus n\u00fameros y repite lo que te funcione. Como pista, el educativo suele ir bien en la ma\u00f1ana y el entretenimiento en la noche.\n\n### \u00bfCu\u00e1nto debo vender en mi contenido?\nComo referencia: 40% estilo de vida y entretenimiento, 40% educativo y 20% venta. Vender s\u00ed se vale, solo no llenes tus historias de flyers.\n\n### No s\u00e9 qu\u00e9 subir.\nRegresa a las preguntas frecuentes de tu clienta ideal (Clase 5) y a tu mensaje repetitivo (Clase 6). Y aprende algo nuevo cada semana: lo que aprendes tambi\u00e9n es contenido.\n\n### Me da pena salir a cuadro.\nEs muy normal. Empieza con una historia corta hablando de algo que dominas. La n\u00famero 50 va a salir mucho mejor que la primera, pero solo si haces la primera.\n\n### \u00bfPuedo usar inteligencia artificial?\nS\u00ed, como asistente. T\u00fa pones la idea y la IA te ayuda a ordenarla. Revisa siempre que suene a ti.\n\n## Historias y retos | 10\n\n### Mis historias pierden vistas a la tercera.\nEdita antes de subir: corta silencios y repeticiones y cuenta lo mismo en una historia de un minuto. Est\u00e1 en la Clase 9.\n\n### \u00bfEn qu\u00e9 orden hago los retos?\nEn el que quieras. Cada reto es independiente. Uno por semana es m\u00e1s que suficiente.\n\n### Hice el reto de las 4 historias y nadie respondi\u00f3.\nRevisa que no hayas vendido desde la primera historia y que tu palabra clave sea clara. A veces la respuesta llega a la segunda o tercera vez. Rep\u00edtelo.\n\n### \u00bfEst\u00e1 bien decir que mi promoci\u00f3n se acaba hoy para que se decidan?\nSolo si es verdad. Nunca inventes escasez, descuentos ni garant\u00edas: si se descubre, pierdes la venta y la confianza.\n\n## El mentor | 0\n\n### \u00bfQu\u00e9 es \"Tu mentora\"?\nEs la mentora de Encendida dentro de Claude. Te da las clases una por una, revisa tus ejercicios y te ayuda con tu bio, tus ideas de contenido y tus retos.\n\n### \u00bfTengo que pagar Claude?\nNo. Funciona con la cuenta gratis de claude.ai. La cuenta gratis tiene un l\u00edmite de mensajes por d\u00eda.\n\n### \u00bfC\u00f3mo la instalo?\nDescarga la mentora (.zip) en la pesta\u00f1a Tu mentora. En Claude entra a Customize \u2192 Skills, toca \"+\", luego \"Create skill\" \u2192 \"Upload a skill\" y sube el zip sin descomprimir.\n";

  var qtxt=fq.value.trim(),ts=Array.from(new Set(terms(qtxt))),items=FAQ.filter(function(f){return !curCat||f.cat===curCat;});
  if(ts.length){items=items.map(function(f){return {f:f,s:ts.reduce(function(a,w){return a+(f.n.indexOf(w)>=0?(norm(f.q).indexOf(w)>=0?3:1):0);},0)};}).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;}).map(function(x){return x.f;});}
  faqEl.innerHTML="";
  var gs=ts.length?[[null,items]]:CATS.map(function(c){return [c.cat,items.filter(function(f){return f.cat===c.cat;})];}).filter(function(g){return g[1].length;});
  gs.forEach(function(g){var d=document.createElement("div");d.className="fgroup";if(g[0]){var h=document.createElement("h3");h.textContent=g[0];d.appendChild(h);}
    g[1].forEach(function(f,idx){var det=document.createElement("details");det.className="qa";var x=isMentorCat(f.cat)?null:L(f.cls);
      det.innerHTML="<summary><span>"+hl(">"+esc(f.q)+"<",ts).slice(1,-1)+'</span><i aria-hidden="true">+</i></summary><div class="ans">'+hl(md(f.a),ts)+(x?'<button class="btn go" type="button">Ver: '+esc(x.title)+"</button>":(isMentorCat(f.cat)?'<button class="btn go" type="button">Ir a Tu '+mw+"</button>":""))+"</div>";
      var go=det.querySelector(".go");if(go)go.onclick=function(){if(x)openLesson(f.cls);else setTab("M");};
      if(ts.length&&idx===0)det.open=true;d.appendChild(det);});faqEl.appendChild(d);});
  fcount.textContent=ts.length?(items.length?items.length+(items.length===1?" respuesta":" respuestas")+' para "'+qtxt+'"':'No hay una pregunta frecuente sobre "'+qtxt+'". Pregúntale a tu '+mw+"."):"";
}
var ft;fq.addEventListener("input",function(){clearTimeout(ft);ft=setTimeout(renderFaq,150);});

/* ---------- mentor ---------- */
(function(){
  var M=MENTOR,h='<div class="m-col"><div><h2 class="sec-h">'+esc(M.title)+'</h2><p class="sec-p">'+esc(M.intro)+"</p></div>"+
    '<ul class="m-can">'+M.can.map(function(c){return "<li><b>"+esc(c[0])+"</b><span>"+esc(c[1])+"</span></li>";}).join("")+"</ul>"+
    '<div class="m-dl"><a class="btn solid" href="'+CFG.zipName+'" download>Descargar '+(mw==="mentor"?"el mentor":"la mentora")+' (.zip)</a>'+(CFG.mdVar?'<a class="btn" href="'+CFG.mdName+'" download>Descargar las instrucciones (.md)</a>':"")+'</div><p class="m-note" id="dlMsg">'+esc(M.notes[0]||"")+"</p></div>"+
    '<div class="m-col"><h3 class="m-h">Cómo '+(mw==="mentor"?"instalarlo":"instalarla")+'</h3><ol class="m-steps">'+M.steps.map(function(s){return "<li><span>"+esc(s)+"</span></li>";}).join("")+"</ol>"+
    '<div class="m-prompts">'+M.prompts.map(function(p,i){return '<div class="m-prompt"><q id="mp'+i+'">'+esc(p)+'</q><button type="button" class="btn" data-copy="mp'+i+'">Copiar</button></div>';}).join("")+"</div>"+
    (M.notes[1]?'<p class="m-note">'+esc(M.notes[1])+"</p>":"")+(M.limits.length?'<div class="m-limits" aria-label="Límites">'+M.limits.map(function(s){return "<span>"+esc(s)+"</span>";}).join("")+"</div>":"")+"</div>";
  $("#mentorView").innerHTML='<div class="mentorv">'+h+"</div>";
  $$("[data-copy]").forEach(function(btn){btn.addEventListener("click",function(){var el=document.getElementById(btn.getAttribute("data-copy"));function selt(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="Seleccionado";}
    try{navigator.clipboard.writeText(el.textContent).then(function(){btn.textContent="Copiado";setTimeout(function(){btn.textContent="Copiar";},1600);},selt);}catch(e){selt();}});});
})();

/* ---------- reader sheet ---------- */
var cur=null;
function neighbours(id){var k=ORDER.indexOf(id);return {prev:ORDER[k-1],next:ORDER[k+1]};}
function where(x){if(x.id===0)return CFG.welcomeLabel||"Bienvenida";if(isStep(x.id)){var a=actOf(x.id);return label(x.id)+" de "+N+(a&&a.name!=="Clases"?", "+a.name:"");}return x.kicker;}
function sheetHTML(x){
  var b=lessonBody(x.body),nb=neighbours(x.id),s=seen.has(x.id),nx=nb.next!==undefined?L(nb.next):null;
  var num=isStep(x.id)?(SKIN.readerNum?SKIN.readerNum(x,CTX):String(x.id)):null;
  var turn=b.tasks.length?'<section class="turn"><h3>Tu turno</h3>'+b.tasks.map(function(t){return '<div class="task"><h4>'+esc(t.title)+"</h4>"+t.html+"</div>";}).join("")+
    '<label class="nb-l" for="nb">Tu cuaderno</label><textarea id="nb" placeholder="Escribe aquí tu ejercicio. Se guarda en este dispositivo."></textarea><span class="saved" id="nbs"></span></section>':"";
  return '<div class="grab" id="grab"><span class="where">'+esc(where(x))+'</span><button type="button" class="x" id="closeB">Cerrar</button></div><div class="scroll" id="scroll">'+
    '<div class="r-head'+(num?"":" nonum")+'">'+(num?'<span class="r-num" aria-hidden="true">'+esc(num)+"</span>":"")+'<p class="r-k">'+esc(isStep(x.id)?label(x.id):(x.id===0?(CFG.welcomeLabel||"Bienvenida"):x.kicker))+'</p><h1 class="r-title" id="rTitle">'+esc(ttl(x))+'</h1></div><p class="r-topic">'+esc(x.topic)+'</p><p class="r-intro">'+inline(esc(x.intro))+'</p><div class="lesson-body">'+b.html+"</div>"+turn+
    '<div class="r-foot"><div class="nav"><button class="btn" type="button" id="prevB" '+(nb.prev===undefined?"disabled":"")+'>Anterior</button><button class="btn solid" type="button" id="nextB" '+(nb.next===undefined?"disabled":"")+">Siguiente</button></div>"+
    (isStep(x.id)?'<button class="btn'+(s?" done":"")+'" type="button" id="seenB" aria-pressed="'+s+'">'+(s?"Completada ✓":"Marcar como completada")+"</button>":"")+
    (nx?'<p class="r-next">Sigue: '+esc(ttl(nx))+"</p>":"")+"</div></div>";
}
function openLesson(id,trigger){
  var x=L(id);if(!x)return;
  var fresh=!cur;
  if(fresh){
    var scrim=document.createElement("div");scrim.className="scrim";var sh=document.createElement("div");sh.className="sheet";sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");sh.setAttribute("aria-labelledby","rTitle");
    document.body.appendChild(scrim);document.body.appendChild(sh);document.body.classList.add("sheet-open");
    cur={scrim:scrim,sh:sh,trigger:trigger||document.activeElement};
    scrim.onclick=closeLesson;
  }
  cur.id=id;cur.sh.innerHTML=sheetHTML(x);
  var sh=cur.sh;
  if(fresh)requestAnimationFrame(function(){requestAnimationFrame(function(){sh.classList.add("on");cur&&cur.scrim.classList.add("on");});});
  $("#closeB",sh).onclick=closeLesson;$("#closeB",sh).focus({preventScroll:true});
  var nb=neighbours(id);
  $("#prevB",sh).onclick=function(){openLesson(nb.prev);};
  $("#nextB",sh).onclick=function(){if((isStep(id)||id===0)&&!seen.has(id)){seen.add(id);saveSeen();refresh();}openLesson(nb.next);};
  var sb=$("#seenB",sh);if(sb)sb.onclick=function(){seen.has(id)?seen.delete(id):seen.add(id);saveSeen();var on=seen.has(id);sb.textContent=on?"Completada ✓":"Marcar como completada";sb.classList.toggle("done",on);sb.setAttribute("aria-pressed",String(on));refresh();};
  var ta=$("#nb",sh);if(ta){ta.value=notes[id]||"";var t;ta.oninput=function(){clearTimeout(t);t=setTimeout(function(){notes[id]=ta.value;store.set(CFG.key+"-notes",notes);$("#nbs",sh).textContent="Guardado en este dispositivo";},400);};}
  $("#scroll",sh).scrollTop=0;
  try{history.replaceState(null,"","#clase-"+id);}catch(e){}
  var g=$("#grab",sh),y0=null,dy=0,t0=0;
  g.addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;y0=e.clientY;dy=0;t0=performance.now();sh.classList.add("drag");try{g.setPointerCapture(e.pointerId);}catch(_){}});
  g.addEventListener("pointermove",function(e){if(y0==null)return;dy=e.clientY-y0;sh.style.transform="translateY("+(dy<0?dy*.15:dy)+"px)";});
  function end(){if(y0==null)return;var v=dy/Math.max(1,performance.now()-t0);sh.classList.remove("drag");sh.style.transform="";y0=null;if(dy>140||v>.5)closeLesson();}
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
}
function closeLesson(){
  if(!cur)return;var c=cur;cur=null;document.body.classList.remove("sheet-open");
  c.sh.classList.remove("on");c.scrim.classList.remove("on");setTimeout(function(){c.sh.remove();c.scrim.remove();},reduce?0:500);
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  var t=document.querySelector('#progView [data-open="'+c.id+'"]')||c.trigger;if(t&&t.focus)t.focus({preventScroll:false});
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&cur)closeLesson();});

/* ---------- boot ---------- */
renderCats();renderFaq();refresh();
var hm=(location.hash||"").replace("#",""),hh=hm.match(/clase-(\d+)/);
if(hh&&L(+hh[1]))openLesson(+hh[1]);else if(hm==="mentor"||hm==="mentora")setTab("M");else if(hm==="preguntas")setTab("F");
})();
