<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:3px}
.wrap{max-width:var(--maxw,1040px);margin:0 auto;padding-inline:16px;padding-block:0 64px;display:flex;flex-direction:column;gap:var(--gap,28px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.press{transition:transform .16s cubic-bezier(.23,1,.32,1)}
.press:active{transform:scale(.97)}

/* tabs */
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:center;margin-inline:-16px;padding:10px 16px}
.tabbar::before{content:"";position:absolute;inset:0;background:var(--bg);opacity:.94;z-index:-1}
.tabs{display:flex;gap:4px;max-width:100%;overflow-x:auto;padding:4px;border-radius:var(--tabs-r,999px);background:var(--surface);border:1px solid var(--line)}
.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:15px;padding:10px 18px;border-radius:var(--tabs-r,999px);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* shared buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:15px;padding:12px 18px;border-radius:var(--btn-r,999px);cursor:pointer;text-decoration:none;transition:transform .16s cubic-bezier(.23,1,.32,1)}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.35;cursor:default}

/* section heads (faq + mentor) */
.sec-h{margin:0;font:var(--h2-font);letter-spacing:var(--h2-track,-.01em);text-wrap:balance}
.sec-p{margin:8px 0 0;color:var(--muted);max-width:56ch}

/* faq */
.faqv{display:flex;flex-direction:column;gap:16px;max-width:780px}
.f-search{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--field-r,999px);padding:0 18px}
.f-search svg{width:20px;height:20px;flex:none;color:var(--muted)}
.f-search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:17px/1.3 var(--body);padding:14px 0}
.f-search input:focus{outline:none}
.f-search:focus-within{border-color:var(--accent)}
.f-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.f-count{margin:0;color:var(--muted);font-size:14px}
.fgroup h3{margin:18px 0 8px;font:var(--h3-font)}
details.qa{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,16px);margin-bottom:8px}
details.qa summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 18px;font-weight:600;font-size:16.5px;line-height:1.35}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary i{flex:none;font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink);transition:transform .2s cubic-bezier(.23,1,.32,1)}
details.qa[open] summary i{transform:rotate(45deg);background:var(--accent);color:var(--accent-ink)}
.ans{padding:0 18px 18px}
.ans p{margin:0 0 .7em;max-width:64ch}.ans p:last-child{margin:0}
.ans ul,.ans ol{margin:0 0 .8em;padding-left:1.3em}
.ans .go{margin-top:10px}
mark{background:var(--mark,rgba(255,200,0,.35));color:inherit;border-radius:3px;padding:0 2px}

/* mentor */
.mentorv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 40px;align-items:start}
@media (max-width:780px){.mentorv{grid-template-columns:minmax(0,1fr)}}
.m-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.m-can{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.m-can li{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,16px);padding:14px 16px}
.m-can b{display:block;font-weight:700}
.m-can span{color:var(--muted);font-size:15px}
.m-dl{display:flex;flex-wrap:wrap;gap:10px}
.m-note{margin:0;color:var(--muted);font-size:14px}
.m-h{margin:0;font:var(--h3-font)}
.m-steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.m-steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:baseline}
.m-steps li::before{counter-increment:s;content:counter(s);font:var(--num-font,700 22px/1 var(--display));color:var(--accent-text,var(--accent))}
.m-prompts{display:grid;gap:8px}
.m-prompt{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,14px);padding:10px 12px 10px 16px}
.m-prompt q{quotes:none;min-width:0;font-size:15.5px}
.m-prompt .btn{padding:8px 14px;font-size:13.5px;flex:none}
.m-limits{display:flex;flex-wrap:wrap;gap:8px}
.m-limits span{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted)}
footer.foot{text-align:center;font-size:14px;color:var(--muted);padding-top:20px}

/* ---------- reader sheet (the lights come on) ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;transition:opacity .45s cubic-bezier(.32,.72,0,1)}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;top:calc(12px + env(safe-area-inset-top,0px));margin:0 auto;max-width:800px;background:var(--r-bg);color:var(--r-ink);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:0 -12px 50px rgba(0,0,0,.35);font-family:var(--r-body,var(--body))}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{flex:none;touch-action:none;cursor:grab;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 14px 10px 20px;border-bottom:1px solid var(--r-line);position:relative}
.grab::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--r-line)}
.grab .where{font-size:14px;font-weight:600;color:var(--r-muted);padding-top:8px}
.grab .x{border:1px solid var(--r-line);background:transparent;color:var(--r-ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;margin-top:6px}
.sheet :focus-visible{outline:2px solid var(--r-accent);outline-offset:3px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:clamp(22px,5vw,48px) clamp(18px,5vw,56px) calc(56px + env(safe-area-inset-bottom,0px))}
.r-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:end;margin-bottom:18px}
.r-head.nonum{grid-template-columns:minmax(0,1fr)}
.r-num{grid-row:span 2;font:var(--r-num-font,800 96px/.8 var(--display));color:var(--r-accent);font-variant-numeric:tabular-nums}
.r-k{margin:0;font-size:14.5px;font-weight:600;color:var(--r-accent)}
.r-title{margin:0;font:var(--r-title-font,700 clamp(32px,6.5vw,48px)/1 var(--display));letter-spacing:var(--r-title-track,-.01em);text-wrap:balance}
.r-topic{margin:0 0 18px;font-size:20px;line-height:1.35;color:var(--r-muted)}
.r-intro{font-size:20px;line-height:1.5;margin:0 0 26px;padding-bottom:24px;border-bottom:1px solid var(--r-line)}
.lesson-body p,.lesson-body li{max-width:66ch}
.lesson-body p{margin:0 0 .9em}
.lesson-body ul,.lesson-body ol{margin:0 0 1em;padding-left:1.3em}
.lesson-body li{margin:.4em 0}
.lesson-body li::marker{color:var(--r-accent);font-weight:700}
.lesson-body strong{font-weight:700}
.lesson-body h3{font:var(--r-h3-font,700 26px/1.15 var(--display));margin:36px 0 10px;text-wrap:balance}
.callout{margin:28px 0;padding:22px 24px;border-radius:var(--card-r,18px);background:var(--r-callout-bg);color:var(--r-callout-ink)}
.callout p{margin:0;font:var(--r-callout-font,700 clamp(22px,4.6vw,28px)/1.2 var(--display));max-width:34ch;text-wrap:balance}
.turn{margin-top:40px;padding-top:26px;border-top:2px solid var(--r-ink);display:grid;gap:12px}
.turn h3{margin:0;font:var(--r-h3-font,700 26px/1.15 var(--display))}
.task{background:var(--r-surface);border:1px solid var(--r-line);border-radius:var(--card-r,16px);padding:16px 18px}
.task h4{margin:0 0 6px;font-size:17px}
.task p:last-child,.task ul:last-child,.task ol:last-child{margin-bottom:0}
.nb-l{font-weight:600;font-size:14px;color:var(--r-muted);margin-top:6px}
.sheet textarea{width:100%;min-height:150px;resize:vertical;font:16px/1.55 var(--r-body,var(--body));color:var(--r-ink);background:var(--r-surface);border:1px solid var(--r-line);border-radius:12px;padding:14px 16px}
.saved{font-size:13px;color:var(--r-muted);min-height:1.2em}
.r-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:34px;padding-top:22px;border-top:1px solid var(--r-line)}
.r-foot .nav{display:flex;gap:8px;flex-wrap:wrap}
.sheet .btn{border-color:var(--r-line);color:var(--r-ink)}
.sheet .btn.solid{background:var(--r-ink);border-color:var(--r-ink);color:var(--r-bg)}
.sheet .btn.done{background:var(--r-accent);border-color:var(--r-accent);color:var(--r-accent-ink,var(--r-bg))}
.r-next{width:100%;margin:0;font-size:14px;color:var(--r-muted)}
body.sheet-open{overflow:hidden}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.mentorv .sec-h{font-size:clamp(28px,6.4vw,46px)}
/* Todavía: the Portuguese cover of the book. Cream paper, heavy black geometric type, a thin subtitle and a paper-cut brain of wavy colored layers. The one moment: each class you finish gives one layer of the brain its color. */
:root{
  --bg:#F3F0EA; --surface:#FBF9F5; --ink:#18171A; --muted:#5D5A57; --line:#DCD6CC; --accent:#18171A; --accent-ink:#F3F0EA; --focus:#22408F; --mark:rgba(226,55,142,.22);
  --empty:#E6E0D5; --empty-2:#DDD6C9; --shade:rgba(40,30,20,.28);
  --display:"Montserrat","Arial Black",system-ui,sans-serif; --body:"Montserrat",system-ui,-apple-system,sans-serif;
  --h2-font:900 clamp(30px,6.4vw,50px)/.98 var(--display); --h3-font:800 21px/1.15 var(--display); --num-font:900 22px/1 var(--display);
  --r-bg:#FBF9F5; --r-surface:#FFFFFF; --r-ink:#18171A; --r-muted:#5D5A57; --r-line:#E6E0D5; --r-accent:#22408F; --r-accent-ink:#FFFFFF; --r-callout-bg:#18171A; --r-callout-ink:#F3F0EA;
  --r-num-font:900 clamp(76px,16vw,116px)/.8 var(--display); --r-title-font:900 clamp(28px,5.8vw,42px)/1.02 var(--display); --r-h3-font:800 22px/1.15 var(--display); --r-callout-font:700 clamp(20px,4.2vw,25px)/1.3 var(--display);
  --card-r:14px; --tabs-r:999px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161513; --surface:#201F1C; --ink:#F2EEE6; --muted:#ABA59B; --line:#34322D; --accent:#F2EEE6; --accent-ink:#161513; --focus:#8CC0DC; --mark:rgba(226,55,142,.35);
  --empty:#2B2925; --empty-2:#24221E; --shade:rgba(0,0,0,.55);
  --r-bg:#1B1A17; --r-surface:#24221F; --r-ink:#F2EEE6; --r-muted:#ABA59B; --r-line:#34322D; --r-accent:#8CC0DC; --r-accent-ink:#161513; --r-callout-bg:#F2EEE6; --r-callout-ink:#161513;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#161513; --surface:#201F1C; --ink:#F2EEE6; --muted:#ABA59B; --line:#34322D; --accent:#F2EEE6; --accent-ink:#161513; --focus:#8CC0DC; --mark:rgba(226,55,142,.35);
  --empty:#2B2925; --empty-2:#24221E; --shade:rgba(0,0,0,.55);
  --r-bg:#1B1A17; --r-surface:#24221F; --r-ink:#F2EEE6; --r-muted:#ABA59B; --r-line:#34322D; --r-accent:#8CC0DC; --r-accent-ink:#161513; --r-callout-bg:#F2EEE6; --r-callout-ink:#161513;
  color-scheme:dark;
}
body{font-size:16.5px}
.sec-h{letter-spacing:-.02em;text-transform:uppercase}
.tabs{background:transparent;border:1.5px solid var(--ink);padding:3px}
.tab{color:var(--ink);font-weight:600}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.chip{background:transparent;border-color:var(--line);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border-color:var(--ink);font-weight:700}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
details.qa summary i{background:var(--bg)}
details.qa[open] summary i{background:var(--ink);color:var(--bg)}
.lesson-body h4{font-size:16.5px;margin:22px 0 6px}
.callout{border-radius:4px;margin-bottom:40px;box-shadow:0 5px 0 #E2378E,0 10px 0 #F5C918,0 15px 0 #17A5B3}

/* hero: the cover */
.t-hero{display:grid;justify-items:center;text-align:center;gap:14px;padding-block:44px 6px}
.t-pre{margin:0;font:300 clamp(14px,2.2vw,17px)/1.4 var(--body);letter-spacing:.01em}
.t-mark{margin:4px 0 0;font:900 clamp(56px,15vw,150px)/.86 var(--display);letter-spacing:-.025em;text-transform:uppercase;color:var(--ink)}
.t-sub{margin:0;font:300 clamp(20px,4.6vw,38px)/1.15 var(--display);letter-spacing:-.01em}
.t-brain{margin:14px 0 0;width:min(470px,100%)}
.t-brain svg{display:block;width:100%;height:auto;overflow:visible}
.t-brain .layer{transition:fill .8s cubic-bezier(.65,0,.35,1)}
.t-brain figcaption{font-size:13.5px;color:var(--muted);margin-top:6px}
.t-pitch{margin:6px 0 0;max-width:46ch;color:var(--muted);font-size:17px;line-height:1.55}
.t-cta{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
.t-cta .btn{padding:15px 26px;font-size:16px}
.t-status{margin:0;font-size:14px;color:var(--muted);font-weight:500}

/* route */
.t-route{display:grid;gap:46px;max-width:800px;margin:0 auto;width:100%}
.t-part{display:grid;gap:14px}
.t-part > div:first-child{display:grid;gap:2px}
.t-part .sec-h small{display:block;font:500 14px/1.2 var(--body);letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.t-welcome{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;text-align:left;background:var(--ink);color:var(--bg);border:0;border-radius:var(--card-r);padding:20px 22px;margin-bottom:10px;cursor:pointer;transition:transform .16s cubic-bezier(.23,1,.32,1);box-shadow:0 5px 0 #E2378E,0 10px 0 #F5C918}
.t-welcome:active{transform:scale(.98)}
.t-welcome small{display:block;font-size:13px;font-weight:500;opacity:.8}
.t-welcome b{display:block;font:900 24px/1.05 var(--display);text-transform:uppercase;margin:4px 0}
.t-welcome span span{display:block;font-size:14.5px;line-height:1.45;opacity:.85}
.t-welcome.seen small::after{content:" · vista ✓"}
.t-arr{font:300 30px/1 var(--display);flex:none}
.t-list{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.t-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:15px 4px;cursor:pointer;color:var(--ink);transition:transform .16s cubic-bezier(.23,1,.32,1),background-color .2s}
.t-row:active{transform:scale(.985)}
@media (hover:hover){.t-row:hover{background:var(--surface)}}
.t-row .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 17px/1 var(--display);background:var(--empty);color:var(--muted);justify-self:center}
.t-row b{display:block;font-weight:700;font-size:16.5px;line-height:1.3}
.t-row small{display:block;color:var(--muted);font-size:14px;line-height:1.4;margin-top:2px}
.t-row .st{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.t-row.seen .n{background:var(--c);color:var(--ci)}
.t-row.seen .st{color:var(--muted);padding-inline:0}
.t-row.next{background:var(--surface);border-radius:var(--card-r);border-bottom-color:transparent;padding-inline:8px 14px;margin-block:4px;box-shadow:inset 0 0 0 1.5px var(--ink)}
.t-row.next .n{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 3px var(--c)}
.t-row.next .st{background:var(--ink);color:var(--bg)}
.t-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.t-tool{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r);padding:15px 16px;cursor:pointer;color:var(--ink);transition:transform .16s cubic-bezier(.23,1,.32,1)}
.t-tool:active{transform:scale(.98)}
.t-tool b{display:block;font-weight:700}
.t-tool small{color:var(--muted);font-size:14px}
.r-title:focus{outline:none}
footer.foot{max-width:62ch;margin:0 auto;font-size:13px;line-height:1.5}

</style>

var LESSONS_MD="@@ 0 | Empieza aquí | Bienvenida a Todavía | El curso en 5 minutos\nHay una palabra que cambia todo lo que dices de ti. Se pone al final de la frase y la abre: no me sale… todavía.\n\n## De qué se trata\nEste curso es sobre una sola idea, pero es de esas que, una vez que la ves, la ves en todos lados: **lo que crees de tus capacidades decide lo que te atreves a intentar**.\n\nSi crees que tu talento, tu inteligencia o tu forma de ser vienen de fábrica y ya, cada reto se vuelve un examen. Cada venta, cada en vivo, cada junta con tu equipo te dice si \"sirves\" o \"no sirves\". Y para no reprobar, mejor ni lo intentas.\n\nSi crees que esas cosas se pueden desarrollar, el mismo reto se vuelve una clase. No te dice quién eres; te dice qué te falta aprender. Y eso tiene arreglo.\n\n> No te pregunto si eres buena para esto. Te pregunto si quieres aprenderlo.\n\n## De dónde sale\nLas ideas de este curso vienen de décadas de investigación en psicología sobre cómo las personas enfrentan los retos y los fracasos. Aquí las contamos con palabras sencillas y las aterrizamos a lo que vivimos en el equipo: vender, crear contenido, liderar, criar y querer.\n\n## Cómo está armado\n- **Entiende (clases 1 a 4).** Las dos formas de verte, qué cambia cuando buscas aprender en lugar de demostrar, qué significa fallar y para qué sirve el esfuerzo.\n- **En tu vida (clases 5 a 8).** Las etiquetas que te pusieron (y las que te pones), tu negocio y tu liderazgo, tus relaciones y lo que les enseñas a tus hijas y a tu equipo sin decirlo.\n- **Cambia (clases 9 y 10).** Cómo conocer a tu voz de \"no puedes\", ponerle nombre y llevártela de viaje, y cómo convertir todo esto en un plan con día, hora y lugar.\n- **Herramientas.** Un test para saber dónde estás, la tabla de las dos mentalidades, frases de cambio y tu plan de la semana.\n\n## Antes de empezar\nNadie tiene una sola mentalidad. Todas somos una mezcla, y cambia según el tema: puedes ser muy abierta para aprender a maquillar y muy cerrada para los números. Este curso no es para que te califiques. Es para que te cachen las veces que tú misma te cierras la puerta.\n\nY una aclaración honesta: creer que puedes crecer no garantiza resultados. Las personas tienen distintos recursos, tiempos y apoyos. Lo que sí cambia es que dejas de rendirte antes de intentarlo.\n\n## 🪞 Para pensar\n¿Qué frase de \"yo no soy buena para…\" repites tanto que ya ni la escuchas?\n\n## ✍️ Escribe\nEscribe tres frases que digas de ti que empiecen con \"No soy buena para…\" o \"No sé…\". Guárdalas. Al final del curso vas a regresar a ellas.\n\n@@ 1 | Entiende | Clase 1 · Dos formas de verte | ¿Piedra o semilla?\nHay dos maneras de ver tus capacidades, y cada una te lleva por un camino distinto aunque empieces en el mismo lugar.\n\n## Grabado en piedra\nLa primera dice que tus cualidades están grabadas en piedra. Naciste con cierta inteligencia, cierto carisma, cierto \"don\" para vender, y eso es lo que hay. A esta forma de ver la vamos a llamar **mentalidad fija**.\n\nSuena inofensivo, pero tiene una consecuencia enorme: si solo tienes una cantidad de talento, más te vale demostrar que tienes mucho. Entonces cada situación se vuelve una prueba. ¿Voy a quedar como lista o como tonta? ¿Me van a aceptar o rechazar? ¿Soy ganadora o perdedora?\n\n## Una semilla\nLa segunda dice que lo que tienes hoy es tu punto de partida. Tus cualidades se pueden cultivar con esfuerzo, con buenas estrategias y con ayuda de otras. A esta la llamamos **mentalidad de crecimiento**.\n\nOjo: no dice que cualquiera puede ser cualquier cosa. Dice algo más humilde y más poderoso: **nadie sabe de qué eres capaz** hasta que le dedicas años de ganas, práctica y aprendizaje. Muchas personas que hoy admiramos fueron niñas torpes, alumnas del montón o principiantes a las que les dijeron \"esto no es lo tuyo\".\n\n> Las cartas que te tocaron no son tu destino. Son tu punto de partida.\n\n## Un mal día, dos lecturas\nImagina este día. En la mañana te cancelan un pedido grande que ya dabas por hecho. A mediodía ves que tu video de ayer casi no tuvo vistas. En la tarde le escribes a tu mejor amiga para desahogarte y te contesta seco, con un \"ah, qué mal\".\n\nDesde la mentalidad fija, el día se lee así: \"No sirvo para esto. A todas les va mejor que a mí. Ni mi amiga me quiere.\" Y lo que sigue es encerrarse: no publicar nada, no volver a ofrecer, comerse un pan entero y dormirse temprano.\n\nDesde la mentalidad de crecimiento, el mismo día duele igual, pero se lee distinto: \"¿Qué pasó con ese pedido? Le escribo mañana para entender. Ese video tenía un inicio lento; pruebo otro gancho. Mi amiga seguro tuvo un mal día; la busco el fin de semana.\"\n\nFíjate: no pasó nada grave. Un pedido, un video y un mensaje seco. Pero la mentalidad fija convirtió eso en una sentencia sobre quién eres.\n\n## Lo que más sorprende\nLas personas con mentalidad de crecimiento se conocen mejor. Cuando quieres aprender, necesitas saber con honestidad qué te sale bien y qué no. En cambio, cuando cada resultado es una calificación de tu valor, empiezas a maquillar la verdad: lo bueno lo haces enorme, lo malo lo explicas con pretextos. Y al final ya no sabes dónde estás parada.\n\n## 🪞 Para pensar\nPiensa en una persona que conozcas que siempre necesita tener la razón y se ofende con cualquier comentario. Ahora piensa en alguien que siempre está aprendiendo algo nuevo. ¿A cuál te pareces más cuando las cosas salen mal?\n\n## ✍️ Escribe\nRecuerda tu último mal día de negocio. Escribe cómo lo leíste en ese momento. Luego reescríbelo como lo leería alguien con mentalidad de crecimiento: qué pasó, qué puedes aprender y qué harías mañana.\n\n## ✅ Esta semana\nHaz el test de la herramienta \"¿Qué mentalidad tienes?\" y fíjate en qué temas eres más fija.\n\n## 💬 En el grupo\nComparte una cosa que hoy haces bien y que antes \"no era lo tuyo\".\n\n@@ 2 | Entiende | Clase 2 · Demostrar o aprender | Qué buscas cuando buscas el éxito\nLas dos mentalidades no solo ven distinto. Quieren cosas distintas.\n\n## Dos metas muy diferentes\nCuando a unas niñas les dieron a elegir entre repetir un rompecabezas fácil o intentar uno más difícil, pasó algo muy revelador. Las de mentalidad fija eligieron el fácil: así no se arriesgaban a parecer menos listas. Las de mentalidad de crecimiento no entendían la pregunta: ¿para qué harías el mismo otra vez si no aprendes nada?\n\nDe grandes hacemos lo mismo, solo que con otros rompecabezas. Ofrecemos solo a las clientas de siempre. Grabamos solo el tipo de video que ya nos sale. No levantamos la mano para dar la capacitación porque \"¿y si me trabo?\".\n\n> En la mentalidad fija, el éxito es demostrar que eres lista. En la de crecimiento, el éxito es volverte más lista.\n\n## ¿Cuándo te sientes capaz?\nPregúntate esto: ¿te sientes capaz cuando todo te sale perfecto y rápido, o cuando por fin entiendes algo que te costó?\n\nSi es lo primero, cuidado. Esa sensación te va a alejar de todo lo nuevo, porque lo nuevo nunca sale perfecto ni rápido. Las de mentalidad de crecimiento disfrutan justo el momento en que algo cuesta, porque saben que ahí es donde están creciendo.\n\n## La enfermedad de la jefa\nHay líderes que se rodean solo de gente que les dice que todo está increíble. No quieren malas noticias, no quieren críticas, no quieren a nadie que brille más que ellas. Se sienten seguras por un rato, pero dejan de aprender, y su negocio se estanca con ellas.\n\nEsto también nos pasa en chiquito. Cuando solo escuchas a quien te aplaude y te alejas de quien te dice \"esto se puede mejorar\", te estás haciendo un mundo donde eres perfecta… y donde nunca vas a crecer.\n\n## Una calificación no es para siempre\nEn la mentalidad fija, un resultado te marca. Un mes malo dice que no sirves para esto. Una prueba reprobada dice que no eres inteligente. En la mentalidad de crecimiento, un resultado dice dónde estás hoy, no hasta dónde puedes llegar.\n\n## 🪞 Para pensar\n¿Hay algo que dejaste de intentar porque al principio no te salió bien y te dio pena que te vieran aprendiendo?\n\n## ✍️ Escribe\nHaz dos columnas. En una, escribe las cosas que haces en tu negocio \"porque ya me salen\". En la otra, las que evitas \"porque no me salen\". Elige una de la segunda columna para practicar este mes.\n\n## ✅ Esta semana\nPídele a alguien de confianza que te diga una cosa que podrías mejorar en tus videos o en tu forma de vender. Solo escucha y da las gracias.\n\n## 💬 En el grupo\nCuenta algo que estés aprendiendo ahorita, aunque todavía no te salga.\n\n@@ 3 | Entiende | Clase 3 · Fallar no es ser un fracaso | Lo que significa equivocarte\nHay una diferencia enorme entre \"fallé\" y \"soy un fracaso\". La primera es algo que pasó. La segunda es algo que crees que eres.\n\n## Cuando el error se vuelve identidad\nEn la mentalidad fija, un fracaso no se queda en el hecho. Se mete hasta adentro y se vuelve tu nombre. No es \"esa presentación me salió mal\"; es \"soy malísima para hablar en público\". No es \"esa clienta no me compró\"; es \"no sirvo para vender\".\n\nY como duele tanto, la mente busca salidas. Algunas son conocidas:\n- **Echarle la culpa a algo o a alguien.** \"Es que la plataforma no me mueve los videos.\" \"Es que la gente no tiene dinero.\"\n- **Compararte hacia abajo.** Buscar a alguien a quien le fue peor para sentirte mejor.\n- **Hacer trampa o atajos.** Inflar números, aparentar que vendes más de lo que vendes.\n- **Ya no intentarlo.** Si no lo intento, no puedo fallar.\n\n## El fracaso como información\nEn la mentalidad de crecimiento, fallar también duele. Nadie está brincando de gusto. Pero el fracaso se vuelve información: me dice qué no funcionó, qué no sé todavía y qué puedo probar después.\n\n> Fallar es un evento. Rendirte es una decisión.\n\n## Cuando te sientes mal\nAlgo que mostró la investigación: cuando estaban tristes o deprimidas, las personas con mentalidad fija soltaban todo. Dejaban de hacer la tarea, de ir a clase, de cuidar sus cosas. Las de mentalidad de crecimiento, aunque se sintieran igual de mal, hacían lo contrario: mientras peor se sentían, más se aferraban a lo que tenían que hacer, porque era lo que las iba a sacar.\n\nNo se trata de sentirte bien a fuerza. Se trata de que el bajón no decida por ti.\n\n## Un momento que te marcó\nCasi todas tenemos un momento que sentimos que nos midió: un examen, un despido, una ruptura, una venta grande que se cayó, un comentario que nos dejó marcadas. La pregunta no es si duele. La pregunta es si lo dejas como sentencia o lo conviertes en escalón.\n\n## 🪞 Para pensar\n¿Qué fracaso de tu pasado todavía sientes que dice quién eres?\n\n## ✍️ Escribe\nEscribe ese momento. Luego responde: ¿qué parte fue responsabilidad mía?, ¿qué aprendí o puedo aprender?, ¿cómo puedo usarlo para crecer? Termina con una frase que empiece con \"Eso pasó, pero no dice que yo…\".\n\n## ✅ Esta semana\nLa próxima vez que algo te salga mal, antes de explicarlo con un pretexto, escribe una cosa que harías distinto.\n\n## 💬 En el grupo\nComparte un error de tu negocio que te haya enseñado algo útil.\n\n@@ 4 | Entiende | Clase 4 · El mito de la natural | Esfuerzo, estrategia y ayuda\n\"Es que ella nació para vender.\" Esa frase nos quita más de lo que creemos.\n\n## El esfuerzo, visto desde las dos mentalidades\nEn la mentalidad fija, el esfuerzo es mala señal. Si de verdad tuvieras talento, no tendrías que esforzarte tanto. Entonces, cuando algo cuesta, en lugar de pensar \"estoy aprendiendo\", piensas \"esto no es lo mío\".\n\nEn la mentalidad de crecimiento, el esfuerzo es lo que hace que el talento crezca. Nadie que admiras llegó sin él. Detrás de la que \"nació para vender\" hay cientos de conversaciones incómodas, mensajes sin respuesta y videos que nadie vio.\n\n> Lo que ves en otras es el resultado. Lo que no ves son las horas.\n\n## El riesgo de no esforzarte\nHay una trampa muy común: no echarle todas las ganas para tener un pretexto. Si no me sale, \"es que ni le dediqué tiempo\". Así proteges tu imagen, pero pagas un precio alto: nunca vas a saber de qué eras capaz. Muchas personas prefieren guardarse esa duda antes que arriesgarse a descubrir que no les salió. Esa protección sale carísima.\n\n## No es solo echarle ganas\nCuidado con el otro extremo. Esforzarte más con la misma estrategia que no funciona solo te cansa. Crecer es tres cosas juntas:\n- **Esfuerzo:** dedicarle tiempo y práctica de verdad.\n- **Estrategia:** cambiar la forma cuando algo no da resultado. Otro horario, otro gancho, otra manera de ofrecer.\n- **Ayuda:** preguntarle a quien ya sabe. Pedir que te revisen un video, acompañar a tu líder a una cita, ver cómo lo hace otra.\n\n## Carácter de campeona\nEn los deportes se habla mucho del carácter: esa capacidad de sacar lo mejor cuando el partido se pone difícil. El carácter no viene de nacimiento; se construye cada vez que eliges seguir cuando lo fácil sería rendirte.\n\nY algo más: para las campeonas con mentalidad de crecimiento, el éxito no es solo ganar. Es haber dado todo y haber aprendido algo. Por eso siguen disfrutando lo que hacen aunque un mes no sea el mejor.\n\n## 🪞 Para pensar\n¿A quién admiras y le atribuyes un \"don\"? ¿Sabes cuánto trabajo hay detrás de lo que hace?\n\n## ✍️ Escribe\nElige a esa persona y escríbele (o pregúntale, si la conoces): ¿qué te costó más al principio?, ¿qué hiciste para mejorar? Anota tres cosas de su proceso que podrías copiar.\n\n## ✅ Esta semana\nElige una habilidad de tu negocio y para cada una de las tres partes escribe una acción: un rato de práctica, una estrategia nueva y una persona a quien pedirle ayuda.\n\n## 💬 En el grupo\nPregúntale a una compañera del equipo qué hace para que le salga algo que a ti te cuesta.\n\n@@ 5 | En tu vida | Clase 5 · Las etiquetas | Elogios, prejuicios y lo que te dices\nAlgunas etiquetas duelen. Otras suenan bonito. Las dos te pueden encerrar.\n\n## El elogio que encierra\nEn un estudio, a un grupo de niños les pusieron unos problemas y luego los felicitaron. A unos les dijeron \"qué inteligente eres\". A otros, \"qué bien le echaste ganas\".\n\nLo que pasó después fue impresionante. Los que oyeron \"qué inteligente\" empezaron a evitar los retos para no perder esa etiqueta. Cuando les tocaron problemas difíciles, se desanimaron y su desempeño cayó. Hasta exageraban sus calificaciones al contarlas. Los que oyeron \"le echaste ganas\" querían problemas más difíciles, disfrutaban más y mejoraban.\n\nDecirle a alguien que es lista o talentosa parece que le da seguridad. En realidad le enseña que su valor depende de no equivocarse nunca.\n\n> Elogia lo que hizo, no lo que es: su estrategia, su práctica, sus decisiones.\n\n## Las etiquetas negativas\nLuego están las etiquetas que pesan: \"las mujeres no son buenas para los números\", \"en tu familia nadie ha tenido negocio\", \"tú eres la tímida\". Cuando una persona carga una etiqueta así y se pone en una situación donde se podría confirmar, rinde menos solo por la presión de pensar en ella.\n\nLa mentalidad de crecimiento no borra los prejuicios, pero les quita fuerza. Si sabes que las habilidades se aprenden, la etiqueta deja de ser una sentencia y se vuelve una opinión que puedes contradecir.\n\n## ¿Pertenezco aquí?\nMuchas mujeres entran a un mundo nuevo (un negocio, una carrera, un equipo de líderes) y en cuanto algo sale mal piensan \"yo no pertenezco aquí\". Esa duda aparece más en quien ya carga una etiqueta. Si te pasa, recuerda: todas las que están ahí también tuvieron que aprender.\n\n## Las que te pones tú\nLas etiquetas más difíciles de quitar son las que te pones tú: \"es que yo soy desorganizada\", \"yo no soy de redes\", \"yo soy mala para los números\". Cada una te da permiso de no intentarlo. Agrégale un \"todavía\" y mira qué pasa.\n\n## 🪞 Para pensar\n¿Qué etiqueta te pusieron de niña que todavía cargas? ¿Te ayuda o te detiene?\n\n## ✍️ Escribe\nEscribe tres etiquetas que te pones. A cada una agrégale \"todavía\" y una cosa que podrías hacer para empezar a cambiarla.\n\n## ✅ Esta semana\nCada vez que quieras elogiar a tus hijas o a alguien del equipo, cambia \"qué lista\" o \"qué talentosa\" por algo sobre lo que hizo: \"me encantó cómo preparaste esa presentación\".\n\n## 💬 En el grupo\nFelicita a una compañera por algo concreto que hizo esta semana, no por cómo es.\n\n@@ 6 | En tu vida | Clase 6 · Tu negocio y tu liderazgo | Liderar para que otras crezcan\nUna empresa, o un equipo de venta directa, también tiene mentalidad. Y casi siempre la contagia quien la lidera.\n\n## El culto al talento\nHay empresas que creen tanto en el \"talento nato\" que contratan solo a estrellas, las ponen en un pedestal y les exigen que demuestren todo el tiempo lo brillantes que son. El resultado suele ser desastroso: nadie admite errores, nadie pide ayuda, todos esconden los problemas hasta que explotan.\n\n## Las líderes que crecen\nLas organizaciones que crecen tienen líderes que hacen algo menos vistoso: preguntan, escuchan, admiten lo que no saben y se rodean de gente capaz, aunque sea más capaz que ellas. Dan crédito, no lo acaparan. Y creen que su gente puede mejorar, entonces le enseñan.\n\nHay un dato que lo dice todo: las jefas que creen que las personas pueden crecer dan más retroalimentación útil, notan antes cuando alguien mejora y se toman el tiempo de acompañar. Las que creen que \"una sirve o no sirve\" deciden en la primera impresión y ya no cambian de opinión.\n\n> Una líder con mentalidad fija necesita brillar. Una con mentalidad de crecimiento necesita que su equipo brille.\n\n## El pensamiento de grupo\nCuando todas piensan igual y nadie se atreve a decir \"esto no me late\", se toman malas decisiones. Una buena líder abre la puerta a las ideas distintas y a las críticas constructivas: pide opiniones antes de dar la suya, pregunta \"¿qué se nos está escapando?\" y agradece a quien no está de acuerdo.\n\n## ¿Las líderes nacen o se hacen?\nSe hacen. Y lo mismo pasa con vender, negociar y presentar. En los estudios, quienes creían que negociar se aprende negociaban mejor, sobre todo cuando la cosa se ponía difícil. Si tú crees que tu equipo puede aprender, lo vas a capacitar distinto. Y ellas lo van a notar.\n\n## 🪞 Para pensar\nCuando alguien de tu equipo no da resultados, ¿piensas \"no es para esto\" o \"¿qué le falta aprender?\"?\n\n## ✍️ Escribe\nPiensa en una persona de tu equipo (o en ti misma, si apenas empiezas). Escribe tres cosas que podría aprender y cómo podrías ayudarle con cada una: acompañarla, enseñarle un guion, revisar sus videos.\n\n## ✅ Esta semana\nEn tu próxima junta o llamada de equipo, pregunta primero \"¿qué está funcionando y qué no?\" antes de dar tus ideas. Escucha sin defenderte.\n\n## 💬 En el grupo\nComparte una cosa que aprendiste de alguien de tu equipo, aunque tenga menos tiempo que tú.\n\n@@ 7 | En tu vida | Clase 7 · Amor, amistad y pena | Tus relaciones también aprenden\nLa mentalidad no solo vive en el trabajo. También se mete en la pareja, en las amistades y en la forma en que entras a una fiesta.\n\n## \"Si cuesta, no era\"\nLa mentalidad fija tiene una idea muy romántica y muy dañina del amor: si es el bueno, todo debe fluir. Él debería saber lo que pienso sin decírselo. No deberíamos tener que platicar las cosas. Si hay que trabajarle, es que no era.\n\nLa realidad es que en todas las relaciones hay problemas. Lo que cambia es qué crees que significan.\n\n## Los problemas no son defectos\nDesde la mentalidad fija, un problema se vuelve un defecto de carácter: \"es que él es un egoísta\", \"es que yo soy insoportable\". Y si es un defecto, no hay nada que hacer, solo culpar.\n\nDesde la mentalidad de crecimiento, un problema es algo que se puede platicar y resolver. Las parejas que crecen escuchan las diferencias, hablan con paciencia y se ayudan a ser mejores. Muchas veces los problemas resueltos acercan más que los días sin problemas.\n\n> Una relación sana no es la que no tiene problemas. Es la que aprende a resolverlos.\n\n## Competir con quien quieres\nCuidado con convertir a tu pareja, a tu hermana o a tu amiga en tu competencia: quién gana más, quién tiene más seguidoras, quién es mejor mamá. Querer a alguien también es alegrarte cuando crece.\n\n## La pena\nLa timidez es, muchas veces, miedo a ser juzgada. Desde la mentalidad fija, cada conversación es una evaluación: ¿les caigo bien o no? Desde la de crecimiento, cada conversación es una oportunidad de conocer a alguien y de practicar. La pena no siempre se quita, pero deja de mandar.\n\nEsto le sirve mucho a tu negocio: hablarle a alguien nuevo en un evento o hacer tu primer en vivo es una habilidad social, y las habilidades se practican.\n\n## Después del rechazo\nCuando alguien te rechaza (una pareja, una amiga, una clienta), puedes quedarte con la herida y el coraje, o puedes preguntarte qué aprendiste de lo que quieres y no quieres, perdonar y seguir. Lo segundo no significa que no te dolió. Significa que no te quedas a vivir ahí.\n\n## 🪞 Para pensar\n¿Hay alguien en tu vida a quien le pusiste la etiqueta de \"es así y no va a cambiar\"? ¿Y alguien que te la puso a ti?\n\n## ✍️ Escribe\nPiensa en un problema que se repite en una relación importante. Escríbelo sin culpar a nadie: qué pasa, qué necesita cada quien y qué podrían intentar distinto.\n\n## ✅ Esta semana\nAntes de un evento o de un en vivo, repite: \"vengo a conocer gente y a practicar, no a que me califiquen\".\n\n## 💬 En el grupo\nCuenta una habilidad social que antes te daba pena y hoy ya practicas.\n\n@@ 8 | En tu vida | Clase 8 · Lo que enseñas sin decirlo | Para tus hijas y tu equipo\nLas niñas no aprenden lo que les dices. Aprenden lo que ven que haces cuando las cosas salen mal. Y tu equipo, igual.\n\n## Cada palabra manda un mensaje\n\"Aprendiste rapidísimo, eres un genio.\" \"Qué bonito dibujas, eres una artista.\" Lo decimos con todo el amor, pero el mensaje que llega es: \"te quiero porque eres lista y talentosa\". Y entonces el miedo es: \"si me equivoco, ¿ya no?\".\n\nEl mensaje que sí ayuda es otro: \"eres una persona que está creciendo, y me interesa cómo creces\".\n\n## Cómo reaccionas a los errores\nEsto es lo que más pesa. Cuando tu hija trae una mala calificación, o alguien del equipo tiene un mes flojo, ¿qué haces? Si reaccionas con angustia, con regaño o tratando de que \"no se note\", les enseñas que el error es algo terrible.\n\nSi reaccionas con interés (\"a ver, ¿qué pasó?, ¿qué podemos probar?\"), les enseñas que el error es por donde se aprende.\n\n> Tus hijas no ven la mentalidad que tienes en la cabeza. Ven cómo reaccionas cuando se equivocan.\n\n## Crítica que ayuda\nLa crítica constructiva no es etiquetar (\"eres una desordenada\") ni excusar (\"no pasa nada, no es tu culpa\"). Es ayudar a entender cómo arreglarlo: \"esta parte del video está muy larga; ¿qué tal si la cortas a la mitad?\".\n\n## Exigencia con cariño\nLas mejores maestras y líderes ponen la barra alta y, al mismo tiempo, dan el apoyo para llegar a ella. Bajar la exigencia no sube la autoestima. Subirla sin enseñar cómo, tampoco. Las dos cosas juntas sí.\n\n## La mentalidad de crecimiento de mentiras\nOjo con tres confusiones muy comunes:\n- **Creer que es ser buena onda o abierta.** Ser flexible está padre, pero crecer es trabajar en desarrollar habilidades.\n- **Creer que es solo felicitar el esfuerzo.** Si alguien se esforzó y no avanzó, no basta con decirle \"le echaste ganas\". Hay que buscar otra estrategia y otros recursos. Y sí puedes celebrar los logros, uniéndolos a lo que hizo para lograrlos.\n- **Creer que es decir \"tú puedes con todo\".** Sin enseñar el cómo, esa frase deja toda la carga en la otra persona.\n\n## 🪞 Para pensar\n¿Qué le dices a tus hijas o a tu equipo cuando les va mal? ¿Qué crees que entienden?\n\n## ✍️ Escribe\nEscribe tres frases que dices mucho cuando alguien hace algo bien o se equivoca. Reescribe cada una para que hable del proceso: lo que hizo, lo que eligió o lo que puede probar.\n\n## ✅ Esta semana\nCada noche, anota un elogio sobre el proceso y una crítica útil que hayas dado ese día.\n\n## 💬 En el grupo\nComparte una frase nueva que vas a usar con tus hijas o con tu equipo.\n\n@@ 9 | Cambia | Clase 9 · Tu voz de \"no puedes\" | Acéptala, cáchala, nómbrala y llévatela\nTodas tenemos una voz que aparece justo cuando estamos por crecer y nos dice \"mejor no\". Esta clase es para conocerla.\n\n## No es una o la otra\nNadie tiene una mentalidad de crecimiento pura. Quien diga que sí, probablemente no se ha observado bien. El cambio no es un anuncio (\"ya tengo mentalidad de crecimiento\"); es un camino. Y empieza con cuatro pasos.\n\n## Paso 1 · Acéptala\nTienes una parte con mentalidad fija. Todas la tenemos. No es para darte vergüenza; es parte de ser humana. Lo que sí puedes cambiar es cuántas veces la dejas manejar.\n\n## Paso 2 · Cáchala\nDescubre qué la despierta. A algunas les aparece cuando están por intentar algo grande: \"¿y si no tienes lo que se necesita y todas se dan cuenta?\". A otras, cuando algo no avanza: \"ya déjalo, haz algo más fácil\". A otras, cuando ven a alguien que es mejor en lo que ellas presumían: \"nunca vas a ser como ella\". Y a otras, cuando tienen presión y se vuelven jefas imposibles con su equipo.\n\nNo la juzgues. Solo obsérvala: cuándo llega, qué te dice, cómo te hace sentir y qué haces después.\n\n## Paso 3 · Nómbrala\nSí, ponle nombre. Puede ser el de un personaje, el de una tía muy criticona o uno que te dé risa. \"Ahí viene Doña Perfecta.\" \"Ya llegó la Juez.\" Ponerle nombre te ayuda a ver que es una parte de ti, no toda tú.\n\nY si lo platicas con tu equipo, es oro: \"cuando tenemos cierre de mes, me sale la Juez y me pongo insoportable; si la ven, díganme\". Entender las voces de las demás te da paciencia con ellas.\n\n## Paso 4 · Llévatela\nNo la vas a correr. Esa voz nació para protegerte de pasar vergüenzas. Lo que sí puedes hacer es educarla. Cuando aparezca, dale las gracias y dile por qué quieres intentarlo de todos modos: \"sé que puede no salir, pero quiero probar. ¿Me acompañas?\".\n\nCuando algo salga mal, déjala hacer su drama un ratito. Luego, cuando se calme, platícale tu plan: \"sí, puede que esto no me salga… todavía. Pero ya sé qué voy a intentar\".\n\n> Tu voz de \"no puedes\" no se va. Pero puede aprender a viajar contigo.\n\n## 🪞 Para pensar\n¿Cuándo fue la última vez que apareció esa voz? ¿Qué te dijo y qué hiciste?\n\n## ✍️ Escribe\nEscribe la ficha de tu voz: su nombre, qué la despierta, qué te dice, cómo te hace sentir, qué te hace hacer y cómo afecta a los demás. Al final, escribe lo que le vas a contestar la próxima vez.\n\n## ✅ Esta semana\nCada vez que aparezca, llámala por su nombre en voz baja y contéstale con tu frase.\n\n## 💬 En el grupo\nPresenta a tu voz: cómo se llama y cuándo aparece. Te vas a dar cuenta de que no eres la única.\n\n@@ 10 | Cambia | Clase 10 · Cuándo, dónde y cómo | Un plan que sí cumplas\nSaber todo esto no cambia nada si no se vuelve algo que haces un martes cualquiera.\n\n## Prometer no sirve\nTodas hemos prometido \"mañana sí empiezo\". Y mañana llega y se va. La investigación es clara: prometer, aunque sea con mucha intención, sirve de muy poco. Lo que sí funciona es un plan concreto que puedas imaginar: **cuándo, dónde y cómo** lo vas a hacer.\n\nNo es \"esta semana hago un en vivo\". Es \"el jueves, cuando deje a las niñas en la escuela, me siento en la mesa del comedor con la luz de la ventana y prendo el en vivo a las 9:15 para enseñar tres productos\".\n\n## Sentirte mal y hacerlo igual\nA veces, aunque te convenzas de que todo está bien, te sigues sintiendo mal. Está bien. No necesitas sentirte bien para dar el paso. El plan es el plan. Puedes estar triste y aun así mandar ese mensaje, pedir esa retroalimentación o grabar ese video.\n\n## Pedir información, no permiso\nCuando algo no se da (una clienta que dijo que no, una promoción que no lograste), la mentalidad de crecimiento no se queda en consolarse. Da el siguiente paso: pregunta qué faltó, busca cómo prepararte y vuelve a intentarlo. Una pregunta honesta y humilde casi siempre abre puertas.\n\n## Mantener el cambio\nLo curioso es que, cuando algo mejora, muchas personas dejan de hacer lo que lo mejoró. Como cuando te sientes mejor y dejas la medicina. El cambio de mentalidad necesita cuidado constante. No son un par de trucos; es una forma distinta de ver: de \"juzgar y que me juzguen\" a \"aprender y ayudar a aprender\".\n\n## Tus preguntas de cada mañana\nPégalas en tu espejo:\n1. ¿Qué oportunidades tengo hoy para aprender y crecer? ¿Y la gente a mi alrededor?\n2. ¿Cuándo, dónde y cómo lo voy a hacer?\n3. Si algo se atora: ¿cuál es mi nuevo plan y cuándo, dónde y cómo?\n4. Si me sale: ¿qué tengo que hacer para seguir creciendo?\n\n> No esperes a sentirte lista. Ponle fecha, hora y lugar.\n\n## 🪞 Para pensar\n¿Qué tienes pendiente desde hace semanas porque \"todavía no es el momento\"?\n\n## ✍️ Escribe\nRegresa a las tres frases que escribiste en la bienvenida. Elige una y escribe su plan: qué vas a hacer, cuándo, dónde y cómo. Agrega qué harás si tu voz de \"no puedes\" aparece.\n\n## ✅ Esta semana\nCumple tu plan. Usa la herramienta \"Tu plan de la semana\" para escribirlo y revisarlo.\n\n## 💬 En el grupo\nComparte tu plan con día, hora y lugar. Y la próxima semana, cuéntanos cómo te fue.\n\n@@ 11 | Herramienta | ¿Qué mentalidad tienes? | Un test rápido para saber dónde estás\nResponde con honestidad. No hay respuestas buenas ni malas: es para saber desde dónde empiezas.\n\n## Sobre tu inteligencia\nLee cada frase y decide si estás más de acuerdo o más en desacuerdo:\n1. Tu inteligencia es algo muy tuyo que no puedes cambiar mucho.\n2. Puedes aprender cosas nuevas, pero no puedes cambiar qué tan inteligente eres.\n3. No importa cuánta inteligencia tengas, siempre puedes aumentarla bastante.\n4. Siempre puedes cambiar de manera importante qué tan inteligente eres.\n\nSi estás más de acuerdo con la 1 y la 2, tiendes a la mentalidad fija en este tema. Si estás más de acuerdo con la 3 y la 4, tiendes a la de crecimiento.\n\n## Sobre tu forma de ser\n1. Eres de cierta manera y no hay mucho que hacer para cambiarlo.\n2. No importa cómo seas, siempre puedes cambiar bastante.\n3. Puedes hacer las cosas distinto, pero lo importante de quién eres no cambia.\n4. Siempre puedes cambiar cosas básicas de la persona que eres.\n\nAquí, la 1 y la 3 son de mentalidad fija; la 2 y la 4, de crecimiento.\n\n## Ahora con tu negocio\nCambia \"inteligencia\" por cada una de estas palabras y vuelve a contestar: **vender**, **hablar a cámara**, **liderar**, **los números**, **organizarte**. Es muy normal tener mentalidad de crecimiento en unas y fija en otras.\n\n## ✍️ Escribe\nAnota en qué temas saliste más fija. Esos son tus temas para este curso.\n\n@@ 12 | Herramienta | Las dos mentalidades | La tabla para pegar en tu espejo\nTenla a la mano. Cuando no sepas desde dónde estás pensando, revisa en qué columna estás.\n\n## Lo que crees\n- **Fija:** tus capacidades vienen de fábrica.\n- **Crecimiento:** tus capacidades se desarrollan.\n\n## Lo que buscas\n- **Fija:** verte capaz. Demostrar.\n- **Crecimiento:** volverte más capaz. Aprender.\n\n## Ante un reto\n- **Fija:** lo evitas, por si no te sale.\n- **Crecimiento:** lo tomas, porque ahí creces.\n\n## Ante un obstáculo\n- **Fija:** te rindes rápido.\n- **Crecimiento:** insistes y cambias de estrategia.\n\n## El esfuerzo\n- **Fija:** es señal de que no tienes talento.\n- **Crecimiento:** es el camino para dominar algo.\n\n## La crítica\n- **Fija:** la ignoras o te ofendes.\n- **Crecimiento:** aprendes de ella.\n\n## El éxito de otras\n- **Fija:** te amenaza.\n- **Crecimiento:** te enseña y te inspira.\n\n## El resultado\n- **Fija:** te estancas antes de tiempo y no llegas a lo que podías.\n- **Crecimiento:** llegas cada vez más lejos.\n\n@@ 13 | Herramienta | Frases de cambio | Para ti, tus hijas y tu equipo\nLas palabras que repites se vuelven lo que crees. Aquí tienes cambios fáciles.\n\n## Lo que te dices\n- \"No soy buena para esto.\" → \"No me sale todavía. ¿Qué me falta aprender?\"\n- \"Esto es muy difícil.\" → \"Esto va a tomar tiempo y práctica.\"\n- \"Ya lo intenté y no funcionó.\" → \"¿Qué estrategia no he probado?\"\n- \"Ella es mejor que yo.\" → \"¿Qué hace ella que yo podría aprender?\"\n- \"Me equivoqué, qué tonta.\" → \"Me equivoqué. ¿Qué me enseña esto?\"\n- \"Ya está bien así.\" → \"¿Esto es lo mejor que puedo hacer hoy?\"\n- \"Me dio pena preguntar.\" → \"Preguntar es la forma más rápida de aprender.\"\n\n## Lo que les dices a tus hijas\n- \"Qué inteligente eres.\" → \"Qué bien te organizaste para estudiar.\"\n- \"Eres una artista.\" → \"Me encanta cómo mezclaste esos colores. ¿Cómo se te ocurrió?\"\n- \"No importa, no eres buena para eso.\" → \"Todavía no te sale. ¿Qué podemos probar?\"\n- \"No pasa nada, no es tu culpa.\" → \"A ver, ¿qué pasó? ¿Qué harías distinto?\"\n\n## Lo que le dices a tu equipo\n- \"Tú naciste para esto.\" → \"Se nota cuánto has practicado tus mensajes.\"\n- \"Ella no sirve para vender.\" → \"¿Qué le falta aprender y cómo la acompaño?\"\n- \"Échale ganas.\" → \"Probemos esta otra forma. Te enseño.\"\n- \"Tú puedes con todo.\" → \"Este es el siguiente paso, y aquí estoy para ayudarte.\"\n\n@@ 14 | Herramienta | Tu plan de la semana | Preguntas para el espejo y plan con fecha\nUsa esta hoja cada lunes. Cópiala en tu cuaderno o escríbela aquí abajo.\n\n## Las preguntas de la mañana\n1. ¿Qué oportunidad tengo hoy para aprender o crecer?\n2. ¿A quién puedo ayudar a crecer hoy?\n3. ¿Cuándo, dónde y cómo lo voy a hacer?\n\n## Tu plan\n- **Lo que quiero aprender o intentar:**\n- **Cuándo (día y hora):**\n- **Dónde:**\n- **Cómo (los pasos):**\n- **A quién le voy a pedir ayuda:**\n- **Qué le voy a contestar a mi voz de \"no puedes\":**\n\n## Si se atora\n- ¿Qué pasó?\n- ¿Qué nueva estrategia voy a probar?\n- ¿Cuándo, dónde y cómo?\n\n## Si me salió\n- ¿Qué hice que funcionó?\n- ¿Qué tengo que hacer para seguir creciendo?\n\n## ✍️ Escribe\nEscribe aquí tu plan de esta semana.";
var FAQ_MD="## Empezar | 0\n\n### ¿De qué se trata este curso?\nDe cómo lo que crees sobre tus capacidades decide lo que te atreves a intentar. Si crees que vienen de fábrica, cada reto se vuelve un examen. Si crees que se desarrollan, cada reto se vuelve una clase.\n\n### ¿Cuánto tiempo me toma?\nCada clase se lee en 10 o 15 minutos, más el ejercicio. Lo ideal es una clase por semana para que te dé tiempo de practicar lo que pide.\n\n### ¿Tengo que tomar las clases en orden?\nTe recomendamos leer primero las clases 1 a 4, porque explican la idea base. Después puedes ir directo a la que más necesites: negocio, relaciones o hijas.\n\n### ¿De dónde salen estas ideas?\nDe décadas de investigación en psicología sobre cómo enfrentamos los retos y los fracasos, contadas con palabras sencillas y aterrizadas a la vida del equipo.\n\n## La idea | 1\n\n### ¿Qué es la mentalidad fija?\nCreer que tus capacidades (inteligencia, talento, forma de ser) vienen de fábrica y no cambian mucho. Te lleva a querer demostrar todo el tiempo y a evitar lo que te puede hacer ver mal.\n\n### ¿Qué es la mentalidad de crecimiento?\nCreer que tus capacidades se pueden desarrollar con esfuerzo, buenas estrategias y ayuda de otras. Te lleva a buscar retos y a ver los errores como información.\n\n### ¿Se puede tener las dos?\nSí, todas tenemos las dos. Además cambian según el tema: puedes ser de crecimiento para aprender a maquillar y fija para los números. El test de las herramientas te ayuda a ver dónde estás.\n\n### ¿Esto quiere decir que cualquiera puede lograr cualquier cosa?\nNo. Quiere decir que nadie sabe de qué eres capaz hasta que le dedicas tiempo, práctica y aprendizaje. Lo que no hace es prometerte un resultado.\n\n### Si fracaso, ¿es porque no me esforcé lo suficiente?\nNo. El esfuerzo importa, pero no es lo único. Las personas tienen distintos recursos, tiempos, apoyos y circunstancias. Este curso no es para culparte: es para que no te rindas antes de intentarlo.\n\n## El esfuerzo | 4\n\n### Le echo muchas ganas y no avanzo. ¿Qué hago?\nEsforzarte más con la misma estrategia solo te cansa. Revisa las tres partes: esfuerzo, estrategia y ayuda. Cambia la forma (otro horario, otro gancho, otra manera de ofrecer) y pregúntale a alguien que ya lo haga bien.\n\n### ¿Por qué me da flojera justo cuando algo se pone difícil?\nMuchas veces no es flojera: es la mentalidad fija protegiéndote de descubrir que no te sale. Si te pasa, nómbralo y quédate cinco minutos más.\n\n## Etiquetas y elogios | 5\n\n### ¿Está mal decirle a mi hija que es inteligente?\nNo es que esté prohibido, pero ese elogio le enseña que su valor depende de no equivocarse. Funciona mejor elogiar lo que hizo: cómo se organizó, qué estrategia usó, cómo no se rindió.\n\n### ¿Entonces solo puedo felicitar el esfuerzo?\nNo. Puedes celebrar los logros. Solo únelos a lo que hizo para lograrlos: \"sacaste 10 porque repasaste toda la semana\".\n\n### Siempre he sido \"la tímida\". ¿Eso cambia?\nLa pena no siempre se quita, pero deja de mandar. Hablar con gente nueva es una habilidad, y las habilidades se practican. Lo vemos en la clase 7.\n\n## Negocio y equipo | 6\n\n### Tengo a alguien en mi equipo que no da resultados. ¿La dejo ir?\nAntes de decidir que \"no sirve para esto\", pregúntate qué le falta aprender y cómo la puedes acompañar. Si después de enseñarle y apoyarla no avanza, la conversación cambia, pero que no sea por una primera impresión.\n\n### ¿Cómo hago para que mi equipo me diga lo que no funciona?\nPregunta antes de dar tu opinión, agradece a quien no está de acuerdo y nunca castigues una mala noticia. Si solo te dicen que todo va increíble, algo se está escondiendo.\n\n## El cambio | 9\n\n### ¿Qué es la voz de \"no puedes\"?\nEs la parte de ti con mentalidad fija: la que aparece cuando vas a intentar algo nuevo, cuando algo sale mal o cuando ves a alguien mejor que tú. En la clase 9 aprendes a cacharla, ponerle nombre y llevártela contigo.\n\n### ¿Por qué ponerle nombre? Suena raro.\nPorque te ayuda a ver que es una parte de ti, no toda tú. Y cuando el equipo comparte sus nombres, se vuelve más fácil platicar de lo que nos pasa sin ofendernos.\n\n### Siempre prometo empezar y no empiezo. ¿Qué hago?\nCambia la promesa por un plan con cuándo, dónde y cómo. \"El jueves a las 9:15 en el comedor\" funciona mucho mejor que \"esta semana sí\". Lo ves en la clase 10.\n\n### Ya mejoré. ¿Puedo dejar de hacer todo esto?\nOjo: cuando algo mejora, muchas dejan de hacer lo que lo mejoró y regresan al punto de partida. El cambio de mentalidad se cuida todos los días, con las preguntas de la mañana.\n\n## Tu mentora | 0\n\n### ¿Qué hace la mentora?\nTe da las clases una por una, te ayuda a cachar a tu voz de \"no puedes\", a reescribir tus frases y a armar tu plan con fecha y lugar.\n\n### ¿La mentora sustituye a una terapeuta?\nNo. Si estás pasando por algo muy pesado (depresión, ansiedad fuerte, un duelo), busca también a una profesional.";

function startsIcon(h){for(var i=0;i<ICONS.length;i++)if(h.indexOf(ICONS[i])===0)return ICONS[i];var m=h.match(/^[☀-➿\uD83C-􏰀-\uDFFF️]+\s*/);return m?m[0]:null;}
function lessonBody(src){
  var parts=src.split(/^## /m),main=parts[0],tasks=[];
  parts.slice(1).forEach(function(p){
    var nl=p.indexOf("\n"),head=(nl<0?p:p.slice(0,nl)).trim(),rest=nl<0?"":p.slice(nl+1);
    var icon=startsIcon(head);
    if(icon)tasks.push({title:head.slice(icon.length).trim(),html:md(rest.trim())});else main+="\n## "+p;
  });
  return {html:md(main.trim()),tasks:tasks};
}
function L(id){for(var i=0;i<LESSONS.length;i++)if(LESSONS[i].id===id)return LESSONS[i];return null;}
var N=CFG.n,STEPS=[];for(var i=1;i<=N;i++)STEPS.push(i);
var ORDER=LESSONS.map(function(l){return l.id;});
var GROUPS=CFG.groups.map(function(g){var p=g[0].split(" · ");return {name:p.length>1?p[1]:g[0],pre:p.length>1?p[0]:"",ids:g[1]};});
var ACTS=GROUPS.filter(function(g){return g.ids.every(function(i){return i>=1&&i<=N;});});
var TOOLS=ORDER.filter(function(i){return i>N;});
var seen=new Set(store.get(CFG.key+"-seen",[])),notes=store.get(CFG.key+"-notes",{});
function saveSeen(){store.set(CFG.key+"-seen",Array.from(seen));}
function isStep(id){return id>=1&&id<=N;}
function nextUp(){if(!seen.has(0)&&!STEPS.some(function(i){return seen.has(i);}))return 0;for(var i=0;i<STEPS.length;i++)if(!seen.has(STEPS[i]))return STEPS[i];return null;}
function count(){return STEPS.filter(function(i){return seen.has(i);}).length;}
function stateOf(id){return seen.has(id)?"seen":(id===nextUp()?"next":"");}
function actOf(id){for(var i=0;i<ACTS.length;i++)if(ACTS[i].ids.indexOf(id)>=0)return ACTS[i];return null;}
function label(id){var x=L(id);if(!x)return "";if(id===0)return CFG.welcomeLabel||"Bienvenida";var m=x.title.match(/^([^·]{1,14}) · /);if(isStep(id)&&m)return m[1];return x.kicker;}
function ttl(x){return x.title.replace(/^[^·]{1,14} · /,"");}
function ctaText(){var n=nextUp();if(n===0)return CFG.ctaStart||"Empezar con la bienvenida";if(n===null)return "Repasar "+(CFG.repaso||"el curso");var l=label(n);return "Seguir con "+(/^Clase/.test(l)?"la ":"el ")+l;}
var CTX={ttl:ttl,L:L,LESSONS:LESSONS,N:N,STEPS:STEPS,ACTS:ACTS,TOOLS:TOOLS,GROUPS:GROUPS,seen:seen,stateOf:stateOf,nextUp:nextUp,count:count,esc:esc,label:label,ctaText:ctaText,cfg:CFG,reduce:reduce,actOf:actOf,open:function(id){openLesson(id);}};

/* ---------- page shell ---------- */
var mw=MENTOR.title.indexOf("mentor ")>=0||/mentor,/.test(MENTOR.title)?"mentor":"mentora";
var SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>';
var root=$("#root");
root.innerHTML='<div class="wrap"><header class="hero" id="hero"></header>'+
  '<div class="tabbar"><div class="tabs" role="tablist" aria-label="Secciones del curso">'+
  '<button class="tab" role="tab" id="tabP" aria-selected="true" aria-controls="progView" type="button">'+esc(CFG.tabProgram||"Programa")+'</button>'+

  '<label class="sr" for="fq">Busca tu duda</label><div class="f-search">'+SEARCH+'<input id="fq" type="search" placeholder="'+esc(CFG.faqPh||"Busca tu duda")+'" autocomplete="off"></div><div class="f-chips" id="cats"></div><p class="f-count" id="fcount"></p><div id="faq"></div></div></section>'+
  '<section id="mentorView" role="tabpanel" aria-labelledby="tabM" hidden></section>'+
  (CFG.foot?'<footer class="foot">'+esc(CFG.foot)+"</footer>":"")+"</div>";

function renderHero(){$("#hero").innerHTML=SKIN.hero(CTX);var c=$("#cta");if(c)c.onclick=function(){var g=nextUp();if(g===null){setTab("P");$("#progView").scrollIntoView({behavior:"smooth"});}else openLesson(g);};$$("#hero [data-open]").forEach(wireOpen);}
function renderProgram(){$("#progView").innerHTML=SKIN.program(CTX);$$("#progView [data-open]").forEach(wireOpen);if(SKIN.mount)SKIN.mount(CTX,$("#progView"));}
function wireOpen(b){b.onclick=function(){openLesson(+b.getAttribute("data-open"),b);};}
function refresh(){renderHero();renderProgram();}

/* tabs */
var TABS={P:["#tabP","#progView"],F:["#tabF","#faqView"],M:["#tabM","#mentorView"]};
function setTab(t){Object.keys(TABS).forEach(function(k){$(TABS[k][0]).setAttribute("aria-selected",String(k===t));$(TABS[k][1]).hidden=k!==t;});}
Object.keys(TABS).forEach(function(k){$(TABS[k][0]).onclick=function(){setTab(k);};});

/* ---------- faq ---------- */
var norm=function(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");};
var STOP=new Set("que como para por con los las del una uno unos mis tus sus mas pero porque cuando donde esta este eso hay tengo puedo debo".split(" "));
function terms(s){return (norm(s).match(/[a-z0-9ñ]{3,}/g)||[]).filter(function(w){return !STOP.has(w);}).map(function(w){return w.length>5?w.slice(0,-1):w;});}
var FAQ=[],CATS=[];
FAQ_MD.split(/^## /m).filter(function(x){return x.trim();}).forEach(function(block){
  var lines=block.split("\n"),h=lines[0].split("|").map(function(x){return x.trim();});if(!h[0])return;CATS.push({cat:h[0],cls:+h[1]});
  lines.slice(1).join("\n").split(/^### /m).filter(function(x){return x.trim();}).forEach(function(qb){var i=qb.indexOf("\n");if(i<0)return;FAQ.push({cat:h[0],cls:+h[1],q:qb.slice(0,i).trim(),a:qb.slice(i+1).trim()});});
});
FAQ.forEach(function(f){f.n=norm(f.q+" "+f.a);});
function hl(html,ts){if(!ts.length)return html;return html.replace(/(>[^<]+<)/g,function(seg){var out=seg;ts.forEach(function(w){var re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").split("").map(function(ch){return ({a:"[aá]",e:"[eé]",i:"[ií]",o:"[oó]",u:"[uúü]",n:"[nñ]"})[ch]||ch;}).join("")+"[a-záéíóúñü]*)","gi");out=out.replace(re,"<mark>$1</mark>");});return out;});}
var fq=$("#fq"),faqEl=$("#faq"),fcount=$("#fcount"),curCat=null;
function isMentorCat(c){return /mentor/i.test(c);}
function renderCats(){var c=$("#cats");c.innerHTML="";[{cat:"Todas"}].concat(CATS).forEach(function(x){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=x.cat;b.setAttribute("aria-pressed",String((x.cat==="Todas"&&!curCat)||x.cat===curCat));b.onclick=function(){curCat=x.cat==="Todas"?null:x.cat;renderCats();renderFaq();};c.appendChild(b);});}
function renderFaq(){
  var qtxt=fq.value.trim(),ts=Array.from(new Set(terms(qtxt))),items=FAQ.filter(function(f){return !curCat||f.cat===curCat;});
  if(ts.length){items=items.map(function(f){return {f:f,s:ts.reduce(function(a,w){return a+(f.n.indexOf(w)>=0?(norm(f.q).indexOf(w)>=0?3:1):0);},0)};}).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;}).map(function(x){return x.f;});}
  faqEl.innerHTML="";
  var gs=ts.length?[[null,items]]:CATS.map(function(c){return [c.cat,items.filter(function(f){return f.cat===c.cat;})];}).filter(function(g){return g[1].length;});
  gs.forEach(function(g){var d=document.createElement("div");d.className="fgroup";if(g[0]){var h=document.createElement("h3");h.textContent=g[0];d.appendChild(h);}
    g[1].forEach(function(f,idx){var det=document.createElement("details");det.className="qa";var x=isMentorCat(f.cat)?null:L(f.cls);
      det.innerHTML="<summary><span>"+hl(">"+esc(f.q)+"<",ts).slice(1,-1)+'</span><i aria-hidden="true">+</i></summary><div class="ans">'+hl(md(f.a),ts)+(x?'<button class="btn go" type="button">Ver: '+esc(x.title)+"</button>":(isMentorCat(f.cat)?'<button class="btn go" type="button">Ir a Tu '+mw+"</button>":""))+"</div>";
      var go=det.querySelector(".go");if(go)go.onclick=function(){if(x)openLesson(f.cls);else setTab("M");};
      if(ts.length&&idx===0)det.open=true;d.appendChild(det);});faqEl.appendChild(d);});
  fcount.textContent=ts.length?(items.length?items.length+(items.length===1?" respuesta":" respuestas")+' para "'+qtxt+'"':'No hay una pregunta frecuente sobre "'+qtxt+'". Pregúntale a tu '+mw+"."):"";
}
var ft;fq.addEventListener("input",function(){clearTimeout(ft);ft=setTimeout(renderFaq,150);});

/* ---------- mentor ---------- */
(function(){
  var M=MENTOR,h='<div class="m-col"><div><h2 class="sec-h">'+esc(M.title)+'</h2><p class="sec-p">'+esc(M.intro)+"</p></div>"+
    '<ul class="m-can">'+M.can.map(function(c){return "<li><b>"+esc(c[0])+"</b><span>"+esc(c[1])+"</span></li>";}).join("")+"</ul>"+
    '<div class="m-dl"><button type="button" class="btn solid" id="dlZip" hidden>Descargar '+(mw==="mentor"?"el mentor":"la mentora")+' (.zip)</button>'+(CFG.mdVar?'<button type="button" class="btn" id="dlMd" hidden>Descargar las instrucciones (.md)</button>':"")+'</div><p class="m-note" id="dlMsg">'+esc(M.notes[0]||"")+"</p></div>"+
    '<div class="m-col"><h3 class="m-h">Cómo '+(mw==="mentor"?"instalarlo":"instalarla")+'</h3><ol class="m-steps">'+M.steps.map(function(s){return "<li><span>"+esc(s)+"</span></li>";}).join("")+"</ol>"+
    '<div class="m-prompts">'+M.prompts.map(function(p,i){return '<div class="m-prompt"><q id="mp'+i+'">'+esc(p)+'</q><button type="button" class="btn" data-copy="mp'+i+'">Copiar</button></div>';}).join("")+"</div>"+
    (M.notes[1]?'<p class="m-note">'+esc(M.notes[1])+"</p>":"")+(M.limits.length?'<div class="m-limits" aria-label="Límites">'+M.limits.map(function(s){return "<span>"+esc(s)+"</span>";}).join("")+"</div>":"")+"</div>";
  $("#mentorView").innerHTML='<div class="mentorv">'+h+"</div>";
  $$("[data-copy]").forEach(function(btn){btn.addEventListener("click",function(){var el=document.getElementById(btn.getAttribute("data-copy"));function selt(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="Seleccionado";}
    try{navigator.clipboard.writeText(el.textContent).then(function(){btn.textContent="Copiado";setTimeout(function(){btn.textContent="Copiar";},1600);},selt);}catch(e){selt();}});});
  if(window.claude&&window.claude.use){window.claude.use("downloads").then(function(dl){
    var msg=$("#dlMsg"),bz=$("#dlZip"),bm=$("#dlMd");if(!dl)return;
    bz.hidden=false;if(bm)bm.hidden=false;msg.textContent=CFG.mdVar?"El .zip es el que se sube a Claude. El .md es el texto de las instrucciones, por si quieres leerlo.":"El .zip es el que se sube a Claude.";
    function bytes(b64){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
    function save(name,data){dl.save({filename:name,data:data}).then(function(){msg.textContent="Listo: "+name+" descargado.";},function(e){var c=e&&e.code;
      if(c==="declined")msg.textContent="Descarga cancelada.";else if(c==="rate_limited")msg.textContent="Ya hay una descarga abierta. Termínala e intenta de nuevo.";else{msg.textContent=M.notes[0]||"Aquí no se puede descargar.";bz.hidden=true;if(bm)bm.hidden=true;}});}
    bz.onclick=function(){save(CFG.zipName,bytes(window[CFG.zipVar]));};if(bm)bm.onclick=function(){save(CFG.mdName,bytes(window[CFG.mdVar]));};
  });}
})();

if(!(window.claude&&window.claude.use)&&/^https?:/.test(location.protocol)){var a=$("#dlZip"),b=$("#dlMd");a.hidden=false;a.onclick=function(){location.href=CFG.zipName;};if(b){b.hidden=false;b.onclick=function(){location.href=CFG.mdName;};}$("#dlMsg").textContent="El .zip es el que se sube a Claude. El .md es el texto de las instrucciones, por si quieres leerlo.";}
/* ---------- reader sheet ---------- */
var cur=null;
function neighbours(id){var k=ORDER.indexOf(id);return {prev:ORDER[k-1],next:ORDER[k+1]};}
function where(x){if(x.id===0)return CFG.welcomeLabel||"Bienvenida";if(isStep(x.id)){var a=actOf(x.id);return label(x.id)+" de "+N+(a&&a.name!=="Clases"?", "+a.name:"");}return x.kicker;}
function sheetHTML(x){
  var b=lessonBody(x.body),nb=neighbours(x.id),s=seen.has(x.id),nx=nb.next!==undefined?L(nb.next):null;
  var num=isStep(x.id)?(SKIN.readerNum?SKIN.readerNum(x,CTX):String(x.id)):null;
  var turn=b.tasks.length?'<section class="turn"><h3>Tu turno</h3>'+b.tasks.map(function(t){return '<div class="task"><h4>'+esc(t.title)+"</h4>"+t.html+"</div>";}).join("")+
    '<label class="nb-l" for="nb">Tu cuaderno</label><textarea id="nb" placeholder="Escribe aquí tu ejercicio. Se guarda en este dispositivo."></textarea><span class="saved" id="nbs"></span></section>':"";
  return '<div class="grab" id="grab"><span class="where">'+esc(where(x))+'</span><button type="button" class="x" id="closeB">Cerrar</button></div><div class="scroll" id="scroll">'+
    '<div class="r-head'+(num?"":" nonum")+'">'+(num?'<span class="r-num" aria-hidden="true">'+esc(num)+"</span>":"")+'<p class="r-k">'+esc(isStep(x.id)?label(x.id):(x.id===0?(CFG.welcomeLabel||"Bienvenida"):x.kicker))+'</p><h1 class="r-title" id="rTitle">'+esc(ttl(x))+'</h1></div><p class="r-topic">'+esc(x.topic)+'</p><p class="r-intro">'+inline(esc(x.intro))+'</p><div class="lesson-body">'+b.html+"</div>"+turn+
    '<div class="r-foot"><div class="nav"><button class="btn" type="button" id="prevB" '+(nb.prev===undefined?"disabled":"")+'>Anterior</button><button class="btn solid" type="button" id="nextB" '+(nb.next===undefined?"disabled":"")+">Siguiente</button></div>"+
    (isStep(x.id)?'<button class="btn'+(s?" done":"")+'" type="button" id="seenB" aria-pressed="'+s+'">'+(s?"Completada ✓":"Marcar como completada")+"</button>":"")+
    (nx?'<p class="r-next">Sigue: '+esc(ttl(nx))+"</p>":"")+"</div></div>";
}
function openLesson(id,trigger){
  var x=L(id);if(!x)return;
  var fresh=!cur;
  if(fresh){
    var scrim=document.createElement("div");scrim.className="scrim";var sh=document.createElement("div");sh.className="sheet";sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");sh.setAttribute("aria-labelledby","rTitle");
    document.body.appendChild(scrim);document.body.appendChild(sh);document.body.classList.add("sheet-open");
    cur={scrim:scrim,sh:sh,trigger:trigger||document.activeElement};
    scrim.onclick=closeLesson;
  }
  cur.id=id;cur.sh.innerHTML=sheetHTML(x);
  var sh=cur.sh;
  if(fresh)requestAnimationFrame(function(){requestAnimationFrame(function(){sh.classList.add("on");cur&&cur.scrim.classList.add("on");});});
  $("#closeB",sh).onclick=closeLesson;var rt=$("#rTitle",sh);rt.setAttribute("tabindex","-1");rt.focus({preventScroll:true});
  var nb=neighbours(id);
  $("#prevB",sh).onclick=function(){openLesson(nb.prev);};
  $("#nextB",sh).onclick=function(){if((isStep(id)||id===0)&&!seen.has(id)){seen.add(id);saveSeen();refresh();}openLesson(nb.next);};
  var sb=$("#seenB",sh);if(sb)sb.onclick=function(){seen.has(id)?seen.delete(id):seen.add(id);saveSeen();var on=seen.has(id);sb.textContent=on?"Completada ✓":"Marcar como completada";sb.classList.toggle("done",on);sb.setAttribute("aria-pressed",String(on));refresh();};
  var ta=$("#nb",sh);if(ta){ta.value=notes[id]||"";var t;ta.oninput=function(){clearTimeout(t);t=setTimeout(function(){notes[id]=ta.value;store.set(CFG.key+"-notes",notes);$("#nbs",sh).textContent="Guardado en este dispositivo";},400);};}
  $("#scroll",sh).scrollTop=0;
  try{history.replaceState(null,"","#clase-"+id);}catch(e){}
  var g=$("#grab",sh),y0=null,dy=0,t0=0;
  g.addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;y0=e.clientY;dy=0;t0=performance.now();sh.classList.add("drag");try{g.setPointerCapture(e.pointerId);}catch(_){}});
  g.addEventListener("pointermove",function(e){if(y0==null)return;dy=e.clientY-y0;sh.style.transform="translateY("+(dy<0?dy*.15:dy)+"px)";});
  function end(){if(y0==null)return;var v=dy/Math.max(1,performance.now()-t0);sh.classList.remove("drag");sh.style.transform="";y0=null;if(dy>140||v>.5)closeLesson();}
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
}
function closeLesson(){
  if(!cur)return;var c=cur;cur=null;document.body.classList.remove("sheet-open");
  c.sh.classList.remove("on");c.scrim.classList.remove("on");setTimeout(function(){c.sh.remove();c.scrim.remove();},reduce?0:500);
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  var t=document.querySelector('#progView [data-open="'+c.id+'"]')||c.trigger;if(t&&t.focus)t.focus({preventScroll:false});
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&cur)closeLesson();});

/* ---------- boot ---------- */
renderCats();renderFaq();refresh();

if(hh&&L(+hh[1]))openLesson(+hh[1]);else if(hm==="mentor"||hm==="mentora")setTab("M");else if(hm==="preguntas")setTab("F");
})();
