<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Trazo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,400;0,500;0,700;0,900;1,400&family=Caveat:wght@600;700&display=swap">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:3px}
.wrap{max-width:var(--maxw,1040px);margin:0 auto;padding-inline:16px;padding-block:0 64px;display:flex;flex-direction:column;gap:var(--gap,28px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.press{transition:transform .16s cubic-bezier(.23,1,.32,1)}
.press:active{transform:scale(.97)}

/* tabs */
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:center;margin-inline:-16px;padding:10px 16px}
.tabbar::before{content:"";position:absolute;inset:0;background:var(--bg);opacity:.94;z-index:-1}
.tabs{display:flex;gap:4px;max-width:100%;overflow-x:auto;padding:4px;border-radius:var(--tabs-r,999px);background:var(--surface);border:1px solid var(--line)}
.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:15px;padding:10px 18px;border-radius:var(--tabs-r,999px);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* shared buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:15px;padding:12px 18px;border-radius:var(--btn-r,999px);cursor:pointer;text-decoration:none;transition:transform .16s cubic-bezier(.23,1,.32,1)}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.35;cursor:default}

/* section heads (faq + mentor) */
.sec-h{margin:0;font:var(--h2-font);letter-spacing:var(--h2-track,-.01em);text-wrap:balance}
.sec-p{margin:8px 0 0;color:var(--muted);max-width:56ch}

/* faq */
.faqv{display:flex;flex-direction:column;gap:16px;max-width:780px}
.f-search{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--field-r,999px);padding:0 18px}
.f-search svg{width:20px;height:20px;flex:none;color:var(--muted)}
.f-search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:17px/1.3 var(--body);padding:14px 0}
.f-search input:focus{outline:none}
.f-search:focus-within{border-color:var(--accent)}
.f-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.f-count{margin:0;color:var(--muted);font-size:14px}
.fgroup h3{margin:18px 0 8px;font:var(--h3-font)}
details.qa{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,16px);margin-bottom:8px}
details.qa summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 18px;font-weight:600;font-size:16.5px;line-height:1.35}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary i{flex:none;font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink);transition:transform .2s cubic-bezier(.23,1,.32,1)}
details.qa[open] summary i{transform:rotate(45deg);background:var(--accent);color:var(--accent-ink)}
.ans{padding:0 18px 18px}
.ans p{margin:0 0 .7em;max-width:64ch}.ans p:last-child{margin:0}
.ans ul,.ans ol{margin:0 0 .8em;padding-left:1.3em}
.ans .go{margin-top:10px}
mark{background:var(--mark,rgba(255,200,0,.35));color:inherit;border-radius:3px;padding:0 2px}

/* mentor */
.mentorv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 40px;align-items:start}
@media (max-width:780px){.mentorv{grid-template-columns:minmax(0,1fr)}}
.m-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.m-can{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.m-can li{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,16px);padding:14px 16px}
.m-can b{display:block;font-weight:700}
.m-can span{color:var(--muted);font-size:15px}
.m-dl{display:flex;flex-wrap:wrap;gap:10px}
.m-note{margin:0;color:var(--muted);font-size:14px}
.m-h{margin:0;font:var(--h3-font)}
.m-steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.m-steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:baseline}
.m-steps li::before{counter-increment:s;content:counter(s);font:var(--num-font,700 22px/1 var(--display));color:var(--accent-text,var(--accent))}
.m-prompts{display:grid;gap:8px}
.m-prompt{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,14px);padding:10px 12px 10px 16px}
.m-prompt q{quotes:none;min-width:0;font-size:15.5px}
.m-prompt .btn{padding:8px 14px;font-size:13.5px;flex:none}
.m-limits{display:flex;flex-wrap:wrap;gap:8px}
.m-limits span{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted)}
footer.foot{text-align:center;font-size:14px;color:var(--muted);padding-top:20px}

/* ---------- reader sheet (the lights come on) ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;transition:opacity .45s cubic-bezier(.32,.72,0,1)}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;top:calc(12px + env(safe-area-inset-top,0px));margin:0 auto;max-width:800px;background:var(--r-bg);color:var(--r-ink);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:0 -12px 50px rgba(0,0,0,.35);font-family:var(--r-body,var(--body))}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{flex:none;touch-action:none;cursor:grab;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 14px 10px 20px;border-bottom:1px solid var(--r-line);position:relative}
.grab::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--r-line)}
.grab .where{font-size:14px;font-weight:600;color:var(--r-muted);padding-top:8px}
.grab .x{border:1px solid var(--r-line);background:transparent;color:var(--r-ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;margin-top:6px}
.sheet :focus-visible{outline:2px solid var(--r-accent);outline-offset:3px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:clamp(22px,5vw,48px) clamp(18px,5vw,56px) calc(56px + env(safe-area-inset-bottom,0px))}
.r-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:end;margin-bottom:18px}
.r-head.nonum{grid-template-columns:minmax(0,1fr)}
.r-num{grid-row:span 2;font:var(--r-num-font,800 96px/.8 var(--display));color:var(--r-accent);font-variant-numeric:tabular-nums}
.r-k{margin:0;font-size:14.5px;font-weight:600;color:var(--r-accent)}
.r-title{margin:0;font:var(--r-title-font,700 clamp(32px,6.5vw,48px)/1 var(--display));letter-spacing:var(--r-title-track,-.01em);text-wrap:balance}
.r-topic{margin:0 0 18px;font-size:20px;line-height:1.35;color:var(--r-muted)}
.r-intro{font-size:20px;line-height:1.5;margin:0 0 26px;padding-bottom:24px;border-bottom:1px solid var(--r-line)}
.lesson-body p,.lesson-body li{max-width:66ch}
.lesson-body p{margin:0 0 .9em}
.lesson-body ul,.lesson-body ol{margin:0 0 1em;padding-left:1.3em}
.lesson-body li{margin:.4em 0}
.lesson-body li::marker{color:var(--r-accent);font-weight:700}
.lesson-body strong{font-weight:700}
.lesson-body h3{font:var(--r-h3-font,700 26px/1.15 var(--display));margin:36px 0 10px;text-wrap:balance}
.callout{margin:28px 0;padding:22px 24px;border-radius:var(--card-r,18px);background:var(--r-callout-bg);color:var(--r-callout-ink)}
.callout p{margin:0;font:var(--r-callout-font,700 clamp(22px,4.6vw,28px)/1.2 var(--display));max-width:34ch;text-wrap:balance}
.turn{margin-top:40px;padding-top:26px;border-top:2px solid var(--r-ink);display:grid;gap:12px}
.turn h3{margin:0;font:var(--r-h3-font,700 26px/1.15 var(--display))}
.task{background:var(--r-surface);border:1px solid var(--r-line);border-radius:var(--card-r,16px);padding:16px 18px}
.task h4{margin:0 0 6px;font-size:17px}
.task p:last-child,.task ul:last-child,.task ol:last-child{margin-bottom:0}
.nb-l{font-weight:600;font-size:14px;color:var(--r-muted);margin-top:6px}
.sheet textarea{width:100%;min-height:150px;resize:vertical;font:16px/1.55 var(--r-body,var(--body));color:var(--r-ink);background:var(--r-surface);border:1px solid var(--r-line);border-radius:12px;padding:14px 16px}
.saved{font-size:13px;color:var(--r-muted);min-height:1.2em}
.r-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:34px;padding-top:22px;border-top:1px solid var(--r-line)}
.r-foot .nav{display:flex;gap:8px;flex-wrap:wrap}
.sheet .btn{border-color:var(--r-line);color:var(--r-ink)}
.sheet .btn.solid{background:var(--r-ink);border-color:var(--r-ink);color:var(--r-bg)}
.sheet .btn.done{background:var(--r-accent);border-color:var(--r-accent);color:var(--r-accent-ink,var(--r-bg))}
.r-next{width:100%;margin:0;font-size:14px;color:var(--r-muted)}
body.sheet-open{overflow:hidden}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.mentorv .sec-h{font-size:clamp(28px,6.4vw,46px)}

/* Trazo: a route drawn by hand. Graph-paper white, navy ink, a teal marker line that has been drawn as far as you have gone, highlighter yellow for "you are here". */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --ink:#172033; --muted:#566074; --line:#D5DCE5; --accent:#0E8C7B; --accent-ink:#FFFFFF; --hi:#F6E45C; --focus:#0E8C7B; --mark:#F6E45C;
  --display:"Chivo","Arial Black",system-ui,sans-serif; --body:"Chivo",system-ui,-apple-system,sans-serif; --hand:"Caveat","Bradley Hand",cursive;
  --h2-font:900 clamp(38px,7.5vw,62px)/.95 var(--display); --h3-font:700 30px/1 var(--hand); --num-font:900 22px/1 var(--display); --accent-text:#0B7466;
  --r-bg:#FFFFFF; --r-surface:#F3F6F9; --r-ink:#172033; --r-muted:#566074; --r-line:#DDE3EA; --r-accent:#0B7466; --r-accent-ink:#FFFFFF; --r-callout-bg:#FBF3B0; --r-callout-ink:#172033;
  --r-num-font:900 clamp(80px,18vw,120px)/.8 var(--display); --r-title-font:900 clamp(32px,6.5vw,50px)/.98 var(--display); --r-h3-font:900 25px/1.1 var(--display); --r-callout-font:700 clamp(28px,6vw,36px)/1.1 var(--hand);
  --card-r:14px; --btn-r:10px; --tabs-r:10px; --field-r:10px;
}
body{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-position:-1px -1px}
.tabbar::before{opacity:1}
.sheet{background-image:none}
.r-title,.sec-h{letter-spacing:-.025em}
.t-hero{padding-block:46px 10px;display:grid;gap:14px;justify-items:start}
.t-word{position:relative;display:inline-block}
.t-word h1{margin:0;font:900 clamp(84px,22vw,220px)/.82 var(--display);letter-spacing:-.05em;position:relative;z-index:1}
.t-word svg{position:absolute;left:-2%;bottom:-6%;width:104%;height:46%;overflow:visible;z-index:0}
.t-word path{fill:none;stroke:var(--hi);stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.t-word path{stroke-dasharray:1;stroke-dashoffset:1;animation:tdraw 1.3s cubic-bezier(.65,0,.35,1) .25s forwards}@keyframes tdraw{to{stroke-dashoffset:0}}}
.t-note{margin:0;font:700 clamp(28px,6vw,40px)/1 var(--hand);color:var(--accent);transform:rotate(-2deg)}
.t-pitch{margin:0;max-width:54ch;color:var(--muted)}
.t-meta{margin:0;font-size:15px;color:var(--muted)}
.t-meta b{color:var(--ink)}
.t-cta{display:flex;gap:10px;flex-wrap:wrap}
/* route */
.t-routewrap{display:grid;gap:18px}
.t-route{position:relative;display:grid;gap:16px;padding-block:6px}
.t-route svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.t-route .all{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-dasharray:2 9;stroke-linecap:round;opacity:.6}
.t-route .done{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.t-grp{position:relative;justify-self:center;margin:14px 0 2px;font:700 32px/1 var(--hand);color:var(--ink);background:var(--bg);padding:0 10px;z-index:1}
.t-stop{position:relative;z-index:1;width:min(520px,86%);display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--card-r);padding:12px 16px 12px 12px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .16s cubic-bezier(.23,1,.32,1),box-shadow .16s}
.t-stop:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.t-stop.l{justify-self:start}
.t-stop.r{justify-self:end;flex-direction:row-reverse;text-align:right;padding:12px 12px 12px 16px}
.t-dot{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:900 16px/1 var(--display);background:var(--surface);border:2.5px solid var(--ink);font-variant-numeric:tabular-nums}
.t-stop.seen .t-dot{background:var(--accent);border-color:var(--accent);color:#fff}
.t-stop.next .t-dot{background:var(--hi)}
.t-stop b{display:block;font-weight:700;font-size:17px;line-height:1.25}
.t-stop small{display:block;color:var(--muted);font-size:14.5px;line-height:1.35;margin-top:2px}
.t-here{display:inline-block;margin-top:4px;font:700 20px/1 var(--hand);color:var(--accent)}
.t-start{justify-self:start}
.t-tools{display:flex;flex-wrap:wrap;gap:12px}
.t-tool{flex:1 1 190px;min-width:0;text-align:left;background:var(--surface);border:1.5px dashed var(--ink);border-radius:var(--card-r);padding:14px 16px;cursor:pointer}
.t-tool b{display:block;font-weight:700}
.t-tool small{color:var(--muted);font-size:14px}
.t-h{margin:18px 0 0;font:700 34px/1 var(--hand)}
@media (max-width:560px){.t-stop{width:92%}.t-stop.r{flex-direction:row;text-align:left;padding:12px 16px 12px 12px}}

</style>

<script>
var LESSONS_MD="@@ 0 | Empieza aqu\u00ed | Bienvenida a Trazo | Un mes para que tus redes trabajen para ti\nTrazo es un mes intensivo para convertir tu perfil en un lugar donde la gente te encuentra, conf\u00eda en ti y te escribe. Aqu\u00ed trazas tu ruta paso a paso: un perfil claro, una clienta ideal, una mezcla de contenido, herramientas para producirlo y conversaciones que venden sin rogar.\n\n## T\u00fa eres la marca\nLa empresa es tu socia comercial; t\u00fa eres tu propia marca personal. Integras los productos a tu vida diaria como mam\u00e1, profesionista, abuela o lo que seas. Si ma\u00f1ana cambiara todo, tu marca personal seguir\u00eda siendo tuya.\n\n## Los tres acuerdos del mes\n- **Constancia:** publicar a diario. Si fallas un d\u00eda, retomas al siguiente, sin esperar al lunes.\n- **Simplicidad:** editar un reel no deber\u00eda tomarte dos horas. Al principio te tomar\u00e1 una; en dos semanas, media.\n- **Acci\u00f3n antes que perfecci\u00f3n:** no vas a romper Instagram por equivocarte.\n\n## Tus apps\n- **Instagram** (obligatoria) y **TikTok** (opcional).\n- **CapCut** o **Edits** para editar video.\n- **Canva** para dise\u00f1o.\n- **ChatGPT** u otro asistente de IA.\n- **Un calendario digital.** Lo que no se agenda no se cumple.\n\n## Empieza tu banco de videos\nGraba todos los d\u00edas clips cortos de 5 a 10 segundos de tu vida: caminar, cocinar, el s\u00faper, hacer ejercicio, leer, tu rutina con los productos. As\u00ed no dependes del \u00e1nimo de cada d\u00eda para publicar. No necesitas casa \"est\u00e9tica\", tripi\u00e9 ni micr\u00f3fono para empezar. Organiza tu banco en: vida diaria, beneficios, testimonios, educaci\u00f3n y ventas.\n\n## C\u00f3mo usar el curso\nSon 19 clases y 5 herramientas. Puedes ir a cualquier clase desde el men\u00fa. Si es tu primera vez, ve en orden: cada bloque se apoya en el anterior.\n\n> No buscamos perfecci\u00f3n, buscamos acci\u00f3n.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfQu\u00e9 te ha detenido hasta hoy para publicar con constancia?\n\n## \u270d\ufe0f Ejercicio\n1. Escribe **qu\u00e9 quieres lograr en este mes** con tus redes, en una frase.\n2. Instala las apps que te falten.\n3. Graba **3 clips** para tu banco de videos hoy.\n\n## \u2705 Tu tarea\nBloquea en tu calendario un horario diario para crear y publicar.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu frase del mes y tu horario de creaci\u00f3n.\n\n@@ 1 | Clase 1 | Tu perfil en cuatro puntos | La auditor\u00eda del primer d\u00eda\nAntes de pensar en contenido, tu perfil tiene que decir \"soy una persona real y te puedo ayudar\". Hoy lo revisas punto por punto.\n\n## 1. Foto de perfil\nT\u00fa, con la cara bien visible y sonriendo. Sin lentes de sol, sin gorra, sin hijos, pareja ni mascota, sin paisajes ni logos. Nunca una foto hecha con IA. Prueba r\u00e1pida: \u00bfle comprar\u00edas un champ\u00fa a alguien cuya foto es un atardecer? No tiene que ser foto ejecutiva; tiene que ser tuya.\n\n## 2. Usuario (@)\nTu nombre, o el apodo por el que ya te conocen. Nunca el nombre de la marca: la gente huye de las cuentas que parecen cat\u00e1logo. El link de tu tienda s\u00ed puede ir en el perfil.\n\n## 3. Campo de nombre\nNombre y un apellido, para dar credibilidad. Puedes sumar tu tema o proyecto: \"Ana L\u00f3pez \u00b7 piel despu\u00e9s de los 40\".\n\n## 4. Descripci\u00f3n\nQui\u00e9n eres o tu filosof\u00eda, a qui\u00e9n ayudas y en qu\u00e9. Corta y concreta. Ejemplos de estructura:\n- \"Mam\u00e1 presente y emprendedora. Te ense\u00f1o a cuidarte sin culpa.\"\n- \"M\u00e1s de 40 y sin manual. Acomp\u00e1\u00f1ame en esta etapa.\"\n- \"Ayudo a mam\u00e1s a emprender desde casa, a su ritmo.\"\n\nPuedes cambiarla las veces que haga falta durante el mes: tu tema se va a afinar en las siguientes clases.\n\n## \u00bfCuenta personal o nueva?\nUsa tu cuenta personal: esa cuenta eres t\u00fa y ya tiene gente que te conoce. No compres seguidores.\n\n## Instagram y TikTok\nInstagram premia un mensaje claro: a qu\u00e9 te dedicas y c\u00f3mo ayudas. TikTok es m\u00e1s natural, como un diario. Al inicio puedes subir lo mismo a las dos y observar qu\u00e9 funciona en cada una. Vincular Instagram con Facebook tambi\u00e9n lleva tus reels a m\u00e1s gente.\n\n## \ud83e\ude9e M\u00edrate al espejo\nSi alguien que no te conoce entra hoy a tu perfil, \u00bfsabr\u00eda en 3 segundos qui\u00e9n eres y en qu\u00e9 le ayudas?\n\n## \u270d\ufe0f Ejercicio\nUsa la **Auditor\u00eda de perfil** (en Herramientas) y corrige los cuatro puntos.\n\n## \u2705 Tu tarea\nCambia hoy tu foto, usuario, nombre y descripci\u00f3n.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu perfil antes y despu\u00e9s.\n\n@@ 2 | Clase 2 | Calma, constancia y cabeza fr\u00eda | La vacuna contra el agobio\nLo que m\u00e1s hace que la gente abandone no es la falta de estrategia: es la cabeza. Esta clase te prepara para el agobio, la comparaci\u00f3n y la postergaci\u00f3n que van a aparecer durante el mes.\n\n## El embudo\nArriba hay mucha gente que no te conoce y te encuentra por contenido que se comparte. Unas cuantas te siguen. Menos te compran o se unen a tu equipo. Es normal: as\u00ed funciona.\n\n## Parte del resultado no depende de ti\nLa plataforma decide a qui\u00e9n mostrarte y cu\u00e1ndo. Hay quien despega en una semana y quien tarda ocho meses. Compararte es exigirle a tu proceso un ritmo que no controlas.\n\n## Qu\u00e9 pasa cuando te agobias\nExageras problemas peque\u00f1os, te comparas con otras y con tu propio contenido anterior, dudas de ti, imaginas lo peor y quieres abandonar. Cuando lo notes, divide lo que te agobia en partes peque\u00f1as: 15 minutos solo para leer, 15 para grabar.\n\n## El viaje en coche\nSi en un viaje a un lugar nuevo te bajas cada cinco minutos a revisar las llantas o pides aprobaci\u00f3n a todos, no llegas. Ya hay letreros: sigue la ruta.\n\n## La postergaci\u00f3n disfrazada\n\"No publico porque no tengo claridad\" y \"no tengo claridad porque no publico\" son la misma excusa. Pasar horas editando o investigando tambi\u00e9n puede ser postergar con buena cara. Ser honesta contigo es el primer paso.\n\n## La constancia es neutral\nNo se siente como fuego. Es rutina. Las que avanzan no son las m\u00e1s emocionadas, sino las m\u00e1s estables. El orden es: **acci\u00f3n \u2192 claridad \u2192 seguridad \u2192 resultados**. No necesitas sentirte c\u00f3moda con c\u00f3mo te ves para grabarte.\n\n## Constancia con estrategia\nPublicar a diario sin estrategia tampoco funciona. Por eso el curso te da las dos cosas.\n\n## Aprende a buscar\nGoogle, YouTube y tu asistente de IA son tus mejores amigos para resolver dudas t\u00e9cnicas. Si no entiendes algo, m\u00e1ndale una captura. Nada te hace m\u00e1s independiente que saber resolver.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfCu\u00e1l es tu forma favorita de postergar con buena excusa?\n\n## \u270d\ufe0f Ejercicio\n1. Escribe qu\u00e9 te agobia de este mes y div\u00eddelo en 3 partes peque\u00f1as.\n2. Responde: \u00bfqu\u00e9 pierdes si haces lo que te toca durante seis meses, aunque dudes y no veas resultados r\u00e1pidos?\n\n## \u2705 Tu tarea\nArma un pacto con 2 o 3 compa\u00f1eras: publicar al menos 4 veces esta semana y avisarse cuando lo hagan.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu pacto y con qui\u00e9n lo hiciste.\n\n@@ 3 | Clase 3 | Hablarle a todas es no venderle a nadie | Tu clienta ideal\nSi le hablas a todo el mundo, nadie te escucha. La clienta ideal no se encuentra: se elige. Y desde ah\u00ed se construye todo lo dem\u00e1s.\n\n## El partido de f\u00fatbol\n- **La empresa es el deporte:** todas juegan con los mismos productos y el mismo plan.\n- **Tu tema es la cancha:** bienestar, belleza o emprendimiento.\n- **Tu clienta ideal es tu posici\u00f3n:** portera, defensa o delantera. Cada posici\u00f3n entrena distinto.\n\nAs\u00ed te diferencias de otras vendedoras de la misma marca.\n\n## Puedes vender todo sin promover todo\nEn persona puedes ofrecer a cualquiera. En redes, para atraer, le hablas a una sola persona. Despu\u00e9s ella te puede comprar cualquier producto.\n\n## C\u00f3mo aprende la plataforma\nObserva qu\u00e9 ve completo la gente, qu\u00e9 guarda y qu\u00e9 comparte, y le muestra m\u00e1s de eso. Si tu contenido le habla a cinco perfiles distintos, no entiende a qui\u00e9n mostrarte. Tu trabajo no es gustarle a todas, sino ser claramente \u00fatil para alguien durante el tiempo suficiente.\n\n## Qu\u00e9 es una clienta ideal\nLa persona con la que tu oferta encaja mejor: menos resistencia, m\u00e1s probabilidad de actuar, mejor resultado. La se\u00f1al de que lo lograste es que te escriban \"\u00bfme est\u00e1s espiando?\".\n\n## Dos formas f\u00e1ciles de elegirla\n1. **T\u00fa antes de empezar:** tus miedos y frustraciones de entonces, con tus propias palabras.\n2. **A qui\u00e9n quieres en tu equipo:** haz tu lista de personas destacadas en lo que hacen. Quien es buena en su profesi\u00f3n suele serlo tambi\u00e9n aqu\u00ed.\n\n## \u00c1nclala a un grupo de productos\nOfr\u00e9cele una soluci\u00f3n completa, no un producto suelto: rutina de piel, bienestar, maquillaje o emprendimiento.\n\n## El ejercicio del diario\nP\u00eddele a tu asistente de IA: \"Escribe el diario de una mujer que es [tu clienta ideal], en primera persona: c\u00f3mo fue su d\u00eda, qu\u00e9 le frustr\u00f3, qu\u00e9 pens\u00f3 frente al espejo, qu\u00e9 le preocupa, qu\u00e9 quiere cambiar y qu\u00e9 le da miedo admitir. Lenguaje cotidiano, sin soluciones ni motivaci\u00f3n.\"\n\n> Al mundo no le importamos nosotras. Las redes se tratan del reflejo que la gente ve de s\u00ed misma en ti.\n\n## \ud83e\ude9e M\u00edrate al espejo\nSi tuvieras que elegir hoy una sola persona a quien hablarle, \u00bfqui\u00e9n ser\u00eda?\n\n## \u270d\ufe0f Ejercicio\nLlena la **Matriz de clienta ideal** (en Herramientas). Primero con tu cabeza; despu\u00e9s, si quieres, pide ayuda a la IA. Si dudas entre dos perfiles, elige uno: lo puedes cambiar despu\u00e9s.\n\n## \u2705 Tu tarea\nCorre el ejercicio del diario y subraya 5 frases que usar\u00edas en tu contenido.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu frase final: \"Ayudo a ___ que est\u00e1n en ___, que batallan con ___, a lograr ___ con ___.\"\n\n@@ 4 | Clase 4 | Ser extraordinaria | Una decisi\u00f3n diaria e inc\u00f3moda\nSer extraordinaria no es suerte ni talento. Es hacer lo ordinario con intenci\u00f3n, disciplina y prop\u00f3sito: presentarte cuando nadie te ve y seguir cuando ya no es c\u00f3modo.\n\n## El miedo no protege, limita\nQuedarte quieta parece seguro, pero te encierra. Si te da miedo, muchas veces vas en la direcci\u00f3n correcta.\n\n## Tu energ\u00eda vende antes que tu producto\nHay personas que suben la energ\u00eda de un lugar y otras que la apagan. Si t\u00fa est\u00e1s apagada, tu equipo se apaga: la gente hace lo que ve, no lo que dices.\n\n## La cadena\n**Pensamiento \u2192 emoci\u00f3n \u2192 acci\u00f3n \u2192 resultado.** Lo que piensas de ti y de tu negocio termina en tus resultados. Si quieres cambiar el final, empieza por el principio.\n\n## La IA son los brazos, no el cerebro\nAmplifica lo que ya eres. La estrategia, el mensaje y la intenci\u00f3n siguen siendo tuyos. Si todas publicaran lo mismo que escribe el chat, las redes ser\u00edan aburrid\u00edsimas.\n\n## Mentalidad de l\u00edder\n- No eres v\u00edctima, eres responsable. Al asumirlo recuperas el poder.\n- A veces no est\u00e1s cansada, est\u00e1s desconectada de tu para qu\u00e9.\n- Nadie va a venir a rescatarte, y eso es buena noticia: el poder est\u00e1 en tus manos.\n- Tu primer equipo eres t\u00fa: tu disciplina, tu palabra, tu coherencia.\n\n## La ejecuci\u00f3n le gana a la motivaci\u00f3n\nLa motivaci\u00f3n es una emoci\u00f3n y va y viene. La disciplina es identidad y se queda. Act\u00faa sobre todo cuando no hay ganas.\n\n## Visibilidad\nSi no te ven, no existes. El mundo no premia al mejor, sino al m\u00e1s visible y constante. Tu historia, lo que viviste y superaste, es lo que conecta.\n\n## Con los pies en la tierra\nComprometerte al cien no significa arriesgar tu estabilidad. Crece tu negocio con decisiones responsables para ti y tu familia.\n\n> El \u00e9xito sin paz no es \u00e9xito.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfHoy subes o bajas la energ\u00eda de tu equipo?\n\n## \u270d\ufe0f Ejercicio\n1. Escribe un pensamiento que te limita y la cadena que produce (emoci\u00f3n, acci\u00f3n, resultado).\n2. Reescribe el pensamiento y la nueva cadena.\n3. Escribe tu **para qu\u00e9** en una frase.\n\n## \u2705 Tu tarea\nPublica hoy, aunque no tengas ganas.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu para qu\u00e9.\n\n@@ 5 | Clase 5 | Tu marca personal | Que te elijan sin rogar\nTu marca personal es la huella que dejas en quien te ve: tus valores, tu experiencia, tu personalidad. Bien hecha, funciona como im\u00e1n y como filtro: llega gente lista y con confianza.\n\n## Sin marca y con marca\n- **Sin marca:** historias que son puras promociones, posts de precios, mensajes copiados. Se siente invasivo.\n- **Con marca:** tu proceso real, educaci\u00f3n sencilla, tu opini\u00f3n, un estilo de vida coherente. La gente quiere lo que t\u00fa usas porque te ve usarlo.\n\n## No se trata de estar lista\nSentirte lista no es una emoci\u00f3n, es una decisi\u00f3n. Consumir sin publicar, ver historias sin responder o esperar a \"tener seguidores\" son formas de comodidad. Pregunta clave: \u00bftu raz\u00f3n para moverte ya es m\u00e1s fuerte que tus excusas?\n\n## Los cinco pilares\n1. **Autenticidad:** habla como hablas en la vida real. Tu historia m\u00e1s inc\u00f3moda suele ser tu diferencia.\n2. **Coherencia:** lo que haces y dices, en l\u00ednea y fuera, va alineado. Tu propuesta no cambia cada semana.\n3. **Propuesta de valor:** a qui\u00e9n ayudas, con qu\u00e9 y para qu\u00e9.\n4. **Diferenciador:** no inventas nada nuevo; dices lo mismo desde tu vida.\n5. **Percepci\u00f3n:** no publicar tambi\u00e9n comunica.\n\n## La f\u00f3rmula de tu bio\n> Ayudo a **[qui\u00e9n]** a **[resultado]** **[c\u00f3mo o sin qu\u00e9 sacrificio]**.\n\nEscr\u00edbela muchas veces hasta que suene a ti. Cuida que el resultado sea algo que puedes sostener: nada de promesas de dinero o de salud.\n\n## La prueba de los tres segundos\nAl entrar a tu perfil, \u00bfsaben qui\u00e9n eres, qu\u00e9 haces y si eres para ellas?\n\n## Tus componentes\nValores y habilidades \u00b7 propuesta de valor \u00b7 **tono** (cercano, educativo, inspirador o directo, pero sostenido) \u00b7 **identidad visual** (tus colores y tus dos tipograf\u00edas) \u00b7 visibilidad (responder todos los comentarios).\n\n## El error n\u00famero uno\nCreer que vendes productos. Vendes tu criterio, tu estilo de vida, tu energ\u00eda y tu visi\u00f3n. Tu marca no depende de ser guapa, alta o delgada: depende de tu trabajo y tu historia.\n\n## Si ya le rogaste a alguien\nSu\u00e9ltala. La presi\u00f3n aleja; la marca atrae.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfComunicas desde quien eres o desde lo que crees que deber\u00edas ser?\n\n## \u270d\ufe0f Ejercicio\n1. Escribe tus fortalezas, tu historia en 3 l\u00edneas y el tema que podr\u00edas sostener.\n2. Escribe 3 versiones de tu bio con la f\u00f3rmula.\n3. Haz la prueba de los tres segundos con alguien que no te conozca bien.\n\n## \u2705 Tu tarea\nActualiza tu bio y archiva (no borres) las publicaciones que ya no encajan.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tus 3 versiones de bio.\n\n@@ 6 | Clase 6 | Alcance, conexi\u00f3n y venta | La mezcla 7-2-1\nUna cuenta que vende hace tres cosas a la vez: atrae gente nueva, genera confianza y pide la venta. Si te falta una, terminas famosa sin negocio, o vendi\u00e9ndole a nadie.\n\n## La mezcla de cada 10 publicaciones\n- **7 de alcance:** contenido sencillo que la gente guarda o le manda a su comadre. Humor, tips, recetas, \"s\u00ed, soy yo\".\n- **2 de conexi\u00f3n:** tu historia, tus errores, antes y despu\u00e9s, educaci\u00f3n, testimonios reales, recursos gratis.\n- **1 de venta:** clara y directa: el producto, la invitaci\u00f3n al negocio, el llamado a la acci\u00f3n.\n\n## Los tres errores\n- Solo conectar: te quedas con 50 seguidores para siempre.\n- Solo vender: te quemas con las mismas 100 personas.\n- Solo alcance: muchas vistas y nadie que compre.\n\n## El cine\nNo todo el que entra al cine compra palomitas, y eso no significa que el cine no sirva. El contenido de conexi\u00f3n tendr\u00e1 menos vistas que el de alcance. No dejes de hacerlo: ah\u00ed est\u00e1 la confianza que vende.\n\n## Que la carnada y el pescado coincidan\nAtrae con el mismo tema que luego vendes. Si atraes con recetas de crianza, te van a pedir soluciones de crianza, no maquillaje. M\u00e1ximo dos temas y que se complementen (piel y maquillaje; bienestar y cuidado del cabello).\n\n## La conexi\u00f3n que abre conversaciones\n\"Comenta GU\u00cdA y te mando mi checklist de\u2026\" Cuando te escriban, no mandes el link en autom\u00e1tico:\n1. Agradece.\n2. Pregunta su situaci\u00f3n: \"Antes de mand\u00e1rtela, cu\u00e9ntame qu\u00e9 quieres lograr\".\n3. Comparte el recurso o un consejo.\n4. Si encaja, ofrece el producto o la reuni\u00f3n de negocio.\n\nEl gancho tiene que ser espec\u00edfico y deseable. \"Comenta YO si quieres cambiar tu vida\" no funciona.\n\n## La venta\n\"Si no pides la venta, nunca te compran.\" S\u00e9 clara, muestra el producto y dile c\u00f3mo comprar. La urgencia y los descuentos solo si son reales.\n\n## Calcula tu semana\n| Publicaciones por semana | Alcance | Conexi\u00f3n | Venta |\n|---|---|---|---|\n| 7 (una al d\u00eda) | 5 | 1 | 1 |\n| 10 | 7 | 2 | 1 |\n| 14 (dos al d\u00eda) | 10 | 3 | 1 |\n\nLas historias van aparte: ah\u00ed conectas y vendes todos los d\u00edas.\n\n> La complicaci\u00f3n es enemiga de la ejecuci\u00f3n.\n\n## \ud83e\ude9e M\u00edrate al espejo\nDe tus \u00faltimas 10 publicaciones, \u00bfcu\u00e1ntas fueron de cada tipo?\n\n## \u270d\ufe0f Ejercicio\nUsa el **Planificador 7-2-1** (en Herramientas) para armar tu semana.\n\n## \u2705 Tu tarea\nCrea tu primer recurso con palabra clave y publ\u00edcalo.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu planificador de la semana.\n\n@@ 7 | Clase 7 | Encuentra lo que ya funciona | Formatos probados para tu clienta\nEl contenido de alcance no se inventa desde cero: se investiga. Hay formatos que ya demostraron que tu clienta los ve, los guarda y los comparte. Tu trabajo es encontrarlos y hacer tu propia versi\u00f3n.\n\n## Tu cuenta de investigaci\u00f3n\nAbre una segunda cuenta solo para investigar, como si fueras tu clienta ideal. Ah\u00ed buscas, ves y guardas sin que eso confunda a tu cuenta principal. En tu cuenta principal, interact\u00faa con tu comunidad y evita usarla para entretenerte con cualquier cosa.\n\n## Por qu\u00e9 no \"s\u00edgueme y te sigo\"\nSi sigues a cientos de compa\u00f1eras de la misma marca, la plataforma aprende a mostrarte a vendedoras, no a tu clienta.\n\n## C\u00f3mo buscar\n1. En la lupa escribe una palabra del mundo de tu clienta (\"menopausia\", \"rutina de piel\", \"mam\u00e1 primeriza\"). Una palabra suele funcionar mejor que dos.\n2. Busca piezas con **muchas vistas en cuentas peque\u00f1as**. As\u00ed sabes que funcion\u00f3 la idea, no la fama de la persona.\n3. F\u00edjate en los **compartidos y guardados**: valen m\u00e1s que los likes.\n4. Elige las que puedas hacer f\u00e1cil en tu casa.\n5. Si no encuentras, prueba sin\u00f3nimos, otro idioma o pide ideas de palabras a tu asistente de IA.\n\n## Haz tu versi\u00f3n, no una copia\nToma el formato: la duraci\u00f3n, el tipo de escena, la estructura del texto, el ritmo. Gr\u00e1balo t\u00fa, con tus palabras, tu casa, tu producto y un audio disponible en la app. No descargues ni resubas videos ajenos, ni copies textos palabra por palabra. Tu marca est\u00e1 en cu\u00e1les formatos eliges y c\u00f3mo los cuentas.\n\n## Sal t\u00fa\nLos memes sin tu cara sirven de emergencia, pero no construyen tu marca. Si no est\u00e1s lista para que te vean, este es el momento de empezar.\n\n## Se\u00f1ales que importan\n1. Compartidos. 2. Guardados. 3. Comentarios. Los likes son lo que menos dice. Menos de un minuto suele funcionar mejor. Sube a cada plataforma por separado, sin marca de agua de la otra app.\n\n## Los tres gatillos\n- **Identificaci\u00f3n:** \"s\u00ed, soy yo\".\n- **Entretenimiento:** humor, sorpresa.\n- **Utilidad:** una gu\u00eda completa que la gente guarda.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfEst\u00e1s eligiendo contenido por lo que te gusta a ti o por lo que necesita tu clienta?\n\n## \u270d\ufe0f Ejercicio\n1. Crea tu cuenta de investigaci\u00f3n.\n2. Guarda **10 formatos** que cumplan los criterios.\n3. Elige los 3 m\u00e1s f\u00e1ciles de hacer.\n\n## \u2705 Tu tarea\nGraba y publica tu versi\u00f3n de 3 formatos esta semana.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte el formato original (link) y tu versi\u00f3n.\n\n@@ 8 | Clase 8 | Historias limpias y atractivas | Que se entiendan en dos segundos\nUna historia que funciona no es la m\u00e1s est\u00e9tica: es la que se entiende en dos segundos y dice qu\u00e9 hacer despu\u00e9s.\n\n## Las reglas base\n1. **Se entiende en 2 segundos**, con o sin sonido. Si hablas a c\u00e1mara, pon la idea principal en texto.\n2. **Una idea por historia.** Desayuno, ejercicio y r\u00edmel en la misma historia confunden.\n3. **Tus colores y tus 2 tipograf\u00edas**, siempre las mismas.\n4. **No satures:** pocos gifs, pocos textos, espacios vac\u00edos.\n5. **Lo grande atrae:** una foto o frase principal; lo dem\u00e1s complementa.\n\n## La historia de venta\n**Frase principal** (\"S\u00ed se puede vender sin perseguir\") + **frase secundaria** corta (\"usando tus historias\") + **llamado suave** (\"\u00bfQuieres saber c\u00f3mo? Te explico\") con flecha, encuesta o sticker. Mientras m\u00e1s suave el llamado, m\u00e1s respuestas.\n\n## La serie de 4\n1. **Conecta** con un dolor: \"Tom\u00e9 caf\u00e9 tarde y no dorm\u00ed\".\n2. **Identificaci\u00f3n:** que se vean reflejadas.\n3. **Lo que a ti te funcion\u00f3**, contado como experiencia, sin prometer resultados.\n4. **Llamado a la acci\u00f3n.**\n\nError com\u00fan: subir directo la foto del producto con todos sus beneficios. Mucho texto sin contexto se brinca.\n\n## El sticker no es adorno, es direcci\u00f3n\nCada sticker dice qu\u00e9 hacer: votar, responder, reaccionar, ir al link. La encuesta con opciones positivas (\"\u00a1Me urge!\" / \"Cu\u00e9ntame m\u00e1s\") y el deslizador de emoji generan respuesta.\n\n## Trucos de Instagram\n- **Cuentagotas** para tomar un color de la foto y que todo combine.\n- **Marcador** manteniendo el dedo para un velo transl\u00facido detr\u00e1s del texto.\n- **Menciones limpias:** etiqueta y esconde la etiqueta fuera de la pantalla.\n- **Compartir historias de otras** que lo permitan, con tu contexto (por ejemplo, testimonios reales de tu equipo).\n- **Fondos:** tu espacio limpio o una foto tuya.\n\n## El \"chisme\" con prop\u00f3sito\n\"Vamos a chismear\" con encuesta funciona, pero siempre lleva a algo.\n\n## \ud83e\ude9e M\u00edrate al espejo\nRevisa tus historias de ayer: \u00bfcu\u00e1ntas se entend\u00edan en 2 segundos?\n\n## \u270d\ufe0f Ejercicio\nArma una historia de venta con frase principal, secundaria y llamado suave. Rev\u00edsala con el **Checklist de historias** (en Herramientas).\n\n## \u2705 Tu tarea\nSube tu primera serie de 4 historias.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte capturas de tu serie.\n\n@@ 9 | Clase 9 | Comparte con naturalidad | S\u00e9 la primera prueba de lo que recomiendas\nLa conexi\u00f3n en redes viene de mostrarte tal cual eres y usar los productos en tu vida real. La IA nunca le va a ganar a una emoci\u00f3n aut\u00e9ntica.\n\n## Clienta y comunidad\nLa meta es que te sigan como a una amiga que te deja entrar a su d\u00eda. Habla como t\u00fa a gente como t\u00fa.\n\n## Producto del producto\nSi recomiendas maquillaje o cuidado personal, \u00fasalo y mu\u00e9stralo. Que te pregunten \"\u00bfqu\u00e9 te hiciste?\". Lo que muestras es tu experiencia; no prometas resultados que no puedes garantizar a otras.\n\n## Las historias tambi\u00e9n son para vender\nEl miedo a \"fastidiar\" es m\u00e1s grande que la realidad. Comparte desde \"esto me ayud\u00f3 y te lo quiero contar\", no desde \"c\u00f3mprame\". Muestra lo que de verdad usas: el kit que llevas de viaje, tu rutina de la ma\u00f1ana.\n\n## Recomienda m\u00e1s que productos\nRecetas, libros, lugares, lo que te gusta. Eso te da credibilidad para cuando recomiendas lo que vendes.\n\n## Tu set\n- Luz de ventana o una pared blanca.\n- Un tripi\u00e9 o soporte para celular.\n- Si puedes, una l\u00e1mpara o aro de luz.\n\nNo necesitas m\u00e1s para empezar.\n\n## Graba en lote\nUn d\u00eda ya arreglada, cambia de blusa o peinado y graba varias piezas para varios d\u00edas o antes de un viaje.\n\n## Ganchos naturales\nContar una an\u00e9cdota y meter el producto en medio conecta mucho m\u00e1s que un gancho obvio. La gente quiere distraerse, re\u00edr y sentirse acompa\u00f1ada.\n\n## Aceptarte en c\u00e1mara\nVerte a diario ayuda a aceptarte. Lo que llamas defectos te hace \u00fanica. Si alguien ataca algo que ya aceptaste, no te mueve. A los comentarios negativos: lee, no te enganches, sigue.\n\n## Tu primer video va a estar feo\nTodas tienen uno. Ponle tu toque a todo y sigue.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfQu\u00e9 usas todos los d\u00edas y nunca has mostrado?\n\n## \u270d\ufe0f Ejercicio\n1. Arma tu set en casa y toma una foto.\n2. Escribe 5 momentos reales de tu d\u00eda donde usas los productos.\n\n## \u2705 Tu tarea\nGraba en lote 4 piezas en una sola sesi\u00f3n.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte la foto de tu set.\n\n@@ 10 | Clase 10 | CapCut: lo b\u00e1sico | Cortes, subt\u00edtulos y textos con ritmo\nCapCut es tu herramienta para editar reels din\u00e1micos. Hoy aprendes lo que vas a usar en todos tus videos. Las funciones con diamante son de paga.\n\n## Antes de editar\n- **Deja aire** al grabar para poner textos.\n- **Zona segura:** no pongas texto en la franja de abajo ni en el lado derecho, donde la app pone comentarios y botones.\n- **Graba de corrido:** si te equivocas, haz una pausa, repite la frase y lo arreglas al editar.\n\n## 1. Cortar\nToca el clip \u2192 **Dividir** en cada error o silencio. Arrastra los bordes para ajustar. Haz zoom en la l\u00ednea de tiempo con dos dedos para cortar con precisi\u00f3n.\n\n## 2. Ritmo\nAlgo visual debe cambiar seguido: un corte, un texto o una imagen cada medio segundo aproximadamente. Eso retiene.\n\n## 3. Volumen\nSube tu voz y baja la m\u00fasica para que siempre se entienda lo que dices.\n\n## 4. Subt\u00edtulos autom\u00e1ticos\n**Subt\u00edtulos \u2192 Generar.** Revisa que est\u00e9n bien escritos. Desmarca \"Aplicar a todos\" si quieres darle estilo distinto a una parte; m\u00e1rcalo si quieres el mismo estilo en todo. **Eliminar muletillas** quita los \"eh\" y \"este\".\n\n## 5. Tipograf\u00eda y estilo\nUsa **dos fuentes**: una base y otra para resaltar. Para que se lean: un delineado fino y una sombra negra suave (opacidad baja, un poco de desenfoque). Evita las plantillas de subt\u00edtulo muy recargadas.\n\n## 6. Animaciones de texto\nDe entrada, salida o en bucle. Guarda tus favoritas manteniendo el dedo \u2192 **Favoritos**, igual con fuentes y audios, para no perder tiempo buscando.\n\n## 7. Texto palabra por palabra\nDuplica el subt\u00edtulo tantas veces como palabras, deja una palabra por copia y escalona la entrada de cada una.\n\n## 8. Texto detr\u00e1s de ti\nDuplica tu clip \u2192 **Superposici\u00f3n** \u2192 alin\u00e9alo con el original \u2192 **Eliminar fondo** \u2192 en **Capas** manda el texto detr\u00e1s del recorte.\n\n## 9. Im\u00e1genes de apoyo\n**Superposici\u00f3n \u2192 Agregar** una foto tuya o una imagen oficial del producto \u2192 **Eliminar fondo** \u2192 animaci\u00f3n de entrada.\n\n## 10. Exportar\nElige resoluci\u00f3n y cuadros por segundo. 1080p a 30 fps es suficiente para redes. Usa la versi\u00f3n de la app que te corresponda y no trucos para quitar la marca de agua.\n\n> No tiene que quedar profesional. Tiene que salir.\n\n## \u270d\ufe0f Ejercicio\nEdita un video de 15 a 30 segundos con: cortes sin silencios, subt\u00edtulos con tus dos fuentes, una animaci\u00f3n guardada en favoritos y un texto detr\u00e1s de ti.\n\n## \u2705 Tu tarea\nPubl\u00edcalo.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu video y qu\u00e9 fue lo m\u00e1s dif\u00edcil.\n\n@@ 11 | Clase 11 | CapCut: el siguiente nivel | Filtros, sonido, retoque y teleprompter\nCon lo b\u00e1sico ya puedes publicar. Esta clase suma lo que hace que tu video se vea y se escuche mejor.\n\n## Filtros y \u00e9nfasis\n- Los filtros son de luz y color. Uno oscurecido hace que resalte el texto.\n- **\u00c9nfasis:** selecciona un fragmento \u2192 filtro blanco y negro + un filtro de voz. Cambia la imagen y el sonido a la vez.\n- **Zoom por cortes (gratis):** divide el clip en cada palabra clave y agranda un poco cada fragmento.\n- **Desenfoque de fondo** si tu casa no est\u00e1 arreglada.\n\n## Ajustes\nBrillo, contraste, saturaci\u00f3n, sombras. Con paga: reducir ruido, estabilizar y mejorar calidad.\n\n## Stickers\nPocos y con intenci\u00f3n: una flecha, una notificaci\u00f3n, una manita. Se pueden animar y duplicar.\n\n## Retoque con medida\nRostro y piel con intensidad baja. Importante: **Aplicar a todo** para que no cambie a media toma. No abuses: el exceso se ve falso y en contenido de belleza o bienestar enga\u00f1a.\n\n## Formato vertical\nSi grabaste en horizontal, la ampliaci\u00f3n con IA puede llevarlo a 9:16.\n\n## Sonido\n- **M\u00fasica:** usa la biblioteca de la app o guarda audios en tendencia desde Instagram o TikTok y \u00fasalos dentro de esa misma app.\n- **Efectos de sonido:** pop, clic, teclado. Ponle uno a cada texto que aparece; mejora mucho la retenci\u00f3n.\n- **Mejorar voz** al 100 para quitar ruido de fondo.\n- **Ritmos:** marca los golpes de la canci\u00f3n y cambia de imagen en cada uno.\n\n## Teleprompter\n**Grabar** \u2192 pega tu guion \u2192 ajusta velocidad y tama\u00f1o \u2192 graba mirando a la c\u00e1mara.\n\n## El orden que ahorra tiempo\nPrimero pon subt\u00edtulos y despu\u00e9s corta: los subt\u00edtulos te ense\u00f1an d\u00f3nde est\u00e1n los silencios.\n\n## Poco a poco\nPrimer video: solo cortes y subt\u00edtulos. Segundo: suma efectos de sonido. Tercero: un \u00e9nfasis. Querer un video perfecto a la primera es la manera m\u00e1s r\u00e1pida de no publicar.\n\n## \u270d\ufe0f Ejercicio\nEdita un video con: zoom por cortes, un \u00e9nfasis en blanco y negro, efectos de sonido en cada texto y voz mejorada.\n\n## \u2705 Tu tarea\nGraba un video usando el teleprompter y publ\u00edcalo.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu efecto de sonido favorito.\n\n@@ 12 | Clase 12 | Canva: dise\u00f1a desde cero | Capas, fondos y tu tipograf\u00eda sagrada\nCanva sirve para posts, carruseles, portadas y m\u00e1s. Hoy dise\u00f1as desde cero, en la computadora, con tu propio estilo.\n\n## Principios\n- **Evita las plantillas gen\u00e9ricas** tal cual: todas las usan y se nota. Si usas una, cambia fondo, fuentes y colores.\n- **Edita en la computadora:** en el celular no ves bien las capas. El celular sirve para descargar.\n- **Tipograf\u00eda sagrada:** una fuente principal para lo que quieres resaltar, siempre la misma. Una segunda para lo dem\u00e1s.\n- Canva Pro vale la pena si creas mucho, pero puedes empezar con la versi\u00f3n gratis.\n\n## Pasos para un carrusel\n1. **Crear dise\u00f1o** \u2192 busca \"post de Instagram\". El formato 3:4 da m\u00e1s espacio que el cuadrado.\n2. **Fondo:** selecciona el lienzo \u2192 color de tu paleta.\n3. **Sube tu foto** \u2192 **Quitar fondo** (Pro) si lo necesitas.\n4. **Texto:** divide la frase en 2 o 3 cajas para combinar fuentes y resaltar una palabra.\n5. **Capas** (Posici\u00f3n \u2192 Capas): para texto detr\u00e1s de ti, el orden es fondo \u2192 texto \u2192 foto sin fondo.\n6. **Formas** detr\u00e1s del texto para resaltarlo, con esquinas redondeadas.\n7. **Contorno tipo sticker:** foto \u2192 Editar \u2192 Sombras \u2192 Contorno blanco.\n8. **Segunda diapositiva:** t\u00edtulo con tu fuente principal y una lista corta.\n9. **Texto curvo:** Efectos \u2192 Curvar.\n10. **Marcos:** Elementos \u2192 Marcos para meter tu foto en un celular o c\u00edrculo.\n11. **Foto oscurecida con texto:** fondo negro y tu foto encima con transparencia baja; el texto resalta encima.\n\n## Im\u00e1genes\nUsa tus fotos o las oficiales de la marca. Pinterest sirve para inspirarte, no para descargar im\u00e1genes ajenas.\n\n> Si algo no te gusta, lo quitas. Aqu\u00ed no hay error que no se arregle.\n\n## \u270d\ufe0f Ejercicio\nDise\u00f1a un carrusel de 2 diapositivas: portada con tu foto, texto detr\u00e1s de ti y tu fuente principal; segunda diapositiva con una lista de 3 puntos.\n\n## \u2705 Tu tarea\nPubl\u00edcalo como tu contenido de conexi\u00f3n de la semana.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu portada.\n\n@@ 13 | Clase 13 | Canva: kit de marca y animaci\u00f3n | Historias y reels animados en minutos\nCon un kit de marca, todo lo que dise\u00f1as sale con tus colores y tus fuentes. Y con plantillas propias, un reel animado te toma minutos.\n\n## Tu kit de marca\n**Marca \u2192 Agregar kit de marca.**\n- **Colores:** tu paleta con sus c\u00f3digos. La versi\u00f3n gratis guarda pocos; Pro, los que quieras.\n- **Logo o firma:** en blanco, negro y color.\n- **Fuentes:** principal y secundaria.\n- Puedes guardar fotos e \u00edconos que usas siempre.\n\nPara aplicarlo a cualquier plantilla: abre la plantilla \u2192 **Marca** \u2192 tu kit.\n\n## Historia o reel animado\n1. **Crear dise\u00f1o \u2192 Reel de Instagram.**\n2. Fondo con un color de tu paleta.\n3. Agrega elementos (flechas, flores, l\u00edneas) y tu foto o producto.\n4. Todo dentro del marco para que no se corte.\n5. T\u00edtulo con tu fuente principal y un llamado: \"Cons\u00edguelo aqu\u00ed\".\n6. **Animar** cada elemento por separado: m\u00e1quina de escribir, ascender, aparecer.\n7. En la l\u00ednea de tiempo, **escalona** las entradas para que aparezcan en cascada.\n8. Que dure **10 segundos o menos**.\n9. Descarga en **MP4** para conservar la animaci\u00f3n.\n\n## Tus plantillas\nTres puntitos \u2192 **Crear una copia**, cambia el producto o la temporada y listo. As\u00ed tienes plantillas propias para cada semana.\n\n## Videos con material de la app\nBusca videos del banco de Canva, \u00fanelos y agrega transiciones con clic derecho. Pon la m\u00fasica al final en Instagram o TikTok.\n\n## \u270d\ufe0f Ejercicio\n1. Crea tu kit de marca.\n2. Haz una historia animada de un producto con 3 elementos que entren en cascada.\n\n## \u2705 Tu tarea\nGu\u00e1rdala como plantilla y haz una segunda versi\u00f3n con otro producto.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu historia animada.\n\n@@ 14 | Clase 14 | Color para tu marca | Lo que tu paleta comunica\nLos colores comunican antes que las palabras. Elegirlos con intenci\u00f3n, y no solo por gusto, ayuda a que tu marca se vea coherente y te reconozcan sin ver tu nombre.\n\n## T\u00f3malo como gu\u00eda, no como ley\nEstas asociaciones vienen de la publicidad y cambian seg\u00fan la cultura y la persona. \u00dasalas para decidir, no como reglas cient\u00edficas.\n\n## Lo que suele comunicar cada color\n| Color | Suele transmitir | \u00dasalo para |\n|---|---|---|\n| Rojo | Pasi\u00f3n, energ\u00eda, alerta | Acentos y llamados puntuales, no como color principal |\n| Azul | Confianza, calma, responsabilidad | Color principal en temas de organizaci\u00f3n, finanzas o metas |\n| Verde | Naturaleza, calma, frescura | Bienestar y mensajes que no deben asustar |\n| Amarillo o dorado | Calidez, alegr\u00eda, valor | Acentos que iluminan; dorado para un toque especial |\n| Naranja | Juventud, diversi\u00f3n | Campa\u00f1as cortas o p\u00fablico muy joven |\n| Morado | Exclusividad, elegancia, espiritualidad | Marcas que buscan verse sofisticadas |\n| Caf\u00e9 | Tierra, tradici\u00f3n, experiencia | Marcas naturales y cercanas |\n| Rosa | Dulzura, feminidad, cercan\u00eda | P\u00fablico principalmente femenino |\n| Negro | Elegancia, lujo, fuerza | Fondos y portadas; con dorado se ve premium |\n| Blanco | Limpieza, calma, minimalismo | Espacio para respirar; bienestar y calma |\n| Varios colores | Diversidad, alegr\u00eda, innovaci\u00f3n | Un color base y los dem\u00e1s de acento |\n\n## C\u00f3mo elegir tu paleta\n1. Piensa en c\u00f3mo quieres que se sienta tu clienta cuando te ve.\n2. Elige un color principal, uno secundario y uno de acento.\n3. Si odias un color, busca otro que transmita lo mismo.\n4. Pru\u00e9bala en 3 piezas antes de decidir.\n\n## Una paleta, toda tu comunicaci\u00f3n\nPosts, reels, historias, PDF y presentaciones salen de la misma paleta. Si un d\u00eda cambias de colores, hazlo como un relanzamiento, no a medias.\n\n## Sobre la urgencia\nEl rojo llama la atenci\u00f3n, pero \u00fasalo para avisos reales: \"se acab\u00f3\", \"\u00faltimo d\u00eda\". Nunca para fingir que quedan pocos lugares o que el precio sube.\n\n## \u270d\ufe0f Ejercicio\nElige tus 3 colores y tus 2 fuentes. Gu\u00e1rdalos en tu kit de marca.\n\n## \u2705 Tu tarea\nRedise\u00f1a tu pr\u00f3xima portada con tu paleta nueva.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu paleta y qu\u00e9 quieres que transmita.\n\n@@ 15 | Clase 15 | Tu asistente de IA | Piensa contigo, no por ti\nChatGPT y otros asistentes son como una asistente disponible a cualquier hora. Te ayudan a escribir, organizar y destrabarte, si les das buenas instrucciones y siempre lees lo que te devuelven.\n\n## T\u00fa eres la jefa\nSe equivoca. Lee todo, cuestiona y adapta a tu forma de hablar. Si copias y pegas, suena a robot y la gente lo nota.\n\n## La f\u00f3rmula del prompt\n1. **Rol:** \"Act\u00faa como experta en\u2026\"\n2. **Contexto:** qui\u00e9n eres y qu\u00e9 haces.\n3. **Objetivo:** qu\u00e9 pieza exactamente (post, historia, mensaje).\n4. **A qui\u00e9n le hablas:** tu clienta ideal.\n5. **Canal:** Instagram, WhatsApp, correo.\n6. **Tono:** cercano, directo, c\u00e1lido\u2026 y \"sin promesas exageradas\".\n\n## Ejemplo\n> Act\u00faa como estratega de contenido para emprendedoras de venta directa. Vendo productos de belleza y bienestar a mam\u00e1s que trabajan. Ay\u00fadame con 7 ideas de contenido para Instagram esta semana: 5 de alcance, 1 de conexi\u00f3n y 1 de venta. Tono c\u00e1lido y realista, sin promesas de ingresos ni de salud.\n\n## T\u00e9cnicas que hacen la diferencia\n- **Itera:** \"m\u00e1s corto\", \"m\u00e1s c\u00e1lido\", \"para mam\u00e1s de adolescentes\". La primera respuesta casi nunca es la buena.\n- **Pide 3 versiones:** emocional, educativa y directa. Combina lo mejor.\n- **Dicta por voz** tus ideas y p\u00eddele que las ordene.\n- **Dale tu contexto:** c\u00f3mo hablas, qu\u00e9 te gusta, qu\u00e9 no dices nunca.\n- **Destr\u00e1bate:** \"Ay\u00fadame a entender por qu\u00e9 estoy evitando publicar sobre\u2026\"\n- **Planea:** \"Tengo 30 minutos al d\u00eda. Ay\u00fadame a planear mi semana de contenido.\"\n\n## Organ\u00edzalo en proyectos\nCrea un proyecto por \u00e1rea (contenido, ventas, productos, mi clienta ideal) y conversaciones dentro de cada uno. Si cambias de tema o de clienta, actualiza la informaci\u00f3n que le diste.\n\n## Para mensajes uno a uno\n\u00dasalo para ordenar qu\u00e9 decir, pero manda el mensaje con tus palabras, o mejor en nota de voz. El texto generado suele sonar a anuncio.\n\n## Im\u00e1genes con IA\n\u00dasalas con medida. Que tu contenido principal seas t\u00fa, real. No uses IA para tu foto de perfil ni para fingir resultados.\n\n## \u270d\ufe0f Ejercicio\nEscribe tu prompt base con los 6 elementos y gu\u00e1rdalo. Pru\u00e9balo pidiendo tus ideas de la semana.\n\n## \u2705 Tu tarea\nCrea tus proyectos y corre 3 prompts de la herramienta **Prompts para tu negocio**.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte el prompt que mejor te funcion\u00f3.\n\n@@ 16 | Clase 16 | Vender sin vender | Conectar en lugar de perseguir\nA muchas les da pena vender. Pero vender bien no es perseguir ni presionar: es atraer, escuchar y compartir experiencias reales.\n\n## Lo que creemos y lo que s\u00ed es\n| Lo que creemos que es vender | Lo que s\u00ed es |\n|---|---|\n| Insistir | Persistir, buscando otra forma |\n| Incomodar | Generar confianza con honestidad |\n| Perseguir | Atraer |\n| Recitar fichas t\u00e9cnicas | Contar soluciones desde tu experiencia |\n| Hablar mucho | Escuchar y observar |\n| Convencer | Inspirar |\n| Presionar | Despertar el deseo |\n\n## Como una doctora\nAntes de recomendar, pregunta: \u00bfqu\u00e9 busca?, \u00bfqu\u00e9 ha probado?, \u00bfqu\u00e9 le importa? Escucha antes de proponer y personaliza la soluci\u00f3n. Nada de guiones gen\u00e9ricos.\n\n## Empieza por la experiencia\nEn lugar de \"Hola, tengo un programa\", prueba \"\u00bfA ti tambi\u00e9n te pas\u00f3 que\u2026?\". Primero el resultado emocional que viviste; los detalles t\u00e9cnicos, si preguntan.\n\n## Un producto gancho\nComo la tienda ancla de un centro comercial: conectas con uno que amas y desde ah\u00ed la persona conoce los dem\u00e1s.\n\n## Las objeciones con curiosidad\n\"\u00bfPor qu\u00e9 no te funcion\u00f3?\", \"\u00bfC\u00f3mo lo usaste?\". Los \"no\" son informaci\u00f3n, no un fracaso.\n\n## El trabajo invisible\n- **Cuida a tus clientas actuales:** conseguir una nueva cuesta varias veces m\u00e1s que venderle a quien ya conf\u00eda.\n- **Act\u00faa como due\u00f1a desde hoy.**\n- **Mide:** una hoja simple con qui\u00e9n compra, cada cu\u00e1nto y qu\u00e9.\n- **Piensa a largo plazo**, no solo en el cierre del mes.\n- **Cumple:** puntualidad y palabra construyen reputaci\u00f3n.\n\n## H\u00e1bitos que sostienen\n- **Pega un h\u00e1bito nuevo a uno que ya tienes:** \"despu\u00e9s de lavarme los dientes, escribo a 3 clientas\".\n- **Deja todo listo el domingo.**\n- **Mejora 1% al d\u00eda.**\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfCu\u00e1l es tu objeci\u00f3n interna para vender?\n\n## \u270d\ufe0f Ejercicio\n1. Escribe tu objeci\u00f3n interna y una frase para contestarle.\n2. Arma tu hoja de seguimiento de clientas.\n3. Elige el h\u00e1bito que vas a pegar a tu rutina.\n\n## \u2705 Tu tarea\nEscr\u00edbele a 3 clientas actuales para preguntarles c\u00f3mo les ha ido, sin venderles.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu h\u00e1bito pegado.\n\n@@ 17 | Clase 17 | Tu ecosistema digital | Cada canal tiene su trabajo\nLas grandes marcas usan varios canales y cada uno tiene una funci\u00f3n. T\u00fa puedes hacer lo mismo a tu escala.\n\n## Los canales\n- **La tienda en l\u00ednea:** la marca ya la tiene. Tu trabajo es llevar gente a ella. Recomienda productos juntos (\"completa tu rutina\").\n- **Tu \"blog\":** un canal de difusi\u00f3n, historias destacadas o un videoblog donde le hablas a tu comunidad m\u00e1s fiel sin vender. Una vez al mes basta.\n- **Mensajes directos y listas:** canal de difusi\u00f3n de Instagram, WhatsApp Business o correo. Llegan a quien no est\u00e1 viendo redes y son m\u00e1s directos para comprar. Escribe solo a quien acept\u00f3 recibirlos.\n- **Publicidad pagada:** funciona mejor cuando el anuncio parece contenido normal. Si tu contenido org\u00e1nico todav\u00eda no conecta, espera. Empieza con poco y mide.\n\n## Cada red, su papel\n- **Instagram:** interacci\u00f3n y llevar gente a tu WhatsApp o tienda.\n- **Facebook:** conversaci\u00f3n en grupos y Messenger; ah\u00ed tambi\u00e9n funcionan los reels.\n- **TikTok:** que te descubra gente nueva.\n- **Pinterest:** inspiraci\u00f3n y b\u00fasqueda de productos.\n\nPuedes reciclar el mismo contenido en varias redes y reservar piezas especiales para cada canal.\n\n## Grande, mediana y diaria\n- **Pieza grande:** una al mes, m\u00e1s trabajada (un video largo, un lanzamiento). De ella salen muchas peque\u00f1as.\n- **Piezas medianas:** algunas por semana: promociones, tutoriales.\n- **Piezas diarias:** el d\u00eda a d\u00eda que te mantiene presente.\n\n## Mide\nDeja crecer cada publicaci\u00f3n 3 o 4 d\u00edas y revisa: cu\u00e1ntas personas la vieron, cu\u00e1ntas interactuaron y cu\u00e1ntas dieron clic. Preg\u00fantate por qu\u00e9 funcion\u00f3 o no.\n\n> Lo que no se mide no se puede repetir.\n\n## \u270d\ufe0f Ejercicio\nDibuja tu ecosistema: qu\u00e9 canales usas, para qu\u00e9 sirve cada uno y cu\u00e1l te falta.\n\n## \u2705 Tu tarea\nPlanea tu pieza grande del mes y escribe 5 piezas peque\u00f1as que saldr\u00e1n de ella.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu pieza grande.\n\n@@ 18 | Clase 18 | De 0 a 100 | Sostener tu tema y tu visibilidad\nLas que crecen no son las que nunca tuvieron miedo, sino las que eligieron un tema y lo sostuvieron todos los d\u00edas, con ganas y sin ganas.\n\n## El tema se decide, no se encuentra\nNo cae como iluminaci\u00f3n. Aparece mientras publicas, te equivocas y conectas. El error com\u00fan es cambiar de tema cada semana. Un tema imperfecto que sostienes funciona mejor que uno perfecto que abandonas.\n\n## La repetici\u00f3n\nLas cuentas que dominan un tema dicen lo mismo de muchas maneras. Repetir no aburre: te posiciona.\n\n## El viaje de tu clienta\n1. Te observa en silencio.\n2. Guarda o comparte.\n3. Interact\u00faa con un emoji o una encuesta.\n4. Se anima a escribirte.\n\nNadie escribe de la nada: es siembra.\n\n## Cuando te escriba\n**Escucha \u2192 conecta \u2192 acompa\u00f1a \u2192 la venta llega sola.** Pregunta qu\u00e9 la movi\u00f3 a escribirte y en qu\u00e9 etapa est\u00e1, antes de hablar de productos.\n\n## Visibilidad para valientes\nSer visible no es gritar ni ser perfecta ni extrovertida: es mostrarte aunque te tiemble la voz. El primer video da pena; no lo borres, para que se note tu avance. Como aprender a nadar: primero los pies, luego chapotear, luego nadar.\n\n## Rod\u00e9ate de gente que suma\nBusca a quienes te dicen \"s\u00ed puedes\". El brillo de una incomoda a algunas; no es tu problema.\n\n## H\u00e1bitos que hacen crecer\n- Usar los productos y mostrarlos.\n- Preparar tu imagen y tu contenido con anticipaci\u00f3n.\n- Abrir tu \"tienda\" todos los d\u00edas, en l\u00ednea y en persona.\n- Aceptar oportunidades de mostrarte aunque den miedo.\n- Metas escalonadas: un mes bajo no es fracaso, se remonta.\n- Planear: crear y programar un d\u00eda, revisar y ajustar a media semana.\n\n## Comentarios negativos\nLee, no contestes con enojo, sigue. Perder seguidores que no son tu clienta est\u00e1 bien.\n\n> La claridad sostenida le gana a la viralidad de un d\u00eda.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfCu\u00e1ntas veces has cambiado de tema en los \u00faltimos meses?\n\n## \u270d\ufe0f Ejercicio\nResponde: \u00bfa qui\u00e9n le hablo?, \u00bfqu\u00e9 siente hoy?, \u00bfqu\u00e9 voy a subir esta semana para que diga \"esa soy yo\"?\n\n## \u2705 Tu tarea\nDefine tu d\u00eda de crear y tu d\u00eda de revisar, y ag\u00e9ndalos.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu tema en una frase.\n\n@@ 19 | Clase 19 | Graduaci\u00f3n | Hazlo sola y ens\u00e9\u00f1alo\nEl curso termina; tu etapa de hacerlo sola empieza. Ya tienes el paso a paso. Ahora toca sostenerlo, pulirlo y ense\u00f1arlo.\n\n## Constancia con estrategia\nPublicar a diario sin estrategia no da resultados. Con un tema claro, una mezcla 7-2-1 y formatos probados, s\u00ed. Si no ves resultados, revisa: \u00bfdefiniste tu tema?, \u00bfpublicaste a diario?, \u00bfseguiste la mezcla?\n\n## Duplica, no solo compartas\nVuelve a ver las clases, apl\u00edcalas y ens\u00e9\u00f1alas a tu equipo. Cuando explicas algo, lo aprendes dos veces y tu equipo te reconoce como l\u00edder.\n\n## Ya influyes\nSi influyes en una persona, ya eres influencer. Celebra en p\u00fablico tus avances peque\u00f1os.\n\n## Dimensiona tu alcance\nSi 300 personas vieron tu video, piensa en un sal\u00f3n lleno. Si fueron 3,000, un teatro. Comp\u00e1ralo con lo que tardar\u00edas puerta por puerta.\n\n## No te compares\nDetr\u00e1s de cada \u00e9xito visible hay meses de constancia que no ves. El presente de otra puede ser tu futuro si haces el trabajo.\n\n## Lidera con el ejemplo\nNo pidas a tu equipo lo que t\u00fa no haces. Tu marca personal te acompa\u00f1a siempre.\n\n## Lo que ya tienes\n- Tu perfil auditado.\n- Tu clienta ideal.\n- Tu bio y tu marca personal.\n- Tu mezcla 7-2-1 y tu cuenta de investigaci\u00f3n.\n- Historias limpias y tu set.\n- CapCut, Canva, tu paleta y tu asistente de IA.\n- Tu forma de vender sin perseguir.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfQu\u00e9 hiciste este mes que antes te daba miedo?\n\n## \u270d\ufe0f Ejercicio\n1. Escribe 3 cambios que lograste.\n2. Escribe 3 cosas que vas a seguir haciendo cada semana.\n3. Elige qu\u00e9 clase vas a ense\u00f1ar primero a tu equipo.\n\n## \u2705 Tu tarea\nComparte tu antes y despu\u00e9s de perfil en tus historias.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu clase favorita y por qu\u00e9.\n\n@@ 20 | Herramientas | Auditor\u00eda de perfil | Revisa los cuatro puntos\nMarca cada punto cuando lo cumplas.\n\n## Foto\n- Se ve mi cara clara y sonriendo.\n- Sin lentes de sol, gorra, hijos, pareja, mascotas, paisajes ni logos.\n- No es una foto hecha con IA.\n\n## Usuario (@)\n- Es mi nombre o el apodo por el que me conocen.\n- No incluye el nombre de la marca.\n\n## Nombre\n- Nombre y un apellido.\n- Opcional: mi tema (\"\u00b7 piel despu\u00e9s de los 40\").\n\n## Descripci\u00f3n\n- Dice qui\u00e9n soy o mi filosof\u00eda.\n- Dice a qui\u00e9n ayudo y en qu\u00e9.\n- Es corta y concreta.\n- No promete dinero ni resultados de salud.\n\n## Extra\n- Link a mi tienda o WhatsApp.\n- Prueba de los 3 segundos aprobada.\n\n@@ 21 | Herramientas | Matriz de clienta ideal | Para hablarle a una sola\nLlena solo lo que sabes. Deja en blanco lo dem\u00e1s y compl\u00e9talo con el tiempo.\n\n## La matriz\n1. \u00bfQu\u00e9 me gusta m\u00e1s de la marca? (bienestar, maquillaje, cuidado de la piel, emprendimiento)\n2. \u00bfA qui\u00e9n quiero atraer? (clienta de producto, clienta recurrente, socia para el equipo)\n3. \u00bfQui\u00e9n es hoy y c\u00f3mo se siente? \u00bfQu\u00e9 le frustra y qu\u00e9 ya no quiere vivir?\n4. **Lo que dice** que le duele y **lo que siente pero no dice**.\n5. **Frases textuales** que usa.\n6. **Objeciones pr\u00e1cticas** (tiempo, dinero, tecnolog\u00eda) y **emocionales** (miedo a fallar, a exponerse).\n7. **Lo que admite que quiere** y **lo que desea en el fondo**.\n8. **En una frase:** \"Ayudo a ___ que est\u00e1n en ___, que batallan con ___, a lograr ___ con ___.\"\n\n## Prompts para profundizar\n- El diario de un d\u00eda de su vida, en primera persona.\n- Una conversaci\u00f3n de ella con una amiga sobre su problema.\n- Qu\u00e9 buscar\u00eda en Google o YouTube.\n- C\u00f3mo se ve antes y despu\u00e9s de encontrar la soluci\u00f3n.\n\n@@ 22 | Herramientas | Planificador 7-2-1 | Tu semana de contenido\nCopia esta tabla cada semana.\n\n## Mi semana\n| D\u00eda | Tipo | Formato | Idea | Listo |\n|---|---|---|---|---|\n| Lunes | Alcance | | | |\n| Martes | Alcance | | | |\n| Mi\u00e9rcoles | Conexi\u00f3n | | | |\n| Jueves | Alcance | | | |\n| Viernes | Alcance | | | |\n| S\u00e1bado | Venta | | | |\n| Domingo | Alcance | | | |\n\n## Historias de cada d\u00eda\n- Algo de tu d\u00eda.\n- Uso real de un producto.\n- Una pregunta o encuesta.\n- Una vez por semana: una serie de 4 de venta.\n\n## Al final de la semana\n- \u00bfQu\u00e9 pieza tuvo m\u00e1s compartidos y guardados?\n- \u00bfQu\u00e9 conversaci\u00f3n se abri\u00f3?\n- \u00bfQu\u00e9 repito la pr\u00f3xima semana?\n\n@@ 23 | Herramientas | Checklist de historias | Antes de publicar\n- Se entiende en 2 segundos.\n- Tiene una sola idea.\n- Usa mis colores.\n- Usa mis 2 tipograf\u00edas.\n- Tiene espacio libre, no est\u00e1 saturada.\n- El elemento principal es grande.\n- Tiene un sticker o llamado con direcci\u00f3n.\n- Si es de venta, es parte de una serie de 4.\n- No promete resultados de salud ni de dinero.\n\n@@ 24 | Herramientas | Prompts para tu negocio | Para tu asistente de IA\nCopia, cambia lo que est\u00e1 entre corchetes y adapta siempre la respuesta a tu voz.\n\n## Mi prompt base\n> Act\u00faa como [rol]. Soy [qui\u00e9n eres] y vendo [qu\u00e9] a [tu clienta ideal]. Ay\u00fadame con [pieza] para [canal]. Tono [tono], realista, sin promesas de ingresos ni de salud. Dame 3 versiones: emocional, educativa y directa.\n\n## Contenido\n> Dame 10 ideas de contenido de alcance para [clienta ideal] que la hagan pensar \"s\u00ed, soy yo\".\n\n> Convierte esta idea en un guion de reel de 20 segundos con un gancho en los primeros 2 segundos: [idea].\n\n## Historias\n> Escribe una serie de 4 historias para [producto]: conectar con un dolor, identificaci\u00f3n, mi experiencia y llamado suave. Sin prometer resultados.\n\n## Conversaciones\n> Una clienta me escribi\u00f3 \"[mensaje]\". Ay\u00fadame a responder con preguntas para entender qu\u00e9 busca, sin venderle todav\u00eda.\n\n## Organizaci\u00f3n\n> Tengo [30] minutos al d\u00eda. Ay\u00fadame a planear mi semana de contenido con la mezcla 7-2-1.\n\n## Bloqueos\n> Ay\u00fadame a entender por qu\u00e9 estoy evitando [publicar / invitar / grabarme] y dame un primer paso peque\u00f1o para hoy.\n";
var FAQ_MD="## Empezar | 0\n\n### \u00bfTengo que tomar las clases en orden?\nLa primera vez te lo recomendamos, porque cada bloque usa lo del anterior. Pero puedes ir a cualquier clase desde el men\u00fa.\n\n### \u00bfCu\u00e1nto tiempo me toma?\nEst\u00e1 pensado para un mes: una clase casi diaria y publicar todos los d\u00edas. Si vas m\u00e1s lento, no pasa nada; lo importante es no soltarlo.\n\n### \u00bfD\u00f3nde guardo mis ejercicios?\nEn el cuaderno al final de cada clase. Se guarda solo en este dispositivo y navegador. Copia lo importante a tu libreta.\n\n### \u00bfTengo que pagar CapCut, Canva o ChatGPT?\nNo para empezar. Las versiones gratis alcanzan para todo lo b\u00e1sico. Si vas a crear mucho, la versi\u00f3n de paga te ahorra tiempo.\n\n## Perfil y marca | 1\n\n### \u00bfUso mi cuenta personal o abro una nueva?\nTu cuenta personal: esa cuenta eres t\u00fa y ya tiene gente que te conoce. Para investigar formatos, abre una segunda cuenta aparte.\n\n### \u00bfPuedo poner el nombre de la marca en mi usuario?\nMejor no. Usa tu nombre. El link de tu tienda s\u00ed puede ir en el perfil.\n\n### No s\u00e9 qu\u00e9 tema elegir.\nEmpieza por ti antes de resolver lo que hoy ya resolviste (Clase 3). Elige uno y sostenlo; lo puedes afinar despu\u00e9s (Clase 18).\n\n## Contenido | 6\n\n### \u00bfCu\u00e1ntas veces publico?\nAl menos una vez al d\u00eda. Con 7 publicaciones a la semana: 5 de alcance, 1 de conexi\u00f3n y 1 de venta. Las historias van aparte, todos los d\u00edas.\n\n### \u00bfEst\u00e1 bien copiar videos que se hicieron virales?\nCopia el formato, no el video. Haz tu versi\u00f3n con tus palabras, tu espacio y un audio de la app. No descargues ni resubas contenido ajeno.\n\n### Mis amigas y familia no me comentan.\nEst\u00e1 bien: probablemente no son tu clienta ideal. F\u00edjate en los compartidos y guardados de gente que no conoces.\n\n### \u00bfSirven los hashtags?\nPesan poco. Importa m\u00e1s que tu tema sea claro y que tu contenido se comparta y se guarde.\n\n### Me da pena salir a cuadro.\nEs muy normal. Tu primer video va a estar feo y est\u00e1 bien. Empieza con historias cortas y no lo borres, para que se note tu avance.\n\n## Ventas | 16\n\n### \u00bfPuedo poner \"quedan pocos lugares\" para que se decidan?\nSolo si es verdad. Nunca inventes escasez, descuentos ni garant\u00edas.\n\n### \u00bfPuedo decir que un producto me quit\u00f3 un problema de salud?\nNo. Cuenta tu experiencia de uso sin prometer resultados de salud, y no hables de enfermedades. Si alguien tiene un tema de salud, que lo vea con su m\u00e9dico.\n\n### \u00bfPuedo decir cu\u00e1nto gano para invitar a mi equipo?\nNo prometas ingresos ni uses tus cifras como promesa. Comparte tu experiencia, lo que te gusta del negocio y deja que cada quien decida.\n\n### Alguien me escribi\u00f3 por mi palabra clave, \u00bfqu\u00e9 le digo?\nAgradece, pregunta qu\u00e9 quiere lograr, comparte el recurso o un consejo y, si encaja, ofrece el producto o la reuni\u00f3n. Est\u00e1 en la Clase 6.\n\n## El mentor | 0\n\n### \u00bfQu\u00e9 es \"Tu mentora\"?\nEs la mentora de Trazo dentro de Claude. Te da las clases una por una, audita tu perfil, te ayuda con tu clienta ideal, tus ideas 7-2-1, tus historias y tus mensajes.\n\n### \u00bfTengo que pagar Claude?\nNo. Funciona con la cuenta gratis de claude.ai. La cuenta gratis tiene un l\u00edmite de mensajes por d\u00eda.\n\n### \u00bfC\u00f3mo la instalo?\nDescarga la mentora (.zip) en la pesta\u00f1a Tu mentora. En Claude entra a Customize \u2192 Skills, toca \"+\", luego \"Create skill\" \u2192 \"Upload a skill\" y sube el zip sin descomprimir.\n";
