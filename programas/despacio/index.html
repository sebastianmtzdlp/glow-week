<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.press{transition:transform .16s cubic-bezier(.23,1,.32,1)}

/* tabs */
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:center;margin-inline:-16px;padding:10px 16px}
.tabbar::before{content:"";position:absolute;inset:0;background:var(--bg);opacity:.94;z-index:-1}
.tabs{display:flex;gap:4px;max-width:100%;overflow-x:auto;padding:4px;border-radius:var(--tabs-r,999px);background:var(--surface);border:1px solid var(--line)}
.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:15px;padding:10px 18px;border-radius:var(--tabs-r,999px);cursor:pointer}

/* shared buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:15px;padding:12px 18px;border-radius:var(--btn-r,999px);cursor:pointer;text-decoration:none;transition:transform .16s cubic-bezier(.23,1,.32,1)}

.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.f-count{margin:0;color:var(--muted);font-size:14px}

.ans{padding:0 18px 18px}

.ans ul,.ans ol{margin:0 0 .8em;padding-left:1.3em}
.ans .go{margin-top:10px}
mark{background:var(--mark,rgba(255,200,0,.35));color:inherit;border-radius:3px;padding:0 2px}

/* mentor */
.mentorv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 40px;align-items:start}

.m-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.m-can{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.m-can li{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,16px);padding:14px 16px}
.m-can b{display:block;font-weight:700}
.m-can span{color:var(--muted);font-size:15px}
.m-dl{display:flex;flex-wrap:wrap;gap:10px}
.m-note{margin:0;color:var(--muted);font-size:14px}
.m-h{margin:0;font:var(--h3-font)}
.m-steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}

.m-steps li::before{counter-increment:s;content:counter(s);font:var(--num-font,700 22px/1 var(--display));color:var(--accent-text,var(--accent))}
.m-prompts{display:grid;gap:8px}
.m-prompt{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,14px);padding:10px 12px 10px 16px}
.m-prompt q{quotes:none;min-width:0;font-size:15.5px}
.m-prompt .btn{padding:8px 14px;font-size:13.5px;flex:none}
.m-limits{display:flex;flex-wrap:wrap;gap:8px}
.m-limits span{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted)}
footer.foot{text-align:center;font-size:14px;color:var(--muted);padding-top:20px}

/* ---------- reader sheet (the lights come on) ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;transition:opacity .45s cubic-bezier(.32,.72,0,1)}

.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;top:calc(12px + env(safe-area-inset-top,0px));margin:0 auto;max-width:800px;background:var(--r-bg);color:var(--r-ink);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:0 -12px 50px rgba(0,0,0,.35);font-family:var(--r-body,var(--body))}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{flex:none;touch-action:none;cursor:grab;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 14px 10px 20px;border-bottom:1px solid var(--r-line);position:relative}
.grab::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--r-line)}
.grab .where{font-size:14px;font-weight:600;color:var(--r-muted);padding-top:8px}
.grab .x{border:1px solid var(--r-line);background:transparent;color:var(--r-ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;margin-top:6px}
.sheet :focus-visible{outline:2px solid var(--r-accent);outline-offset:3px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:clamp(22px,5vw,48px) clamp(18px,5vw,56px) calc(56px + env(safe-area-inset-bottom,0px))}
.r-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:end;margin-bottom:18px}
.r-head.nonum{grid-template-columns:minmax(0,1fr)}
.r-num{grid-row:span 2;font:var(--r-num-font,800 96px/.8 var(--display));color:var(--r-accent);font-variant-numeric:tabular-nums}
.r-k{margin:0;font-size:14.5px;font-weight:600;color:var(--r-accent)}
.r-title{margin:0;font:var(--r-title-font,700 clamp(32px,6.5vw,48px)/1 var(--display));letter-spacing:var(--r-title-track,-.01em);text-wrap:balance}
.r-topic{margin:0 0 18px;font-size:20px;line-height:1.35;color:var(--r-muted)}
.r-intro{font-size:20px;line-height:1.5;margin:0 0 26px;padding-bottom:24px;border-bottom:1px solid var(--r-line)}
.lesson-body p,.lesson-body li{max-width:66ch}
.lesson-body p{margin:0 0 .9em}
.lesson-body ul,.lesson-body ol{margin:0 0 1em;padding-left:1.3em}
.lesson-body li{margin:.4em 0}
.lesson-body li::marker{color:var(--r-accent);font-weight:700}
.lesson-body strong{font-weight:700}
.lesson-body h3{font:var(--r-h3-font,700 26px/1.15 var(--display));margin:36px 0 10px;text-wrap:balance}
.callout{margin:28px 0;padding:22px 24px;border-radius:var(--card-r,18px);background:var(--r-callout-bg);color:var(--r-callout-ink)}
.callout p{margin:0;font:var(--r-callout-font,700 clamp(22px,4.6vw,28px)/1.2 var(--display));max-width:34ch;text-wrap:balance}
.turn{margin-top:40px;padding-top:26px;border-top:2px solid var(--r-ink);display:grid;gap:12px}
.turn h3{margin:0;font:var(--r-h3-font,700 26px/1.15 var(--display))}
.task{background:var(--r-surface);border:1px solid var(--r-line);border-radius:var(--card-r,16px);padding:16px 18px}
.task h4{margin:0 0 6px;font-size:17px}
.task p:last-child,.task ul:last-child,.task ol:last-child{margin-bottom:0}
.nb-l{font-weight:600;font-size:14px;color:var(--r-muted);margin-top:6px}
.sheet textarea{width:100%;min-height:150px;resize:vertical;font:16px/1.55 var(--r-body,var(--body));color:var(--r-ink);background:var(--r-surface);border:1px solid var(--r-line);border-radius:12px;padding:14px 16px}
.saved{font-size:13px;color:var(--r-muted);min-height:1.2em}
.r-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:34px;padding-top:22px;border-top:1px solid var(--r-line)}
.r-foot .nav{display:flex;gap:8px;flex-wrap:wrap}
.sheet .btn{border-color:var(--r-line);color:var(--r-ink)}
.sheet .btn.solid{background:var(--r-ink);border-color:var(--r-ink);color:var(--r-bg)}
.sheet .btn.done{background:var(--r-accent);border-color:var(--r-accent);color:var(--r-accent-ink,var(--r-bg))}
.r-next{width:100%;margin:0;font-size:14px;color:var(--r-muted)}
body.sheet-open{overflow:hidden}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.mentorv .sec-h{font-size:clamp(28px,6.4vw,46px)}
/* Despacio: the page is the book's cover, an off-white sheet with black serif type, a graphite line and a yellow pencil. The one moment: the pencil draws the line a little further with every class you finish. */
:root{
  --bg:#F6F3EA; --surface:#FFFDF6; --ink:#151412; --muted:#5D5950; --line:#E0DACB; --accent:#F2C12E; --accent-ink:#151412; --accent-text:#7A5C00; --eraser:#E3978B; --graphite:#6E6A62; --hl:rgba(242,193,46,.55); --focus:#151412; --mark:rgba(242,193,46,.5);
  --display:"Crimson Pro",Georgia,"Times New Roman",serif; --body:"Instrument Sans",system-ui,-apple-system,sans-serif;

  --r-num-font:italic 400 clamp(84px,19vw,128px)/.8 var(--display); --r-title-font:500 clamp(34px,6.6vw,50px)/1 var(--display); --r-h3-font:600 27px/1.12 var(--display); --r-callout-font:italic 500 clamp(24px,5vw,31px)/1.2 var(--display);
  --card-r:6px; --btn-r:6px; --field-r:6px; --tabs-r:0; color-scheme:light;
}

    --r-bg:#1E1C15; --r-surface:#28261D; --r-ink:#F2EDE0; --r-muted:#ABA596; --r-line:#38352A; --r-accent:#F2C12E; --r-accent-ink:#151412;

}
:root[data-theme="dark"]{

  --r-bg:#1E1C15; --r-surface:#28261D; --r-ink:#F2EDE0; --r-muted:#ABA596; --r-line:#38352A; --r-accent:#F2C12E; --r-accent-ink:#151412;

.sec-h{letter-spacing:-.01em}
.sec-h em{font-style:italic;background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);padding:0 .08em}
/* tabs: words on a ruled line, like a table of contents */
.tabs{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;gap:6px;padding:0}
.tab{border-radius:0;padding:12px 14px 11px;font-size:16px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{background:transparent;color:var(--ink);border-bottom-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lesson-body h4{font-size:17px;margin:22px 0 6px}
.lesson-body strong{background:linear-gradient(transparent 62%,var(--hl) 62%);color:inherit}

/* hero */
.d-hero{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding-block:44px 6px;max-width:760px;margin:0 auto;width:100%}
.d-quote{margin:0;font:italic 400 19px/1.35 var(--display);color:var(--muted)}
.d-quote span{display:block;font:400 14px/1.4 var(--body);font-style:normal;margin-top:2px}
.d-mark{margin:22px 0 0;font:500 clamp(78px,22vw,152px)/.84 var(--display);letter-spacing:-.035em}

.d-sub em{font-style:italic}
.d-line{margin:6px 0 0;width:100%}

.d-line .ghost{stroke:var(--line);stroke-width:2;stroke-dasharray:1 7;stroke-linecap:round;fill:none}
.d-line .lead{stroke:var(--graphite);stroke-width:2.2;fill:none;stroke-linecap:round;opacity:.9}
.d-line figcaption{display:flex;justify-content:flex-end;gap:12px;font-size:13.5px;color:var(--muted);margin-top:4px}
.d-line figcaption b{color:var(--ink);font-weight:600}
.d-pitch{margin:4px 0 0;color:var(--muted);max-width:44ch;font-size:17.5px}

.d-route{display:grid;gap:42px;max-width:760px;margin:0 auto;width:100%}
.d-part{display:grid;gap:12px}
.d-part > div:first-child{display:grid;gap:2px}

.d-welcome:active{transform:scale(.985)}

.d-welcome b{display:block;font:500 26px/1.1 var(--display);margin:3px 0}
.d-welcome span span{display:block;color:var(--muted);font-size:15px;line-height:1.4}
.d-welcome.seen small::after{content:" · vista ✓"}
.d-arr{font:400 30px/1 var(--display);flex:none}
.d-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.d-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:15px 4px;cursor:pointer;color:var(--ink);transition:transform .16s cubic-bezier(.23,1,.32,1),background-color .2s}
.d-row:active{transform:scale(.985)}
@media (hover:hover){.d-row:hover{background:var(--surface)}}
.d-row .n{font:italic 400 32px/1 var(--display);color:var(--muted);text-align:center}
.d-row b{display:block;font:500 21px/1.15 var(--display)}
.d-row small{display:block;color:var(--muted);font-size:14.5px;line-height:1.35;margin-top:3px}
.d-row .st{font-size:12.5px;font-weight:700;border-radius:4px;padding:4px 9px;white-space:nowrap}
.d-row.seen .n{color:var(--ink)}

.d-row.next b span{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 94%,transparent 94%)}
.d-row.next .n{color:var(--ink)}
.d-row.next .st{background:var(--accent);color:var(--accent-ink)}
.d-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.d-tool{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r);padding:15px 16px;cursor:pointer;color:var(--ink);transition:transform .16s cubic-bezier(.23,1,.32,1)}
.d-tool:active{transform:scale(.98)}
.d-tool b{display:block;font:600 20px/1.15 var(--display)}
.d-tool small{color:var(--muted);font-size:14px}
.r-title:focus{outline:none}
footer.foot{max-width:62ch;margin:0 auto;font-size:13px;line-height:1.5}

var LESSONS_MD="@@ 0 | Empieza aquí | Bienvenida a Despacio | El curso en 5 minutos\nEste curso es para que entiendas cómo decide tu cabeza y cómo decide la cabeza de tu clienta. Con eso vendes mejor, creas mejor y te equivocas menos.\n\n## De qué se trata\nDentro de ti hay dos formas de pensar. Una es rápida: reconoce caras, contesta \"2 + 2\", siente desconfianza antes de saber por qué y decide si un video le gusta en el primer segundo. La otra es lenta: hace cuentas, compara opciones, revisa un plan y se aguanta las ganas de contestar un mensaje enojada.\n\nEn este curso les vamos a decir **la Rápida** y **la Lenta**. La Rápida hace casi todo el trabajo del día y casi siempre lo hace bien. La Lenta es la que creemos que manda, pero es floja: si la Rápida ya le dio una respuesta que suena bien, la firma sin revisar.\n\nLa mayoría de nuestros errores (comprar de más, prometer fechas imposibles, juzgar mal a una prospecta, rendirnos después de un mal mes) vienen de dejar que la Rápida decida algo que le tocaba a la Lenta. Y casi todas las decisiones de compra de tus clientas también pasan primero por su Rápida.\n\n> Piensa rápido para vivir. Decide despacio cuando importa.\n\n## Cómo está armado\n- **Tus dos mentes (clases 1 a 5).** Quién es la Rápida, por qué la Lenta se cansa, por qué lo fácil se siente verdad, por qué sacamos conclusiones con muy poca información y cómo cambiamos una pregunta difícil por una fácil sin darnos cuenta.\n- **Cómo decide tu clienta (clases 6 a 9).** El primer número, el miedo a perder, el marco con el que cuentas las cosas y por qué una historia le gana a una estadística. Todo para vender con honestidad, no para manipular.\n- **Tu negocio (clases 10 a 12).** Planes que siempre tardan más, rachas buenas y malas que no significan lo que crees, y lo que tu clienta (y tú) recuerdan de una experiencia.\n- **Herramientas.** La Pausa (cinco preguntas antes de decidir), el Premortem, el Diccionario de tropiezos y la lista para Vender limpio.\n\n## Lo que necesitas\n- Un cuaderno, o el cuaderno de cada clase, que se guarda en tu celular.\n- Unos 10 minutos por clase y un ejercicio corto para la semana.\n- Ganas de cacharte a ti misma. Es más fácil ver los errores en otras que en una. Por eso el curso te da nombres para cada tropiezo: cuando algo tiene nombre, lo reconoces.\n\n## Una aclaración honesta\nEste curso se inspira en un libro de psicología que reúne décadas de investigación. Algunas de esas investigaciones se han vuelto a revisar con los años y no todas salieron igual de fuertes. Aquí nos quedamos con las ideas más sólidas y con lo que te sirve en la vida diaria.\n\n## 🪞 Para pensar\nPiensa en una decisión de los últimos meses de la que te arrepientes. ¿La tomaste rápido o despacio? ¿Qué estabas sintiendo en ese momento?\n\n## ✍️ Escribe\nEscribe en una frase qué quieres decidir mejor: tu dinero, tu contenido, tus ventas, tu equipo o tus días.\n\n@@ 1 | Tus dos mentes | Clase 1 · La Rápida y la Lenta | Las dos que viven en tu cabeza\nContesta rápido, sin papel: una pluma y una libreta cuestan 110 pesos en total. La pluma cuesta 100 pesos más que la libreta. ¿Cuánto cuesta la libreta?\n\n## La respuesta que salta\nSeguro te saltó \"10 pesos\". Es la respuesta que le sale a casi todo el mundo, incluidas personas muy preparadas. Pero está mal: si la libreta costara 10, la pluma costaría 110 y el total sería 120. La libreta cuesta 5 y la pluma 105.\n\nLo interesante no es el error. Es que la respuesta equivocada llegó sola, rápida y segura de sí misma. Y que para encontrar la correcta tuviste que detenerte y hacer la cuenta, cosa que casi nadie hace porque \"10\" suena bien.\n\n## Quién es quién\n**La Rápida** trabaja todo el tiempo y sin esfuerzo. Lee la cara de una persona y sabe si está enojada. Maneja por una calle conocida mientras platicas. Completa \"pan con…\". Siente que un precio es caro o barato. Decide en un segundo si un video le interesa. No la puedes apagar.\n\n**La Lenta** se activa cuando algo exige atención: una multiplicación difícil, llenar una forma, comparar dos planes de celular, morderte la lengua en una discusión. Es la que revisa, la que duda y la que se controla. Pero gastarla cuesta, y por eso prefiere no trabajar.\n\n> La Lenta se cree la protagonista. La que escribe casi todo el guion es la Rápida.\n\n## No es buena ni mala\nLa Rápida no es tu enemiga. Gracias a ella reaccionas a tiempo, tienes intuición con tu clientela de siempre y puedes grabar un video sin pensar en cada palabra. El problema es que no avisa cuando está fuera de su terreno. Su respuesta equivocada se siente igual de segura que la correcta.\n\nEl trabajo de este curso no es pensar despacio todo el día (sería agotador e imposible). Es aprender a reconocer los momentos en los que vale la pena frenar.\n\n## Las señales para frenar\n- Hay dinero de por medio, sobre todo si es mucho o es a crédito.\n- Sientes urgencia, enojo, emoción o miedo.\n- La respuesta llegó demasiado fácil para una pregunta difícil.\n- Es una situación nueva para ti.\n- Alguien te está presionando para decidir ya.\n\n## En tu negocio\nTu clienta también tiene una Rápida, y es la que ve tus historias. Decide en un segundo si se queda o se va, si le caes bien y si tu producto \"se ve bueno\". Por eso importa tanto lo que se ve primero. Pero también por eso no la quieres engañar: la Lenta de tu clienta despierta después, cuando ya le llegó el producto, y ahí decide si te vuelve a comprar.\n\n## 🪞 Mírate al espejo\n¿En qué tipo de decisiones te dejas llevar por la primera respuesta, aunque después te arrepientas? ¿Compras, mensajes, promesas, precios?\n\n## ✍️ Ejercicio\nEsta semana caza tres momentos en los que tu Rápida contestó por ti. Anota qué pasó, qué contestó y si después la Lenta estuvo de acuerdo.\n\n## ✅ Tu tarea de la semana\nEscoge una decisión de dinero de esta semana (aunque sea pequeña) y antes de tomarla di en voz alta: \"Esto es la Rápida hablando. Déjame hacer la cuenta.\"\n\n@@ 2 | Tus dos mentes | Clase 2 · La Lenta se cansa | Atención, esfuerzo y por qué decides peor cuando estás agotada\nTu atención es como el saldo del celular: alcanza para lo que alcanza. Si lo gastas en una cosa, no te queda para otra.\n\n## La atención tiene límite\nIntenta multiplicar 23 por 47 mientras caminas rápido. Lo más probable es que te detengas sin darte cuenta. Cuando la Lenta trabaja duro, el cuerpo lo nota: las pupilas se agrandan, el corazón se acelera y todo lo demás pasa a segundo plano. Por eso no ves lo que pasa a tu alrededor cuando estás concentrada, y por eso no te conviene revisar un pedido complicado mientras manejas o mientras tus hijos te hablan.\n\n## La ley del menor esfuerzo\nCuando hay dos caminos para llegar al mismo lugar, el cerebro escoge el que cuesta menos. Es su forma natural de ahorrar energía. El problema es que \"el que cuesta menos\" muchas veces es aceptar la primera idea, seguir haciendo lo de siempre o decir que sí para no pensar.\n\nHay estudios que sugieren que, después de muchas horas de decisiones seguidas, la gente tiende a escoger la opción por defecto: lo que ya estaba, lo más cómodo, lo que no exige pensar. Los científicos todavía discuten qué tan fuerte es este efecto, pero lo vas a reconocer en ti: en la noche, cansada, compras cosas que en la mañana no comprarías, contestas peor y te rindes más rápido.\n\n> Las decisiones importantes no se toman a las once de la noche.\n\n## El flujo\nHay un estado en el que la Lenta trabaja mucho sin que se sienta pesado: cuando estás tan metida en algo que se te va el tiempo. Editando un video que te encanta, armando un set de regalo, platicando con una clienta que te cae bien. Ahí rindes muchísimo. Busca que tus tareas difíciles se parezcan a eso: un solo foco, sin interrupciones, con un reto a tu medida.\n\n## Para ti\n- Pon lo que exige cabeza (cuentas, planes, guiones nuevos, decisiones de compra) en tu horario más fresco.\n- Deja para la noche lo mecánico: empacar, programar historias ya hechas, contestar mensajes sencillos.\n- Si estás cansada, con hambre o muy emocionada, posterga las decisiones grandes un día. Casi nunca es urgente.\n- Una tarea a la vez. Saltar entre el chat, la edición y las cuentas gasta atención en cada salto.\n\n## Para tu clienta\nTu clienta también está cansada. Te ve entre el trabajo, los niños y el tráfico. Si comprarte le exige pensar mucho (preguntar el precio por mensaje, buscar cómo pagar, adivinar qué tono le queda), su Lenta dice \"luego\" y luego nunca llega. Hazle fácil decir que sí: precio visible, una recomendación clara, un solo paso para pedir.\n\n## 🪞 Mírate al espejo\n¿A qué hora del día tomas tus peores decisiones? ¿Qué sueles hacer a esa hora?\n\n## ✍️ Ejercicio\nRevisa tu proceso de venta desde los ojos de una clienta cansada. Cuenta cuántos pasos y cuántas preguntas tiene que hacer antes de poder pagarte. Escribe cuáles puedes quitar.\n\n## ✅ Tu tarea de la semana\nElige tu \"hora fresca\" y protégela tres días esta semana para una sola tarea importante, con el celular en otro cuarto.\n\n@@ 3 | Tus dos mentes | Clase 3 · Lo fácil se siente verdad | Por qué creemos lo que nos resulta cómodo\nTu cabeza tiene un medidor que va de \"fácil\" a \"me cuesta\". Y todo lo que marca \"fácil\" se siente más verdadero, más bonito y más confiable.\n\n## La comodidad mental\nCuando algo se lee fácil, se entiende rápido o ya lo habías visto antes, la Rápida se relaja. Esa sensación de comodidad se mezcla con otras: \"esto es cierto\", \"esto me gusta\", \"esto es seguro\". Cuando algo cuesta trabajo (una letra difícil de leer, una explicación enredada, una idea nueva), la Rápida se pone alerta y la Lenta entra a revisar con más desconfianza.\n\n## Lo que hace que algo se sienta fácil\n- **Lo repetido.** Una frase que has escuchado muchas veces se siente verdadera, aunque nadie la haya comprobado. Es la razón por la que los rumores funcionan.\n- **Lo conocido.** Mientras más veces ves algo, más te gusta, aunque no te des cuenta de que lo viste. Se llama efecto de mera exposición.\n- **Lo claro.** Letra legible, buen contraste, palabras sencillas. Una idea dicha con palabras rebuscadas se siente menos confiable, no más inteligente.\n- **Lo que suena bien.** Las frases con ritmo o con rima se recuerdan más y hasta parecen más ciertas.\n- **El buen humor.** Cuando estás contenta, la Rápida manda más y la Lenta revisa menos.\n\n> Repetirlo no lo hace verdad. Pero sí lo hace sentir verdad.\n\n## Para tu contenido\nAquí está, en ciencia, la razón de la constancia: que te vean seguido te vuelve conocida, y lo conocido se siente confiable. No necesitas un video viral. Necesitas aparecer seguido con la misma cara, los mismos colores y el mismo tono.\n\n- Escribe como hablas. Frases cortas. Nada de palabras para impresionar.\n- Letras grandes y legibles en tus historias, con buen contraste.\n- Repite tus ideas clave muchas veces y de muchas formas. A ti te aburre; a tu audiencia apenas le está llegando.\n- Ponle a tu oferta un nombre fácil de decir.\n\n## Para ti, como compradora\nEsa misma comodidad es la que te hace creer una promesa que has visto mil veces en anuncios, o un \"dato\" que circula en grupos de WhatsApp. Cuando algo te suena muy cierto, pregúntate: ¿lo sé, o nada más lo he escuchado mucho?\n\n## Con honestidad\nHacer las cosas fáciles de entender es respeto. Repetir algo falso hasta que suene cierto es engaño. Usa la claridad para decir la verdad mejor, nunca para colar una mentira.\n\n## 🪞 Mírate al espejo\n¿Qué cosa crees sobre tu negocio, tus productos o las redes que nada más has escuchado repetida, sin haberla comprobado?\n\n## ✍️ Ejercicio\nToma el texto de tu última publicación de venta. Reescríbelo con frases de máximo 12 palabras, sin una sola palabra que no usarías platicando. Compara los dos.\n\n## ✅ Tu tarea de la semana\nEscoge tu idea principal (lo que quieres que piensen cuando te ven) y repítela de cinco formas distintas esta semana: un video, una historia, un texto, una foto con frase y una respuesta a una clienta.\n\n@@ 4 | Tus dos mentes | Clase 4 · Lo que ves es todo lo que hay | Conclusiones rápidas, primeras impresiones y el efecto halo\nLa Rápida es experta en armar una historia con lo poco que tiene enfrente. Y no le preocupa lo que no sabe.\n\n## Lo que ves es todo lo que hay\nSi te cuentan que una líder \"es inteligente y fuerte\", ya te formaste una idea de si sería buena para guiar a un equipo. No preguntaste si es honesta, si es constante o si escucha. La Rápida tomó lo que había, armó una historia coherente y te la entregó con total seguridad.\n\nEsto es clave: **la seguridad que sientes no depende de cuánta información tienes, sino de qué tan bien encaja la historia.** Con poquitos datos que no se contradicen, la historia encaja perfecto. Por eso a veces estamos más seguras cuando sabemos menos.\n\n## El efecto halo\nCuando algo de una persona te gusta, tiendes a que todo lo demás también te guste. Una creadora guapa y bien vestida parece también más confiable, más lista y más honesta. Una prospecta que te contestó seco el primer mensaje parece \"difícil\" para siempre. El orden también importa: lo primero que ves de alguien pinta todo lo que viene después.\n\n> La primera impresión no es la más cierta. Es la que más pesa.\n\n## Para tu contenido\nTu clienta te juzga con lo que ve. Tu foto de perfil, tu primera línea, los primeros dos segundos del video y tu descripción son su \"todo lo que hay\". Cuídalos como si fueran lo único que va a ver, porque muchas veces lo son.\n\n## Para tus decisiones\n- Antes de decidir sobre una persona (una prospecta, una nueva integrante, una proveedora), pregúntate: ¿qué no sé? ¿Qué necesitaría saber para cambiar de opinión?\n- Ten cuidado con los \"me late\". Si conociste a alguien en un evento y te encantó cómo habla en público, eso no te dice si va a ser constante.\n- Si decides en grupo, pídele a cada quien su opinión por escrito antes de platicar. Si hablan primero, todas terminan pensando como la que habló primero.\n- Escucha las dos versiones de una historia antes de tomar partido.\n\n## 🪞 Mírate al espejo\nPiensa en alguien de tu equipo o de tu clientela de quien te formaste una idea muy rápido. ¿En qué te basaste? ¿Qué no sabías?\n\n## ✍️ Ejercicio\nMira tu perfil como si fueras una desconocida que llega por primera vez. Escribe en tres líneas qué historia arma la Rápida de esa desconocida sobre ti con lo que ve en cinco segundos. ¿Es la que quieres?\n\n## ✅ Tu tarea de la semana\nCambia una sola cosa de tu perfil (foto, primera línea o publicación fijada) para que su \"todo lo que hay\" diga lo que de verdad quieres decir.\n\n@@ 5 | Tus dos mentes | Clase 5 · La pregunta fácil | Cómo cambiamos lo difícil por lo fácil sin darnos cuenta\nCuando la pregunta es difícil, la Rápida no se queda callada. Contesta otra más fácil y te la entrega como si fuera la respuesta.\n\n## El cambio de pregunta\n\"¿Este producto me conviene?\" es difícil: implica comparar precio, ingredientes, alternativas y cuánto lo vas a usar. \"¿Me gusta cómo se ve en el video?\" es fácil. Sin darte cuenta, contestas la fácil y sientes que contestaste la difícil.\n\nPasa todo el tiempo:\n- \"¿Esta persona va a ser buena socia?\" se vuelve \"¿me cayó bien en la llamada?\".\n- \"¿Esta estrategia va a funcionar?\" se vuelve \"¿me emociona?\".\n- \"¿Qué tan feliz estoy con mi vida?\" se vuelve \"¿cómo me siento hoy?\".\n- \"¿Este negocio es bueno?\" se vuelve \"¿me cae bien la persona que me lo ofrece?\".\n\n## Lo que te gusta te parece bueno\nHay un atajo muy poderoso: cuando algo te gusta, sientes que sus beneficios son grandes y sus riesgos pequeños. Cuando algo no te gusta, todo lo ves al revés. No es que lo analizaste: es que la emoción contestó por ti. Por eso es tan difícil ver los defectos de un plan que te ilusiona.\n\n> Antes de responder, pregúntate: ¿estoy contestando la pregunta que me hicieron o una más fácil?\n\n## Cómo cacharlo\n1. Escribe la pregunta real, completa.\n2. Escribe lo que de verdad te hizo decidir.\n3. Si no son lo mismo, ya encontraste el cambio.\n4. Busca un dato que conteste la pregunta real (números, opiniones de otras, experiencia de casos parecidos).\n\n## Para tu clienta\nTu clienta también cambia preguntas. \"¿Esta crema le va a servir a mi piel?\" es difícil; \"¿la que me la vende se ve confiable y su piel se ve bien?\" es fácil. Eso explica por qué tu forma de presentarte importa tanto. Pero también es una responsabilidad: ayúdale a contestar la pregunta real. Dile para qué tipo de piel sí y para cuál no, cuánto dura, cómo se usa. Una clienta que contestó la pregunta real regresa.\n\n## 🪞 Mírate al espejo\n¿Qué decisión reciente tomaste porque \"te emocionó\" o \"te cayó bien\" y no porque contestaste la pregunta real?\n\n## ✍️ Ejercicio\nElige una decisión que tengas pendiente. Escribe arriba la pregunta real y abajo la pregunta fácil que tu Rápida quiere contestar. Luego anota tres datos que te ayudarían con la real.\n\n## ✅ Tu tarea de la semana\nEn tus próximas tres recomendaciones de producto, ayuda a la clienta con la pregunta difícil: dile para quién es, para quién no y qué resultado puede esperar de verdad.\n\n@@ 6 | Cómo decide tu clienta | Clase 6 · El primer número | Anclas: por qué el primer precio cambia todo lo que sigue\nSi alguien te pregunta \"¿cuánto crees que cueste?\" justo después de mencionar el número 900, vas a decir un número más alto que si antes hubiera dicho 90. Aunque sepas que el 900 no tenía nada que ver.\n\n## Qué es un ancla\nEl primer número que escuchas se queda como punto de partida. Luego lo ajustas, pero casi siempre te quedas corta: terminas más cerca del ancla de lo que crees. Pasa con precios, con sueldos, con descuentos, con metas y hasta con números totalmente al azar. Y le pasa también a la gente experta.\n\nFunciona de dos formas. La Lenta empieza en el ancla y se mueve poco, porque ajustar cuesta trabajo. Y la Rápida, sin que te des cuenta, empieza a buscar razones por las que el ancla podría ser cierta.\n\n> El primer número no informa. Ancla.\n\n## Para presentar tus precios con honestidad\n- **El orden importa.** Si muestras primero el set completo y luego el producto suelto, el suelto se siente accesible. Al revés, el set se siente caro. Muestra primero lo que de verdad le recomendarías a tu clienta.\n- **El precio de referencia real.** Si hay un precio regular y uno de promoción, enseña los dos. Pero solo si el regular es real. Inventar un \"antes\" para que el \"ahora\" parezca descuento es engaño, y en muchos lugares también es ilegal.\n- **El valor antes del precio.** Si lo primero que tu clienta escucha es el número, ese número es el ancla. Si primero escucha qué incluye y cuánto le dura, el número llega con contexto.\n\n## Para defenderte\nLas anclas también te las ponen a ti: el proveedor que te dice \"normalmente esto cuesta el doble\", la meta absurda de alguien más, el \"todas venden mil al mes\".\n- Antes de ver un precio o una oferta, decide tu número: lo que estás dispuesta a pagar o lo que esperas lograr.\n- Si te lanzan un ancla absurda, no la discutas punto por punto: di que esa no es una base para negociar y propón la tuya.\n- Piensa en argumentos contra el ancla: ¿por qué podría ser mucho menos?\n\n## Metas y anclas\nLas metas también anclan. Si te pones como referencia lo que vende la líder más grande de tu país, todo lo tuyo se va a sentir poco. Si tu referencia es tu propio mes pasado, puedes ver tu avance.\n\n## 🪞 Mírate al espejo\n¿Qué número tienes en la cabeza como \"lo normal\" en tu negocio? ¿De dónde salió?\n\n## ✍️ Ejercicio\nRevisa cómo presentas tu producto estrella. Escribe en qué orden aparecen el valor y el precio, y reescríbelo para que tu clienta escuche primero para qué le sirve.\n\n## ✅ Tu tarea de la semana\nAntes de tu próxima compra o negociación grande, escribe tu número antes de ver el de la otra persona. Al final compara.\n\n@@ 7 | Cómo decide tu clienta | Clase 7 · Perder duele el doble | Aversión a la pérdida, lo que ya es tuyo y el punto de referencia\nImagina que te ofrecen una apuesta con una moneda: si sale águila ganas 1,000 pesos y si sale sol pierdes 1,000. La mayoría dice que no. Para aceptar, casi todos piden poder ganar el doble de lo que pueden perder.\n\n## Las pérdidas pesan más\nPerder algo duele bastante más de lo que alegra ganar lo mismo. En los experimentos, para sentir que una apuesta \"vale la pena\", la gente pide ganar entre una vez y media y dos veces y media lo que arriesga. Es una herencia de cuando perder algo podía costarte la vida.\n\nEsto explica muchas cosas:\n- Te cuesta más dejar algo que ya tienes que no conseguirlo nunca.\n- Una mala reseña te pega más que diez buenas.\n- Un mes malo te pesa más de lo que te alegró el mes bueno.\n- Las personas defienden lo que tienen con más fuerza que la que ponen en conseguir algo nuevo.\n\n## Todo depende del punto de referencia\nNo sentimos las cosas por cómo estamos, sino por cómo cambiamos respecto a algo. Ganar 8,000 en un mes se siente increíble si esperabas 5,000, y se siente como fracaso si esperabas 12,000. Tu punto de referencia (lo que esperabas, lo que tenías, lo que tiene otra) decide si algo se siente como ganancia o como pérdida.\n\n## Lo que ya es tuyo vale más\nCuando algo ya es tuyo, de pronto vale más para ti. Una taza que te regalaron te parece valer más que la misma taza en la tienda. Por eso las muestras y las pruebas funcionan: una vez que tu clienta probó la crema y la siente suya, dejar de usarla se siente como una pérdida.\n\n> No es que tu clienta no quiera ganar. Es que no quiere perder.\n\n## Para vender con honestidad\n- **Las muestras son tu mejor amiga.** Deja que la clienta pruebe, use y sienta el producto como suyo.\n- **Habla de lo que se pierde, sin miedo falso.** \"Si tu piel se reseca en invierno, esto evita que llegues a marzo con la cara irritada\" es honesto. \"Última oportunidad en tu vida\" cuando no lo es, es manipulación.\n- **Ojo con subir precios.** La gente siente injusto que le quites algo que ya considera suyo. Si tienes que subir, explica por qué: a tu clienta le parece justo que protejas tu ganancia cuando a ti también te subieron los costos.\n- **Garantías y devoluciones.** Bajan el miedo a perder y hacen que decir que sí cueste menos.\n\n## Para ti\nTu miedo a perder también te frena: no lanzas el producto nuevo por miedo a que no se venda, no dejas el proveedor que ya no te conviene, no subes tu precio. Pregúntate: si no tuviera esto, ¿lo escogería hoy?\n\n## 🪞 Mírate al espejo\n¿Qué estás conservando (un producto, un método, una relación de trabajo) solo porque soltarlo se siente como perder?\n\n## ✍️ Ejercicio\nEscribe tres cosas que tu clienta pierde por no usar tu producto. Que sean ciertas y concretas, sin exagerar.\n\n## ✅ Tu tarea de la semana\nArma un plan de muestras: a quiénes vas a dar a probar esta semana, qué producto y cuándo les vas a preguntar cómo les fue.\n\n@@ 8 | Cómo decide tu clienta | Clase 8 · El marco | La misma verdad contada de dos formas\n\"Este tratamiento tiene 90% de éxito\" y \"este tratamiento falla en 10% de los casos\" dicen exactamente lo mismo. Pero la gente, incluidos los médicos, escoge muy distinto según cuál escuche.\n\n## Qué es el marco\nEl marco es la forma en que presentas una información: como ganancia o como pérdida, como parte de algo más grande o por separado, con un número o con otro. La Rápida no traduce de un marco a otro; reacciona al que le diste. Así que dos frases que significan lo mismo pueden producir decisiones opuestas.\n\n## Ejemplos que vas a reconocer\n- \"Ahorras 200 pesos\" se siente distinto de \"pagas 200 pesos menos\".\n- \"Menos de 10 pesos al día\" se siente distinto de \"290 al mes\".\n- \"Usado por 9 de cada 10\" suena mucho mejor que \"1 de cada 10 no lo recomienda\".\n- Un cargo extra por pagar con tarjeta molesta más que un descuento por pagar en efectivo, aunque la diferencia sea igual.\n\n## Lo que viene marcado por defecto\nUno de los marcos más poderosos es lo que pasa si no haces nada. Si para dejar de recibir algo hay que palomear una casilla, casi nadie la palomea. Si para recibirlo hay que palomearla, casi nadie la palomea tampoco. La gente se queda con la opción que ya venía puesta.\n\nEn tu negocio: si invitas a tu clienta a \"avísame si quieres que te mande la novedad del mes\", pocas te avisan. Si le preguntas \"¿te la aparto como siempre, o este mes no?\", muchas dicen que sí. Usa este poder con cuidado: que la opción por defecto sea la que de verdad le conviene, y que decir que no sea igual de fácil.\n\n> Tú no cambias los hechos. Escoges desde dónde se miran.\n\n## Ampliar el marco\nCuando miras una decisión sola, se siente enorme. Cuando la miras junto con todas las parecidas, se ve en su tamaño real. Una publicación que no funcionó se siente como un desastre; vista entre las cien que vas a hacer este año, es un dato más. Ampliar el marco te ayuda a arriesgarte con calma.\n\n## La regla de oro\nUn marco honesto ayuda a entender. Un marco tramposo esconde algo que la clienta querría saber. Antes de publicar, pregúntate: si mi clienta viera la información completa, ¿se sentiría engañada? Si la respuesta es sí, cambia el marco.\n\n## 🪞 Mírate al espejo\n¿Cómo te cuentas a ti misma tus resultados? ¿En marco de lo que lograste o de lo que te faltó?\n\n## ✍️ Ejercicio\nEscribe la misma oferta de tres formas: como ganancia, como pérdida que evitas y como costo por día. Elige la que sea más clara y honesta para tu clienta.\n\n## ✅ Tu tarea de la semana\nRevisa tu mensaje de reorden o de seguimiento. Cámbialo para que la opción por defecto sea la que le conviene a tu clienta y que decir que no sea igual de fácil.\n\n@@ 9 | Cómo decide tu clienta | Clase 9 · Una historia le gana a un número | Disponibilidad, casos concretos y muestras demasiado chicas\nSi te pregunto si es más común que la gente se enferme por una cosa o por otra, vas a contestar según qué tan fácil te vienen ejemplos a la mente. No según los datos.\n\n## Lo que viene a la mente\nLa Rápida calcula qué tan común es algo por lo fácil que recuerda ejemplos. Si viste en las noticias dos casos de algo, te parece frecuente. Si una amiga te contó su mala experiencia con un producto, te parece que \"a todas les pasa\". Lo reciente, lo dramático y lo personal pesan muchísimo más de lo que deberían.\n\n## Las historias mueven, los números no tanto\nA la gente le cuesta cambiar de opinión con estadísticas. Pero un solo caso concreto, con cara y nombre, la mueve. No porque sea más cierto, sino porque la Rápida piensa en historias.\n\nPara tu contenido, esto es oro: **un testimonio real y específico le gana a cualquier porcentaje.** \"Mi clienta Ana tenía la piel tan reseca que se le pelaba la nariz, y en dos semanas dejó de pasarle\" se queda en la cabeza. \"92% de satisfacción\" no.\n\n> La gente no recuerda tus datos. Recuerda a la persona de tu historia.\n\n## Con honestidad\n- Usa historias reales, con permiso de quien las vivió.\n- Que sean casos típicos, no el único milagro entre cien. Si escoges solo el caso extraordinario, la clienta espera eso y luego se decepciona.\n- No prometas lo que le pasó a una como si le fuera a pasar a todas.\n\n## La trampa de los números chicos\nAl revés también te engaña. Con pocos datos, los resultados se ven extremos por pura casualidad. Tres videos que funcionaron no son una fórmula. Dos prospectas que dijeron que no no significan que tu mensaje está mal. Una semana buena no significa que ya encontraste el camino.\n\n- Antes de concluir algo, junta suficientes casos: al menos 10 o 20 publicaciones de un tipo antes de decidir si funciona.\n- Cuando alguien te dice \"a mí me funcionó\", pregunta a cuántas les funcionó y a cuántas no.\n\n## El regreso al promedio\nDespués de algo extraordinario, lo normal es que venga algo más normal. Tu video que explotó probablemente fue en parte talento y en parte suerte; el siguiente va a funcionar menos, y no es porque \"ya no le gustas al algoritmo\". Igual al revés: después de un mes muy malo, lo más probable es que el siguiente sea mejor, aunque no cambies nada.\n\nEsto importa para liderar. Si regañas a alguien después de un mes malo y al siguiente mejora, vas a creer que el regaño funcionó. Si felicitas a alguien después de un mes buenísimo y luego baja, vas a creer que la felicitación la relajó. Las dos cosas pueden ser puro regreso al promedio.\n\n## 🪞 Mírate al espejo\n¿Qué conclusión sacaste de tu negocio con muy pocos casos? ¿Qué historia de otra persona te hizo creer algo que no has comprobado?\n\n## ✍️ Ejercicio\nEscribe el testimonio de una clienta real como historia: cómo estaba antes, qué probó, qué notó y en cuánto tiempo. Concreto, sin exagerar. Pídele permiso para compartirlo.\n\n## ✅ Tu tarea de la semana\nElige un tipo de contenido que quieras probar y comprométete a hacer 10 antes de juzgarlo. Anota los resultados de cada uno.\n\n@@ 10 | Tu negocio | Clase 10 · El plan que siempre tarda más | Optimismo, la mirada de afuera y el premortem\nCuando planeas algo, te imaginas cómo va a salir si todo sale bien. Por eso casi todos los planes tardan más y cuestan más de lo que pensabas.\n\n## La falacia de la planeación\nUn equipo de expertos calculó que terminaría un proyecto en dos años. Cuando le preguntaron a uno de ellos cuánto habían tardado otros equipos en proyectos parecidos, la respuesta fue: entre siete y diez años, y casi la mitad nunca terminó. Aun sabiendo eso, siguieron con su plan. Tardaron ocho años.\n\nAsí funcionamos. Desde adentro vemos nuestro caso, nuestras ganas y nuestro talento. No vemos todo lo que puede salir mal, porque son mil cosas distintas y no se pueden imaginar una por una.\n\n## La mirada de afuera\nLa solución es dejar de mirar solo tu caso y preguntar cómo les fue a otras en casos parecidos:\n1. ¿Qué tipo de proyecto es? (lanzar una línea, abrir un canal nuevo, llegar a un rango, organizar un evento)\n2. ¿Cuánto les tardó y les costó a otras que lo hicieron?\n3. ¿Mi caso tiene razones reales para ser mejor o peor que ese promedio?\n4. Ajusta tu plan desde ese promedio, no desde tu ilusión.\n\n## El optimismo, bendición y riesgo\nEl optimismo te hace empezar cosas, aguantar los golpes y levantarte. Sin él no existiría ningún negocio. Pero también te hace creer que controlas más de lo que controlas, que tu competencia no existe y que sabes más de lo que sabes. Quédate con su energía para actuar y usa la Lenta para planear.\n\n> Optimista para empezar. Realista para planear.\n\n## El premortem\nAntes de lanzar algo importante, junta a dos o tres personas (o siéntate sola) y di: \"Imagina que pasó un año. Lo hicimos tal como está planeado y fue un desastre. Escribe en cinco minutos la historia de ese desastre.\" Sale todo lo que nadie se atrevía a decir. Luego decides qué cambiar.\n\nFunciona porque vuelve normal dudar. En un equipo emocionado, nadie quiere ser la aguafiestas; el premortem hace que buscar fallas sea parte del trabajo.\n\n## Lo que ya invertiste\nSeguir en algo que no funciona solo porque ya le metiste mucho tiempo o dinero es otra trampa. Lo que ya gastaste no regresa, decidas lo que decidas. La pregunta útil es: si empezara hoy desde cero, ¿escogería esto?\n\n## 🪞 Mírate al espejo\n¿Qué plan de los últimos meses tardó mucho más de lo que pensabas? ¿Qué no viste venir?\n\n## ✍️ Ejercicio\nToma tu próximo proyecto y haz el premortem: escribe la historia de cómo salió mal dentro de seis meses. Luego subraya las tres causas más probables.\n\n## ✅ Tu tarea de la semana\nPregúntale a dos personas que ya hicieron algo parecido a tu proyecto cuánto tiempo les tomó de verdad. Ajusta tu fecha.\n\n@@ 11 | Tu negocio | Clase 11 · Suerte, rachas e historias de éxito | Por qué el pasado parece obvio y cuándo confiar en tu intuición\nDespués de que algo pasa, parece que era obvio. \"Se veía venir.\" Pero antes no se veía tan claro.\n\n## La historia perfecta\nNos encantan las historias de éxito: la líder que empezó desde cero y llegó a la cima, la creadora que se hizo viral con un solo video. Las contamos simples, con mucho talento, buenas decisiones y casi nada de suerte. Pero en la vida real, la suerte pesa muchísimo, y las historias de quienes hicieron exactamente lo mismo y no llegaron nunca se cuentan.\n\nCuando copias la receta de alguien exitosa, recuerda: estás viendo una sola historia, contada al final, con lo que salió bien. Aprende de ella, pero no la tomes como garantía.\n\n## Juzgar por el resultado\nSi una decisión sale bien, decimos que fue buena; si sale mal, que fue tonta. Pero una buena decisión puede salir mal por mala suerte, y una tonta puede salir bien por pura suerte. Juzga tus decisiones (y las de tu equipo) por cómo se tomaron con la información que había, no solo por cómo salieron.\n\n> Una decisión buena no siempre sale bien. Pero a la larga, decidir bien gana.\n\n## Cuándo sí confiar en tu intuición\nLa intuición de una experta es real. Una líder con años de experiencia puede \"sentir\" en una llamada que una prospecta no está lista. Pero solo es confiable cuando se cumplen dos condiciones:\n1. **El ambiente tiene reglas que se repiten.** Lo que funcionó muchas veces vuelve a funcionar.\n2. **Tuviste mucha práctica con retroalimentación rápida y clara.** Hiciste algo, viste rápido si funcionó y lo hiciste muchas veces.\n\nTu intuición para saber qué tono le queda a una clienta que atiendes desde hace años puede ser muy buena. Tu intuición para adivinar qué video se va a hacer viral o cómo va a estar la economía el próximo año, no tanto: ahí las reglas cambian y la suerte manda. Y ojo: sentirte muy segura no es prueba de que tengas razón.\n\n## Las fórmulas sencillas\nPara muchas decisiones que se repiten (a quién darle seguimiento primero, a quién invitar a tu equipo), una lista sencilla de criterios le gana al \"me late\". Escoge 4 o 5 cosas que de verdad importan, califícalas del 1 al 5 y súmalas. Después, si quieres, usa tu intuición, pero no antes.\n\n## 🪞 Mírate al espejo\n¿Qué historia de éxito estás tratando de copiar? ¿Cuánta de esa historia fue suerte que no se cuenta?\n\n## ✍️ Ejercicio\nPiensa en una decisión que salió mal. Escribe qué sabías cuando la tomaste. Con esa información, ¿fue una mala decisión o una buena decisión con mala suerte?\n\n## ✅ Tu tarea de la semana\nArma tu lista de criterios para decidir algo que repites mucho (por ejemplo, a qué prospectas darles seguimiento primero). Úsala toda la semana antes de tu \"me late\".\n\n@@ 12 | Tu negocio | Clase 12 · Lo que se recuerda | El final, el mejor momento y lo que de verdad te hace feliz\nHay dos \"tú\": la que vive cada momento y la que después recuerda. Y la que recuerda es la que decide si vuelves.\n\n## La que vive y la que recuerda\nEn un estudio, la gente metió la mano en agua helada dos veces. Una vez fueron 60 segundos de agua muy fría. Otra vez fueron esos mismos 60 segundos y luego 30 segundos más en agua un poquito menos fría. La segunda vez sufrieron más tiempo en total. Y aun así, cuando les preguntaron cuál repetirían, la mayoría escogió la segunda. ¿Por qué? Porque terminó mejor.\n\n## La regla del pico y el final\nCuando recordamos una experiencia, no sumamos todos los momentos. Nos quedamos con dos cosas: **el momento más intenso** y **cómo terminó**. Lo que duró casi no importa. Un viaje maravilloso con un pleito el último día se recuerda peor de lo que fue. Una consulta incómoda que termina con alguien amable se recuerda mejor.\n\n> Tu clienta no recuerda todo. Recuerda el mejor momento y el final.\n\n## Para la experiencia de tu clienta\n- **Diseña un momento alto.** El empaque que se abre bonito, la nota escrita a mano, la muestra sorpresa, el video personalizado.\n- **Cuida el final.** El seguimiento después de la entrega, la pregunta de cómo le fue, la forma de resolver un problema. Un problema bien resuelto al final puede dejar mejor recuerdo que una compra sin problemas.\n- **En tus eventos y lives,** cierra arriba: lo mejor al final, no un \"bueno, ya me voy\" desinflado.\n\n## Para tu vida\nLa que recuerda es la que hace los planes, y a veces escoge cosas que a la que vive no la hacen feliz. Compramos lo que creemos que nos va a cambiar la vida, y en unos meses nos acostumbramos.\n\nHay una idea del libro que vale oro: **nada importa tanto como parece mientras lo estás pensando.** El carro nuevo, la casa más grande, el rango que persigues: mientras piensas en eso, parece que lo cambia todo. Después, te acostumbras y vuelves a tu día normal.\n\nLo que sí cambia tu día a día es cómo usas tu tiempo: con quién lo pasas, cuánto tiempo pasas haciendo lo que te gusta y cuánto haciendo lo que odias. Si quieres ser más feliz, empieza por tu agenda.\n\n## 🪞 Mírate al espejo\n¿Qué meta estás persiguiendo pensando que te va a cambiar todo? ¿Cómo cambiaría de verdad tu martes normal si la logras?\n\n## ✍️ Ejercicio\nDibuja el camino de tu clienta desde que te escribe hasta una semana después de recibir su pedido. Marca dónde está su mejor momento y cómo termina. Escribe una mejora para cada uno.\n\n## ✅ Tu tarea de la semana\nRevisa tu semana pasada: anota cuántas horas pasaste haciendo lo que disfrutas y cuántas en lo que te drena. Mueve una hora de la segunda lista a la primera.\n\n@@ 13 | Herramienta | La Pausa | Cinco preguntas antes de una decisión importante\nÚsala antes de comprar algo grande, prometer una fecha, invitar a alguien a tu equipo, subir un precio o contestar un mensaje que te enojó. Toma cinco minutos.\n\n## Primero, ¿vale la pena frenar?\nFrena si hay mucho dinero o tiempo de por medio, si sientes urgencia o emoción fuerte, si es algo nuevo para ti o si alguien te presiona para decidir ya. Si no, deja que la Rápida haga su trabajo.\n\n## Las cinco preguntas\n1. **¿Cuál es la pregunta real?** Escríbela completa. ¿Estoy contestando esa o una más fácil, como \"¿me emociona?\" o \"¿me cae bien?\"?\n2. **¿Qué no sé?** ¿Qué información me falta? ¿Qué me haría cambiar de opinión?\n3. **¿Cuál es el primer número que me dieron?** ¿Me está anclando? ¿Cuál sería mi número si no lo hubiera escuchado?\n4. **¿Cómo les fue a otras?** Si no supiera nada de mi caso, ¿qué resultado esperaría según lo que les pasó a otras en casos parecidos?\n5. **¿Cómo me estoy sintiendo?** ¿Cansada, emocionada, con miedo de perder algo? ¿Cambiaría la decisión si la tomo mañana en la mañana?\n\n## Y al final\nSi después de las cinco preguntas tu respuesta es la misma, adelante: ahora sí es una decisión tuya, no solo de la Rápida.\n\n## ✍️ Escribe\nUsa La Pausa con una decisión que tengas pendiente esta semana y escribe tus respuestas aquí.\n\n@@ 14 | Herramienta | El Premortem | Encuentra las fallas de tu plan antes de que pasen\nPara lanzamientos, eventos, retos con tu equipo, nuevas líneas de producto o metas grandes. Toma 20 minutos.\n\n## Cómo se hace\n1. **Junta a quienes saben del plan** (o hazlo sola, por escrito). Que todavía no esté todo decidido.\n2. **Di la frase:** \"Pasaron seis meses. Hicimos el plan tal como está y fue un desastre. ¿Qué pasó?\"\n3. **Cada quien escribe sola, cinco minutos,** la historia del desastre. Sin platicar antes, para que nadie influya a nadie.\n4. **Lean todas las historias.** Anoten cada causa en una lista.\n5. **Escojan las tres más probables** y las tres que harían más daño.\n6. **Cambien el plan** para prevenir esas causas, o preparen qué harían si pasan.\n\n## Preguntas que ayudan\n- ¿Qué pasa si tarda el doble?\n- ¿Qué pasa si cuesta el doble?\n- ¿Qué hace la competencia mientras tanto?\n- ¿De quién depende que esto salga, y qué pasa si esa persona no puede?\n- ¿Qué estamos suponiendo que es cierto y no lo hemos comprobado?\n\n## La regla\nEn el premortem nadie es aguafiestas. Buscar fallas es la tarea. Agradece cada idea, sobre todo las incómodas.\n\n## ✍️ Escribe\nEscribe aquí la historia del desastre de tu próximo proyecto y las tres causas que vas a prevenir.\n\n@@ 15 | Herramienta | El Diccionario de tropiezos | Nombres para cachar errores, tuyos y de tu equipo\nCuando un error tiene nombre, lo reconoces más rápido. Úsalos con cariño en tu equipo: \"Ojo, creo que eso es un ancla.\"\n\n## Los nombres\n- **La Rápida y la Lenta.** La mente automática y la mente que revisa. \"Eso fue la Rápida, déjame pensarlo.\"\n- **Lo fácil se siente verdad.** Creer algo porque se repite mucho o se entiende fácil. \"Lo he oído mil veces, pero ¿es cierto?\"\n- **Lo que ves es todo lo que hay.** Decidir con poca información sin notar lo que falta. \"¿Qué no sabemos?\"\n- **El halo.** Que una cualidad pinte todo lo demás. \"Habla increíble en público, pero eso no dice si es constante.\"\n- **La pregunta fácil.** Contestar algo más sencillo que lo que se preguntó. \"¿Estamos contestando la pregunta real?\"\n- **El ancla.** El primer número que se queda pegado. \"No partamos de ese número.\"\n- **Perder duele el doble.** Darle más peso a perder que a ganar. \"¿Lo mantengo porque sirve o porque me duele soltarlo?\"\n- **El punto de referencia.** Sentir algo como ganancia o pérdida según lo que esperabas. \"Comparado con el año pasado, crecí.\"\n- **El marco.** La misma verdad contada de otra forma. \"¿Cómo se vería si lo contamos al revés?\"\n- **La historia contra el número.** Dejarse llevar por un caso concreto más que por los datos. \"Es un caso. ¿Qué dicen los demás?\"\n- **Los números chicos.** Concluir con muy pocos casos. \"Tres videos no son una tendencia.\"\n- **El regreso al promedio.** Después de algo extremo viene algo más normal. \"No es que dejó de funcionar; es que aquel fue excepcional.\"\n- **El plan optimista.** Planear como si todo fuera a salir bien. \"¿Cuánto les tardó a otras?\"\n- **Lo que ya invertí.** Seguir por lo que ya gastaste. \"Si empezara hoy, ¿lo escogería?\"\n- **Juzgar por el resultado.** Calificar una decisión solo por cómo salió. \"Fue buena decisión con mala suerte.\"\n- **El pico y el final.** Recordar una experiencia por su mejor momento y su cierre. \"¿Cómo termina la experiencia de mi clienta?\"\n- **La lupa.** Sentir que algo es enorme mientras piensas en ello. \"¿De verdad me cambiaría el martes?\"\n\n## ✍️ Escribe\nAnota cuál de estos tropiezos es el que más te pasa a ti y una frase para recordártelo.\n\n@@ 16 | Herramienta | Vender limpio | Lista para usar lo que aprendiste sin manipular\nTodo lo de este curso sirve para comunicar mejor o para engañar. Tú eliges. Revisa esta lista antes de publicar una oferta.\n\n## Antes de publicar\n- **¿El precio de referencia es real?** Si dices \"antes costaba\", que de verdad haya costado eso.\n- **¿La urgencia es real?** Si dices \"últimas piezas\" o \"termina hoy\", que sea cierto.\n- **¿El testimonio es típico?** Que no sea el único caso extraordinario presentado como lo normal.\n- **¿El marco esconde algo?** Si tu clienta viera la información completa, ¿se sentiría engañada?\n- **¿La opción por defecto le conviene a ella?** Y decir que no, ¿es igual de fácil?\n- **¿Le ayudo con la pregunta real?** Para quién es, para quién no y qué puede esperar.\n- **¿Prometo resultados de salud o de dinero?** Si sí, quítalo. Nadie puede garantizar eso.\n\n## La prueba final\nImagina que tu clienta descubre exactamente cómo armaste tu mensaje y por qué. ¿Se sentiría respetada o usada? Vende solo lo que podrías explicarle en voz alta.\n\n## ✍️ Escribe\nPasa tu próxima oferta por esta lista y anota qué cambiaste.";
var FAQ_MD="## Empezar | 0\n\n### ¿Necesito saber de psicología para tomar este curso?\nNo. Todo está explicado con ejemplos del día a día y de la venta. Si sabes vender por mensaje, ya tienes todo lo que necesitas.\n\n### ¿En qué orden tomo las clases?\nTe conviene empezar por las clases 1 a 5, porque explican cómo funcionan las dos mentes y todo lo demás se apoya en eso. Después puedes saltar a la clase que más te sirva hoy.\n\n### ¿Cuánto tiempo me toma?\nUnos 10 minutos de lectura por clase y un ejercicio corto. Si haces una clase por semana, terminas en tres meses. Si tienes prisa, puedes leer todo en un fin de semana y luego ir haciendo las tareas.\n\n### ¿Todo lo que dice el libro sigue siendo cierto?\nLas ideas centrales (las dos formas de pensar, las anclas, el miedo a perder, el marco, la planeación optimista, el pico y el final) están muy estudiadas. Algunos experimentos más chicos del libro no se han podido repetir con los mismos resultados, y el propio autor lo reconoció. En el curso nos quedamos con lo más sólido.\n\n## Tus dos mentes | 1\n\n### ¿Entonces la Rápida es mala?\nNo. La Rápida hace casi todo bien y te ahorra muchísimo trabajo. El problema es solo que no avisa cuando se equivoca. La idea no es apagarla, sino reconocer cuándo vale la pena frenar.\n\n### ¿Cómo sé cuándo frenar y pensar despacio?\nCuando hay mucho dinero o tiempo de por medio, cuando sientes urgencia o una emoción fuerte, cuando es algo nuevo para ti o cuando alguien te presiona para decidir ya. Para lo demás, deja que la Rápida haga su trabajo. La herramienta La Pausa te ayuda.\n\n### ¿Por qué decido tan mal en la noche?\nPorque la Lenta se cansa. Después de un día largo, tu cabeza busca el camino más fácil: comprar, decir que sí, contestar sin pensar. Deja las decisiones importantes para tu hora más fresca.\n\n### ¿Por qué estoy tan segura de algo si casi no tengo información?\nPorque tu seguridad depende de qué tan bien encaja la historia, no de cuántos datos tienes. Con pocos datos que no se contradicen, la historia encaja perfecto. Pregúntate siempre: ¿qué no sé?\n\n## Contenido | 3\n\n### ¿De verdad sirve publicar seguido aunque no me vea mucha gente?\nSí. Lo que vemos muchas veces se nos hace conocido, y lo conocido se siente confiable. No necesitas un video viral: necesitas aparecer seguido con la misma cara, los mismos colores y el mismo tono.\n\n### Un video me fue increíble y el siguiente no. ¿Hice algo mal?\nProbablemente no. Después de un resultado extraordinario, lo normal es que el siguiente sea más normal. Ese video tuvo talento y también suerte. Juzga tu contenido por grupos de 10 o 20 publicaciones, no por una.\n\n### ¿Cuántas veces tengo que probar algo antes de saber si funciona?\nComo regla práctica, haz al menos 10 publicaciones de un mismo tipo antes de decidir. Con dos o tres, los resultados pueden ser pura casualidad.\n\n### ¿Qué es más importante en mi perfil?\nLo que se ve primero: foto, primera línea, publicación fijada y los primeros segundos de tus videos. Para una desconocida, eso es todo lo que hay.\n\n## Vender | 6\n\n### ¿Usar estas ideas para vender no es manipular?\nDepende de cómo las uses. Explicar claro, mostrar primero el valor, dar muestras y contar historias reales es comunicar bien. Inventar precios de referencia, urgencias falsas o testimonios exagerados es engañar. Revisa la herramienta Vender limpio.\n\n### ¿Cómo presento un precio alto sin espantar?\nPrimero el valor y después el número: para qué le sirve, qué incluye, cuánto le dura. Si tienes varias opciones, muestra primero la que de verdad le recomendarías. Y si el costo por día ayuda a entenderlo, úsalo, siempre con números reales.\n\n### ¿Por qué funcionan tanto las muestras?\nPorque cuando algo ya es tuyo vale más para ti, y dejar de usarlo se siente como una pérdida. Una clienta que probó el producto y le gustó siente que lo pierde si no lo compra.\n\n### Tengo que subir mis precios. ¿Cómo lo digo?\nCon anticipación y con la razón. A la gente le parece injusto que le quiten algo que ya considera suyo, pero le parece justo que protejas tu ganancia cuando a ti también te subieron los costos.\n\n### ¿Un testimonio funciona mejor que un dato?\nCasi siempre sí. Una historia concreta con una persona real se queda en la cabeza mucho más que un porcentaje. Que sea real, con permiso, y un caso típico, no el milagro entre cien.\n\n## Tu negocio | 10\n\n### Siempre me atraso con mis planes. ¿Qué hago?\nDeja de calcular desde tu caso y pregunta cuánto les tardó a otras en algo parecido. Empieza desde ese promedio y ajusta. Y haz un premortem antes de arrancar.\n\n### Ya le metí mucho dinero a algo que no funciona. ¿Sigo?\nLo que ya gastaste no regresa, decidas lo que decidas. Pregúntate: si empezara hoy desde cero, ¿escogería esto? Si la respuesta es no, soltarlo es la mejor decisión aunque duela.\n\n### ¿Puedo confiar en mi intuición?\nSí, cuando tienes mucha práctica en algo que se repite y en lo que viste rápido si acertaste. Tu intuición con tus clientas de siempre puede ser muy buena. Para predecir modas, la economía o qué se hará viral, no tanto.\n\n### ¿Cómo hago que mis clientas me recuerden bien?\nCuida dos momentos: el mejor de la experiencia y el final. Un empaque bonito o una nota a mano, y un seguimiento amable después de la entrega. Es lo que más se queda en la memoria.\n\n## Tu mentora | 0\n\n### ¿Qué hace la mentora?\nTe da las clases una por una, te ayuda a aplicar La Pausa y el Premortem a tus decisiones reales, y revisa tus ofertas para que sean claras y honestas.\n\n### ¿Necesito pagar Claude para usarla?\nNo. Funciona con la cuenta gratis. La cuenta gratis tiene un límite de mensajes por día; si se acaba, vuelve a estar disponible horas después.";

  g.addEventListener("pointermove",function(e){if(y0==null)return;dy=e.clientY-y0;sh.style.transform="translateY("+(dy<0?dy*.15:dy)+"px)";});
  function end(){if(y0==null)return;var v=dy/Math.max(1,performance.now()-t0);sh.classList.remove("drag");sh.style.transform="";y0=null;if(dy>140||v>.5)closeLesson();}
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
}
function closeLesson(){
  if(!cur)return;var c=cur;cur=null;document.body.classList.remove("sheet-open");
  c.sh.classList.remove("on");c.scrim.classList.remove("on");setTimeout(function(){c.sh.remove();c.scrim.remove();},reduce?0:500);
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  var t=document.querySelector('#progView [data-open="'+c.id+'"]')||c.trigger;if(t&&t.focus)t.focus({preventScroll:false});
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&cur)closeLesson();});
