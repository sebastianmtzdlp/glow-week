<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:3px}
.wrap{max-width:var(--maxw,1040px);margin:0 auto;padding-inline:16px;padding-block:0 64px;display:flex;flex-direction:column;gap:var(--gap,28px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.press{transition:transform .16s cubic-bezier(.23,1,.32,1)}

/* tabs */
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:center;margin-inline:-16px;padding:10px 16px}
.tabbar::before{content:"";position:absolute;inset:0;background:var(--bg);opacity:.94;z-index:-1}
.tabs{display:flex;gap:4px;max-width:100%;overflow-x:auto;padding:4px;border-radius:var(--tabs-r,999px);background:var(--surface);border:1px solid var(--line)}
.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:15px;padding:10px 18px;border-radius:var(--tabs-r,999px);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* shared buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:15px;padding:12px 18px;border-radius:var(--btn-r,999px);cursor:pointer;text-decoration:none;transition:transform .16s cubic-bezier(.23,1,.32,1)}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.35;cursor:default}

/* section heads (faq + mentor) */
.sec-h{margin:0;font:var(--h2-font);letter-spacing:var(--h2-track,-.01em);text-wrap:balance}
.sec-p{margin:8px 0 0;color:var(--muted);max-width:56ch}

/* faq */
.faqv{display:flex;flex-direction:column;gap:16px;max-width:780px}
.f-search{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--field-r,999px);padding:0 18px}
.f-search svg{width:20px;height:20px;flex:none;color:var(--muted)}
.f-search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:17px/1.3 var(--body);padding:14px 0}
.f-search input:focus{outline:none}
.f-search:focus-within{border-color:var(--accent)}
.f-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.f-count{margin:0;color:var(--muted);font-size:14px}
.fgroup h3{margin:18px 0 8px;font:var(--h3-font)}
details.qa{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,16px);margin-bottom:8px}
details.qa summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 18px;font-weight:600;font-size:16.5px;line-height:1.35}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary i{flex:none;font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink);transition:transform .2s cubic-bezier(.23,1,.32,1)}
details.qa[open] summary i{transform:rotate(45deg);background:var(--accent);color:var(--accent-ink)}
.ans{padding:0 18px 18px}
.ans p{margin:0 0 .7em;max-width:64ch}.ans p:last-child{margin:0}
.ans ul,.ans ol{margin:0 0 .8em;padding-left:1.3em}
.ans .go{margin-top:10px}
mark{background:var(--mark,rgba(255,200,0,.35));color:inherit;border-radius:3px;padding:0 2px}

/* mentor */
.mentorv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 40px;align-items:start}
@media (max-width:780px){.mentorv{grid-template-columns:minmax(0,1fr)}}
.m-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.m-can{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.m-can li{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,16px);padding:14px 16px}
.m-can b{display:block;font-weight:700}
.m-can span{color:var(--muted);font-size:15px}
.m-dl{display:flex;flex-wrap:wrap;gap:10px}
.m-note{margin:0;color:var(--muted);font-size:14px}
.m-h{margin:0;font:var(--h3-font)}
.m-steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.m-steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:baseline}
.m-steps li::before{counter-increment:s;content:counter(s);font:var(--num-font,700 22px/1 var(--display));color:var(--accent-text,var(--accent))}
.m-prompts{display:grid;gap:8px}
.m-prompt{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,14px);padding:10px 12px 10px 16px}
.m-prompt q{quotes:none;min-width:0;font-size:15.5px}
.m-prompt .btn{padding:8px 14px;font-size:13.5px;flex:none}
.m-limits{display:flex;flex-wrap:wrap;gap:8px}
.m-limits span{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted)}
footer.foot{text-align:center;font-size:14px;color:var(--muted);padding-top:20px}

/* ---------- reader sheet (the lights come on) ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;transition:opacity .45s cubic-bezier(.32,.72,0,1)}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;top:calc(12px + env(safe-area-inset-top,0px));margin:0 auto;max-width:800px;background:var(--r-bg);color:var(--r-ink);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:0 -12px 50px rgba(0,0,0,.35);font-family:var(--r-body,var(--body))}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{flex:none;touch-action:none;cursor:grab;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 14px 10px 20px;border-bottom:1px solid var(--r-line);position:relative}
.grab::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--r-line)}
.grab .where{font-size:14px;font-weight:600;color:var(--r-muted);padding-top:8px}
.grab .x{border:1px solid var(--r-line);background:transparent;color:var(--r-ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;margin-top:6px}
.sheet :focus-visible{outline:2px solid var(--r-accent);outline-offset:3px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:clamp(22px,5vw,48px) clamp(18px,5vw,56px) calc(56px + env(safe-area-inset-bottom,0px))}
.r-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:end;margin-bottom:18px}
.r-head.nonum{grid-template-columns:minmax(0,1fr)}
.r-num{grid-row:span 2;font:var(--r-num-font,800 96px/.8 var(--display));color:var(--r-accent);font-variant-numeric:tabular-nums}
.r-k{margin:0;font-size:14.5px;font-weight:600;color:var(--r-accent)}
.r-title{margin:0;font:var(--r-title-font,700 clamp(32px,6.5vw,48px)/1 var(--display));letter-spacing:var(--r-title-track,-.01em);text-wrap:balance}
.r-topic{margin:0 0 18px;font-size:20px;line-height:1.35;color:var(--r-muted)}
.r-intro{font-size:20px;line-height:1.5;margin:0 0 26px;padding-bottom:24px;border-bottom:1px solid var(--r-line)}
.lesson-body p,.lesson-body li{max-width:66ch}
.lesson-body p{margin:0 0 .9em}
.lesson-body ul,.lesson-body ol{margin:0 0 1em;padding-left:1.3em}
.lesson-body li{margin:.4em 0}
.lesson-body li::marker{color:var(--r-accent);font-weight:700}
.lesson-body strong{font-weight:700}
.lesson-body h3{font:var(--r-h3-font,700 26px/1.15 var(--display));margin:36px 0 10px;text-wrap:balance}
.callout{margin:28px 0;padding:22px 24px;border-radius:var(--card-r,18px);background:var(--r-callout-bg);color:var(--r-callout-ink)}
.callout p{margin:0;font:var(--r-callout-font,700 clamp(22px,4.6vw,28px)/1.2 var(--display));max-width:34ch;text-wrap:balance}
.turn{margin-top:40px;padding-top:26px;border-top:2px solid var(--r-ink);display:grid;gap:12px}
.turn h3{margin:0;font:var(--r-h3-font,700 26px/1.15 var(--display))}
.task{background:var(--r-surface);border:1px solid var(--r-line);border-radius:var(--card-r,16px);padding:16px 18px}
.task h4{margin:0 0 6px;font-size:17px}
.task p:last-child,.task ul:last-child,.task ol:last-child{margin-bottom:0}
.nb-l{font-weight:600;font-size:14px;color:var(--r-muted);margin-top:6px}
.sheet textarea{width:100%;min-height:150px;resize:vertical;font:16px/1.55 var(--r-body,var(--body));color:var(--r-ink);background:var(--r-surface);border:1px solid var(--r-line);border-radius:12px;padding:14px 16px}
.saved{font-size:13px;color:var(--r-muted);min-height:1.2em}
.r-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:34px;padding-top:22px;border-top:1px solid var(--r-line)}
.r-foot .nav{display:flex;gap:8px;flex-wrap:wrap}
.sheet .btn{border-color:var(--r-line);color:var(--r-ink)}
.sheet .btn.solid{background:var(--r-ink);border-color:var(--r-ink);color:var(--r-bg)}
.sheet .btn.done{background:var(--r-accent);border-color:var(--r-accent);color:var(--r-accent-ink,var(--r-bg))}
.r-next{width:100%;margin:0;font-size:14px;color:var(--r-muted)}
body.sheet-open{overflow:hidden}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.mentorv .sec-h{font-size:clamp(28px,6.4vw,46px)}
/* Ponte Pro: the book cover at night. A mosaic of hundreds of small blue tiles (the people in your network) behind tall classical capitals, with one green accent. The one moment: tiles light up from the center outward as you finish classes; your network switching on. */
:root{
  --bg:#08121F; --surface:#0F1D30; --ink:#EEF2F8; --muted:#9AABC2; --line:#1F3149; --accent:#7ED957; --accent-ink:#0B1A06; --glow:#CFE6FF; --focus:#7ED957; --mark:rgba(126,217,87,.30);
  --display:"Cinzel","Trajan Pro","Times New Roman",serif; --body:"Libre Franklin",system-ui,-apple-system,sans-serif;
  --h2-font:600 clamp(28px,5.6vw,44px)/1.04 var(--display); --h3-font:600 21px/1.15 var(--display); --num-font:600 24px/1 var(--display);
  --r-bg:#F4F6F9; --r-surface:#FFFFFF; --r-ink:#0D1B2C; --r-muted:#52627A; --r-line:#DFE5EE; --r-accent:#2E7A1D; --r-accent-ink:#FFFFFF; --r-callout-bg:#08121F; --r-callout-ink:#A6E486;
  --r-num-font:600 clamp(64px,15vw,104px)/.85 var(--display); --r-title-font:600 clamp(27px,5.4vw,40px)/1.08 var(--display); --r-h3-font:700 21px/1.2 var(--body); --r-callout-font:600 clamp(20px,4.2vw,25px)/1.3 var(--display);
  --card-r:6px; color-scheme:dark;
}
body{background:var(--bg)}
.sec-h{letter-spacing:.01em;text-wrap:balance}
.sec-h em{font-style:normal;color:var(--accent)}
.tabs{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;gap:4px;padding:0}
.tab{border-radius:0;padding:12px 14px 11px;font-size:15px;font-weight:600;letter-spacing:.02em;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{background:transparent;color:var(--ink);border-bottom-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lesson-body h4{font-size:17px;margin:22px 0 6px}

/* hero: the cover */
.p-hero{position:relative;display:grid;justify-items:center;text-align:center;gap:14px;padding-block:0 6px}
.p-cover{position:relative;width:100%;max-width:100%;overflow:hidden;border-radius:var(--card-r);background:#06101C;isolation:isolate}
.p-tiles{display:grid;gap:2px;padding:2px;width:100%}
.p-tiles i{display:block;aspect-ratio:1/1;border-radius:1px;background:var(--t,#13263F);opacity:.55;transition:background-color .9s ease,opacity .9s ease,box-shadow .9s ease}
.p-tiles i.on{background:var(--l,#9CC8F0);opacity:1;box-shadow:0 0 10px -2px var(--l,#9CC8F0)}
.p-tiles i.g{--l:#7ED957}
@media (prefers-reduced-motion:no-preference){.p-tiles i.tw{animation:ptw 5s ease-in-out infinite;animation-delay:var(--d,0s)}@keyframes ptw{0%,100%{opacity:.55}50%{opacity:.95}}}
.p-cover::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 55% 60% at 50% 52%,rgba(207,230,255,var(--gl,.10)),transparent 70%),linear-gradient(180deg,rgba(6,16,28,.55),rgba(6,16,28,.15) 40%,rgba(6,16,28,.7))}
.p-title{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px;pointer-events:none}
.p-pre{margin:0;font:600 clamp(13px,2.4vw,17px)/1 var(--display);letter-spacing:.32em;color:var(--glow);padding-left:.32em}
.p-mark{margin:0;color:#FFFFFF;text-shadow:0 0 28px rgba(207,230,255,.55),0 2px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center}
.p-mark span{display:block;font:400 clamp(44px,11vw,92px)/.9 var(--display);letter-spacing:.06em;padding-left:.06em}
.p-mark b{display:block;font:400 clamp(92px,25vw,210px)/.82 var(--display);letter-spacing:.02em;padding-left:.02em}
.p-sub{margin:4px 0 0;font:600 clamp(11px,2.2vw,14px)/1.3 var(--display);letter-spacing:.14em;color:var(--accent)}
.p-pitch{margin:6px 0 0;color:var(--muted);max-width:46ch;font-size:17px;line-height:1.5}
.p-cta{display:flex;flex-direction:column;align-items:center;gap:10px}
.p-cta .btn{padding:15px 26px;font-size:16px}
.p-status{margin:0;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.p-status b{color:var(--accent);font-weight:600}

/* route */
.p-route{display:grid;gap:44px;max-width:780px;margin:0 auto;width:100%}
.p-part{display:grid;gap:14px}
.p-part > div:first-child{display:grid;gap:4px}
.p-eyebrow{margin:0;font:600 12.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.p-welcome{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r);padding:18px 20px;cursor:pointer;color:var(--ink);transition:transform .16s cubic-bezier(.23,1,.32,1),border-color .2s}
.p-welcome:active{transform:scale(.98)}
@media (hover:hover){.p-welcome:hover{border-color:var(--accent)}}
.p-welcome small{display:block;font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.p-welcome b{display:block;font:600 23px/1.15 var(--display);margin:5px 0}
.p-welcome span span{display:block;color:var(--muted);font-size:15px;line-height:1.4}
.p-welcome.seen small::after{content:" · vista"}
.p-arr{font:400 28px/1 var(--display);color:var(--accent);flex:none}
.p-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.p-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 4px;cursor:pointer;color:var(--ink);transition:transform .16s cubic-bezier(.23,1,.32,1),background-color .2s}
.p-row:active{transform:scale(.985)}
@media (hover:hover){.p-row:hover{background:rgba(207,230,255,.03)}}
.p-row .n{font:400 30px/1 var(--display);color:#3D5577;text-align:center;font-variant-numeric:tabular-nums}
.p-row b{display:block;font-weight:600;font-size:17px;line-height:1.3}
.p-row small{display:block;color:var(--muted);font-size:14.5px;line-height:1.35;margin-top:2px}
.p-row .k{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.p-row .st{font-size:12.5px;font-weight:700;border-radius:3px;padding:4px 9px;white-space:nowrap}
.p-row.seen .n{color:var(--glow)}
.p-row.seen .st{color:var(--accent);padding-inline:0}
.p-row.next{background:var(--surface);border-radius:var(--card-r);border-bottom-color:transparent;padding-inline:8px 14px;margin-block:4px;box-shadow:inset 0 0 0 1.5px var(--accent)}
.p-row.next .n{color:var(--accent)}
.p-row.next .st{background:var(--accent);color:var(--accent-ink)}
.p-seven{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:4px}
.p-seven span{display:grid;gap:6px;justify-items:center;text-align:center;font-size:11.5px;line-height:1.2;color:var(--muted)}
.p-seven i{width:100%;height:6px;border-radius:1px;background:var(--line);transition:background-color .6s ease}
.p-seven span.on i{background:var(--accent)}
.p-seven span.on{color:var(--ink)}
@media (max-width:520px){.p-seven span em{display:none}}
.p-seven span em{font-style:normal}
.p-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.p-tool{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r);padding:15px 16px;cursor:pointer;color:var(--ink);transition:transform .16s cubic-bezier(.23,1,.32,1),border-color .2s}
.p-tool:active{transform:scale(.98)}
@media (hover:hover){.p-tool:hover{border-color:var(--accent)}}
.p-tool b{display:block;font-weight:600}
.p-tool small{color:var(--muted);font-size:14px}
.r-title:focus{outline:none}
footer.foot{max-width:62ch;margin:0 auto;font-size:13px;line-height:1.5}

</style>

var LESSONS_MD="@@ 0 | Empieza aquí | Bienvenida a Ponte Pro | El curso en 5 minutos\nEste curso es para que dejes de \"probar suerte\" con tu negocio de Farmasi y lo trabajes como lo que es: una profesión. Con habilidades que se aprenden, se practican y se enseñan.\n\n## De qué se trata\nCasi todas entramos igual: con emoción, una lista de cinco o seis personas en la cabeza y la esperanza de que alguna diga que sí. Cuando no pasa, nos desinflamos y pensamos que \"esto no funciona\" o que \"no soy buena para vender\".\n\nLa idea de este curso es otra: **en este negocio no gana la que tiene suerte, gana la que se vuelve experta**. Y para volverte experta no necesitas un título, ni conocer a mucha gente, ni tener una personalidad especial. Necesitas dominar siete habilidades sencillas y practicarlas hasta que te salgan solas.\n\n> No viniste a vender un producto. Viniste a aprender un oficio.\n\n## Cómo está armado\n- **Decide (clases 1 a 3).** Por qué este modelo de negocio tiene sentido hoy, los tres tipos de personas que hay en el network marketing y por qué la única variable de tu negocio eres tú.\n- **Las 7 habilidades (clases 4 a 11).** Encontrar a quién hablarle, invitar (dos clases, porque es la habilidad más importante), presentar, dar seguimiento, ayudar a decidir, arrancar bien a tus nuevas y llenar los eventos.\n- **Para largo (clases 12 y 13).** Cuánto tarda esto en serio, cómo se aprende y por qué vale la pena.\n- **Herramientas.** El guion de invitación, respuestas a las dudas más comunes, la plática de arranque para tus nuevas y tu semana pro.\n\n## Lo que necesitas\n- Un cuaderno o una nota en tu celular para tu lista (o el cuaderno de cada clase, que se guarda en tu teléfono).\n- El material que ya usa tu equipo: el catálogo, el video o la presentación de la oportunidad, muestras y el calendario de eventos.\n- Ganas de practicar. Aquí casi todo se aprende haciendo.\n\n## Antes de empezar\nEste curso no promete ingresos. Lo que ganes depende de tu trabajo, de tus ventas a clientas reales y de cuánto tiempo le dediques. Lo que sí te promete es un método claro para dejar de improvisar.\n\n## 🪞 Para pensar\n¿Hasta hoy has tratado tu negocio como un pasatiempo, como un boleto de lotería o como una profesión? Sé honesta.\n\n## ✍️ Escribe\nEscribe en una frase por qué quieres volverte profesional. Por ejemplo: \"Quiero que mi negocio deje de depender de mi ánimo del día.\"\n\n@@ 1 | Decide | Clase 1 · No es perfecto, es mejor | Por qué este modelo tiene sentido hoy\nAntes de aprender las habilidades, vale la pena entender por qué este negocio merece que lo tomes en serio.\n\n## La lista del trabajo ideal\nSi le preguntas a cualquier persona cómo sería su trabajo perfecto, casi todas dicen cosas parecidas. Primero lo que no quieren: jefe, tráfico, despertador, horarios ajenos, politiquería, techo de ingreso. Luego lo que sí quieren: un producto que les guste, ingresos que sigan llegando aunque no estén, gente con la que les dé gusto trabajar, tiempo libre, crecer como personas, poco riesgo y poca inversión para empezar.\n\nAhora piensa en las opciones que casi todas conocemos:\n- **Trabajo de oficio u operativo.** Da satisfacción, pero cambias horas por dinero y tu ingreso tiene tope.\n- **Empleo de oficina.** Se ve seguro, pero dependes de otros. O te vuelves experta en política interna para subir, o te escondes para que no te noten.\n- **Ventas tradicionales.** Ganas por resultados, pero cada mes empiezas en cero y cualquier cambio de la empresa te mueve el piso.\n- **Negocio propio tradicional.** Suena a libertad, pero muchas veces significa deudas, rentas, empleados y ser la primera en llegar y la última en irse.\n- **Invertir.** Necesitas dinero, conocimiento y aceptar que no controlas lo que pasa.\n\nNinguna cumple la lista completa. No porque sean malas, sino porque fueron diseñadas para otra época.\n\n## El mundo ya cambió\nCada vez más trabajos pagan por resultados y no por horas. La tecnología elimina puestos que antes parecían seguros. En ese mundo, el negocio en red tiene sentido: las marcas necesitan que alguien le cuente a la gente sobre sus productos, y en lugar de gastar todo en publicidad, le pagan a quien los recomienda.\n\nPara ti eso significa algo concreto: puedes tener muchas de las ventajas de un negocio propio, con poca inversión, sin rentas ni empleados y sin un techo puesto por alguien más.\n\n> No es perfecto. Es mejor que las otras opciones que tienes enfrente.\n\n## La parte que nadie te dice\nHay un costo, y es mejor saberlo desde hoy: **por un tiempo, algunas personas van a pensar menos de ti**. Te van a decir que \"eso no funciona\" o que \"es una pirámide\".\n\n¿Por qué? Porque la mayoría de quienes lo intentaron nunca empezaron un negocio. Entraron con una lista de cinco amigas, les hablaron sin preparación, no pasó nada y concluyeron que el modelo no sirve. Es como comprar un raspadito, que no te salga premio y decir que el dinero no existe.\n\nTu trabajo no es convencerlas a todas. Es entender de dónde viene esa opinión, no tomarla personal y seguir construyendo. Con el tiempo, tus resultados hablan.\n\n## 🪞 Para pensar\nDe la lista del trabajo ideal, ¿qué tres cosas son las que más te importan a ti?\n\n## ✍️ Escribe\nEscribe qué te dirías a ti misma la próxima vez que alguien te diga \"eso no funciona\". Que sea una frase que te dé calma, no una para pelear.\n\n## ✅ Hoy\nEscribe tu propia lista del trabajo ideal: cinco cosas que no quieres y cinco que sí. Guárdala, la vas a usar en la clase 9.\n\n@@ 2 | Decide | Clase 2 · Decide ser pro | La Raspadita, la Aficionada y la Pro\nEn este negocio hay tres tipos de personas. Todas hemos sido alguna. La pregunta es cuál vas a ser de aquí en adelante.\n\n## La Raspadita\nEntra como quien compra un boleto de lotería. Tiene en la cabeza a cinco o seis personas que \"seguro van a entrar\". Si alguna entra, sigue un rato. Si no, rompe el boleto y dice que esto no funciona. Su único plan es la suerte, y la suerte tiene que llegar rápido.\n\nOcho de cada diez personas empiezan así. No es un defecto, es que nadie les dijo que esto se aprende.\n\n## La Aficionada\nYa se lo toma más en serio, pero pone su energía en cuatro cosas que no controla:\n- **La suerte.** Espera encontrar a esa persona \"estrella\" que le cambie todo.\n- **El momento.** ¿Entré a tiempo? ¿Ya hay muchas en mi ciudad? ¿La marca está muy grande o muy chica?\n- **La posición.** ¿Estoy en el equipo correcto? ¿Mi líder me ayuda lo suficiente?\n- **Los atajos.** Cada técnica nueva de redes, cada truco, cada anuncio. Siempre buscando la fórmula mágica.\n\n## La Pro\nUna profesional es **una experta en las habilidades que hacen crecer un equipo grande y sano**. Deja de pensar en la suerte, el momento, la posición y los atajos. Incluso deja de obsesionarse con el dinero. Se enfoca en sus habilidades y practica, practica, practica.\n\n## Emoción con habilidad\nSe dice mucho que \"más vale entusiasmo sin saber que saber sin entusiasmo\". ¿Y por qué elegir? Imagina a una doctora que te dice: \"Nunca he hecho esta operación, pero estoy súper emocionada.\" ¿Te operarías con ella? El entusiasmo es buenísimo, pero tiene que ir con habilidad.\n\nUna enfermera estudia años. Una estilista practica cientos de cortes. Pero cuando alguien entra a este negocio, muchas veces no le dedica ni una semana a aprender. Ser pro es darle a tu negocio el mismo respeto que le darías a cualquier carrera.\n\n## Lo que pasa cuando decides\nCuando decides ser pro pasa algo curioso: **tu equipo empieza a crecer**. La gente siente tu compromiso. Piensa en alguna maestra, coach o jefa que se tomaba en serio su trabajo. Te inspiraba, ¿verdad? Tú puedes ser eso para otras.\n\nY la buena noticia: este negocio te deja ganar mientras aprendes. No tienes que esperar a ser experta para empezar a tener resultados. Solo no dejes de aprender cuando empiecen a llegar.\n\n## 🪞 Para pensar\n¿En cuál de los cuatro focos de la Aficionada (suerte, momento, posición, atajos) se te va más la energía?\n\n## ✍️ Escribe\nEscribe tu decisión con tus palabras. Por ejemplo: \"A partir de hoy trato mi negocio como una profesión. Mi trabajo es dominar las siete habilidades.\"\n\n## 💬 Cuéntame\nComparte tu decisión con tu líder o con tu mentora. Decirla en voz alta la vuelve real.\n\n@@ 3 | Decide | Clase 3 · Tú eres la variable | Responsabilidad total y las siete habilidades\nTu negocio tiene tres piezas. Dos son iguales para todas. La tercera eres tú.\n\n## Las tres piezas\n1. **Los productos.** Todas en Farmasi vendemos el mismo catálogo. Si a otra le va bien con esos productos y a ti no, el problema no es el producto.\n2. **El plan de ganancias.** Es el mismo para todas, sin importar tu edad, tu escolaridad o de dónde vienes. Si otra gana más con el mismo plan, el problema no es el plan.\n3. **Tú.** Eres lo único que cambia. Y por eso eres la diferencia entre que funcione o no.\n\n> Mismo catálogo, mismo plan. La diferencia eres tú, y eso es una buena noticia, porque tú sí puedes cambiar.\n\n## Recurso, no excusa\nEn este negocio hay una epidemia: culpar a la líder de arriba. \"Si mi líder me ayudara más, me iría mejor.\" Es comodísimo, y no sirve.\n\nTe propongo algo fuerte. Ten una conversación (aunque sea solo contigo) que diga algo así: \"Gracias por invitarme. Desde hoy te voy a usar como recurso, nunca como excusa. Si puedes ayudarme, qué padre. Si no, también está bien. Mi negocio empieza y termina conmigo.\"\n\nNo es pelearte con nadie. Es quitarle a otras el poder sobre tus resultados.\n\n## Las siete habilidades\nEsto no es ciencia espacial. Son siete habilidades, no setenta:\n1. **Encontrar a quién hablarle.**\n2. **Invitar** a conocer tu producto o tu negocio.\n3. **Presentar.**\n4. **Dar seguimiento.**\n5. **Ayudar a decidir** a que se vuelva clienta o socia.\n6. **Arrancar bien** a tus nuevas.\n7. **Promover eventos.**\n\nCada una es sencilla. Lo que sorprende es lo poco que la mayoría las practica. Las siguientes ocho clases son una por una.\n\n## Lo bueno de esta profesión\nNo necesitas pedir un crédito para estudiarla. Puedes ganar mientras aprendes. No importa tu edad, tu historia ni a quién conoces. Y hay mucha gente con interés en que te vaya bien y dispuesta a enseñarte.\n\n## 🪞 Para pensar\n¿A quién o a qué has culpado alguna vez por tus resultados? ¿Qué cambia si mañana dejas de hacerlo?\n\n## ✍️ Escribe\nCalifica del 1 al 10 qué tan buena te sientes hoy en cada una de las siete habilidades. Vas a volver a esta lista al terminar el curso.\n\n@@ 4 | Habilidad 1 | Clase 4 · Tu lista viva | Encontrar a quién hablarle\n\"Es que no conozco a nadie.\" Es la duda más común al empezar. Y no es cierta: encontrar gente es una habilidad, no una cuestión de suerte.\n\n## Tres formas de hacer la lista\n- **La Raspadita** hace una lista mental de cuatro o cinco personas y todo su futuro depende de lo que esas cinco digan.\n- **La Aficionada** hace una lista escrita de cien. Sale con emoción, la lista se va acabando y su angustia va creciendo. Su mayor miedo es quedarse sin gente.\n- **La Pro** también empieza con una lista escrita, pero **nunca la deja de alimentar**. Por eso le decimos tu lista viva.\n\n## Los cuatro pasos de tu lista viva\n**1. Saca todo de tu cabeza.** Escribe a todas las personas que conoces. A todas. No decidas si son \"prospecto\" o no. Tu amiga negativa va en la lista. La que te cae mal, también. La que ya te dijo que nunca entraría a algo así, también. Tu tía de 70 y tu sobrina de 19, también. Piensa en cada escuela, trabajo, colonia, iglesia, gimnasio, grupo de mamás y chat de WhatsApp en el que has estado. Si lo haces bien, salen cientos de nombres.\n\nNo tienes que hablarle a todas. Pero sí tienes que tenerlas escritas. Cuando vacías tu cabeza en papel, haces espacio para que aparezcan más.\n\n**2. Piensa en a quién conocen ellas.** Tu hermana, ¿a quién conoce? Tu comadre, ¿con quién trabaja? Tus compañeras del gym, ¿quiénes son sus amigas? Casi siempre ya conoces a ese segundo círculo también. A la lista.\n\n**3. Agrega dos personas al día.** Esta es la diferencia de la Pro. Todos los días conoces gente: en la fila de la tienda, en la junta de la escuela, en redes, con la señora que te atiende en la estética. Si agregas dos personas al día, seis días a la semana, en un año son más de 600 nombres. ¿Ves por qué una Pro no se preocupa por quedarse sin gente?\n\nOjo: agregar no es atacar. No le sueltas tu presentación a nadie en cuanto la conoces. La agregas, haces amistad, te mantienes en contacto y, cuando sea el momento, le cuentas lo que tienes.\n\n**4. Sal a conocer gente a propósito.** Es difícil conocer gente si te escondes. Inscríbete a una clase, a un voluntariado, a un club de lectura, a un grupo de corredoras. Es bueno para tu negocio y, además, haces amigas.\n\n> Una Pro no tiene miedo de quedarse sin gente, porque buscar gente es parte de su trabajo diario.\n\n## En Farmasi\nTu lista viva también son tus clientas. Cada pedido es una relación. Anota su nombre, qué compró, cuándo se le acaba y qué le gustó. Muchas de tus futuras socias hoy son tus clientas.\n\n## ✍️ Escribe\nPon un temporizador de 30 minutos y escribe todos los nombres que puedas. Sin filtrar. Luego, junto a 10 de ellos, anota a quién conocen.\n\n## ✅ Hoy\nAgrega dos personas nuevas a tu lista antes de dormir.\n\n## 💬 Cuéntame\n¿Cuántos nombres te salieron? ¿Te sorprendió?\n\n@@ 5 | Habilidad 2 | Clase 5 · Jardinera, no cazadora | Cómo se invita sin perseguir a nadie\nInvitar es la habilidad más importante de todas. Es la puerta: si nadie acepta ver lo que tienes, lo demás no importa. Y no necesitas fama ni influencia para hacerlo bien.\n\n## Cazadora o jardinera\nHay dos maneras de invitar.\n\n**La cazadora** sale con la oportunidad en la mano y le dispara a todo lo que se mueve. No le importan las relaciones, solo \"cerrar\". Su lema es: \"unas sí, otras no, ¿y qué? la que sigue\". Resultado: todas a su alrededor se sienten perseguidas y la empiezan a evitar. Y las pocas que entran copian lo mismo, fracasan y se van.\n\n**La jardinera** siembra. Construye relaciones y confianza. Su meta inicial no es inscribir a nadie, sino **que la persona conozca y entienda lo que ofreces**, y que luego decida. Se comporta como una asesora: escucha, entiende qué le hace falta a la otra persona y le ofrece una solución con sentido común.\n\n> Tu meta al invitar no es que entre. Tu meta es que entienda.\n\n## No presentes, invita\nLas Pro no \"sueltan el rollo\". Cuando es el momento, invitan a una de dos cosas:\n- **A una herramienta:** el video de la oportunidad que usa tu equipo, el catálogo, una presentación en línea, una muestra del producto.\n- **A un evento:** un café uno a uno, una llamada de tres con tu líder, una reunión en casa, un Zoom, una junta presencial o un evento grande.\n\nLos eventos son lo más poderoso: la persona ve que hay más gente, siente el ambiente y escucha historias. Pero son más difíciles de agendar. Por eso, para empezar, **una herramienta suele ser el mejor primer paso**: la persona la ve en su tiempo, sin salir de casa. Después del video, la invitas al evento.\n\nUsa lo que ya funciona en tu equipo. No inventes tu propio material. Y si tu equipo tiene una forma diaria de trabajar (por ejemplo, \"dos videos compartidos al día\"), súmate a ella.\n\n## La fórmula\nSi tuviera que resumir cómo se construye la libertad en este negocio, sería así: **lograr que un grupo grande de personas haga, de forma constante, unas pocas cosas sencillas durante mucho tiempo.** No se trata de ser la mejor convenciendo. Se trata de hacer cosas tan simples que todas las puedan copiar.\n\n## Las cuatro reglas de la emoción\n1. **Suelta el resultado.** Si te enganchas con \"que entre\", vas a vivir decepcionada y la gente va a sentir tu necesidad. Si te enfocas en que entienda, todo se vuelve más ligero.\n2. **Sé tú.** Mucha gente se transforma en otra persona cuando invita, y eso incomoda a todas. Sé tú, en tu mejor versión.\n3. **Pon pasión.** El entusiasmo se contagia. Pon una canción que te prenda antes de llamar. Sonríe aunque sea por teléfono, se nota.\n4. **Párate firme.** Deja de pedir perdón. No es lo mismo \"ya sé que he intentado mil cosas, pero a lo mejor esta sí\" que \"me cansé de la vida que llevaba y decidí tomar el control. Yo no apostaría en mi contra\". Sé tú, pero más segura. Como un músculo: al principio aguantas poquito y luego cada vez más.\n\n## 🪞 Para pensar\n¿Alguna vez te sentiste cazadora? ¿Cómo reaccionó la gente?\n\n## ✍️ Escribe\nReescribe tu forma de presentarte con postura firme. Empieza con: \"Decidí tomar el control de…\"\n\n@@ 6 | Habilidad 2 | Clase 6 · La invitación en 8 pasos | El trato, las confirmaciones y colgar a tiempo\nAhora sí, el paso a paso. Esta invitación se hace en llamada o en persona. No por mensaje copiado y pegado: la herramienta sí se puede mandar por WhatsApp, pero la invitación se hace en vivo, con tu voz. Sirve con gente que conoces y con gente que vas conociendo.\n\n## Los 8 pasos\n1. Ten prisa.\n2. Haz un cumplido.\n3. Haz la invitación.\n4. El trato: \"Si te mando…, ¿lo ves?\"\n5. Que ella ponga el día.\n6. Confirma ese día.\n7. Agenda la llamada.\n8. Despídete.\n\nParece mucho, pero toma tres minutos.\n\n## Paso 1 · Ten prisa\nNos atrae la gente que tiene cosas que hacer. Si arrancas dando la impresión de que vas corriendo, la plática es más corta, hay menos preguntas y más respeto por tu tiempo. \"Tengo mil cosas, pero me urgía hablar contigo.\" \"Voy de salida, pero necesitaba decirte algo rápido.\"\n\n## Paso 2 · Haz un cumplido\nTiene que ser sincero. \"Siempre me has apoyado y te lo agradezco mucho.\" \"Tienes una cabeza para los negocios que pocas tienen.\" \"Me atendiste increíble, ¿a qué te dedicas además de esto?\" Nos dicen pocos cumplidos y se sienten bien. Abre la puerta a escuchar.\n\n## Paso 3 · Haz la invitación\nHay tres maneras, según la persona:\n\n**De frente.** Para quien te conoce y te respeta, o para alguien que sabes que busca algo más. \"¿Te acuerdas que me dijiste que ya no aguantas tu trabajo? ¿Era en serio o era broma? Creo que encontré una forma de que empieces a cambiar eso.\" Con gente que vas conociendo: \"¿Piensas hacer lo mismo que haces hoy el resto de tu vida?\"\n\n**Pide consejo.** Juegas un poco hacia abajo y le pides su opinión. \"Empecé un negocio y estoy nerviosa. Antes de arrancar quiero practicar con alguien de confianza, ¿me dejas practicar contigo?\" O: \"Tú sabes mucho de esto, ¿me ayudarías a ver si estoy tomando una buena decisión?\"\n\n**¿A quién conoces?** Le dices que no es para ella y le preguntas si conoce a alguien. \"Lo que hago seguro no es para ti, pero ¿conoces a alguien con ganas de tener un ingreso extra?\" Casi siempre te va a pedir más información antes de darte nombres (y muchas veces, por dentro, está pensando que a lo mejor sí es para ella). Respondes: \"Claro, tiene sentido que quieras saber más antes de recomendar a alguien.\" Y pasas al paso 4.\n\n## Paso 4 · El trato\nEsta es la frase más poderosa del proceso: **\"Si te mando…, ¿lo ves?\"**\n- \"Si te mando un video de 15 minutos, ¿lo ves?\"\n- \"Si te llevo el catálogo, ¿lo revisas?\"\n- \"Si te dejo una muestra, ¿la pruebas?\"\n- \"Si te invito a un Zoom corto, ¿te conectas?\"\n\nFunciona porque es un intercambio: tú haces algo si ella hace algo. No estás rogando ni pidiendo favores. Y deja claro que lo que tienes vale. Compáralo con \"porfa, porfa, de verdad quiero que veas mi video\". Se siente la diferencia, ¿no? La desesperación no atrae.\n\nSi te pide más información antes: \"Te entiendo, pero todo lo que preguntas viene en el video. La forma más rápida de entenderlo es verlo. Si te lo mando, ¿lo ves?\" Si dice que no, le das las gracias y sigues. No le mandes el material.\n\n## Paso 5 · Que ella ponga el día\nSi te quedas en el paso 4, muy pocas lo van a ver. Pregunta: **\"¿Cuándo crees que lo puedas ver, seguro?\"** Y espera. No le sugieras tú el día. Al pensar en su agenda, lo vuelve real. Si te dice \"un día de estos\", le dices: \"No quiero quitarte tiempo. ¿Qué te parece si ponemos un día en que seguro ya lo viste?\"\n\n## Paso 6 · Confirma ese día\n\"Entonces, si te marco el jueves en la tarde, ¿ya lo viste seguro, verdad?\" Ella confirma o ajusta. La cita no la pusiste tú: la puso ella.\n\n## Paso 7 · Agenda la llamada\n\"¿A qué número y a qué hora te marco?\" Ya te dijo que sí cuatro veces. Ahora tienes una cita real. Y tu trabajo es cumplirla.\n\n## Paso 8 · Despídete\n¿No ibas con prisa? \"¡Perfecto, hablamos el jueves! Me voy corriendo.\" Muchas hacen la cita y la deshacen hablando de más. Deja que la herramienta haga su trabajo.\n\n## Un ejemplo completo\n\"Oye, voy de salida pero me urgía hablar contigo. Siempre me has apoyado muchísimo y te lo agradezco. Empecé un negocio y estoy nerviosa, ¿me dejas practicar contigo? ... ¡Gracias! Si te mando un video de 15 minutos, ¿lo ves? ... ¿Cuándo crees que lo veas seguro? ... ¿El jueves? Entonces si te marco el viernes en la mañana, ya lo viste seguro, ¿verdad? ... ¿A qué hora te marco? ... Perfecto, hablamos el viernes. ¡Me voy, gracias!\"\n\n> No hay buenas ni malas invitaciones. Solo hay invitaciones de las que aprendes.\n\n## ✍️ Escribe\nElige a tres personas de tu lista. Para cada una, decide qué forma de invitación le va (de frente, pide consejo o a quién conoces) y escribe tu cumplido sincero.\n\n## ✅ Hoy\nHaz una invitación con los 8 pasos. Aunque te tiemble la voz.\n\n## 💬 Cuéntame\n¿Qué paso te costó más? ¿Qué te dijo la persona?\n\n@@ 7 | Habilidad 3 | Clase 7 · Mensajera, no mensaje | Presentar sin ser la experta\nCuando la persona ve el video sola, tú no tienes que hacer nada más que dar seguimiento. Pero cuando estás con ella, hay una idea que lo cambia todo: **la protagonista no eres tú**.\n\n## La trampa de ser la experta\nEs natural querer saberlo todo: cada producto, cada ingrediente, cada porcentaje del plan. Y sentarte a decir \"déjame contarte todo\". El problema tiene tres partes:\n1. Siempre habrá una pregunta que no sepas, y si te presentaste como experta, eso siembra duda.\n2. La gente que te conoce sabe que no eres experta, y eso la pone más escéptica.\n3. Aunque tú lo logres, tus nuevas no van a querer ni poder hacer lo mismo. Vas a terminar dando todas las presentaciones de tu equipo. Eso no es un negocio, es un trabajo.\n\n## Lo que se copia\n> En este negocio no importa lo que funciona. Importa lo que se puede copiar.\n\nPor eso las Pro usan herramientas en lugar de su propia sabiduría, eventos en lugar de su propia presentación, y a otras socias (tu líder, una compañera con una historia parecida) para dar los datos. Si te preguntan algo, no siempre contestas tú: guías a la persona a la respuesta. \"Eso lo explica muy bien la presentación del jueves.\" \"Déjame conectarte con mi líder, que te lo cuenta mejor.\"\n\n¿Qué pones tú? Pasión, entusiasmo, emoción y convicción. Eso sí es tuyo y eso sí se contagia.\n\n## Tu historia en cuatro partes\nA la gente no le interesa cuánto sabes, pero sí le interesa tu historia, mientras no la aburras. Toda buena historia tiene:\n1. **De dónde vienes.**\n2. **Lo que no te gustaba de ahí.**\n3. **Cómo llegó este negocio (o el producto) a tu vida.**\n4. **Tus resultados o cómo te sientes hoy con tu futuro.**\n\nEjemplo de estructura: \"Soy mamá de dos y trabajaba en una oficina. Me perdía todo de mis hijos y el dinero no alcanzaba. Una amiga me enseñó los productos y luego el negocio. Hoy apenas empiezo, pero por primera vez siento que mi futuro depende de mí.\" Cuéntala en menos de un minuto. Si apenas empiezas, habla de cómo te sientes; no inventes resultados.\n\n## Presentar en grupo\nLa que está al frente con el plumón suele ser la que más crece. Si te da pánico hablar en público, es normal. Se aprende por etapas:\n1. **Tu historia.** Cuéntala en todos lados hasta que te salga sola.\n2. **La presentación oficial de tu equipo.** Elige la de la mejor presentadora que conozcas, apréndetela casi palabra por palabra, grábate, escúchate y repite. Cuando la sabes de memoria, el miedo se convierte en ganas.\n3. **Capacitaciones.** Cuando ya dominas lo anterior, empiezas a enseñar.\n\nY para cualquier presentación importante: elige un tema, escríbela, reescríbela, practícala y grábate. Cuando estás preparada, hasta se disfruta.\n\n## ✍️ Escribe\nEscribe tu historia en las cuatro partes. Luego léela en voz alta con cronómetro. Si pasa de un minuto, recórtala.\n\n## ✅ Hoy\nGrábate en nota de voz contando tu historia. Escúchala una vez y cambia una cosa.\n\n@@ 8 | Habilidad 4 | Clase 8 · El seguimiento | Cada contacto prepara el siguiente\nDicen que la fortuna está en el seguimiento. Y es cierto, porque casi nadie lo hace bien.\n\n## 1 · Seguimiento es cumplir lo que dijiste\nSi dijiste que marcabas el viernes a las 6, marcas el viernes a las 6. En este negocio sobra gente que se emociona un día y desaparece al siguiente. Maneja tu negocio con una agenda (la del celular sirve). Si no puedes, avisa con anticipación y reagenda. La gente respeta a quien cumple y a quien valora su propio tiempo.\n\n## 2 · Cada contacto sirve para agendar el siguiente\nAl terminar una presentación, la pregunta natural es \"¿qué te pareció?\". Es de las peores: invita a la parte crítica de la mente a buscar peros para sonar lista. Y casi siempre acaba en \"luego te digo\", y ahí se pierde.\n\nEl cambio de mentalidad: **la única razón de un contacto es preparar el siguiente.** No tienes que \"cerrar\" en el primero. Tienes que mantener vivo el proceso hasta que la persona entienda y decida.\n\n**Si no vio el video:** no te enojes ni le reclames. \"No te preocupes, a todas se nos complica la semana. ¿Cuándo lo puedes ver, seguro seguro?\" Y repites los pasos de confirmación.\n\n**Si sí lo vio:** pregunta **\"¿Qué fue lo que más te gustó?\"** Esa respuesta te dice hacia dónde ir. Si dice \"los productos\", el siguiente paso es de producto (una muestra, el catálogo). Si dice \"la idea de tener mi propio dinero\", el siguiente paso es de negocio.\n\nLuego: **\"Del 1 al 10, donde 1 es nada de interés y 10 es lista para empezar, ¿dónde estás?\"** Cualquier número arriba de 1 es bueno. Pregunta: \"¿Qué te ayudaría a subir ese número?\" Y ahí agendas el siguiente contacto: que pruebe el producto, que platique con su pareja con el material en mano, que hable con tu líder, que venga al evento. Nunca termines un contacto sin el siguiente agendado.\n\n## 3 · Toma de cuatro a seis contactos\nEn promedio, una persona necesita de cuatro a seis contactos antes de entrar. Es un promedio: por cada una que entra a la primera, otra tarda diez. Algunas de las mejores socias tardaron años. Con prisa, pero con paciencia.\n\n## 4 · Junta los contactos\nLa Raspadita le habla una vez y se va. La Aficionada da varios contactos a lo largo de meses. La Pro **los junta en el menor tiempo posible**: el video el lunes, una muestra el martes, una llamada con su líder el jueves y el evento el sábado. Si los separas por semanas, la vida la distrae y cada contacto es empezar de cero.\n\n## Las dudas y las objeciones\nLas objeciones son normales. Muchas veces la persona las dice para no parecer fácil. Tu meta no es ganar una discusión, es ayudarle a ver lo que todavía no ve. Si te pones a la defensiva, siembras duda. Si atacas, la alejas.\n\nCasi todas las objeciones caben en dos grupos:\n- **Duda de sí misma:** \"No tengo dinero\", \"no tengo tiempo\", \"no soy vendedora\", \"no conozco a nadie\", \"estoy muy grande/muy chica\".\n- **Duda del modelo:** \"¿Es una pirámide?\", \"no quiero molestar a mis amigas\", \"¿cuánto ganas tú?\".\n\nLa herramienta más poderosa es la empatía: **\"Te entiendo. A mí me pasó igual. Y esto fue lo que descubrí.\"** Tu historia (o la de otra socia) hace más que cualquier argumento. Evita las respuestas que hacen sentir tonta a la otra persona, del tipo \"¿no tienes dinero pero sí pagas Netflix?\". Se sienten horribles.\n\nCon \"¿es una pirámide?\": si lo dice con emoción, casi siempre tiene una historia. \"Oye, parece que te pasó algo, ¿qué pasó?\" Escúchala. Luego explica con calma la diferencia: las pirámides son ilegales y viven de inscribir gente; un negocio en red legal vive de vender productos a clientas reales. En la herramienta de dudas tienes respuestas para cada una.\n\nY una buena noticia: son las mismas cinco o seis objeciones toda la vida. Las aprendes una vez.\n\n## ✍️ Escribe\nEscribe tu \"te entiendo, me pasó, descubrí\" para la objeción que más te da miedo.\n\n## ✅ Hoy\nRevisa tu agenda. ¿A quién le prometiste llamar y no lo has hecho? Hazlo hoy, o reagenda con un mensaje.\n\n@@ 9 | Habilidad 5 | Clase 9 · Ayudar a decidir | La postura y las cuatro preguntas\nSi das buen seguimiento, la persona va a entender lo que ofreces. Pero casi nadie te va a pedir sola el formato de inscripción. Tu trabajo es guiarla a una decisión.\n\n## La postura\nCómo te paras, lo que dices y lo que traes puesto (literal y figurado) le dan confianza o le siembran dudas. Hay cinco cosas que hacen las Pro:\n1. **Están desapegadas del resultado.** Lo opuesto a necesitadas. No quieren \"agarrar\" a nadie, quieren ayudar.\n2. **Asumen que sí.** Están tan convencidas de que le va a servir que casi se sorprenden cuando alguien dice que no.\n3. **Se ofrecen a sí mismas.** \"Tenemos buenos productos y un buen plan, pero además me tienes a mí. Voy a crecer y podemos hacerlo juntas.\" No es \"yo te hago todo\", es \"no vas a estar sola\".\n4. **Siempre están preparadas.** Traen el link de inscripción a la mano, saben qué kit recomendar y cómo se hace el primer pedido. Todo para empezar en ese momento.\n5. **Preguntan y escuchan.** Están más interesadas que interesantes. Como una buena asesora: primero entiende, luego propone.\n\n¿Y si todavía no te sale natural? Actúa como si. Al principio actúas el desapego, la seguridad, el \"me tienes a mí\". Con el tiempo, actúas menos y lo crees más.\n\n## Preguntas que llevan a algo\nEn lugar de \"¿qué te pareció?\", usa preguntas que van hacia adelante: \"¿Tuvo sentido?\", \"¿Qué fue lo que más te gustó?\", \"¿Ves cómo esto te podría servir?\". Luego la escala del 1 al 10. Si necesita más información, agendas el siguiente contacto. Si se ve lista, pasas a las cuatro preguntas.\n\n## Las cuatro preguntas del sí\n1. **\"Si empezaras medio tiempo, ¿cuánto tendrías que ganar al mes para que valga la pena tu tiempo?\"** No le pongas tú la cifra. Pregúntale y espera.\n2. **\"¿Cuántas horas a la semana le podrías dedicar para construir eso?\"**\n3. **\"¿Cuántos meses le darías esas horas para lograrlo?\"**\n4. **\"Si te enseño cómo construir (su cifra) al mes, trabajando (sus horas) a la semana durante (sus meses), ¿estarías lista para empezar?\"**\n\nSi dice que sí, sacas el plan de ganancias y arman juntas un plan realista. Si te da números imposibles (mucho dinero, pocas horas, un mes), eres honesta como asesora: \"Con esas expectativas no te voy a mentir, no se puede. Se puede llegar, pero toma más horas y más meses. Si quieres ajustarlo, platicamos.\"\n\n> Ser honesta con los números es parte de ser pro. Nunca prometas lo que no puedes cumplir.\n\nSi no hay un sí todavía, está bien. Agendas el siguiente contacto y repites el proceso.\n\n## ✍️ Escribe\nEscribe las cuatro preguntas con tus palabras, como tú las dirías. Ensáyalas en voz alta.\n\n## 💬 Cuéntame\n¿Cuál de las cinco cosas de la postura te cuesta más?\n\n@@ 10 | Habilidad 6 | Clase 10 · Arrancar bien | La plática de arranque y cruzar la raya\nMucha gente invierte energía en inscribir y luego deja a la nueva sola para que \"se las arregle\". La Pro no. La Pro pone expectativas claras, la ayuda a tener resultados rápidos y la acompaña hasta que vuela sola.\n\n## La plática de arranque\nCada vez que entra alguien nuevo, agenda una plática de arranque. Siempre la misma, en cinco partes.\n\n**1. Celebra su decisión.** \"¡Felicidades! Estoy orgullosa de ti por tomar el control. A partir de hoy las cosas van a ser distintas.\" Cinco minutos que borran cualquier duda.\n\n**2. Pon las expectativas.** Tres frases que lo cambian todo:\n- \"Si te va bien, va a ser gracias a ti. Y si no, también va a ser por ti. Yo te guío en cada paso, pero no lo puedo hacer por ti. Trabajo contigo, no para ti.\"\n- \"Mi trabajo es que dejes de necesitarme lo antes posible. ¿Te parece buena meta?\"\n- \"Va a haber días buenos y malos. Voy a saber que estás en uno malo cuando dejes de contestar, de ir a las juntas o empiece a escuchar excusas. Cuando eso pase, y nos pasa a todas, ¿qué quieres que haga: te dejo en paz o te recuerdo por qué empezaste?\"\n\nCompáralo con lo que solemos decir: \"tranquila, yo te ayudo con todo\". Eso crea una nueva que espera a que tú hagas el trabajo y que te usa de excusa cuando no puedes.\n\n**3. Revisa la lista de arranque.**\n- Que use los productos y se enamore de ellos. Si hay muestras o testers, que tenga suficientes.\n- Que tenga las herramientas: el video, el catálogo, su link.\n- Que esté conectada: el grupo del equipo, la app, el calendario de juntas y eventos.\n- Que entienda lo básico del plan de ganancias. No todo, solo los primeros niveles.\n- Que sepa invitar. Un resumen de los 8 pasos le ahorra semanas de hablar de más.\n\n**4. Arma el plan de su primera semana.** Es una carrera por los primeros resultados. Si llegan pronto, sigue. Si no, se apaga. ¿Cómo consigue su primera clienta? ¿Su primera socia? ¿Qué evento puede ir? ¿Qué necesita para su primera ganancia?\n\n**5. Deja tareas con fecha.** Las nuevas aman la dirección. \"Para el jueves, tu lista de 100 nombres. Me la mandas y la revisamos.\" De tarea en tarea, igual que de contacto en contacto.\n\n## Cruzar la raya\nCuando alguien empieza hay una raya invisible. De un lado, es más fácil renunciar que seguir. Del otro, es más fácil seguir que renunciar. Tu trabajo es ayudarla a cruzarla. Ayudan:\n- Su primera clienta.\n- Su primera socia.\n- Su primera ganancia.\n- Ir a un evento grande.\n- Hacer amigas en el equipo.\n- Decirle al mundo que va en serio.\n- Subir de nivel.\n- Que la reconozcan por un logro.\n\nY la raya nunca desaparece del todo. Como líder, fíjate siempre de qué lado está cada una.\n\n## ✍️ Escribe\nEscribe tus tres frases de expectativas con tus palabras.\n\n## ✅ Hoy\nSi tienes una nueva en tu equipo, agenda su plática de arranque. Si no, ensáyala con tu mentora.\n\n@@ 11 | Habilidad 7 | Clase 11 · Llena el evento | Promover, no solo anunciar\nLas juntas hacen crecer el negocio. La tecnología ayuda, pero nada reemplaza estar cara a cara. Y el más poderoso de todos es el evento grande: ese al que viajas, te hospedas y pasas uno o dos días enfocada en tus sueños.\n\n## Por qué los eventos importan tanto\n- **Te llenan.** Alejarte de la rutina un fin de semana te ayuda a reenfocarte y regresar con fuerza.\n- **Escuchas la frase que necesitabas.** A veces alguien dice algo justo en tu momento y te cambia para siempre. Casi todas las grandes decisiones de las líderes pasaron en un evento.\n- **Prueba social.** Ves a cientos que tomaron la misma decisión que tú. Ves a otras que tenían tus mismos miedos y llegaron lejos. \"Si ella pudo, yo también.\"\n- **Presión positiva.** Ves los reconocimientos en el escenario y piensas \"la próxima, subo yo\". Y no quieres llegar al siguiente sin avances.\n- **Comunidad.** Afuera hay gente que no entiende lo que haces. Ahí estás rodeada de gente que piensa como tú.\n\n## Las que regresan\nLa lógica es simple: en cada evento, una parte de la gente ya no regresa. Las que siguen regresando, evento tras evento, son las que van creciendo. No es magia: entre evento y evento hay que trabajar las habilidades. Pero si tú sigues regresando, con el tiempo terminas entre las que más crecen, y un día en el escenario.\n\n## Empieza por ti\nPara crear una cultura de eventos, primero tú tienes que ser la más comprometida. No te pierdas los eventos grandes. Hazlo prioridad desde que se anuncian: ahorra un poco cada semana, comparte cuarto y coche, lleva comida, organiza quién cuida a los niños. **Sin endeudarte:** planear con tiempo es lo que lo hace posible.\n\n## Anunciar o promover\nLa mayoría **anuncia**: \"Les recuerdo que el evento es en marzo\" y espera. La Pro **promueve**:\n- Lo hace prioridad en su equipo y habla de él seguido.\n- Cuenta historias de lo que pasó en el último evento.\n- Pinta la imagen de lo que van a vivir.\n- No descansa hasta que cada una tiene su lugar.\n- Lleva la cuenta: cuántas fueron al anterior y cuántas van a este.\n\nCuando alguien dice \"no puedo\", no te quedes con la primera respuesta. Pregunta, escucha y busca soluciones juntas: ¿y si comparten cuarto? ¿y si apartan con tiempo? ¿quién te puede echar la mano con los niños? Muchas veces el \"no puedo\" era un \"no sabía cómo\". **Cuenta tu historia, no te compres la suya.** Y si después de platicarlo de verdad no se puede, se respeta.\n\nPiensa que tu equipo cotiza en bolsa y su valor es cuántas personas llevas a cada evento. Empiezas tú sola, luego con dos, luego con cinco. Siempre un número más grande que la vez anterior.\n\n## ✍️ Escribe\nEscribe el próximo evento de tu equipo, la fecha y cuántas quieres llevar. Luego, tu plan para pagar tu lugar sin deudas.\n\n## 💬 Cuéntame\n¿Qué te pasó en algún evento que te cambió? Esa historia es tu mejor herramienta para promover el siguiente.\n\n@@ 12 | Para largo | Clase 12 · Esto toma tiempo | 1·3·5·7, cómo se aprende y tus cinco\nSi alguien abre una tienda, espera tardar años en recuperar lo que invirtió. Pero cuando alguien entra a un negocio en red, espera recuperar en un mes, ganar en el segundo y estar rica en el tercero. Y cuando no pasa, culpa al negocio. Todo lo que vale toma tiempo.\n\n## Solo ganas lo que eres\nA veces te llega un mes de suerte: estabas en el lugar correcto. Pero si no creces rápido como persona a ese nuevo nivel, tu ingreso regresa al nivel de quien eres hoy. Para ganar más, tienes que volverte más.\n\n## El 1·3·5·7\nUna guía general (no una promesa) de cómo se ve el camino con trabajo constante:\n- **1 año** para volverte competente: sabes lo básico, cubres tus gastos y estás aprendiendo.\n- **3 años** de trabajo constante de medio tiempo para que pueda volverse tu actividad principal.\n- **5 años** para tener un ingreso alto y estable.\n- **7 años** para ser experta.\n\nCada persona va a su ritmo y nadie te puede garantizar cifras. Pero piénsalo así: en siete años vas a tener siete años más de todos modos. Mejor que sean siete años volviéndote experta.\n\n## Cómo se aprende esto\n- **No hay experiencias buenas ni malas, solo experiencias para aprender.** Quita una presión enorme. Ya no buscas que todo salga perfecto, buscas tener muchas experiencias.\n- **Copia a quien ya lo logró.** No reinventes nada. En tu equipo hay alguien que ya domina cada habilidad, y en este negocio a la gente le gusta compartir.\n- **Estudia.** Audios y podcasts en el coche, diez páginas de un libro al día (un libro al mes), videos de capacitación, eventos.\n- **Cuidado con las distracciones.** Hay mil técnicas nuevas cada semana. Primero domina las siete habilidades.\n- **Actúa.** Casi todo se aprende haciendo. Es muy difícil verte bien y mejorar al mismo tiempo, así que elige mejorar.\n- **Enseña.** Enseñar es la mejor forma de aprender. Aunque sea a una sola persona de tu equipo.\n\n## Planea, hazlo, revisa\n1. Elige una habilidad.\n2. **Planea** cómo la vas a practicar.\n3. **Hazlo.**\n4. **Revisa** qué salió y qué cambiarías.\n5. Haz un plan mejor y repite.\n\nLa mayoría solo hace, sin plan. Y casi nadie revisa. Este ciclo, repetido, te vuelve experta.\n\n## Tus cinco\nTe pareces a las cinco personas con las que más tiempo pasas: piensas, hablas y actúas como ellas. Tres cosas que puedes hacer: alejarte de lo que es tóxico, pasar menos tiempo con lo que te jala hacia abajo y buscar más a quienes te empujan a crecer. Un truco: cada cierto tiempo alguien de tus cinco cambia. Cuando pase, elige con intención quién ocupa ese lugar.\n\nY una cosa más que todas las líderes tienen en común: **trabajan mucho**. Disfrutan su estilo de vida, pero se lo trabajan. La libertad es posible, pero no es gratis.\n\n## ✍️ Escribe\nElige una habilidad para esta semana y escribe tu plan: qué vas a hacer, cuántas veces y cuándo vas a revisar.\n\n## ✅ Hoy\nEscribe los nombres de tus cinco. ¿A quién quieres sumar?\n\n@@ 13 | Para largo | Clase 13 · Vale la pena | La carrera, la libertad y la persona en la que te conviertes\nEste negocio tiene altibajos y es muy emocional. Pero al final, por muchas razones, vale la pena.\n\n## La carrera que construyes\nToda carrera tiene una barrera de entrada (lo que cuesta entrar) y un beneficio a largo plazo (lo que obtienes). Ser doctora exige años de estudio, dinero y contactos. En este negocio la barrera es muy baja y el beneficio puede ser muy alto. Pocas profesiones tienen esa proporción. La diferencia está en tratarlo como carrera y no como pasatiempo.\n\n## La libertad\nLibertad es poder elegir. Vivir la vida que tú quieres y no la que otros quieren para ti. Imagina: despertar cuando terminas de dormir, hacer un trabajo que te llena, con gente que te cae bien, sin tener que ceder siempre, con tiempo para los que quieres. Enfrentar tus miedos cuesta. Vivir a medias toda la vida cuesta más.\n\n## Las vidas que tocas\nUna cosa es cambiar tu vida y la de tu familia. Otra es ayudar a otra mujer a hacer lo mismo. Puedes darle esperanza a quien no la tiene y animarle un sueño. Es como tirar una piedra al agua: las ondas siguen creciendo aunque no las veas todas.\n\n## La gente que conoces\nAmigas en muchas ciudades, gente apasionada que se dedica a levantar a otras. Puede que este negocio te dé más amistades que cualquier otro trabajo que hayas tenido.\n\n## Los lugares y las causas\nViajes de incentivo, la visita a otra ciudad para apoyar a tu equipo, tiempo para viajar por tu cuenta. Y la posibilidad de ayudar a las causas que te importan de tres formas: con tu dinero, con tu tiempo y con tu influencia. Esa última es la más poderosa: inspira a tu equipo a hacer algo bueno contigo.\n\n## La persona en la que te conviertes\nAl final, este negocio es una escuela de crecimiento personal. Aprendes a enfrentar tus miedos, a resolver problemas, a cuidar lo que entra en tu mente, a hacerte fuerte y a liderar.\n\n> Lo mejor no es conseguir lo que quieres. Lo mejor es en quién te tienes que convertir para conseguirlo.\n\n## 🪞 Para pensar\nDe todo lo que vale la pena (carrera, libertad, vidas que tocas, amistades, lugares, causas, la persona en la que te conviertes), ¿qué es lo que más te mueve a ti?\n\n## ✍️ Escribe\nRegresa a tu calificación de la clase 3. Califícate otra vez del 1 al 10 en cada habilidad. Elige la que más quieres subir este mes.\n\n## 💬 Cuéntame\nEscribe tu decisión final, con fecha: \"Hoy, (fecha), decido ser profesional.\"\n\n@@ 14 | Herramienta | Guion de invitación | Los 8 pasos con frases para Farmasi\nTenlo a la mano antes de cada llamada. No lo leas palabra por palabra: entiende la idea y dilo a tu manera.\n\n## Los 8 pasos en una línea\nPrisa → cumplido → invitación → el trato → que ella ponga el día → confirma → agenda la llamada → despídete.\n\n## 1 · Ten prisa\n- \"Tengo mil cosas hoy, pero me urgía hablar contigo.\"\n- \"Voy de salida, pero necesitaba decirte algo rápido.\"\n- \"No es momento de contarte todo y ya me voy, pero…\"\n\n## 2 · Cumplido sincero\n- \"Siempre me has apoyado y te lo agradezco muchísimo.\"\n- \"Eres de las personas más organizadas que conozco.\"\n- \"Siempre te ves increíble, se nota que te cuidas.\"\n- \"Me atendiste súper bien. ¿A qué te dedicas además de esto?\"\n\n## 3 · La invitación\n**De frente** (te conoce o sabes que busca algo):\n- \"¿Te acuerdas que me dijiste que querías un ingreso extra? ¿Era en serio? Creo que encontré algo para ti.\"\n- \"Cuando pensé en alguien a quien le podría ir muy bien con esto, pensé en ti.\"\n- \"¿Piensas hacer lo mismo que haces hoy el resto de tu vida?\"\n\n**Pide consejo** (familia, amigas cercanas):\n- \"Empecé un negocio y estoy nerviosa. ¿Me dejas practicar contigo?\"\n- \"Tú sabes mucho de esto. ¿Me ayudas a ver si tomé una buena decisión?\"\n- \"Empecé con una marca de maquillaje y skincare y quiero tu opinión honesta de los productos.\"\n\n**¿A quién conoces?** (personas ocupadas o exitosas):\n- \"Seguro esto no es para ti, pero ¿conoces a alguien con ganas de tener un ingreso extra desde su casa?\"\n- \"Estoy buscando mujeres con ganas de crecer. ¿Conoces a alguien así?\"\n- Si pide más información: \"Claro, tiene sentido que quieras saber más antes de recomendar a alguien.\"\n\n## 4 · El trato\n- \"Si te mando un video de 15 minutos, ¿lo ves?\"\n- \"Si te llevo el catálogo, ¿lo revisas?\"\n- \"Si te dejo una muestra, ¿la pruebas?\"\n- \"Si te invito a un Zoom corto, ¿te conectas?\"\n- Si pide más: \"Todo lo que preguntas viene ahí. Si te lo mando, ¿lo ves?\"\n- Si dice que no: \"Gracias por tu tiempo.\" Y no mandas nada.\n\n## 5 · Que ella ponga el día\n- \"¿Cuándo crees que lo puedas ver, seguro?\" (y te callas)\n- Si es vago: \"No quiero quitarte tiempo. ¿Ponemos un día en que seguro ya lo viste?\"\n\n## 6 · Confirma\n- \"Entonces si te marco el (día siguiente), ya lo viste seguro, ¿verdad?\"\n\n## 7 · Agenda\n- \"¿A qué número y a qué hora te marco?\"\n- Anótalo en tu agenda en ese momento.\n\n## 8 · Despídete\n- \"¡Perfecto, hablamos el viernes! Me voy corriendo, gracias.\"\n\n## Cuando le marques\n- No lo vio: \"No te preocupes. ¿Cuándo lo puedes ver, seguro seguro?\"\n- Sí lo vio: \"¿Qué fue lo que más te gustó?\" → \"Del 1 al 10, ¿dónde estás?\" → \"¿Qué te ayudaría a subir ese número?\" → agenda el siguiente contacto.\n\n@@ 15 | Herramienta | Respuestas a las dudas | Te entiendo, me pasó, descubrí\nLa fórmula para casi todo: **\"Te entiendo. A mí me pasó igual. Y esto fue lo que descubrí.\"** Si no tienes historia propia, usa la de otra socia: \"Tengo una amiga a la que le pasaba lo mismo…\". Luego haz una pregunta.\n\n## \"No tengo dinero\"\n\"Te entiendo, yo tampoco me sentía con dinero para empezar algo. Pero pensé: si hoy no me alcanza, ¿cómo va a cambiar si sigo haciendo lo mismo? Si de verdad sintieras que esto es una oportunidad para ti, ¿crees que encontrarías la forma?\" Nunca la empujes a endeudarse: busquen juntas la opción de inicio que le quede.\n\n## \"No tengo tiempo\"\n\"A mí me pasaba igual. Descubrí que se puede empezar con pocas horas a la semana, en los ratos que ya tengo. ¿Cuántas horas crees que sí podrías?\"\n\n## \"No soy vendedora\"\n\"Yo tampoco. Descubrí que no se trata de vender, sino de recomendar lo que ya uso y de invitar a que lo conozcan. El video y el catálogo hacen casi todo.\"\n\n## \"No conozco a nadie\"\n\"Pensaba lo mismo hasta que hice mi lista y salieron más de cien nombres. Además, cada día conoces gente nueva. Te enseño a hacer la tuya.\"\n\n## \"Estoy muy grande / muy chica / no tengo experiencia\"\n\"En este negocio no importa tu edad ni tu experiencia. El plan es igual para todas. Lo que importa es aprender las habilidades, y eso se aprende.\"\n\n## \"¿Es una pirámide?\"\nSi lo dice con emoción: \"Parece que te pasó algo. ¿Qué pasó?\" Escucha. Luego: \"¿Crees que en ese momento le diste una oportunidad justa?\"\nY explica con calma: \"Las pirámides son ilegales y viven de inscribir gente sin producto real. Esto es venta directa: la ganancia viene de productos que clientas reales compran y usan. Yo nunca estaría en algo ilegal.\"\n\n## \"No me interesan esas cosas de multinivel\"\n\"Sí, esto es venta directa. ¿Qué sabes de ella?\" Y escucha. Con preguntas, no con discursos.\n\n## \"No quiero molestar a mis amigas\"\n\"¿Qué te hace pensar que las molestarías? Si de verdad te encantara un producto, ¿se lo recomendarías? Te enseño a compartirlo sin que suene a venta.\"\n\n## \"¿Y tú cuánto ganas?\"\n- Si ya tienes resultados, compártelos con honestidad.\n- Si apenas empiezas: \"Apenas estoy arrancando y estoy muy emocionada con lo que viene.\"\n- Si llevas tiempo a medio tiempo: \"Lo hago a medio tiempo y voy creciendo. Me emociona porque sabía que si no hacía algo distinto, nada iba a cambiar.\"\n- Ofrece conectarla con alguien que tenga más resultados para que platique con ella.\n\n## Lo que nunca\n- Nunca prometas ingresos ni digas cifras que no puedas sostener.\n- Nunca hagas sentir tonta a la otra persona.\n- Nunca discutas para ganar.\n\n@@ 16 | Herramienta | La plática de arranque | Lista para tus nuevas\nÚsala con cada persona nueva, en las primeras 48 horas. Toma unos 45 minutos.\n\n## 1 · Celebra (5 min)\n- \"¡Felicidades por tu decisión! Estoy orgullosa de ti.\"\n- Pregúntale por qué entró y escríbelo. Lo vas a necesitar en sus días malos.\n\n## 2 · Expectativas (5 min)\n- \"Tu éxito depende de ti. Yo te guío, pero no lo hago por ti. Trabajo contigo, no para ti.\"\n- \"Mi meta es que dejes de necesitarme pronto. ¿Te parece?\"\n- \"Cuando estés en un día malo, ¿quieres que te deje en paz o que te recuerde por qué empezaste?\" Anota su respuesta.\n\n## 3 · Lista de arranque (20 min)\n- Tiene sus productos y los está usando.\n- Tiene muestras o testers para compartir.\n- Tiene el video de la oportunidad, el catálogo y su link.\n- Está en el grupo del equipo y en la app.\n- Conoce las fechas de las próximas juntas y del próximo evento grande.\n- Entiende lo básico del plan de ganancias (los primeros niveles).\n- Conoce los 8 pasos de la invitación (dale el guion).\n\n## 4 · Plan de la primera semana (10 min)\n- ¿Quién podría ser su primera clienta?\n- ¿Quién podría ser su primera socia?\n- ¿A qué junta o evento va a ir?\n- ¿Qué necesita para tener su primera ganancia?\n\n## 5 · Tareas con fecha (5 min)\n- Lista de 100 nombres para: ______\n- Tres invitaciones con los 8 pasos para: ______\n- Próxima llamada contigo: ______\n\n## Para cruzar la raya\nCelebra en voz alta: su primera clienta, su primera socia, su primera ganancia, su primer evento, cuando sube de nivel. Cada logro la empuja al lado donde es más fácil seguir que renunciar.\n\n@@ 17 | Herramienta | Tu semana pro | Rutina y planea-hazlo-revisa\nUna semana sencilla que, repetida, te vuelve profesional. Ajusta los números a tus horas reales.\n\n## Todos los días\n- Agrega 2 nombres a tu lista viva.\n- Haz al menos 1 invitación con los 8 pasos.\n- Cumple todos los seguimientos agendados.\n- 10 páginas de un libro o 20 minutos de un audio de crecimiento.\n- Usa tus productos. Eres tu primera clienta.\n\n## Cada semana\n- Junta los contactos de cada prospecto: que vea, pruebe y platique en la misma semana.\n- Ve a una junta de tu equipo (presencial o en línea).\n- Cuenta tu historia al menos una vez.\n- Si tienes nuevas, revisa sus tareas y celebra sus logros.\n- Habla del próximo evento grande con tu equipo.\n\n## Tu planea, hazlo, revisa\n**Habilidad de la semana:** ______\n\n**Planea:** ¿Qué voy a hacer, cuántas veces y cuándo?\n\n**Hazlo:** Marca cada vez que lo practiques: ☐ ☐ ☐ ☐ ☐\n\n**Revisa (domingo):**\n- ¿Qué salió bien?\n- ¿Qué cambiaría?\n- ¿Cuál es mi plan mejorado para la próxima semana?\n\n## Tus números de la semana\n- Nombres nuevos en la lista: ___\n- Invitaciones: ___\n- Herramientas vistas (videos, catálogos, muestras): ___\n- Seguimientos cumplidos: ___\n- Clientas nuevas: ___\n- Socias nuevas: ___\n\nNo hay semanas buenas ni malas. Hay semanas para aprender.";
var FAQ_MD="## Empezar | 0\n\n### ¿Necesito conocer a mucha gente para que me vaya bien?\nNo. Encontrar gente es una habilidad, no una cuestión de suerte. Haces una lista completa (salen cientos de nombres), piensas en a quién conocen ellas y agregas dos personas nuevas al día. En un año son más de 600.\n\n### ¿Tengo que ser buena vendedora?\nNo. Tu trabajo no es convencer a nadie, es invitar a que conozca lo que ofreces y dejar que la herramienta (el video, el catálogo, una muestra) haga la mayor parte. Lo que sí necesitas es practicar las siete habilidades.\n\n### ¿En cuánto tiempo voy a ver resultados?\nDepende de tus horas, tu constancia y tus ventas a clientas reales. Como guía general, el primer año es para volverte competente y cubrir tus gastos. Nadie te puede garantizar cifras, y desconfía de quien lo haga.\n\n### ¿En qué orden tomo las clases?\nEmpieza por las tres clases de \"Decide\", porque cambian la forma en que ves tu negocio. Luego ve una habilidad por semana. Las herramientas úsalas cuando ya estés practicando.\n\n## Decidir ser pro | 2\n\n### ¿Qué significa ser \"pro\" si apenas empiezo?\nSignifica tomar una decisión: dejar de esperar suerte y enfocarte en aprender las habilidades. Puedes ser nueva y ya trabajar como profesional.\n\n### Mi líder casi no me ayuda. ¿Qué hago?\nÚsala como recurso, nunca como excusa. Si puede ayudarte, qué bien. Si no, tu negocio sigue siendo tuyo. Busca también a otras líderes del equipo que ya dominen la habilidad que necesitas y aprende de ellas.\n\n### Mi familia piensa que esto no funciona. ¿Cómo lo manejo?\nEs normal. Muchas personas lo intentaron sin preparación y concluyeron que no sirve. No lo tomes personal ni pelees. Con el tiempo, tus resultados hablan.\n\n## Invitar | 6\n\n### ¿Puedo invitar por WhatsApp?\nLa herramienta sí, el video o el catálogo se pueden mandar por WhatsApp. Pero la invitación hazla en vivo, en llamada o en persona. Un mensaje copiado y pegado casi nunca funciona.\n\n### ¿Qué le mando primero, el video o la invito a un evento?\nPara empezar, casi siempre funciona mejor una herramienta, porque la persona la ve en su tiempo. Después del video, la invitas a la junta o al evento.\n\n### Me da pena hablarle a mis amigas. ¿Por dónde empiezo?\nCon la forma \"pide consejo\": \"Empecé un negocio y estoy nerviosa, ¿me dejas practicar contigo?\". Es honesta, no presiona y a la gente le gusta ayudar.\n\n### ¿Por qué tengo que fingir que tengo prisa?\nNo es fingir, es respetar su tiempo y el tuyo. Una plática corta tiene menos preguntas y menos resistencia. Lo importante es que la persona vea la herramienta, no que tú expliques todo.\n\n### ¿Qué hago si me dice que no?\nLe das las gracias y sigues. Revisa qué podrías mejorar en los primeros pasos y no la saques de tu lista: la vida cambia y puede ser un sí más adelante.\n\n## Presentar y seguimiento | 8\n\n### No sé contestar todas las preguntas. ¿Está mal?\nAl contrario. No tienes que ser la experta. Guía a la persona a la respuesta: la presentación, tu líder, otra socia. Así tu forma de trabajar se puede copiar.\n\n### ¿Qué le pregunto cuando ya vio el video?\n\"¿Qué fue lo que más te gustó?\" y luego \"del 1 al 10, ¿dónde estás?\". Evita \"¿qué te pareció?\", porque invita a buscar peros.\n\n### ¿Cuántas veces le doy seguimiento antes de rendirme?\nEn promedio una persona necesita de cuatro a seis contactos. Algunas tardan más. Mientras siga abierta, agenda el siguiente contacto. Y trata de juntar los contactos en pocos días.\n\n### Me preguntaron si es una pirámide. ¿Qué digo?\nSi lo dice con emoción, pregúntale qué le pasó y escúchala. Luego explica con calma: las pirámides son ilegales y viven de inscribir gente; la venta directa vive de productos que clientas reales compran. Tienes respuestas listas en la herramienta de dudas.\n\n## Decidir y arrancar | 10\n\n### ¿Cómo le pregunto por dinero sin que se sienta incómodo?\nCon las cuatro preguntas del sí: cuánto quiere ganar, cuántas horas puede dedicar, por cuántos meses y si estaría lista si le enseñas cómo. Ella pone los números. Si son irreales, se lo dices con honestidad.\n\n### Acaba de entrar alguien a mi equipo. ¿Qué hago primero?\nAgenda la plática de arranque en las primeras 48 horas: celebra, pon expectativas, revisa la lista de arranque, arma su primera semana y deja tareas con fecha.\n\n### Mi nueva no hace nada. ¿Qué hago?\nRevisa si tuvo su plática de arranque y si ya cruzó la raya (primera clienta, primera ganancia, primer evento). Y usa lo que te dijo en la plática: si te pidió que le recordaras por qué empezó, hazlo.\n\n## Eventos | 11\n\n### No tengo dinero para el evento. ¿Igual tengo que ir?\nLos eventos importan mucho, pero nunca te endeudes para ir. Planea desde que se anuncia: ahorra un poco cada semana, comparte cuarto y coche, lleva comida. Si aun así no se puede, se respeta.\n\n### ¿Cómo animo a mi equipo a ir?\nPromueve, no solo anuncies. Habla seguido del evento, cuenta historias de lo que viviste en el anterior, escucha los \"no puedo\" y busquen soluciones juntas. Lleva la cuenta de cuántas van.\n\n## Largo plazo | 12\n\n### ¿Qué hago cuando me desanimo?\nRecuerda que no hay experiencias buenas ni malas, solo experiencias para aprender. Revisa tu porqué, platica con tu líder, ve al siguiente evento y elige una sola habilidad para practicar esta semana.\n\n### ¿Esto sustituye mi trabajo?\nAl principio casi siempre es de medio tiempo. Con años de trabajo constante puede volverse tu actividad principal, pero no hay garantía. No dejes tu trabajo por una expectativa: hazlo cuando tus números lo sostengan.";
