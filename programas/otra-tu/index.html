<script>
var LESSONS_MD="@@ 0 | Empieza aquí | Bienvenida a Otra tú | El curso en 5 minutos\nEste curso es para cuando sientes que siempre terminas en el mismo lugar: la misma preocupación, la misma reacción, el mismo pleito contigo. Aquí aprendes a dejar de ser la de siempre, un hábito a la vez.\n\n## De qué se trata\nLa idea central es sencilla y un poco incómoda: **tu personalidad es un hábito**. La forma en que piensas, lo que sientes y cómo actúas se repite tanto que ya corre sola. Y como tu vida es el reflejo de esa personalidad, mientras sigas siendo la misma persona vas a seguir viviendo la misma vida.\n\nLa buena noticia es que un hábito se puede desaprender. No a fuerza de voluntad un lunes cualquiera, sino con un método: entender qué te tiene atorada y practicar todos los días un rato a solas para quitarle fuerza a la versión vieja y ensayar la nueva.\n\n> No vienes a convertirte en otra persona. Vienes a dejar de cargar lo que no eres.\n\n## Cómo está armado\n- **Entiende (clases 1 a 6).** Seis clases cortas para entender por qué cuesta tanto cambiar: el ciclo pensar y sentir, las tres cosas que te jalan al pasado, por qué el cuerpo se engancha a ciertas emociones, la brecha entre cómo te ven y cómo te sientes, y qué es meditar en realidad.\n- **Practica (clases 7 a 12).** Cuatro semanas de práctica diaria. Cada semana repites lo que ya aprendiste y le sumas uno o dos pasos. Son siete pasos en total. Al final, una clase para vivirlo fuera de la meditación.\n- **Herramientas.** El guion completo de la sesión, las listas para elegir tu emoción, la revisión de la noche y un calendario de cuatro semanas.\n\n## Lo que necesitas\n- Un cuaderno (o el cuaderno de cada clase, que se guarda en tu celular).\n- Un lugar tranquilo que no sea tu cama.\n- Entre 20 y 50 minutos al día, de preferencia al despertar.\n- Paciencia contigo. Los primeros días tu cuerpo va a querer pararse, revisar el celular o dormirse. Es normal.\n\n## Antes de empezar\nEl libro en el que se basa este curso explica el cambio con ideas de neurociencia y de física cuántica. Algunas de esas explicaciones son la interpretación del autor y no ciencia comprobada. Aquí nos quedamos con lo práctico: poner atención, repetir y ensayar a la persona que quieres ser.\n\nEste curso acompaña, pero **no sustituye terapia ni tratamiento médico**. Si estás pasando por depresión, ansiedad fuerte, un duelo o un trauma, busca también a una profesional.\n\n## 🪞 Para pensar\n¿Qué es lo que más se repite en tu vida y ya te cansó? No lo que te pasa, sino cómo reaccionas tú.\n\n## ✍️ Escribe\nEscribe en una frase por qué empiezas este curso. Por ejemplo: \"Estoy cansada de preocuparme por todo antes de que pase.\"\n\n@@ 1 | Entiende | Clase 1 · Tu personalidad crea tu realidad | El ciclo de pensar y sentir\nSi quieres una vida distinta, tienes que pensar, sentir y actuar distinto. Suena obvio, pero casi nadie lo hace.\n\n## Eres un ciclo\nCada pensamiento produce una sensación en el cuerpo. Esa sensación te hace pensar igual a como te sientes. Y ese pensamiento vuelve a producir la misma sensación. Pensar y sentir, sentir y pensar, una y otra vez.\n\nPor ejemplo: piensas \"no me va a alcanzar el dinero\". El cuerpo se tensa y sientes angustia. Con la angustia encima, buscas más pruebas de que no te va a alcanzar. Y la angustia crece. Al final del día no pasó nada nuevo, pero tú ya repasaste el mismo miedo cien veces.\n\n> Lo que piensas y sientes todos los días se convierte en quién eres.\n\n## La mayor parte va en automático\nPara cuando somos adultas, la mayor parte de lo que hacemos corre sola: las mismas rutinas, las mismas reacciones, las mismas conversaciones en la cabeza. Se calcula que la gran mayoría de los pensamientos de hoy son los mismos de ayer.\n\nEso no es malo. El piloto automático te deja manejar sin pensar en cada pedal. El problema es cuando el piloto automático también decide cómo te sientes contigo, con tu pareja o con tu negocio.\n\n## Personalidad y realidad\nTu personalidad es la mezcla de cómo piensas, cómo actúas y cómo te sientes. Y tu realidad personal (tus relaciones, tu dinero, tu salud, tu día a día) sale de esa personalidad.\n\nPor eso cambiar de ciudad, de trabajo o de pareja casi nunca alcanza. Si te llevas a la misma tú, al poco tiempo recreas la misma vida en otro lugar.\n\n> No puedes crear una vida nueva siendo la misma persona.\n\n## Qué cambia en este curso\nNo vamos a pelear con las circunstancias. Vamos a trabajar en lo único que sí controlas: la persona que eres cuando nadie te está viendo. Primero entendiendo el ciclo y después practicando todos los días para salir de él.\n\n## 🪞 Para pensar\n¿Cuál es el pensamiento que más repites en un día normal? ¿Cómo te hace sentir? ¿Y qué haces cuando te sientes así?\n\n## ✍️ Escribe\nDibuja tu ciclo en tres líneas: \"Pienso…\", \"Siento…\", \"Entonces hago…\". Usa algo real de esta semana.\n\n## ✅ Hoy\nPon una alarma a mediodía que diga \"¿Qué estoy pensando?\". Cuando suene, anota la respuesta sin juzgarla.\n\n@@ 2 | Entiende | Clase 2 · Los tres jalones | Tu entorno, tu cuerpo y el tiempo\nHay tres cosas que todo el día te regresan a la versión vieja de ti. Si las conoces, puedes ganarles.\n\n## Por qué siempre regresas\nTomas una decisión: \"a partir de hoy ya no me voy a enganchar\". Dura hasta que ves el mensaje de tu mamá, entras a la cocina o abres el celular. ¿Qué pasó? Que tu mente vive amarrada a tres cosas que te recuerdan quién has sido.\n\n## Jalón 1: tu entorno\nLas personas, los lugares, las cosas y las rutinas de tu vida están conectadas con recuerdos y emociones. Ver a cierta persona, pasar por cierto lugar o escuchar cierta canción enciende el mismo programa de siempre. Tu entorno te recuerda cada día quién se supone que eres.\n\n## Jalón 2: tu cuerpo\nDespués de años de sentir lo mismo, el cuerpo se acostumbra a esa emoción y la pide. Cuando intentas cambiar, el cuerpo protesta: \"esto no se siente normal\". Esa incomodidad no significa que vas mal; significa que estás saliendo de lo conocido. Lo vemos a fondo en la clase 3.\n\n## Jalón 3: el tiempo\nCasi siempre estás en el pasado (recordando lo que te dolió) o en el futuro (anticipando lo que te da miedo). Las dos cosas te tienen viviendo con las mismas emociones de siempre. El presente es el único lugar donde puedes hacer algo distinto.\n\n> Para cambiar tienes que ser más grande que tu entorno, más grande que tu cuerpo y más grande que el tiempo.\n\n## Los momentos en que ya lo lograste\nSeguro te ha pasado: estabas tan metida en algo (pintar, bailar, una plática buenísima) que se te olvidó el celular, no sentiste hambre y no supiste qué hora era. En ese momento te olvidaste de tu entorno, de tu cuerpo y del tiempo. Eso es exactamente lo que vamos a entrenar en la meditación.\n\n## 🪞 Para pensar\n¿Qué persona, lugar o cosa te regresa más rápido a la versión que quieres dejar? ¿En qué parte del día pasas más tiempo en el pasado o en el futuro?\n\n## ✍️ Escribe\nHaz tres listas cortas: \"Lo que me jala de mi entorno\", \"Lo que me pide mi cuerpo\" y \"A dónde se va mi mente en el tiempo\".\n\n## ✅ Hoy\nElige un momento del día para estar diez minutos sin celular y sin hacer nada más que lo que estás haciendo. Nota qué tan rápido quieres escapar.\n\n@@ 3 | Entiende | Clase 3 · Adicta a sentirte así | Cómo el cuerpo se engancha a una emoción\nTe puedes volver adicta a la culpa, al enojo o a la preocupación igual que a cualquier otra cosa. Y no por débil: por química.\n\n## El cuerpo también aprende\nUna emoción es la huella química que deja una experiencia. Cuando algo te pasa, el cerebro manda señales y el cuerpo se llena de sustancias que te hacen sentir de cierta forma. Si esa emoción se repite muchas veces, el cuerpo se acostumbra a ella y la empieza a necesitar.\n\nLlega un punto en que **el cuerpo se vuelve la mente**: ya no piensas y luego sientes, sino que el cuerpo siente primero y te empuja a pensar lo que confirma esa emoción. Por eso a veces te despiertas preocupada sin saber de qué. El cuerpo ya estaba en modo preocupación y la mente sale a buscarle motivo.\n\n## De un momento a tu personalidad\nAsí se forma una personalidad, paso a paso:\n- Te pasa algo y reaccionas con una emoción.\n- Si te quedas en esa emoción horas o días, se vuelve un estado de ánimo.\n- Si ese estado de ánimo dura semanas o meses, se vuelve tu temperamento.\n- Si dura años, se vuelve tu personalidad. \"Es que yo así soy.\"\n\n> Lo que llamas \"mi forma de ser\" muchas veces es una emoción vieja que se quedó a vivir.\n\n## Modo supervivencia y modo creación\nCuando sientes miedo, enojo o urgencia, el cuerpo se pone en modo emergencia. Eso sirve para huir de un peligro real, pero si vives así todo el día gastas tu energía en defenderte. Pones toda tu atención afuera: en el problema, en la gente, en el reloj.\n\nEn modo creación pasa lo contrario. Estás tranquila, abierta y con energía para imaginar algo nuevo. No puedes crear una vida distinta mientras tu cuerpo cree que está en peligro.\n\n## Por qué buscas lo mismo\nSi tu cuerpo está acostumbrado a la culpa, inconscientemente vas a buscar situaciones que te hagan sentir culpable. Si está acostumbrado al drama, vas a encontrar drama. No es mala suerte: el cuerpo quiere su dosis de siempre.\n\n## 🪞 Para pensar\n¿Qué emoción sientes casi todos los días, aunque no pase nada especial? ¿Desde cuándo la traes?\n\n## ✍️ Escribe\nEscribe tu emoción de cajón y completa: \"Cuando la siento, en el cuerpo noto…\" y \"Para sentirla otra vez, sin querer yo…\".\n\n## ✅ Hoy\nCada vez que notes esa emoción, solo dite su nombre en voz baja: \"esto es preocupación\". Nombrarla ya te pone un paso afuera de ella.\n\n@@ 4 | Entiende | Clase 4 · La brecha | Cómo te ven y cómo te sientes\nHay una distancia entre la mujer que todos ven y la que se queda sola en la noche. A esa distancia le llamamos la brecha.\n\n## Dos versiones de ti\nImagina dos manos, una arriba de la otra. La de arriba es **cómo te ven**: la imagen que cuidas, la que dice \"todo bien, todo bajo control\". La de abajo es **cómo te sientes** cuando no hay nadie, ni ruido, ni pendientes: cansada, insegura, sola, con miedo.\n\nEntre las dos hay un espacio, y lo llenan las emociones que fuiste guardando con los años: la culpa, la vergüenza, el miedo a no ser suficiente, el enojo que nunca dijiste.\n\n## Mantener la imagen cuesta\nSostener esa imagen gasta muchísima energía. Necesitas que el entorno te la recuerde todo el tiempo: el trabajo, los logros, la gente, las cosas. Por eso cuando se apaga todo y te quedas quieta aparece un vacío. Y para no sentirlo, vuelves a llenarte de cosas de afuera: compras, comida, redes, trabajo, pleitos.\n\n> Lo que sientes cuando te quedas quieta un buen rato es lo que de verdad traes adentro.\n\n## Cuando la vida rompe la imagen\nA veces la brecha se cierra a la fuerza: una crisis, una enfermedad, una pérdida. De pronto ya no puedes sostener la imagen y te toca ver lo que había abajo. Este curso propone hacerlo antes y por gusto, no por dolor.\n\n## Cerrar la brecha\nCerrar la brecha es lograr que como te ven sea como eres. No a base de fingir mejor, sino soltando las emociones que la llenan. Cuando ya no tienes que esconder nada, recuperas toda esa energía y la puedes usar para crear.\n\n## 🪞 Para pensar\nSi alguien te viera solo en redes o en el trabajo, ¿cómo te describiría? ¿Y cómo te describirías tú a las once de la noche?\n\n## ✍️ Escribe\nDivide una hoja en dos. Arriba: \"Así me ven\". Abajo: \"Así me siento cuando nadie me ve\". Escribe tres cosas en cada lado.\n\n## ✅ Hoy\nSiéntate diez minutos sin hacer nada y sin celular. No intentes sentirte bien. Solo nota qué aparece.\n\n@@ 5 | Entiende | Clase 5 · Pensar, hacer, ser | Cómo algo nuevo se vuelve parte de ti\nAsí aprende tu cerebro cualquier cosa: primero lo piensas, luego lo haces y al final ya lo eres.\n\n## Tres niveles\n- **Pensar.** Aprendes algo nuevo: lees, escuchas, entiendes. Es conocimiento, y se queda en la cabeza.\n- **Hacer.** Lo pones en práctica. Ahora tienes una experiencia, y la experiencia trae una emoción. Esa emoción le enseña al cuerpo lo que la mente entendió.\n- **Ser.** Lo repites tantas veces que ya no lo piensas. Lo haces natural, como manejar o amarrarte las agujetas. Ya es parte de quién eres.\n\nCambiar tu personalidad funciona igual. Saber que te enganchas no basta. Tienes que practicar a la nueva tú hasta que te salga sin pensar.\n\n## Se puede ensayar en la mente\nHay estudios en los que un grupo practicó ejercicios de piano en el teclado y otro solo los imaginó, sin tocar una tecla. Después de unos días, el cerebro de los dos grupos cambió de forma muy parecida. Ensayar con la mente, con atención y repetición, deja huella.\n\nEso es lo que harás en la semana 4: ensayar en tu mente cómo piensa, cómo actúa y cómo se siente la nueva tú, antes de que la vida te lo pida.\n\n> Tu cerebro no distingue tan bien entre lo que vives y lo que ensayas con todo tu ser.\n\n## Los ingredientes\nPara que algo nuevo se grabe necesitas cuatro cosas: aprender (este curso), instrucciones claras (los siete pasos), atención (estar presente mientras lo haces) y repetición (todos los días). Si falta una, no se queda.\n\n## 🪞 Para pensar\nPiensa en algo que antes te costaba y ahora haces sin pensar. ¿Cuántas veces lo repetiste antes de que saliera solo?\n\n## ✍️ Escribe\nEscribe una cualidad que quieres que sea parte de ti (por ejemplo, calma). Luego responde: ¿cómo la pienso?, ¿cómo la practico?, ¿cómo sabré que ya la soy?\n\n@@ 6 | Entiende | Clase 6 · Meditar es volverte conocida | Qué es meditar y cómo prepararte\nMeditar no es dejar la mente en blanco. Es conocerte tan bien que ya no te agarres desprevenida.\n\n## Qué es meditar aquí\nEn este curso, meditar es sentarte a solas para **observarte y volverte familiar contigo**: tus pensamientos de siempre, tus emociones de siempre, tus reacciones de siempre. Lo que conoces bien deja de manejarte.\n\nTambién es la forma de salir un rato de los tres jalones: cierras los ojos (adiós entorno), dejas el cuerpo quieto (adiós cuerpo) y te quedas en el presente (adiós tiempo).\n\n## El ritmo de tu mente\nEl cerebro trabaja a distintas velocidades:\n- **Beta:** despierta, pensando, resolviendo. Si es muy alta, es estrés: mil pestañas abiertas.\n- **Alfa:** relajada pero atenta, como cuando sueñas despierta. Aquí la mente se calma y es más fácil entrar a tus programas automáticos.\n- **Theta:** el estado entre dormida y despierta. Muy profundo.\n\nLa meta de cada sesión es bajar de beta a alfa sin dormirte. Por eso la primera parte de cada sesión (semana 1) es solo para eso.\n\n> Primero bajas el volumen. Después cambias la canción.\n\n## Prepara tu lugar\n- **No en tu cama.** Tu cuerpo asocia la cama con dormir y te va a ganar el sueño. Busca otro rincón y que siempre sea el mismo.\n- **Sin distracciones.** Celular en modo avión y en otro cuarto. Avisa en casa que no te interrumpan.\n- **Música opcional.** Si te ayuda, que sea suave y sin letra.\n\n## Prepara tu cuerpo\n- Siéntate derecha, en una silla, con los pies en el piso y las manos sobre las piernas. Evita el sillón reclinable.\n- Ve al baño, toma agua, ponte ropa cómoda. Que nada te saque.\n- Si cabeceas, es buena señal: estás bajando. Con la práctica tu cuerpo aprende a estar relajado sin dormirse.\n\n## Prepara tu horario\n- Lo ideal es al despertar o antes de dormir, cuando la mente ya está más lenta.\n- La primera semana son unos 20 minutos. Cada semana se suma un poco. Al final, una sesión completa dura entre 40 y 50 minutos.\n- Si tienes hora de salida, pon una alarma diez minutos antes para cerrar con calma. Si en la sesión estás pensando en la hora, el tiempo te ganó.\n\n## Prepara tu actitud\nHabrá días en que la mente no se calla y el cuerpo quiere pararse. Ese es el yo viejo peleando por el control. No lo regañes. Regrésalo con cariño al presente, una y otra vez. Cada vez que lo haces, lo estás entrenando.\n\n## ✅ Antes de la clase 7\n- Elige tu lugar y pruébalo una vez.\n- Elige tu hora y ponla en el calendario por cuatro semanas.\n- Ten listo tu cuaderno.\n\n## ✍️ Escribe\n¿Dónde vas a meditar, a qué hora y qué vas a hacer con el celular? Escríbelo como compromiso.\n\n@@ 7 | Semana 1 | Clase 7 · Abre la puerta | Paso 1: bajar el ritmo\nToda la semana practicas solo una cosa: entrar en calma. Este paso abre todas tus sesiones de aquí en adelante.\n\n## Por qué empezar con el cuerpo\nSuena raro: queremos dejar de estar pendientes del cuerpo y empezamos poniéndole atención. La razón es que, cuando sientes el cuerpo en lugar de pensarlo, la mente analítica se calla. Pasas de pensar a sentir, y ahí la mente baja de beta a alfa.\n\nEl truco no es sentir el cuerpo en sí, sino **el espacio que ocupa**. Cuando pones atención al espacio, tu foco se abre, deja de estar apretado en un problema y se vuelve amplio. Esa atención amplia es la que calma.\n\n## Opción 1: recorrido por el espacio del cuerpo\n1. Siéntate derecha y cierra los ojos. Respira lento por la nariz y suelta por la boca unas cuantas veces.\n2. Pon atención al espacio que ocupa tu cabeza, empezando por arriba. ¿Puedes sentir su volumen, su peso?\n3. Baja despacio: la frente, los ojos, la nariz, los labios, la quijada, las orejas. Quédate unos 20 o 30 segundos en cada parte.\n4. Sigue con el cuello, el pecho, los hombros, los brazos, las manos, el abdomen, la espalda, la cadera, las piernas, los pies.\n5. Ahora siente todo tu cuerpo a la vez, como un solo volumen en el espacio.\n6. Luego siente el espacio que rodea tu cuerpo, como una burbuja alrededor de ti.\n7. Al final, siente el espacio de todo el cuarto.\n\n## Opción 2: el agua que sube\nImagina que agua tibia empieza a llenar el cuarto. Primero cubre tus pies, luego tus tobillos, tus rodillas, tus piernas, tu cadera. Sube por tu abdomen, tu pecho, tus brazos, tu cuello. Pasa por tu boca, tu nariz, tus ojos y cubre tu cabeza hasta llenar todo el cuarto. Siente tu cuerpo flotando en ese espacio.\n\nSi no te gusta la idea del agua, usa la opción 1. Puedes alternarlas.\n\n> Tu única tarea esta semana es quedarte presente.\n\n## Cuánto tiempo\nUnos 20 minutos. Ve despacio. Es mejor quedarte más tiempo en cada parte que llegar rápido a los pies.\n\n## Cómo saber que va bien\n- Se te olvida un rato dónde estás o qué hora es.\n- La respiración se hace lenta sola.\n- Cabeceas un poco.\n- Te cuesta un poco \"regresar\" cuando abres los ojos.\n\nSi nada de eso pasa la primera semana, no importa. Estás construyendo el camino.\n\n## 🪞 Para pensar\n¿Qué tan seguido se fue tu mente a otro lado? ¿A dónde se iba: al pasado, al futuro o al cuerpo?\n\n## ✅ Esta semana\n- Practica el paso 1 todos los días, unos 20 minutos.\n- Si quieres, graba tú misma el guion de la herramienta \"La sesión completa\" y escúchalo.\n- Repite esta semana si todavía te cuesta. No hay prisa.\n\n## ✍️ Escribe\nAl terminar cada sesión, anota en una línea cómo te fue y cuánto tiempo sentiste que pasó.\n\n@@ 8 | Semana 2 | Clase 8 · Reconoce y dilo | Pasos 2 y 3: nombrar, admitir y declarar\nEsta semana empiezas a podar. Primero ves con claridad qué parte de ti quieres soltar y luego la dices con todas sus letras.\n\n## Paso 2: reconocer\nPara cambiar algo, primero tienes que verlo y ponerle nombre. Imagina que pudieras ver tu vida como una película, con todo lo que piensas, dices y haces. Este paso es hacer esa revisión todos los días, mientras todavía puedes cambiar el final.\n\nCuando te observas, ya no eres solo la emoción: eres también la que la está viendo. Ese pequeño paso hacia afuera es el inicio del cambio.\n\n### Tu revisión\nAntes de meditar, responde en tu cuaderno:\n- ¿Qué tipo de persona he sido?\n- ¿Qué muestro al mundo y qué siento por dentro?\n- ¿Qué emoción siento una y otra vez, casi todos los días?\n- ¿Cómo me describirían las personas más cercanas?\n- ¿Qué escondo de los demás?\n- ¿Qué es lo único que más quiero cambiar de mí?\n\n### Elige una sola emoción\nDe todo lo que salió, elige **una** emoción para desaprender. Solo una. Las emociones están conectadas: cuando una baja, las demás bajan con ella. Si eliges el enojo, también vas a sentir menos frustración, juicio y envidia. Abre la herramienta \"Listas para elegir\" si necesitas ideas.\n\n### Siéntela en el cuerpo\nCierra los ojos y recuerda esa emoción. ¿Dónde la sientes? ¿Calor, nudo, pecho apretado, cansancio? No huyas. Casi todo lo que haces en la vida es para no sentir esto. Esta vez quédate con ella y obsérvala como energía en tu cuerpo.\n\n### Mira cómo piensas cuando la sientes\nPregúntate: \"¿Cómo pienso cuando me siento así?\". Con miedo, quizá te vuelves controladora o te abrumas. Con culpa, quizá te vuelves complaciente. Escribe uno o dos de esos estados de mente. Los vas a usar en los siguientes pasos.\n\n## Paso 3: admitir y declarar\n### Admitir, hacia adentro\nAhora le cuentas a algo más grande que tú quién has sido. Llámalo como te haga sentido: Dios, el universo, la vida, tu sabiduría interna. Lo importante es que es una inteligencia que **no te juzga, no te castiga y no te deja de querer**. Puedes decirle la verdad sin miedo.\n\nEjemplos de lo que podrías admitir:\n- \"Finjo que estoy bien, pero me siento muy sola.\"\n- \"Digo que sí a todo para que me quieran, porque siento que no valgo.\"\n- \"Llevo años sintiéndome fracasada, por eso me exijo tanto.\"\n\n### Declarar, en voz alta\nLuego dices en voz alta, bajito, la emoción que vas a soltar. Por ejemplo: \"He sido una persona enojada toda mi vida\", o simplemente \"enojo\". Es el paso que más cuesta, porque nadie quiere que se sepa lo que esconde. El cuerpo se va a resistir. Hazlo de todos modos.\n\nAl decirlo dejas de gastar energía en esconderlo, y esa energía queda libre para lo que viene.\n\n> Lo que nombras deja de manejarte en secreto.\n\n## ✍️ Escribe\n- La emoción que elegiste.\n- Dónde la sientes en el cuerpo.\n- Uno o dos estados de mente que trae.\n- Lo que quieres admitir, en dos o tres frases.\n\n## ✅ Esta semana\nTodavía no medites con esto. Termina de leer la clase 9 y empieza la semana 2 con los cuatro pasos juntos.\n\n@@ 9 | Semana 2 | Clase 9 · Suéltalo | Paso 4: entregar lo que ya no quieres cargar\nYa viste qué te pesa y lo dijiste en voz alta. Ahora lo sueltas, sin negociar y sin decir cómo se tiene que resolver.\n\n## Por qué soltar\nLlevas años intentando arreglar esto con la misma mente que lo creó, y no ha funcionado. Este paso es pedir ayuda a algo más grande que tu forma de pensar de siempre. Desde ahí se ven salidas que tú todavía no imaginas.\n\n## Lo que no necesitas hacer\nCuando sueltas de verdad, no tienes que:\n- Negociar ni prometer.\n- Rogar ni pedir perdón una y otra vez.\n- Sentir culpa o vergüenza.\n- Explicar cómo debería pasar.\n\nNo puedes soltar y al mismo tiempo querer controlar el resultado. Soltar es confiar en que se va a resolver de una forma que todavía no se te ocurre.\n\n## Cómo hacerlo\n1. Repasa lo que escribiste en la clase 8.\n2. Con los ojos cerrados, pide que esa parte de ti se transforme en algo mejor.\n3. Imagina que la entregas. Hay quien abre una puerta y la deja pasar, quien la escribe en una carta o quien la pone en una caja y la ve desaparecer. Lo que imagines está bien. Lo importante es la intención.\n4. **Da gracias** como si ya estuviera resuelto.\n\nUn ejemplo de lo que puedes decir: \"Te entrego mi preocupación y mi necesidad de controlar todo. Confío en que tú lo puedes acomodar mejor que yo. Abre los caminos que me toquen.\"\n\n> Agradecer antes de que pase es la señal de que ya lo diste por hecho.\n\n## Cómo se siente\nCuando sueltas bien, suele aparecer ligereza, alivio, alegría o gratitud. Si aparece la duda (\"¿y si no funciona?\"), es la mente vieja regresando. Vuelve al agradecimiento.\n\n## La sesión de la semana 2\nCada día:\n1. **Abre la puerta** (paso 1), unos 20 minutos.\n2. **Reconoce** la emoción y el estado de mente que trae.\n3. **Admite** por dentro quién has sido y **declara** en voz alta lo que sueltas.\n4. **Suelta** y da gracias.\n\nRepite hasta que los cuatro pasos se sientan como uno solo. Si necesitas más de una semana, tómala.\n\n## ✍️ Escribe\nEscribe tu propia frase para soltar, con tus palabras y para tu emoción.\n\n## ✅ Esta semana\nPractica los pasos 1 a 4 todos los días.\n\n@@ 10 | Semana 3 | Clase 10 · Obsérvate y di ¡cambio! | Pasos 5 y 6: conocer al yo viejo y cortarle el paso\nEsta semana te vuelves experta en la versión que quieres dejar, tan experta que la vas a ver venir antes de que llegue.\n\n## Paso 5: observar y recordar\n### Tus pensamientos automáticos\nCada emoción trae su propio repertorio de frases que te dices sin darte cuenta. Casi todo lo que haces empieza con un pensamiento, pero que lo pienses no quiere decir que sea cierto. Muchas veces es un eco del pasado.\n\nEjemplos:\n- \"Nunca me va a alcanzar.\"\n- \"Nadie me escucha.\"\n- \"Ella siempre me hace enojar.\"\n- \"Hoy ya es mal día, ni modo.\"\n- \"Así soy, igual que mi mamá.\"\n- \"Mejor empiezo el lunes.\"\n\n### Tus conductas automáticas\nTambién hay cosas que haces para volver a sentir esa emoción o para no sentirla un rato. Comer de más, comprar lo que no necesitas, quejarte con alguien, scrollear horas, buscar pleito, posponer, chismear, encerrarte, hablar del pasado.\n\n### Memoriza tu lista\nEscribe tus pensamientos y conductas automáticas y repásalas hasta sabértelas. En la meditación, obsérvate siendo esa persona y recuerda: **así ya no quiero ser**. La lista va a crecer y afinarse durante la semana. Está bien.\n\nCuando conoces tan bien tus programas, ya no se te pasan. Los ves desde que empiezan, y esa es tu libertad.\n\n## Paso 6: ¡cambio!\n### El juego del cambio\nEn la meditación, imagina situaciones donde normalmente caes en lo de siempre y di en voz alta **\"¡Cambio!\"**:\n1. Imagínate pensando y sintiendo en automático. Di \"¡Cambio!\".\n2. Imagina a la persona o la situación que más te engancha. Di \"¡Cambio!\".\n3. Imagina un momento en que tendrías un \"buen pretexto\" para portarte como siempre. Di \"¡Cambio!\".\n\n### En la vida real\nDurante el día, cada vez que te cachas en un pensamiento o conducta de la lista, di \"¡Cambio!\", en voz alta si se puede. Con el tiempo tu voz se vuelve la más fuerte de tu cabeza.\n\nPuedes agregar: \"Esto no es amoroso conmigo. Prefiero estar tranquila y libre que repetir lo mismo.\"\n\n> Cada vez que interrumpes el programa viejo, se debilita un poco.\n\n### Por qué funciona\nEs como la campana sin comida: si algo te detonaba siempre y dejas de responder igual, poco a poco deja de detonarte. La persona que te sacaba de quicio pierde ese poder porque tú ya no le das la reacción de siempre.\n\n## La sesión de la semana 3\n1. Abre la puerta.\n2. Reconoce.\n3. Admite y declara.\n4. Suelta.\n5. Obsérvate siendo el yo viejo y recuerda que ya no quieres ser así.\n6. Imagina dos o tres situaciones y di \"¡Cambio!\".\n\n## ✍️ Escribe\n- Tus pensamientos automáticos (mínimo cinco).\n- Tus conductas automáticas (mínimo cinco).\n- Tres situaciones de tu semana donde vas a usar \"¡Cambio!\".\n\n## ✅ Esta semana\nPractica los pasos 1 a 6 todos los días y usa \"¡Cambio!\" afuera de la meditación al menos tres veces al día.\n\n@@ 11 | Semana 4 | Clase 11 · Crea a la nueva tú | Paso 7: imaginar, ensayar y crear\nYa quitaste la hierba mala. Ahora siembras. Esta semana diseñas a la nueva tú y la ensayas hasta que se te haga natural.\n\n## Crear: diseña a la nueva tú\nPara construir una mente nueva necesitas hacerte preguntas nuevas, de esas que te obligan a imaginar. Responde con calma en tu cuaderno:\n\n### Quién quiero ser\n- ¿Cuál es la mejor versión de mí?\n- ¿A quién admiro y cómo se comporta?\n- ¿Cómo sería yo si fuera tranquila, segura, generosa…?\n- ¿Qué me diría a mí misma si ya fuera esa persona?\n\n### Cómo pienso\n- ¿Cuál es mi nueva actitud?\n- ¿Qué quiero creer de mí?\n- ¿En qué pensamientos voy a poner mi energía?\n\n### Cómo actúo\n- ¿Qué hace esta mujer en un día normal?\n- ¿Cómo habla con su familia, su equipo, sus clientas?\n- ¿Cómo responde cuando algo sale mal?\n\n### Cómo me siento\n- ¿Qué siente la nueva yo al despertar?\n- ¿Cómo es su energía?\n\n## Ensayar: memoriza a la nueva tú\nEn la meditación, después de soltar y decir \"¡Cambio!\", conviértete en la nueva tú. Piensa como ella, imagina cómo camina, cómo respira, cómo habla. Lo más importante: **siente lo que ella siente**. Alegría, gratitud, calma, amor, fuerza.\n\nLuego relájate unos segundos y hazlo otra vez. Y otra. Cada vez debe salir con menos esfuerzo. No sigas la lista igualita cada día; deja que sea creativo.\n\nSi en algún momento te aburres, es buena señal: se está volviendo familiar.\n\n> No te levantes de la silla siendo la misma persona que se sentó.\n\n## Crear tu nuevo futuro\nYa siendo la nueva tú, con esa energía alta, imagina lo que quieres que llegue a tu vida: una relación sana, un negocio que crece, salud, paz en tu casa. Ve cada imagen unos segundos con certeza y gratitud, como si ya fuera tuya, y suéltala. Luego la siguiente.\n\nNo intentes decidir cómo, cuándo ni con quién. Suelta los detalles.\n\n## Una advertencia honesta\nImaginar no reemplaza actuar. Ensayar la nueva tú te prepara para tomar decisiones distintas, pero el negocio crece con trabajo y la salud se cuida con médicos y hábitos. Esta práctica cambia a la persona que toma esas decisiones.\n\n## La sesión de la semana 4\n1. Abre la puerta.\n2. Reconoce.\n3. Admite y declara.\n4. Suelta.\n5. Obsérvate y recuerda.\n6. \"¡Cambio!\"\n7. Crea y ensaya a la nueva tú; imagina tu futuro con gratitud.\n\n## ✍️ Escribe\nEscribe a la nueva tú en presente, como si ya fuera real: cómo piensa, cómo actúa y cómo se siente. Mínimo diez líneas.\n\n## ✅ Esta semana\nPractica la sesión completa todos los días. Usa la herramienta \"La sesión completa\" como guía.\n\n@@ 12 | Semana 4 en adelante | Clase 12 · Vívelo todo el día | Que la nueva tú salga de la silla\nDe nada sirve ser la nueva tú 40 minutos y la de siempre las otras quince horas. Esta clase es para llevarlo a tu día.\n\n## Demostrar\nImagina que desayunas súper sano y luego te pasas el día comiendo papitas. Eso es meditar como la nueva tú y vivir como la vieja. La meditación es el ensayo; tu día es la función.\n\nDemostrar es actuar de acuerdo con lo que ensayaste: tomar las decisiones que ella tomaría, hablar como ella hablaría, reaccionar como ella reaccionaría. Que tu comportamiento vaya alineado con tu intención.\n\n## Pon recordatorios en tu día\nAntes de salir de la sesión, planea tus momentos:\n- \"En la regadera voy a dar gracias por tres cosas.\"\n- \"Camino a la oficina voy a ir contenta, no repasando pendientes.\"\n- \"Cuando vea a mi líder o a mi equipo, voy a ser la nueva yo.\"\n- \"A la hora de comer me tomo un minuto para recordar quién soy.\"\n- \"Cuando lleguen mis hijos, voy a estar presente.\"\n\n## La revisión de la noche\nAntes de dormir, hazte estas preguntas:\n- ¿Cómo me fue hoy?\n- ¿En qué momento me salí y por qué?\n- ¿Con quién reaccioné y dónde?\n- ¿Cuándo me fui en automático?\n- Si me vuelve a pasar, ¿cómo lo haría distinto?\n\nEsa última respuesta es oro: la ensayas en tu mente y la sumas a tu meditación del día siguiente.\n\n> Equivocarte no es fallar el curso. Notarlo es justo la práctica.\n\n## Las señales\nCuando vives con una energía distinta, empiezas a notar cosas: coincidencias, oportunidades, conversaciones que fluyen, ideas nuevas, menos pleitos. Anótalas. Te ayudan a ver que lo de adentro sí se refleja afuera y te motivan a seguir.\n\nOjo: no todo lo que pase será una señal y no todo lo malo es tu culpa. Úsalas como motivación, no como examen.\n\n## Cerrar la brecha\nCuando como te ven es como eres, ya no tienes nada que esconder ni que sostener. Esa es la verdadera ligereza, y de ahí sale una alegría que no depende de lo de afuera. Y cuando estás bien, te dan ganas de compartirlo con los demás.\n\n## Y después\nTrabaja con la misma emoción entre cuatro y seis semanas. Más o menos cada mes, revisa: ¿todavía siento esto?, ¿qué otra emoción se nota ahora? Cuando sientas que una bajó, elige la siguiente capa y repite el proceso.\n\n## ✍️ Escribe\nEscribe tu plan de mañana con tres recordatorios concretos y la hora de cada uno.\n\n## ✅ Todos los días\n- Sesión completa en la mañana.\n- Tres recordatorios durante el día.\n- Revisión de la noche.\n\n@@ 13 | Herramienta | La sesión completa | El guion de los siete pasos para leer o grabar\nÚsalo como guía mientras te aprendes la secuencia. Si lo grabas con tu voz, habla lento y deja pausas largas.\n\n## Antes de empezar\nLugar de siempre, celular lejos, espalda derecha, pies en el piso. Repasa lo que escribiste en tu cuaderno: tu emoción, tus pensamientos automáticos y a tu nueva yo.\n\n## 1. Abre la puerta (unos 20 minutos)\nCierra los ojos. Respira lento por la nariz y suelta por la boca, varias veces, hasta que llegues al presente.\n\nAhora pon tu atención en el espacio que ocupa tu cabeza… su volumen, su peso… Baja a tu frente… tus ojos… tu nariz… tus labios… tu quijada… tus orejas. Siente el espacio que ocupa tu cuello… tu pecho y tu espalda… tus hombros, tus brazos, tus manos… tu abdomen… tu cadera… tus piernas… tus pies.\n\nSiente todo tu cuerpo como un solo volumen en el espacio. Ahora siente el espacio que rodea tu cuerpo… Y ahora el espacio de todo el cuarto… Quédate ahí un momento.\n\n## 2. Reconoce\nTrae a tu mente la emoción que estás desaprendiendo. Nota dónde vive en tu cuerpo. No la corras. Obsérvala. Recuerda cómo piensas cuando te sientes así.\n\n## 3. Admite y declara\nPor dentro, dile a esa inteligencia más grande que tú quién has sido y qué has estado escondiendo. Sin miedo: no te juzga.\n\nAhora, en voz alta y bajito, di la emoción que sueltas.\n\n## 4. Suelta\nPide que esa parte de ti se transforme en algo mejor, de la forma que te toque. Entrégala: por una puerta, en una carta, en una caja… Da gracias como si ya estuviera hecho.\n\n## 5. Obsérvate y recuerda\nMírate siendo la de siempre: tus pensamientos automáticos, lo que haces cuando te sientes así. Recuerda: así ya no quiero ser.\n\n## 6. ¡Cambio!\nImagina dos o tres situaciones donde normalmente caes. En cada una, di en voz alta: \"¡Cambio!\".\n\n## 7. Crea y ensaya\nAhora conviértete en la nueva tú. ¿Cómo piensa? ¿Cómo camina? ¿Cómo habla? Siente lo que ella siente: alegría, gratitud, calma, amor.\n\nRelájate unos segundos y hazlo otra vez, con menos esfuerzo.\n\nDesde esa energía, imagina lo que quieres que llegue a tu vida. Ve cada imagen unos segundos con certeza y gratitud, y suéltala. Luego la siguiente.\n\n## Para cerrar\nRecuerda quién vas a ser al abrir los ojos. Planea dos o tres momentos de tu día donde vas a ser ella. Respira profundo y, cuando estés lista, abre los ojos.\n\n## 💬 Si lo vas a grabar\nDeja silencios de 20 a 30 segundos en cada parte del paso 1. Pon música suave sin letra de fondo si te ayuda. Graba una versión por semana: la de la semana 1 solo con el paso 1, la de la semana 2 con los pasos 1 a 4, y así.\n\n@@ 14 | Herramienta | Listas para elegir | Emociones, estados de mente, pensamientos y conductas\nPara cuando no encuentras las palabras. Elige lo que te suene y agrega lo tuyo.\n\n## Emociones de supervivencia\nElige una para desaprender:\n- Inseguridad\n- Vergüenza\n- Tristeza\n- Ansiedad\n- Preocupación\n- Culpa\n- Miedo\n- Enojo\n- Frustración\n- Resentimiento\n- Envidia\n- Juicio\n- Arrepentimiento\n- Sentirme víctima\n- Sentir que no valgo\n- Sentir que nunca alcanza\n- Desánimo\n\n## Estados de mente que traen\nElige uno o dos:\n- Controladora\n- Abrumada\n- Quejumbrosa\n- Culpo a los demás\n- Confundida\n- Distraída\n- Me tengo lástima\n- Desesperada\n- Competitiva\n- Necesito que me reconozcan\n- Siempre con prisa\n- Dramática\n- Tímida, me escondo\n- Necesitada\n- Floja\n- Insegura o sobrada\n- Muy sensible o insensible\n\n## Pensamientos automáticos\n- \"Nunca me va a alcanzar.\"\n- \"Nadie me escucha.\"\n- \"Todos se aprovechan de mí.\"\n- \"Es su culpa que mi vida esté así.\"\n- \"No soy tan inteligente.\"\n- \"No puedo cambiar.\"\n- \"Mejor empiezo otro día.\"\n- \"No tengo ganas.\"\n- \"Tengo que trabajar el doble que las demás.\"\n- \"Así soy, igual que mi mamá.\"\n- \"A ____ no le caigo bien.\"\n\n## Conductas automáticas\n- Encerrarme y sentirme mal sola\n- Comer para no sentir\n- Llamar a alguien para quejarme\n- Scrollear horas\n- Buscar pleito con quien quiero\n- Comprar lo que no necesito\n- Posponer\n- Chismear\n- Hablar de más del pasado\n- Querer ser el centro de atención\n- Presumir\n- Dormir de más\n- Gritar\n- Manejar enojada\n\n## Emociones de la nueva tú\nPara la semana 4:\n- Alegría\n- Gratitud\n- Calma\n- Amor\n- Libertad\n- Confianza\n- Inspiración\n- Entusiasmo\n- Fuerza\n\n@@ 15 | Herramienta | La revisión de la noche | Cinco preguntas antes de dormir\nCinco minutos antes de dormir para ver en qué momento te fuiste en automático y cómo lo harías distinto.\n\n## Las preguntas\n1. ¿Cómo me fue hoy siendo la nueva yo, del 1 al 10?\n2. ¿En qué momento me salí y por qué?\n3. ¿Con quién o con qué reaccioné?\n4. ¿Cuándo me fui en automático?\n5. Si me vuelve a pasar, ¿qué haría distinto?\n\n## Ensaya la respuesta\nCierra los ojos un minuto y vive la escena otra vez, pero ahora reaccionando como la nueva tú. Siéntelo. Mañana súmalo a tu meditación.\n\n## Las señales del día\nAnota cualquier cosa nueva o inesperada que haya pasado: una coincidencia, una oportunidad, una plática que fluyó, una idea. No para juzgar si \"funciona\", sino para notar.\n\n> No es un examen. Es tu bitácora.\n\n## ✍️ Escribe\nUsa el cuaderno de esta herramienta para tu revisión de hoy.\n\n@@ 16 | Herramienta | Tus cuatro semanas | El calendario de práctica\nLa práctica completa en una vista. Si una semana no te sale, repítela.\n\n## Antes de empezar\n- Lee las clases 1 a 6.\n- Elige tu lugar, tu hora y ten tu cuaderno.\n\n## Semana 1 · Abre la puerta\n- Lee la clase 7.\n- Diario: paso 1 (unos 20 minutos).\n- Anota cómo te fue en una línea.\n\n## Semana 2 · Reconoce, admite y suelta\n- Lee las clases 8 y 9 y escribe tus respuestas.\n- Diario: pasos 1 a 4 (unos 30 a 40 minutos).\n- Elige tu frase para soltar.\n\n## Semana 3 · Obsérvate y ¡cambio!\n- Lee la clase 10 y escribe tus listas.\n- Diario: pasos 1 a 6 (unos 40 minutos).\n- Afuera: \"¡Cambio!\" al menos tres veces al día.\n\n## Semana 4 · Crea a la nueva tú\n- Lee las clases 11 y 12 y escribe a la nueva tú.\n- Diario: sesión completa (40 a 50 minutos).\n- Recordatorios durante el día y revisión de la noche.\n\n## Después\n- Sigue con la sesión completa todos los días.\n- Trabaja la misma emoción de cuatro a seis semanas.\n- Cada mes, revisa qué cambió y elige la siguiente capa.\n\n## ✅ Tu registro\nUsa el cuaderno de abajo para tachar tus días: escribe la fecha y qué pasos hiciste.";
var FAQ_MD="## Empezar | 0\n\n### ¿Necesito saber meditar para tomar este curso?\nNo. El curso empieza desde cero. La primera semana solo aprendes a calmar la mente, y cada semana sumas un paso nuevo.\n\n### ¿Cuánto tiempo al día necesito?\nLa primera semana, unos 20 minutos. Cada semana se suma un poco. Cuando ya haces la sesión completa, son entre 40 y 50 minutos. Con la práctica te vuelves más rápida en los primeros pasos.\n\n### ¿Tengo que leer todas las clases antes de practicar?\nLee las clases 1 a 6 antes de empezar la semana 1, porque explican por qué funciona lo que vas a hacer. Las clases de práctica se leen al inicio de cada semana.\n\n### ¿Esto sustituye la terapia?\nNo. Es una práctica de autoconocimiento que puede acompañar, pero si estás pasando por depresión, ansiedad fuerte, un duelo o un trauma, busca también a una profesional.\n\n## La ciencia | 3\n\n### ¿Es cierto todo lo de la física cuántica?\nEl libro en el que se basa este curso usa la física cuántica para explicar cómo creamos nuestra realidad. Algunas de esas ideas son la interpretación del autor y no ciencia comprobada. Lo que sí está bien estudiado es que la atención y la repetición cambian el cerebro y los hábitos. En el curso nos quedamos con la parte práctica.\n\n### ¿De verdad me puedo volver adicta a una emoción?\nEn el sentido de que el cuerpo se acostumbra a ella y la busca, sí. Si llevas años sintiendo culpa o preocupación, ese estado se vuelve \"lo normal\" y sin darte cuenta buscas situaciones que lo repitan. Lo explica la clase 3.\n\n### ¿Qué es la brecha?\nEs la distancia entre cómo te ven los demás y cómo te sientes cuando estás sola y quieta. Mientras más grande, más energía gastas en sostener la imagen. Lo explica la clase 4.\n\n## La práctica | 7\n\n### ¿Por qué no puedo meditar en mi cama?\nPorque tu cuerpo asocia la cama con dormir y te va a ganar el sueño. Elige otro lugar, siempre el mismo, y siéntate derecha en una silla.\n\n### Me quedo dormida o cabeceo, ¿lo estoy haciendo mal?\nCabecear es buena señal: tu mente está bajando de ritmo. Con la práctica el cuerpo aprende a estar relajado sin dormirse. Si te duermes por completo, prueba otra hora o un lugar menos cómodo.\n\n### Mi mente no se calla. ¿Qué hago?\nEs normal, sobre todo al principio. Es el yo viejo peleando por el control. Cada vez que notes que te fuiste, regresa con calma a sentir el espacio de tu cuerpo. Regresar es la práctica.\n\n### ¿Puedo trabajar varias emociones a la vez?\nAl principio no. Elige una sola. Las emociones están conectadas, así que cuando una baja, las demás también. Cuando ya domines el proceso, puedes ir sumando.\n\n### ¿Tengo que decir las cosas en voz alta?\nEn el paso 3 (declarar) y en el paso 6 (\"¡Cambio!\"), sí. Puede ser bajito. Decirlo en voz alta es lo que más cuesta, y por eso funciona: dejas de esconderlo.\n\n### No creo en Dios. ¿Puedo hacer el paso de soltar?\nSí. Llámalo como te haga sentido: el universo, la vida, tu sabiduría interna. Lo importante es soltar el control a algo más grande que tu forma de pensar de siempre y confiar en que hay salidas que todavía no ves.\n\n### ¿Y si una semana no me sale?\nRepítela. El calendario de cuatro semanas es una sugerencia. Es mejor dominar un paso que correr al siguiente.\n\n### ¿Qué hago si me salto días?\nRetoma al día siguiente sin castigarte. La constancia es lo que graba el cambio, pero regañarte es justo el tipo de pensamiento automático que estás soltando.\n\n## La nueva tú | 11\n\n### ¿Imaginar lo que quiero hace que llegue solo?\nNo. Ensayar a la nueva tú te prepara para pensar, decidir y actuar distinto, y eso sí cambia tus resultados. Pero el negocio crece con trabajo, y la salud se cuida con médicos y hábitos.\n\n### ¿Cómo sé que está funcionando?\nReaccionas menos, te cachas antes, te sientes más ligera y empiezas a notar cosas nuevas en tu día. Anótalas en la revisión de la noche.\n\n### ¿Cuánto tiempo trabajo la misma emoción?\nEntre cuatro y seis semanas suele ser suficiente para notar el cambio. Luego revisa qué otra emoción se nota más y empieza otra capa.\n\n## Tu mentora | 0\n\n### ¿La mentora me puede guiar la meditación?\nSí. Escríbele \"Guíame la sesión de la semana 2\" y te da el guion paso a paso, adaptado a tu emoción. También te ayuda a elegir tu emoción, escribir tu frase para soltar y diseñar a la nueva tú.\n\n### ¿Lo que escribo en el cuaderno lo ve alguien más?\nNo. El cuaderno de cada clase se guarda solo en tu dispositivo. Si cambias de celular o borras los datos del navegador, se pierde. Si quieres conservarlo, cópialo a tus notas.";

function lessonBody(src){
  var parts=src.split(/^## /m),main=parts[0],tasks=[];
  parts.slice(1).forEach(function(p){
    var nl=p.indexOf("\n"),head=(nl<0?p:p.slice(0,nl)).trim(),rest=nl<0?"":p.slice(nl+1);
    var icon=startsIcon(head);
    if(icon)tasks.push({title:head.slice(icon.length).trim(),html:md(rest.trim())});else main+="\n## "+p;
  });
  return {html:md(main.trim()),tasks:tasks};
}
function L(id){for(var i=0;i<LESSONS.length;i++)if(LESSONS[i].id===id)return LESSONS[i];return null;}
var N=CFG.n,STEPS=[];for(var i=1;i<=N;i++)STEPS.push(i);
var ORDER=LESSONS.map(function(l){return l.id;});
var GROUPS=CFG.groups.map(function(g){var p=g[0].split(" · ");return {name:p.length>1?p[1]:g[0],pre:p.length>1?p[0]:"",ids:g[1]};});
var ACTS=GROUPS.filter(function(g){return g.ids.every(function(i){return i>=1&&i<=N;});});
var TOOLS=ORDER.filter(function(i){return i>N;});
var seen=new Set(store.get(CFG.key+"-seen",[])),notes=store.get(CFG.key+"-notes",{});
function saveSeen(){store.set(CFG.key+"-seen",Array.from(seen));}
function isStep(id){return id>=1&&id<=N;}
function nextUp(){if(!seen.has(0)&&!STEPS.some(function(i){return seen.has(i);}))return 0;for(var i=0;i<STEPS.length;i++)if(!seen.has(STEPS[i]))return STEPS[i];return null;}
function count(){return STEPS.filter(function(i){return seen.has(i);}).length;}
function stateOf(id){return seen.has(id)?"seen":(id===nextUp()?"next":"");}
function actOf(id){for(var i=0;i<ACTS.length;i++)if(ACTS[i].ids.indexOf(id)>=0)return ACTS[i];return null;}
function label(id){var x=L(id);if(!x)return "";if(id===0)return CFG.welcomeLabel||"Bienvenida";var m=x.title.match(/^([^·]{1,14}) · /);if(isStep(id)&&m)return m[1];return x.kicker;}
function ttl(x){return x.title.replace(/^[^·]{1,14} · /,"");}
function ctaText(){var n=nextUp();if(n===0)return CFG.ctaStart||"Empezar con la bienvenida";if(n===null)return "Repasar "+(CFG.repaso||"el curso");var l=label(n);return "Seguir con "+(/^Clase/.test(l)?"la ":"el ")+l;}
var CTX={ttl:ttl,L:L,LESSONS:LESSONS,N:N,STEPS:STEPS,ACTS:ACTS,TOOLS:TOOLS,GROUPS:GROUPS,seen:seen,stateOf:stateOf,nextUp:nextUp,count:count,esc:esc,label:label,ctaText:ctaText,cfg:CFG,reduce:reduce,actOf:actOf,open:function(id){openLesson(id);}};

/* ---------- page shell ---------- */
var mw=MENTOR.title.indexOf("mentor ")>=0||/mentor,/.test(MENTOR.title)?"mentor":"mentora";
var SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>';
var root=$("#root");
root.innerHTML='<div class="wrap"><header class="hero" id="hero"></header>'+
  '<div class="tabbar"><div class="tabs" role="tablist" aria-label="Secciones del curso">'+
  '<button class="tab" role="tab" id="tabP" aria-selected="true" aria-controls="progView" type="button">'+esc(CFG.tabProgram||"Programa")+'</button>'+
  '<button class="tab" role="tab" id="tabF" aria-selected="false" aria-controls="faqView" type="button">Preguntas</button>'+
  '<button class="tab" role="tab" id="tabM" aria-selected="false" aria-controls="mentorView" type="button">Tu '+mw+'</button></div></div>'+
  '<section id="progView" role="tabpanel" aria-labelledby="tabP"></section>'+
  '<section id="faqView" role="tabpanel" aria-labelledby="tabF" hidden><div class="faqv"><div><h2 class="sec-h">Preguntas</h2><p class="sec-p">'+esc(CFG.faqLead||"Las dudas que más salen en el equipo, con la clase que las responde.")+'</p></div>'+
  '<label class="sr" for="fq">Busca tu duda</label><div class="f-search">'+SEARCH+'<input id="fq" type="search" placeholder="'+esc(CFG.faqPh||"Busca tu duda")+'" autocomplete="off"></div><div class="f-chips" id="cats"></div><p class="f-count" id="fcount"></p><div id="faq"></div></div></section>'+
  '<section id="mentorView" role="tabpanel" aria-labelledby="tabM" hidden></section>'+
  (CFG.foot?'<footer class="foot">'+esc(CFG.foot)+"</footer>":"")+"</div>";

function renderHero(){$("#hero").innerHTML=SKIN.hero(CTX);var c=$("#cta");if(c)c.onclick=function(){var g=nextUp();if(g===null){setTab("P");$("#progView").scrollIntoView({behavior:"smooth"});}else openLesson(g);};$$("#hero [data-open]").forEach(wireOpen);}
function renderProgram(){$("#progView").innerHTML=SKIN.program(CTX);$$("#progView [data-open]").forEach(wireOpen);if(SKIN.mount)SKIN.mount(CTX,$("#progView"));}
function wireOpen(b){b.onclick=function(){openLesson(+b.getAttribute("data-open"),b);};}
function refresh(){renderHero();renderProgram();}

/* tabs */
var TABS={P:["#tabP","#progView"],F:["#tabF","#faqView"],M:["#tabM","#mentorView"]};
function setTab(t){Object.keys(TABS).forEach(function(k){$(TABS[k][0]).setAttribute("aria-selected",String(k===t));$(TABS[k][1]).hidden=k!==t;});}
Object.keys(TABS).forEach(function(k){$(TABS[k][0]).onclick=function(){setTab(k);};});

/* ---------- faq ---------- */
var norm=function(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");};
var STOP=new Set("que como para por con los las del una uno unos mis tus sus mas pero porque cuando donde esta este eso hay tengo puedo debo".split(" "));
function terms(s){return (norm(s).match(/[a-z0-9ñ]{3,}/g)||[]).filter(function(w){return !STOP.has(w);}).map(function(w){return w.length>5?w.slice(0,-1):w;});}
var FAQ=[],CATS=[];
FAQ_MD.split(/^## /m).filter(function(x){return x.trim();}).forEach(function(block){
  var lines=block.split("\n"),h=lines[0].split("|").map(function(x){return x.trim();});if(!h[0])return;CATS.push({cat:h[0],cls:+h[1]});
  lines.slice(1).join("\n").split(/^### /m).filter(function(x){return x.trim();}).forEach(function(qb){var i=qb.indexOf("\n");if(i<0)return;FAQ.push({cat:h[0],cls:+h[1],q:qb.slice(0,i).trim(),a:qb.slice(i+1).trim()});});
});
FAQ.forEach(function(f){f.n=norm(f.q+" "+f.a);});
function hl(html,ts){if(!ts.length)return html;return html.replace(/(>[^<]+<)/g,function(seg){var out=seg;ts.forEach(function(w){var re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").split("").map(function(ch){return ({a:"[aá]",e:"[eé]",i:"[ií]",o:"[oó]",u:"[uúü]",n:"[nñ]"})[ch]||ch;}).join("")+"[a-záéíóúñü]*)","gi");out=out.replace(re,"<mark>$1</mark>");});return out;});}
var fq=$("#fq"),faqEl=$("#faq"),fcount=$("#fcount"),curCat=null;
function isMentorCat(c){return /mentor/i.test(c);}
function renderCats(){var c=$("#cats");c.innerHTML="";[{cat:"Todas"}].concat(CATS).forEach(function(x){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=x.cat;b.setAttribute("aria-pressed",String((x.cat==="Todas"&&!curCat)||x.cat===curCat));b.onclick=function(){curCat=x.cat==="Todas"?null:x.cat;renderCats();renderFaq();};c.appendChild(b);});}
function renderFaq(){
  var qtxt=fq.value.trim(),ts=Array.from(new Set(terms(qtxt))),items=FAQ.filter(function(f){return !curCat||f.cat===curCat;});
  if(ts.length){items=items.map(function(f){return {f:f,s:ts.reduce(function(a,w){return a+(f.n.indexOf(w)>=0?(norm(f.q).indexOf(w)>=0?3:1):0);},0)};}).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;}).map(function(x){return x.f;});}
  faqEl.innerHTML="";
  var gs=ts.length?[[null,items]]:CATS.map(function(c){return [c.cat,items.filter(function(f){return f.cat===c.cat;})];}).filter(function(g){return g[1].length;});
  gs.forEach(function(g){var d=document.createElement("div");d.className="fgroup";if(g[0]){var h=document.createElement("h3");h.textContent=g[0];d.appendChild(h);}
    g[1].forEach(function(f,idx){var det=document.createElement("details");det.className="qa";var x=isMentorCat(f.cat)?null:L(f.cls);
      det.innerHTML="<summary><span>"+hl(">"+esc(f.q)+"<",ts).slice(1,-1)+'</span><i aria-hidden="true">+</i></summary><div class="ans">'+hl(md(f.a),ts)+(x?'<button class="btn go" type="button">Ver: '+esc(x.title)+"</button>":(isMentorCat(f.cat)?'<button class="btn go" type="button">Ir a Tu '+mw+"</button>":""))+"</div>";
      var go=det.querySelector(".go");if(go)go.onclick=function(){if(x)openLesson(f.cls);else setTab("M");};
      if(ts.length&&idx===0)det.open=true;d.appendChild(det);});faqEl.appendChild(d);});
  fcount.textContent=ts.length?(items.length?items.length+(items.length===1?" respuesta":" respuestas")+' para "'+qtxt+'"':'No hay una pregunta frecuente sobre "'+qtxt+'". Pregúntale a tu '+mw+"."):"";
}
var ft;fq.addEventListener("input",function(){clearTimeout(ft);ft=setTimeout(renderFaq,150);});

/* ---------- mentor ---------- */
(function(){
  var M=MENTOR,h='<div class="m-col"><div><h2 class="sec-h">'+esc(M.title)+'</h2><p class="sec-p">'+esc(M.intro)+"</p></div>"+
    '<ul class="m-can">'+M.can.map(function(c){return "<li><b>"+esc(c[0])+"</b><span>"+esc(c[1])+"</span></li>";}).join("")+"</ul>"+
    '<div class="m-dl"><button type="button" class="btn solid" id="dlZip" hidden>Descargar '+(mw==="mentor"?"el mentor":"la mentora")+' (.zip)</button>'+(CFG.mdVar?'<button type="button" class="btn" id="dlMd" hidden>Descargar las instrucciones (.md)</button>':"")+'</div><p class="m-note" id="dlMsg">'+esc(M.notes[0]||"")+"</p></div>"+
    '<div class="m-col"><h3 class="m-h">Cómo '+(mw==="mentor"?"instalarlo":"instalarla")+'</h3><ol class="m-steps">'+M.steps.map(function(s){return "<li><span>"+esc(s)+"</span></li>";}).join("")+"</ol>"+
    '<div class="m-prompts">'+M.prompts.map(function(p,i){return '<div class="m-prompt"><q id="mp'+i+'">'+esc(p)+'</q><button type="button" class="btn" data-copy="mp'+i+'">Copiar</button></div>';}).join("")+"</div>"+
    (M.notes[1]?'<p class="m-note">'+esc(M.notes[1])+"</p>":"")+(M.limits.length?'<div class="m-limits" aria-label="Límites">'+M.limits.map(function(s){return "<span>"+esc(s)+"</span>";}).join("")+"</div>":"")+"</div>";
  $("#mentorView").innerHTML='<div class="mentorv">'+h+"</div>";
  $$("[data-copy]").forEach(function(btn){btn.addEventListener("click",function(){var el=document.getElementById(btn.getAttribute("data-copy"));function selt(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="Seleccionado";}
    try{navigator.clipboard.writeText(el.textContent).then(function(){btn.textContent="Copiado";setTimeout(function(){btn.textContent="Copiar";},1600);},selt);}catch(e){selt();}});});
  if(window.claude&&window.claude.use){window.claude.use("downloads").then(function(dl){
    var msg=$("#dlMsg"),bz=$("#dlZip"),bm=$("#dlMd");if(!dl)return;
    bz.hidden=false;if(bm)bm.hidden=false;msg.textContent=CFG.mdVar?"El .zip es el que se sube a Claude. El .md es el texto de las instrucciones, por si quieres leerlo.":"El .zip es el que se sube a Claude.";
    function bytes(b64){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
    function save(name,data){dl.save({filename:name,data:data}).then(function(){msg.textContent="Listo: "+name+" descargado.";},function(e){var c=e&&e.code;
      if(c==="declined")msg.textContent="Descarga cancelada.";else if(c==="rate_limited")msg.textContent="Ya hay una descarga abierta. Termínala e intenta de nuevo.";else{msg.textContent=M.notes[0]||"Aquí no se puede descargar.";bz.hidden=true;if(bm)bm.hidden=true;}});}
    bz.onclick=function(){save(CFG.zipName,bytes(window[CFG.zipVar]));};if(bm)bm.onclick=function(){save(CFG.mdName,bytes(window[CFG.mdVar]));};
  });}
})();

if(!(window.claude&&window.claude.use)&&/^https?:/.test(location.protocol)){var a=$("#dlZip"),b=$("#dlMd");a.hidden=false;a.onclick=function(){location.href=CFG.zipName;};if(b){b.hidden=false;b.onclick=function(){location.href=CFG.mdName;};}$("#dlMsg").textContent="El .zip es el que se sube a Claude. El .md es el texto de las instrucciones, por si quieres leerlo.";}
/* ---------- reader sheet ---------- */
var cur=null;
function neighbours(id){var k=ORDER.indexOf(id);return {prev:ORDER[k-1],next:ORDER[k+1]};}
function where(x){if(x.id===0)return CFG.welcomeLabel||"Bienvenida";if(isStep(x.id)){var a=actOf(x.id);return label(x.id)+" de "+N+(a&&a.name!=="Clases"?", "+a.name:"");}return x.kicker;}
function sheetHTML(x){
  var b=lessonBody(x.body),nb=neighbours(x.id),s=seen.has(x.id),nx=nb.next!==undefined?L(nb.next):null;
  var num=isStep(x.id)?(SKIN.readerNum?SKIN.readerNum(x,CTX):String(x.id)):null;
  var turn=b.tasks.length?'<section class="turn"><h3>Tu turno</h3>'+b.tasks.map(function(t){return '<div class="task"><h4>'+esc(t.title)+"</h4>"+t.html+"</div>";}).join("")+
    '<label class="nb-l" for="nb">Tu cuaderno</label><textarea id="nb" placeholder="Escribe aquí tu ejercicio. Se guarda en este dispositivo."></textarea><span class="saved" id="nbs"></span></section>':"";
  return '<div class="grab" id="grab"><span class="where">'+esc(where(x))+'</span><button type="button" class="x" id="closeB">Cerrar</button></div><div class="scroll" id="scroll">'+
    '<div class="r-head'+(num?"":" nonum")+'">'+(num?'<span class="r-num" aria-hidden="true">'+esc(num)+"</span>":"")+'<p class="r-k">'+esc(isStep(x.id)?label(x.id):(x.id===0?(CFG.welcomeLabel||"Bienvenida"):x.kicker))+'</p><h1 class="r-title" id="rTitle">'+esc(ttl(x))+'</h1></div><p class="r-topic">'+esc(x.topic)+'</p><p class="r-intro">'+inline(esc(x.intro))+'</p><div class="lesson-body">'+b.html+"</div>"+turn+
    '<div class="r-foot"><div class="nav"><button class="btn" type="button" id="prevB" '+(nb.prev===undefined?"disabled":"")+'>Anterior</button><button class="btn solid" type="button" id="nextB" '+(nb.next===undefined?"disabled":"")+">Siguiente</button></div>"+
    (isStep(x.id)?'<button class="btn'+(s?" done":"")+'" type="button" id="seenB" aria-pressed="'+s+'">'+(s?"Completada ✓":"Marcar como completada")+"</button>":"")+
    (nx?'<p class="r-next">Sigue: '+esc(ttl(nx))+"</p>":"")+"</div></div>";
}
function openLesson(id,trigger){
  var x=L(id);if(!x)return;
  var fresh=!cur;
  if(fresh){
    var scrim=document.createElement("div");scrim.className="scrim";var sh=document.createElement("div");sh.className="sheet";sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");sh.setAttribute("aria-labelledby","rTitle");
    document.body.appendChild(scrim);document.body.appendChild(sh);document.body.classList.add("sheet-open");
    cur={scrim:scrim,sh:sh,trigger:trigger||document.activeElement};
    scrim.onclick=closeLesson;
  }
  cur.id=id;cur.sh.innerHTML=sheetHTML(x);
  var sh=cur.sh;
  if(fresh)requestAnimationFrame(function(){requestAnimationFrame(function(){sh.classList.add("on");cur&&cur.scrim.classList.add("on");});});
  $("#closeB",sh).onclick=closeLesson;var rt=$("#rTitle",sh);rt.setAttribute("tabindex","-1");rt.focus({preventScroll:true});
  var nb=neighbours(id);
  $("#prevB",sh).onclick=function(){openLesson(nb.prev);};
  $("#nextB",sh).onclick=function(){if((isStep(id)||id===0)&&!seen.has(id)){seen.add(id);saveSeen();refresh();}openLesson(nb.next);};
  var sb=$("#seenB",sh);if(sb)sb.onclick=function(){seen.has(id)?seen.delete(id):seen.add(id);saveSeen();var on=seen.has(id);sb.textContent=on?"Completada ✓":"Marcar como completada";sb.classList.toggle("done",on);sb.setAttribute("aria-pressed",String(on));refresh();};
  var ta=$("#nb",sh);if(ta){ta.value=notes[id]||"";var t;ta.oninput=function(){clearTimeout(t);t=setTimeout(function(){notes[id]=ta.value;store.set(CFG.key+"-notes",notes);$("#nbs",sh).textContent="Guardado en este dispositivo";},400);};}
  $("#scroll",sh).scrollTop=0;
  try{history.replaceState(null,"","#clase-"+id);}catch(e){}
  var g=$("#grab",sh),y0=null,dy=0,t0=0;
  g.addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;y0=e.clientY;dy=0;t0=performance.now();sh.classList.add("drag");try{g.setPointerCapture(e.pointerId);}catch(_){}});
  g.addEventListener("pointermove",function(e){if(y0==null)return;dy=e.clientY-y0;sh.style.transform="translateY("+(dy<0?dy*.15:dy)+"px)";});
  function end(){if(y0==null)return;var v=dy/Math.max(1,performance.now()-t0);sh.classList.remove("drag");sh.style.transform="";y0=null;if(dy>140||v>.5)closeLesson();}
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
}
function closeLesson(){
  if(!cur)return;var c=cur;cur=null;document.body.classList.remove("sheet-open");
  c.sh.classList.remove("on");c.scrim.classList.remove("on");setTimeout(function(){c.sh.remove();c.scrim.remove();},reduce?0:500);
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  var t=document.querySelector('#progView [data-open="'+c.id+'"]')||c.trigger;if(t&&t.focus)t.focus({preventScroll:false});
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&cur)closeLesson();});

/* ---------- boot ---------- */
renderCats();renderFaq();refresh();
var hm=(location.hash||"").replace("#",""),hh=hm.match(/clase-(\d+)/);
if(hh&&L(+hh[1]))openLesson(+hh[1]);else if(hm==="mentor"||hm==="mentora")setTab("M");else if(hm==="preguntas")setTab("F");
})();
