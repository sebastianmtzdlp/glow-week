<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Imán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:3px}
.wrap{max-width:var(--maxw,1040px);margin:0 auto;padding-inline:16px;padding-block:0 64px;display:flex;flex-direction:column;gap:var(--gap,28px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.press{transition:transform .16s cubic-bezier(.23,1,.32,1)}
.press:active{transform:scale(.97)}

/* tabs */
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:center;margin-inline:-16px;padding:10px 16px}
.tabbar::before{content:"";position:absolute;inset:0;background:var(--bg);opacity:.94;z-index:-1}
.tabs{display:flex;gap:4px;max-width:100%;overflow-x:auto;padding:4px;border-radius:var(--tabs-r,999px);background:var(--surface);border:1px solid var(--line)}
.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:15px;padding:10px 18px;border-radius:var(--tabs-r,999px);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* shared buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:15px;padding:12px 18px;border-radius:var(--btn-r,999px);cursor:pointer;text-decoration:none;transition:transform .16s cubic-bezier(.23,1,.32,1)}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.35;cursor:default}

/* section heads (faq + mentor) */
.sec-h{margin:0;font:var(--h2-font);letter-spacing:var(--h2-track,-.01em);text-wrap:balance}
.sec-p{margin:8px 0 0;color:var(--muted);max-width:56ch}

/* faq */
.faqv{display:flex;flex-direction:column;gap:16px;max-width:780px}
.f-search{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--field-r,999px);padding:0 18px}
.f-search svg{width:20px;height:20px;flex:none;color:var(--muted)}
.f-search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:17px/1.3 var(--body);padding:14px 0}
.f-search input:focus{outline:none}
.f-search:focus-within{border-color:var(--accent)}
.f-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.f-count{margin:0;color:var(--muted);font-size:14px}
.fgroup h3{margin:18px 0 8px;font:var(--h3-font)}
details.qa{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,16px);margin-bottom:8px}
details.qa summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 18px;font-weight:600;font-size:16.5px;line-height:1.35}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary i{flex:none;font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink);transition:transform .2s cubic-bezier(.23,1,.32,1)}
details.qa[open] summary i{transform:rotate(45deg);background:var(--accent);color:var(--accent-ink)}
.ans{padding:0 18px 18px}
.ans p{margin:0 0 .7em;max-width:64ch}.ans p:last-child{margin:0}
.ans ul,.ans ol{margin:0 0 .8em;padding-left:1.3em}
.ans .go{margin-top:10px}
mark{background:var(--mark,rgba(255,200,0,.35));color:inherit;border-radius:3px;padding:0 2px}

/* mentor */
.mentorv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 40px;align-items:start}
@media (max-width:780px){.mentorv{grid-template-columns:minmax(0,1fr)}}
.m-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.m-can{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.m-can li{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,16px);padding:14px 16px}
.m-can b{display:block;font-weight:700}
.m-can span{color:var(--muted);font-size:15px}
.m-dl{display:flex;flex-wrap:wrap;gap:10px}
.m-note{margin:0;color:var(--muted);font-size:14px}
.m-h{margin:0;font:var(--h3-font)}
.m-steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.m-steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:baseline}
.m-steps li::before{counter-increment:s;content:counter(s);font:var(--num-font,700 22px/1 var(--display));color:var(--accent-text,var(--accent))}
.m-prompts{display:grid;gap:8px}
.m-prompt{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,14px);padding:10px 12px 10px 16px}
.m-prompt q{quotes:none;min-width:0;font-size:15.5px}
.m-prompt .btn{padding:8px 14px;font-size:13.5px;flex:none}
.m-limits{display:flex;flex-wrap:wrap;gap:8px}
.m-limits span{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted)}
footer.foot{text-align:center;font-size:14px;color:var(--muted);padding-top:20px}

/* ---------- reader sheet (the lights come on) ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;transition:opacity .45s cubic-bezier(.32,.72,0,1)}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;top:calc(12px + env(safe-area-inset-top,0px));margin:0 auto;max-width:800px;background:var(--r-bg);color:var(--r-ink);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:0 -12px 50px rgba(0,0,0,.35);font-family:var(--r-body,var(--body))}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{flex:none;touch-action:none;cursor:grab;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 14px 10px 20px;border-bottom:1px solid var(--r-line);position:relative}
.grab::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--r-line)}
.grab .where{font-size:14px;font-weight:600;color:var(--r-muted);padding-top:8px}
.grab .x{border:1px solid var(--r-line);background:transparent;color:var(--r-ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;margin-top:6px}
.sheet :focus-visible{outline:2px solid var(--r-accent);outline-offset:3px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:clamp(22px,5vw,48px) clamp(18px,5vw,56px) calc(56px + env(safe-area-inset-bottom,0px))}
.r-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:end;margin-bottom:18px}
.r-head.nonum{grid-template-columns:minmax(0,1fr)}
.r-num{grid-row:span 2;font:var(--r-num-font,800 96px/.8 var(--display));color:var(--r-accent);font-variant-numeric:tabular-nums}
.r-k{margin:0;font-size:14.5px;font-weight:600;color:var(--r-accent)}
.r-title{margin:0;font:var(--r-title-font,700 clamp(32px,6.5vw,48px)/1 var(--display));letter-spacing:var(--r-title-track,-.01em);text-wrap:balance}
.r-topic{margin:0 0 18px;font-size:20px;line-height:1.35;color:var(--r-muted)}
.r-intro{font-size:20px;line-height:1.5;margin:0 0 26px;padding-bottom:24px;border-bottom:1px solid var(--r-line)}
.lesson-body p,.lesson-body li{max-width:66ch}
.lesson-body p{margin:0 0 .9em}
.lesson-body ul,.lesson-body ol{margin:0 0 1em;padding-left:1.3em}
.lesson-body li{margin:.4em 0}
.lesson-body li::marker{color:var(--r-accent);font-weight:700}
.lesson-body strong{font-weight:700}
.lesson-body h3{font:var(--r-h3-font,700 26px/1.15 var(--display));margin:36px 0 10px;text-wrap:balance}
.callout{margin:28px 0;padding:22px 24px;border-radius:var(--card-r,18px);background:var(--r-callout-bg);color:var(--r-callout-ink)}
.callout p{margin:0;font:var(--r-callout-font,700 clamp(22px,4.6vw,28px)/1.2 var(--display));max-width:34ch;text-wrap:balance}
.turn{margin-top:40px;padding-top:26px;border-top:2px solid var(--r-ink);display:grid;gap:12px}
.turn h3{margin:0;font:var(--r-h3-font,700 26px/1.15 var(--display))}
.task{background:var(--r-surface);border:1px solid var(--r-line);border-radius:var(--card-r,16px);padding:16px 18px}
.task h4{margin:0 0 6px;font-size:17px}
.task p:last-child,.task ul:last-child,.task ol:last-child{margin-bottom:0}
.nb-l{font-weight:600;font-size:14px;color:var(--r-muted);margin-top:6px}
.sheet textarea{width:100%;min-height:150px;resize:vertical;font:16px/1.55 var(--r-body,var(--body));color:var(--r-ink);background:var(--r-surface);border:1px solid var(--r-line);border-radius:12px;padding:14px 16px}
.saved{font-size:13px;color:var(--r-muted);min-height:1.2em}
.r-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:34px;padding-top:22px;border-top:1px solid var(--r-line)}
.r-foot .nav{display:flex;gap:8px;flex-wrap:wrap}
.sheet .btn{border-color:var(--r-line);color:var(--r-ink)}
.sheet .btn.solid{background:var(--r-ink);border-color:var(--r-ink);color:var(--r-bg)}
.sheet .btn.done{background:var(--r-accent);border-color:var(--r-accent);color:var(--r-accent-ink,var(--r-bg))}
.r-next{width:100%;margin:0;font-size:14px;color:var(--r-muted)}
body.sheet-open{overflow:hidden}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.mentorv .sec-h{font-size:clamp(28px,6.4vw,46px)}

/* Imán: a magnetic field. Cool iron grey, magnet red. Each completed class is a filing pulled in toward the word; the programme is a four-column board. */
:root{
  --bg:#E7EAED; --surface:#F7F8F9; --ink:#121417; --muted:#58616B; --line:#CBD1D7; --accent:#D7263D; --accent-ink:#FFFFFF; --north:#2443B5; --focus:#2443B5; --mark:rgba(215,38,61,.22);
  --display:"Syne","Arial Black",system-ui,sans-serif; --body:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --h2-font:800 clamp(38px,7.5vw,64px)/.95 var(--display); --h3-font:800 22px/1.05 var(--display); --num-font:800 24px/1 var(--display); --accent-text:#B81F33;
  --r-bg:#FAFBFC; --r-surface:#FFFFFF; --r-ink:#121417; --r-muted:#58616B; --r-line:#DDE2E7; --r-accent:#B81F33; --r-accent-ink:#FFFFFF; --r-callout-bg:#121417; --r-callout-ink:#FFFFFF;
  --r-num-font:800 clamp(80px,18vw,120px)/.8 var(--display); --r-title-font:800 clamp(32px,6.5vw,50px)/.98 var(--display); --r-h3-font:800 25px/1.08 var(--display); --r-callout-font:700 clamp(22px,4.8vw,28px)/1.2 var(--display);
  --card-r:14px; --btn-r:12px; --field-r:12px; --tabs-r:12px;
}
.i-hero{padding-block:24px 8px;display:grid;gap:8px;justify-items:center;text-align:center}
.i-field{width:100%;max-width:980px;aspect-ratio:16/8.4;position:relative}
@media (max-width:640px){.i-field{aspect-ratio:1/1}}
.i-field svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.i-lines ellipse{fill:none;stroke:var(--line);stroke-width:1}
.i-dot{transition:transform 1.4s cubic-bezier(.23,1,.32,1)}
.i-dot circle{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.i-dot.seen circle{fill:var(--accent);stroke:var(--accent)}
.i-dot.next circle{fill:var(--surface);stroke:var(--north);stroke-width:3}
.i-word{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.i-word h1{margin:0;font:800 clamp(72px,19vw,200px)/.8 var(--display);letter-spacing:-.04em;color:var(--ink)}
.i-word h1 span{color:var(--accent)}
.i-tag{margin:0;font:700 clamp(22px,4.6vw,34px)/1.1 var(--display);letter-spacing:-.01em}
.i-tag s{text-decoration-thickness:3px;text-decoration-color:var(--accent);color:var(--muted)}
.i-pitch{margin:0;max-width:52ch;color:var(--muted)}
.i-meta{margin:0;font-size:15px;color:var(--muted)}
.i-meta b{color:var(--ink)}
.i-cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.i-board{display:grid;gap:22px}
.i-welcome{display:flex;justify-content:space-between;gap:16px;align-items:center;width:100%;text-align:left;background:var(--ink);color:var(--surface);border:0;border-radius:var(--card-r);padding:18px 22px;cursor:pointer}
.i-welcome b{display:block;font:800 24px/1.05 var(--display)}
.i-welcome small{color:#B9C0C8;font-size:15px}
.i-welcome span:last-child{font-weight:700;white-space:nowrap;font-size:14px;color:#FF8A97}
.i-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1000px){.i-cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.i-cols{grid-template-columns:minmax(0,1fr)}}
.i-col{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r);overflow:hidden}
.i-col header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 16px 10px;border-bottom:2px solid var(--ink)}
.i-col h3{margin:0;font:800 21px/1 var(--display)}
.i-col header span{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.i-row{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 16px;cursor:pointer}
.i-col header + .i-row{border-top:0}
.i-row .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--body);border:1.5px solid var(--muted);color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.i-row.seen .n{background:var(--accent);border-color:var(--accent);color:#fff}
.i-row.next .n{border:2.5px solid var(--north);color:var(--north)}
.i-row b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.i-row small{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:2px}
.i-row.next b::after{content:"Aquí vas";margin-left:8px;font-size:12px;font-weight:700;color:var(--north);white-space:nowrap}
@media (hover:hover){.i-row:hover{background:var(--bg)}}
.i-h{margin:12px 0 0;font:800 26px/1 var(--display)}
.i-tools{display:flex;flex-wrap:wrap;gap:10px}
.i-tool{flex:1 1 190px;min-width:0;text-align:left;background:transparent;border:1.5px solid var(--ink);border-radius:var(--card-r);padding:14px 16px;cursor:pointer}
.i-tool b{display:block;font-weight:700}
.i-tool small{color:var(--muted);font-size:14px}

</style>
<div id="root"></div>
<script>
var LESSONS_MD="@@ 0 | Empieza aqu\u00ed | Bienvenida a Im\u00e1n | De perseguir a atraer\nIm\u00e1n es un programa de 30 d\u00edas para que tus redes atraigan a las personas correctas en lugar de que t\u00fa las persigas. Vas a definir a qui\u00e9n le hablas, ordenar tu contenido, abrir conversaciones y convertirlas en clientas y socias, sin sonar a cat\u00e1logo ni a vendedora desesperada.\n\n## La regla del 10 y el 90\nEl curso te da el 10%: la estrategia, las herramientas y los ejemplos. El 90% eres t\u00fa: tu actitud, tu acci\u00f3n diaria y tu constancia. Nadie naci\u00f3 con el chip; es una habilidad, como andar en bicicleta. Primero te caes y luego te sale.\n\n## Aprende para ense\u00f1ar\nNo basta con que t\u00fa sepas hacerlo. Si no sabes ense\u00f1\u00e1rselo a tu equipo, tu equipo no crece. Toma cada clase pensando c\u00f3mo la vas a explicar.\n\n## Tus tres cuentas\n- **Personal:** familia, memes, lo que quieras.\n- **Laboratorio:** solo para investigar y guardar ideas de tu tema. No la uses para entretenerte.\n- **Negocio:** la que publica. Ah\u00ed solo interact\u00faas con tu comunidad.\n\n## Lo que vas a construir\n- Tu nicho y tu promesa.\n- Tu perfil como p\u00e1gina de aterrizaje.\n- Tu mezcla 7-2-1: atraer, conectar y convertir.\n- Tus guiones de conexi\u00f3n, de venta y de mensajes.\n- Tu historia, tu voz y tu sistema para no quedarte en blanco.\n- Tus herramientas: edici\u00f3n, Canva, IA, historias.\n\n> Aqu\u00ed no vienes a entretenerte. Vienes a hacerlo con intenci\u00f3n.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfHoy persigues a la gente o la gente llega a ti?\n\n## \u270d\ufe0f Ejercicio\n1. Escribe qu\u00e9 quieres que pase en tus redes en 30 d\u00edas.\n2. Crea tu cuenta laboratorio si no la tienes.\n3. Elige tu horario diario para la clase y para publicar.\n\n## \u2705 Tu tarea\nVe la siguiente clase con libreta y sin estar haciendo otra cosa.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu meta de 30 d\u00edas.\n\n@@ 1 | Clase 1 | Tu nicho eres t\u00fa | A qui\u00e9n le hablas y qu\u00e9 le resuelves\nSi ma\u00f1ana te rompes un dedo, vas con la especialista en manos, no con el m\u00e9dico general. En redes pasa igual: la gente sigue y le compra a quien resuelve su problema concreto. Hablarle a todas es no venderle a nadie.\n\n## No vendes productos, vendes cambios\nNo vendes un suplemento: vendes sentirte con energ\u00eda. No vendes un rubor: vendes seguridad al salir. No vendes \"ingreso residual\": vendes llegar a fin de mes tranquila.\n\n## Tu tema grande y tu tema chico\nLa marca ya te pone en un tema grande: bienestar, belleza o emprendimiento. Dentro de \u00e9l, elige **un tema chico**, un problema que conoces bien: falta de tiempo, piel grasa, cansancio de mam\u00e1 que no para, ganas de volver a sentirte profesional. Puedes seguir mostrando otros productos; tu posicionamiento es uno.\n\n## Tu nicho eres t\u00fa\nLa forma m\u00e1s f\u00e1cil de encontrarlo: piensa en el mensaje que t\u00fa necesitabas escuchar. Lo que te frenaba, lo que te dol\u00eda, lo que te dio verg\u00fcenza, lo que te cost\u00f3. Si un tema no es tuyo, se te nota en la cara.\n\n## La prueba de fuego\n\u00bfPuedes hablar de ese tema todos los d\u00edas? Si no te maquillas, no elijas maquillaje.\n\n## Empieza por un problema, no por el dinero\nHablar de ingresos o de liderazgo sin trayectoria casi no conecta y suena a promesa. Empieza por un problema que tus productos ayudan a resolver. El negocio se cuenta en tu contenido de conexi\u00f3n y de venta.\n\n## Tu frase\n> Quiero ser conocida por ayudar a **[qui\u00e9nes]** que **[problema]**, que est\u00e1n cansadas de **[lo que ya intentaron]** y quieren **[resultado]**.\n\nTu promesa es tu br\u00fajula, no un anuncio. Escr\u00edbela sin plazos ni resultados que no puedes garantizar.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfQu\u00e9 mensaje te hubiera gustado leer hace un a\u00f1o?\n\n## \u270d\ufe0f Ejercicio\n1. Escribe 5 problemas que t\u00fa viviste y tus productos ayudan a resolver.\n2. Elige uno con la prueba de fuego.\n3. Completa tu frase y gu\u00e1rdala en un documento llamado \"Mi nicho\".\n4. Si te atoras, pide a tu asistente de IA: \"Escribe el diario de un d\u00eda de una mujer que [tu problema], en primera persona, sin soluciones\".\n\n## \u2705 Tu tarea\nPega tu frase en tus notas del celular para tenerla siempre a mano.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu frase.\n\n@@ 2 | Clase 2 | Tu perfil es tu p\u00e1gina de aterrizaje | Tres segundos para quedarse\nCuando alguien entra a tu perfil no puede ver una tienda: tiene que ver a una persona. En tres segundos decide si se queda.\n\n## Lo b\u00e1sico\n1. **Foto:** tu cara, bien iluminada, real. Nunca hecha con IA. Sin logos, flores, atardeceres ni fotos de grupo.\n2. **Usuario y nombre:** tu nombre real. Nada de \"nombre.marca\" o \"la tiendita de\u2026\". Tu marca personal te acompa\u00f1a aunque cambies de empresa.\n3. **Bio:** qui\u00e9n eres \u2192 a qui\u00e9n ayudas y en qu\u00e9 \u2192 algo de prueba (tu experiencia, tu proceso) \u2192 llamado a la acci\u00f3n.\n4. **Link:** una p\u00e1gina de enlaces gratis (como Linktree o Beacons) con botones: \"Quiero saber m\u00e1s\" (a tu WhatsApp), \"Quiero comprar\", \"\u00danete a mi equipo\", \"Sobre m\u00ed\".\n5. **Botones de contacto** a tu WhatsApp.\n\n## Destacadas en orden\n**Empieza aqu\u00ed \u2192 Mi historia \u2192 Resultados \u2192 C\u00f3mo funciona / preguntas \u2192 Tips.** Pocas y con portadas del mismo estilo. Evita \"Varios\", cat\u00e1logos y promociones viejas.\n\n## Tres publicaciones fijadas\n1. **Tu presentaci\u00f3n:** \"Si eres nueva por aqu\u00ed, d\u00e9jame presentarme\u2026\": qui\u00e9n eres, por qu\u00e9 empezaste, a qui\u00e9n ayudas, qu\u00e9 vas a encontrar aqu\u00ed.\n2. **Tu contenido de valor** que m\u00e1s funcion\u00f3.\n3. **Un testimonio o tu transformaci\u00f3n**, sin promesas.\n\n## Si empiezas de cero\nArchiva (no borres) lo que parece cat\u00e1logo y sube tres publicaciones:\n1. Tu presentaci\u00f3n: \"de aqu\u00ed en adelante, esto es lo que vas a encontrar\".\n2. Tu historia: yo era\u2026 \u2192 me frustraba\u2026 \u2192 el punto de quiebre \u2192 lo que pas\u00f3 despu\u00e9s \u2192 lo que aprend\u00ed. Sin vender.\n3. Algo \u00fatil sobre tu tema, con \"gu\u00e1rdalo para despu\u00e9s\".\n\n## Canal de difusi\u00f3n\nSi ya tienes comunidad, abre un canal de difusi\u00f3n en Instagram para frases, consejos y avisos. Te mantiene cerca.\n\n> Mejor hecho que perfecto. El pelo en la blusa solo lo ves t\u00fa.\n\n## \ud83e\ude9e M\u00edrate al espejo\nSi hoy entrara tu clienta ideal a tu perfil, \u00bfse sentir\u00eda en el lugar correcto?\n\n## \u270d\ufe0f Ejercicio\nUsa la **Ficha de nicho y perfil** (en Herramientas) para reescribir tu bio, tus destacadas y tus fijados.\n\n## \u2705 Tu tarea\nCambia hoy foto, nombre, bio y link.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu perfil antes y despu\u00e9s.\n\n@@ 3 | Clase 3 | De consumidora a creadora | Lo que pasa en tu cabeza cuando no publicas\nNo publicar casi nunca es falta de creatividad. Tu cerebro est\u00e1 hecho para cuidarte y ahorrar energ\u00eda, no para exponerte. Entenderlo te quita culpa y te da herramientas.\n\n## Tu cerebro eval\u00faa cuatro cosas\nAmenaza, gasto de energ\u00eda, recompensa y seguridad. Cuando est\u00e1s cansada, saturada o ansiosa, entra en modo ahorro: m\u00e1s scroll, m\u00e1s compras impulsivas, m\u00e1s \"ma\u00f1ana lo hago\".\n\n## Recompensa r\u00e1pida contra recompensa lenta\nLos likes y el scroll dan satisfacci\u00f3n inmediata. El negocio da recompensa diferida: a veces te compran y a veces no. Si te acostumbras solo a lo inmediato, el proceso lento se vuelve insoportable y ante un \"no\" te refugias en el celular.\n\n## Consumir para inspirarte o para anestesiarte\nConsumir contenido puede darte ideas. El problema es usarlo para no sentir: para tapar un vac\u00edo, el cansancio o la comparaci\u00f3n.\n\n## Dos sistemas al crear\n- **Uno te empuja:** las ganas de crecer, de ser vista, de lograr algo.\n- **Otro te frena:** el miedo a equivocarte, a que te juzguen, a fallar en p\u00fablico. Para tu cuerpo, subir un reel puede sentirse como un peligro real.\n\nY a veces el miedo no es \"\u00bfy si no funciona?\", sino \"\u00bfy si funciona y no lo puedo sostener?\".\n\n## El cambio de identidad\n1. Tolerar la incomodidad sin huir.\n2. Regularte sin anestesiarte: pausas sin celular, caminar, escribir, respirar.\n3. Recuperar tu energ\u00eda: menos pesta\u00f1as abiertas, menos multitarea.\n4. Crear sin esperar aplauso inmediato: con calendario, no con ganas.\n5. Sostener el crecimiento sin abandonarte.\n\n> Consumir no te quita tiempo; te quita energ\u00eda para crear.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfQu\u00e9 parte de ti gana cuando t\u00fa no publicas?\n\n## \u270d\ufe0f Ejercicio\n1. \u00bfCu\u00e1ndo fue la \u00faltima vez que hiciste scroll o compraste algo sin pensar? \u00bfQu\u00e9 estabas evitando sentir?\n2. \u00bfQu\u00e9 cambiar\u00eda en tu vida si de verdad te fuera bien? \u00bfQu\u00e9 parte de eso te asusta?\n3. Marca cu\u00e1les de los 5 puntos del cambio de identidad ya practicas.\n\n## \u2705 Tu tarea\nElige tu miedo m\u00e1s chico y hazlo hoy: una historia hablando a c\u00e1mara, un reel sencillo o un comentario respondido.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte qu\u00e9 miedo enfrentaste hoy.\n\n## Un cuidado\nSi sientes ansiedad, tristeza o cansancio que no se van, habla con alguien de confianza o con una profesional. Ning\u00fan curso sustituye eso.\n\n@@ 4 | Clase 4 | Mentalidad de negocio | Herramientas, no frases bonitas\nRepetir frases positivas no basta. La mentalidad se entrena con herramientas y repetici\u00f3n, como un m\u00fasculo.\n\n## Seis pilares\n1. **Observarte:** notar qu\u00e9 piensas y qu\u00e9 dices.\n2. **Elegir:** qu\u00e9 consumes, con qui\u00e9n te juntas, c\u00f3mo reaccionas.\n3. **Metas claras:** si no sabes qu\u00e9 quieres, haz la lista de lo que ya no quieres.\n4. **H\u00e1bitos:** se forman con semanas de repetici\u00f3n, no en tres d\u00edas.\n5. **Visualizar:** cinco minutos al d\u00eda imaginando lo que est\u00e1s construyendo.\n6. **Medir:** revisar cada semana qu\u00e9 hiciste.\n\n## Donde pones atenci\u00f3n, crece\nTu cabeza funciona como el algoritmo: te muestra m\u00e1s de lo que miras. Si todo el d\u00eda buscas lo que sale mal, lo vas a encontrar.\n\n## Tus creencias sobre el dinero\nEscribe las frases que escuchaste de ni\u00f1a: \"el dinero no crece en los \u00e1rboles\", \"los ricos son malos\", \"nunca hables de cu\u00e1nto ganas\". Revisa cu\u00e1les te sirven y cu\u00e1les te frenan. Puedes honrar a tu familia sin cargar sus miedos.\n\n## Herramientas diarias\n- **Escribe a mano** tu agenda y tus intenciones del d\u00eda.\n- **Corta la queja:** no alimentes conversaciones de \"todo est\u00e1 terrible\".\n- **Aprende a recibir:** cuando te hagan un cumplido, di \"gracias\".\n- **Cel\u00e9brate:** pr\u00e9miate por lo que cumpliste, sin esperar que otros lo noten.\n- **Pon l\u00edmites con cari\u00f1o.**\n- **Cambia la narrativa:** de \"trabajo como burro\" a \"mi trabajo me lo permite\".\n\n> Lo que repites, lo practicas. Lo que practicas, lo vuelves.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfQu\u00e9 frase sobre el dinero escuchaste m\u00e1s en tu casa?\n\n## \u270d\ufe0f Ejercicio\n1. Escribe 3 creencias sobre el dinero que te frenan y c\u00f3mo las reescribir\u00edas.\n2. Escribe 3 cosas que ya no quieres en tu vida y convi\u00e9rtelas en metas.\n\n## \u2705 Tu tarea\nDurante una semana, escribe cada ma\u00f1ana tu intenci\u00f3n del d\u00eda en una l\u00ednea.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte una creencia que vas a soltar.\n\n@@ 5 | Clase 5 | Atrae, conecta, convierte | La mezcla 7-2-1 y los formatos que ya funcionan\nSi no vendes, casi nunca es por falta de producci\u00f3n: te faltan ojos nuevos y est\u00e1s mezclando todo. La mezcla 7-2-1 ordena tu contenido.\n\n## La mezcla\nDe cada 10 publicaciones:\n- **7 para atraer:** contenido que gente nueva comparte y guarda.\n- **2 para conectar:** contenido que crea v\u00ednculo y confianza.\n- **1 para convertir:** una invitaci\u00f3n clara a comprar, platicar o conocer el negocio.\n\nDesde el primer d\u00eda, no \"primero puros virales y luego el resto\". Una sola pieza puede atraer y conectar a la vez. Las historias van aparte: ah\u00ed conectas y vendes todos los d\u00edas.\n\n## Formatos que ya funcionan\nDesde tu cuenta laboratorio, busca en la lupa palabras del mundo de tu clienta y f\u00edjate en piezas que cumplan:\n1. Muchas vistas.\n2. Muchos compartidos.\n3. De cuentas peque\u00f1as, para que sepas que funcion\u00f3 la idea y no la fama.\n4. Alineadas con lo que le resuelves a tu clienta.\n5. Que puedas hacer t\u00fa en casa.\n\nGuarda las que cumplan. Prueba varias palabras; si no encuentras, pide ideas de palabras a tu asistente de IA.\n\n## Haz tu versi\u00f3n\nToma el formato: duraci\u00f3n, tipo de escena, estructura del texto, ritmo. Gr\u00e1balo t\u00fa, con tus palabras, tu casa y un audio de la app. Nunca descargues ni resubas un video ajeno ni copies textos palabra por palabra. El 7 no es tu esencia; tu esencia va en el 2 y el 1, pero hasta el 7 se ve mejor con tu toque.\n\n## Qu\u00e9 cuenta para el algoritmo\nCompartidos, guardados, comentarios y env\u00edos pesan m\u00e1s que los likes. Responde comentarios para mantener viva la publicaci\u00f3n. Las palabras que escribes en el video y la descripci\u00f3n ayudan a que te encuentren.\n\n## Frecuencia\nM\u00ednimo una publicaci\u00f3n al d\u00eda. Los reels de alcance suelen ser cortos: de 4 a 10 segundos.\n\n## Graba tu banco de clips\nGraba clips de 2 a 5 segundos de todo: trabajando, cocinando, caminando, con tu perro. Te sirven para montar textos encima.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfTus \u00faltimas publicaciones atraen gente nueva o solo le hablan a quien ya te sigue?\n\n## \u270d\ufe0f Ejercicio\nGuarda **10 formatos** que cumplan las 5 reglas, en tu cuenta laboratorio.\n\n## \u2705 Tu tarea\nGraba y publica tu versi\u00f3n de 3 de ellos esta semana.\n\n## \ud83d\udcac Para compartir en el grupo\nArma un microgrupo para intercambiar formatos que encuentren.\n\n@@ 6 | Clase 6 | Contenido que conecta | Cinco tipos que abren conversaciones\nEl contenido de conexi\u00f3n no busca vistas: busca conversaciones. Un reel de conexi\u00f3n con pocas vistas y unos cuantos mensajes vale m\u00e1s que uno viral sin ninguno.\n\n> No te falla el cierre; te faltan conversaciones abiertas.\n\n## 1. Testimonio\nM\u00e1s que el resultado, cuenta el proceso: qu\u00e9 sent\u00edas antes y c\u00f3mo te sientes ahora. Usa testimonios reales, tuyos o de alguien que te d\u00e9 permiso. Sin promesas de salud ni de dinero.\n\n## 2. Lo que ya intent\u00f3\nHabla de lo que tu clienta ya prob\u00f3 y no le funcion\u00f3: comprar sin rumbo, empezar y soltar, sentirse sola en un negocio. Nunca nombres marcas, empresas ni personas. El objetivo es pasar de la frustraci\u00f3n a la claridad.\n\n## 3. Espejo\nQue diga \"me ley\u00f3 la mente\". Tiene que ser ultraespec\u00edfico:\n- No: \"T\u00fa que quieres ser m\u00e1s constante\".\n- S\u00ed: \"Te prometes empezar el lunes y el jueves ya lo soltaste\".\n\n## 4. Verdad inc\u00f3moda\nDecir con respeto lo que todas piensan y nadie dice: \"No es que no tengas tiempo, es que todav\u00eda no es tu prioridad\". Sin humillar ni culpar. Prep\u00e1rate: este contenido genera opiniones.\n\n## 5. Autoridad\nMuestra por qu\u00e9 sabes: tu experiencia, tu proceso, lo que haces diferente, lo que aprendiste. No necesitas ser experta titulada; la autoridad crece con resultados reales y constancia.\n\n## La palabra clave\nCierra con \"escr\u00edbeme [PALABRA] y seguimos por mensaje\". Puedes automatizar la primera respuesta con una herramienta como ManyChat:\n1. Conecta tu cuenta de Instagram.\n2. Crea la automatizaci\u00f3n \"comenta una palabra y recibe un mensaje\", de preferencia para tu pr\u00f3xima publicaci\u00f3n.\n3. Agrega la palabra y sus faltas de ortograf\u00eda comunes.\n4. Escribe una respuesta p\u00fablica corta y un primer mensaje c\u00e1lido.\n5. Despu\u00e9s, contin\u00faa t\u00fa la conversaci\u00f3n.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfCu\u00e1l de los cinco tipos te sale m\u00e1s natural? \u00bfCu\u00e1l evitas?\n\n## \u270d\ufe0f Ejercicio\nEscribe una pieza de cada tipo para tu nicho. P\u00eddele a tu asistente de IA que te ayude y luego aj\u00fastala: frase m\u00e1s fuerte al inicio, menos saltos de l\u00ednea, tu forma de hablar.\n\n## \u2705 Tu tarea\nPublica tu pieza tipo espejo con palabra clave.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu espejo.\n\n@@ 7 | Clase 7 | Contenido que convierte | La estructura de siete pasos\nEl contenido de conversi\u00f3n no tiene que cerrar la venta en la publicaci\u00f3n. Tiene que mover a la persona un paso hacia una decisi\u00f3n.\n\n## Cinco tipos de publicaci\u00f3n de venta\n1. Venta directa de un producto.\n2. Invitaci\u00f3n a conocer el negocio.\n3. Invitaci\u00f3n a platicar por mensaje.\n4. Un test, una gu\u00eda o un regalo para filtrar y luego recomendar.\n5. Un evento o pl\u00e1tica especial.\n\n## La estructura\n1. **Gancho:** detiene el scroll con curiosidad o identificaci\u00f3n.\n2. **Situaci\u00f3n:** lo que vive tu audiencia, para que piense \"est\u00e1 hablando de m\u00ed\".\n3. **Qu\u00e9 pasa si sigue igual:** con respeto, sin exagerar ni asustar.\n4. **Otra forma de verlo:** rompes una creencia.\n5. **Hay una salida:** el producto, el sistema o la oportunidad, sin explicarlo todo.\n6. **Prueba:** tu experiencia o un testimonio real.\n7. **Llamado claro:** \"escribe RUTINA\", \"escribe EQUIPO\".\n\n## Ejemplo\n**Gancho:** \"No necesitas maquillarte m\u00e1s; necesitas dejar de comprar sin rumbo.\"\n**Situaci\u00f3n:** \"Tienes un caj\u00f3n lleno de cosas que no usas.\"\n**Si sigue igual:** \"Sigues gastando y sigues sin sentirte lista en cinco minutos.\"\n**Otra forma de verlo:** \"El problema no es tu cara, es que nadie te arm\u00f3 una rutina para tu tipo de piel.\"\n**Salida:** \"Una rutina sencilla de 4 pasos.\"\n**Prueba:** \"Es la que uso todos los d\u00edas antes de llevar a mis hijos.\"\n**Llamado:** \"Escribe RUTINA y te digo cu\u00e1l te va.\"\n\n## Con tu asistente de IA\nPega los 7 pasos y pide: \"Con esta estructura, dame un guion para convertir a [tu clienta]\". Luego \"convi\u00e9rtelo en reel\" y \"ahora en carrusel\".\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfTus publicaciones de venta piden algo claro o solo muestran el producto?\n\n## \u270d\ufe0f Ejercicio\nLlena la **Plantilla de 7 pasos** (en Herramientas) para un producto y para el negocio.\n\n## \u2705 Tu tarea\nPublica tu pieza de conversi\u00f3n de la semana.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu gancho.\n\n@@ 8 | Clase 8 | Conversaciones que cierran | El guion de ocho pasos\nEl cierre no pasa en la publicaci\u00f3n: pasa en la conversaci\u00f3n. Y en la conversaci\u00f3n gana la que pregunta m\u00e1s y habla menos.\n\n## Los ocho pasos\n1. **Apertura humana:** \"Hola, vi que me escribiste RUTINA. Antes de decirte nada, \u00bfqu\u00e9 es lo que m\u00e1s te frustra ahorita con esto?\"\n2. **Entender su situaci\u00f3n:** \"\u00bfQu\u00e9 ya intentaste?\", \"\u00bfqu\u00e9 no te funcion\u00f3?\" Escucha; no corrijas.\n3. **Profundizar:** \"\u00bfEn qu\u00e9 momento del d\u00eda lo sientes m\u00e1s?\"\n4. **Otra forma de verlo:** \"A veces el problema no es X, es probar cosas sin un plan para tu caso.\"\n5. **Imaginar el cambio:** \"Si esto se resolviera, \u00bfqu\u00e9 cambiar\u00eda en tu d\u00eda?\"\n6. **La soluci\u00f3n:** \"Justo por lo que me cuentas, uso [producto / trabajo con este modelo].\"\n7. **Validar sin prometer de m\u00e1s:** comparte tu experiencia real. La verdad es suficiente. Prometer de m\u00e1s es la raz\u00f3n por la que la gente se va.\n8. **Invitar:** \"Si te hace sentido, te explico paso a paso\" o \"\u00bfquieres que te recomiende algo?\"\n\n## Consejos de oro\n- No expliques de m\u00e1s ni mandes audios largu\u00edsimos.\n- No des el precio sin contexto cuando hablas del negocio; en un producto sencillo, s\u00ed.\n- No intentes convencer: deja que ella llegue a su conclusi\u00f3n.\n- No necesitas hacer todas las preguntas.\n- Termina cada mensaje con una pregunta.\n- Si te deja en visto: \"Hola, quedamos pendientes. \u00bfTe sigue interesando?\"\n- Respeta un no.\n\n## La rutina 3-3-3\nCada d\u00eda: **3 historias** de conexi\u00f3n, **3 conversaciones nuevas** y **3 seguimientos** a personas interesadas.\n\n> El contenido atrae; las conversaciones venden.\n\n## \ud83e\ude9e M\u00edrate al espejo\nEn tu \u00faltima conversaci\u00f3n de venta, \u00bfqui\u00e9n habl\u00f3 m\u00e1s, t\u00fa o ella?\n\n## \u270d\ufe0f Ejercicio\nCopia el **Guion de 8 pasos** (en Herramientas) y ad\u00e1ptalo a tus palabras.\n\n## \u2705 Tu tarea\nHaz la rutina 3-3-3 durante 5 d\u00edas seguidos.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte qu\u00e9 pregunta te abri\u00f3 mejor la conversaci\u00f3n.\n\n@@ 9 | Clase 9 | Crear la necesidad sin manipular | Problema, conexi\u00f3n y soluci\u00f3n\nLa gente no compra productos: compra soluciones a algo que ya siente. Crear la necesidad no es inventarla; es ayudar a que la persona reconozca lo que ya vive.\n\n## Tres perfiles que no venden\n1. **El cat\u00e1logo ambulante:** producto, precio y descuento sin contexto.\n2. **La vendedora desesperada:** \"inscr\u00edbete conmigo, yo te apoyo\".\n3. **La fantasma t\u00edmida:** crece en seguidores pero casi no muestra lo que vende.\n\n## El orden correcto\n**Problema \u2192 conexi\u00f3n \u2192 soluci\u00f3n.** Como en una tienda: si la vendedora te aborda con \"\u00bfqu\u00e9 buscas?\", huyes; si te dice \"hace calor y esta tela es fresca\", te interesa.\n\n## La f\u00f3rmula\n1. **Nombra la situaci\u00f3n** con tanta precisi\u00f3n que tu clienta sienta que lo escribiste para ella. Usa su lenguaje, no el de un anuncio.\n2. **Explica lo que aprendiste:** por qu\u00e9 pasa, desde tu experiencia y en palabras sencillas. Nada de diagn\u00f3sticos ni explicaciones m\u00e9dicas.\n3. **Tu experiencia y un llamado suave.** Tu testimonio es el puente.\n\n## La plantilla del gancho\n> \"Las personas que [situaci\u00f3n 1], [situaci\u00f3n 2] y [situaci\u00f3n 3]\u2026 esto es para ti.\"\n\nEjemplo: \"Las mam\u00e1s que se arreglan en el coche, se maquillan en el sem\u00e1foro y nunca encuentran el labial\u2026 esto es para ti.\" No des la soluci\u00f3n en el gancho; d\u00e9jala para la descripci\u00f3n o el video.\n\n## Antes y despu\u00e9s\n- **Antes:** \"Este labial cuesta $___. Escr\u00edbeme.\"\n- **Despu\u00e9s:** \"Si a mediod\u00eda ya no queda nada de tu labial, te va a pasar lo que a m\u00ed. Me lo puse a las 7 y a las 5 segu\u00eda igual. Escribe LABIAL y te digo cu\u00e1l es.\"\n\n## Lo que no se hace\n- No prometas resultados de salud ni hables de enfermedades.\n- No \"metas el dedo en la llaga\" ni exageres el miedo.\n- No uses el dolor de alguien que est\u00e1 pasando un momento muy duro para venderle.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfTu \u00faltimo post empezaba por el producto o por la persona?\n\n## \u270d\ufe0f Ejercicio\nPara tus 4 productos favoritos, escribe 3 situaciones reales que vive tu clienta y un gancho con la plantilla.\n\n## \u2705 Tu tarea\nPublica uno, observa qui\u00e9n comenta y escr\u00edbele.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu mejor gancho.\n\n@@ 10 | Clase 10 | Tus objeciones como contenido | Lo que t\u00fa pensabas antes\nLo que t\u00fa pensabas antes de entrar, y lo que tus prospectos piensan sin decirlo, es el contenido que m\u00e1s conversaciones abre.\n\n## Por qu\u00e9 funciona\nPublicar \"libertad financiera, \u00fanete\" no hace sentir a nadie que es para ella. Publicar \"yo tambi\u00e9n pensaba que esto era una pir\u00e1mide\" genera identificaci\u00f3n: \"ella tambi\u00e9n lo pens\u00f3\".\n\n## Objeciones t\u00edpicas\n- Los productos son baratos, algo han de tener.\n- Es una pir\u00e1mide o una estafa.\n- Me da pena que me vean mis conocidos.\n- No s\u00e9 de redes; a ti la c\u00e1mara te quiere.\n- No tengo tiempo ni dinero.\n- No me quiero amarrar a una compra mensual.\n- Ya hay demasiadas mujeres haciendo esto.\n- Ya es tarde para empezar.\n- Me da pena vender.\n\n## De d\u00f3nde salen\n1. **Tu historia:** \u00bfqu\u00e9 pensabas t\u00fa antes?\n2. **Tu equipo:** historias de compa\u00f1eras, siempre con su permiso.\n3. **Tus conversaciones:** anota cada evasiva en una libreta de \"objeciones e ideas\".\n\n## Tres formatos\n1. **Responder la duda** tal cual.\n2. **Mito contra realidad.**\n3. **\"Pens\u00e9 que\u2026 luego entend\u00ed\u2026\"**: reencuadra en una l\u00ednea.\n\nResponde con honestidad: si una duda es razonable, dilo. No ataques a otras empresas.\n\n## Con tu asistente de IA\n> Act\u00faa como experta en contenido que conecta. Mi objeci\u00f3n era: [lo que pensabas]. Lo que me dec\u00eda: [...]. Lo que descubr\u00ed: [...]. Mi audiencia: [...]. Mi tono: [...]. Dame un post con foto, un guion de reel y un carrusel que haga pensar \"ella tambi\u00e9n lo pens\u00f3\". Si suena gen\u00e9rico, d\u00edmelo y aj\u00fastalo. Sin promesas de ingresos.\n\nItera hasta que suene a ti. Y no respondas comentarios con IA: se nota.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfCu\u00e1l fue tu objeci\u00f3n m\u00e1s grande antes de empezar?\n\n## \u270d\ufe0f Ejercicio\nEscribe tus 3 objeciones principales y una pieza para cada una.\n\n## \u2705 Tu tarea\nPublica hoy una pieza de objeci\u00f3n, aunque sea imperfecta.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte la objeci\u00f3n que m\u00e1s te cost\u00f3 soltar.\n\n@@ 11 | Clase 11 | Tu historia vende | Nombrar lo que la gente nunca supo explicar\nLa gente olvida lo que dijiste, pero no c\u00f3mo la hiciste sentir. En un mundo lleno de contenido, lo que te diferencia es tu historia contada desde la verdad, no desde la perfecci\u00f3n.\n\n## Lo que ya no conecta\nFrases de Pinterest, perfecci\u00f3n todo el tiempo, tono de gur\u00fa, querer impresionar.\n\n## Corregir contra nombrar\n- Vac\u00eda: \"Solo s\u00e9 aut\u00e9ntica\". Conecta: \"No es que no sepas qu\u00e9 compartir; es que exponerte te da miedo al juicio.\"\n- Vac\u00eda: \"Aprende a poner l\u00edmites\". Conecta: \"A veces dices que s\u00ed porque te da m\u00e1s miedo decepcionar que agotarte.\"\n\nLa gente se siente vista cuando describes algo que nunca hab\u00eda sabido explicar.\n\n## Tu historia en tres preguntas\n1. \u00bfQui\u00e9n era yo antes del negocio?\n2. \u00bfQu\u00e9 quer\u00eda cambiar?\n3. \u00bfQu\u00e9 estoy construyendo hoy?\n\nY para ideas m\u00e1s profundas: una emoci\u00f3n que normalmente ocultas, algo que te daba verg\u00fcenza admitir, algo que sent\u00edas y no sab\u00edas explicar.\n\n## No tiene que ser tr\u00e1gica\n\"En qui\u00e9n me tuve que convertir para sostener esto\" es una historia igual de poderosa. Comparte lo que ya procesaste, no una herida abierta.\n\n## No te fragmentes\nNo necesitas una cuenta para tu profesi\u00f3n, otra para tu maternidad y otra para tu negocio. Integra todo en una sola propuesta.\n\n## Stickers de producto en historias\n1. Usa una foto tuya del producto con fondo liso.\n2. Historias \u2192 elige tu fondo.\n3. \u00cdcono de stickers \u2192 **Recortes** \u2192 elige la foto \u2192 toca el producto.\n4. **Usar sticker.** Queda guardado para reutilizarlo.\n5. Agrega texto y **subt\u00edtulos autom\u00e1ticos** desde el mismo men\u00fa de stickers.\n\n> La confianza no se construye con perfecci\u00f3n, sino con coherencia acumulada.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfY si lo que escondes es justo lo que har\u00eda que alguien se sienta menos sola?\n\n## \u270d\ufe0f Ejercicio\nResponde las tres preguntas y convi\u00e9rtelas en una serie de historias con stickers.\n\n## \u2705 Tu tarea\nSube la serie hoy.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu respuesta a \"\u00bfqu\u00e9 estoy construyendo hoy?\".\n\n@@ 12 | Clase 12 | No necesitas ser creativa | Necesitas un sistema\nSin sistema aparece el miedo, y el miedo paraliza. La creatividad no nace de la nada: nace de observar tu vida con intenci\u00f3n.\n\n## Tres tipos de contenido\nEl que **abre la puerta** (atraer), el que **construye confianza** (conectar) y el que **invita** (convertir). No todo tiene que explotar. Si 20 personas te escuchan, caben en tu sala: son 20 oportunidades.\n\n## Cuando no sepas qu\u00e9 publicar\n- \u00bfQu\u00e9 me pasaba antes?\n- \u00bfQu\u00e9 estoy aprendiendo ahora?\n- \u00bfQu\u00e9 me daba pena y qu\u00e9 descubr\u00ed?\n- \u00bfQu\u00e9 duda tuve que otra mujer puede tener?\n\n## Cuatro f\u00f3rmulas de texto\n1. **\"Antes pensaba\u2026 ahora entiendo\u2026\"** \u2014 \"Antes pensaba que vender era insistir; ahora entiendo que es acompa\u00f1ar.\"\n2. **\"Pens\u00e9 que se trataba de\u2026 y se trata de\u2026\"** \u2014 \"Pens\u00e9 que se trataba de ser influencer; se trata de construir confianza con la persona correcta.\"\n3. **\"Si hoy te sientes as\u00ed, escucha esto\"** \u2014 \"Si hoy te da pena vender, quiz\u00e1 no necesitas vender m\u00e1s fuerte, sino conectar mejor.\"\n4. **Historia + aprendizaje + invitaci\u00f3n** \u2014 \"Cuando empec\u00e9 me daba pena hablar de productos\u2026 entend\u00ed que compartir lo que te ayuda tambi\u00e9n es servir. Si quieres aprender sin sentirte intensa, escr\u00edbeme.\"\n\n## Llamados que no suenan intensos\nConvertir es mostrar el siguiente paso, no presionar.\n- \"Si esto te hizo sentido, escr\u00edbeme.\"\n- \"Si quieres probar antes de decidir, te explico c\u00f3mo.\"\n- \"Si quieres hacerlo sin sentirte sola, b\u00fascame.\"\n\n## Tu banco de ideas\n1. Guarda cada reel que te guste.\n2. Preg\u00fantate: \u00bfpor qu\u00e9 me llam\u00f3 la atenci\u00f3n?, \u00bfqu\u00e9 emoci\u00f3n me toc\u00f3?, \u00bfqu\u00e9 dir\u00eda yo?\n3. Apunta varias ideas por reel.\n4. Lleva una libreta con conversaciones, miedos, objeciones y frases de tu d\u00eda.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfCu\u00e1ntas ideas se te fueron esta semana por no anotarlas?\n\n## \u270d\ufe0f Ejercicio\nEscribe 2 piezas con cada f\u00f3rmula: 8 en total.\n\n## \u2705 Tu tarea\nEmpieza tu banco de ideas hoy, con 10 apuntes.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu frase \"Antes pensaba\u2026 ahora entiendo\u2026\".\n\n@@ 13 | Clase 13 | Influencia que convierte | Tu voz, tu historia y tu intenci\u00f3n\nInfluir no es ser famosa: es provocar algo en alguien. Si una persona se anima por verte, ya influiste.\n\n## El apoyo llega de desconocidas\nCasi nunca son tus conocidos los que comentan. Los mensajes de \"me encanta verte, me ayuda\" llegan de gente que no conoces.\n\n## La seguridad llega despu\u00e9s\nNo antes. Tu primer video puede tomarte quince intentos. La valiente no es la que no tiene miedo, sino la que lo hace con miedo.\n\n## Lo que no convierte y lo que s\u00ed\n- **No:** puras fichas, puras selfies, solo vender.\n- **S\u00ed:** la experiencia de uso, la soluci\u00f3n a algo que se vive, tu transformaci\u00f3n contada con verdad.\n\n## Encuentra tu voz\nEst\u00e1 en lo que viviste, lo que te doli\u00f3, lo que superaste, lo que aprendiste y lo que hoy puedes ense\u00f1ar. La gente compra energ\u00eda, seguridad e identidad antes que productos.\n\n## La f\u00f3rmula\n**Gancho \u2192 historia \u2192 emoci\u00f3n \u2192 soluci\u00f3n \u2192 llamado.**\n\"Me daba miedo mostrarme, pero esconderme no me llevaba a ning\u00fan lado. Hoy mi contenido me ha dado comunidad y conversaciones nuevas. Si yo pude con miedo, t\u00fa tambi\u00e9n. Escr\u00edbeme INFO.\"\n\n## Antes de publicar, preg\u00fantate\n- \u00bfQu\u00e9 quiero que sientan?\n- \u00bfQu\u00e9 quiero que crean?\n- \u00bfQu\u00e9 quiero que hagan?\n- \u00bfC\u00f3mo quiero que se sientan despu\u00e9s de verme?\n\n## Sobre los comentarios negativos\nLo que est\u00e1s construyendo pesa m\u00e1s que la opini\u00f3n de desconocidos. Borra lo ofensivo o d\u00e9jalo pasar; no te enganches.\n\n> Cuando el prop\u00f3sito crece, el miedo baja.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfPara qui\u00e9n est\u00e1s creando: para gustarle a todos o para ayudar a alguien?\n\n## \u270d\ufe0f Ejercicio\nEscribe tu historia con la f\u00f3rmula para un carrusel.\n\n## \u2705 Tu tarea\nPubl\u00edcalo y dale seguimiento a cada \"INFO\".\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu gancho.\n\n@@ 14 | Clase 14 | Visibilidad sin miedo | El reto de siete d\u00edas\nNo est\u00e1s atorada por falta de informaci\u00f3n o de talento. Est\u00e1s evitando mostrarte. Y en este negocio, si nadie te ve, nadie conf\u00eda en ti.\n\n## Los tres miedos\n1. **Al juicio:** \"\u00bfqu\u00e9 van a decir?\", \"ya se cree influencer\".\n2. **Al rechazo:** cero likes, 200 vistas. Va a pasar; dalo por hecho.\n3. **A no ser suficiente:** que no quede perfecto, trabarte.\n\nTu mente no te sabotea: te protege. Pero el m\u00fasculo crece cuando se rompe.\n\n## Preguntas para destrabarte\n\u00bfCu\u00e1nto me cuesta hoy no mostrarme? \u00bfCu\u00e1nto tiempo m\u00e1s voy a seguir as\u00ed? \u00bfQu\u00e9 pasa si en seis meses sigo igual?\n\n## Tu m\u00e9todo\n- **Valor:** vendes el beneficio, no el producto.\n- **Acci\u00f3n imperfecta:** siempre gana.\n- **Constancia:** le gana al talento.\n- **Conversaciones:** un post solo no vende.\n- **Autenticidad:** tu historia, no la de otra.\n- **Ejemplo:** tu equipo hace lo que te ve hacer.\n- **Evoluci\u00f3n:** si est\u00e1s c\u00f3moda, te estancaste.\n\n## Cuando alguien interact\u00faa\nNo mandes el link y ya. \"Gracias por preguntar, vi que te interes\u00f3 X. \u00bfQu\u00e9 buscas resolver?\" Escucha y cierra con una pregunta.\n\n## Si tienes pocos seguidores\nImagina a tus 120 seguidores en tu sala. Con 20 ya puedes vender.\n\n## El reto de 7 d\u00edas\nCada d\u00eda, de lunes a domingo:\n- 3 historias, al menos una hablando a c\u00e1mara.\n- 3 conversaciones nuevas.\n- 1 publicaci\u00f3n con la metodolog\u00eda.\n- 1 invitaci\u00f3n a conocer tus productos o el negocio.\n\nSin presi\u00f3n de cerrar: la meta es mostrarte y conversar.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfQu\u00e9 precio est\u00e1s pagando por ser invisible?\n\n## \u270d\ufe0f Ejercicio\nEscribe la publicaci\u00f3n que llevas semanas evitando.\n\n## \u2705 Tu tarea\nHoy: publ\u00edcala, escr\u00edbele a 3 personas y sube una historia hablando a c\u00e1mara. Ma\u00f1ana empieza el reto.\n\n## \ud83d\udcac Para compartir en el grupo\nCada noche, comparte tu avance del reto.\n\n@@ 15 | Clase 15 | Edici\u00f3n para principiantes | Todas las apps tienen la misma l\u00f3gica\nNo necesitas ser dise\u00f1adora. Canva, CapCut, Edits e Instagram comparten la misma l\u00f3gica: si entiendes una, entiendes todas.\n\n## La l\u00f3gica com\u00fan\n- Creas una cuenta, eliges formato, trabajas en un lienzo y descargas.\n- **Men\u00fa principal y men\u00fa secundario:** eliges una herramienta (texto) y aparecen sus opciones (fuente, color, tama\u00f1o).\n- **L\u00ednea de tiempo** en todo lo que es video.\n- **Historial de proyectos** para volver a lo que hiciste.\n- La corona o el diamante marcan lo que es de paga.\n\nLas apps se actualizan y mueven botones, pero la l\u00f3gica no cambia. Empieza gratis y paga cuando se te quede chica.\n\n## Carrusel con la misma foto (Canva, celular)\n1. Redes sociales \u2192 Post de Instagram.\n2. Subidos \u2192 tu foto \u2192 aj\u00fastala al lienzo.\n3. Texto \u2192 escribe tu t\u00edtulo \u2192 color blanco.\n4. Duplica la p\u00e1gina tres veces.\n5. En las p\u00e1ginas 2 a 4, baja la **transparencia** de la foto y cambia el texto.\n6. Descargar \u2192 PNG \u2192 todas las p\u00e1ginas.\n\n## Video horizontal a vertical (Edits)\n1. \"+\" \u2192 elige el video.\n2. Pellizca para agrandarlo y llenar la pantalla.\n3. Si cambia el encuadre, **divide** y reacomoda cada parte.\n\n## Subt\u00edtulos\n- **Edits:** Subt\u00edtulos \u2192 revisa y corrige.\n- **CapCut:** Subt\u00edtulos autom\u00e1ticos \u2192 estilo.\n\nSi una app no te deja hacer algo, p\u00e1sate a otra. Puedes combinar varias en un mismo video.\n\n## Plantillas de CapCut\nPlantillas \u2192 busca un tema \u2192 Usar plantilla \u2192 elige tus fotos o videos \u2192 Exportar. Usa la plantilla por sus movimientos y transiciones; el contenido es tuyo.\n\n## Publicar un carrusel\n\"+\" \u2192 Publicaci\u00f3n \u2192 selecci\u00f3n m\u00faltiple \u2192 numera en orden \u2192 m\u00fasica y filtro \u2192 texto \u2192 Compartir.\n\n## Derechos\nLos recursos de Canva y CapCut se pueden usar. No descargues ni resubas videos ajenos.\n\n> Usa lo que ya est\u00e1 hecho; tu tiempo es para vender.\n\n## \u270d\ufe0f Ejercicio\nHaz el carrusel de la misma foto y un video con subt\u00edtulos.\n\n## \u2705 Tu tarea\nPublica el carrusel como tu pieza de conexi\u00f3n.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu carrusel.\n\n@@ 16 | Clase 16 | Tu paleta y tus dise\u00f1os | Color, Canva y capas\nTu marca se reconoce por repetici\u00f3n: los mismos colores, las mismas fuentes, el mismo estilo. No necesitas dise\u00f1adora; necesitas consistencia.\n\n## Tu paleta\nElige 2 o 3 colores seg\u00fan c\u00f3mo quieres que se sienta tu clienta, no solo por gusto. Como gu\u00eda (no ley):\n- **Azul:** confianza, calma.\n- **Verde:** naturaleza, frescura.\n- **Morado:** elegancia, exclusividad.\n- **Caf\u00e9 y beige:** cercan\u00eda, tradici\u00f3n.\n- **Rosa:** dulzura, feminidad.\n- **Negro:** elegancia; con dorado se ve especial.\n- **Rojo:** atenci\u00f3n; \u00fasalo para acentos y avisos reales, nunca para fingir urgencia.\n\nTu paleta tiene que ser congruente contigo: en tus fotos, tus lives y tu forma de presentarte.\n\n## Kit de marca en Canva\nMarca \u2192 Crear kit \u2192 sube tu logo o una imagen \u2192 m\u00e1ximo 3 a 5 colores \u2192 una fuente para t\u00edtulos, otra para subt\u00edtulos.\n\n## Personaliza plantillas\nPlantilla \u2192 Personalizar \u2192 aplica tu kit \u2192 cambia foto y texto. Si dos vecinos que venden cosas distintas usan la misma plantilla, se ve; hazla tuya.\n\n## Post con la foto delante del t\u00edtulo\n1. Crear \u2192 Post de Instagram (formato 3:4).\n2. Fondo de tu paleta.\n3. Sube tu foto y est\u00edrala.\n4. **Dupl\u00edcala**: a la de arriba qu\u00edtale el fondo; a la de abajo b\u00e1jale la transparencia o ponle un filtro.\n5. En **Posici\u00f3n**, pon el t\u00edtulo entre las dos fotos.\n6. Agrega un elemento difuminado si queda un corte feo.\n7. \u00daltima p\u00e1gina: fondo liso y llamado (\"Comenta LABIAL y te mando el link\").\n\n## Reglas r\u00e1pidas\n- M\u00e1ximo 2 o 3 tipograf\u00edas. Nada de cursivas en t\u00edtulos: en el celular no se leen.\n- Si no encuentras un elemento en espa\u00f1ol, b\u00fascalo en ingl\u00e9s.\n\n## \u270d\ufe0f Ejercicio\nDefine tu paleta, crea tu kit y dise\u00f1a un post con la foto delante del t\u00edtulo.\n\n## \u2705 Tu tarea\n\u00dasalo en tu pr\u00f3xima pieza de conexi\u00f3n.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu paleta y qu\u00e9 quieres transmitir.\n\n@@ 17 | Clase 17 | Tu asistente de IA con criterio | Que no suene igual que todas\nTu asistente de IA no adivina y est\u00e1 hecho para nunca quedarse callado: a veces inventa. Verifica siempre. La primera respuesta casi nunca es la buena.\n\n## El prompt en seis partes\n1. **Rol:** \"act\u00faa como estratega de contenido\u2026\"\n2. **Tarea:** escribe, resume, ordena.\n3. **Contexto:** para qu\u00e9 y para qui\u00e9n.\n4. **Formato:** lista, guion, carrusel, cu\u00e1ntas versiones.\n5. **Tono.**\n6. **Criterios:** qu\u00e9 s\u00ed y qu\u00e9 no. Agrega \"no seas complaciente\".\n\n**Pobre:** \"Hazme un post sobre mi negocio.\"\n**Bueno:** \"Act\u00faa como estratega de contenido. Escribe un post para Instagram dirigido a mujeres de 28 a 45 interesadas en crecer profesionalmente. Que despierte curiosidad, que no explique el negocio y que no suene a multinivel. Dame copy, cierre y 3 ganchos. No uses 's\u00e9 tu propia jefa' ni 'ingresos ilimitados'.\"\n\n## Cinco trucos\n1. **Que te pregunte primero:** \"Antes de escribir, hazme las preguntas que necesites, una por una.\"\n2. **H\u00e1blale:** usa el modo de voz y platica como con tu amiga.\n3. **Tu jefa exigente:** \"Revisa este texto como una mujer que ya vio demasiados mensajes. Dime qu\u00e9 est\u00e1 flojo o gen\u00e9rico y c\u00f3mo mejorarlo. S\u00e9 dura pero propositiva. No cambies mi idea.\"\n4. **Que suene a ti:** las IA repiten la muletilla \"no es X, es Y\" y todo Instagram suena igual. Pide: \"Reescr\u00edbelo cercano y natural, sin comparaciones de 'no es esto, es aquello'.\" Luego ponle tu toque.\n5. **Im\u00e1genes:** sube una foto de tus productos y pide que la analice y te diga c\u00f3mo mejorarla (luz, orden, fondo). Despu\u00e9s: \"Dame un caption, una idea de historia y un gancho a partir de esta foto.\"\n\n## Lo que no\n- No respondas comentarios con IA.\n- No uses im\u00e1genes de IA como tu foto de perfil ni para fingir resultados.\n\n## \u270d\ufe0f Ejercicio\nEscribe tu prompt base de seis partes y p\u00e1salo por tu \"jefa exigente\".\n\n## \u2705 Tu tarea\nGuarda tus 3 mejores prompts en la herramienta **Prompts con criterio**.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte un antes y despu\u00e9s de un texto mejorado.\n\n@@ 18 | Clase 18 | Contenido de recomendaci\u00f3n real | Como se lo contar\u00edas a una amiga\nEl contenido que m\u00e1s vende es el que parece una recomendaci\u00f3n real de una persona com\u00fan, no un anuncio perfecto. La gente ya no cree en la hamburguesa del comercial: cree en la foto de la rese\u00f1a.\n\n## Qu\u00e9 es\nContenido natural y cotidiano usando lo que de verdad usas. No necesitas miles de seguidores. Solo muestra productos que te gustan; si algo no te gusta, no lo promuevas aunque est\u00e9 en promoci\u00f3n.\n\n## Lo t\u00e9cnico\n- **Luz** de ventana.\n- **Audio** claro.\n- **Ritmo:** cambia de toma cada 1 o 2 segundos.\n- **Gancho** r\u00e1pido; puede ser solo un texto.\n- **Tu tono de voz**, no el de otras.\n- **Progreso, no perfecci\u00f3n:** comparte tu proceso aunque todav\u00eda no tengas resultados.\n\n## \"No tengo una vida interesante\"\nDocumenta en lugar de crear. Cada noche piensa: \"ma\u00f1ana tengo esto, esto y esto, \u00bfqu\u00e9 de eso es contenido?\".\n\n## Tipos\n- \"Ay\u00fadenme a elegir\" (como mandarle opciones a tu familia).\n- Arr\u00e9glate conmigo, sin producci\u00f3n.\n- Tu rutina de piel o maquillaje.\n- Abrir un paquete como si se lo ense\u00f1aras a una amiga.\n- Mini rese\u00f1a.\n- Voz encima de clips de tu d\u00eda.\n- \"Acomp\u00e1\u00f1ame\" con un giro: \"\u2026a una boda y se me olvid\u00f3 el maquillaje\".\n\n## La f\u00f3rmula\n**Gancho \u2192 experiencia \u2192 revelaci\u00f3n al final \u2192 llamado.** \"Prob\u00e9 este aceite que todo mundo recomienda\u2026\" y hasta el final dices cu\u00e1l es.\n\n## Ganchos f\u00e1ciles\n\"Si eres mam\u00e1, necesitas ver esto.\" \"Todo el mundo me pregunt\u00f3 por esto.\" \"Nunca me esper\u00e9 esto de\u2026\" \"No compres esto si\u2026\"\n\n## Si te pagan, dilo\nSi una marca te paga o te da producto a cambio de contenido, m\u00e1rcalo como colaboraci\u00f3n pagada con la herramienta de la red. La confianza es tu activo.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfLo que publicas se lo contar\u00edas igual a una amiga si no lo grabaras?\n\n## \u270d\ufe0f Ejercicio\nGraba 3 clips para historias: muestras el producto, lo usas platicando por qu\u00e9 te gusta, ense\u00f1as el resultado y cierras con un llamado.\n\n## \u2705 Tu tarea\nPublica un \"acomp\u00e1\u00f1ame\" con giro.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tus 3 clips.\n\n@@ 19 | Clase 19 | Historias limpias y estrat\u00e9gicas | Claridad, no perfecci\u00f3n\nEntre m\u00e1s clara seas, m\u00e1s vendes. Cada historia necesita un objetivo, una sola idea y un llamado.\n\n## Limpia contra saturada\n- **Limpia:** se entiende en 2 segundos, se ve coherente contigo, una idea por historia.\n- **Saturada:** tres o m\u00e1s tipograf\u00edas, p\u00e1rrafos largos, muchos stickers y colores que no se repiten.\n\nSi la gente tiene que esforzarse para entender, se la salta.\n\n## Checklist de 4 puntos\n1. **Identidad m\u00ednima:** 1 o 2 tipograf\u00edas, 2 o 3 colores, un estilo de texto constante.\n2. **Jerarqu\u00eda:** frase principal grande, texto secundario m\u00e1s chico, llamado peque\u00f1o pero claro.\n3. **Stickers con direcci\u00f3n:** cada uno dice qu\u00e9 hacer: tocar, responder, reaccionar.\n4. **Que respire:** no llenes la pantalla; si el fondo es ruidoso, ponle un velo.\n\n## La secuencia\n1. Estoy viviendo algo.\n2. Lo cuento: qu\u00e9 pas\u00f3.\n3. Lo que aprend\u00ed.\n4. Abro la pl\u00e1tica o pido una acci\u00f3n.\n\nHazla cada 3 d\u00edas o una vez a la semana.\n\n## Errores comunes\n- Meter todo en una sola historia.\n- Copiar estilos que no son tuyos.\n- Saturar de \"compra, est\u00e1 en descuento\" todos los d\u00edas.\n- No pedir nada.\n\n## Trucos de Instagram\n- **Color:** cuentagotas para tomar un color de la foto; bot\u00f3n \"A\" para fondo o letra de color.\n- **Capas:** mant\u00e9n presionado el texto para mandarlo delante o detr\u00e1s de un sticker.\n- **Velo:** Dibujar \u2192 marcador de punta plana \u2192 mant\u00e9n presionada la pantalla.\n- **Menciones limpias:** arrastra la etiqueta fuera de la pantalla.\n- **Pantalla verde:** filtros \u2192 busca \"Green screen\" \u2192 elige tu foto \u2192 graba hablando encima.\n- **Recortes:** stickers \u2192 Recortes \u2192 tu foto.\n- **Encuesta** para \"ay\u00fadenme a elegir\".\n\n## Horarios\nNo hay hora m\u00e1gica. Revisa en tus estad\u00edsticas cu\u00e1ndo est\u00e1 conectada tu audiencia.\n\n> Lo bonito no vende; vende la claridad. Lo bonito llega con la constancia.\n\n## \u270d\ufe0f Ejercicio\nArma una secuencia de 4 con algo que est\u00e1s viviendo hoy.\n\n## \u2705 Tu tarea\nRevisa tus historias de la semana con el checklist de 4 puntos.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu secuencia.\n\n@@ 20 | Clase 20 | Graduaci\u00f3n | Termina una versi\u00f3n de ti\nEl programa termina; tu forma de trabajar no. Ya tienes la estrategia. Ahora toca aplicarla con constancia y ense\u00f1arla.\n\n## Lo que el conocimiento pide\nConocimiento que no se ense\u00f1a se pierde. Graba tus propias capacitaciones cortas para tu equipo y gu\u00e1rdalas en un lugar donde las encuentren. Entre m\u00e1s ense\u00f1as, m\u00e1s entiendes.\n\n## Dimensiona lo que logras\n25 personas son un sal\u00f3n. 150, un evento. 3,000 vistas son un teatro lleno. No hagas peque\u00f1o lo que ya est\u00e1 pasando.\n\n## Los seguidores apapachan el ego\nImportan las conversaciones, las vistas de tu gente y las respuestas. Perder seguidores que no son tu clienta est\u00e1 bien.\n\n## Regresa\nSi no te gustan tus resultados, vuelve a la clase que te hizo clic: nicho, conexi\u00f3n, conversi\u00f3n, mensajes o visibilidad. Si algo ya funciona, dupl\u00edcalo.\n\n## Lo que hace una persona que logra\nNo espera permiso, se organiza, estudia, se prepara antes de la oportunidad, resuelve, simplifica su vida y no sostiene lo insostenible.\n\n## Lo que ya tienes\n- Tu nicho y tu perfil.\n- Tu mezcla 7-2-1 y tu laboratorio.\n- Tus cinco tipos de conexi\u00f3n y tu estructura de venta.\n- Tu guion de mensajes y tu rutina 3-3-3.\n- Tu historia, tus f\u00f3rmulas y tu banco de ideas.\n- Tus herramientas.\n\n## \ud83e\ude9e M\u00edrate al espejo\n\u00bfQu\u00e9 versi\u00f3n de ti termina hoy?\n\n## \u270d\ufe0f Ejercicio\nEscribe tu compromiso: qu\u00e9 aprendiste, qu\u00e9 vas a seguir haciendo cada semana y c\u00f3mo se lo vas a ense\u00f1ar a tu equipo.\n\n## \u2705 Tu tarea\nElige la primera clase que vas a ense\u00f1ar y ponle fecha.\n\n## \ud83d\udcac Para compartir en el grupo\nComparte tu compromiso.\n\n@@ 21 | Herramientas | Ficha de nicho y perfil | Tu base en una hoja\nLl\u00e9nala y gu\u00e1rdala. P\u00e9gala cada vez que trabajes con tu asistente de IA.\n\n## Mi nicho\n- Mi tema grande (bienestar, belleza, emprendimiento):\n- Mi tema chico (un problema):\n- \u00bfLo puedo hablar todos los d\u00edas?\n- Mi frase: \"Quiero ser conocida por ayudar a ___ que ___, que est\u00e1n cansadas de ___ y quieren ___.\"\n\n## Mi clienta\n- \u00bfC\u00f3mo se siente en su d\u00eda?\n- \u00bfQu\u00e9 ya intent\u00f3?\n- \u00bfQu\u00e9 frases usa?\n- \u00bfQu\u00e9 quiere en el fondo?\n\n## Mi perfil\n- Foto: mi cara, real, con buena luz.\n- Nombre y usuario: mi nombre.\n- Bio: qui\u00e9n soy \u00b7 a qui\u00e9n ayudo \u00b7 prueba \u00b7 llamado.\n- Link: WhatsApp \u00b7 comprar \u00b7 equipo \u00b7 sobre m\u00ed.\n- Destacadas: Empieza aqu\u00ed \u00b7 Mi historia \u00b7 Resultados \u00b7 C\u00f3mo funciona \u00b7 Tips.\n- Fijados: presentaci\u00f3n \u00b7 mi mejor contenido de valor \u00b7 testimonio.\n\n@@ 22 | Herramientas | Plantilla de 7 pasos | Para tu contenido de venta\nLlena una por producto y una para el negocio.\n\n## La plantilla\n1. **Gancho:**\n2. **Situaci\u00f3n que vive:**\n3. **Qu\u00e9 pasa si sigue igual (sin exagerar):**\n4. **Otra forma de verlo:**\n5. **Hay una salida:**\n6. **Mi prueba (experiencia o testimonio real):**\n7. **Llamado (palabra clave):**\n\n## Revisa antes de publicar\n- \u00bfSuena a m\u00ed?\n- \u00bfPrometo algo que no puedo garantizar?\n- \u00bfEl llamado es claro?\n\n@@ 23 | Herramientas | Guion de 8 pasos | Para tus mensajes\nAd\u00e1ptalo a tus palabras. No necesitas usar todos los pasos.\n\n## El guion\n1. **Apertura:** \"Hola, vi que me escribiste ___. Antes de decirte nada, \u00bfqu\u00e9 es lo que m\u00e1s te frustra ahorita con esto?\"\n2. **Situaci\u00f3n:** \"\u00bfQu\u00e9 ya intentaste? \u00bfQu\u00e9 no te funcion\u00f3?\"\n3. **Profundizar:** \"\u00bfEn qu\u00e9 momento lo sientes m\u00e1s?\"\n4. **Otra forma de verlo:** \"A veces el problema no es ___, es ___.\"\n5. **Imaginar:** \"Si esto se resolviera, \u00bfqu\u00e9 cambiar\u00eda en tu d\u00eda?\"\n6. **Soluci\u00f3n:** \"Justo por lo que me cuentas, uso / trabajo con ___.\"\n7. **Validar:** mi experiencia real, sin prometer de m\u00e1s.\n8. **Invitar:** \"Si te hace sentido, te explico paso a paso. \u00bfTe parece?\"\n\n## Seguimiento\n\"Hola, quedamos pendientes. \u00bfTe sigue interesando?\"\n\n## Rutina 3-3-3\n- 3 historias de conexi\u00f3n.\n- 3 conversaciones nuevas.\n- 3 seguimientos.\n\n@@ 24 | Herramientas | F\u00f3rmulas y banco de ideas | Para no quedarte en blanco\n## F\u00f3rmulas\n- \"Antes pensaba\u2026 ahora entiendo\u2026\"\n- \"Pens\u00e9 que se trataba de\u2026 y se trata de\u2026\"\n- \"Si hoy te sientes as\u00ed, escucha esto\u2026\"\n- Historia + aprendizaje + invitaci\u00f3n.\n- \"Las personas que ___, ___ y ___\u2026 esto es para ti.\"\n- Gancho \u2192 historia \u2192 emoci\u00f3n \u2192 soluci\u00f3n \u2192 llamado.\n- Gancho \u2192 experiencia \u2192 revelaci\u00f3n \u2192 llamado.\n\n## Preguntas para ideas\n- \u00bfQu\u00e9 me pasaba antes?\n- \u00bfQu\u00e9 estoy aprendiendo?\n- \u00bfQu\u00e9 me daba pena y qu\u00e9 descubr\u00ed?\n- \u00bfQu\u00e9 objeci\u00f3n tuve?\n- \u00bfQu\u00e9 me preguntaron esta semana?\n\n## Llamados suaves\n- \"Si esto te hizo sentido, escr\u00edbeme.\"\n- \"Si quieres probar antes de decidir, te explico c\u00f3mo.\"\n- \"Comenta ___ y te mando la info.\"\n\n@@ 25 | Herramientas | Prompts con criterio | Para tu asistente de IA\n## Prompt base\n> Act\u00faa como [rol]. Soy [qui\u00e9n] y ayudo a [clienta] con [problema]. Escribe [pieza] para [canal]. Tono [tono]. Dame 3 versiones. No uses promesas de ingresos ni de salud, ni frases como \"s\u00e9 tu propia jefa\". No seas complaciente.\n\n## Que te pregunte\n> Antes de escribir, hazme las preguntas que necesites, una por una. No empieces todav\u00eda.\n\n## Jefa exigente\n> Revisa este texto como una mujer que ya vio demasiados mensajes. Dime qu\u00e9 est\u00e1 flojo o gen\u00e9rico y c\u00f3mo mejorarlo. S\u00e9 dura pero propositiva. No cambies mi idea.\n\n## Que suene a m\u00ed\n> Reescr\u00edbelo cercano y natural, como hablo yo. Sin comparaciones de \"no es esto, es aquello\". Frases cortas.\n\n## Conexi\u00f3n\n> Dame una pieza tipo espejo para [clienta] que la haga pensar \"me ley\u00f3 la mente\". Ultraespec\u00edfica.\n\n## Objeciones\n> Mi objeci\u00f3n era [___]. Lo que descubr\u00ed fue [___]. Dame un guion de reel y un carrusel que haga pensar \"ella tambi\u00e9n lo pens\u00f3\".\n\n## Foto de producto\n> Analiza esta foto: qu\u00e9 funciona y qu\u00e9 mejorar\u00edas (luz, orden, fondo). Luego dame un caption, una idea de historia y un gancho.\n";
var FAQ_MD="## Empezar | 0\n\n### \u00bfTengo que tomar las clases en orden?\nLa primera vez te lo recomendamos: la base va primero. Pero puedes ir a cualquier clase desde el men\u00fa.\n\n### \u00bfEn qu\u00e9 se diferencia de Trazo?\nTrazo te da lo esencial para arrancar. Im\u00e1n va m\u00e1s a fondo en la estrategia: los cinco tipos de conexi\u00f3n, la estructura de venta, los guiones de mensajes, las objeciones, tu historia y la visibilidad.\n\n### \u00bfD\u00f3nde guardo mis ejercicios?\nEn el cuaderno al final de cada clase. Se guarda solo en este dispositivo y navegador. Copia lo importante a tu libreta.\n\n### \u00bfPara qu\u00e9 es la cuenta laboratorio?\nPara investigar formatos y guardar ideas sin confundir a tu cuenta de negocio. En la de negocio solo interact\u00faas con tu comunidad.\n\n## Nicho y perfil | 1\n\n### \u00bfPuedo tener dos nichos?\nElige uno como ancla. Puedes mostrar otros productos, pero tu posicionamiento es uno.\n\n### \u00bfPuedo poner el nombre de la marca en mi usuario?\nMejor no. Usa tu nombre. Tu marca personal te acompa\u00f1a aunque cambies de empresa.\n\n### \u00bfBorro mis publicaciones viejas?\nMejor arch\u00edvalas. As\u00ed limpias tu perfil sin perder tu historial.\n\n## Contenido | 5\n\n### \u00bfCu\u00e1ntas veces publico?\nAl menos una vez al d\u00eda, siguiendo la mezcla 7-2-1. Las historias van aparte, todos los d\u00edas.\n\n### \u00bfPuedo copiar un reel viral?\nToma el formato, no el video. Hazlo con tus palabras, tu espacio y un audio de la app. No descargues ni resubas contenido ajeno ni copies textos palabra por palabra.\n\n### Mi contenido de conexi\u00f3n tiene pocas vistas.\nEs normal. Ese contenido no busca vistas, busca conversaciones. Mide cu\u00e1ntos mensajes abri\u00f3.\n\n### \u00bfPuedo usar testimonios de otras?\nSolo reales y con su permiso. Nunca inventes testimonios ni cifras.\n\n## Ventas | 8\n\n### \u00bfLe doy el precio cuando me lo preguntan?\nEn un producto sencillo, s\u00ed. Para el negocio, primero pregunta qu\u00e9 busca y en qu\u00e9 momento est\u00e1.\n\n### \u00bfPuedo decir que un producto desinflama o quita algo?\nNo. Cuenta tu experiencia de uso sin prometer resultados de salud y sin hablar de enfermedades. Si alguien tiene un tema de salud, que lo vea con su m\u00e9dico.\n\n### \u00bfPuedo decir cu\u00e1nto gano?\nNo prometas ingresos ni uses cifras como gancho. Comparte tu experiencia y lo que te gusta del negocio.\n\n### \u00bfEst\u00e1 bien decir \"solo hoy\" para que se decidan?\nSolo si es verdad. Nunca inventes escasez, descuentos ni garant\u00edas.\n\n### Si una marca me paga por contenido, \u00bflo digo?\nS\u00ed. M\u00e1rcalo como colaboraci\u00f3n pagada. La confianza es tu activo m\u00e1s valioso.\n\n## El mentor | 0\n\n### \u00bfQu\u00e9 es \"Tu mentora\"?\nEs la mentora de Im\u00e1n dentro de Claude. Te da las clases una por una, revisa tu nicho y tu perfil, y te ayuda con piezas de conexi\u00f3n y venta, mensajes, objeciones y prompts.\n\n### \u00bfTengo que pagar Claude?\nNo. Funciona con la cuenta gratis de claude.ai. La cuenta gratis tiene un l\u00edmite de mensajes por d\u00eda.\n\n### \u00bfC\u00f3mo la instalo?\nDescarga la mentora (.zip) en la pesta\u00f1a Tu mentora. En Claude entra a Customize \u2192 Skills, toca \"+\", luego \"Create skill\" \u2192 \"Upload a skill\" y sube el zip sin descomprimir.\n";
