<script>
var LESSONS_MD="@@ 0 | Empieza aquí | Bienvenida a Visible | Lo que va a pasar en estos 90 días\nVisible es una temporada de 90 días para construir tu marca personal, ordenar tu contenido y aprender a vender sin sentir que persigues a nadie. Antes de empezar, conviene saber lo que va a pasar contigo en el camino.\n\n## La emoción del inicio se acaba\nTodo lo nuevo emociona. Pasa con un celular nuevo: los primeros días lo limpias, le pones funda y mica. A las semanas ya se cayó dos veces y ni lo notas. Con este curso va a pasar igual: hoy traes ganas, pero en unas semanas la emoción baja. Eso no significa que vas mal. Significa que entraste a la parte real.\n\n> No se trata de emocionarte al empezar, sino de mantenerte cuando nadie te está aplaudiendo.\n\n## Tu cerebro te va a querer regresar\nTu mente está hecha para protegerte de lo incómodo y lo desconocido. Por eso, cuando empiezas algo nuevo, aparecen frases como \"esto no es para ti\", \"das pena\", \"nadie te ve\", \"otra vez vas a fallar\". Hasta el cuerpo se queja, como cuando vuelves al gimnasio. Cuando lo notes, dilo así: \"mi mente está haciendo su trabajo; yo voy a hacer el mío\". Y avanza con todo y miedo.\n\n## Tres cosas que te sostienen\n- **Resiliencia:** levantarte rápido de un mal día. Ya lloraste, ya dudaste; mañana vuelves a grabar. En días difíciles pregúntate \"¿qué sí puedo hacer hoy?\" en lugar de \"¿por qué no puedo?\".\n- **Disciplina:** hacer lo que dijiste, aunque no tengas ganas. Poquito, pero diario. Y cero negociaciones contigo misma del tipo \"nadie se va a dar cuenta si hoy no publico\".\n- **Enfoque:** poner tu energía en lo que importa. La dueña de un negocio no está disponible para todo ni para todos.\n\n## Compórtate como la dueña que quieres ser\nHaz una lista de cómo es la dueña de negocio que quieres llegar a ser: a qué hora se levanta, cómo se arregla, qué consume, cómo organiza su semana, cómo trata a su equipo. No le pongas tu nombre todavía. Después marca, sin juzgarte, cuáles de esas cosas ya haces. Empieza a comportarte como ella desde hoy, no \"hasta que\" llegue el resultado.\n\n## Celebra acciones, no likes\nDurante estos 90 días no vas a celebrar que un video se hizo viral. Vas a celebrar que cumpliste tus publicaciones de la semana, que contaste tu historia, que tuviste una conversación difícil. El resultado llega como consecuencia.\n\n## 🪞 Mírate al espejo\n¿Qué frases te dice tu mente cuando empiezas algo nuevo? ¿Cuál es la que más te frena?\n\n## ✍️ Ejercicio\n1. Escribe tu **gran objetivo de 90 días**. Que te saque de tu zona cómoda, pero que sea alcanzable.\n2. Define **3 acciones innegociables** que vas a hacer cada semana.\n3. Escribe tu **plan de rescate**: qué vas a hacer el día que te caigas para levantarte al día siguiente.\n4. Anota **3 cosas que vas a dejar de hacer** porque te dispersan.\n\n## ✅ Tu tarea de la semana\nAgenda en tu calendario un bloque fijo para el curso y otro para crear contenido, como si fueran juntas de trabajo.\n\n## 💬 Para compartir en el grupo\nComparte tu objetivo de 90 días y tus 3 innegociables. Que el equipo te los recuerde.\n\n@@ 1 | Clase 1 | Los planos de tu marca | Qué estás construyendo y para qué\nSi no sabes qué estás construyendo, a la mitad del camino vas a querer cambiar todo. Esta clase es para dibujar los planos antes de poner ladrillos.\n\n## Tu negocio es un reflejo de ti\nAntes de pensar en estrategias, piensa en ti. Tu negocio crece hasta donde creces tú. Si construyes desde la carencia, la prisa o la herida, se nota. Si construyes desde tu propósito, también se nota.\n\n## ¿Qué estás construyendo?\nNo es lo mismo construir una **marca personal**, una **comunidad**, una **empresa** o solo **presencia en redes**. Las cuatro son válidas, pero cada una pide cosas distintas. La pregunta incómoda: lo que haces hoy, ¿tiene forma o solo te mantiene ocupada?\n\n## Los planos de la casa\nImagina tu marca como una casa. ¿Es una casa de un piso, de dos, una cabaña, un hotel? Si no tienes planos, a la mitad vas a decir \"mejor quiero la cocina del otro lado\" o \"mejor sí quería alberca\", y vas a perder tiempo, dinero y energía. Los planos no son tu meta: son tus valores y la raíz de lo que construyes (autenticidad, disfrutar el proceso, libertad, viajar con tu familia).\n\n## Una meta que puedas creer\nPon una meta de dinero retadora, pero congruente con lo que haces hoy. Si hoy no facturas nada, una meta enorme te va a desmotivar porque no la vas a ver cerca. Y habla de dinero con naturalidad: estás construyendo un negocio, no un pasatiempo.\n\n> La distancia entre lo que dices que quieres y lo que haces cada día es el camino más corto a la frustración.\n\n## El costo escondido de construir sin plan\nPublicar y publicar sin rumbo te lleva a improvisar, compararte, perder energía, desconectarte de tu audiencia y terminar agotada sin vender. Por eso esta parte introspectiva va primero: después, ejecutar es lo fácil.\n\n## Tu negocio como sistema\nPiensa en tu negocio como un sistema con cinco piezas:\n1. **Una marca clara:** tus valores y lo que proyectas.\n2. **Tu oferta:** el producto, servicio o negocio que vendes.\n3. **La audiencia correcta:** las personas a las que de verdad les interesa.\n4. **Tu rutina de contenido:** qué, cuándo y cómo publicas.\n5. **Una mente resiliente** que sostenga todo lo anterior.\n\nCon un sistema, el primer \"no\" no te tumba. Sin sistema, cualquier piedra te saca del camino.\n\n## 🪞 Mírate al espejo\n¿Tus hábitos de hoy muestran que tu marca es una prioridad en tu vida?\n\n## ✍️ Ejercicio\n1. Responde: ¿estoy construyendo una marca personal, una comunidad, una empresa o presencia digital?\n2. Dibuja los planos de tu casa, como lo haría una niña. A cada cuarto ponle un valor o una razón de ser.\n3. Completa la frase: \"Estoy construyendo ________ para ________.\"\n\n## ✅ Tu tarea de la semana\nToma foto de tus planos y ponlos donde los veas todos los días.\n\n## 💬 Para compartir en el grupo\nComparte tu frase \"Estoy construyendo… para…\" y, si te animas, la foto de tus planos.\n\n@@ 2 | Clase 2 | Las bases de una marca que vende | Autoridad, propuesta de valor y tu forma de ser\nHay cuentas que no venden un peso y cuentas que venden todos los días. La diferencia casi nunca son los seguidores: es qué tanto te ven como alguien que sabe del tema.\n\n## Catálogo o autoridad\nSi tu cuenta es un catálogo de productos, solo vas a pescar a quien ya tenía urgencia de comprar. Cuando apareces tú, enseñas, muestras cómo lo usas y por qué lo elegiste, la gente te tiene en la mente todo el tiempo, no solo cuando necesita el producto. Esa es la magia de la marca personal.\n\n## Base 1: claridad de tu modelo de negocio\nResponde sin titubear:\n- ¿Qué vendes?\n- ¿A quién se lo vendes?\n- ¿Cómo lo entregas?\n- ¿Cuánto cuesta, cuánto ganas y cuánto reinviertes?\n\nSi no sabes tu margen, es muy difícil crecer.\n\n## Base 2: tu propuesta de valor\n¿Por qué tú, por qué ahora y por qué no alguien más? En venta directa, muchas venden el mismo producto al mismo precio. Lo único distinto eres tú: tu esencia, lo que sabes, cómo acompañas, tu forma de ver la vida.\n\n## Base 3: humanizar tu marca (bien hecho)\nHumanizar **no** es:\n- Hablar sin parar a la cámara.\n- Contar tus desgracias sin dejar ninguna enseñanza.\n- Aparecer solo cuando estás de buenas y desaparecer semanas.\n\nHumanizar **sí** es compartir lo que vives con un mensaje al final. Si tuviste un día terrible, no te quedes en la queja: cuenta qué aprendiste. Y es mantenerte constante en los buenos y en los malos días.\n\n> Antes de compartir algo personal, pregúntate: ¿qué quiero aportar con esto?\n\n## Conócete para comunicar\nTu marca refleja tu personalidad. Hay cuatro estilos naturales (los vas a encontrar en la herramienta **Test de tu estilo**): La Líder, La Chispa, La Arquitecta y La Cálida. Ninguno es mejor. Conocer el tuyo te ayuda a usar tus fortalezas y a no autosabotearte con tus puntos débiles.\n\n## ¿Qué quieres que sientan?\nDos cuentas pueden tener el mismo nicho y el mismo objetivo, pero provocar emociones opuestas. Una confronta (\"levántate media hora antes, deja de justificarte\"); otra abraza (\"tranquila, mañana es otro día\"). Decide qué emoción quieres que sienta alguien al entrar a tu perfil.\n\n## Mentalidad de directora\nTu tiempo, tus ideas y tu contenido son activos de tu negocio, no un hobby. Crear contenido es parte de tu trabajo, como contestar a tus clientas.\n\n## 🪞 Mírate al espejo\nSi alguien entra hoy a tu perfil, ¿ve un catálogo o ve a una persona que sabe y acompaña?\n\n## ✍️ Ejercicio\n1. Responde las 4 preguntas de tu modelo de negocio.\n2. Escribe en 3 líneas por qué alguien debería comprarte a ti y no a otra que vende lo mismo.\n3. Elige la emoción principal que quieres provocar en tu perfil.\n\n## ✅ Tu tarea de la semana\nHaz el **Test de tu estilo** en Herramientas y escribe una fortaleza que vas a usar y un reto que vas a cuidar.\n\n## 💬 Para compartir en el grupo\n¿Qué estilo te salió y qué emoción quieres provocar en tu perfil?\n\n@@ 3 | Clase 3 | Tu nicho y tu tribu | A quién viniste a servir\nSi le hablas a todo el mundo, no le hablas a nadie. Esta clase es para saber exactamente a quién le hablas y qué problema le resuelves.\n\n## Tu nicho es tu yo del pasado\nUna forma sencilla de encontrar tu nicho: piensa en ti antes de resolver el problema que hoy ya tienes resuelto. ¿Cómo te sentías? ¿Perdida, frustrada, cansada, insegura? A esa mujer es a la que le hablas. Le puedes decir con autoridad \"yo tengo el camino para salir de ahí\", porque tú ya estás del otro lado.\n\n## No vendes productos, vendes lo que provocan\nSi vendes belleza, no te quedes en \"vendo productos\" ni en los ingredientes. Nadie anda por la vida buscando ingredientes: busca sentirse mejor. Pregúntate qué te hizo sentir a ti ese producto: seguridad, ganas de cuidarte, volver a mostrarte. Ahí está tu nicho.\n\n## Tu producto, dentro de tu vida\nEl nicho no es una jaula. Puedes compartir tu vida (rutina, viajes, maternidad, ejercicio, espiritualidad) siempre que conectes tu producto con ella:\n- Si vendes joyería y te gusta viajar: cómo organizas tus piezas en la maleta.\n- Si te encanta tu matrimonio: los cinco regalos que te gusta recibir, y uno es joyería.\n- Si vendes cuidado personal: tu rutina real, cómo empacas los pedidos, el día que te equivocaste de caja y esa clienta se volvió tu amiga.\n\n> Instagram y TikTok están hechos para entretener. La pregunta es: ¿cómo hago que mi contenido entretenga y termine en una venta?\n\n## Construye una tribu\nLas personas buscan pertenecer. Una tribu se identifica, se apoya y se queda contigo por mucho tiempo. Tu nicho no es solo quien te compra; es quien quieres que se vuelva fiel a ti.\n\n## No le vas a gustar a todos (y está bien)\nGustarle a todo el mundo es señal de que no estás comunicando con claridad. Si a alguien no le gusta tu contenido, no es personal: probablemente no eres para esa persona.\n\n## Que sea rentable\nElige un nicho que pueda pagar lo que ofreces. Y uno que disfrutes tanto que lo harías aunque no te pagaran.\n\n## 🪞 Mírate al espejo\n¿Qué problema tenías antes que hoy ya tienes resuelto gracias a tu negocio?\n\n## ✍️ Ejercicio\nLlena la **Ficha de tu clienta ideal** (en Herramientas). Sobre todo la tabla del antes y el después: qué tiene, qué siente, cómo es su día y cómo se ve antes y después de conocerte.\n\n## ✅ Tu tarea de la semana\nRevisa tus últimas 9 publicaciones: ¿le hablan a tu clienta ideal o a todo el mundo? Marca cuáles sí y cuáles no.\n\n## 💬 Para compartir en el grupo\nDescribe a tu clienta ideal en tres líneas y que el equipo te diga si le queda claro.\n\n@@ 4 | Clase 4 | Fuego lento | Paciencia con estrategia\nVivimos queriendo todo en 30 segundos. Pero un negocio que dura no se cocina en el microondas: se cocina a fuego lento.\n\n## Fuego rápido vs fuego lento\nCon **fuego rápido** quieres resultados ya: el reel con miles de comentarios, ventas la primera semana, multiplicar tu negocio en un mes. Y cuando no pasa, te frustras y lo dejas. Con **fuego lento** sabes que tardas más, pero estás usando buenos ingredientes, y lo que sale vale la pena.\n\n> Lo viral entretiene. Lo constante transforma.\n\n## Señales de fuego rápido\n- Te frustras si un contenido no pega.\n- Lanzas todo sin estrategia.\n- Te saltas clases porque \"eso ya lo sé\".\n- Necesitas que tu familia o tus amigas te feliciten.\n- Cambias de idea de negocio cada semana o cada quince días.\n\nSobre la validación: no esperes aplausos de tu círculo cercano. Muchas veces el reconocimiento llega primero de desconocidos. La satisfacción más grande está en lo que haces en privado.\n\n## El ciclo del trabajo profundo\n1. **Visión clara:** si todavía titubeas sobre a dónde vas, regresa a la Clase 1.\n2. **Planificación:** qué hábitos y rutinas te llevan al resultado. Incluso a qué hora te bañas y arreglas, para que cuando prendas la cámara ya estés lista.\n3. **Acción enfocada:** decide en qué momentos usas el celular para trabajar y en cuáles te das permiso de distraerte.\n4. **Revisión y repetición:** revisa qué funciona, ajusta y repite. Sin repetición no hay resultado.\n\n## Cinco pasos para cambiar de fuego\n1. No mires atrás con culpa por el tiempo perdido; mira hacia adelante.\n2. Celebra los avances pequeños.\n3. Empieza con cambios chiquitos: levantarte 30 minutos antes, dejar tu ropa lista, bañarte antes de llevar a los niños.\n4. Diseña rutinas que puedas sostener (dos hojas de un libro al día es mejor que prometer un libro por semana).\n5. Antes de consumir, crea.\n\n## 🪞 Mírate al espejo\n¿Dejas cosas a la mitad? ¿Lanzas desde el miedo, desde la aprobación o desde una visión clara?\n\n## ✍️ Ejercicio\n1. Marca cuántas señales de fuego rápido tienes.\n2. Escribe una rutina diaria sencilla y alcanzable para tu negocio (máximo 4 acciones).\n3. Define tu momento sin distracciones de cada día.\n\n## ✅ Tu tarea de la semana\nSigue tu rutina 5 días seguidos y anota cómo te fue cada día.\n\n## 💬 Para compartir en el grupo\n¿Cuál es la señal de fuego rápido que más te identifica y qué vas a cambiar?\n\n@@ 5 | Clase 5 | Tu historia | Storytelling que conecta y posiciona\nNo te puedo hablar de vender ni de crear contenido antes de que tengas tu historia. Si no dominas tu historia, la gente se pierde en tu mensaje.\n\n## No tiene que ser trágica\nTu historia no necesita ser la más dramática del mundo. Necesita tener un problema resuelto y una razón fuerte de ser. A veces lo más pequeño es lo más poderoso: alguien que antes no podía tomarse su café con calma y hoy sí.\n\n## ¿Qué historia de tu vida conecta con lo que haces?\nVe al fondo. No \"porque el producto era bueno\". Tal vez creciste viendo a tu mamá en venta directa, o emprendiste para estar con tus hijos, o porque no querías depender de nadie, o porque un jefe te hizo sentir que no valías. Ahí está el origen de tu propósito.\n\n## Tres dolores resueltos\nEscribe tres dolores que tenías hace tiempo y que hoy ya resolviste, aunque sean pequeños: \"era insegura\", \"me estresaba el dinero\", \"no estaba presente con mis hijos\". Estos dolores son los que te posicionan, porque tienes algo real que contar.\n\n## La estructura\n1. **Antes:** cómo era tu vida, qué sentías, qué te faltaba.\n2. **Lo que dolía de verdad:** el dolor silencioso detrás de lo obvio.\n3. **El giro:** qué descubriste, cómo llegó la oportunidad, qué decidiste.\n4. **Hoy:** cómo es tu vida ahora. Con datos, si puedes (las mentes más analíticas confían en números).\n5. **La invitación:** a quién invitas y qué le pides que haga.\n\n> Las historias que más conectan tienen la herida sanada. Se cuentan desde la transformación, nunca desde el papel de víctima.\n\n## Una historia, muchas veces\nTu historia no se cuenta una vez y ya. Se cuenta muchas veces y en muchos formatos: un reel, un carrusel, historias, un live. A veces con más detalle, a veces con menos, pero siempre la misma historia, congruente. Si un día cuentas que tuviste poco dinero y otro día que viajabas todo el tiempo, la gente deja de creerte.\n\n## Si haces venta directa\nSi vendes producto y también formas equipo, enfoca la mayor parte de tu historia en lo que el negocio cambió en tu vida y la menor parte en el producto. Tú eres la prueba: tu estilo de vida vende más que una ficha técnica.\n\n## Cómo grabarla\n- Vertical, con luz natural de frente, sin filtros.\n- Cámara fija y centrada (un tripié o unos libros).\n- Habla claro y con energía. Unos audífonos con micrófono sirven.\n- Agrega escenas de apoyo: tú trabajando, con tu familia, en una videollamada.\n- Arréglate como si te fuera a ver alguien que te puede cambiar la vida.\n- No esperes a sentirte lista. Puedes practicar antes y repetir cuantas veces quieras.\n\n## Limpieza digital\nAntes de contar tu historia, limpia tu entorno: deja de seguir cuentas que no te aportan, silencia historias que te distraen y conviven más con las cuentas que sí te inspiran.\n\n## 🪞 Mírate al espejo\n¿Cuál fue el momento exacto en que decidiste emprender? ¿Qué estabas viviendo?\n\n## ✍️ Ejercicio\nEscribe tu historia con la **Plantilla de tu historia** (en Herramientas). Que puedas contarla en un minuto.\n\n## ✅ Tu tarea de la semana\nGraba y publica tu historia en un reel hablado a cámara. Bonus: un carrusel de antes y después con fotos de esa etapa y de hoy.\n\n## 💬 Para compartir en el grupo\nComparte tu reel y comenta el de otra compañera.\n\n@@ 6 | Clase 6 | Tus pilares de contenido | Dejar de improvisar\nSi publicas mucho y no avanzas, probablemente no es falta de esfuerzo, sino de dirección. Los pilares son los temas fijos que guían tu contenido cada semana.\n\n## Qué reflejan tus pilares\n1. Lo que sabes o has vivido.\n2. Lo que tu audiencia necesita o desea.\n3. Lo que te posiciona para vender.\n\n## Los cuatro pilares\n- **Educativo:** enseñas. Tips, errores comunes, tutoriales, \"te enseño cómo\". Es el que menos alcance tiene, pero el que más rápido te posiciona como autoridad. Cuando tu clienta ideal entra a tu perfil, esto es lo que la convence. Y no temas regalar conocimiento: entre más valor das, más seguridad tienen de comprarte.\n- **Inspiracional:** cuentas tu historia en pedacitos, tus aprendizajes, tu estilo de vida. Que la gente diga \"tiene una vida que quiero y me siento identificada con ella\".\n- **Entretenimiento:** la gente entra a redes a pasarla bien. Tendencias adaptadas a tu nicho, humor, historias cotidianas. Es el que más tráfico te trae.\n- **Venta:** qué ofreces, para quién, cómo y cuándo. Aquí invitas a la acción.\n\n> No todos los días vas a vender, pero todos los días construyes percepción.\n\n## Cómo repartirlos\nUna semana de 4 publicaciones puede verse así:\n- Lunes: educativo.\n- Martes: estilo de vida o entretenimiento.\n- Jueves: educativo o inspiracional.\n- Domingo: venta.\n\nComo referencia, cerca de 40% educativo, 40% estilo de vida y entretenimiento y 20% venta. Ajusta según lo que veas que funciona con tu audiencia. Prueba primero publicar en la mañana y luego en la noche, y quédate con el horario que mejor te funcione.\n\n## Errores comunes\n- Copiar tal cual a otras cuentas.\n- Cambiar de pilares por aburrimiento o porque las primeras semanas no funcionaron.\n- Elegir pilares solo porque tienen más likes. Los likes no son ventas.\n- Querer hacer todos los pilares el mismo día.\n\n## Si no sabes qué enseñar\nAliméntate todo el tiempo: libros, podcasts, cursos, tu propia experiencia. Una marca con autoridad siempre tiene algo nuevo que dar.\n\n## 🪞 Mírate al espejo\nDe tus últimas 10 publicaciones, ¿cuántas fueron de cada pilar?\n\n## ✍️ Ejercicio\n1. Ponle nombre propio a cada uno de tus 4 pilares.\n2. Para cada uno responde: ¿por qué lo elegí? y ¿qué quiero que sienta o aprenda mi comunidad?\n3. Escribe **10 ideas de contenido** por pilar.\n\n## ✅ Tu tarea de la semana\nPublica 4 contenidos, uno de cada pilar.\n\n## 💬 Para compartir en el grupo\nComparte tus 4 pilares con su nombre.\n\n@@ 7 | Clase 7 | Formatos y grabación | Cómo lo dices también comunica\nEl formato es el puente entre tu idea y la pantalla. Es lo que le pone tu sello a la estrategia.\n\n## No dejes que la IA elija por ti\nPuedes apoyarte en inteligencia artificial, pero el formato tiene que salir de ti, de tu personalidad y de tu entorno. Si encuentras el formato que le gusta a tu audiencia, puedes usarlo mucho tiempo.\n\n## Formatos para probar\n- Video hablado a cámara.\n- Vlog con varias escenas.\n- Voz en off sobre escenas tuyas.\n- Videos cortos de 4 a 6 segundos con un texto que enganche y una descripción larga.\n- Carruseles fáciles de leer.\n- Tendencias adaptadas a tu nicho, solo si las dominas.\n\nElige un formato principal para perfeccionarte y complementa con formatos sencillos que dan alcance por sí solos. Si todavía no editas bien, edita menos pero bien.\n\n## Tu banco de escenas\nGrábate todos los días dos o tres clips de tu estilo de vida que sumen a tu mensaje: tu café, leyendo, trabajando, con tus hijos, arreglándote, empacando pedidos. Ese banco te va a salvar los días sin ideas. Si hablas de libertad, necesitas escenas que proyecten libertad.\n\n## Una historia al mes\nAl menos una vez al mes cuenta algo de ti, de tu forma de ver la vida o de tu porqué, en video o en carrusel.\n\n## Tips de grabación\n- Usa la **cámara trasera**: tiene mucha mejor calidad.\n- El lente gran angular (0.5) te sirve para grabarte sola desde arriba o desde abajo.\n- **Limpia el lente** antes de grabar. Siempre.\n- Cambia algo cada 5 segundos: ángulo, acercamiento o texto.\n- Si hablas, la música va muy bajita.\n- Fondo **limpio y ordenado**. No tiene que ser estético, pero sí ordenado.\n\n## Activa tu ojo de creadora\nCuando estés en redes, no consumas como espectadora: observa cómo se graban, qué luz usan, qué ángulos y qué ritmo tienen los videos que te gustan.\n\n## 🪞 Mírate al espejo\n¿Con qué formato te sientes más tú?\n\n## ✍️ Ejercicio\n1. Elige tu formato principal y dos formatos de apoyo.\n2. Haz una lista de 10 escenas de tu vida que sumen a tu mensaje.\n\n## ✅ Tu tarea de la semana\nGraba diario dos o tres clips para tu banco de escenas.\n\n## 💬 Para compartir en el grupo\n¿Qué formato vas a dominar estos 90 días?\n\n@@ 8 | Clase 8 | Tu sistema de contenido | Organizar, planear y usar la IA a tu favor\nNo existe una marca personal sostenible sin contenido planeado. Esta clase es para dejar de crear según tu humor.\n\n## Lo que no puedes hacer\n- Ir al día.\n- Improvisar.\n- Depender de las tendencias.\n- Crear solo cuando tienes ganas.\n\n## Lo que sí necesitas\nOrden, sistema, claridad y anticipación. Elige la herramienta que te dé menos fricción (un tablero tipo Trello, Notion, tu calendario o una libreta).\n\n## Cada contenido, con cuatro piezas\n1. **Concepto:** la idea general y por qué importa.\n2. **Contenido:** el guion o los puntos del video, carrusel o post.\n3. **Hook:** la primera frase que evita el scroll.\n4. **Descripción:** el texto que acompaña la publicación, con su llamado a la acción.\n\n## La IA como asistente, no como cerebro\nLa inteligencia artificial responde al nivel de las instrucciones que le das. Para que te sirva:\n1. **Preséntate primero:** quién eres, qué vendes, quién es tu audiencia, cómo hablas, tu objetivo actual y qué necesitas siempre (por ejemplo, un llamado a la acción al final).\n2. **Dile qué estás creando:** el tipo de contenido, el objetivo, el tono y la estructura (hook, desarrollo, cierre).\n3. **Pide opciones** y corrige: \"más corto\", \"más cálido\", \"más directo\".\n4. **Divide lo grande:** en lugar de \"hazme un mes de contenido\", empieza por una semana.\n\nTú eres la mente creativa; las herramientas son el canal. Revisa siempre que suene a ti.\n\n## Cuentas faro\nElige de 3 a 5 cuentas que te inspiren y estén alineadas contigo. No para copiarlas, sino para observar su estructura, temas y estilo, y traducirlo a tu voz. Úsalas cuando no sepas qué publicar o sientas que nada funciona.\n\n## 🪞 Mírate al espejo\n¿Cuántas veces esta semana publicaste algo que se te ocurrió ese mismo día?\n\n## ✍️ Ejercicio\n1. Arma tu presentación para la IA (usa la herramienta **Prompts para tu contenido**).\n2. Elige tus 3 a 5 cuentas faro y escribe qué te inspira de cada una.\n\n## ✅ Tu tarea de la semana\nPlanea una semana completa de contenido con sus cuatro piezas, antes de que empiece la semana.\n\n## 💬 Para compartir en el grupo\nComparte una de tus cuentas faro y qué vas a adaptar a tu estilo.\n\n@@ 9 | Clase 9 | Edición básica | Que lo esencial esté bien hecho\nNo necesitas mil efectos. Necesitas que lo básico te sume. Todo esto se puede hacer en CapCut desde el celular.\n\n## 1. Mejora la luz\nAntes de editar nada, ajusta el video completo: un poco más de brillo, un poco menos de contraste, un poco más de saturación y de luminosidad. Si el audio tiene ruido, usa la opción de reducir ruido.\n\n## 2. Recorta los silencios\nCorta exactamente donde terminas una frase y donde empiezas la siguiente. Que casi no haya respiración entre una idea y otra: eso atrapa la atención. Quita las partes donde te trabaste o donde se ve algo desordenado.\n\n## 3. Acercamientos\nHaz un acercamiento cada 5 o 6 segundos o cuando digas algo importante. Le da movimiento a un video grabado en un solo ángulo. Para que funcione, grábate con un poco de distancia.\n\n## 4. Textos con palabras clave\nLos subtítulos completos ya no se usan tanto. Mejor pon en pantalla solo las palabras clave o la pregunta del inicio. Una sola tipografía fácil de leer, centrada, sin colores raros. Que el texto dure lo mismo que tardas en decirlo.\n\n## 5. Sonidos y música\nEfectos de sonido discretos en los momentos clave (una palabra importante, una transición). Música de fondo como máximo al 10% del volumen cuando hablas.\n\n## 6. Retoque, no filtro\nSi quieres mejorar tu piel, usa el retoque con mucha moderación (suavizado alrededor de 10 a 15%). Los filtros que te cambian la cara se ven falsos y además pueden darte problemas para pagar publicidad.\n\n> Más vale un video sencillo y limpio que uno lleno de efectos sin buen gusto.\n\n## 🪞 Mírate al espejo\n¿Qué te frena más de editar: el tiempo, la técnica o el perfeccionismo?\n\n## ✍️ Ejercicio\nToma un video que ya tengas y aplícale los 6 pasos.\n\n## ✅ Tu tarea de la semana\nEdita y publica dos videos con luz, recortes, acercamientos y palabras clave.\n\n## 💬 Para compartir en el grupo\nComparte el antes y el después de tu edición.\n\n@@ 10 | Clase 10 | Creatividad y bloqueos | Cuando ya no sabes qué subir\nEs normal que a mitad del camino te bloquees. Lo que no es normal es quedarte ahí.\n\n## La creatividad se entrena\nLa creatividad es la capacidad de convertir tus ideas y experiencias en algo original. No es solo para artistas ni es estar eufórica todo el tiempo. Se alimenta de la curiosidad (como la de un niño que hace diez preguntas de camino a la escuela) y de conocerte a ti misma.\n\n> Creer que no eres creativa es el primer bloqueo. Sí lo eres.\n\n## Conectar contigo\nDel 1 al 10, ¿qué tan conectada estás contigo hoy? Vivir en piloto automático por mucho tiempo apaga la creatividad. Conocerte, saber qué sientes y por qué, es la base para crear desde un lugar auténtico.\n\n## Los tres bloqueos\n- **Mental:** perfeccionismo, querer cumplir expectativas de alguien que ni existe, falta de claridad, exceso de información sin aplicar y compararte.\n- **Emocional:** estrés, ansiedad por el futuro, desmotivación, miedo a la crítica, agotamiento. Aquí toca ser amable contigo. Y si sientes ansiedad o tristeza fuertes por mucho tiempo, busca ayuda profesional: eso va primero que cualquier contenido.\n- **De hábitos:** procrastinar, no tener rutina, levantarte tarde, no organizarte, vivir en sesiones de aprendizaje sin ejecutar. Este depende cien por ciento de ti: tu palabra es un contrato.\n\n## Cómo salir\n1. **Autocompasión:** sé amable contigo; los bloqueos son parte del proceso.\n2. **Metas pequeñas:** un microhábito a la vez.\n3. **Una rutina** que te mantenga con energía.\n4. **Descansos reales**, lejos del celular, no viendo TikTok.\n5. **Nuevas fuentes de inspiración:** libros, películas, caminar, un parque.\n6. **Tu tribu:** habla con otras personas que estén creando. No vas a encontrar la creatividad donde la perdiste: cambia de lugar.\n\n## Hacks inmediatos\n- **Vaciado mental:** escribe todo lo que tienes en la cabeza durante unos minutos, sin filtro.\n- **Lluvia de 20 ideas:** diez minutos para anotar al menos 20 ideas sin juzgarlas. Las primeras suelen ser obvias; las buenas aparecen después de la sexta.\n- **Libreta siempre a la mano** para lo que se te ocurra.\n- **Descarta lo obvio:** si es lo primero que se le ocurriría a cualquiera (o a la IA), estírate un poco más.\n\n## 🪞 Mírate al espejo\n¿Cuál de los tres bloqueos te visita más seguido?\n\n## ✍️ Ejercicio\nHaz una lluvia de 20 ideas sobre el reto más grande de tu negocio hoy.\n\n## ✅ Tu tarea de la semana\nPublica un reel donde tu creatividad sea la protagonista: en otro lugar, con otro ángulo, bailando, cantando o con algo que nunca hayas probado.\n\n## 💬 Para compartir en el grupo\nComparte tu reel creativo y cuenta de dónde salió la idea.\n\n@@ 11 | Clase 11 | Vender es servir | Tu relación con las ventas y tu convicción\nSi la palabra \"vender\" te incomoda, esta clase es para ti. Antes de técnicas, hay que sanar la relación con vender.\n\n## Siempre te has vendido\nTe vendes al pedir un trabajo, al hacer amigas, en una relación. Todos los días comunicas por qué vale la pena elegirte. Vender no es forzar: es ayudar a alguien a tomar una buena decisión con algo en lo que tú crees.\n\n> ¿Cómo cambiaría tu mensaje si tu objetivo fuera servir y no solo cobrar?\n\n## La convicción vende antes que tus palabras\nPuedes tener el mejor guion del mundo, pero si no crees en lo que vendes, se nota. La gente compra porque confía en ti y en cómo la haces sentir. La convicción no es gritar ni actuar: es la energía que sale cuando hablas de algo que usas, amas y te ha funcionado. Si tú no eres prueba de tu producto, cuesta venderlo. Y si de verdad dudas de lo que vendes, es de valientes reevaluar.\n\n## Tu lenguaje no verbal\nTu postura, tu mirada, tu voz y tu imagen hablan antes que tú. Hombros atrás, voz firme, mirada a los ojos, presentable. Cuidar tu alimentación, tu descanso y moverte también se nota en tu energía.\n\n## Los tres miedos\nRechazo, juicio y fracaso. Son los que más hacen que una mujer abandone. No se evaden: se atraviesan. Cuando te callas por miedo, le regalas tu poder, dejas de construir credibilidad y pierdes oportunidades. Para atravesarlos:\n1. **Nómbralo:** escribe qué temes exactamente y cuál sería el peor escenario. Ponerle palabras le quita peso.\n2. **Abrázalo:** acepta lo que sientes sin pelearte. Lo que se acepta se puede trabajar.\n3. **Decide:** elige actuar con valentía, aunque sea con miedo.\n\nMucha gente te va a decir que no o te va a dejar en visto. No es personal. Es parte del camino.\n\n## 🪞 Mírate al espejo\n¿Cuándo fue la última vez que te callaste o no ofreciste algo por miedo? ¿Qué oportunidad crees que perdiste?\n\n## ✍️ Ejercicio\n1. Escribe **10 razones** por las que crees en tu producto o negocio. Si no llegas a 10, reflexiona por qué.\n2. Repite cada mañana: \"Lo que ofrezco ayuda de verdad. Yo soy prueba de que funciona. Hoy alguien lo necesita y me va a encontrar.\"\n3. Escribe tus miedos de vender con los tres pasos: nómbralo, abrázalo, decide.\n\n## ✅ Tu tarea de la semana\nGrábate un minuto, sin guion, explicando por qué lo que ofreces le cambia algo a la gente.\n\n## 💬 Para compartir en el grupo\nComparte tus 3 razones favoritas de las 10.\n\n@@ 12 | Clase 12 | Conversaciones que cierran | Del interés a la decisión\nEl contenido abre puertas, pero no vende solo. La mayoría de las ventas se cierran en conversaciones directas: una llamada, una videollamada, un café.\n\n## Si no vendes, cuenta tus conversaciones\n¿Cuántas conversaciones de venta tuviste la semana pasada? Si la respuesta es cero, ahí está el problema. Crear contenido debería ser ya la parte fácil; tu tiempo fuerte tiene que ir a conversar.\n\n## Las ventas son números\nComo referencia para empezar: en algo de precio alto necesitas alrededor de 10 conversaciones para cerrar una; en algo más accesible, alrededor de 5. Si cierras una de cada diez en algo caro, vas bien. Lo que no se mide no se mejora. Y que tu techo de hoy sea tu piso de mañana.\n\n## Una conversación decisiva termina en uno de tres\n1. **Sí, con pago.** Ten todo listo: link de pago, datos de transferencia, el siguiente paso.\n2. **No, gracias.** También es una buena salida: te quita incertidumbre. No es personal.\n3. **Apartado.** No puede pagar todo hoy, pero se compromete con una parte y una fecha.\n\n\"Lo voy a pensar\" y \"luego te aviso\" no son salidas. El seguimiento de verdad es para quien apartó, no para una lista interminable de \"a lo mejor\".\n\n## Cómo llevar la conversación\n- **La venta empieza en los primeros minutos:** puntual, presentable, con energía. Saluda con seguridad y haz dos o tres preguntas para conectar.\n- **Quien pregunta dirige.** No es un discurso. Si te responden con otra pregunta, contesta y regresa con la tuya.\n- **Encuentra el dolor que no está resuelto.** Si alguien tuvo acné hace meses, quizá ya no necesita eso, pero quedó insegura por las manchas. Esa es la necesidad real.\n- **Habla al modo en que decide cada persona.** Unas deciden por **seguridad** (les preocupa equivocarse o perder la oportunidad), otras por **emoción** (historia, pertenencia, cómo se van a sentir) y otras por **datos** (qué incluye, cuánto cuesta, resultados de otras). Observa sus redes y cómo platica para darte una idea.\n- **Contesta rápido.** Ella se puede tardar en responderte; tú no.\n\n## Tres razones para decidir hoy (siempre reales)\n- **Un motivo para hoy:** un bono o precio especial que de verdad termina en una fecha.\n- **Una seguridad:** qué la respalda. Tu acompañamiento, la política real de la empresa, tu plan para sus primeros días.\n- **Algo limitado de verdad:** pocos lugares en tu acompañamiento, una edición especial.\n\n> Nunca inventes escasez, descuentos ni garantías. Si se descubre, pierdes la venta y la confianza.\n\n## Cuando dicen…\n- **\"Lo tengo que pensar\":** \"Me parece bien. ¿Qué es lo que te gustaría pensar?\" Hagan juntas una lista de pros y contras y decidan con eso.\n- **\"Lo tengo que hablar con mi pareja\":** \"Claro. ¿Qué crees que te va a preguntar?\" Resuelvan esas dudas juntas u ofrece una llamada corta con los dos.\n- **\"Es muy caro\":** separa precio de valor. \"¿Comparado con qué?\" y muestra qué incluye y qué resultado busca. Si de verdad no le alcanza, ofrécele el apartado o una opción de entrada.\n- **\"No tengo tiempo\":** \"¿Cuánto tiempo a la semana podrías darle?\" Muestra cómo se ve con 20 minutos al día.\n- **\"Mejor mañana\":** \"¿Qué cambiaría mañana?\" Si no hay una razón real, propón tomar la decisión ahora; si la hay, agenda la fecha exacta.\n\n## 🪞 Mírate al espejo\n¿Podrías decir el nombre de las últimas 10 personas a las que les ofreciste tu producto o negocio? ¿Qué te dijo cada una?\n\n## ✍️ Ejercicio\n1. Calcula cuántas conversaciones necesitas al mes para tu meta.\n2. Escribe tus tres razones para decidir hoy, todas reales.\n3. Escribe tus respuestas a las 5 objeciones con tus palabras.\n\n## ✅ Tu tarea de la semana\nTen al menos 3 conversaciones de venta (o el doble de las que tuviste la semana pasada) y anota en qué terminó cada una.\n\n## 💬 Para compartir en el grupo\n¿Cuántas conversaciones te propones esta semana?\n\n@@ 13 | Clase 13 | Historias que venden y reclutan | Secuencias de 4 historias\nLas historias de Instagram son el lugar perfecto para vender sin parecer vendedora. Aquí tienes tres secuencias de cuatro historias.\n\n## Secuencia A: vender sin parecer vendedora\n1. **Humanízate:** una emoción o mini historia del día con la que tu audiencia se identifique. Todavía sin producto.\n2. **El problema:** lo que vive tu comunidad, contado como \"detrás de cámaras\". Que digan \"soy yo\".\n3. **La solución, desde tu experiencia:** \"esto me ha funcionado a mí\". Beneficios, no características. Como se lo contarías a una amiga.\n4. **Llamado a la acción claro:** una palabra para que te escriban. Si tienes un bono real, es el momento.\n\n## Secuencia B: activar y vender\n1. **Dolor:** algo real y vulnerable.\n2. **Confrontación:** \"¿hasta cuándo vas a normalizar…?\" Firme, sin regañar.\n3. **Mucho valor:** un consejo útil o un mito desmentido.\n4. **Llamado + regalo:** un regalo digital que tú creas (una guía, una mini clase, un checklist) para quien te escriba.\n\n## Secuencia C: reclutar sin perseguir\nSolo con texto sobre fotos. No necesitas hablar a cámara.\n1. **Abre la curiosidad:** \"Hoy voy a contar algo que nunca me había atrevido a decir…\". No expliques todavía.\n2. **Tu dolor (ya resuelto):** \"Hace X tiempo yo estaba…\". Desde la transformación, nunca desde la víctima.\n3. **Lo que descubriste:** \"Descubrí que…\". Solo lo suficiente para que quieran saber más.\n4. **La invitación:** \"Hoy sé que hay mujeres sintiéndose como yo me sentía… Si quieres que platiquemos, mándame la palabra ____.\"\n\n> Curiosidad + dolor con el que se identifiquen + transformación + invitación tranquila. Eso genera conversaciones. \"Únete a mi equipo\" no.\n\n## Reglas para todas\n- El texto se tiene que leer rápido: buen tamaño, contraste y fondo limpio.\n- Máximo dos tipografías y frases cortas.\n- Que se vea como una conversación real, no como un anuncio.\n- Fotos imperfectas que transmitan emoción funcionan mejor que fotos producidas.\n- No prometas ingresos ni resultados de salud. Cuenta tu experiencia.\n- El objetivo no son vistas: son conversaciones.\n\n## Tu banco visual\n1. **Inspiración:** busca en Pinterest sesiones de fotos de marca personal de tu rubro y guarda las que te hagan decir \"esa soy yo\".\n2. **Diseño:** elige uno o dos outfits, un concepto (paz, poder, cercanía, movimiento) y un lugar.\n3. **Producción:** de 5 a 10 fotos y de 3 a 5 clips verticales. No busques la toma perfecta: busca la energía.\n4. **Compartir:** elige tus favoritas y cuenta la historia detrás.\n\n## 🪞 Mírate al espejo\n¿Tus historias de esta semana invitaban a platicar o solo informaban?\n\n## ✍️ Ejercicio\nEscribe una secuencia completa (A, B o C) para tu negocio, historia por historia.\n\n## ✅ Tu tarea de la semana\nPublica tu secuencia y haz tu sesión de banco visual.\n\n## 💬 Para compartir en el grupo\n¿Cuántas conversaciones te generó tu secuencia?\n\n@@ 14 | Clase 14 | Publicidad para crecer | Seguidores reales y anuncios que generan conversaciones\nPagar publicidad no es comprar seguidores. Es llevar tu mejor contenido a personas que no te conocen y a las que les puede interesar.\n\n## Antes de pagar un peso\nTu perfil tiene que estar listo para recibir gente: descripción con una promesa clara, destacados (quién soy, qué hago, testimonios), contenido constante y de calidad. Si tu contenido no es magnético, ninguna cantidad de dinero va a hacer que se queden.\n\n## Promocionar para ganar seguidores\n1. Elige un contenido que de verdad aporte valor y se vea bien (no cualquiera).\n2. Hazlo **desde la computadora**, no desde la app (suele salir más caro y rendir menos).\n3. Objetivo: **visitas al perfil**.\n4. Público: crea el tuyo. Ubicación según dónde vendes, rango de edad de 5 a 10 años, mujeres si es tu caso, y **un solo interés** (máximo dos o tres).\n5. Presupuesto: empieza con lo mínimo diario y mínimo 10 días.\n6. Activa al menos tres contenidos.\n7. **Revisa a las 24 horas.** Si casi no hay seguidores nuevos, pausa y revisa el contenido.\n\n## Anuncios que generan conversaciones\nLa estructura del video:\n1. **Hook al dolor:** \"¿Tienes cajones llenos de accesorios y sientes que ninguno te representa?\"\n2. **A quién le hablas:** \"Este video es para mujeres que…\". Quien no es, se va; quien sí, se queda.\n3. **Empatiza con su dolor:** \"Yo también pasé años…\".\n4. **Una solución gratuita:** una guía, una lista, una clase gratis.\n5. **Llamado a la acción** con un sistema detrás: si dices \"mándame mensaje\", ya sabes qué vas a contestar y cómo vas a agendar.\n\n## Calidad\nEn publicidad compites con muchísimas creadoras. Entre mejor la calidad, más barato te sale cada clic. Graba con el mejor celular que consigas, buenos cortes, varios ángulos y presencia profesional sin perder tu esencia. Graba al menos tres o cuatro versiones para ver cuál funciona mejor.\n\n> Tu anuncio no tiene que gustarle a todos. Tiene que hablarle directo a quien ya te está buscando sin saberlo.\n\nLos precios mínimos y las opciones de las plataformas cambian seguido; revisa siempre lo que te muestra la herramienta al momento de crear tu anuncio.\n\n## 🪞 Mírate al espejo\nSi hoy llegaran 1,000 personas nuevas a tu perfil, ¿se quedarían?\n\n## ✍️ Ejercicio\n1. Haz la revisión de tu perfil: descripción, destacados y últimas 9 publicaciones.\n2. Escribe el guion de un anuncio con los 5 pasos.\n\n## ✅ Tu tarea de la semana\nPromociona tres contenidos con el mínimo presupuesto y revisa los resultados a las 24 horas.\n\n## 💬 Para compartir en el grupo\nComparte tu guion de anuncio para que el equipo te dé retroalimentación.\n\n@@ 15 | Herramientas | Ficha de tu clienta ideal | Para hablarle directo\nLlénala pensando en una sola persona. Ponle nombre.\n\n## Quién es\n- Nombre, edad y ciudad.\n- ¿A qué se dedica?\n- ¿Qué lugares frecuenta y qué hobbies tiene?\n- ¿Qué es lo más importante para ella al comprar?\n- ¿Qué problema tiene hoy?\n\n## Qué consume\n- 5 cuentas o personas que sigue.\n- ¿Qué tienen en común esas cuentas?\n- 5 preguntas que se hace y quiere resolver.\n\n## Antes y después de conocerte\n- **Qué tiene:** antes / después.\n- **Qué siente:** antes / después.\n- **Cómo es su día:** antes / después.\n- **Cómo se ve y se percibe:** antes / después.\n\n## Tu diferencia\n1. Los beneficios de lo que ofreces.\n2. Lo que hace diferente tu propuesta.\n3. Lo que pierde si no lo compra.\n\n> Una venta no depende del producto ni del precio. Depende de que tengas claro el resultado que tu clienta va a obtener.\n\n@@ 16 | Herramientas | Test de tu estilo | Cómo es tu energía natural\nElige la opción que más se parezca a ti en cada pregunta y cuenta qué letra se repite más.\n\n## Las preguntas\n1. Cuando comparto algo de mi marca, me importa que: (A) sea fresco y creativo, (B) sea claro y profesional, (C) se sienta cercano, (D) inspire respeto.\n2. Quien me ve trabajar diría que soy: (A) alegre y llena de ideas, (B) organizada y detallista, (C) paciente y empática, (D) decidida y firme.\n3. Cuando aparece un reto: (A) busco otra forma creativa, (B) reviso el proceso, (C) escucho a todos, (D) decido rápido y actúo.\n4. Me sale natural: (A) contar historias divertidas, (B) explicar paso a paso, (C) mensajes cálidos, (D) hablar con fuerza y dirección.\n5. Lo que más me detiene: (A) empiezo mucho y termino poco, (B) me exijo tanto que tardo en mostrarme, (C) no pongo límites y me desgasto, (D) puedo parecer fría o dura.\n6. En un equipo soy la que: (A) motiva, (B) organiza, (C) acompaña, (D) dirige.\n\n## Los resultados\n- **Mayoría A · La Chispa:** energía, creatividad y entusiasmo. Tu reto: convertir tus ideas en procesos. La constancia es lo que hará crecer tu negocio.\n- **Mayoría B · La Arquitecta:** orden, detalle y confianza. Tu reto: mostrarte aunque no esté perfecto. La gente conecta con lo humano, no con lo impecable.\n- **Mayoría C · La Cálida:** empatía, lealtad y calma. Tu reto: atreverte a liderar y decidir. Tu gente busca tu calidez, pero también tu dirección.\n- **Mayoría D · La Líder:** visión, determinación y autoridad. Tu reto: suavizar tu fuerza con humanidad para que no solo te admiren, también se sientan acompañadas.\n\n> Conocerte te deja usar tus fortalezas y no autosabotearte con tus retos.\n\n@@ 17 | Herramientas | Plantilla de tu historia | Para contarla en un minuto\nEscríbela primero, léela en voz alta y ajústala hasta que suene a ti.\n\n## Los cinco momentos\n1. **Antes:** \"Hace ____ yo ____.\" ¿Qué sentías? ¿Qué te faltaba?\n2. **Lo que dolía de verdad:** \"Lo que más me pesaba no era ____, era ____.\"\n3. **El giro:** \"Un día ____ y decidí ____.\"\n4. **Hoy:** \"Hoy ____.\" Agrega un dato si lo tienes.\n5. **La invitación:** \"Si tú también ____, ____.\" Y una acción concreta: comenta una palabra, mándame mensaje.\n\n## Revisa antes de grabar\n- ¿Se entiende en un minuto?\n- ¿La herida está sanada? ¿Se cuenta desde la transformación?\n- ¿Tu clienta ideal se reconocería en el \"antes\"?\n- ¿Es congruente con lo que has contado otras veces?\n- ¿Evitaste prometer resultados de salud o ingresos?\n\n@@ 18 | Herramientas | Prompts para tu contenido | Para trabajar con la IA\nCopia, llena los espacios y ajusta a tu voz.\n\n## 1. Preséntate\n\"Guarda este contexto: soy ____, vendo ____, mi audiencia es ____ (sus dolores y deseos), hablo de forma ____ y uso frases como ____. Mi objetivo actual es ____. Siempre necesito un llamado a la acción al final. Confirma que entendiste.\"\n\n## 2. Define tus guiones\n\"Quiero guiones con un hook de 3 a 5 segundos, de 20 a 35 segundos en total, lenguaje natural y ritmo de conversación. Estructura: hook, idea 1, idea 2 y cierre con reflexión o llamado a la acción. Evita frases vacías.\"\n\n## 3. Guion por pilar\n\"Hazme un guion del pilar ____ (educativo, estilo de vida o venta) sobre ____. Dame 3 hooks, un guion completo y un llamado a la acción para historias.\"\n\n## 4. Revisión de calidad\n\"Antes de entregarlo, revisa que suene a mí, que construya autoridad, que sea claro y que tenga ritmo. Si no cumple, reescríbelo.\"\n\n## 5. Varias versiones\n\"Convierte este tema en tres versiones: una intensa, una suave y una disruptiva.\"\n\n## 6. Una serie\n\"Voy a grabar varios contenidos sobre ____. Dame 5 guiones distintos: educativo, emocional, historia, humor y autoridad.\"\n\n> La IA no es mágica: responde al nivel de las instrucciones que le das. Y lo último siempre lo decides tú.\n\n@@ 19 | Herramientas | Checklist de la creadora | Diario, semanal y mensual\nPara que tu marca avance aunque no tengas ganas.\n\n## Cada día\n- Mostrarte en historias.\n- Grabar 2 o 3 clips para tu banco de escenas.\n- Responder mensajes y comentarios rápido.\n- Al menos una conversación con una clienta o prospecto.\n- Un momento de aprendizaje (lectura, podcast, curso).\n\n## Cada semana\n- Publicar tus 4 contenidos según tus pilares.\n- Planear la semana siguiente con anticipación.\n- Una secuencia de historias que invite a platicar.\n- Revisar qué funcionó y qué no.\n- Celebrar tus acciones cumplidas.\n\n## Cada mes\n- Contar tu historia en algún formato.\n- Hacer una sesión de banco visual.\n- Revisar tus números: ventas, conversaciones, seguidores nuevos.\n- Revisar tus cuentas faro y tus pilares.\n- Reescribir tu objetivo si ya lo alcanzaste.\n";
var FAQ_MD="## Empezar | 0\n\n### ¿Tengo que tomar las clases en orden?\nLa primera vez, sí te lo recomendamos: las clases 1 a 5 son la base de todo lo demás. Pero puedes saltar a cualquier clase desde el menú cuando lo necesites.\n\n### ¿Cuánto tiempo me toma cada clase?\nEntre 5 y 10 minutos de lectura, más el ejercicio. La idea es que avances una clase por semana y te dé tiempo de aplicar.\n\n### ¿Dónde guardo mis ejercicios?\nEn el cuaderno al final de cada clase. Se guarda solo en este dispositivo y navegador. Si cambias de celular o borras los datos del navegador, se pierde, así que copia lo importante a tu libreta.\n\n### Ya empecé con muchas ganas, ¿por qué siento que se me están bajando?\nEs normal y está explicado en la bienvenida. La emoción del inicio siempre baja. Regresa a tu objetivo de 90 días, a tus 3 innegociables y apóyate en el grupo.\n\n## Marca y nicho | 3\n\n### Vendo lo mismo que muchas, ¿cómo me diferencio?\nLo único que nadie puede copiar eres tú: tu historia, tu forma de explicar y de acompañar. Trabaja tu propuesta de valor (Clase 2) y tu historia (Clase 5).\n\n### Si escojo un nicho, ¿ya no puedo hablar de mi vida?\nSí puedes, y deberías. El nicho no es una jaula. La clave es conectar tu producto con tu vida: tus viajes, tu rutina, tu maternidad, tus hobbies.\n\n### ¿Cómo sé quién es mi clienta ideal?\nPiensa en ti antes de resolver el problema que hoy ya tienes resuelto. Luego llena la Ficha de tu clienta ideal en Herramientas.\n\n### Me da pena que mi familia vea mi contenido.\nEs muy común. Tu contenido no es para tu familia, es para tu clienta ideal. Muchas veces el reconocimiento llega primero de desconocidos.\n\n## Contenido | 6\n\n### ¿Cuántas veces a la semana publico?\nUna buena base son 4 publicaciones a la semana, una por pilar, más historias diarias. Lo importante es sostenerlo.\n\n### No sé qué enseñar en el pilar educativo.\nAliméntate todo el tiempo (libros, podcasts, cursos) y comparte lo que aprendes y vives. Los errores comunes de tus clientas y \"te enseño cómo\" son temas que nunca se acaban.\n\n### ¿Puedo usar inteligencia artificial para mi contenido?\nSí, como asistente. Preséntale bien quién eres y qué necesitas, pide varias opciones y siempre revisa que suene a ti. El formato y la idea final los decides tú.\n\n### No soy buena editando.\nEdita menos, pero bien: luz, recortes sin silencios, acercamientos y palabras clave. Está todo en la Clase 9.\n\n### Me bloqueé y ya no sé qué subir.\nRevisa la Clase 10. Identifica si tu bloqueo es mental, emocional o de hábitos, haz una lluvia de 20 ideas y cambia de lugar.\n\n## Ventas | 12\n\n### Me da pena vender.\nRecuerda que vender es ayudar a alguien a tomar una buena decisión con algo en lo que crees. Trabaja tu convicción con las 10 razones de la Clase 11.\n\n### Me dicen \"lo voy a pensar\" y nunca regresan.\nPregunta qué es lo que le gustaría pensar y resuélvanlo juntas. Busca que la conversación termine en sí, no o apartado. Está en la Clase 12.\n\n### ¿Está bien decir que quedan pocos lugares para que se decidan?\nSolo si es verdad. Nunca inventes escasez, descuentos ni garantías: si se descubre, pierdes la venta y la confianza.\n\n### ¿Cómo invito a alguien a mi equipo sin sentirme intensa?\nUsa la secuencia de reclutamiento de la Clase 13: curiosidad, tu historia, lo que descubriste y una invitación tranquila. Comparte tu experiencia sin prometer ingresos.\n\n### ¿Cuántas conversaciones necesito para vender?\nComo referencia inicial, alrededor de 5 para algo accesible y 10 para algo de precio alto. Mide las tuyas y ajusta.\n\n## Publicidad | 14\n\n### ¿Pagar publicidad es comprar seguidores?\nNo. Comprar seguidores te da números falsos. La publicidad lleva tu mejor contenido a personas reales a las que les puede interesar.\n\n### ¿Cuánto tengo que invertir?\nEmpieza con el mínimo que te permita la plataforma por al menos 10 días y revisa a las 24 horas. Los precios cambian, así que revisa lo que te muestra la herramienta.\n\n## El mentor | 0\n\n### ¿Qué es \"Tu mentora\"?\nEs la mentora de Visible dentro de Claude. Te da las clases una por una, revisa tus ejercicios, te ayuda con tu historia, tus pilares, tus guiones y tus conversaciones de venta.\n\n### ¿Tengo que pagar Claude?\nNo. Funciona con la cuenta gratis de claude.ai. La cuenta gratis tiene un límite de mensajes por día.\n\n### ¿Cómo la instalo?\nDescarga la mentora (.zip) en la pestaña Tu mentora. En Claude entra a Customize → Skills, toca \"+\", luego \"Create skill\" → \"Upload a skill\" y sube el zip sin descomprimir.\n";

    else if(l)out+="<p>"+inline(l)+"</p>";
  });
  if(list)out+="</"+list+">";
  return out;
}
function startsIcon(h){for(var i=0;i<ICONS.length;i++)if(h.indexOf(ICONS[i])===0)return ICONS[i];var m=h.match(/^[☀-➿\uD83C-􏰀-\uDFFF️]+\s*/);return m?m[0]:null;}
function lessonBody(src){
  var parts=src.split(/^## /m),main=parts[0],tasks=[];
  parts.slice(1).forEach(function(p){
    var nl=p.indexOf("\n"),head=(nl<0?p:p.slice(0,nl)).trim(),rest=nl<0?"":p.slice(nl+1);
    var icon=startsIcon(head);
    if(icon)tasks.push({title:head.slice(icon.length).trim(),html:md(rest.trim())});else main+="\n## "+p;
  });
  return {html:md(main.trim()),tasks:tasks};
}
function L(id){for(var i=0;i<LESSONS.length;i++)if(LESSONS[i].id===id)return LESSONS[i];return null;}
var N=CFG.n,STEPS=[];for(var i=1;i<=N;i++)STEPS.push(i);
var ORDER=LESSONS.map(function(l){return l.id;});
var GROUPS=CFG.groups.map(function(g){var p=g[0].split(" · ");return {name:p.length>1?p[1]:g[0],pre:p.length>1?p[0]:"",ids:g[1]};});
var ACTS=GROUPS.filter(function(g){return g.ids.every(function(i){return i>=1&&i<=N;});});
var TOOLS=ORDER.filter(function(i){return i>N;});
var seen=new Set(store.get(CFG.key+"-seen",[])),notes=store.get(CFG.key+"-notes",{});
function saveSeen(){store.set(CFG.key+"-seen",Array.from(seen));}
function isStep(id){return id>=1&&id<=N;}
function nextUp(){if(!seen.has(0)&&!STEPS.some(function(i){return seen.has(i);}))return 0;for(var i=0;i<STEPS.length;i++)if(!seen.has(STEPS[i]))return STEPS[i];return null;}
function count(){return STEPS.filter(function(i){return seen.has(i);}).length;}
function stateOf(id){return seen.has(id)?"seen":(id===nextUp()?"next":"");}
function actOf(id){for(var i=0;i<ACTS.length;i++)if(ACTS[i].ids.indexOf(id)>=0)return ACTS[i];return null;}
function label(id){var x=L(id);if(!x)return "";if(id===0)return CFG.welcomeLabel||"Bienvenida";var m=x.title.match(/^([^·]{1,14}) · /);if(isStep(id)&&m)return m[1];return x.kicker;}
function ttl(x){return x.title.replace(/^[^·]{1,14} · /,"");}
function ctaText(){var n=nextUp();if(n===0)return CFG.ctaStart||"Empezar con la bienvenida";if(n===null)return "Repasar "+(CFG.repaso||"el curso");var l=label(n);return "Seguir con "+(/^Clase/.test(l)?"la ":"el ")+l;}
var CTX={ttl:ttl,L:L,LESSONS:LESSONS,N:N,STEPS:STEPS,ACTS:ACTS,TOOLS:TOOLS,GROUPS:GROUPS,seen:seen,stateOf:stateOf,nextUp:nextUp,count:count,esc:esc,label:label,ctaText:ctaText,cfg:CFG,reduce:reduce,actOf:actOf,open:function(id){openLesson(id);}};

/* ---------- page shell ---------- */
var mw=MENTOR.title.indexOf("mentor ")>=0||/mentor,/.test(MENTOR.title)?"mentor":"mentora";
var SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>';
var root=$("#root");
root.innerHTML='<div class="wrap"><header class="hero" id="hero"></header>'+
  '<div class="tabbar"><div class="tabs" role="tablist" aria-label="Secciones del curso">'+
  '<button class="tab" role="tab" id="tabP" aria-selected="true" aria-controls="progView" type="button">'+esc(CFG.tabProgram||"Programa")+'</button>'+
  '<button class="tab" role="tab" id="tabF" aria-selected="false" aria-controls="faqView" type="button">Preguntas</button>'+
  '<button class="tab" role="tab" id="tabM" aria-selected="false" aria-controls="mentorView" type="button">Tu '+mw+'</button></div></div>'+
  '<section id="progView" role="tabpanel" aria-labelledby="tabP"></section>'+
  '<section id="faqView" role="tabpanel" aria-labelledby="tabF" hidden><div class="faqv"><div><h2 class="sec-h">Preguntas</h2><p class="sec-p">'+esc(CFG.faqLead||"Las dudas que más salen en el equipo, con la clase que las responde.")+'</p></div>'+
  '<label class="sr" for="fq">Busca tu duda</label><div class="f-search">'+SEARCH+'<input id="fq" type="search" placeholder="'+esc(CFG.faqPh||"Busca tu duda")+'" autocomplete="off"></div><div class="f-chips" id="cats"></div><p class="f-count" id="fcount"></p><div id="faq"></div></div></section>'+
  '<section id="mentorView" role="tabpanel" aria-labelledby="tabM" hidden></section>'+
  (CFG.foot?'<footer class="foot">'+esc(CFG.foot)+"</footer>":"")+"</div>";

function renderHero(){$("#hero").innerHTML=SKIN.hero(CTX);var c=$("#cta");if(c)c.onclick=function(){var g=nextUp();if(g===null){setTab("P");$("#progView").scrollIntoView({behavior:"smooth"});}else openLesson(g);};$$("#hero [data-open]").forEach(wireOpen);}
function renderProgram(){$("#progView").innerHTML=SKIN.program(CTX);$$("#progView [data-open]").forEach(wireOpen);if(SKIN.mount)SKIN.mount(CTX,$("#progView"));}

/* tabs */
var TABS={P:["#tabP","#progView"],F:["#tabF","#faqView"],M:["#tabM","#mentorView"]};
function setTab(t){Object.keys(TABS).forEach(function(k){$(TABS[k][0]).setAttribute("aria-selected",String(k===t));$(TABS[k][1]).hidden=k!==t;});}
Object.keys(TABS).forEach(function(k){$(TABS[k][0]).onclick=function(){setTab(k);};});

/* ---------- faq ---------- */
var norm=function(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");};
var STOP=new Set("que como para por con los las del una uno unos mis tus sus mas pero porque cuando donde esta este eso hay tengo puedo debo".split(" "));
function terms(s){return (norm(s).match(/[a-z0-9ñ]{3,}/g)||[]).filter(function(w){return !STOP.has(w);}).map(function(w){return w.length>5?w.slice(0,-1):w;});}
var FAQ=[],CATS=[];
FAQ_MD.split(/^## /m).filter(function(x){return x.trim();}).forEach(function(block){
  var lines=block.split("\n"),h=lines[0].split("|").map(function(x){return x.trim();});if(!h[0])return;CATS.push({cat:h[0],cls:+h[1]});
  lines.slice(1).join("\n").split(/^### /m).filter(function(x){return x.trim();}).forEach(function(qb){var i=qb.indexOf("\n");if(i<0)return;FAQ.push({cat:h[0],cls:+h[1],q:qb.slice(0,i).trim(),a:qb.slice(i+1).trim()});});
});
FAQ.forEach(function(f){f.n=norm(f.q+" "+f.a);});
function hl(html,ts){if(!ts.length)return html;return html.replace(/(>[^<]+<)/g,function(seg){var out=seg;ts.forEach(function(w){var re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").split("").map(function(ch){return ({a:"[aá]",e:"[eé]",i:"[ií]",o:"[oó]",u:"[uúü]",n:"[nñ]"})[ch]||ch;}).join("")+"[a-záéíóúñü]*)","gi");out=out.replace(re,"<mark>$1</mark>");});return out;});}
var fq=$("#fq"),faqEl=$("#faq"),fcount=$("#fcount"),curCat=null;
function isMentorCat(c){return /mentor/i.test(c);}
function renderCats(){var c=$("#cats");c.innerHTML="";[{cat:"Todas"}].concat(CATS).forEach(function(x){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=x.cat;b.setAttribute("aria-pressed",String((x.cat==="Todas"&&!curCat)||x.cat===curCat));b.onclick=function(){curCat=x.cat==="Todas"?null:x.cat;renderCats();renderFaq();};c.appendChild(b);});}
function renderFaq(){
  var qtxt=fq.value.trim(),ts=Array.from(new Set(terms(qtxt))),items=FAQ.filter(function(f){return !curCat||f.cat===curCat;});
  if(ts.length){items=items.map(function(f){return {f:f,s:ts.reduce(function(a,w){return a+(f.n.indexOf(w)>=0?(norm(f.q).indexOf(w)>=0?3:1):0);},0)};}).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;}).map(function(x){return x.f;});}
  faqEl.innerHTML="";
  var gs=ts.length?[[null,items]]:CATS.map(function(c){return [c.cat,items.filter(function(f){return f.cat===c.cat;})];}).filter(function(g){return g[1].length;});
  gs.forEach(function(g){var d=document.createElement("div");d.className="fgroup";if(g[0]){var h=document.createElement("h3");h.textContent=g[0];d.appendChild(h);}
    g[1].forEach(function(f,idx){var det=document.createElement("details");det.className="qa";var x=isMentorCat(f.cat)?null:L(f.cls);
      det.innerHTML="<summary><span>"+hl(">"+esc(f.q)+"<",ts).slice(1,-1)+'</span><i aria-hidden="true">+</i></summary><div class="ans">'+hl(md(f.a),ts)+(x?'<button class="btn go" type="button">Ver: '+esc(x.title)+"</button>":(isMentorCat(f.cat)?'<button class="btn go" type="button">Ir a Tu '+mw+"</button>":""))+"</div>";
      var go=det.querySelector(".go");if(go)go.onclick=function(){if(x)openLesson(f.cls);else setTab("M");};
      if(ts.length&&idx===0)det.open=true;d.appendChild(det);});faqEl.appendChild(d);});
  fcount.textContent=ts.length?(items.length?items.length+(items.length===1?" respuesta":" respuestas")+' para "'+qtxt+'"':'No hay una pregunta frecuente sobre "'+qtxt+'". Pregúntale a tu '+mw+"."):"";
}
var ft;fq.addEventListener("input",function(){clearTimeout(ft);ft=setTimeout(renderFaq,150);});

/* ---------- mentor ---------- */
(function(){
  var M=MENTOR,h='<div class="m-col"><div><h2 class="sec-h">'+esc(M.title)+'</h2><p class="sec-p">'+esc(M.intro)+"</p></div>"+
    '<ul class="m-can">'+M.can.map(function(c){return "<li><b>"+esc(c[0])+"</b><span>"+esc(c[1])+"</span></li>";}).join("")+"</ul>"+
    '<div class="m-dl"><a class="btn solid" href="'+CFG.zipName+'" download>Descargar '+(mw==="mentor"?"el mentor":"la mentora")+' (.zip)</a>'+(CFG.mdVar?'<a class="btn" href="'+CFG.mdName+'" download>Descargar las instrucciones (.md)</a>':"")+'</div><p class="m-note" id="dlMsg">'+esc(M.notes[0]||"")+"</p></div>"+
    '<div class="m-col"><h3 class="m-h">Cómo '+(mw==="mentor"?"instalarlo":"instalarla")+'</h3><ol class="m-steps">'+M.steps.map(function(s){return "<li><span>"+esc(s)+"</span></li>";}).join("")+"</ol>"+
    '<div class="m-prompts">'+M.prompts.map(function(p,i){return '<div class="m-prompt"><q id="mp'+i+'">'+esc(p)+'</q><button type="button" class="btn" data-copy="mp'+i+'">Copiar</button></div>';}).join("")+"</div>"+
    (M.notes[1]?'<p class="m-note">'+esc(M.notes[1])+"</p>":"")+(M.limits.length?'<div class="m-limits" aria-label="Límites">'+M.limits.map(function(s){return "<span>"+esc(s)+"</span>";}).join("")+"</div>":"")+"</div>";
  $("#mentorView").innerHTML='<div class="mentorv">'+h+"</div>";
  $$("[data-copy]").forEach(function(btn){btn.addEventListener("click",function(){var el=document.getElementById(btn.getAttribute("data-copy"));function selt(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="Seleccionado";}
    try{navigator.clipboard.writeText(el.textContent).then(function(){btn.textContent="Copiado";setTimeout(function(){btn.textContent="Copiar";},1600);},selt);}catch(e){selt();}});});
})();

/* ---------- reader sheet ---------- */
var cur=null;
function neighbours(id){var k=ORDER.indexOf(id);return {prev:ORDER[k-1],next:ORDER[k+1]};}
function where(x){if(x.id===0)return CFG.welcomeLabel||"Bienvenida";if(isStep(x.id)){var a=actOf(x.id);return label(x.id)+" de "+N+(a&&a.name!=="Clases"?", "+a.name:"");}return x.kicker;}
function sheetHTML(x){
  var b=lessonBody(x.body),nb=neighbours(x.id),s=seen.has(x.id),nx=nb.next!==undefined?L(nb.next):null;
  var num=isStep(x.id)?(SKIN.readerNum?SKIN.readerNum(x,CTX):String(x.id)):null;
  var turn=b.tasks.length?'<section class="turn"><h3>Tu turno</h3>'+b.tasks.map(function(t){return '<div class="task"><h4>'+esc(t.title)+"</h4>"+t.html+"</div>";}).join("")+
    '<label class="nb-l" for="nb">Tu cuaderno</label><textarea id="nb" placeholder="Escribe aquí tu ejercicio. Se guarda en este dispositivo."></textarea><span class="saved" id="nbs"></span></section>':"";
  return '<div class="grab" id="grab"><span class="where">'+esc(where(x))+'</span><button type="button" class="x" id="closeB">Cerrar</button></div><div class="scroll" id="scroll">'+
    '<div class="r-head'+(num?"":" nonum")+'">'+(num?'<span class="r-num" aria-hidden="true">'+esc(num)+"</span>":"")+'<p class="r-k">'+esc(isStep(x.id)?label(x.id):(x.id===0?(CFG.welcomeLabel||"Bienvenida"):x.kicker))+'</p><h1 class="r-title" id="rTitle">'+esc(ttl(x))+'</h1></div><p class="r-topic">'+esc(x.topic)+'</p><p class="r-intro">'+inline(esc(x.intro))+'</p><div class="lesson-body">'+b.html+"</div>"+turn+
    '<div class="r-foot"><div class="nav"><button class="btn" type="button" id="prevB" '+(nb.prev===undefined?"disabled":"")+'>Anterior</button><button class="btn solid" type="button" id="nextB" '+(nb.next===undefined?"disabled":"")+">Siguiente</button></div>"+
    (isStep(x.id)?'<button class="btn'+(s?" done":"")+'" type="button" id="seenB" aria-pressed="'+s+'">'+(s?"Completada ✓":"Marcar como completada")+"</button>":"")+
    (nx?'<p class="r-next">Sigue: '+esc(ttl(nx))+"</p>":"")+"</div></div>";
}
function openLesson(id,trigger){
  var x=L(id);if(!x)return;
  var fresh=!cur;
  if(fresh){
    var scrim=document.createElement("div");scrim.className="scrim";var sh=document.createElement("div");sh.className="sheet";sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");sh.setAttribute("aria-labelledby","rTitle");
    document.body.appendChild(scrim);document.body.appendChild(sh);document.body.classList.add("sheet-open");
    cur={scrim:scrim,sh:sh,trigger:trigger||document.activeElement};
    scrim.onclick=closeLesson;
  }
  cur.id=id;cur.sh.innerHTML=sheetHTML(x);
  var sh=cur.sh;
  if(fresh)requestAnimationFrame(function(){requestAnimationFrame(function(){sh.classList.add("on");cur&&cur.scrim.classList.add("on");});});
  $("#closeB",sh).onclick=closeLesson;$("#closeB",sh).focus({preventScroll:true});
  var nb=neighbours(id);
  $("#prevB",sh).onclick=function(){openLesson(nb.prev);};
  $("#nextB",sh).onclick=function(){if((isStep(id)||id===0)&&!seen.has(id)){seen.add(id);saveSeen();refresh();}openLesson(nb.next);};
  var sb=$("#seenB",sh);if(sb)sb.onclick=function(){seen.has(id)?seen.delete(id):seen.add(id);saveSeen();var on=seen.has(id);sb.textContent=on?"Completada ✓":"Marcar como completada";sb.classList.toggle("done",on);sb.setAttribute("aria-pressed",String(on));refresh();};
  var ta=$("#nb",sh);if(ta){ta.value=notes[id]||"";var t;ta.oninput=function(){clearTimeout(t);t=setTimeout(function(){notes[id]=ta.value;store.set(CFG.key+"-notes",notes);$("#nbs",sh).textContent="Guardado en este dispositivo";},400);};}
  $("#scroll",sh).scrollTop=0;
  try{history.replaceState(null,"","#clase-"+id);}catch(e){}
  var g=$("#grab",sh),y0=null,dy=0,t0=0;
  g.addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;y0=e.clientY;dy=0;t0=performance.now();sh.classList.add("drag");try{g.setPointerCapture(e.pointerId);}catch(_){}});
  g.addEventListener("pointermove",function(e){if(y0==null)return;dy=e.clientY-y0;sh.style.transform="translateY("+(dy<0?dy*.15:dy)+"px)";});
  function end(){if(y0==null)return;var v=dy/Math.max(1,performance.now()-t0);sh.classList.remove("drag");sh.style.transform="";y0=null;if(dy>140||v>.5)closeLesson();}
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
}
function closeLesson(){
  if(!cur)return;var c=cur;cur=null;document.body.classList.remove("sheet-open");
  c.sh.classList.remove("on");c.scrim.classList.remove("on");setTimeout(function(){c.sh.remove();c.scrim.remove();},reduce?0:500);
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  var t=document.querySelector('#progView [data-open="'+c.id+'"]')||c.trigger;if(t&&t.focus)t.focus({preventScroll:false});
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&cur)closeLesson();});

renderCats();renderFaq();refresh();

if(hh&&L(+hh[1]))openLesson(+hh[1]);else if(hm==="mentor"||hm==="mentora")setTab("M");else if(hm==="preguntas")setTab("F");
})();
