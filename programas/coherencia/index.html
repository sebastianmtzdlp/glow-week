<style>

/* tabs */

/* ---------- reader sheet (the lights come on) ---------- */

.grab::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--r-line)}
.grab .where{font-size:14px;font-weight:600;color:var(--r-muted);padding-top:8px}

.sheet :focus-visible{outline:2px solid var(--r-accent);outline-offset:3px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:clamp(22px,5vw,48px) clamp(18px,5vw,56px) calc(56px + env(safe-area-inset-bottom,0px))}
.r-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:end;margin-bottom:18px}

  --r-bg:#F7FAFB; --r-surface:#FFFFFF; --r-ink:#0F2230; --r-muted:#4E6475; --r-line:#D9E3E9; --r-accent:#17675F; --r-accent-ink:#F2FBF9; --r-callout-bg:#E1F1EE; --r-callout-ink:#0E3F3A;

}

  --r-bg:#0F1C26; --r-surface:#152733; --r-ink:#E4EDF1; --r-muted:#97AAB7; --r-line:#27404F; --r-accent:#5CC9B9; --r-accent-ink:#04201C; --r-callout-bg:#173A39; --r-callout-ink:#D2F3EE;
  color-scheme:dark}}
:root[data-theme="dark"]{

  --r-bg:#0F1C26; --r-surface:#152733; --r-ink:#E4EDF1; --r-muted:#97AAB7; --r-line:#27404F; --r-accent:#5CC9B9; --r-accent-ink:#04201C; --r-callout-bg:#173A39; --r-callout-ink:#D2F3EE;
  color-scheme:dark}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.tabbar{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}

.lesson-body h3,.turn h3{text-wrap:balance}
.sheet{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* hero */
.c-hero{display:flex;flex-direction:column;gap:18px;padding-block:36px 8px}
.c-kick{margin:0;font-size:15px;color:var(--muted);font-weight:600}
.c-title{margin:0;font:400 clamp(58px,15vw,128px)/.88 var(--display);letter-spacing:-.025em;color:var(--ink)}
.c-title em{font-style:italic;color:var(--accent)}
.c-tag{margin:0;font:italic 400 clamp(22px,4.4vw,30px)/1.2 var(--display);color:var(--muted);max-width:26ch;text-wrap:balance}
.c-trace{position:relative;height:clamp(150px,24vw,230px);margin-block:6px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 25%;background-position:0 50%}
.c-trace svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

<div id="root"></div>
<script>
var LESSONS_MD="@@ 0 | Empieza aquí | Bienvenida a Coherencia | Cómo funciona este curso\nCoherencia es un curso de práctica, no de teoría. Son 10 clases cortas para aprender a salir del modo supervivencia, entrenar tu atención y sentir hoy la emoción de la vida que quieres crear.\n\n## De dónde sale\nEste curso nace de un libro sobre meditación, cerebro y emociones que quisimos compartir con el equipo. Tomamos sus ideas principales y las bajamos a tu día: con hijas, pedidos, mensajes y poco tiempo.\n\n## Lo que vas a practicar\n- **Darte cuenta** de cuándo estás viviendo en automático.\n- **Volver al presente** en un minuto, aunque el día esté pesado.\n- **Una intención clara** para tu vida, escrita en una hoja.\n- **Emociones elevadas**: gratitud, alegría, amor, confianza. Sentirlas antes de que pase lo que esperas.\n- **Cinco meditaciones** cortas que puedes hacer en casa: la del presente, la de los centros, la respiración, la del corazón y la caminando.\n- **Tu película del futuro**, un video de un minuto hecho en tu celular.\n\n## Cómo aprovecharlo\n1. **Una clase por semana.** Léela en 5 o 10 minutos y haz la práctica en los días siguientes.\n2. **Practica poquito pero diario.** Diez minutos todos los días hacen más que una hora el domingo.\n3. **Escribe en tu cuaderno** al final de cada clase. Se guarda en tu celular.\n4. **Comparte en el grupo.** Practicar acompañada sostiene más que practicar sola.\n\n> No se trata de meditar perfecto. Se trata de regresar, una y otra vez.\n\n## Antes de empezar\nEstas prácticas son para tu bienestar y tu enfoque. No sustituyen a tu médico, a tu tratamiento ni a terapia. Si estás embarazada, tienes presión alta o algún tema de salud, haz la respiración de la Clase 5 suave y sin retener el aire.\n\n## 🪞 Mírate al espejo\n¿En qué momentos del día sientes que vives en piloto automático?\n\n## ✍️ Ejercicio\nEscribe tres cosas que haces todos los días exactamente igual (cómo despiertas, qué ves primero en el celular, cómo hablas cuando estás cansada).\n\n## ✅ Tu tarea de la semana\nElige tu lugar y tu hora para practicar: diez minutos, el mismo sitio, todos los días.\n\n## 💬 Para compartir en el grupo\nCuéntale al equipo a qué hora vas a practicar para que alguien te pregunte cómo te fue.\n\n@@ 1 | Clase 1 | Tu pasado no tiene que ser tu futuro | Cómo funciona el piloto automático\nSi piensas lo mismo, decides lo mismo, haces lo mismo y sientes lo mismo, mañana se va a parecer mucho a ayer. No por mala suerte: por costumbre.\n\n## El círculo que se repite\nImagina un día normal. Despiertas y lo primero que haces es recordar: los pendientes, la cuenta que no cuadra, la plática que salió mal. Esos pensamientos traen las mismas emociones de siempre. Desde esas emociones tomas las mismas decisiones. Las decisiones te llevan a los mismos actos, y los mismos actos producen las mismas experiencias. Y esas experiencias vuelven a despertar las mismas emociones.\n\nAsí, sin darte cuenta, tu pasado se convierte en tu futuro.\n\n## El cuerpo también se acostumbra\nCuando vivimos con estrés por mucho tiempo, el cuerpo se acostumbra a esa química: a la prisa, a la preocupación, al enojo. Y lo que se vuelve costumbre, el cuerpo lo busca. Por eso a veces regresamos al mismo drama aunque no nos guste: se siente conocido.\n\nEl estrés sirve para una emergencia corta. El problema es vivir en emergencia todo el día: el cuerpo gasta su energía en sobrevivir y queda poca para crear, sanar o disfrutar.\n\n## Ensayar en la mente cambia el cerebro\nHay estudios donde personas solo **imaginaron** que practicaban un ejercicio o una pieza de piano, sin moverse, y su cerebro cambió como si lo hubieran hecho. La mente ensaya y el cerebro se prepara.\n\nEso funciona en las dos direcciones. Si cada mañana ensayas en tu mente lo peor que puede pasar, estás preparando a tu cerebro para eso. Si ensayas a la mujer que quieres ser, lo preparas para ella.\n\n> Lo que repites en tu mente, tu cuerpo lo aprende como si ya hubiera pasado.\n\n## Cambiar es incómodo, y está bien\nCuando dejas de sentir lo de siempre, el cuerpo protesta. Aparece la flojera, la duda, el \"mejor mañana\". No es señal de que vas mal. Es señal de que estás saliendo de lo conocido.\n\n## 🪞 Mírate al espejo\n¿Cuál es la emoción que más repites en la semana? ¿Culpa, prisa, preocupación, enojo, frustración?\n\n## ✍️ Ejercicio\n1. Escribe esa emoción.\n2. Anota qué pensamiento la enciende casi siempre.\n3. Anota qué decisión tomas cuando te sientes así.\n4. Escribe qué emoción quieres sentir en su lugar.\n\n## ✅ Tu tarea de la semana\nCada vez que notes esa emoción conocida, di por dentro \"esto es lo de siempre\" y respira tres veces antes de responder.\n\n## 💬 Para compartir en el grupo\n¿Cuál es la emoción que más repites y cuál quieres sentir en su lugar?\n\n@@ 2 | Clase 2 | El momento presente | La puerta de entrada\nTodo lo nuevo pasa en el presente. Pero casi nunca estamos ahí: estamos en lo que ya pasó o preocupadas por lo que viene.\n\n## Donde pones tu atención, pones tu energía\nSi tu atención está en el mensaje que no te contestaron, en la deuda o en la plática de ayer, ahí se va tu energía. Por eso terminas el día agotada aunque \"no hiciste tanto\". Recuperar tu atención es recuperar tu energía.\n\n## Las ondas del cerebro, en simple\n- **Alerta (beta):** el modo de todos los días. Pensar, resolver, contestar. Si hay estrés, sube de más y no te deja descansar.\n- **Calma (alfa):** cuando te relajas y miras hacia adentro, como cuando sueñas despierta.\n- **Muy profundo (theta):** ese momento entre despierta y dormida.\n\nMeditar es aprender a bajar del modo alerta al modo calma, a propósito.\n\n## Salirte de ti misma un rato\nLa propuesta del libro es esta: para crear algo nuevo, por unos minutos tienes que dejar de ser la de siempre. Dejar de pensar en tu cuerpo, en tus pendientes, en las personas, en el lugar y en la hora. Ser solo atención.\n\nSuena raro, pero lo has sentido: cuando te pierdes en una canción, en un atardecer o en un juego con tus hijas y se te olvida la hora. Eso es estar en el presente.\n\n## Cuando te distraigas, regresa\nTe vas a distraer mil veces. No pasa nada. Cada vez que te das cuenta y regresas, estás entrenando, como una repetición en el gym. La meditación no es no pensar; es regresar.\n\n> Cada vez que regresas al presente, le ganas un poquito al piloto automático.\n\n## La práctica: atención al espacio\nSiéntate con la espalda derecha y cierra los ojos. Lleva tu atención, sin prisa, a:\n1. El espacio detrás de tus ojos.\n2. El espacio en el centro de tu cabeza.\n3. El espacio alrededor de tu cabeza.\n4. El espacio en tu garganta y alrededor de tu cuello.\n5. El espacio en tu pecho y alrededor de tu cuerpo.\n6. El espacio del cuarto donde estás, y luego más allá.\n\nQuédate unos segundos en cada uno. Sentir el espacio, en vez de pensar en las cosas, calma la mente muy rápido.\n\n## 🪞 Mírate al espejo\n¿Dónde se fue tu atención hoy cuando despertaste?\n\n## ✍️ Ejercicio\nHaz la práctica de atención al espacio 10 minutos. Después escribe cuántas veces te distrajiste más o menos y cómo te sentiste al terminar.\n\n## ✅ Tu tarea de la semana\nHaz la práctica 5 días. Si un día no tienes 10 minutos, haz 3.\n\n## 💬 Para compartir en el grupo\n¿Qué te costó más: cerrar los ojos, quedarte quieta o no pensar en pendientes?\n\n@@ 3 | Clase 3 | Sintoniza tu futuro | Intención clara y emoción elevada\nPara crear algo nuevo necesitas dos cosas al mismo tiempo: saber qué quieres y sentirlo como si ya fuera tuyo.\n\n## La idea del libro\nEl libro propone que todas las posibilidades ya existen como energía, como estaciones de radio que están en el aire aunque no las escuches. Tú no tienes que fabricarlas. Tienes que **sintonizarlas**: que tu energía, lo que piensas y lo que sientes, coincida con la de ese futuro.\n\nPuedes verlo de forma más práctica: cuando piensas y sientes como la mujer que ya logró algo, tomas decisiones distintas, ves oportunidades que antes no veías y actúas con otra seguridad.\n\n## Pensamiento y emoción tienen que ir juntos\nSi piensas \"soy abundante\" pero sientes miedo, tu cuerpo le cree al miedo. La intención es la dirección; la emoción es la gasolina.\n\n- **Intención clara:** qué quieres, con detalles.\n- **Emoción elevada:** cómo te vas a sentir cuando pase. Gratitud, alegría, libertad, amor, confianza.\n\n## La gratitud como atajo\nSi no sabes cómo se siente algo que todavía no vives, usa la gratitud. Normalmente agradecemos después de recibir. Si agradeces antes, tu cuerpo empieza a vivirlo como si ya hubiera pasado.\n\n> Agradecer antes de recibir es enseñarle a tu cuerpo cómo se siente ese futuro.\n\n## Tu hoja de intención\n1. Piensa en una experiencia que quieras vivir: un hábito, un logro, una relación más sana, más paz en casa.\n2. Escríbela en una hoja con una **letra mayúscula** que la represente. Dibuja dos círculos alrededor.\n3. Debajo, escribe **al menos cuatro detalles** de cómo se ve. Sin fechas.\n4. Escribe **las emociones** que vas a sentir cuando pase.\n\n## La meditación para sintonizar\n1. Haz la atención al espacio de la Clase 2 hasta que te sientas en calma.\n2. Suelta tu cuerpo, tus pendientes y la hora. Quédate solo como atención.\n3. Recuerda tu letra y lo que significa. Siente esas emociones en tu pecho, como si ya fuera real.\n4. Ensaya en tu mente un momento de ese futuro, con detalles.\n5. Suéltalo. No tienes que controlar cómo ni cuándo.\n6. Agradece por tu vida, tu cuerpo, tus retos y tu futuro.\n7. Abre los ojos y levántate como la mujer que ya lo vivió.\n\n## Lo que no es\nNo es pedir un deseo y sentarte a esperar. Tampoco garantiza fechas ni resultados. Es entrenar tu estado para que tus decisiones salgan de la confianza y no del miedo. La acción sigue siendo tuya.\n\n## 🪞 Mírate al espejo\n¿Hay algo que quieres pero en el fondo sientes que no te va a pasar?\n\n## ✍️ Ejercicio\nHaz tu hoja de intención completa: letra, detalles y emociones. Escríbela también en tu cuaderno.\n\n## ✅ Tu tarea de la semana\nHaz la meditación para sintonizar 4 veces esta semana, con tu hoja enfrente antes de cerrar los ojos.\n\n## 💬 Para compartir en el grupo\nComparte solo tus emociones (no tu meta, si no quieres). ¿Qué vas a sentir cuando pase?\n\n@@ 4 | Clase 4 | El recorrido de los centros | Ocho puntos de atención\nTu cuerpo tiene zonas donde se juntan nervios y glándulas. Llevar tu atención ahí, con calma y gratitud, es una de las prácticas favoritas del libro.\n\n## Qué son los centros\nEl libro habla de siete centros de energía a lo largo del cuerpo y un octavo arriba de la cabeza. Cada uno coincide con una zona donde hay muchos nervios y glándulas que trabajan solas, sin que lo pienses: la digestión, el ritmo del corazón, las hormonas.\n\n1. **Base:** el piso pélvico.\n2. **Vientre bajo:** abajo del ombligo.\n3. **Estómago:** la boca del estómago.\n4. **Corazón:** el centro del pecho.\n5. **Garganta.**\n6. **Centro de la cabeza:** atrás de los ojos.\n7. **Coronilla:** arriba de la cabeza.\n8. **Arriba de ti:** como a un palmo y medio sobre tu cabeza.\n\n## Por qué funciona la atención\nDonde pones tu atención, pones tu energía. Cuando el estrés manda, esa energía se queda atorada en los primeros centros: sobrevivir, controlar, preocuparte. Al recorrer los centros con calma, le das a tu cuerpo otra orden: equilibrio, descanso, gratitud.\n\n## Cómo se hace\n1. Siéntate cómoda y cierra los ojos.\n2. Lleva tu atención al primer centro. Luego al **espacio alrededor** de ese centro.\n3. Cuando lo sientas, bendícelo: deséale lo mejor, por el bien de todos.\n4. Siente una emoción elevada ahí: amor, gratitud, alegría.\n5. Pasa al siguiente centro y repite.\n6. En el octavo, arriba de tu cabeza, quédate en **gratitud**.\n7. Siente la energía alrededor de todo tu cuerpo.\n8. Acuéstate al menos 15 minutos. Deja que tu cuerpo integre.\n\n> Si quieres sentirte en paz, practica sentir paz. Tu cuerpo aprende lo que repites.\n\n## Si se te hace largo\nEmpieza con cuatro centros: estómago, corazón, garganta y cabeza. Cuando te salga natural, haz los ocho.\n\n## 🪞 Mírate al espejo\n¿En qué parte del cuerpo sientes el estrés? ¿El estómago, el pecho, la garganta?\n\n## ✍️ Ejercicio\nHaz el recorrido una vez. Al terminar anota en qué centro sentiste más y en cuál te costó más concentrarte.\n\n## ✅ Tu tarea de la semana\nHaz el recorrido tres veces. Una puede ser antes de dormir, acostada.\n\n## 💬 Para compartir en el grupo\n¿Cómo dormiste el día que hiciste el recorrido?\n\n@@ 5 | Clase 5 | La respiración que sube la energía | Saca la mente del cuerpo\nCuando vivimos años con las mismas emociones, el cuerpo se vuelve la mente: reacciona antes de que pienses. Esta respiración ayuda a sacar esa energía de abajo y llevarla hacia arriba.\n\n## Para qué sirve\nSegún el libro, la energía de la supervivencia (miedo, culpa, enojo, deseo de controlar) se queda en la parte baja del cuerpo. Esta respiración la sube hacia el corazón y la cabeza, donde la puedes usar para crear y no solo para aguantar.\n\nAunque no te convenza esa explicación, la vas a sentir: activa, despeja y te deja lista para meditar.\n\n## Primero, aprende los músculos\n1. Siéntate derecha, pies en el piso, manos en las piernas.\n2. Aprieta el piso pélvico (los mismos músculos de cuando aguantas ir al baño). Cinco segundos y suelta. Tres veces. **Sigue respirando normal.**\n3. Ahora aprieta el piso pélvico y el vientre bajo, hacia arriba y hacia adentro. Cinco segundos. Tres veces.\n4. Ahora suma el abdomen alto: todo el centro del cuerpo firme. Cinco segundos. Tres veces.\n\n## Luego, el camino del aire\n1. Toca con un dedo la coronilla para saber dónde está. Quita el dedo.\n2. Inhala lento por la nariz y sigue el aire con tu atención: piso pélvico, vientre, estómago, pecho, garganta, cabeza, coronilla.\n3. Arriba, sostén unos segundos con tu atención ahí. Suelta.\n\n## Todo junto\nInhala lento por la nariz mientras aprietas los tres grupos de músculos de abajo hacia arriba. Sube el aire por el centro del cuerpo hasta la coronilla. Sostén unos segundos apretando. Exhala y suelta todo. Repite dos o tres veces.\n\n> No es aguantar hasta ponerte morada. Es una respiración lenta, larga y con intención.\n\n## La práctica completa\n1. Pon una canción que te inspire, de 4 a 7 minutos.\n2. Haz la respiración varias veces durante la canción.\n3. Después haz la atención al espacio (Clase 2).\n4. Siente, una por una, varias emociones elevadas: gratitud, alegría, amor, libertad.\n5. Agradece por una vida nueva antes de verla.\n\n## Con cuidado\nSi estás embarazada, tienes presión alta, te mareas o tienes algún tema de salud, hazla muy suave, sin retener el aire, o salta solo a la parte de las emociones.\n\n## 🪞 Mírate al espejo\n¿Qué emoción sientes que llevas \"guardada\" en el cuerpo desde hace tiempo?\n\n## ✍️ Ejercicio\nPractica solo la parte de los músculos y el camino del aire, cinco minutos. Anota qué tan fácil o difícil fue coordinarlo.\n\n## ✅ Tu tarea de la semana\nHaz la práctica completa con tu canción tres veces. Escribe qué canción elegiste.\n\n## 💬 Para compartir en el grupo\nComparte tu canción para respirar. Hagamos una lista del equipo.\n\n@@ 6 | Clase 6 | El corazón coherente | Cuando la mente y el corazón dicen lo mismo\nEl cerebro piensa; el corazón sabe. Cuando aprendes a sostener una emoción elevada en el pecho, tu cuerpo entra en orden.\n\n## Qué es la coherencia\nEl ritmo del corazón no es como un reloj: cambia todo el tiempo. Con estrés, ese ritmo se vuelve desordenado. Con emociones como gratitud, cariño o paz, se ordena y forma una ola pareja. A eso se le llama **coherencia**, y le da nombre a este curso.\n\nCuando tu corazón está en coherencia, tu cerebro también se ordena: piensas más claro, reaccionas menos y decides mejor.\n\n## Sostener, no solo sentir\nSentir gratitud un segundo es fácil. Lo que se entrena es **sostenerla**: quedarte en esa emoción aunque afuera haya ruido. Cuando lo logras, lo de afuera ya no te mueve tanto. Eso es dominar tu entorno en vez de que tu entorno te domine a ti.\n\n> Cuando tu calma no depende de lo que pasa afuera, ya no eres reactiva: eres dueña de tu energía.\n\n## Del egoísmo a la generosidad\nDesde el miedo pensamos en nosotras. Desde el corazón abierto, pensamos en los demás. Por eso esta práctica cambia cómo hablas con tu familia, con tus clientas y con tu equipo.\n\n## La práctica del corazón\n1. Cierra los ojos, relaja el cuerpo y lleva tu atención al centro del pecho.\n2. Respira como si el aire entrara y saliera por tu corazón. Cada vez más lento y profundo.\n3. Cuando tu mente se vaya, regresa al pecho, al corazón y a la respiración.\n4. Despierta una emoción elevada: piensa en algo o alguien que te dé ternura o gratitud.\n5. Cuando la sientas en el pecho, mándala más allá de tu cuerpo, con tu intención.\n6. Empieza con 10 minutos y ve subiendo.\n\n## Con los ojos abiertos\nPon cuatro alarmas en el celular. Cuando suene una, deja lo que haces por un minuto, lleva la atención al pecho y siente gratitud. Eso es meditar sin cerrar los ojos.\n\n## 🪞 Mírate al espejo\n¿Quién o qué te saca de tu centro más rápido?\n\n## ✍️ Ejercicio\nHaz la práctica del corazón 10 minutos. Escribe la emoción que elegiste y en qué pensaste para despertarla.\n\n## ✅ Tu tarea de la semana\nPon tus cuatro alarmas de gratitud y respétalas cinco días.\n\n## 💬 Para compartir en el grupo\n¿Qué alarma te costó más respetar y qué estabas haciendo cuando sonó?\n\n@@ 7 | Clase 7 | Tu película del futuro | Programa tu mente con imágenes\nTu mente aprende de lo que ve y escucha muchas veces. Así que hazle una película de un minuto de tu futuro y mírala todos los días.\n\n## Por qué funciona\nCuando estás muy relajada, en ese estado entre despierta y dormida, tu mente analiza menos y acepta más. Por eso los niños aprenden tanto antes de dormir. Si en ese momento ves imágenes de tu futuro con una canción que te mueve, tu cerebro lo va guardando como algo conocido.\n\nEn los talleres del libro, primero miran un video de caleidoscopio para entrar en ese estado y luego ven su película. Tú puedes hacer algo parecido con un video de caleidoscopio de YouTube y tu película.\n\n## Cómo hacer tu película\n1. **Elige un área:** salud, familia, pareja, negocio, tu casa, un viaje.\n2. **Busca de 10 a 15 imágenes** que muestren ese futuro. Mejor si sales tú: una foto tuya sonriente al lado de lo que quieres.\n3. **Escribe una frase corta en presente** para cada imagen: \"Estoy en paz con mi cuerpo\", \"Mi casa está llena de risas\", \"Mi equipo crece conmigo\".\n4. **Elige una canción** que te emocione, de 3 a 4 minutos, y úsala solo para esto.\n5. **Arma el video** en tu celular con CapCut, Canva o la app de fotos. Unos 3 o 4 segundos por imagen.\n\n## Cómo mirarla\n- En la mañana al despertar y en la noche antes de dormir.\n- Primero unos minutos de la práctica del corazón (Clase 6), luego tu película.\n- Siéntela, no solo la veas. Ponle la emoción de que ya pasó.\n\n> Cuando ya sabes qué imagen sigue sin verla, tu cerebro ya la aprendió.\n\n## Una sola canción\nCon el tiempo, escuchar la canción va a traer las imágenes solas. Úsala en el coche o mientras cocinas para \"ver\" tu película con los ojos abiertos.\n\n## Lleva un diario\nAnota las coincidencias, las oportunidades y los cambios pequeños que vayas notando. Cuando mires atrás vas a ver el camino que te llevó ahí.\n\n## Ojo\nTu película no es una lista de cosas para comprar. Pon cómo te quieres sentir y en quién te quieres convertir. Y no te compares con la película de nadie.\n\n## 🪞 Mírate al espejo\nSi tu vida fuera una película, ¿qué escena quieres vivir este año?\n\n## ✍️ Ejercicio\nEscribe en tu cuaderno las frases de tu película, una por imagen, todas en presente.\n\n## ✅ Tu tarea de la semana\nArma tu película y mírala mañana y noche cinco días.\n\n## 💬 Para compartir en el grupo\nComparte qué canción elegiste y una de tus frases.\n\n@@ 8 | Clase 8 | Camina como tu yo del futuro | Meditar con los ojos abiertos\nPuedes tener una meditación hermosa, abrir los ojos y regresar al mismo enojo de siempre en cinco minutos. Esta clase es para llevarte la meditación a la vida.\n\n## El reto de abrir los ojos\nCon los ojos cerrados es fácil sentirte en paz. Lo difícil es sostener esa energía cuando suena el teléfono, llora una niña o una clienta te deja en visto. La meditación caminando entrena justo eso: sentir tu futuro mientras te mueves.\n\n## La práctica caminando\n1. Busca un lugar tranquilo, mejor si es al aire libre: un parque, tu patio, una calle tranquila.\n2. Cierra los ojos de pie. Lleva la atención al corazón y respira por ahí unos dos minutos.\n3. Despierta emociones elevadas y mándalas alrededor de tu cuerpo.\n4. Recuerda tu intención o tu letra (Clase 3) por dos o tres minutos.\n5. Abre los ojos sin fijarte en nada. Mantén tu atención en el espacio alrededor de ti.\n6. Camina como tu yo del futuro unos diez minutos. Cada paso, siente que ya lo eres.\n7. Detente, cierra los ojos y vuelve a subir tu energía unos minutos.\n8. Camina otros diez minutos.\n9. Al final, quédate quieta, mano en el corazón, y di lo que sientes: \"Soy libre\", \"Soy suficiente\", \"Estoy en paz\".\n\n## Pregúntate todo el día\nLa versión corta es una pregunta: **¿cómo lo haría la mujer que ya logró lo que quiero?** ¿Cómo contestaría este mensaje? ¿Cómo hablaría con su hija ahorita? ¿Cómo se sentaría? ¿Qué haría con esta hora libre?\n\n> Con el tiempo empiezas a pensar, actuar y sentir como ella, porque ya instalaste esos caminos en tu cerebro.\n\n## Ojos abiertos todo el día\nSi te descubres reaccionando como antes, no te regañes. Respira, regresa al corazón y vuelve a elegir. Esa elección repetida es el cambio.\n\n## 🪞 Mírate al espejo\n¿En qué momento del día es más difícil ser tu yo del futuro?\n\n## ✍️ Ejercicio\nDescribe a tu yo del futuro en cinco líneas: cómo se levanta, cómo habla, cómo trabaja, cómo descansa y cómo se siente.\n\n## ✅ Tu tarea de la semana\nHaz la meditación caminando una vez y, el resto de los días, hazte la pregunta \"¿cómo lo haría ella?\" tres veces al día.\n\n## 💬 Para compartir en el grupo\nCuéntanos una decisión que tomaste esta semana como tu yo del futuro.\n\n@@ 9 | Clase 9 | Más allá del tiempo | Lo místico, con los pies en la tierra\nEsta es la parte más profunda del libro. Habla de experiencias muy intensas en meditación, de una pequeña glándula en el centro del cerebro y de salir de la idea normal del tiempo. Tómala con curiosidad.\n\n## Espacio-tiempo y tiempo-espacio\nEn la vida diaria vivimos en el espacio y el tiempo pasa: vamos de un lugar a otro y miramos el reloj. El libro propone que en meditación muy profunda pasa lo contrario: sientes que el tiempo se detiene y tu atención se abre a algo mucho más grande.\n\nQuizás ya lo viviste: una meditación donde sentiste que pasaron cinco minutos y fue media hora. O un momento de conexión tan fuerte que no tenías palabras.\n\n## Conectarte con todo\nEl libro describe la práctica en dos pasos. Primero, dejar de ser alguien: sin cuerpo, sin nombre, sin pendientes. Luego, sentirte conectada con todo y con todos. Mucha gente describe esa sensación como unidad, paz o amor muy grande.\n\n## La glándula pineal\nEs una glándula pequeñita en el centro del cerebro que tiene que ver con el sueño (produce melatonina). El libro la ve como una antena para experiencias internas muy vívidas, como sueños con los ojos abiertos. Es una idea del autor; la ciencia todavía estudia mucho de lo que propone.\n\n## La práctica, versión sencilla\n1. Respira por el corazón y siente una emoción elevada.\n2. Haz la respiración de la Clase 5 con una canción.\n3. Pon música sin letra, de 10 a 15 minutos.\n4. Suelta tu cuerpo, tu nombre y la hora. Solo atención.\n5. Luego siente que estás conectada con todas las personas y todas las cosas.\n6. Quédate ahí sin esperar nada. Cuando termines, regresa despacio.\n\n> No persigas la experiencia. Practica, suelta y deja que llegue cuando llegue.\n\n## Pies en la tierra\n- No necesitas despertarte de madrugada. Duerme: tu descanso también es práctica.\n- No hay experiencia \"correcta\". Si solo sentiste calma, eso ya vale.\n- Si en meditación salen recuerdos o emociones muy fuertes, para, abre los ojos y busca apoyo con alguien de confianza o con un profesional.\n\n## 🪞 Mírate al espejo\n¿Alguna vez sentiste que el tiempo se detenía? ¿Qué estabas haciendo?\n\n## ✍️ Ejercicio\nHaz la práctica sencilla una vez y escribe lo que sentiste, sin juzgarlo, aunque sea \"nada\".\n\n## ✅ Tu tarea de la semana\nPon una libreta junto a tu cama y anota tus sueños o ideas al despertar tres días.\n\n## 💬 Para compartir en el grupo\n¿Has vivido algún momento que no puedas explicar con palabras? Solo si te nace compartir.\n\n@@ 10 | Clase 10 | Meditar juntas | Coherencia en equipo\nUna mujer en calma cambia su casa. Un grupo de mujeres en calma cambia su entorno. Esta clase es para practicar en equipo.\n\n## La fuerza del grupo\nEn los talleres del libro midieron a muchas personas meditando al mismo tiempo, y su corazón entraba en coherencia a la vez, como si se contagiaran. También hay estudios sobre grupos grandes que meditan con intención de paz. El libro concluye que nuestra energía influye en las demás aunque no estemos juntas físicamente.\n\nMás allá de lo que digan los estudios, ya sabes cómo funciona: cuando una del equipo llega con buena energía, se nota. Y cuando alguien llega con drama, también.\n\n## Una intención para las demás\nLa práctica en grupo no es para pedir para ti. Es para desearle lo mejor a otras: que sus metas se cumplan, que sus casas estén en paz, que su salud esté bien. Cuando abres el corazón por otra persona, el tuyo también se ordena.\n\n## La práctica en equipo\n1. Pónganse de acuerdo en un día y una hora, cada quien desde su casa o en llamada.\n2. Respiren por el corazón y despierten una emoción elevada.\n3. Sientan el espacio que ocupa su corazón y el espacio alrededor.\n4. Imaginen al equipo completo, una por una, y mándenle esa energía.\n5. Después imaginen su ciudad, su país y el planeta entero dentro del corazón.\n6. Terminen agradeciendo.\n\n> Lo que deseas con el corazón abierto para otras, también lo practicas para ti.\n\n## Sostener la práctica\nYa terminaste las clases, pero la práctica sigue. Lo que cambia la vida no es haber leído esto: es hacerlo diario. Usa **Tu plan de 30 días** para que no se quede aquí.\n\n## 🪞 Mírate al espejo\n¿Qué energía le llevas al grupo cuando tienes un mal día?\n\n## ✍️ Ejercicio\nEscribe el nombre de tres compañeras del equipo y lo que les deseas con todo el corazón.\n\n## ✅ Tu tarea de la semana\nPropón en el grupo una meditación juntas de 15 minutos y hazla.\n\n## 💬 Para compartir en el grupo\nManda a una compañera lo que le deseaste en el ejercicio.\n\n@@ 11 | Herramientas | Tu hoja de intención | Para tenerla enfrente al meditar\nLlénala una vez, léela antes de cada meditación y cámbiala cuando tu vida cambie.\n\n## 1. Tu letra\nUna letra mayúscula que represente lo que quieres vivir. Dibújala en grande con dos círculos alrededor.\n\n## 2. Lo que significa\nAl menos cuatro detalles de cómo se ve. Sin fechas.\n- Ejemplo: \"Tengo una rutina de mañana en paz.\"\n- \"Hablo con mis hijas con paciencia.\"\n- \"Tengo un negocio que me deja tiempo libre.\"\n- \"Duermo tranquila.\"\n\n## 3. Cómo se siente\nLas emociones que vas a sentir cuando pase. Elige las tuyas:\n- Gratitud\n- Libertad\n- Alegría\n- Paz\n- Confianza\n- Amor por la vida\n- Sentirte suficiente\n\n## 4. Tu frase\nUna frase en presente que resuma todo: \"Vivo en paz y con tiempo para lo que amo.\"\n\n## 5. Cómo la usas\n1. Léela con calma antes de cerrar los ojos.\n2. Medita con la práctica de la Clase 3.\n3. Al abrir los ojos, haz una acción pequeña que haría tu yo del futuro.\n\n> Escribirlo a mano lo vuelve real. Ponla donde la veas.\n\n@@ 12 | Herramientas | Guía rápida de prácticas | Las meditaciones en una sola vista\nTodas las prácticas del curso, con su tiempo y para qué sirven. Elige según el día que tengas.\n\n## 1 minuto\n- **Alarma de gratitud** (Clase 6): atención al pecho y gratitud. Para cortar el estrés.\n- **\"¿Cómo lo haría ella?\"** (Clase 8): una pregunta antes de responder.\n\n## 10 minutos\n- **Atención al espacio** (Clase 2): para bajar revoluciones y volver al presente.\n- **Corazón coherente** (Clase 6): para calmarte y sostener una emoción.\n- **Tu película del futuro** (Clase 7): mañana y noche.\n\n## 20 a 30 minutos\n- **Sintonizar tu futuro** (Clase 3): con tu hoja de intención.\n- **Recorrido de los centros** (Clase 4): ideal antes de dormir.\n- **Respiración con canción** (Clase 5): cuando te sientes sin energía.\n- **Caminando** (Clase 8): para llevarte la práctica al día.\n\n## Más largas, cuando tengas tiempo\n- **Más allá del tiempo** (Clase 9).\n- **Meditar juntas** (Clase 10): con el equipo, una vez a la semana o al mes.\n\n## Para que te salga mejor\n- Mismo lugar y misma hora.\n- Música sin letra, lenta, que no te traiga recuerdos.\n- Celular en modo avión.\n- Si te distraes, regresa. Eso es la práctica.\n\n@@ 13 | Herramientas | Tu plan de 30 días | Para que la práctica se quede\nCuatro semanas para pasar de leer a vivirlo. Marca cada día en tu cuaderno.\n\n## Semana 1: volver al presente\n- Diario: atención al espacio, 10 minutos.\n- Detecta tu emoción de siempre y respira antes de reaccionar.\n- Llena tu hoja de intención.\n\n## Semana 2: sentir antes de ver\n- Diario: sintonizar tu futuro, 15 a 20 minutos.\n- Dos veces: recorrido de los centros antes de dormir.\n- Cuatro alarmas de gratitud al día.\n\n## Semana 3: tu película\n- Arma tu película del futuro.\n- Mírala mañana y noche.\n- Dos veces: respiración con canción.\n\n## Semana 4: llévalo a la vida\n- Una meditación caminando.\n- Pregúntate \"¿cómo lo haría ella?\" tres veces al día.\n- Una meditación en equipo.\n\n## Al terminar\nResponde en tu cuaderno:\n1. ¿Qué cambió en cómo reacciono?\n2. ¿Qué coincidencias o cambios noté?\n3. ¿Qué práctica me quedo para siempre?\n\n> No tienes que hacerlo todo. Elige una práctica y no la sueltes.\n";
var FAQ_MD="## Empezar | 0\n\n### Nunca he meditado. ¿Esto es para mí?\nSí. El curso empieza desde cero. La primera práctica (Clase 2) es solo llevar tu atención a distintas partes del cuerpo y al espacio alrededor. Si puedes sentarte 10 minutos, puedes empezar.\n\n### ¿Cuánto tiempo necesito al día?\nCon 10 minutos diarios es suficiente para empezar. Algunas prácticas duran más, pero en la **Guía rápida de prácticas** tienes opciones de 1, 10 y 30 minutos.\n\n### ¿A qué hora es mejor meditar?\nAl despertar o antes de dormir, porque tu mente está más tranquila y receptiva. Lo más importante es que sea a la misma hora y en el mismo lugar.\n\n### ¿Dónde se guarda lo que escribo?\nEn el cuaderno de cada clase, solo en este celular y este navegador. Si cambias de teléfono o borras los datos del navegador se pierde, así que copia lo importante a tu libreta.\n\n## La práctica | 2\n\n### Me distraigo todo el tiempo. ¿Lo estoy haciendo mal?\nNo. Distraerte es parte de la práctica. Cada vez que te das cuenta y regresas, estás entrenando tu atención. Con los días vas a tardar menos en volver.\n\n### Me quedo dormida cuando medito. ¿Qué hago?\nSiéntate con la espalda derecha en vez de acostarte y medita a una hora en que no estés agotada. Si te pasa en el recorrido de los centros antes de dormir, no pasa nada: ahí sí se vale.\n\n### ¿Qué música uso?\nPara meditar, música sin letra, lenta y que no te traiga recuerdos. Para la respiración de la Clase 5, una canción que te inspire. Para tu película, una canción que te emocione y que uses solo para eso.\n\n### ¿Tengo que hacer todas las prácticas?\nNo. Pruébalas todas una vez y quédate con la que más te funcione. Es mejor una práctica diaria que cinco de vez en cuando.\n\n### La respiración me marea. ¿Es normal?\nPuede pasar al principio. Hazla más lenta y sin retener el aire. Si estás embarazada, tienes presión alta o algún tema de salud, hazla muy suave o salta directo a las emociones.\n\n## Intención y emoción | 3\n\n### ¿Qué hago si no siento nada cuando intento sentir gratitud?\nPiensa en algo concreto: la risa de tus hijas, una comida rica, una amiga que te ayudó. La emoción llega más fácil con un recuerdo real. Con práctica se vuelve más rápido.\n\n### ¿Esto es la \"ley de la atracción\"?\nSe parece, pero aquí lo importante es tu estado y tus decisiones. Sentir tu futuro te ayuda a actuar con confianza en lugar de miedo. Sentarte a esperar sin hacer nada no es parte del curso.\n\n### ¿Puedo pedir dinero en mi intención?\nPuedes poner metas de negocio, pero el curso no promete ingresos ni fechas. Funciona mejor cuando pones cómo te quieres sentir y en quién te quieres convertir, y luego actúas como ella.\n\n### ¿Cuánto tarda en pasar lo que intenciono?\nNadie te lo puede decir. Lo que sí notas pronto es cómo cambian tus reacciones, tu calma y tu forma de decidir. Lleva un diario para ver los cambios pequeños.\n\n## Cuerpo y salud | 4\n\n### ¿Esto puede curar una enfermedad?\nEl libro cuenta historias de personas que mejoraron su salud, pero este curso no promete curar nada. Meditar puede ayudarte a manejar el estrés y sentirte mejor. Si tienes un diagnóstico, sigue con tu médico y tu tratamiento.\n\n### ¿Qué son los centros de energía?\nSon ocho zonas del cuerpo donde el libro propone poner la atención, de la base de la columna a arriba de la cabeza. Coinciden con zonas donde hay muchos nervios y glándulas. Están explicados en la Clase 4.\n\n### ¿Esto sustituye a la terapia?\nNo. Si estás pasando por un duelo, ansiedad fuerte o algo muy pesado, busca apoyo profesional. La meditación puede acompañar, pero no reemplaza.\n\n## Vida diaria | 6\n\n### Tengo niñas pequeñas y nunca estoy sola. ¿Cómo practico?\nUsa los momentos cortos: las alarmas de gratitud de un minuto, la pregunta \"¿cómo lo haría ella?\" o 10 minutos antes de que despierten. También puedes invitarlas a respirar contigo.\n\n### ¿Cómo hago para no regresar a lo mismo al abrir los ojos?\nEso se entrena en la Clase 8, con la meditación caminando y preguntándote durante el día cómo actuaría tu yo del futuro. Si reaccionas como antes, respira y vuelve a elegir.\n\n### ¿Con qué app hago mi película del futuro?\nCon la que ya tengas: CapCut, Canva o la app de fotos de tu celular sirven. Lo importante son las imágenes, las frases en presente y la canción. Los pasos están en la Clase 7.\n\n## La mentora | 0\n\n### ¿Qué es \"Tu mentora\"?\nEs la mentora dentro de Claude. Te guía las meditaciones paso a paso, te ayuda a escribir tu hoja de intención y las frases de tu película, y te da las clases una por una.\n\n### ¿Tengo que pagar Claude?\nNo. Funciona con la cuenta gratis de claude.ai. La cuenta gratis tiene un límite de mensajes al día.\n\n### ¿Cómo la instalo?\nDescarga la mentora (.zip) en la pestaña **Tu mentora**. En Claude entra a Customize → Skills, toca \"+\", luego \"Create skill\" → \"Upload a skill\" y sube el zip sin descomprimir.\n";

function waveY(x,n){
  var base=50+30*Math.sin((x-5)/10*0.95+0.5);
  var jag=n*0.62*(15*Math.sin(x*0.83+1.3)+10*Math.sin(x*1.91+0.4)+7*Math.sin(x*3.7+2.2)+5*Math.sin(x*6.1));
  return base+jag;
}
function wavePath(n){var d="";for(var x=0;x<=100;x+=0.5){d+=(x?"L":"M")+x+","+waveY(x,n).toFixed(2);}return d;}
function drawWave(target,instant){
  var p=document.getElementById("cWave");if(!p)return;
  cancelAnimationFrame(WAVE.raf);
  var from=WAVE.noise==null?1.35:WAVE.noise;
  if(instant||from===target){WAVE.noise=target;p.setAttribute("d",wavePath(target));return;}
  var t0=performance.now(),dur=WAVE.noise==null?1700:700;
  (function step(now){var k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3),n=from+(target-from)*e;WAVE.noise=n;p.setAttribute("d",wavePath(n));if(k<1)WAVE.raf=requestAnimationFrame(step);})(t0);
}

function md(src){

function L(id){for(var i=0;i<LESSONS.length;i++)if(LESSONS[i].id===id)return LESSONS[i];return null;}
var N=CFG.n,STEPS=[];for(var i=1;i<=N;i++)STEPS.push(i);
var ORDER=LESSONS.map(function(l){return l.id;});
var GROUPS=CFG.groups.map(function(g){var p=g[0].split(" · ");return {name:p.length>1?p[1]:g[0],pre:p.length>1?p[0]:"",ids:g[1]};});

var TOOLS=ORDER.filter(function(i){return i>N;});

function count(){return STEPS.filter(function(i){return seen.has(i);}).length;}
function stateOf(id){return seen.has(id)?"seen":(id===nextUp()?"next":"");}
function actOf(id){for(var i=0;i<ACTS.length;i++)if(ACTS[i].ids.indexOf(id)>=0)return ACTS[i];return null;}
function label(id){var x=L(id);if(!x)return "";if(id===0)return CFG.welcomeLabel||"Bienvenida";var m=x.title.match(/^([^·]{1,14}) · /);if(isStep(id)&&m)return m[1];return x.kicker;}

var CTX={ttl:ttl,L:L,LESSONS:LESSONS,N:N,STEPS:STEPS,ACTS:ACTS,TOOLS:TOOLS,GROUPS:GROUPS,seen:seen,stateOf:stateOf,nextUp:nextUp,count:count,esc:esc,label:label,ctaText:ctaText,cfg:CFG,reduce:reduce,actOf:actOf,open:function(id){openLesson(id);}};

/* ---------- faq ---------- */
var norm=function(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");};
var STOP=new Set("que como para por con los las del una uno unos mis tus sus mas pero porque cuando donde esta este eso hay tengo puedo debo".split(" "));
function terms(s){return (norm(s).match(/[a-z0-9ñ]{3,}/g)||[]).filter(function(w){return !STOP.has(w);}).map(function(w){return w.length>5?w.slice(0,-1):w;});}
var FAQ=[],CATS=[];
FAQ_MD.split(/^## /m).filter(function(x){return x.trim();}).forEach(function(block){
  var lines=block.split("\n"),h=lines[0].split("|").map(function(x){return x.trim();});if(!h[0])return;CATS.push({cat:h[0],cls:+h[1]});
  lines.slice(1).join("\n").split(/^### /m).filter(function(x){return x.trim();}).forEach(function(qb){var i=qb.indexOf("\n");if(i<0)return;FAQ.push({cat:h[0],cls:+h[1],q:qb.slice(0,i).trim(),a:qb.slice(i+1).trim()});});
});
FAQ.forEach(function(f){f.n=norm(f.q+" "+f.a);});
function hl(html,ts){if(!ts.length)return html;return html.replace(/(>[^<]+<)/g,function(seg){var out=seg;ts.forEach(function(w){var re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").split("").map(function(ch){return ({a:"[aá]",e:"[eé]",i:"[ií]",o:"[oó]",u:"[uúü]",n:"[nñ]"})[ch]||ch;}).join("")+"[a-záéíóúñü]*)","gi");out=out.replace(re,"<mark>$1</mark>");});return out;});}
var fq=$("#fq"),faqEl=$("#faq"),fcount=$("#fcount"),curCat=null;
function isMentorCat(c){return /mentor/i.test(c);}
function renderCats(){var c=$("#cats");c.innerHTML="";[{cat:"Todas"}].concat(CATS).forEach(function(x){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=x.cat;b.setAttribute("aria-pressed",String((x.cat==="Todas"&&!curCat)||x.cat===curCat));b.onclick=function(){curCat=x.cat==="Todas"?null:x.cat;renderCats();renderFaq();};c.appendChild(b);});}
function renderFaq(){
  var qtxt=fq.value.trim(),ts=Array.from(new Set(terms(qtxt))),items=FAQ.filter(function(f){return !curCat||f.cat===curCat;});
  if(ts.length){items=items.map(function(f){return {f:f,s:ts.reduce(function(a,w){return a+(f.n.indexOf(w)>=0?(norm(f.q).indexOf(w)>=0?3:1):0);},0)};}).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;}).map(function(x){return x.f;});}
  faqEl.innerHTML="";
  var gs=ts.length?[[null,items]]:CATS.map(function(c){return [c.cat,items.filter(function(f){return f.cat===c.cat;})];}).filter(function(g){return g[1].length;});
  gs.forEach(function(g){var d=document.createElement("div");d.className="fgroup";if(g[0]){var h=document.createElement("h3");h.textContent=g[0];d.appendChild(h);}
    g[1].forEach(function(f,idx){var det=document.createElement("details");det.className="qa";var x=isMentorCat(f.cat)?null:L(f.cls);
      det.innerHTML="<summary><span>"+hl(">"+esc(f.q)+"<",ts).slice(1,-1)+'</span><i aria-hidden="true">+</i></summary><div class="ans">'+hl(md(f.a),ts)+(x?'<button class="btn go" type="button">Ver: '+esc(x.title)+"</button>":(isMentorCat(f.cat)?'<button class="btn go" type="button">Ir a Tu '+mw+"</button>":""))+"</div>";
      var go=det.querySelector(".go");if(go)go.onclick=function(){if(x)openLesson(f.cls);else setTab("M");};
      if(ts.length&&idx===0)det.open=true;d.appendChild(det);});faqEl.appendChild(d);});
  fcount.textContent=ts.length?(items.length?items.length+(items.length===1?" respuesta":" respuestas")+' para "'+qtxt+'"':'No hay una pregunta frecuente sobre "'+qtxt+'". Pregúntale a tu '+mw+"."):"";
}
var ft;fq.addEventListener("input",function(){clearTimeout(ft);ft=setTimeout(renderFaq,150);});

/* ---------- mentor ---------- */
(function(){
  var M=MENTOR,h='<div class="m-col"><div><h2 class="sec-h">'+esc(M.title)+'</h2><p class="sec-p">'+esc(M.intro)+"</p></div>"+
    '<ul class="m-can">'+M.can.map(function(c){return "<li><b>"+esc(c[0])+"</b><span>"+esc(c[1])+"</span></li>";}).join("")+"</ul>"+
    '<div class="m-dl"><button type="button" class="btn solid" id="dlZip" hidden>Descargar '+(mw==="mentor"?"el mentor":"la mentora")+' (.zip)</button>'+(CFG.mdVar?'<button type="button" class="btn" id="dlMd" hidden>Descargar las instrucciones (.md)</button>':"")+'</div><p class="m-note" id="dlMsg">'+esc(M.notes[0]||"")+"</p></div>"+

    (M.notes[1]?'<p class="m-note">'+esc(M.notes[1])+"</p>":"")+(M.limits.length?'<div class="m-limits" aria-label="Límites">'+M.limits.map(function(s){return "<span>"+esc(s)+"</span>";}).join("")+"</div>":"")+"</div>";

    try{navigator.clipboard.writeText(el.textContent).then(function(){btn.textContent="Copiado";setTimeout(function(){btn.textContent="Copiar";},1600);},selt);}catch(e){selt();}});});
  if(window.claude&&window.claude.use){window.claude.use("downloads").then(function(dl){
    var msg=$("#dlMsg"),bz=$("#dlZip"),bm=$("#dlMd");if(!dl)return;

    function bytes(b64){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
    function save(name,data){dl.save({filename:name,data:data}).then(function(){msg.textContent="Listo: "+name+" descargado.";},function(e){var c=e&&e.code;
      if(c==="declined")msg.textContent="Descarga cancelada.";else if(c==="rate_limited")msg.textContent="Ya hay una descarga abierta. Termínala e intenta de nuevo.";else{msg.textContent=M.notes[0]||"Aquí no se puede descargar.";bz.hidden=true;if(bm)bm.hidden=true;}});}
    bz.onclick=function(){save(CFG.zipName,bytes(window[CFG.zipVar]));};if(bm)bm.onclick=function(){save(CFG.mdName,bytes(window[CFG.mdVar]));};

/* ---------- reader sheet ---------- */
var cur=null;
function neighbours(id){var k=ORDER.indexOf(id);return {prev:ORDER[k-1],next:ORDER[k+1]};}
function where(x){if(x.id===0)return CFG.welcomeLabel||"Bienvenida";if(isStep(x.id)){var a=actOf(x.id);return label(x.id)+" de "+N+(a&&a.name!=="Clases"?", "+a.name:"");}return x.kicker;}
function sheetHTML(x){
  var b=lessonBody(x.body),nb=neighbours(x.id),s=seen.has(x.id),nx=nb.next!==undefined?L(nb.next):null;
  var num=isStep(x.id)?(SKIN.readerNum?SKIN.readerNum(x,CTX):String(x.id)):null;
  var turn=b.tasks.length?'<section class="turn"><h3>Tu turno</h3>'+b.tasks.map(function(t){return '<div class="task"><h4>'+esc(t.title)+"</h4>"+t.html+"</div>";}).join("")+
    '<label class="nb-l" for="nb">Tu cuaderno</label><textarea id="nb" placeholder="Escribe aquí tu ejercicio. Se guarda en este dispositivo."></textarea><span class="saved" id="nbs"></span></section>':"";
  return '<div class="grab" id="grab"><span class="where">'+esc(where(x))+'</span><button type="button" class="x" id="closeB">Cerrar</button></div><div class="scroll" id="scroll">'+
    '<div class="r-head'+(num?"":" nonum")+'">'+(num?'<span class="r-num" aria-hidden="true">'+esc(num)+"</span>":"")+'<p class="r-k">'+esc(isStep(x.id)?label(x.id):(x.id===0?(CFG.welcomeLabel||"Bienvenida"):x.kicker))+'</p><h1 class="r-title" id="rTitle">'+esc(ttl(x))+'</h1></div><p class="r-topic">'+esc(x.topic)+'</p><p class="r-intro">'+inline(esc(x.intro))+'</p><div class="lesson-body">'+b.html+"</div>"+turn+
    '<div class="r-foot"><div class="nav"><button class="btn" type="button" id="prevB" '+(nb.prev===undefined?"disabled":"")+'>Anterior</button><button class="btn solid" type="button" id="nextB" '+(nb.next===undefined?"disabled":"")+">Siguiente</button></div>"+
    (isStep(x.id)?'<button class="btn'+(s?" done":"")+'" type="button" id="seenB" aria-pressed="'+s+'">'+(s?"Completada ✓":"Marcar como completada")+"</button>":"")+
    (nx?'<p class="r-next">Sigue: '+esc(ttl(nx))+"</p>":"")+"</div></div>";
}
function openLesson(id,trigger){
  var x=L(id);if(!x)return;
  var fresh=!cur;
  if(fresh){
    var scrim=document.createElement("div");scrim.className="scrim";var sh=document.createElement("div");sh.className="sheet";sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");sh.setAttribute("aria-labelledby","rTitle");
    document.body.appendChild(scrim);document.body.appendChild(sh);document.body.classList.add("sheet-open");
    cur={scrim:scrim,sh:sh,trigger:trigger||document.activeElement};
    scrim.onclick=closeLesson;
  }
  cur.id=id;cur.sh.innerHTML=sheetHTML(x);
  var sh=cur.sh;
  if(fresh)requestAnimationFrame(function(){requestAnimationFrame(function(){sh.classList.add("on");cur&&cur.scrim.classList.add("on");});});
  $("#closeB",sh).onclick=closeLesson;$("#closeB",sh).focus({preventScroll:true});
  var nb=neighbours(id);
  $("#prevB",sh).onclick=function(){openLesson(nb.prev);};
  $("#nextB",sh).onclick=function(){if((isStep(id)||id===0)&&!seen.has(id)){seen.add(id);saveSeen();refresh();}openLesson(nb.next);};
  var sb=$("#seenB",sh);if(sb)sb.onclick=function(){seen.has(id)?seen.delete(id):seen.add(id);saveSeen();var on=seen.has(id);sb.textContent=on?"Completada ✓":"Marcar como completada";sb.classList.toggle("done",on);sb.setAttribute("aria-pressed",String(on));refresh();};
  var ta=$("#nb",sh);if(ta){ta.value=notes[id]||"";var t;ta.oninput=function(){clearTimeout(t);t=setTimeout(function(){notes[id]=ta.value;store.set(CFG.key+"-notes",notes);$("#nbs",sh).textContent="Guardado en este dispositivo";},400);};}
  $("#scroll",sh).scrollTop=0;
  try{history.replaceState(null,"","#clase-"+id);}catch(e){}
  var g=$("#grab",sh),y0=null,dy=0,t0=0;
  g.addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;y0=e.clientY;dy=0;t0=performance.now();sh.classList.add("drag");try{g.setPointerCapture(e.pointerId);}catch(_){}});
  g.addEventListener("pointermove",function(e){if(y0==null)return;dy=e.clientY-y0;sh.style.transform="translateY("+(dy<0?dy*.15:dy)+"px)";});
  function end(){if(y0==null)return;var v=dy/Math.max(1,performance.now()-t0);sh.classList.remove("drag");sh.style.transform="";y0=null;if(dy>140||v>.5)closeLesson();}
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
}
function closeLesson(){
  if(!cur)return;var c=cur;cur=null;document.body.classList.remove("sheet-open");
  c.sh.classList.remove("on");c.scrim.classList.remove("on");setTimeout(function(){c.sh.remove();c.scrim.remove();},reduce?0:500);
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  var t=document.querySelector('#progView [data-open="'+c.id+'"]')||c.trigger;if(t&&t.focus)t.focus({preventScroll:false});
}
