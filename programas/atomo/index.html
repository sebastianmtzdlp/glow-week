<style>

/* ---------- reader sheet (the lights come on) ---------- */

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:clamp(22px,5vw,48px) clamp(18px,5vw,56px) calc(56px + env(safe-area-inset-bottom,0px))}

.r-head.nonum{grid-template-columns:minmax(0,1fr)}

.lesson-body strong{font-weight:700}
.lesson-body h3{font:var(--r-h3-font,700 26px/1.15 var(--display));margin:36px 0 10px;text-wrap:balance}

.callout p{margin:0;font:var(--r-callout-font,700 clamp(22px,4.6vw,28px)/1.2 var(--display));max-width:34ch;text-wrap:balance}

.task p:last-child,.task ul:last-child,.task ol:last-child{margin-bottom:0}
.nb-l{font-weight:600;font-size:14px;color:var(--r-muted);margin-top:6px}
.sheet textarea{width:100%;min-height:150px;resize:vertical;font:16px/1.55 var(--r-body,var(--body));color:var(--r-ink);background:var(--r-surface);border:1px solid var(--r-line);border-radius:12px;padding:14px 16px}

.sheet .btn{border-color:var(--r-line);color:var(--r-ink)}
.sheet .btn.solid{background:var(--r-ink);border-color:var(--r-ink);color:var(--r-bg)}
.sheet .btn.done{background:var(--r-accent);border-color:var(--r-accent);color:var(--r-accent-ink,var(--r-bg))}

/* Átomo: the book's cover. Paper white, heavy black type, one gold. The moment: a year of dots, one per day, that stay tiny for months and then swell (1% compounding); your finished classes fill them gold. */
:root{
  --bg:#FBFAF6; --surface:#FFFFFF; --ink:#141414; --muted:#5E5B53; --line:#E4E0D6; --accent:#E0A21A; --accent-ink:#141414; --accent-text:#8A5E00; --dot-off:#D6D1C3; --focus:#8A5E00; --mark:rgba(224,162,26,.35);

  --r-num-font:900 clamp(76px,17vw,118px)/.8 var(--display); --r-title-font:900 clamp(30px,6vw,46px)/1 var(--display); --r-h3-font:800 23px/1.15 var(--display); --r-callout-font:800 clamp(21px,4.4vw,27px)/1.22 var(--display);
  --card-r:6px; --btn-r:4px; --tabs-r:4px; --field-r:6px;
}

  --r-bg:#1A1916; --r-surface:#232220; --r-ink:#F3F0E8; --r-muted:#A8A397; --r-line:#34322C; --r-accent:#EDB735; --r-accent-ink:#141414; --r-callout-bg:#EDB735; --r-callout-ink:#141414; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131311; --surface:#1C1B18; --ink:#F3F0E8; --muted:#A8A397; --line:#2E2C27; --accent:#EDB735; --accent-ink:#141414; --accent-text:#EDB735; --dot-off:#3A372F; --focus:#EDB735; --mark:rgba(237,183,53,.3);

}

.sec-h{letter-spacing:-.02em;font-stretch:112%}

/* hero */
.a-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px 48px;align-items:center;padding-block:40px 6px}
@media (max-width:820px){.a-hero{grid-template-columns:minmax(0,1fr);padding-top:24px}}
.a-copy{display:flex;flex-direction:column;gap:16px;min-width:0}

.a-mark i{font-style:normal;color:var(--accent)}
.a-pitch{margin:0;color:var(--muted);max-width:40ch;font-size:17.5px}

.a-year{margin:0;min-width:0;display:grid;gap:10px}

.a-year figcaption span:last-child{text-align:right}

/* route */
.a-route{display:grid;gap:40px;max-width:780px;margin:0 auto;width:100%}

.a-rule::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.a-list{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.a-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:15px 4px;cursor:pointer;color:var(--ink);transition:transform .16s cubic-bezier(.23,1,.32,1),background-color .2s}
.a-row:active{transform:scale(.985)}

.a-row .n{font:900 30px/1 var(--display);font-stretch:112%;color:var(--muted);opacity:.45;text-align:center;font-variant-numeric:tabular-nums}
.a-row b{display:block;font-weight:700;font-size:17px;line-height:1.3}

.a-row.next{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}

.a-tool{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r);padding:15px 16px;cursor:pointer;color:var(--ink);transition:transform .16s cubic-bezier(.23,1,.32,1)}
.a-tool:active{transform:scale(.98)}
.a-tool b{display:block;font-weight:700}

.a-tool span[aria-hidden]{color:var(--accent-text);font-weight:800}
.r-title:focus{outline:none}

var LESSONS_MD="@@ 0 | Empieza aquí | Bienvenida a Átomo | El curso en 5 minutos\nEste curso es para cuando ya sabes lo que te conviene hacer, pero no lo haces. O lo haces tres días y luego se te olvida. Aquí no vas a necesitar más fuerza de voluntad: vas a aprender a armar hábitos que se sostengan solos.\n\n## De qué se trata\nUn átomo es lo más pequeño que existe, y también es una fuente enorme de energía. Así son los hábitos: cosas chiquitas que, repetidas todos los días, cambian tu vida entera. Para bien o para mal.\n\nLa idea central del curso es esta: **no subes al nivel de tus metas, bajas al nivel de tus sistemas**. Tus metas dicen a dónde quieres llegar. Tus hábitos deciden si llegas.\n\n> Pequeños cambios, todos los días. Eso es todo el secreto, y también todo el trabajo.\n\n## Cómo está armado\n- **Los cimientos (clases 1 a 3).** Por qué lo pequeño importa tanto, por qué tus hábitos dicen quién eres y cómo funciona un hábito por dentro.\n- **Las cuatro reglas (clases 4 a 10).** Un método sencillo para crear cualquier hábito bueno: que se vea, que se antoje, que cueste poquito y que se sienta bien. Y su versión al revés, para dejar los malos.\n- **Para ir más lejos (clases 11 y 12).** Cómo elegir los hábitos que van contigo, qué hacer cuando te aburres y cómo revisar tu avance sin castigarte.\n- **Herramientas.** Las cuatro reglas en una hoja, el inventario de tu día, fórmulas para copiar y un tracker de 30 días.\n\n## Lo que necesitas\n- Un cuaderno (o el cuaderno de cada clase, que se guarda en tu celular).\n- Un hábito que quieras crear y uno que quieras dejar. Si todavía no sabes cuáles, la clase 4 te ayuda a encontrarlos.\n- Diez minutos al día para leer y hacer el ejercicio. Una clase por día o dos por semana, como te acomode.\n\n## Cómo sacarle provecho\nNo leas todo de corrido. Cada clase termina con un ejercicio chiquito: hazlo antes de pasar a la siguiente. El curso funciona igual que los hábitos: poquito, pero seguido.\n\n## 🪞 Para pensar\n¿Qué cosa has intentado empezar más de tres veces? ¿Qué pasó la última vez que la dejaste?\n\n## ✍️ Escribe\nEscribe un hábito que quieras crear y uno que quieras dejar. Por ejemplo: \"Quiero publicar una historia al día\" y \"Quiero dejar de revisar el celular en la cama\".\n\n@@ 1 | Los cimientos | Clase 1 · El poder del 1% | Por qué lo pequeño cambia todo\nCasi siempre creemos que para cambiar algo hace falta un cambio enorme. Un plan nuevo, un lunes perfecto, una gran decisión. Pero los cambios que se quedan casi nunca se ven así.\n\n## La cuenta del 1%\nImagina que mejoras 1% cada día. Un poquito. Algo que nadie notaría. Si lo sostienes un año, matemáticamente terminas casi 37 veces mejor que como empezaste. Y si empeoras 1% cada día, terminas casi en cero.\n\nEso es lo que hacen los hábitos: **funcionan como el interés compuesto**. Lo que repites se suma y se multiplica con el tiempo. Una historia al día no cambia tu negocio esta semana. Trescientas sesenta y cinco historias, sí.\n\n> Tus hábitos son el interés compuesto de tu vida. Lo que repites todos los días, crece.\n\n## Funciona para los dos lados\nEl mismo efecto que te ayuda también te puede hundir. Un gasto chiquito de café, un \"nomás un ratito\" de redes, una noche más sin dormir bien. Ninguno se nota hoy. Juntos, en un año, sí.\n\nPor eso vale la pena poner atención a lo pequeño: no porque una sola vez importe mucho, sino porque casi nunca es una sola vez.\n\n## La meseta escondida\nAquí está la parte que hace que casi todas se rindan. Al principio trabajas y no ves nada. Publicas, das seguimiento, haces ejercicio, y todo se ve igual. Parece que no está sirviendo.\n\nPero sí está sirviendo. Es como un hielo en un cuarto frío que se va calentando grado por grado: a 29, a 30, a 31 grados bajo cero sigue igual de hielo... y de repente, en un grado más, se empieza a derretir. El grado que lo derritió no fue más importante que los anteriores. Solo fue el que hizo visible todo lo que ya se había acumulado.\n\n> Cuando sientas que no avanzas, no estás estancada. Estás acumulando.\n\n## Olvídate un poco de las metas\nLas metas sirven para saber a dónde vas. Pero todas las que compiten quieren ganar, y no todas ganan. Lo que hace la diferencia es el sistema: lo que haces todos los días.\n\nLas metas también tienen trampa: te hacen pensar \"cuando llegue, voy a estar contenta\". Y si llegas, muchas veces dejas de hacer lo que te llevó ahí. Si te enamoras del sistema, ya ganaste cada día que lo cumples.\n\n- **Meta:** vender 20 productos este mes.\n- **Sistema:** mandar tres mensajes de seguimiento cada mañana y publicar una historia de producto cada tarde.\n\n## 🪞 Para pensar\n¿En qué parte de tu vida sientes que estás \"en la meseta\", trabajando sin ver resultados todavía?\n\n## ✍️ Escribe\nToma una meta que tengas y conviértela en sistema. Completa: \"Mi meta es… Mi sistema diario es…\".\n\n## ✅ Hoy\nHaz hoy la versión más chiquita de tu sistema. Solo una vez.\n\n@@ 2 | Los cimientos | Clase 2 · Quién quieres ser | Tus hábitos y tu identidad\nLa razón más común por la que un hábito no se queda no es la flojera. Es que estás tratando de cambiar lo que haces sin cambiar quién crees que eres.\n\n## Tres capas\nTodo cambio puede pasar en tres niveles:\n- **Lo que logras:** bajar de peso, vender más, ahorrar.\n- **Lo que haces:** tu rutina, tu forma de trabajar.\n- **Quién eres:** lo que crees de ti misma.\n\nCasi todas empezamos por la primera capa: \"quiero vender más\". El cambio que dura empieza al revés, por la tercera: \"soy una mujer que le da seguimiento a sus clientas\".\n\n## Dos personas, un mismo cigarro\nImagina a dos mujeres que quieren dejar de fumar. Les ofrecen uno. La primera dice: \"No, gracias, estoy tratando de dejarlo\". La segunda dice: \"No, gracias, no fumo\".\n\nLa primera todavía se ve como fumadora que se está aguantando. La segunda ya cambió quién es. ¿Cuál crees que lo va a lograr?\n\n> La meta no es correr un maratón. La meta es volverte corredora.\n\n## Cada acción es un voto\nAquí viene lo bonito: tu identidad no la decides de golpe, la vas construyendo. **Cada vez que haces algo, es un voto por el tipo de persona que quieres ser.**\n\nPublicas una historia aunque te dé pena: un voto por \"soy creadora\". Le contestas a una clienta a tiempo: un voto por \"soy profesional\". No necesitas ganar por unanimidad. Solo necesitas más votos a favor que en contra.\n\nPor eso los hábitos chiquitos importan tanto: no solo te dan resultados, te dan pruebas de quién eres.\n\n## Cómo usarlo\nSon dos pasos:\n1. Decide qué tipo de persona quieres ser.\n2. Demuéstratelo con pequeñas victorias.\n\nSi no sabes por dónde empezar, pregúntate frente a cada decisión: \"¿Qué haría aquí una mujer que ya es como yo quiero ser?\". ¿Qué haría una emprendedora organizada? ¿Una mamá paciente? ¿Una mujer sana?\n\n## Cuidado con lo que te repites\nTambién funciona al revés. \"Soy malísima para los números\", \"yo no soy de levantarme temprano\", \"a mí no se me da vender\". Cada vez que lo dices y actúas así, le das otro voto. Muchas de esas frases no son verdad: son hábitos que llevan años votando.\n\n## 🪞 Para pensar\n¿Qué frase sobre ti misma repites mucho y te está estorbando?\n\n## ✍️ Escribe\nCompleta: \"Soy el tipo de mujer que…\". Después escribe tres acciones chiquitas que serían un voto por esa mujer.\n\n## ✅ Hoy\nHaz una de esas tres acciones y, cuando la termines, dite en voz baja: \"Un voto\".\n\n@@ 3 | Los cimientos | Clase 3 · Cómo funciona un hábito | El ciclo de cuatro pasos y las cuatro reglas\nUn hábito es algo que repetiste tantas veces que ya sale solo. Tu cerebro los crea para ahorrar energía: lo que ya resolvió una vez, no lo quiere volver a pensar.\n\n## El ciclo\nTodo hábito, bueno o malo, sigue el mismo ciclo de cuatro pasos:\n1. **La señal.** Algo que tu cerebro nota y le avisa que puede haber una recompensa. Ves el celular sobre la mesa.\n2. **El antojo.** Las ganas de cambiar cómo te sientes. Quieres saber si alguien te escribió.\n3. **La acción.** Lo que haces. Desbloqueas el celular.\n4. **La recompensa.** Lo que obtienes. Te enteras, te distraes, te sientes conectada.\n\nLa recompensa le enseña a tu cerebro que vale la pena repetirlo. La próxima vez que veas la señal, el antojo llega más rápido. Y así, hasta que ya ni lo piensas.\n\n> No quieres el celular. Quieres cómo te hace sentir.\n\n## Las cuatro reglas\nSi un hábito tiene cuatro pasos, tienes cuatro lugares para intervenir. Para crear un hábito bueno:\n- **Que se vea:** haz la señal obvia.\n- **Que se antoje:** haz que te den ganas.\n- **Que cueste poquito:** haz la acción fácil.\n- **Que se sienta bien:** haz que la recompensa llegue rápido.\n\nY para dejar uno malo, se invierten:\n- **Que no se vea:** esconde la señal.\n- **Que no se antoje:** quítale el encanto.\n- **Que cueste mucho:** ponle obstáculos.\n- **Que se sienta mal:** que tenga un costo inmediato.\n\nCuando un hábito no te sale, casi siempre es porque falla una de las cuatro. El resto del curso es aprender a moverlas.\n\n## Un ejemplo completo\nQuieres tomar más agua.\n- **Que se vea:** una botella llena sobre tu escritorio desde la mañana.\n- **Que se antoje:** una botella que te encante, con limón y hielo.\n- **Que cueste poquito:** que ya esté llena y a la mano, no en la cocina.\n- **Que se sienta bien:** una marca en tu tracker cada vez que la terminas.\n\n## 🪞 Para pensar\nPiensa en un hábito que ya tienes sin querer. ¿Cuál es la señal que lo dispara? ¿Qué recompensa te da en realidad?\n\n## ✍️ Escribe\nToma el hábito que quieres crear y escribe una idea para cada regla: que se vea, que se antoje, que cueste poquito y que se sienta bien.\n\n@@ 4 | Regla 1 · Que se vea | Clase 4 · Date cuenta | Lo que haces sin darte cuenta\nAntes de cambiar un hábito, tienes que verlo. Y lo difícil es que los hábitos más fuertes son justamente los que ya no ves.\n\n## El piloto automático\nCuando algo se vuelve hábito, tu cerebro deja de ponerle atención. Por eso puedes llegar a tu casa manejando sin acordarte del camino, o encontrarte con el celular en la mano sin saber cuándo lo agarraste.\n\nEso es útil para lo bueno y peligroso para lo malo. No puedes cambiar lo que no notas.\n\n## Señala y dilo\nEn algunos sistemas de trenes, los conductores tienen una costumbre que parece rara: antes de cada acción señalan con el dedo y dicen en voz alta lo que van a hacer. \"Señal en verde.\" \"Velocidad correcta.\" Parece exagerado, pero reduce mucho los errores, porque convierte algo automático en algo consciente.\n\nTú puedes hacer lo mismo. Antes de comprar algo por impulso, dilo: \"Voy a gastar 400 pesos en algo que no planeé\". Antes de abrir redes: \"Voy a abrir Instagram y probablemente me quede media hora\". Decirlo en voz alta te devuelve el volante.\n\n> Darte cuenta no es castigarte. Es encender la luz.\n\n## El inventario del día\nEste es el primer ejercicio del método. Haz una lista de todo lo que haces en un día normal, desde que despiertas: apagas la alarma, revisas el celular, vas al baño, te lavas la cara, haces el café…\n\nAl lado de cada cosa pon un signo:\n- **+** si te acerca a la mujer que quieres ser.\n- **−** si te aleja.\n- **=** si es neutral.\n\nLa pregunta no es \"¿esto es bueno o malo?\" sino \"¿esto me ayuda a ser quien quiero ser?\". Revisar el celular al despertar puede ser + para alguien que atiende pedidos temprano y − para alguien que quiere empezar el día en calma.\n\nNo cambies nada todavía. Solo observa.\n\n## 🪞 Para pensar\n¿Cuál de tus hábitos te sorprendió más cuando lo pusiste en la lista?\n\n## ✍️ Escribe\nHaz tu inventario del día con sus signos. La herramienta \"El inventario del día\" tiene una lista de ejemplo.\n\n## ✅ Hoy\nElige un hábito − y, cada vez que lo vayas a hacer hoy, dilo en voz alta antes.\n\n@@ 5 | Regla 1 · Que se vea | Clase 5 · Cuándo, dónde y con qué | Dale a tu hábito una cita y un lugar\n\"Voy a hacer más ejercicio.\" \"Voy a publicar más.\" Así como está, eso no es un plan, es un deseo. A los hábitos les falta casi siempre lo mismo: cuándo y dónde.\n\n## Ponle una cita\nLa forma más sencilla de empezar un hábito es decir exactamente cuándo y dónde lo vas a hacer:\n\n> Voy a [hábito] a las [hora] en [lugar].\n\n- \"Voy a grabar un video de producto a las 9 de la mañana en la mesa del comedor.\"\n- \"Voy a leer 10 páginas a las 10 de la noche en el sillón.\"\n- \"Voy a revisar mis pedidos el lunes a las 8 en mi escritorio.\"\n\nCuando ya está decidido, no tienes que esperar a tener ganas. Llega la hora y ya sabes qué toca.\n\n## Engánchalo a otro hábito\nHay una forma todavía más fácil: pegar tu hábito nuevo a uno que ya haces sin pensar.\n\n> Después de [lo que ya hago], voy a [hábito nuevo].\n\n- \"Después de servirme el café, voy a mandar tres mensajes de seguimiento.\"\n- \"Después de lavarme los dientes en la noche, voy a ponerme mi crema.\"\n- \"Después de dejar a los niños en la escuela, voy a grabar una historia en el coche.\"\n\nPuedes hacer una cadena entera: café → mensajes → historia → revisar pedidos. Cada hábito es la señal del siguiente. La clave es que el disparador sea muy concreto y que pase siempre.\n\n## Tu entorno decide más que tu motivación\nMuchas veces no elegimos algo por lo que es, sino por dónde está. Si la fruta está a la vista, comes fruta. Si las galletas están a la vista, comes galletas.\n\nAsí que acomoda tu casa para que lo bueno se vea:\n- Tu kit de grabación armado y listo en un rincón.\n- Los productos que quieres mostrar en un lugar donde los veas al pasar.\n- Tu libro sobre la almohada, no en el librero.\n\nY si puedes, dale a cada actividad su lugar: esta silla es para leer, esta mesa es para trabajar, la cama es para dormir. Mezclar todo en un solo lugar (sobre todo en el celular) hace que todo compita.\n\n## 🪞 Para pensar\n¿Qué cosas buenas tienes escondidas en cajones y qué distracciones tienes siempre a la vista?\n\n## ✍️ Escribe\nEscribe tu hábito con las dos fórmulas: \"Voy a… a las… en…\" y \"Después de…, voy a…\".\n\n## ✅ Hoy\nMueve una sola cosa de tu casa para que tu hábito bueno se vea.\n\n@@ 6 | Regla 2 · Que se antoje | Clase 6 · Que se te antoje | Ganas, premios y tu tribu\nMientras más atractivo es algo, más fácil es que se vuelva hábito. Y lo atractivo no se encuentra: se diseña.\n\n## Las ganas vienen antes\nTu cerebro no se mueve por el premio, se mueve por la anticipación del premio. Por eso la emoción de comprar algo en línea a veces es más fuerte que abrir el paquete. Las ganas de hacer algo son la que te levanta del sillón.\n\nEntonces la pregunta es: ¿cómo hago que mi hábito bueno se me antoje?\n\n## Pega lo que tienes que hacer con lo que quieres hacer\nJunta un hábito que necesitas con algo que disfrutas, y solo te permites lo que disfrutas mientras haces lo que necesitas.\n\n- \"Solo escucho mi podcast favorito mientras camino.\"\n- \"Solo veo mi serie mientras doblo ropa o empaco pedidos.\"\n- \"Me tomo mi café rico mientras preparo las publicaciones de la semana.\"\n\nY lo puedes combinar con la cadena de la clase 5: \"Después de [lo que ya hago], voy a [lo que necesito]. Después de [lo que necesito], voy a [lo que me gusta]\".\n\n## Tu tribu te jala\nCopiamos los hábitos de tres grupos: las personas cercanas (familia, amigas), la mayoría (lo que \"todas hacen\") y las que admiramos. Queremos pertenecer, y eso pesa más que casi cualquier fuerza de voluntad.\n\nPor eso uno de los movimientos más poderosos es **rodearte de gente para quien tu hábito ya es lo normal**. Si en tu equipo todas publican diario, publicar diario deja de ser un esfuerzo y se vuelve \"lo que hacemos aquí\". Si tus amigas hacen ejercicio, tú también.\n\n> Elige un grupo donde lo que quieres hacer sea lo normal. Ahí el hábito se contagia.\n\n## Cambia el \"tengo que\" por \"puedo\"\nTus hábitos se sienten como se los nombras. \"Tengo que hacer ejercicio\" se siente como carga. \"Puedo hacer ejercicio, mi cuerpo puede moverse\" se siente como regalo.\n\n- \"Tengo que dar seguimiento\" → \"Le puedo ayudar a una clienta a encontrar lo que busca.\"\n- \"Tengo que grabar\" → \"Puedo practicar hablar a cámara y cada vez me sale mejor.\"\n\nNo es engañarte. Es elegir el ángulo verdadero que te da ganas.\n\n## Al revés: que no se antoje\nPara dejar un hábito malo, haz visible lo que te cuesta. Escribe qué ganarías al dejarlo: más horas de sueño, más dinero, más paz. Mientras más claro tengas el costo, menos encanto tiene.\n\n## 🪞 Para pensar\n¿Quiénes son las personas que más influyen en tus hábitos? ¿Te jalan hacia la mujer que quieres ser o hacia la de siempre?\n\n## ✍️ Escribe\nEscribe tu fórmula: \"Solo voy a [lo que me gusta] mientras [lo que necesito hacer]\".\n\n## ✅ Hoy\nCambia una frase de \"tengo que\" por \"puedo\" y dila en voz alta antes de hacerlo.\n\n@@ 7 | Regla 3 · Que cueste poquito | Clase 7 · Empieza en dos minutos | Practicar le gana a planear\nEsta es la regla que más cambia las cosas, porque ataca el problema más común: el hábito se siente demasiado grande para empezar hoy.\n\n## Moverte no es avanzar\nHay dos formas de estar ocupada. Una es **moverte**: investigar, planear, ver tutoriales, armar el calendario perfecto de contenido. La otra es **avanzar**: publicar el video.\n\nMoverse se siente productivo y es más cómodo, porque no te expone a fallar. Pero no da resultados. Planear está bien, siempre y cuando no se vuelva tu forma elegante de no empezar.\n\n> No necesitas el plan perfecto. Necesitas la repetición número uno.\n\n## Cuenta veces, no días\nNo existe un número mágico de días para que algo se vuelva hábito. Lo que importa es cuántas veces lo has hecho. Por eso la meta al principio no es hacerlo perfecto, es hacerlo muchas veces.\n\n## La ley del menor esfuerzo\nSiempre vamos a elegir lo que cueste menos. Por eso gana el celular sobre el libro y el sillón sobre la caminata. En lugar de pelear contra eso, úsalo:\n- **Quítale fricción a lo bueno:** deja la ropa de ejercicio lista la noche anterior, ten plantillas de mensajes guardadas, deja el aro de luz conectado.\n- **Prepara tu espacio para la siguiente vez:** al terminar de grabar, deja todo listo para mañana.\n\n## La regla de los dos minutos\nCuando empiezas un hábito nuevo, la versión de inicio tiene que tomar menos de dos minutos.\n- \"Leer antes de dormir\" → \"Leer una página.\"\n- \"Hacer ejercicio\" → \"Ponerme los tenis.\"\n- \"Publicar diario\" → \"Grabar una historia de 15 segundos.\"\n- \"Ordenar la casa\" → \"Doblar una prenda.\"\n\nSuena ridículamente chiquito, y esa es la idea. Primero tienes que volverte la persona que aparece todos los días. Un hábito que no existe no se puede mejorar. **Primero haz que exista, luego lo haces crecer.**\n\nSi quieres, ponte la regla de parar a los dos minutos durante unos días. Te sorprende las ganas que te quedan.\n\n## Los momentos que deciden el día\nHay momentos chiquitos que deciden lo que sigue: llegar a casa y sentarte en el sillón o cambiarte; abrir la laptop y entrar al correo o a TikTok. Esos momentos duran segundos, pero marcan horas. Concéntrate en ganar esos momentos.\n\n## 🪞 Para pensar\n¿Qué hábito llevas semanas \"planeando\" sin empezar?\n\n## ✍️ Escribe\nEscribe la versión de dos minutos de tu hábito. Si te toma más de dos minutos, hazla más chiquita.\n\n## ✅ Hoy\nHaz la versión de dos minutos. Ahorita, si puedes.\n\n@@ 8 | Regla 3 · Que cueste poquito | Clase 8 · Ponle candado | Decide una vez y que tu yo del futuro no tenga que pelear\nHay decisiones que tomas una vez y te ayudan todos los días después. Esta clase es para aprovecharlas y para hacer que lo malo cueste más.\n\n## Pon obstáculos a lo que quieres dejar\nAsí como quitas fricción a lo bueno, ponle fricción a lo malo. Mientras más pasos haya entre tú y el mal hábito, menos lo haces.\n- Saca las redes sociales de la pantalla de inicio, o del celular unas semanas.\n- Deja el celular cargando fuera de la recámara.\n- Borra la tarjeta guardada en las apps de compras.\n- No compres lo que no quieres comer. Si no está en casa, no te lo comes.\n\n> Es más fácil evitar la tentación que resistirla.\n\n## Decide hoy por tu yo de mañana\nUn candado es una decisión que tomas ahora para que tu yo del futuro no tenga que pelear. Algunos ejemplos:\n- Pagar la clase por adelantado para no faltar.\n- Agendar con tu amiga la caminata del sábado.\n- Usar platos más chicos.\n- Poner un temporizador al wifi o un límite de tiempo en las apps.\n\nTu yo de hoy está tranquila y piensa claro. Tu yo de las 11 de la noche, cansada, no. Deja que la primera le ayude a la segunda.\n\n## Decisiones de una sola vez\nHay cambios que haces una vez y siguen dando frutos solos:\n- Programar que una parte de cada ingreso se vaya directo a tu ahorro.\n- Comprar un buen colchón o cortinas que oscurezcan.\n- Darte de baja de correos y cuentas que solo te dan ganas de comprar.\n- Silenciar notificaciones que no son urgentes.\n- Programar tus publicaciones de la semana en un solo bloque.\n\nBusca la tecnología que trabaje por ti: recordatorios, pagos automáticos, publicaciones programadas, plantillas. Lo que se automatiza, ya no depende de tu fuerza de voluntad.\n\n## 🪞 Para pensar\n¿Cuál es el hábito malo que más te cuesta? ¿Cuántos pasos hay hoy entre tú y ese hábito?\n\n## ✍️ Escribe\nEscribe tres obstáculos que puedes ponerle a tu hábito malo y una decisión de una sola vez que puedes tomar esta semana.\n\n## ✅ Hoy\nToma esa decisión de una sola vez. Hoy, antes de dormir.\n\n@@ 9 | Regla 4 · Que se sienta bien | Clase 9 · Que se sienta bien | Premios inmediatos y tu tracker\nRepetimos lo que se siente bien. Y aquí está el problema: casi todos los hábitos buenos se sienten bien hasta después, y casi todos los malos se sienten bien ahorita.\n\n## El cerebro quiere todo ya\nTu cerebro le da mucho más peso a lo que pasa hoy que a lo que pasará en meses. El postre se siente bien ahorita, la salud llega en años. Comprar se siente bien ahorita, el ahorro llega después. Publicar da pena ahorita, las ventas llegan después.\n\nPor eso hay una regla de oro: **lo que se premia de inmediato se repite, y lo que se castiga de inmediato se evita.** Si quieres que un hábito se quede, necesitas sentir una pequeña victoria en el momento, aunque el resultado grande tarde.\n\n## Ponle un premio de inmediato\nBusca algo chiquito que puedas darte justo al terminar, que no vaya en contra del hábito:\n- Cada vez que no compras algo por impulso, pasa esa cantidad a una cuenta que diga \"mi viaje\". Ver crecer esa cuenta se siente bien hoy.\n- Al terminar tus mensajes de seguimiento, te tomas tu café en la terraza.\n- Al publicar, te mandas un emoji a ti misma o se lo cuentas a tu compañera.\n\n## El tracker\nUna de las cosas que más satisfacción da es ver tu avance. Por eso funciona tanto algo tan simple como **tachar un cuadrito en un calendario** cada día que cumples tu hábito.\n\nEl tracker te recuerda que te toca, te da gusto al marcarlo y te muestra la prueba de quién te estás volviendo. Hazlo así:\n- Marca justo después de hacer el hábito.\n- Lleva el registro de lo que puedas controlar: \"publiqué\", no \"vendí\".\n- Usa el tracker de la sección de herramientas.\n\n> No rompas la cadena. Y si se rompe, nunca falles dos veces.\n\n## Nunca dos veces\nVas a fallar. A todas nos pasa: se enferma un hijo, viajas, se te va el día. Fallar una vez es un accidente. Fallar dos veces seguidas es el principio de otro hábito.\n\nAsí que la regla no es \"nunca fallar\", es \"**nunca fallar dos veces**\". Y en los días malos, haz la versión de dos minutos. Un día malo con dos minutos vale muchísimo más que un día en cero, porque mantiene viva tu identidad.\n\n## Cuidado con lo que mides\nMedir ayuda, pero no todo lo importante se puede medir. Si solo ves números (seguidores, ventas, kilos), puedes olvidar para qué lo haces. El número es una pista, no todo el camino.\n\n## 🪞 Para pensar\n¿Qué recompensa inmediata te está dando tu hábito malo? ¿Qué podría darte algo parecido sin el costo?\n\n## ✍️ Escribe\nEscribe tu premio inmediato: \"Cada vez que [hábito], voy a [premio chiquito]\".\n\n## ✅ Hoy\nEmpieza tu tracker de 30 días y marca hoy.\n\n@@ 10 | Regla 4 · Que se sienta bien | Clase 10 · Alguien que te vea | Compañera de hábitos y acuerdos\nNos importa mucho lo que piensan las personas que respetamos. Esa fuerza, bien usada, sostiene un hábito como pocas cosas.\n\n## Que lo malo tenga un costo\nAsí como lo bueno necesita un premio inmediato, lo malo necesita un costo inmediato. Si faltar a tu hábito no te cuesta nada hoy, es muy fácil dejarlo para mañana.\n\nEl costo más poderoso casi nunca es dinero: es saber que alguien se va a enterar.\n\n## Tu compañera de hábitos\nElige a una persona (tu amiga, tu hermana, alguien de tu equipo) y hagan un acuerdo:\n- Cada una dice qué hábito va a sostener.\n- Se reportan todos los días o cada semana. Un mensaje con una foto basta.\n- Si alguna falla, la otra se entera. Sin regaños, pero se entera.\n\nSaber que alguien te está esperando hace que sea mucho más difícil no aparecer.\n\n> Cuando alguien te está viendo, cumplir se vuelve más fácil que dar explicaciones.\n\n## El acuerdo por escrito\nSi quieres ir más lejos, escríbanlo. Un acuerdo sencillo que diga:\n- Qué hábito voy a sostener.\n- Cómo lo voy a reportar y a quién.\n- Qué pasa si no cumplo (algo pequeño y real: invito el café, dono una cantidad, hago 20 sentadillas en videollamada).\n- Las firmas de las dos.\n\nParece exagerado, pero es justo lo que lo hace funcionar: convierte una promesa privada, que es fácil de romper, en una pública.\n\n## Las cuatro reglas al revés\nCon esta clase ya tienes el método completo para dejar un hábito malo:\n- **Que no se vea:** saca la señal de tu vista.\n- **Que no se antoje:** recuerda lo que te cuesta.\n- **Que cueste mucho:** ponle obstáculos y candados.\n- **Que se sienta mal:** que alguien se entere y que tenga un costo.\n\n## 🪞 Para pensar\n¿Quién en tu vida sería una buena compañera de hábitos? Alguien que te quiera, pero que no te deje pasar todo.\n\n## ✍️ Escribe\nEscribe tu acuerdo con los cuatro puntos. Si todavía no sabes con quién, escribe a quién se lo podrías proponer.\n\n## 💬 Comparte\nMándale un mensaje a esa persona hoy y propónle ser compañeras de hábitos por 30 días.\n\n@@ 11 | Para ir más lejos | Clase 11 · Tu cancha | Elige hábitos que van contigo y sigue aunque te aburras\nNo todas estamos hechas para lo mismo. Y no tiene nada de malo. La clave es elegir la cancha donde tienes ventaja.\n\n## Juega donde ganas\nCada persona tiene facilidades distintas: hay quien es buenísima frente a la cámara, quien escribe muy bonito, quien organiza todo con gusto y quien conecta con la gente uno a uno. Los hábitos son más fáciles cuando van con lo que ya eres.\n\nSi odias bailar en video, no tienes que construir tu negocio bailando. Puedes hacer reseñas honestas, tutoriales con las manos, fotos bonitas o mensajes personales. Busca la forma de hacer lo que hay que hacer **a tu manera**.\n\nAlgunas preguntas que ayudan:\n- ¿Qué se me hace divertido y a otras les parece trabajo?\n- ¿En qué pierdo la noción del tiempo?\n- ¿Qué me sale más natural que a la mayoría?\n- ¿Dónde puedo ser distinta en lugar de competir por ser la mejor?\n\n> Si no encuentras un juego que te favorezca, invéntalo.\n\n## La zona justa\nLa motivación está más alta cuando lo que haces está justo al borde de lo que puedes: ni tan fácil que aburra, ni tan difícil que frustre. Cuando ya dominas tu hábito, súbele un poquito. Si te está costando muchísimo, bájale.\n\n## El enemigo de verdad es el aburrimiento\nAl principio todo es emoción. Después, el hábito se vuelve rutina y deja de ser interesante. Ahí es donde casi todas se salen: no porque fracasaron, sino porque se aburrieron.\n\nLo que separa a quien llega lejos de quien no, casi nunca es el talento. Es poder seguir haciéndolo cuando ya no emociona. Las profesionales se apegan al plan aunque no tengan ganas. Las aficionadas dejan que la vida se interponga.\n\nHay días en que no vas a tener ganas de publicar, de dar seguimiento o de hacer ejercicio. La diferencia es aparecer de todas formas, aunque sea en la versión de dos minutos.\n\n## 🪞 Para pensar\n¿Qué parte de tu trabajo te sale más natural? ¿Estás construyendo tus hábitos sobre eso o en contra de eso?\n\n## ✍️ Escribe\nEscribe tu hábito \"a tu manera\": cómo lo harías aprovechando lo que se te da fácil.\n\n## ✅ Hoy\nHaz tu hábito aunque no tengas ganas. Cuando termines, anota cómo te sentiste.\n\n@@ 12 | Para ir más lejos | Clase 12 · Revisa y crece | Que tus hábitos no te encierren\nLos hábitos te dejan hacer cosas sin pensar. Esa es su ventaja y también su trampa: cuando algo va en automático, dejas de notar en qué podrías mejorar.\n\n## Hábito más práctica\nCuando un hábito ya sale solo, no lo dejes ahí. Escoge un detalle pequeño y mejóralo a propósito. Ya publicas diario: ahora fíjate en tus primeros tres segundos. Ya das seguimiento: ahora mejora tu primera pregunta.\n\nHábito para que salga solo, práctica con intención para que siga creciendo. Así se pasa de buena a excelente.\n\n## Revisa sin castigarte\nPonte una cita contigo para revisar cómo vas. Puede ser cada domingo, cada mes y una vez al año. Tres preguntas bastan:\n- ¿Qué funcionó?\n- ¿Qué no funcionó?\n- ¿Qué aprendí?\n\nY una vez al año, una pregunta más grande: ¿mis hábitos de hoy me están llevando a la vida que quiero? La revisión no es para regañarte, es para ajustar el rumbo con datos y no con culpa.\n\n## Suelta un poco tu identidad\nMientras más te aferras a una sola forma de verte, más te duele cuando cambia la vida. \"Soy la que más vende\", \"soy la mamá que todo lo puede\". Si un día no vendes o no puedes, sientes que pierdes quién eres.\n\nUna forma más sana es definirte por lo que valoras, no por un título:\n- En vez de \"soy la número uno\", \"soy alguien que se esfuerza y que ayuda a otras a crecer\".\n- En vez de \"soy atleta\", \"soy alguien a quien le gusta retarse\".\n\nAsí tu identidad puede crecer contigo en lugar de encerrarte.\n\n## El secreto que dura\nUn hábito chiquito no cambia nada por sí solo. Pero cuando lo repites, y le sumas otro, y otro, se vuelve un sistema. Y un sistema bueno, sostenido el tiempo suficiente, cambia una vida.\n\n> No es un cambio de 1000%. Son mil cambios de 1%.\n\n## 🪞 Para pensar\nSi sigues con los hábitos que tienes hoy durante cinco años más, ¿a dónde te llevan?\n\n## ✍️ Escribe\nHaz tu primera revisión: qué funcionó, qué no y qué aprendiste desde que empezaste el curso.\n\n## ✅ Hoy\nAgenda en tu calendario tu revisión semanal: día, hora y lugar.\n\n@@ 13 | Herramienta | Las cuatro reglas en una hoja | Para crear un hábito y para dejarlo\nTómale captura y tenla a la mano.\n\n## Para crear un hábito bueno\n### 1. Que se vea\n- Haz tu inventario del día para darte cuenta de lo que haces.\n- Ponle una cita: \"Voy a [hábito] a las [hora] en [lugar]\".\n- Engánchalo: \"Después de [lo que ya hago], voy a [hábito nuevo]\".\n- Acomoda tu entorno para que la señal esté a la vista.\n\n### 2. Que se antoje\n- Pega lo que necesitas con lo que te gusta.\n- Rodéate de gente para quien tu hábito es lo normal.\n- Cambia \"tengo que\" por \"puedo\".\n- Haz algo que disfrutes justo antes del hábito difícil.\n\n### 3. Que cueste poquito\n- Quítale pasos al hábito bueno.\n- Prepara tu espacio para la siguiente vez.\n- Hazlo en dos minutos.\n- Automatiza lo que se pueda.\n\n### 4. Que se sienta bien\n- Date un premio inmediato y chiquito.\n- Tacha tu tracker.\n- Nunca falles dos veces.\n\n## Para dejar un hábito malo\n### 1. Que no se vea\n- Saca la señal de tu vista y de tu celular.\n\n### 2. Que no se antoje\n- Escribe lo que ganas al dejarlo y lo que te cuesta seguir.\n\n### 3. Que cueste mucho\n- Ponle obstáculos y candados. Decide hoy por tu yo de mañana.\n\n### 4. Que se sienta mal\n- Busca una compañera de hábitos y escriban un acuerdo.\n\n@@ 14 | Herramienta | El inventario del día | La lista para darte cuenta de lo que haces\nEscribe todo lo que haces en un día normal, en orden, y ponle un signo a cada cosa.\n\n## Los signos\n- **+** me acerca a la mujer que quiero ser.\n- **−** me aleja.\n- **=** es neutral.\n\n## Un ejemplo\n- Me despierto con la alarma del celular. =\n- Reviso redes en la cama 20 minutos. −\n- Me lavo la cara y me pongo mi rutina de skincare. +\n- Preparo desayuno para los niños. +\n- Me sirvo café. =\n- Contesto mensajes de clientas. +\n- Veo videos mientras como. −\n- Grabo una historia de producto. +\n- Me como algo dulce al llegar a casa. −\n- Ceno con mi familia sin celular. +\n- Me duermo después de la medianoche. −\n\n## Después del inventario\n1. Encierra en un círculo los **+** que quieres proteger.\n2. Elige **un** solo **−** para trabajar este mes.\n3. Busca en tu lista un hábito que ya hagas siempre para engancharle uno nuevo.\n\n## 🪞 Para pensar\n¿Hay algún **=** que en realidad es **−** y no lo habías querido ver?\n\n## ✍️ Escribe\nHaz tu inventario completo aquí, con sus signos.\n\n@@ 15 | Herramienta | Fórmulas para copiar | Las frases que convierten un deseo en plan\nCopia, llena los espacios y pégalas donde las veas.\n\n## La cita\n> Voy a [hábito] a las [hora] en [lugar].\n\nEjemplo: \"Voy a mandar tres mensajes de seguimiento a las 9 en mi escritorio.\"\n\n## El enganche\n> Después de [lo que ya hago], voy a [hábito nuevo].\n\nEjemplo: \"Después de dejar a los niños en la escuela, voy a grabar una historia en el coche.\"\n\n## El antojo\n> Solo voy a [lo que me gusta] mientras [lo que necesito hacer].\n\nEjemplo: \"Solo veo mi serie mientras empaco pedidos.\"\n\n## La versión de dos minutos\n> Mi hábito empieza con [acción de menos de dos minutos].\n\nEjemplo: \"Mi hábito de leer empieza con abrir el libro y leer una página.\"\n\n## El premio\n> Cada vez que [hábito], voy a [premio chiquito].\n\nEjemplo: \"Cada vez que no compro algo por impulso, paso esa cantidad a mi cuenta del viaje.\"\n\n## La identidad\n> Soy el tipo de mujer que [acción].\n\nEjemplo: \"Soy el tipo de mujer que le da seguimiento a sus clientas.\"\n\n## El acuerdo\n> Yo, [nombre], me comprometo a [hábito] durante [tiempo]. Se lo reporto a [persona] cada [frecuencia]. Si no cumplo, [costo].\n\n## ✍️ Escribe\nLlena aquí las fórmulas de tu hábito.\n\n@@ 16 | Herramienta | Tu tracker de 30 días | Tacha, revisa y nunca falles dos veces\nUn tracker sencillo para tu hábito más importante. Cópialo en tu cuaderno o úsalo en el cuaderno de esta página.\n\n## Cómo usarlo\n1. Escribe arriba tu hábito en su versión de dos minutos.\n2. Escribe tu cita o tu enganche: cuándo y dónde.\n3. Cada día que lo hagas, tacha el cuadro **justo después**.\n4. Si un día fallas, marca un punto y al día siguiente hazlo sí o sí. Nunca dos veces.\n\n## Tu mes\n- Días 1 a 7: solo aparecer. Versión de dos minutos.\n- Días 8 a 14: si ya sale fácil, súbele un poquito.\n- Días 15 a 21: busca tu compañera de hábitos si no la tienes.\n- Días 22 a 30: fíjate en un detalle y mejóralo a propósito.\n\n## La revisión del domingo\n- ¿Cuántos días lo hice esta semana?\n- ¿Qué día me costó más y por qué?\n- ¿Cuál de las cuatro reglas falló ese día?\n- ¿Qué ajusto para la próxima semana?\n\n## ✍️ Escribe\nEscribe tu hábito, tu cita y, cada día, un número del 1 al 30 con una ✓ o un punto.";
var FAQ_MD="## Empezar | 0\n\n### ¿Cuántos hábitos trabajo a la vez?\nUno para crear y, si quieres, uno para dejar. Cuando el primero ya sale solo, sumas otro. Querer cambiar todo el lunes es la forma más rápida de no cambiar nada.\n\n### ¿Cuánto tiempo tarda en formarse un hábito?\nNo hay un número mágico de días. Lo que cuenta es cuántas veces lo repites, no cuánto tiempo pasa. Por eso conviene hacerlo chiquito y seguido. Lo explica la clase 7.\n\n### ¿Tengo que leer las clases en orden?\nTe recomendamos que sí, al menos las tres primeras, porque explican el método. Después puedes regresar a la regla que más te cueste.\n\n### ¿Por qué me rindo siempre a la semana?\nCasi siempre porque empezaste demasiado grande o porque no viste resultados rápido. La clase 1 explica la meseta escondida y la clase 7 cómo empezar en dos minutos.\n\n## Los cimientos | 2\n\n### ¿Entonces ya no me pongo metas?\nSí, pero úsalas para saber a dónde vas, no para decidir qué haces cada día. Eso lo decide tu sistema. Lo explica la clase 1.\n\n### ¿Qué significa que cada acción es un voto?\nQue tu identidad se construye con pruebas. Cada vez que haces algo, le das un voto a la mujer que quieres ser. No necesitas ser perfecta, solo tener más votos a favor. Lo explica la clase 2.\n\n### ¿Qué hago si no sé qué tipo de persona quiero ser?\nEmpieza por una sola área: tu negocio, tu salud o tu casa. Pregúntate qué haría ahí una mujer que admiras. Con eso basta para empezar a votar.\n\n## Que se vea | 5\n\n### ¿Qué es el inventario del día?\nUna lista de todo lo que haces en un día normal, con un signo +, − o = según te acerque o te aleje de quien quieres ser. Sirve para darte cuenta antes de cambiar. Está en la clase 4 y en las herramientas.\n\n### ¿Cuál es la diferencia entre la cita y el enganche?\nLa cita le pone hora y lugar a tu hábito. El enganche lo pega a algo que ya haces siempre. El enganche suele funcionar mejor porque no depende de que mires el reloj. Lo explica la clase 5.\n\n### Trabajo desde el celular. ¿Cómo separo los espacios?\nUsa carpetas o perfiles distintos para trabajar y para distraerte, y saca las apps que te roban tiempo de la pantalla de inicio. Si puedes, ten un lugar físico para trabajar que no sea la cama.\n\n## Que se antoje | 6\n\n### No me dan ganas de hacer mi hábito. ¿Qué hago?\nPégale algo que disfrutes: un podcast, tu café favorito, una playlist. Y cambia el \"tengo que\" por \"puedo\". Lo explica la clase 6.\n\n### Mi familia no tiene los hábitos que yo quiero. ¿Estoy perdida?\nNo. Busca otro grupo donde tu hábito ya sea lo normal: tu equipo, un grupo de caminata, una comunidad en línea. Pertenecer jala mucho.\n\n## Que cueste poquito | 7\n\n### Dos minutos se me hace muy poco. ¿De verdad sirve?\nSí, porque el objetivo al principio no es el resultado, es volverte la persona que aparece todos los días. Cuando ya existe el hábito, lo haces crecer. Lo explica la clase 7.\n\n### ¿Cómo dejo de agarrar el celular a cada rato?\nPonle obstáculos: sácalo de tu vista, déjalo cargando en otro cuarto, quita notificaciones y saca las apps de la pantalla de inicio. Es más fácil evitar la tentación que resistirla. Lo explica la clase 8.\n\n### Planeo mucho y hago poco. ¿Por qué?\nPorque planear se siente productivo y no te expone a fallar. Es moverte, no avanzar. Ponte la regla de hacer la primera repetición antes de seguir planeando.\n\n## Que se sienta bien | 9\n\n### Fallé varios días. ¿Empiezo de cero?\nNo. Lo que ya hiciste cuenta. La regla es nunca fallar dos veces seguidas: retoma hoy en la versión de dos minutos. Lo explica la clase 9.\n\n### ¿Qué premio me doy que no arruine el hábito?\nAlgo chiquito, inmediato y que vaya con la mujer que quieres ser: tachar tu tracker, pasar dinero a tu cuenta de ahorro, un rato de música. Evita premiar el ejercicio con comida o el ahorro con compras.\n\n### ¿Y si no tengo a nadie que me acompañe?\nBusca en tu equipo o en tus amigas. Si de verdad no hay nadie, publica tu compromiso en tus historias y reporta tu avance. También funciona.\n\n## Para ir más lejos | 11\n\n### Ya me aburrí de mi hábito. ¿Es normal?\nMuy normal. Es justo donde casi todas se salen. Súbele un poquito la dificultad, cámbiale la forma o simplemente aparece aunque no tengas ganas. Lo explica la clase 11.\n\n### ¿Cómo hago una buena revisión?\nTres preguntas cada semana o cada mes: qué funcionó, qué no y qué aprendí. Una vez al año, pregúntate si tus hábitos te llevan a la vida que quieres. Lo explica la clase 12.\n\n## Tu mentora | 0\n\n### ¿Qué hace la mentora?\nTe da las clases una por una, te ayuda a convertir tu meta en sistema, a escribir tus fórmulas y a revisar qué regla te está fallando cuando un hábito no se queda.\n\n### ¿Necesito pagar Claude?\nNo. Funciona con la cuenta gratis, que tiene un límite de mensajes por día.";

var MENTOR={"title": "Tu mentora de hábitos, cuando la necesites", "intro": "La mentora vive en Claude. Te da las clases una por una, te ayuda a convertir tu meta en un sistema diario y, cuando un hábito no se queda, encuentra cuál de las cuatro reglas está fallando.", "can": [["De meta a sistema", "Escribe tu meta y te ayuda a armar el hábito diario, con su cita, su versión de dos minutos y su premio."], ["Diagnóstico", "Cuéntale qué hábito se te cae y te dice qué regla falla y cómo arreglarla."], ["Fórmulas y acuerdos", "Te ayuda a escribir tu enganche, tu frase de identidad y el acuerdo con tu compañera."], ["El curso", "Escribe \"Clase 7\" y te la da completa, con ejercicio."]], "steps": ["Crea tu cuenta en claude.ai. Funciona con la cuenta gratis.", "Descarga la mentora (.zip) y guárdala sin descomprimir.", "En Claude entra a Customize → Skills, toca \"+\", luego \"Create skill\" → \"Upload a skill\" y sube el zip.", "Abre un chat nuevo y escribe una de estas frases."], "prompts": ["Quiero empezar el curso Átomo.", "Mi meta es vender más este mes. Ayúdame a convertirla en un sistema diario.", "Siempre dejo el ejercicio a la semana. ¿Qué regla me está fallando?"], "limits": ["No promete ingresos", "No hace promesas de salud", "No sustituye terapia", "No te culpa si fallas"], "notes": ["Si no ves los botones de descarga, pide el archivo atomo.zip a tu líder.", "La cuenta gratis tiene un límite de mensajes por día. Si se acaba, vuelve a estar disponible horas después."]};
