<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}

/* tabs */
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:center;margin-inline:-16px;padding:10px 16px}

/* shared buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:15px;padding:12px 18px;border-radius:var(--btn-r,999px);cursor:pointer;text-decoration:none;transition:transform .16s cubic-bezier(.23,1,.32,1)}

/* mentor */
.mentorv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 40px;align-items:start}
@media (max-width:780px){.mentorv{grid-template-columns:minmax(0,1fr)}}
.m-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.m-can{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.m-can li{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r,16px);padding:14px 16px}

.m-dl{display:flex;flex-wrap:wrap;gap:10px}

.m-prompt q{quotes:none;min-width:0;font-size:15.5px}
.m-prompt .btn{padding:8px 14px;font-size:13.5px;flex:none}
.m-limits{display:flex;flex-wrap:wrap;gap:8px}
.m-limits span{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted)}
footer.foot{text-align:center;font-size:14px;color:var(--muted);padding-top:20px}

/* ---------- reader sheet (the lights come on) ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;transition:opacity .45s cubic-bezier(.32,.72,0,1)}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;top:calc(12px + env(safe-area-inset-top,0px));margin:0 auto;max-width:800px;background:var(--r-bg);color:var(--r-ink);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:0 -12px 50px rgba(0,0,0,.35);font-family:var(--r-body,var(--body))}

.sheet :focus-visible{outline:2px solid var(--r-accent);outline-offset:3px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:clamp(22px,5vw,48px) clamp(18px,5vw,56px) calc(56px + env(safe-area-inset-bottom,0px))}
.r-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:end;margin-bottom:18px}
.r-head.nonum{grid-template-columns:minmax(0,1fr)}
.r-num{grid-row:span 2;font:var(--r-num-font,800 96px/.8 var(--display));color:var(--r-accent);font-variant-numeric:tabular-nums}
.r-k{margin:0;font-size:14.5px;font-weight:600;color:var(--r-accent)}
.r-title{margin:0;font:var(--r-title-font,700 clamp(32px,6.5vw,48px)/1 var(--display));letter-spacing:var(--r-title-track,-.01em);text-wrap:balance}
.r-topic{margin:0 0 18px;font-size:20px;line-height:1.35;color:var(--r-muted)}
.r-intro{font-size:20px;line-height:1.5;margin:0 0 26px;padding-bottom:24px;border-bottom:1px solid var(--r-line)}
.lesson-body p,.lesson-body li{max-width:66ch}
.lesson-body p{margin:0 0 .9em}

.lesson-body li::marker{color:var(--r-accent);font-weight:700}
.lesson-body strong{font-weight:700}
.lesson-body h3{font:var(--r-h3-font,700 26px/1.15 var(--display));margin:36px 0 10px;text-wrap:balance}
.callout{margin:28px 0;padding:22px 24px;border-radius:var(--card-r,18px);background:var(--r-callout-bg);color:var(--r-callout-ink)}
.callout p{margin:0;font:var(--r-callout-font,700 clamp(22px,4.6vw,28px)/1.2 var(--display));max-width:34ch;text-wrap:balance}
.turn{margin-top:40px;padding-top:26px;border-top:2px solid var(--r-ink);display:grid;gap:12px}
.turn h3{margin:0;font:var(--r-h3-font,700 26px/1.15 var(--display))}
.task{background:var(--r-surface);border:1px solid var(--r-line);border-radius:var(--card-r,16px);padding:16px 18px}
.task h4{margin:0 0 6px;font-size:17px}
.task p:last-child,.task ul:last-child,.task ol:last-child{margin-bottom:0}
.nb-l{font-weight:600;font-size:14px;color:var(--r-muted);margin-top:6px}
.sheet textarea{width:100%;min-height:150px;resize:vertical;font:16px/1.55 var(--r-body,var(--body));color:var(--r-ink);background:var(--r-surface);border:1px solid var(--r-line);border-radius:12px;padding:14px 16px}
.saved{font-size:13px;color:var(--r-muted);min-height:1.2em}
.r-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:34px;padding-top:22px;border-top:1px solid var(--r-line)}

.sheet .btn{border-color:var(--r-line);color:var(--r-ink)}
.sheet .btn.solid{background:var(--r-ink);border-color:var(--r-ink);color:var(--r-bg)}
.sheet .btn.done{background:var(--r-accent);border-color:var(--r-accent);color:var(--r-accent-ink,var(--r-bg))}
.r-next{width:100%;margin:0;font-size:14px;color:var(--r-muted)}
body.sheet-open{overflow:hidden}

/* Antena: the page is the book's cloth cover. Ivory linen, black serif set small and centered, a lot of air. The route reads like a table of contents; the reader is a page; the quotes are the short centered verses that close each section. */
:root{
  --bg:#F1EDE4; --surface:#F8F5EE; --ink:#1A1916; --muted:#6B675E; --line:#D8D2C5; --accent:#1A1916; --accent-ink:#F4F0E8; --focus:#1A1916; --mark:rgba(26,25,22,.12);
  --display:"Libre Baskerville",Baskerville,"Baskerville Old Face",Georgia,serif; --body:"Libre Baskerville",Baskerville,Georgia,serif;
  --h2-font:400 clamp(28px,5.6vw,42px)/1.1 var(--display); --h3-font:400 21px/1.2 var(--display); --num-font:italic 400 20px/1 var(--display);
  --r-bg:#FBF9F4; --r-surface:#F3EFE6; --r-ink:#1A1916; --r-muted:#6B675E; --r-line:#E2DCCF; --r-accent:#1A1916; --r-accent-ink:#FBF9F4; --r-callout-bg:transparent; --r-callout-ink:#1A1916;
  --r-num-font:italic 400 clamp(54px,12vw,84px)/.9 var(--display); --r-title-font:400 clamp(27px,5.4vw,40px)/1.15 var(--display); --r-h3-font:400 22px/1.25 var(--display); --r-callout-font:italic 400 clamp(18px,3.8vw,21px)/1.6 var(--display);
  --card-r:3px; --btn-r:2px; --field-r:2px; --tabs-r:0; --maxw:960px; --gap:34px;
  --weave:rgba(60,48,30,.035); --weave2:rgba(70,55,35,.06); --cover:#F7F3EA; --spine:rgba(60,45,25,.28); --spine-hi:rgba(255,255,255,.6); --deboss:#24221E; --deboss-hi:rgba(255,255,255,.7); --arc-off:#D3CCBD; --line2:#BDB5A6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161512; --surface:#1E1C18; --ink:#ECE7DC; --muted:#A39E92; --line:#35322B; --accent:#ECE7DC; --accent-ink:#161512; --focus:#ECE7DC; --mark:rgba(236,231,220,.16);
  --r-bg:#1C1A16; --r-surface:#24221D; --r-ink:#ECE7DC; --r-muted:#A39E92; --r-line:#35322B; --r-accent:#ECE7DC; --r-accent-ink:#1C1A16; --r-callout-ink:#ECE7DC;
  --weave:rgba(255,245,225,.025); --weave2:rgba(0,0,0,.22); --cover:#24221D; --spine:rgba(0,0,0,.6); --spine-hi:rgba(255,255,255,.06); --deboss:#E6E0D3; --deboss-hi:rgba(0,0,0,.6); --arc-off:#3D3A33; --line2:#4A463E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#161512; --surface:#1E1C18; --ink:#ECE7DC; --muted:#A39E92; --line:#35322B; --accent:#ECE7DC; --accent-ink:#161512; --focus:#ECE7DC; --mark:rgba(236,231,220,.16);
  --r-bg:#1C1A16; --r-surface:#24221D; --r-ink:#ECE7DC; --r-muted:#A39E92; --r-line:#35322B; --r-accent:#ECE7DC; --r-accent-ink:#1C1A16; --r-callout-ink:#ECE7DC;
  --weave:rgba(255,245,225,.025); --weave2:rgba(0,0,0,.22); --cover:#24221D; --spine:rgba(0,0,0,.6); --spine-hi:rgba(255,255,255,.06); --deboss:#E6E0D3; --deboss-hi:rgba(0,0,0,.6); --arc-off:#3D3A33; --line2:#4A463E; color-scheme:dark;
}
/* linen: two fine crossing weaves */
html,body{background-color:var(--bg);background-image:repeating-linear-gradient(0deg,var(--weave) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,var(--weave) 0 1px,transparent 1px 3px)}
body{font-size:16px;line-height:1.75}
.tabbar::before{background:var(--bg)}
.sec-h{letter-spacing:0}
.sec-p{font-size:15.5px}

/* tabs: words, like running heads */
.tabs{background:transparent;border:0;border-bottom:1px solid var(--line);gap:4px;padding:0}
.tab{font-weight:400;font-size:15px;padding:11px 14px 10px;border-bottom:1px solid transparent;margin-bottom:-1px;letter-spacing:.01em}
.tab[aria-selected="true"]{background:transparent;color:var(--ink);border-bottom-color:var(--ink)}
.btn{font-weight:400;font-size:14.5px;letter-spacing:.02em}
.chip{font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.qa{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0}
details.qa summary{font-weight:400;font-size:16px;padding:15px 2px}
details.qa summary i{background:transparent;border:1px solid var(--line);font-family:var(--body)}
.ans{padding:0 2px 18px}
.fgroup h3{font-style:italic}
.m-can li{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0 0}
.m-can b{font-weight:700;font-size:15.5px}
.m-prompt{background:transparent}
.m-prompt q{font-style:italic}
.m-h{font-style:italic}

/* hero: the book itself, cloth-bound, title debossed */
.a-stage{display:grid;place-items:center;padding:clamp(40px,9vw,80px) 0 0;perspective:1400px}
.a-book{position:relative;width:min(290px,70vw);aspect-ratio:2/3;border-radius:2px 7px 7px 2px;background:var(--cover);box-shadow:inset 6px 0 0 -3px var(--spine-hi),inset 13px 0 14px -10px var(--spine),0 1px 1px rgba(0,0,0,.08),0 14px 24px -14px rgba(40,30,15,.35),0 40px 60px -30px rgba(40,30,15,.35);transform:rotateY(-6deg) rotateX(2deg);transition:transform .9s cubic-bezier(.23,1,.32,1)}
@media (hover:hover){.a-book:hover{transform:rotateY(0) rotateX(0)}}
.a-book::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background-image:repeating-linear-gradient(0deg,var(--weave2) 0 1px,transparent 1px 2px),repeating-linear-gradient(90deg,var(--weave2) 0 1px,transparent 1px 2px);mix-blend-mode:multiply}
.a-cloth{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:16% 10% 9%}
.a-title{margin:0;font:400 clamp(26px,7vw,34px)/1.1 var(--display);letter-spacing:.01em;color:var(--deboss);text-shadow:0 1px 0 var(--deboss-hi)}
.a-sub{margin:8px 0 0;font:italic 400 clamp(13px,3.3vw,15px)/1.3 var(--display);color:var(--deboss);text-shadow:0 1px 0 var(--deboss-hi)}
.a-arcs{width:72%;margin:auto 0 0;overflow:visible}
.a-arcs path{fill:none;stroke:var(--arc-off);stroke-width:1;stroke-linecap:round}
.a-arcs path.on{stroke:var(--deboss);stroke-width:1.15}
.a-arcs path.cur{stroke:var(--deboss);stroke-dasharray:1.2 2.6}
.a-arcs circle{fill:var(--deboss)}
@media (prefers-reduced-motion:no-preference){.a-arcs.draw path{stroke-dasharray:60;stroke-dashoffset:60;animation:arc 1.1s cubic-bezier(.23,1,.32,1) var(--d) forwards}.a-arcs.draw path.cur{animation-name:arccur}@keyframes arc{to{stroke-dashoffset:0}}@keyframes arccur{to{stroke-dashoffset:0;stroke-dasharray:1.2 2.6}}
.a-book{animation:rise 1s cubic-bezier(.23,1,.32,1) both}@keyframes rise{from{opacity:0;transform:translateY(14px) rotateY(-14deg) rotateX(4deg)}}}
.a-by{margin:clamp(18px,5vw,26px) 0 0;font:400 clamp(10.5px,2.7vw,12px)/1.3 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--deboss);opacity:.8;white-space:nowrap}
.a-pitch{margin:clamp(40px,9vw,64px) auto 0;max-width:36ch;text-align:center;font:italic 400 17px/1.7 var(--display);color:var(--ink);text-wrap:pretty}
.a-cta{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:24px}
.a-cta .btn{padding:14px 28px}
.a-status{margin:0;font:400 12px/1.4 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* route: the contents page, with leaders and page numbers */
.a-toc{display:grid;gap:56px;max-width:560px;margin:0 auto;width:100%;padding-top:20px}
.a-part{display:grid;gap:4px;text-align:center}
.a-rn{font:italic 400 clamp(40px,9vw,56px)/1 var(--display);color:var(--line2)}
.a-ph{margin:6px 0 8px;font:400 12.5px/1 var(--display);letter-spacing:.32em;text-transform:uppercase;color:var(--ink)}
.a-pp{margin:0 auto 18px;max-width:40ch;font:italic 400 14.5px/1.6 var(--display);color:var(--muted)}
.a-list{list-style:none;margin:0;padding:0;text-align:left}
.a-row{display:block;width:100%;background:transparent;border:0;padding:12px 10px;margin:0 -10px;width:calc(100% + 20px);cursor:pointer;color:var(--ink);text-align:left;border-radius:2px;transition:transform .16s cubic-bezier(.23,1,.32,1),background-color .2s}
.a-row:active{transform:scale(.985)}
@media (hover:hover){.a-row:hover{background:var(--surface)}}

<script>
var LESSONS_MD="@@ 0 | Empieza aquí | Bienvenida a Antena | El curso en 5 minutos\nEste curso no te va a enseñar a hacer videos ni a escribir textos. Te va a enseñar algo que va antes: a vivir con la antena prendida, para que las ideas te encuentren y sepas qué hacer con ellas.\n\n## De qué se trata\nCasi todas pensamos que la creatividad es para unas cuantas: las artistas, las que \"nacieron con eso\". No es cierto. Cada vez que arreglas tu mesa para una foto, que inventas cómo explicarle un producto a una clienta o que le cambias el final a un cuento para tus hijas, estás creando.\n\nLa idea central del curso es esta: **crear no es algo que haces un rato, es una forma de estar en el mundo**. Poner atención, notar lo que te mueve, juntar lo que te llama, jugar con eso y atreverte a soltarlo. Eso se practica, como se practica caminar o cocinar.\n\n> Ser creativa no es un talento que tienes o no tienes. Es una forma de mirar.\n\n## Cómo está armado\n- **Sintoniza (clases 1 a 5).** Cómo prender tu antena: notar más, alimentar bien lo que entra, encontrar pistas y bajarle el volumen a la duda y a las reglas que ni sabías que seguías.\n- **Crea (clases 6 a 10).** El camino de cualquier proyecto, en cuatro movimientos: **Junta, Juega, Construye y Suelta**. Sirve igual para un video, un live, una presentación para tu equipo o una idea de negocio.\n- **Sostén (clases 11 y 12).** Cómo seguir creando a largo plazo: qué es el éxito para ti, por qué compararte no sirve y cómo crear con otras sin pelearte.\n- **Herramientas.** Tu libreta de semillas, doce experimentos para cuando te atores, la guía de las cuatro fases y una guía para dar y recibir retroalimentación.\n\n## Lo que necesitas\n- Una libreta chiquita o las notas de tu celular. Va a ser tu libreta de semillas.\n- Diez minutos al día para notar. No para producir: para notar.\n- Algo que quieras crear, aunque sea pequeño: un video, una foto, un texto, una idea para tu negocio.\n\n## Cómo leer este curso\nAlgunas ideas te van a hacer clic y otras no. Está bien. Toma lo que te sirva y deja lo demás. Cada clase termina con un ejercicio y una tarea; hazlos en el cuaderno de la clase, que se guarda en tu dispositivo.\n\n## 🪞 Para pensar\n¿Cuándo fue la última vez que creaste algo solo porque te dio gusto, sin pensar en si iba a gustar?\n\n## ✍️ Escribe\nEscribe en una frase qué te gustaría crear en las próximas semanas. Por ejemplo: \"Quiero animarme a hacer videos donde hable yo, no solo el producto.\"\n\n@@ 1 | Sintoniza | Clase 1 · Todas creamos | La creatividad es una forma de estar\nCrear es traer al mundo algo que antes no estaba. Una conversación, una solución, una nota para una amiga, una nueva forma de acomodar tu mesa. Lo haces todos los días.\n\n## No es solo para artistas\nLa palabra \"artista\" asusta. Suena a museo, a talento raro, a gente distinta. Por eso muchas mujeres dicen \"yo no soy creativa\" mientras arman un aparador precioso, inventan un juego para que sus hijas coman verdura o escriben el mensaje perfecto para una clienta que está dudando.\n\nLo que haces no tiene que estar en una galería ni venderse para contar como creación. **Tu vida entera ya es una obra**: cada decisión que tomas con atención dice cómo ves el mundo.\n\n> No necesitas permiso para llamarte creadora. Ya lo eres.\n\n## Las ideas tienen su tiempo\nPiensa en la naturaleza: los árboles saben cuándo florecer y las nubes cuándo llover. Las ideas funcionan parecido. Hay ideas que andan \"en el aire\" y llegan a quien está lista para recibirlas.\n\n¿Te ha pasado que tuviste una idea, no la hiciste y meses después la viste hecha por alguien más? No te la robaron. Simplemente era su momento y alguien la tomó. Por eso, cuando una idea te emociona, dale vida.\n\n## Ver como niña\nLas niñas reciben todo con asombro. No comparan, no se preocupan por lo que van a pensar, pasan de la risa al llanto sin quedarse atoradas en una historia. Esa forma de mirar es justo la que hace falta para crear.\n\nLas creadoras que siguen haciendo cosas buenas toda la vida suelen conservar algo de eso: curiosidad, juego y cero miedo a verse raras.\n\n## Qué cambia con esto\nSi crear es una forma de estar, ya no tienes que esperar a sentirte inspirada para empezar. Empiezas cuando pones atención. Y eso lo puedes hacer hoy, en la fila del súper, mientras preparas el café o mientras ves a tus clientas probar un producto.\n\n## 🪞 Para pensar\n¿En qué parte de tu día ya eres creativa sin darte cuenta? Piensa en tu casa, tu negocio, tu familia.\n\n## ✍️ Ejercicio\nHaz una lista de cinco cosas que creaste esta semana y que nunca llamaste \"creación\". Una comida, un mensaje, una foto, una solución, un acomodo.\n\n## ✅ Tu tarea de la semana\nCada noche, antes de dormir, escribe una línea: \"Hoy creé…\". Aunque sea algo chiquito.\n\n## 💬 Para compartir en el grupo\nComparte una de tus cinco creaciones escondidas. Te va a sorprender lo que hacen las demás.\n\n@@ 2 | Sintoniza | Clase 2 · Prende tu antena | Notar es el primer paso de crear\nTodas somos antenas. Las ideas, las señales y las pistas pasan todo el tiempo. La diferencia está en qué tan sintonizada estás para recibirlas.\n\n## La nube\nImagina que todas las ideas posibles viven en una nube enorme: todo lo que has visto, vivido, soñado, olvidado y lo que todavía no conoces. Las nubes nunca desaparecen, solo cambian de forma: llueven, se vuelven mar, se evaporan y regresan.\n\nLas ideas son iguales. **Nada sale de la nada**; lo nuevo es una mezcla distinta de lo que ya circula. Por eso no tienes que \"inventar\" desde cero. Tienes que aprender a recibir.\n\n## Tu vasija y tu colador\nDentro de ti hay una vasija donde se guarda todo lo que vives: pensamientos, emociones, recuerdos, lo que ves en redes, lo que escuchas en la calle. Pero antes de entrar, todo pasa por un colador: tus creencias, tus prisas, lo que te enseñaron a ignorar.\n\nEl colador es necesario, porque si no te volverías loca con tanta información. El problema es cuando está tan cerrado que ya no deja pasar nada nuevo. Ahí todo te parece igual y sientes que no tienes ideas.\n\n> La herramienta más importante para crear no es tu celular ni tu ring light. Eres tú.\n\n## Notar sin juzgar\nPoner atención no es analizar. Cuando ves algo bonito, primero vívelo. Ya después, si quieres, piensas por qué te gustó. Si de inmediato le pones etiqueta (\"esto es un buen hook\", \"esto se vende\"), dejas de verlo de verdad.\n\nPuedes jugar con tu atención: acercarte tanto a algo que se vuelva otra cosa, o alejarte hasta verlo completo. Callar lo de afuera para escuchar lo de adentro, o al revés.\n\n## Nada se repite\nPuedes sentarte en el mismo lugar cinco días seguidos y cada día será distinto: otra luz, otros ruidos, otra tú. Tampoco eres la misma persona todo el día. Eso significa que nunca se te van a acabar las cosas que notar.\n\n## Una práctica pequeña\nNo necesitas retiros. Necesitas rituales chiquitos que repitas:\n- Tres respiraciones lentas al despertar, antes de ver el celular.\n- Comer un bocado al día con toda tu atención.\n- Una caminata corta mirando todo como si fuera la primera vez.\n\nEl chiste no es el ritual. Es que poco a poco empiezas a mirar así todo el día.\n\n## 🪞 Para pensar\n¿Qué tan abierto está tu colador? ¿Hay cosas que ya ni ves porque \"siempre están ahí\"?\n\n## ✍️ Ejercicio\nSiéntate cinco minutos en un lugar de tu casa o tu calle. Cierra los ojos y anota todo lo que escuchas, hueles y sientes, en orden. Luego ábrelos y anota diez cosas que ves y que nunca habías notado.\n\n## ✅ Tu tarea de la semana\nElige un ritual chiquito de la lista y hazlo todos los días.\n\n## 💬 Para compartir en el grupo\nComparte la cosa más sorprendente que notaste en tu ejercicio de cinco minutos.\n\n@@ 3 | Sintoniza | Clase 3 · Busca pistas | Lo que entra, sale\nLas ideas para tu siguiente video, tu siguiente post o tu siguiente presentación ya están a tu alrededor. Solo hay que aprender a verlas.\n\n## Las pistas pasan como en una banda\nImagina que el mundo es una banda de aeropuerto con paquetitos pasando todo el tiempo: una frase que escuchas en la fila, un color en la calle, una canción, una pregunta que te hace una clienta. El primer paso es darte cuenta de que la banda existe. El segundo es agarrar un paquete y abrirlo.\n\nCuando algo raro o bonito te llama la atención, pregúntate: ¿por qué me llamó? ¿Qué me quiere decir?\n\n## Cuida lo que entra\nTodo lo que consumes llena tu vasija. Si todo el día ves contenido apurado y del montón, eso es lo que va a salir. Si te rodeas de cosas hermosas, bien hechas, que te mueven, tu ojo se afina.\n\nNo tiene que ser arte de museo. Puede ser una película buena, un libro, una cuenta que cuida cada detalle, una cocinera que hace todo con amor. Se trata de **subir el nivel de tu gusto** para que, cuando te toque decidir, sepas distinguir lo bueno de lo muy bueno.\n\n> No se trata de copiar lo que admiras. Se trata de afinar tu ojo.\n\n## La naturaleza enseña\nLa naturaleza es la obra más grande que tenemos gratis. La luz cambia cada hora. Ninguna piedra tiene un solo color. Si escoges colores de un catálogo, tienes opciones limitadas; si sales al jardín, la paleta es infinita. Mirar la naturaleza con calma te regresa a tu propia naturaleza.\n\n## Mira hacia adentro\nNo necesitas una vida extraordinaria para tener qué compartir. Tu mundo de adentro (lo que sientes, lo que recuerdas, lo que sueñas) es tan interesante como cualquier viaje. Algunas formas de entrar:\n- **Escribir sin pensar.** Pon un temporizador de cinco minutos y escribe lo que salga, sin corregir.\n- **La libreta junto a la cama.** Al despertar, antes de moverte, apunta lo que soñaste. Con los días vas a recordar más.\n- **El momento antes de dormir.** Nota qué ideas te llegan justo ahí.\n\n## Tu lugar\nHay quien crea con música y ruido, y hay quien necesita silencio total. No hay una forma correcta. Prueba y nota dónde te sientes más abierta: tu rincón de la casa, una cafetería, el coche estacionado, el parque.\n\n## 🪞 Para pensar\nSi lo que entra es lo que sale, ¿qué está entrando a tu vasija todos los días? ¿Cuánto de eso te hace mejor creadora?\n\n## ✍️ Ejercicio\nAbre un libro en una página al azar y lee la primera frase que veas. Escribe cómo podría tener que ver con algo que estás viviendo o creando. Luego haz una lista de cinco cosas hermosas o muy bien hechas que podrías dejar entrar esta semana.\n\n## ✅ Tu tarea de la semana\nCambia una hora de scroll por una de esas cinco cosas. Y apunta en tu libreta tres pistas que encuentres en el día.\n\n## 💬 Para compartir en el grupo\nComparte una pista que encontraste y en qué idea se convirtió.\n\n@@ 4 | Sintoniza | Clase 4 · La duda viene contigo | Cómo crear aunque tengas miedo\nLa duda vive en todas. Hasta en las que admiras. La meta no es que desaparezca, sino que no maneje.\n\n## La duda también sirve\nLo que hace que el arte nos mueva es que es humano, con todo y sus imperfecciones. Si fuéramos máquinas, lo que hacemos no tendría alma. Tu inseguridad también es parte de ti, y eso le da verdad a lo que creas.\n\nNadie más tiene tu voz. Si tú no haces lo que te toca hacer, nadie lo puede hacer por ti.\n\n## Bájale a lo que está en juego\nNos atoramos en tres momentos: al empezar, al terminar y al compartir. Casi siempre es porque pensamos que lo que estamos haciendo nos va a definir para siempre.\n\nMejor piénsalo como lo que es: **un experimento**. Un video más, un paso más. El objetivo es terminarlo para pasar al siguiente. Si empiezas desde \"aquí no hay bien ni mal, estoy jugando\", es mucho más fácil entrarle con gusto.\n\n> No estás jugando para ganar. Estás jugando para jugar.\n\n## Ponle nombre al ruidero\nCuando la cabeza se llena de pensamientos (\"no me va a salir\", \"qué van a decir\", \"ya lo hizo alguien\"), ponle un nombre a ese ruido. Llámalo **el ruidero**. Cuando aparezca, dilo: \"Ah, es el ruidero\", y sigue. Ponerle nombre le quita fuerza.\n\n## Duda de la obra, no de ti\nNo es lo mismo decir \"no sé si este video quedó bien\" que \"yo no sirvo para esto\". La primera duda te ayuda a mejorar. La segunda te paraliza. Si vas a dudar, que sea del trabajo, nunca de ti.\n\n## Lo roto puede ser lo más bonito\nHay una técnica japonesa para reparar cerámica que rellena las grietas con oro. En lugar de esconder la rotura, la vuelve el centro de la pieza. A veces lo que quieres \"arreglar\" es justo lo que hace especial lo que hiciste: tu acento, tu risa, tu cocina real, tus manos sin manicure.\n\n## Las voces que no son tuyas\nMuchas de las voces que te dicen \"no eres suficiente\" las aprendiste de chiquita: de una maestra, de un familiar, de alguien que te criticaba. No son tuyas. Las puedes escuchar como escuchas el ruido de la calle: ahí están, pero no les haces caso.\n\nY recuerda que puedes elegir. Si un día no quieres crear, no pasa nada. A veces darte permiso de dejarlo es lo que te hace darte cuenta de que sí quieres.\n\n## 🪞 Para pensar\n¿En cuál de los tres momentos te atoras más: al empezar, al terminar o al compartir? ¿Qué te dice el ruidero en ese momento?\n\n## ✍️ Ejercicio\nEscribe las tres frases que más te dice tu ruidero. Al lado de cada una, escribe de quién la aprendiste (si lo sabes) y una versión que dude de la obra, no de ti.\n\n## ✅ Tu tarea de la semana\nPublica o comparte algo que tengas guardado \"porque no está perfecto\". Ponle de título mental: experimento.\n\n## 💬 Para compartir en el grupo\nComparte una \"grieta de oro\": algo de ti que antes escondías y que ahora te gusta mostrar.\n\n@@ 5 | Sintoniza | Clase 5 · Ojos de principiante | Las reglas que sigues sin saber\nLo que ya sabes te ayuda, pero también te encierra. A veces la mejor idea llega cuando miras como si nunca hubieras hecho esto antes.\n\n## Saber menos puede ayudar\nHace unos años, una computadora aprendió sola un juego de mesa milenario, sin maestros ni tradiciones. En una partida contra el campeón del mundo hizo una jugada que ningún humano había hecho en miles de años. Todos pensaron que era un error. Esa jugada le dio la victoria.\n\nNo ganó por saber más. Ganó porque no cargaba con todo lo que \"así se hace\". Eso es mirar con ojos de principiante: **entrarle a algo sin la historia de cómo debería ser**.\n\n## Las reglas son suposiciones\nUna regla de creación no es como la ley de gravedad. Es una suposición: \"los videos deben durar menos de 30 segundos\", \"hay que salir siempre maquillada\", \"los lives son en la noche\", \"la foto del producto va con fondo blanco\". Algunas sirven. Muchas solo te ponen a hacer lo mismo que todas.\n\nLas reglas te llevan al promedio. Y el promedio no es lo que quieres. Lo interesante es lo que te hace distinta.\n\n> Que siempre lo hayas hecho así no significa que sea la mejor forma.\n\n## Las reglas escondidas\nLas reglas más fuertes son las que no ves: las que aprendiste de niña, las que absorbiste viendo a otras, las que \"todo mundo sabe\". Esas te mandan sin que te des cuenta. Cuando las descubres, puedes decidir si te quedas con ellas o las sueltas.\n\n## Prueba lo contrario\nPor cada regla que sigues, prueba lo opuesto. Si siempre hablas rápido, haz un video lento. Si siempre sales tú, haz uno donde solo se vean tus manos. Si siempre usas música, prueba con puro sonido real. No tiene que salir mejor. Solo vas a aprender algo.\n\nOtra opción es irte al extremo de lo que ya haces: si eres dulce, sé muy dulce. Si eres directa, sé directísima.\n\n## Quítate las etiquetas\n\"Soy vendedora\", \"soy mamá\", \"no soy de cámara\". Cualquier etiqueta que te pongas antes de crear te limita. Quítatelas un rato y pregúntate: ¿cómo veo el mundo sin ellas?\n\n## 🪞 Para pensar\n¿Qué \"así se hace\" sigues en tu contenido o en tu negocio sin haberlo cuestionado nunca?\n\n## ✍️ Ejercicio\nHaz una lista de cinco reglas que sigues al crear. Al lado de cada una, escribe su opuesto. Elige una y haz algo siguiendo el opuesto.\n\n## ✅ Tu tarea de la semana\nComparte esa pieza \"al revés\" y anota qué aprendiste, aunque no te haya gustado.\n\n## 💬 Para compartir en el grupo\nComparte la regla que rompiste y qué pasó.\n\n@@ 6 | Crea | Clase 6 · Junta | La fase de las semillas\nTodo proyecto empieza con una semilla: una frase, una imagen, una pregunta, una molestia, un \"¿y si…?\". En esta fase no eliges ni juzgas. Solo juntas.\n\n## Qué es una semilla\nUna semilla es cualquier punto de partida con vida. Para un video puede ser una frase que dijo una clienta, un sonido, un lugar con buena luz o una pregunta que te hacen seguido. Para tu negocio puede ser algo que les molesta a tus clientas, una necesidad que nadie atiende o algo que te encanta.\n\nJuntar semillas no cuesta mucho. Es más recibir que buscar. Como cuando vas a pescar: llegas al agua, pones la carnada, lanzas y esperas. No controlas al pez; solo controlas que tu caña esté en el agua.\n\n> Tu trabajo en esta fase es estar ahí cuando llegue la idea. Nada más.\n\n## No elijas todavía\nLa trampa es querer decidir de inmediato si una idea es buena. Es muy pronto para saberlo. Una semilla que parece chiquita puede volverse lo mejor que hagas, y la que más te emocionó puede no dar nada.\n\nPor eso conviene juntar muchas antes de escoger. Si tienes cien, vas a notar que la número cincuenta y cuatro te habla de un modo especial. Si solo tienes una, no tienes con qué compararla.\n\n## Las ideas chiquitas también cuentan\nNo esperes una señal enorme para empezar. Las mejores ideas suelen llegar bajito, como un susurro: un recuerdo, un detalle, una frase que oíste en el estacionamiento. El tamaño de la semilla no dice nada del tamaño del árbol.\n\nPara oír los susurros, la cabeza tiene que estar un poco callada. Por eso funcionan tanto el baño, el coche, la caminata o lavar trastes: ocupas el cuerpo y la mente se abre.\n\n## Siempre de guardia\nCrear no es solo el rato en que grabas. Es una forma de estar todo el día. Ten siempre a la mano tu libreta de semillas. Si no lo apuntas, se va. Y la mejor idea a lo mejor es la que se te ocurre hoy en la noche.\n\n## 🪞 Para pensar\n¿Cuántas ideas se te han ido por no apuntarlas? ¿Dónde te llegan las mejores?\n\n## ✍️ Ejercicio\nAbre tu libreta de semillas (está en Herramientas) y apunta veinte semillas en diez minutos, sin juzgar. Frases, imágenes, preguntas, molestias, recuerdos.\n\n## ✅ Tu tarea de la semana\nJunta al menos tres semillas diarias durante siete días. No hagas nada con ellas todavía.\n\n## 💬 Para compartir en el grupo\nComparte la semilla más rara que juntaste.\n\n@@ 7 | Crea | Clase 7 · Juega | La fase de experimentar\nYa tienes semillas. Ahora toca jugar con ellas para ver cuál quiere crecer. En esta fase no hay nada en juego, y por eso es de las más divertidas.\n\n## Buscar señales de vida\nExperimentar es probar una semilla en distintas direcciones: otro formato, otro lugar, otro tono, otra historia. Si tu semilla es \"las mamás no tienen tiempo para arreglarse\", puedes probarla como tutorial de tres minutos, como comedia, como carta a ti misma, como reto de una semana.\n\nAquí no buscas la versión más rápida ni la más fácil. Buscas **la que tiene más vida**. Y no recortas todavía: generas opciones en lugar de eliminarlas.\n\n## No discutas las ideas, pruébalas\nUna idea puede sonar increíble en tu cabeza y no funcionar, y otra que suena aburrida puede ser justo lo que hacía falta. La única forma de saber es probarla.\n\nEsto sirve muchísimo en equipo. En lugar de discutir qué idea es mejor, háganlas las dos y véanlas. Las descripciones nunca les hacen justicia a las ideas. Y el que convence mejor no siempre tiene la mejor idea.\n\n> Si buscas la mejor idea, pruébalas todas.\n\n## Pregúntate \"¿y si…?\"\n- ¿Y si este fuera el primer video que alguien ve en su vida?\n- ¿Y si quito todas las palabras?\n- ¿Y si lo que siempre digo fuerte lo digo en voz bajita?\n- ¿Y si lo grabo en un lugar donde nadie lo esperaría?\n\n## Sigue lo que te emociona\n¿Cómo sabes qué semilla está floreciendo? Casi nunca lo dice la cabeza; lo dice el cuerpo. Cuando algo empieza a juntarse, sientes ganas de más, como que te inclinas hacia adelante. **Esa emoción es tu brújula.** Síguela, aunque no sepas explicar por qué.\n\nSi una idea parece más segura y otra más interesante, dale chance a la interesante.\n\n## Equivocarte es información\nMuchos inventos famosos salieron por accidente: buscaban otra cosa y encontraron algo mejor. Cuando algo \"sale mal\", no lo tires de inmediato. Pregúntate qué te está enseñando. Una vuelta equivocada te deja ver paisajes que no habrías visto.\n\nY si una semilla no responde, no la tires: guárdala. Hay ideas a las que todavía no les toca.\n\n## 🪞 Para pensar\n¿Sueles quedarte con tu primera idea o te das permiso de probar varias?\n\n## ✍️ Ejercicio\nElige una semilla de tu libreta y hazle cinco versiones distintas, aunque sean borradores de diez segundos o notas en papel. Cambia formato, tono, lugar o punto de vista.\n\n## ✅ Tu tarea de la semana\nGraba o haz dos de esas versiones y nota cuál te emociona más. No la que creas que \"va a funcionar\": la que te emocione.\n\n## 💬 Para compartir en el grupo\nComparte tus cinco versiones y pregunta cuál le dio más curiosidad a tus compañeras.\n\n@@ 8 | Crea | Clase 8 · Construye | La fase del oficio\nCuando una semilla ya mostró qué quiere ser, cambia el trabajo. Ya no estás explorando: estás construyendo. Es la parte menos glamorosa y la más necesaria.\n\n## De la chispa al ladrillo\nEn las primeras fases todo es descubrimiento. Aquí ya hay dirección, y toca el trabajo de pegar ladrillos: escribir el guion, grabar las tomas, editar, ajustar. Es el momento en que muchas abandonan, porque extrañan la emoción del principio.\n\nPero las ideas que no se terminan no existen. **Solo creces terminando.**\n\n## Construir también es quitar\nConstruir no es solo agregar. También es podar: quitar lo que distrae para que lo importante tenga más fuerza.\n\nPregúntate cuál es la esencia de lo que estás haciendo. Si un niño dibuja una casa y le quitas la ventana, sigue siendo casa. Si le quitas la puerta, también. Pero si le quitas el techo y las paredes, ya no se sabe. Busca eso que no se puede quitar y protégelo. Si dudas de si algo sirve, probablemente sobra. Siempre lo puedes regresar.\n\n> Lo simple bien hecho le gana a lo complicado.\n\n## Los detalles importan\nHay un entrenador legendario de basquetbol que el primer día les enseñaba a sus jugadores a ponerse bien los calcetines, sin una sola arruga, para que no les salieran ampollas. Parece ridículo, pero esos detalles sumados hacían la diferencia.\n\nEn lo tuyo pasa igual: la luz, el audio, la primera frase, cómo acomodas el producto. **La forma en que haces una cosa es la forma en que haces todo.**\n\n## Mantén el impulso\n- **Ponte fechas para ti**, no para presumirlas. Te ayudan a no quedarte puliendo para siempre.\n- **Si te atoras en una parte, sáltatela.** Termina lo demás y regresa. Un puente es más fácil de construir cuando ya ves las dos orillas.\n- **Haz un borrador completo** aunque esté imperfecto. Un borrador entero sirve más que un pedacito perfecto.\n- **No te enamores del borrador.** Si lo ves y lo ves mil veces, se te queda grabado como \"la versión\" y luego no te atreves a mejorarlo. Trabaja, y luego aléjate.\n\n## Hábitos que te liberan\nLa disciplina y la libertad parecen opuestas, pero son compañeras. Si tu día práctico está ordenado, te queda espacio para jugar en lo creativo. Decide de antemano cuándo vas a crear, para que la energía se vaya en el trabajo y no en decidir cuándo hacerlo. Empieza con poco: media hora al día que sí puedas sostener.\n\n## 🪞 Para pensar\n¿Qué proyectos tienes empezados y abandonados en la fase de construir? ¿Qué te hizo soltarlos?\n\n## ✍️ Ejercicio\nToma la versión que más te emocionó en la clase anterior. Escribe en una línea su esencia. Luego haz una lista de lo que sobra y quítalo.\n\n## ✅ Tu tarea de la semana\nTermina un borrador completo de esa pieza, saltándote las partes donde te atores. Ponte una fecha de entrega para ti.\n\n## 💬 Para compartir en el grupo\nComparte tu fecha y cuéntale al grupo qué vas a terminar. Que te pregunten cómo vas.\n\n@@ 9 | Crea | Clase 9 · Rompe la rutina | Experimentos para cuando te atoras\nA veces todo se ve igual y nada mejora. No es que se te acabó la creatividad. Es que necesitas mover algo para volver a verlo con ojos nuevos.\n\n## Mueve una pieza\nCuando estás atorada, cambia una sola cosa y ve qué pasa. No esperes un resultado; la idea es despertar la emoción. Algunas formas de hacerlo:\n- **Pasitos chiquitos.** Escribe una sola línea al día, buena o mala. Lo grande se destraba de a poquito.\n- **Cambia el lugar.** Graba en otro cuarto, en otra hora, con la luz apagada, sosteniendo tú el celular.\n- **Cambia lo que está en juego.** Imagina que es la última vez que vas a contar esa historia. O al revés: que es solo un ensayo.\n- **Invita a alguien.** Que una persona te vea grabar. Casi todas nos enfocamos más con público.\n- **Cambia a quién le hablas.** El mismo mensaje dicho a tu mejor amiga, a tu abuela o a tu yo de hace cinco años suena distinto.\n- **Crea para otra.** ¿Cómo haría este video tu creadora favorita? Hazlo como si te lo hubiera encargado.\n- **Pinta una escena.** En lugar de pensar en técnica, imagina una imagen o una historia y graba \"como si fuera eso\".\n\nEn Herramientas tienes doce experimentos para tener a la mano.\n\n## Reglas temporales\nUna cosa es romper reglas viejas y otra es ponerte reglas nuevas a propósito, solo para un proyecto. Cuando todo es posible, cuesta decidir. Cuando te pones límites, te obligas a encontrar soluciones distintas.\n\nHa habido libros escritos sin usar una letra, pintores que trabajaron con un solo color y películas hechas con reglas estrictísimas. Tú puedes probar: \"esta semana, solo luz natural\", \"solo con el celular, sin editar\", \"un solo producto en todos los videos\", \"menos de diez palabras\".\n\n> Un límite no te quita libertad. Te enseña a mirar distinto.\n\n## Cambia el contexto\nUna flor en un jardín, en la mano de una novia o sobre una tumba no se siente igual. El contexto cambia el mensaje. Si algo no te está funcionando, cambia lo que tiene alrededor: el fondo, la música, el orden, lo que va antes y después. Juega con pares: fuerte o suave, rápido o lento, cerca o lejos, claro u oscuro.\n\n## Cómo elegir entre dos\nEs difícil saber si algo está bien cuando lo ves solo. Pon dos opciones lado a lado y compáralas. Casi siempre una te jala más. Si no sabes cuál, echa un volado: mientras la moneda está en el aire, vas a notar cuál quieres que salga. Esa es.\n\n## 🪞 Para pensar\n¿Qué haces normalmente cuando te atoras? ¿Te funciona?\n\n## ✍️ Ejercicio\nElige tres experimentos de esta clase y aplícalos a la pieza que estás construyendo. Luego compara dos versiones lado a lado.\n\n## ✅ Tu tarea de la semana\nPonte una regla temporal para toda la semana y crea al menos tres piezas con ella.\n\n## 💬 Para compartir en el grupo\nComparte tu regla de la semana y la pieza que más te sorprendió.\n\n@@ 10 | Crea | Clase 10 · Suéltalo | La fase de terminar y compartir\nLlega un momento en que ya no hay nada que agregar ni quitar. Ahí toca lo más difícil para muchas: dejarlo ir.\n\n## Termina para empezar otra\nMientras algo no está terminado, todavía puedes cambiarlo todo. Por eso da miedo soltarlo. Y entonces aparecen las excusas: le encuentras defectos que no existen, haces cambios que nadie va a notar o te convences de que mejor lo tiras.\n\nRecuerda esto: **lo que haces nunca es todo lo que eres, solo quién eres hoy**. Si esperas demasiado, ya no es tu reflejo. Cada pieza es una hoja de tu diario, no tu biografía completa.\n\n> ¿Cuántas páginas se van a quedar vacías por darle vueltas a esta?\n\n## Enséñaselo a alguien, pero escucha bien\nCuando ya casi está, muéstraselo a alguien de confianza. No tanto para que te dé su opinión, sino para verlo con otros ojos. Te vas a dar cuenta de cosas solo por tenerla enfrente.\n\nSi te dan retroalimentación, escucha para entender a la persona, no para defender tu trabajo. Y si te sugieren una solución que no te convence, pregúntate qué problema real están señalando. \"Quítale el principio\" puede significar \"el principio está lento\".\n\n## No todos lo van a amar\nSi haces algo con tu voz de verdad, a unas les va a encantar y a otras no. Eso es buena señal. Si le gusta a todo el mundo, quizá te quedaste muy en lo seguro. Al final, la que lo tiene que amar eres tú.\n\n## ¿Cuándo está listo?\nNo hay fórmula. Está listo cuando sientes que está listo. Una fecha de entrega ayuda mucho en esta fase: el arte no se hace con reloj, pero sí se termina con reloj. Si ya te gusta y te dan ganas de enseñárselo a una amiga, probablemente ya es hora de enseñárselo a todas.\n\n## El río\nLas ideas son como un río. Cuando compartes, el agua corre y llegan nuevas. Si guardas todo \"para cuando valga la pena\", el río se estanca. No guardes tu mejor idea para un momento especial: úsala, y va a llegar otra.\n\n## La Soñadora y La Terminadora\nHay creadoras que aman soñar y probar, pero les cuesta terminar: son **Soñadoras**. Y hay otras que terminan rapidísimo, pero casi no exploran: son **Terminadoras**. A la Soñadora le sirve terminar algo pequeño, aunque sea una parte. A la Terminadora le sirve darse más tiempo para jugar antes de cerrar.\n\n## 🪞 Para pensar\n¿Eres más Soñadora o más Terminadora? ¿Qué tienes guardado que ya debería estar afuera?\n\n## ✍️ Ejercicio\nHaz una lista de todo lo que tienes \"casi listo\". Elige una pieza y escribe qué es lo único que le falta. Solo lo único.\n\n## ✅ Tu tarea de la semana\nTermina y comparte la pieza que construiste en las clases anteriores. Y apunta en tu libreta una semilla nueva para tu siguiente proyecto.\n\n## 💬 Para compartir en el grupo\nComparte tu pieza terminada y celebra la de otra.\n\n@@ 11 | Sostén | Clase 11 · Tu éxito es tuyo | Medir lo que sí depende de ti\nSi mides lo que haces solo por los likes o las ventas de esa semana, vas a vivir subiendo y bajando. Hay otra forma de medir.\n\n## Qué es el éxito\nEl éxito no es la popularidad ni el número de vistas. Pasa en privado: en el momento en que terminas algo, sabes que diste lo mejor que tenías y decides soltarlo, antes de que nadie opine.\n\nLo que pasa después depende de mil cosas que no controlas: la hora, el algoritmo, lo que está pasando en el mundo, lo que publicaron otras ese día. Lo único que sí controlas es hacer tu mejor trabajo, compartirlo, empezar el siguiente y no quedarte mirando para atrás.\n\n> Haz lo que tú amarías ver. Tu emoción es lo que conecta.\n\n## Haz lo que tú amarías ver\nCuando creas pensando \"a mí no me gusta, pero seguro a ellas sí\", casi siempre sale algo plano. No hay mejor forma de adivinar qué le va a gustar a alguien que el que te guste a ti primero.\n\nEsto también sirve para vender: tus clientas no se enganchan con un formato, se enganchan con tu emoción por lo que muestras. Si un día cambias de estilo porque te late otra cosa, síguelo.\n\n## Compararte te roba la alegría\nLo que tú haces representa quién eres tú. Lo que hace otra representa quién es ella. No se pueden medir una contra otra. Competir para \"ganarle\" a alguien casi nunca te lleva a algo bueno.\n\nPero hay otra energía: cuando ves algo tan bonito que te dan ganas de subir tu nivel. Eso no es competencia, es inspiración. Hay bandas famosas que se fueron inspirando unas a otras con discos cada vez mejores, por admiración, no por envidia. Así sí.\n\nLa única competencia sana es contigo: no para ganarle a lo que hiciste antes, sino para seguir creciendo.\n\n## Mírala como película\nCuando algo sale mal (un video que no funcionó, una clienta que se fue, un mes flojo), intenta verlo como si fuera una escena de película. Eres tú, pero también eres la protagonista de una historia. \"No me esperaba este giro. A ver qué sigue.\"\n\nSi te acercas mucho, todo parece catástrofe. Si te alejas, cada momento se vuelve más pequeño dentro de una vida grande. Tú eliges desde dónde mirar.\n\n## 🪞 Para pensar\n¿Cómo mides hoy si lo que hiciste salió bien? ¿Cuánto de eso depende de ti?\n\n## ✍️ Ejercicio\nEscribe tu propia definición de éxito para lo que creas, con cosas que sí dependan de ti. Por ejemplo: \"Terminé, me gusta y lo compartí.\"\n\n## ✅ Tu tarea de la semana\nCuando publiques algo, no revises los números en 24 horas. Escribe en tu libreta cómo te sentiste al terminarlo.\n\n## 💬 Para compartir en el grupo\nComparte tu definición de éxito.\n\n@@ 12 | Sostén | Clase 12 · Crear en equipo | Tu círculo, la opción C y cuidar la chispa\nCrear sola está bien. Crear acompañada puede llevarte a lugares a los que no llegarías nunca sola.\n\n## Tu círculo\nRodéate de gente creativa. No tienen que hacer lo mismo que tú; basta con que les emocione crear. La creatividad se contagia: cuando pasas tiempo con personas que miran el mundo con curiosidad, empiezas a mirar igual. Un grupo así, para compartir ideas, platicar y darse retro, es de las cosas más bonitas que te pueden pasar.\n\n## Cooperar, no competir\nEn un buen equipo, gana la mejor idea, sea de quien sea. Creer que tu idea es la mejor solo porque es tuya es un error de principiante.\n\nCuando una quiere la opción A y otra la opción B, no se trata de que una ceda. Se trata de **seguir trabajando hasta encontrar una opción C** que a las dos les encante. Puede tener algo de A, algo de B o nada de ninguna. Cuando alguien cede solo para avanzar, pierden todas.\n\n> Si siempre están de acuerdo en todo, a lo mejor una de las dos sobra.\n\nUn poco de fricción es buena: de dos miradas distintas sale algo que ninguna haría sola.\n\n## Cómo dar retro\n- Habla del trabajo, nunca de la persona.\n- Sé específica: \"el audio se oye bajito en la segunda parte\" ayuda más que \"no me gustó\".\n- Si tienes una solución, aguántate un momento. A lo mejor ella encuentra una mejor.\n\n## Cómo recibirla\n- Deja el ego en la puerta. Que te señalen un detalle no significa que todo esté mal.\n- Repite lo que entendiste. Muchas veces lo que oíste no es lo que te dijeron.\n- Pregunta hasta entender qué vio la otra persona.\n\n## Primero, no estorbes\nCuando una compañera te enseña algo que está empezando, cuídalo. Las ideas recién nacidas tienen una magia que se rompe fácil. A veces la mejor ayuda es decir \"así está precioso, no le muevas\".\n\n## No le pidas todo a tu creación\nSi esperas que tu contenido te mantenga desde el primer día, le pones una presión enorme. Está bien tener un ingreso que te sostenga mientras creas. Así lo que haces se queda libre.\n\n## Al terminar el curso\nYa tienes tu antena prendida, tu libreta de semillas y un camino para cualquier proyecto: junta, juega, construye y suelta. Ahora toca repetirlo una y otra vez. Cada pieza que termines es una estación, no el final del viaje.\n\n## 🪞 Para pensar\n¿Con quién creas mejor? ¿Quién te hace mirar distinto?\n\n## ✍️ Ejercicio\nElige a una compañera y hagan una pieza juntas. Cuando no estén de acuerdo, busquen la opción C. Usa la guía de retro de Herramientas.\n\n## ✅ Tu tarea de la semana\nArma tu círculo: tres personas con las que vas a compartir semillas y avances cada semana.\n\n## 💬 Para compartir en el grupo\nComparte la pieza que hicieron juntas y cuál fue su opción C.\n\n\n@@ 13 | Herramienta | Tu libreta de semillas | Cómo apuntar y dónde buscar\nTu libreta de semillas es el lugar donde guardas todo lo que te llama la atención. Puede ser una libreta chiquita, una nota en el celular o un álbum de capturas.\n\n## Cómo apuntar una semilla\nPara cada semilla, apunta tres cosas en una línea:\n- **Qué es.** \"Mi hija dijo que el maquillaje es pintura para la cara.\"\n- **Dónde la encontraste.** En la mesa, en el súper, en un video, en un sueño.\n- **Qué te movió.** \"Me dio risa y ternura. Podría ser un video de cómo ven ellas lo que hago.\"\n\nNo la juzgues. No decidas si sirve. Solo apúntala.\n\n## Diez lugares para buscar semillas\n1. Las preguntas que te hacen tus clientas.\n2. Lo que dicen las niñas y los niños.\n3. Algo que te molesta y que nadie resuelve.\n4. Una canción que te pone la piel chinita.\n5. La luz de tu casa a distintas horas.\n6. Tus sueños, apuntados al despertar.\n7. Una frase de un libro abierto al azar.\n8. Algo que hacías de niña y ya no haces.\n9. Una conversación que oíste sin querer.\n10. Un recuerdo que te regresa sin razón.\n\n## Cada domingo\nLee las semillas de la semana. No elijas la mejor; marca las que todavía te emocionan. Esas son las que vas a llevar a la fase de jugar. Las demás se quedan guardadas, que a lo mejor todavía no es su momento.\n\n@@ 14 | Herramienta | Doce experimentos | Para cuando todo se ve igual\nCuando te atores, elige uno, pruébalo sin esperar nada y ve qué pasa.\n\n## Los doce\n1. **Una línea al día.** Escribe solo una línea diaria, buena o mala.\n2. **Otro lugar.** Graba en un cuarto, una hora o una luz que nunca usas.\n3. **La última vez.** Haz como si fuera la última vez que vas a contar esto.\n4. **Solo un ensayo.** Haz como si nadie lo fuera a ver nunca.\n5. **Con público.** Pide a alguien que te vea crear.\n6. **Otra destinataria.** Dile lo mismo a otra persona: tu abuela, tu yo de antes, una desconocida.\n7. **Encargo de tu favorita.** Hazlo como lo haría la creadora que más admiras.\n8. **Una escena.** Imagina una imagen o una historia y crea \"como si fuera eso\".\n9. **Poca información.** Cuéntale a alguien solo la idea básica y deja que ella la haga a su modo.\n10. **Al revés.** Haz lo contrario de lo que haces siempre.\n11. **Al extremo.** Lleva lo que ya haces al máximo.\n12. **Una regla temporal.** Ponte un límite solo por esta semana.\n\n## Pares para cambiar el contexto\nPrueba tu pieza moviéndola de un lado al otro de estos pares:\n- fuerte o suave\n- rápido o lento\n- cerca o lejos\n- claro u oscuro\n- grande o pequeño\n- adentro o afuera\n- antes o después\n- igual o distinto\n\n## Para elegir\nPon dos versiones lado a lado. Si no sabes, echa un volado y nota por cuál le vas mientras la moneda está en el aire.\n\n@@ 15 | Herramienta | Las cuatro fases | Junta, juega, construye y suelta\nUn mapa para cualquier proyecto. No es una línea recta: puedes regresar a una fase anterior cuando lo necesites.\n\n## 1 · Junta\n- ¿Estoy apuntando todo lo que me llama, sin juzgar?\n- ¿Tengo suficientes semillas para comparar?\n- ¿Estoy dejando entrar cosas buenas a mi vasija?\n\n## 2 · Juega\n- ¿Probé la semilla en varias direcciones?\n- ¿Estoy probando las ideas en lugar de discutirlas?\n- ¿Qué versión me hace inclinarme hacia adelante?\n- ¿Guardé las semillas que no respondieron, en vez de tirarlas?\n\n## 3 · Construye\n- ¿Cuál es la esencia, en una línea?\n- ¿Qué sobra?\n- ¿Tengo una fecha para mí?\n- ¿Me salté la parte donde me atoré para terminar lo demás?\n- ¿Estoy cuidando los detalles?\n\n## 4 · Suelta\n- ¿Ya no hay nada que agregar ni quitar?\n- ¿Se lo enseñé a alguien para verlo con otros ojos?\n- ¿Escuché la retro buscando el problema real?\n- ¿Lo estoy deteniendo por miedo o porque de verdad le falta algo?\n- ¿Ya apunté la semilla de lo que sigue?\n\n@@ 16 | Herramienta | Dar y recibir retro | Una guía para tu círculo\nPara que la retroalimentación ayude y no lastime.\n\n## Antes de opinar\n- Pregunta qué tipo de retro quiere: ¿una primera impresión, algo técnico, o solo ánimo?\n- Si es una idea recién nacida, cuídala. A veces basta con decir qué te gustó.\n\n## Al dar retro\n- Empieza por lo que sí funciona, con detalle.\n- Habla del trabajo, no de la persona.\n- Sé específica: qué parte, qué momento, qué sentiste.\n- Guárdate tu solución un ratito y deja que ella encuentre la suya.\n\n## Al recibir retro\n- Respira. Un detalle no significa que todo esté mal.\n- Repite lo que entendiste: \"¿Me dices que el inicio se siente lento?\"\n- Pregunta qué vio exactamente.\n- Busca el problema detrás de la sugerencia.\n- Al final decides tú. Es tu obra.\n\n## Cuando no se ponen de acuerdo\nNo elijan entre A y B. Sigan probando hasta encontrar una opción C que a las dos les encante.";
var FAQ_MD="## Empezar | 0\n\n### No me considero creativa. ¿Este curso es para mí?\nSí, sobre todo para ti. La idea central del curso es que crear no es un talento raro sino una forma de mirar, y eso se practica. La clase 1 te enseña a ver todo lo que ya creas sin darte cuenta.\n\n### ¿Necesito saber de redes o de edición?\nNo. Este curso no es técnico. Te ayuda con lo que va antes: tener ideas, desarrollarlas, terminarlas y atreverte a compartirlas. Sirve igual para videos, fotos, lives, presentaciones o ideas de negocio.\n\n### ¿Cuánto tiempo me toma?\nCada clase se lee en unos diez minutos. Lo importante es la práctica: unos diez minutos al día para notar y juntar semillas, y el tiempo que le quieras dar a tu proyecto.\n\n### ¿Tengo que seguir el orden?\nTe recomendamos leer las clases en orden la primera vez, porque las de la parte Crea siguen un proyecto de principio a fin. Después puedes regresar a la que necesites.\n\n## Ideas | 6\n\n### ¿Qué hago si no se me ocurre nada?\nCasi nunca es que no tengas ideas: es que no las estás apuntando o que tu colador está muy cerrado. Empieza con la libreta de semillas y con un ritual chiquito de atención al día. Lo explican las clases 2 y 6.\n\n### ¿Qué es una semilla?\nCualquier punto de partida con vida: una frase, una imagen, una pregunta de una clienta, algo que te molesta, un recuerdo. No tiene que ser una idea completa. La clase 6 te enseña a juntarlas.\n\n### ¿Cómo sé cuál de mis ideas es la buena?\nNo lo sabes al principio, y está bien. Junta muchas, juega con varias y fíjate cuál te hace inclinarte hacia adelante. Tu emoción es la mejor brújula. Lo explica la clase 7.\n\n### ¿Y si mi idea ya la hizo alguien más?\nNada sale de la nada. Todas las ideas son mezclas de otras. Lo que nadie más tiene es tu forma de mirar. Si la haces desde tu voz, ya es distinta.\n\n### ¿De dónde saco inspiración cuando estoy cansada?\nNo esperes a la inspiración. Haz algo chiquito con lo que tienes: una línea, una foto, una nota. A veces la chispa llega haciendo, no antes. Y descansar también es parte de crear.\n\n## Miedo y duda | 4\n\n### Me da pena lo que van a decir. ¿Cómo le hago?\nBájale a lo que está en juego: piensa en cada pieza como un experimento, no como algo que te define. Ponle nombre al ruido de tu cabeza y sigue. Lo explica la clase 4.\n\n### Siempre siento que no está perfecto.\nNada lo va a estar. Muchas veces lo que quieres arreglar es justo lo que lo hace especial. Duda del trabajo para mejorarlo, pero no de ti. Y cuando ya no haya nada esencial que quitar o agregar, suéltalo. Lo explican las clases 4 y 10.\n\n### ¿Qué hago con las críticas?\nEscucha para entender a la persona, no para defenderte. Busca el problema real detrás de su sugerencia y al final decide tú. La clase 12 y la guía de retro te ayudan.\n\n## El proceso | 7\n\n### Empiezo muchas cosas y no termino ninguna.\nProbablemente eres más Soñadora. Elige una pieza pequeña y termínala, aunque sea una parte. Sáltate lo que te atora y regresa al final. Lo explican las clases 8 y 10.\n\n### Me aburro de hacer siempre lo mismo.\nRompe la rutina: cambia el lugar, la persona a la que le hablas o ponte una regla temporal por una semana. Tienes doce experimentos en Herramientas y la clase 9 te explica cómo usarlos.\n\n### ¿Cuándo sé que algo ya está listo?\nNo hay fórmula. Está listo cuando ya no hay nada que agregar ni quitar y te dan ganas de enseñárselo a una amiga. Una fecha de entrega para ti ayuda mucho. Lo explica la clase 10.\n\n### ¿Esto sirve para vender?\nSí, aunque el curso no es de ventas. Tus clientas se conectan con tu emoción y tu forma de ver las cosas, no con un formato copiado. Si haces lo que tú amarías ver, se nota. Lo explica la clase 11.\n\n## Éxito y equipo | 11\n\n### Mis videos no tienen vistas. ¿Estoy haciendo algo mal?\nNo necesariamente. Las vistas dependen de muchas cosas que no controlas. Mide lo que sí depende de ti: terminar, que te guste y compartirlo. Y sigue con el siguiente. Lo explica la clase 11.\n\n### Me comparo mucho con otras de mi equipo.\nEs muy normal. Pero lo que haces tú y lo que hace otra no se pueden medir igual: cada una muestra quién es. Usa lo que admiras como inspiración para subir tu nivel, no como competencia. Lo explica la clase 11.\n\n### ¿Cómo creamos juntas sin pelearnos?\nGana la mejor idea, sea de quien sea. Cuando no estén de acuerdo, busquen la opción C. Y den retro sobre el trabajo, nunca sobre la persona. Lo explica la clase 12.\n\n## Tu mentora | 0\n\n### ¿Qué hace la mentora?\nVive en Claude. Te da las clases una por una, te ayuda a juntar y elegir semillas, te propone experimentos cuando te atoras y te acompaña para terminar y soltar lo que estás haciendo.\n\n### ¿Tiene costo?\nFunciona con la cuenta gratis de Claude. La cuenta gratis tiene un límite de mensajes por día; si se acaba, vuelve a estar disponible horas después.";

var N=CFG.n,STEPS=[];for(var i=1;i<=N;i++)STEPS.push(i);

var GROUPS=CFG.groups.map(function(g){var p=g[0].split(" · ");return {name:p.length>1?p[1]:g[0],pre:p.length>1?p[0]:"",ids:g[1]};});
var ACTS=GROUPS.filter(function(g){return g.ids.every(function(i){return i>=1&&i<=N;});});
var TOOLS=ORDER.filter(function(i){return i>N;});
var seen=new Set(store.get(CFG.key+"-seen",[])),notes=store.get(CFG.key+"-notes",{});
function saveSeen(){store.set(CFG.key+"-seen",Array.from(seen));}
function isStep(id){return id>=1&&id<=N;}
function nextUp(){if(!seen.has(0)&&!STEPS.some(function(i){return seen.has(i);}))return 0;for(var i=0;i<STEPS.length;i++)if(!seen.has(STEPS[i]))return STEPS[i];return null;}
function count(){return STEPS.filter(function(i){return seen.has(i);}).length;}
function stateOf(id){return seen.has(id)?"seen":(id===nextUp()?"next":"");}
function actOf(id){for(var i=0;i<ACTS.length;i++)if(ACTS[i].ids.indexOf(id)>=0)return ACTS[i];return null;}
function label(id){var x=L(id);if(!x)return "";if(id===0)return CFG.welcomeLabel||"Bienvenida";var m=x.title.match(/^([^·]{1,14}) · /);if(isStep(id)&&m)return m[1];return x.kicker;}
function ttl(x){return x.title.replace(/^[^·]{1,14} · /,"");}
function ctaText(){var n=nextUp();if(n===0)return CFG.ctaStart||"Empezar con la bienvenida";if(n===null)return "Repasar "+(CFG.repaso||"el curso");var l=label(n);return "Seguir con "+(/^Clase/.test(l)?"la ":"el ")+l;}
var CTX={ttl:ttl,L:L,LESSONS:LESSONS,N:N,STEPS:STEPS,ACTS:ACTS,TOOLS:TOOLS,GROUPS:GROUPS,seen:seen,stateOf:stateOf,nextUp:nextUp,count:count,esc:esc,label:label,ctaText:ctaText,cfg:CFG,reduce:reduce,actOf:actOf,open:function(id){openLesson(id);}};

/* ---------- page shell ---------- */
var mw=MENTOR.title.indexOf("mentor ")>=0||/mentor,/.test(MENTOR.title)?"mentor":"mentora";
var SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>';
var root=$("#root");
root.innerHTML='<div class="wrap"><header class="hero" id="hero"></header>'+
  '<div class="tabbar"><div class="tabs" role="tablist" aria-label="Secciones del curso">'+
  '<button class="tab" role="tab" id="tabP" aria-selected="true" aria-controls="progView" type="button">'+esc(CFG.tabProgram||"Programa")+'</button>'+
  '<button class="tab" role="tab" id="tabF" aria-selected="false" aria-controls="faqView" type="button">Preguntas</button>'+
  '<button class="tab" role="tab" id="tabM" aria-selected="false" aria-controls="mentorView" type="button">Tu '+mw+'</button></div></div>'+
  '<section id="progView" role="tabpanel" aria-labelledby="tabP"></section>'+
  '<section id="faqView" role="tabpanel" aria-labelledby="tabF" hidden><div class="faqv"><div><h2 class="sec-h">Preguntas</h2><p class="sec-p">'+esc(CFG.faqLead||"Las dudas que más salen en el equipo, con la clase que las responde.")+'</p></div>'+
  '<label class="sr" for="fq">Busca tu duda</label><div class="f-search">'+SEARCH+'<input id="fq" type="search" placeholder="'+esc(CFG.faqPh||"Busca tu duda")+'" autocomplete="off"></div><div class="f-chips" id="cats"></div><p class="f-count" id="fcount"></p><div id="faq"></div></div></section>'+
  '<section id="mentorView" role="tabpanel" aria-labelledby="tabM" hidden></section>'+
  (CFG.foot?'<footer class="foot">'+esc(CFG.foot)+"</footer>":"")+"</div>";

function renderHero(){$("#hero").innerHTML=SKIN.hero(CTX);var c=$("#cta");if(c)c.onclick=function(){var g=nextUp();if(g===null){setTab("P");$("#progView").scrollIntoView({behavior:"smooth"});}else openLesson(g);};$$("#hero [data-open]").forEach(wireOpen);}
function renderProgram(){$("#progView").innerHTML=SKIN.program(CTX);$$("#progView [data-open]").forEach(wireOpen);if(SKIN.mount)SKIN.mount(CTX,$("#progView"));}
function wireOpen(b){b.onclick=function(){openLesson(+b.getAttribute("data-open"),b);};}
function refresh(){renderHero();renderProgram();}

/* tabs */
var TABS={P:["#tabP","#progView"],F:["#tabF","#faqView"],M:["#tabM","#mentorView"]};
function setTab(t){Object.keys(TABS).forEach(function(k){$(TABS[k][0]).setAttribute("aria-selected",String(k===t));$(TABS[k][1]).hidden=k!==t;});}
Object.keys(TABS).forEach(function(k){$(TABS[k][0]).onclick=function(){setTab(k);};});

/* ---------- faq ---------- */
var norm=function(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");};
var STOP=new Set("que como para por con los las del una uno unos mis tus sus mas pero porque cuando donde esta este eso hay tengo puedo debo".split(" "));
function terms(s){return (norm(s).match(/[a-z0-9ñ]{3,}/g)||[]).filter(function(w){return !STOP.has(w);}).map(function(w){return w.length>5?w.slice(0,-1):w;});}
var FAQ=[],CATS=[];
FAQ_MD.split(/^## /m).filter(function(x){return x.trim();}).forEach(function(block){
  var lines=block.split("\n"),h=lines[0].split("|").map(function(x){return x.trim();});if(!h[0])return;CATS.push({cat:h[0],cls:+h[1]});
  lines.slice(1).join("\n").split(/^### /m).filter(function(x){return x.trim();}).forEach(function(qb){var i=qb.indexOf("\n");if(i<0)return;FAQ.push({cat:h[0],cls:+h[1],q:qb.slice(0,i).trim(),a:qb.slice(i+1).trim()});});
});
FAQ.forEach(function(f){f.n=norm(f.q+" "+f.a);});
function hl(html,ts){if(!ts.length)return html;return html.replace(/(>[^<]+<)/g,function(seg){var out=seg;ts.forEach(function(w){var re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").split("").map(function(ch){return ({a:"[aá]",e:"[eé]",i:"[ií]",o:"[oó]",u:"[uúü]",n:"[nñ]"})[ch]||ch;}).join("")+"[a-záéíóúñü]*)","gi");out=out.replace(re,"<mark>$1</mark>");});return out;});}
var fq=$("#fq"),faqEl=$("#faq"),fcount=$("#fcount"),curCat=null;
function isMentorCat(c){return /mentor/i.test(c);}
function renderCats(){var c=$("#cats");c.innerHTML="";[{cat:"Todas"}].concat(CATS).forEach(function(x){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=x.cat;b.setAttribute("aria-pressed",String((x.cat==="Todas"&&!curCat)||x.cat===curCat));b.onclick=function(){curCat=x.cat==="Todas"?null:x.cat;renderCats();renderFaq();};c.appendChild(b);});}
function renderFaq(){
  var qtxt=fq.value.trim(),ts=Array.from(new Set(terms(qtxt))),items=FAQ.filter(function(f){return !curCat||f.cat===curCat;});
  if(ts.length){items=items.map(function(f){return {f:f,s:ts.reduce(function(a,w){return a+(f.n.indexOf(w)>=0?(norm(f.q).indexOf(w)>=0?3:1):0);},0)};}).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;}).map(function(x){return x.f;});}
  faqEl.innerHTML="";
  var gs=ts.length?[[null,items]]:CATS.map(function(c){return [c.cat,items.filter(function(f){return f.cat===c.cat;})];}).filter(function(g){return g[1].length;});
  gs.forEach(function(g){var d=document.createElement("div");d.className="fgroup";if(g[0]){var h=document.createElement("h3");h.textContent=g[0];d.appendChild(h);}
    g[1].forEach(function(f,idx){var det=document.createElement("details");det.className="qa";var x=isMentorCat(f.cat)?null:L(f.cls);
      det.innerHTML="<summary><span>"+hl(">"+esc(f.q)+"<",ts).slice(1,-1)+'</span><i aria-hidden="true">+</i></summary><div class="ans">'+hl(md(f.a),ts)+(x?'<button class="btn go" type="button">Ver: '+esc(x.title)+"</button>":(isMentorCat(f.cat)?'<button class="btn go" type="button">Ir a Tu '+mw+"</button>":""))+"</div>";
      var go=det.querySelector(".go");if(go)go.onclick=function(){if(x)openLesson(f.cls);else setTab("M");};
      if(ts.length&&idx===0)det.open=true;d.appendChild(det);});faqEl.appendChild(d);});
  fcount.textContent=ts.length?(items.length?items.length+(items.length===1?" respuesta":" respuestas")+' para "'+qtxt+'"':'No hay una pregunta frecuente sobre "'+qtxt+'". Pregúntale a tu '+mw+"."):"";
}
var ft;fq.addEventListener("input",function(){clearTimeout(ft);ft=setTimeout(renderFaq,150);});

/* ---------- mentor ---------- */
(function(){
  var M=MENTOR,h='<div class="m-col"><div><h2 class="sec-h">'+esc(M.title)+'</h2><p class="sec-p">'+esc(M.intro)+"</p></div>"+
    '<ul class="m-can">'+M.can.map(function(c){return "<li><b>"+esc(c[0])+"</b><span>"+esc(c[1])+"</span></li>";}).join("")+"</ul>"+
    '<div class="m-dl"><button type="button" class="btn solid" id="dlZip" hidden>Descargar '+(mw==="mentor"?"el mentor":"la mentora")+' (.zip)</button>'+(CFG.mdVar?'<button type="button" class="btn" id="dlMd" hidden>Descargar las instrucciones (.md)</button>':"")+'</div><p class="m-note" id="dlMsg">'+esc(M.notes[0]||"")+"</p></div>"+
    '<div class="m-col"><h3 class="m-h">Cómo '+(mw==="mentor"?"instalarlo":"instalarla")+'</h3><ol class="m-steps">'+M.steps.map(function(s){return "<li><span>"+esc(s)+"</span></li>";}).join("")+"</ol>"+
    '<div class="m-prompts">'+M.prompts.map(function(p,i){return '<div class="m-prompt"><q id="mp'+i+'">'+esc(p)+'</q><button type="button" class="btn" data-copy="mp'+i+'">Copiar</button></div>';}).join("")+"</div>"+
    (M.notes[1]?'<p class="m-note">'+esc(M.notes[1])+"</p>":"")+(M.limits.length?'<div class="m-limits" aria-label="Límites">'+M.limits.map(function(s){return "<span>"+esc(s)+"</span>";}).join("")+"</div>":"")+"</div>";
  $("#mentorView").innerHTML='<div class="mentorv">'+h+"</div>";
  $$("[data-copy]").forEach(function(btn){btn.addEventListener("click",function(){var el=document.getElementById(btn.getAttribute("data-copy"));function selt(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="Seleccionado";}
    try{navigator.clipboard.writeText(el.textContent).then(function(){btn.textContent="Copiado";setTimeout(function(){btn.textContent="Copiar";},1600);},selt);}catch(e){selt();}});});
  if(window.claude&&window.claude.use){window.claude.use("downloads").then(function(dl){
    var msg=$("#dlMsg"),bz=$("#dlZip"),bm=$("#dlMd");if(!dl)return;
    bz.hidden=false;if(bm)bm.hidden=false;msg.textContent=CFG.mdVar?"El .zip es el que se sube a Claude. El .md es el texto de las instrucciones, por si quieres leerlo.":"El .zip es el que se sube a Claude.";
    function bytes(b64){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
    function save(name,data){dl.save({filename:name,data:data}).then(function(){msg.textContent="Listo: "+name+" descargado.";},function(e){var c=e&&e.code;
      if(c==="declined")msg.textContent="Descarga cancelada.";else if(c==="rate_limited")msg.textContent="Ya hay una descarga abierta. Termínala e intenta de nuevo.";else{msg.textContent=M.notes[0]||"Aquí no se puede descargar.";bz.hidden=true;if(bm)bm.hidden=true;}});}
    bz.onclick=function(){save(CFG.zipName,bytes(window[CFG.zipVar]));};if(bm)bm.onclick=function(){save(CFG.mdName,bytes(window[CFG.mdVar]));};
  });}
})();

if(!(window.claude&&window.claude.use)&&/^https?:/.test(location.protocol)){var a=$("#dlZip"),b=$("#dlMd");a.hidden=false;a.onclick=function(){location.href=CFG.zipName;};if(b){b.hidden=false;b.onclick=function(){location.href=CFG.mdName;};}$("#dlMsg").textContent="El .zip es el que se sube a Claude. El .md es el texto de las instrucciones, por si quieres leerlo.";}
/* ---------- reader sheet ---------- */
var cur=null;
function neighbours(id){var k=ORDER.indexOf(id);return {prev:ORDER[k-1],next:ORDER[k+1]};}
function where(x){if(x.id===0)return CFG.welcomeLabel||"Bienvenida";if(isStep(x.id)){var a=actOf(x.id);return label(x.id)+" de "+N+(a&&a.name!=="Clases"?", "+a.name:"");}return x.kicker;}
function sheetHTML(x){
  var b=lessonBody(x.body),nb=neighbours(x.id),s=seen.has(x.id),nx=nb.next!==undefined?L(nb.next):null;
  var num=isStep(x.id)?(SKIN.readerNum?SKIN.readerNum(x,CTX):String(x.id)):null;
  var turn=b.tasks.length?'<section class="turn"><h3>Tu turno</h3>'+b.tasks.map(function(t){return '<div class="task"><h4>'+esc(t.title)+"</h4>"+t.html+"</div>";}).join("")+
    '<label class="nb-l" for="nb">Tu cuaderno</label><textarea id="nb" placeholder="Escribe aquí tu ejercicio. Se guarda en este dispositivo."></textarea><span class="saved" id="nbs"></span></section>':"";
  return '<div class="grab" id="grab"><span class="where">'+esc(where(x))+'</span><button type="button" class="x" id="closeB">Cerrar</button></div><div class="scroll" id="scroll">'+
    '<div class="r-head'+(num?"":" nonum")+'">'+(num?'<span class="r-num" aria-hidden="true">'+esc(num)+"</span>":"")+'<p class="r-k">'+esc(isStep(x.id)?label(x.id):(x.id===0?(CFG.welcomeLabel||"Bienvenida"):x.kicker))+'</p><h1 class="r-title" id="rTitle">'+esc(ttl(x))+'</h1></div><p class="r-topic">'+esc(x.topic)+'</p><p class="r-intro">'+inline(esc(x.intro))+'</p><div class="lesson-body">'+b.html+"</div>"+turn+
    '<div class="r-foot"><div class="nav"><button class="btn" type="button" id="prevB" '+(nb.prev===undefined?"disabled":"")+'>Anterior</button><button class="btn solid" type="button" id="nextB" '+(nb.next===undefined?"disabled":"")+">Siguiente</button></div>"+
    (isStep(x.id)?'<button class="btn'+(s?" done":"")+'" type="button" id="seenB" aria-pressed="'+s+'">'+(s?"Completada ✓":"Marcar como completada")+"</button>":"")+
    (nx?'<p class="r-next">Sigue: '+esc(ttl(nx))+"</p>":"")+"</div></div>";
}
function openLesson(id,trigger){
  var x=L(id);if(!x)return;
  var fresh=!cur;
  if(fresh){
    var scrim=document.createElement("div");scrim.className="scrim";var sh=document.createElement("div");sh.className="sheet";sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");sh.setAttribute("aria-labelledby","rTitle");
    document.body.appendChild(scrim);document.body.appendChild(sh);document.body.classList.add("sheet-open");
    cur={scrim:scrim,sh:sh,trigger:trigger||document.activeElement};
    scrim.onclick=closeLesson;
  }
  cur.id=id;cur.sh.innerHTML=sheetHTML(x);
  var sh=cur.sh;
  if(fresh)requestAnimationFrame(function(){requestAnimationFrame(function(){sh.classList.add("on");cur&&cur.scrim.classList.add("on");});});
  $("#closeB",sh).onclick=closeLesson;var rt=$("#rTitle",sh);rt.setAttribute("tabindex","-1");rt.focus({preventScroll:true});
  var nb=neighbours(id);
  $("#prevB",sh).onclick=function(){openLesson(nb.prev);};
  $("#nextB",sh).onclick=function(){if((isStep(id)||id===0)&&!seen.has(id)){seen.add(id);saveSeen();refresh();}openLesson(nb.next);};
  var sb=$("#seenB",sh);if(sb)sb.onclick=function(){seen.has(id)?seen.delete(id):seen.add(id);saveSeen();var on=seen.has(id);sb.textContent=on?"Completada ✓":"Marcar como completada";sb.classList.toggle("done",on);sb.setAttribute("aria-pressed",String(on));refresh();};
  var ta=$("#nb",sh);if(ta){ta.value=notes[id]||"";var t;ta.oninput=function(){clearTimeout(t);t=setTimeout(function(){notes[id]=ta.value;store.set(CFG.key+"-notes",notes);$("#nbs",sh).textContent="Guardado en este dispositivo";},400);};}
  $("#scroll",sh).scrollTop=0;
  try{history.replaceState(null,"","#clase-"+id);}catch(e){}
  var g=$("#grab",sh),y0=null,dy=0,t0=0;
  g.addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;y0=e.clientY;dy=0;t0=performance.now();sh.classList.add("drag");try{g.setPointerCapture(e.pointerId);}catch(_){}});
  g.addEventListener("pointermove",function(e){if(y0==null)return;dy=e.clientY-y0;sh.style.transform="translateY("+(dy<0?dy*.15:dy)+"px)";});
  function end(){if(y0==null)return;var v=dy/Math.max(1,performance.now()-t0);sh.classList.remove("drag");sh.style.transform="";y0=null;if(dy>140||v>.5)closeLesson();}
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
}
function closeLesson(){
  if(!cur)return;var c=cur;cur=null;document.body.classList.remove("sheet-open");
  c.sh.classList.remove("on");c.scrim.classList.remove("on");setTimeout(function(){c.sh.remove();c.scrim.remove();},reduce?0:500);
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  var t=document.querySelector('#progView [data-open="'+c.id+'"]')||c.trigger;if(t&&t.focus)t.focus({preventScroll:false});
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&cur)closeLesson();});

/* ---------- boot ---------- */
renderCats();renderFaq();refresh();
var hm=(location.hash||"").replace("#",""),hh=hm.match(/clase-(\d+)/);
if(hh&&L(+hh[1]))openLesson(+hh[1]);else if(hm==="mentor"||hm==="mentora")setTab("M");else if(hm==="preguntas")setTab("F");
})();

</script>
