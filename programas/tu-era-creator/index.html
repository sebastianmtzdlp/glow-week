<script>
var LESSONS_MD="@@ 0 | Empieza aquí | Bienvenida a la nueva era | El curso en 5 minutos\nEste curso te lleva de cero a vender en TikTok Shop como creadora. Aquí está el mapa completo antes de entrar a cada clase.\n\n## Cómo funciona este negocio\nEn TikTok Shop hay dos papeles. El **seller** es la marca o tienda: tiene el inventario, pone precios y manda los paquetes. La **creadora** (también llamada afiliada) eres tú: haces videos o lives de productos que ya están en TikTok Shop, y cada vez que alguien compra desde tu video, ganas una comisión. No compras inventario, no haces envíos y no atiendes devoluciones. Tu trabajo es uno solo: hacer contenido que venda.\n\n## Por qué funciona tan bien\nLa gente entra a TikTok a entretenerse, no a comprar. Cuando le aparece tu video, puede comprar sin salir de la app, incluso mientras sigue escuchándote. A esto se le llama **compra por descubrimiento**: la persona no sabía que quería algo hasta que lo vio. Además, el algoritmo se encarga de encontrar a quién le interesa cada producto, así que no tienes que buscar clientes ni tener un \"nicho\".\n\n## El camino, paso a paso\n1. **Llegar a 2,000 seguidores** (5,000 si estás en Estados Unidos) con videos cortos y sencillos. Es solo un requisito para desbloquear TikTok Shop.\n2. **Activar tu cuenta de creadora** y aprender a moverte en TikTok Studio.\n3. **Elegir productos con datos**, no solo por gusto.\n4. **Hacer los tres tipos de video del embudo**: los que presentan el producto, los que resuelven dudas y los que cierran la venta con la oferta.\n5. **Dominar el hook**: los primeros 2 segundos deciden si alguien se queda.\n6. **Grabar con calidad** sin obsesionarte con la perfección.\n7. **Ser constante**, subir la cantidad poco a poco y, si te late, hacer lives.\n8. **Cuidar tu cuenta** de infracciones y aprovechar los retos que dan dinero extra.\n\n> La habilidad más importante de todo el curso no es técnica: es la tolerancia a la frustración. Lo que TikTok castiga es la intermitencia; lo que premia es la constancia.\n@@ 1 | Clase 1 | El despertar Creator | Qué es TikTok Shop y cómo llegar a 2,000 seguidores\nEn esta clase entiendes el modelo de negocio y arrancas con la primera meta: los 2,000 seguidores.\n\n## Desaprender lo de Instagram\nSi vienes de hacer marca personal en Instagram o Facebook, te enseñaron cosas como \"no vendas todo el tiempo\", \"da contenido de valor\", \"ten un nicho\" o \"cuida que tu feed se vea bonito\". Eso sigue funcionando allá, pero **en TikTok Shop no aplica**. Aquí no necesitas escoger un cliente ideal ni un tema: puedes vender una licuadora hoy y unos leggings mañana, porque cada video tiene su propio algoritmo que lo lleva a quien le interesa ese producto. Y nunca \"vendes demasiado\": vender es justo el objetivo de la plataforma.\n\nUna ventaja enorme: en TikTok no te ven tu mamá, tus primas ni los amigos de tu esposo, sino gente que no te conoce. Eso quita mucha pena. Graba como si fueran pruebas.\n\n## Seller vs. creadora\n- **Seller:** dueño del producto y del stock. Pone precios, maneja inventario, envíos, devoluciones y servicio al cliente. Gana el margen y decide cuánta comisión paga a las creadoras.\n- **Creadora (afiliada):** tú. Encuentras un producto que ya está en TikTok Shop, lo consigues (puede ser uno que ya tengas, uno comprado en otra tienda o, idealmente, comprado en TikTok Shop a otra creadora), haces el video y ganas comisión por cada venta.\n\n> Cuidado: a veces aparece un letrero de \"TikTok Shop te eligió para abrir tu tienda\" o \"90 días sin comisiones\". **No lo aceptes.** Es para sellers, y regresar a creadora después es complicado (hay que escribir a soporte o abrir otra cuenta).\n\n## Cuánto se gana\nLa comisión la pone el seller, casi siempre entre 5% y 12% (lo más común es alrededor de 8%). Ejemplo: una pluma de $400 con 10% te deja $40 por venta. Si ese video vende 50 plumas en un día, ganaste $2,000.\n\nLo mejor es que un video se queda \"vivo\". Puede vender el mismo día, o empezar a vender meses después. Una creadora tiene un video de tópers de cristal que no vendió nada en enero y vendió 388 unidades cuatro meses después; otra tiene un video de leggings que vende todos los días desde hace un año. Eso convierte tus videos en un **ingreso residual**.\n\n## Requisitos para ser creadora\n- México: 2,000 seguidores, ser mayor de edad y haber subido al menos un video en los últimos 180 días.\n- Estados Unidos: 5,000 seguidores.\n- Algunas cuentas entran antes en **prueba piloto** (desde ~1,000 seguidores), pero con límites: menos productos disponibles, un tope de videos al día y menos alcance. La meta sigue siendo llegar a los 2,000.\n- Solo puedes vender en el país donde estás físicamente.\n\n## La estrategia para crecer: videos cortos (b-rolls)\nPara llegar a los seguidores no se hacen videos de venta, sino videos cortitos pensados para viralizar:\n1. **Graba momentos de 6 a 10 segundos** de lo que sea: tomando café, caminando, la carretera desde el coche, escribiendo en tu libreta. Entre más bonita la luz, mejor, pero no te compliques.\n2. **Ponle música en tendencia.** Toca el circulito del audio de un video que te guste y elige \"usar audio\".\n3. **Agrega una frase** que genere identificación, curiosidad o conversación, con la letra \"Classic\" blanca con fondo negro, más o menos al centro.\n4. **Sube mínimo 3 al día.** Es un juego de números: entre más subas, más rápido uno se viraliza.\n\nSe vale copiar tal cual las frases y la música de otras cuentas; en TikTok copiar ayuda, porque así funcionan las tendencias. Y no importa quién te siga: los videos de venta no se muestran a tus seguidores, sino a las personas interesadas en ese producto. Los 2,000 son solo un requisito.\n\n## 📝 Tu tarea\n- Sube hoy 3 videos de b-roll: 6 a 10 segundos, música en tendencia y una frase.\n- Anota qué te falta para llegar a los 2,000 seguidores.\n@@ 2 | Clase 2 | Tu oficina Creator | Activar tu cuenta y moverte en TikTok Studio\nAquí aprendes a activar tu cuenta y a moverte en el panel donde vive todo lo de TikTok Shop.\n\n## Si todavía no llegas a los 2,000\n- Sube de 3 a 5 o hasta 10 videos cortos al día. Revisa que los estés haciendo bien: 6 a 8 segundos, música en tendencia y una frase con letra normal (no texto de reflexiones hablado).\n- Se vale **pagar $200 a $400** para promocionar el video que más vistas tiene; suele dar un buen empujón.\n- Hay lives y videos de \"te sigo y me sigues\": entrar 15 o 20 minutos ayuda, pero no te quedes ahí todo el día.\n- Cada cuenta avanza a su ritmo. Una alumna no vendió nada su primer mes y hoy gana $25,000 a la semana en comisiones. La diferencia fue no soltarlo.\n\n> TikTok solo castiga una cosa: la **intermitencia**. Tres días subes, luego dos no, luego una semana nada... eso sí baja tus vistas. Si eres constante, te premia.\n\n## Dónde está todo\nTodo lo de TikTok Shop está en una sola ruta: **Perfil → TikTok Studio → TikTok Shop para creadores**. A veces aparece como un botón grande y a veces más abajo, en los cuadritos. Lo que está fuera de esa sección (programas de incentivos, misión de marca, regalos en lives) es TikTok normal y no te sirve para Shop.\n\n## Activar tu cuenta\n1. Entra a TikTok Shop para creadores, revisa las palomitas de requisitos y pica **Aplicar**.\n2. Si sale \"en revisión\" o \"rechazada\", no pasa nada: vuelve a intentar en 2 o 3 días. Suele pasar cuando la cuenta creció muy rápido.\n3. **Verifica tu identidad con calma**: CURP, nombre y fecha de nacimiento exactamente como en tu identificación; dirección donde te lleguen paquetes; cuenta bancaria y constancia de situación fiscal. Si algo no coincide, se atora todo.\n4. Cuando te pregunte si las marcas pueden poner anuncios a tus videos, di que sí: te ayuda a vender más.\n\n> Si arriba te aparece la palabra \"Tienda\", te diste de alta como seller por error. Escribe a soporte.\n\n## Qué hay dentro de tu oficina\n- **Estado de la cuenta:** tus puntos e infracciones.\n- **Nivel:** del 1 al 6, según lo que vendes en el mes.\n- **Retos y desafíos:** bonos por subir videos de ciertos productos.\n- **Mercado de productos:** donde buscas y analizas productos con tus datos de creadora.\n- **Administrar vitrina:** los productos que puedes vender.\n- **Ganancias:** lo que te van a depositar.\n- **Gestionar muestras:** las muestras gratis que pediste y lo que te falta grabar.\n\n## Cómo y cuándo te pagan\nTikTok deposita **los miércoles de madrugada**, pero no lo que vendiste esa semana: te paga **15 días después de que el producto llegó a casa del cliente**, porque el cliente puede devolverlo. Por eso las primeras ganancias tardan unas semanas en caer.\n\nDos números que vas a ver mucho:\n- **GMV:** tus ventas totales. Es lo que cuenta para subir de nivel.\n- **Comisión estimada:** lo que realmente te toca.\n\nUn producto barato con comisión de $5 puede ser buen negocio si se vende mucho: unos plumones se vendían 500 en un día.\n\n## Vitrina, carrito y muestras\n- **Carrito** es para cuando tú compras algo. **Vitrina** es lo que tú vendes. Puedes tener cientos de productos en tu vitrina aunque no les hayas hecho video; a veces se venden solos porque TikTok se los ofrece a quien entra a tu perfil.\n- **Muestra gratis:** la marca te regala el producto a cambio de un video. Al principio casi no las aprueban, porque ven que todavía no tienes ventas. Por eso conviene comprar tus primeros 3 a 5 productos.\n- **Muestra reembolsable:** la pagas y te regresan el dinero cuando llegas a cierto número de ventas.\n\n**Tarea:** explora el mercado de productos, agrega al menos 20 a tu vitrina y pide algunas muestras.\n\n## 📝 Tu tarea\n- Entra a TikTok Studio → TikTok Shop para creadores y revisa las palomitas de requisitos.\n- Agrega al menos 20 productos a tu vitrina.\n@@ 3 | Clase 3 | El arte del Winning Product | Cómo elegir productos ganadores\nA partir de aquí TikTok Shop deja de ser teoría. Aprendes a escoger productos con criterio de negocio y a subir tu primer video con carrito.\n\nNunca sabes cuál va a ser tu producto ganador: a una creadora le pegaron unas toallitas húmedas que aceptó casi por compromiso. Por eso conviene tener un poco de todo. Pero antes de invertir, revisa estos seis puntos.\n\n## Los 6 filtros\n1. **Demanda.** Abajo del nombre dice cuántos se han vendido. En TikTok, al revés de lo que pensarías, lo que más se vende es lo que más se va a seguir vendiendo: la gente ya lo vio muchas veces y la marca probablemente le está metiendo publicidad.\n2. **Precio.** Combina productos caros (con pocas ventas suben mucho tu GMV y tu nivel) con productos baratos (se venden en volumen).\n3. **Comisión.** En la ficha del producto hay una pestañita con dos flechitas; al deslizarla ves tu información de creadora. Fíjate en **cuántos pesos ganas**, no solo en el porcentaje. Unas botas con 8.5% pueden dejarte $245 por venta.\n4. **Prueba social.** Buenos reviews (puedes mostrarlos en tu video) y la sección \"Inspo de creadores\", donde ves videos que ya vendieron ese producto.\n5. **Ideas de video.** Si no se te ocurre nada que decir del producto, no lo pidas.\n6. **Seller y stock.** Que sea **tienda oficial** o \"tienda estrella\" y tenga más de 100 unidades. Si un video se viraliza y el producto se agota, te quitan el carrito y se acaba la venta.\n\n> Ejemplo bueno: un rizador en campaña, con 54% de descuento, 2,448 vendidos y tienda oficial. Ejemplo malo: una crema de un seller que no es la marca oficial, con 35 piezas en stock y 5 vendidas.\n\n## Dónde encontrar productos\n- **Mercado de productos → ordenar por \"más vendido\"**, o entra a la campaña del momento (por ejemplo, la venta quincenal): ahí las marcas traen descuentos y publicidad.\n- **Lupa del \"Para ti\" → escribe lo que buscas → pestaña \"Tienda\".**\n- Si el mismo producto lo venden varios sellers, puedes tener ambos en tu vitrina y, al subir el video, elegir el que pague más comisión o traiga descuento.\n\n## Estilos de video\n- **Faceless:** solo se ve el producto, con mucho movimiento.\n- **Voice over:** grabas modelando o mostrando y después le pones tu voz. Es muy fácil al principio porque puedes leer tu guion.\n- **Sketch:** una mini actuación, como una pareja platicando del producto.\n- **A cámara:** hablas a la cámara con el producto en la mano. Es el que más se usa.\n\n## Cómo subir un video con carrito\n1. Ve a tu vitrina, entra al producto, desliza la flechita y pica **Crear → Cámara**. Así el producto ya queda ligado.\n2. Si grabaste con la cámara normal, antes de publicar toca **Agregar enlace** y elige el producto.\n3. **Antes de publicar, revisa que aparezca la canastita amarilla.** Un video de shop sin carrito es infracción.\n\n## Reglas que conviene saber desde ya\n- Tienes que tener el producto físicamente. Nada de fotos fijas como video de venta.\n- Los menores de edad no pueden vender ni salir vendiendo. Unas manitas armando un juguete sí se valen.\n- No digas el precio ni el porcentaje exacto: cambian de un día a otro y te pueden reportar. Mejor \"menos de $200\" o \"trae descuentazo\".\n- No subas el mismo archivo dos veces; sí puedes reusar una toma con otro inicio y otro cierre.\n- No hacen falta hashtags ni descripción, salvo en desafíos o si la marca lo pide.\n- Si una muestra llega rota o de mala calidad, avísale al vendedor y no le hagas video.\n\n## 📝 Tu tarea\n- En el mercado de productos, ordena por \"más vendido\" y escoge 3 productos.\n- Pásalos por los 6 filtros y escribe cuál pasa y por qué.\n@@ 4 | Clase 4 | El Funnel que vende | Los videos TOFU, MOFU y BOFU\nEsta es la base de todo el marketing aplicada a TikTok, y la razón por la que unas creadoras venden mucho y otras casi nada.\n\nEn TikTok Shop no gana el video más bonito, ni el más educativo, ni el más viral. **Gana el que vende.** Hay creadoras con videos de 200 vistas que venden muchísimo. Para lograrlo, piensa tus videos como un embudo de ventas con tres niveles.\n\n## TOFU: videos de descubrimiento\n**Top of funnel.** Imagina que quien te ve nunca ha visto el producto. Aquí lo presentas completo: qué es, para qué sirve, cómo se usa y qué resultado da.\n- **Ejemplos:** problema y solución, antes y después, demostración, mini tutorial.\n- **Duración:** hasta un minuto.\n- **Fórmula:** hook → problema → producto → resultado → carrito naranja.\n\nSon los que todo el mundo hace, pero **no son los que más venden**, porque la persona apenas está conociendo el producto. Úsalos sobre todo con productos que todavía no están posicionados.\n\n## MOFU: videos que resuelven dudas\n**Middle of funnel.** Le hablas a alguien que ya vio el producto, le llamó la atención, pero tiene una duda que la detiene: \"¿será original?\", \"¿estará chafa por barato?\", \"¿sabrá feo?\", \"¿cómo se usa?\".\n- **La clave:** hablas de **una sola objeción**. No vuelvas a explicar todo el producto.\n- **Ejemplos:** review honesto, \"así lo uso yo\", \"pensé que iba a estar chafa y mira\", \"cómo saber que es original\".\n- **Duración:** 30 a 40 segundos.\n- **Fórmula:** hook → historia personal u objeción → prueba → carrito naranja.\n\nSi todavía nadie te hace preguntas, invéntalas: piensa qué te habrías preguntado tú antes de comprarlo.\n\n> Comparaciones sí, pero sin nombrar la marca cara. \"Idénticos a los Lululemon\" es infracción; \"igualitos a los carísimos que siempre compraba\" no.\n\n## BOFU: videos que cierran la venta\n**Bottom of funnel.** Le hablas a alguien que ya vio el producto mil veces y solo necesita el empujón. Aquí **solo hablas de la oferta**: el descuento, el precio bajo, la urgencia. Nada de ingredientes ni beneficios.\n- **Ejemplos:** \"le volvieron a bajar el precio\", \"está en oferta relámpago solo unas horas\".\n- **Duración:** 15 a 30 segundos.\n- **Fórmula:** hook con la oferta → carrito → urgencia → carrito otra vez.\n- **Solo con una oferta real.** Inventar un descuento enoja a la gente y te pueden infraccionar.\n\nLo bonito es que **el algoritmo hace el retargeting solo**: tus BOFU se los muestra a quienes ya vieron muchos videos del producto, aunque sean de otras creadoras. Tú cierras la venta que otras sembraron. Por eso hay críticas a este tipo de videos, pero funcionan.\n\n## Cómo combinarlos\n- Con un producto nuevo, haz **mínimo 3 videos: uno de cada tipo**, grabados en el mismo bloque.\n- Si el producto ya es viral y trae descuento, puedes ir directo a BOFU.\n- De cada BOFU haz unos 5: es más probable que uno pegue que apostarle a uno solo.\n- Los **suplementos** casi siempre se venden con BOFU, porque no puedes hablar de enfermedades ni síntomas.\n- Da igual si subes los videos juntos o repartidos en el día. Muchas creadoras graban 4 productos con 5 videos cada uno.\n- Cuando un producto ya vende, **repítelo a diario**. Es mejor que estar probando productos nuevos sin parar.\n\n## Siempre, siempre: el carrito naranja\nNo asumas que la gente sabe que puede comprar ahí mismo. Muchísimas personas todavía no lo saben. Explícalo: \"arriba de mi nombre, donde dice Tienda, hay un carrito naranja; pícale y ahí mismo lo compras y te llega a tu casa\". Y si hay descuento, cupones o envío gratis, dilo en ese momento.\n\n## 📝 Tu tarea\n- Elige un producto y graba un TOFU, un MOFU y un BOFU en el mismo bloque.\n- Revisa que los tres mandan al carrito naranja.\n@@ 5 | Clase 5 | El poder del Hook | Del scroll a la venta\nSaber qué tipo de video hacer no basta: necesitas que la gente se quede a verlo. Esta clase es sobre los primeros segundos.\n\nTodo video de venta pasa por cuatro pasos: **hook** (atrapar), **retención** (que se quede), **convicción** (que lo quiera) y **acción** (que compre). Antes de vender el producto, tienes que vender el video.\n\n## La regla de oro\nEn TikTok la gente decide en unos **2 segundos** si se queda o sigue scrolleando. Por eso **nunca dejes silencio al inicio**. Cuando grabas es natural picar el botón y tardarte en hablar; antes de publicar, recorta ese pedazo hasta que el video empiece casi cortando tu primera palabra.\n\n## Los tres tipos de hook\n- **Visual:** lo que se ve. Mover mucho el producto, abrir una caja, grabar en el coche, traer lentes o gorra, acercarte y alejarte de la cámara, o poner una foto o video de alguien famoso que usa el producto (en México se puede; en Estados Unidos no).\n- **Hablado:** tu primera frase.\n- **Texto en pantalla:** la frase escrita de los primeros segundos.\n\nProcura que cada video tenga **al menos dos de los tres**, y que cuenten la misma historia.\n\n## Hooks que detienen el scroll\n- **Problema:** \"Si tu brasier se ve así, compra esto.\"\n- **Resultado o teaser:** pones al inicio el momento más impactante, como el antes y después.\n- **Curiosidad:** \"No vayas a comprar esto…\", \"Te cuento lo que me pasó…\".\n- **Demostración:** abrir el paquete, ponerte la prenda en ese momento.\n- **Identificación:** \"Si tú, como yo, batallas con…\"\n- **Advertencia:** \"Te vas a enojar si acabas de comprar esto…\"\n\nListas de hooks hay miles (ChatGPT te da todas las que quieras). El chiste es cómo los combinas con lo visual.\n\n## La estructura de un video que vende\n1. **Hook** sin silencio antes.\n2. **Un solo problema, dolor o deseo.** Es mejor grabar 5 videos con 5 problemas distintos que meter todo en uno.\n3. **Solución y prueba:** muéstralo de cerca, la textura, los reviews.\n4. **Llamado a la acción.** Manda al carrito **dos veces**: una en el primer cuarto o a la mitad del video, y otra al final, porque mucha gente no lo ve completo.\n\n## Ejemplos que vendieron muchísimo\n- **Bloqueador con color, $179,000 en ventas en un mes.** Hook visual moviendo mucho el producto, más una influencer famosa que lo usa. El dolor no fue \"te vas a manchar\", sino \"te ahorras un paso: ya quedas maquillada\".\n- **Pantalones de vestir, $130,000 en un mes.** \"No vayas a comprar estos pantalones si no sabes cómo llevártelos con tres descuentos.\"\n- **Suplemento con los tres hooks:** aplastando la pastilla en cámara, \"esta es la razón por la que siempre hay que leer los reviews\" dicho y escrito.\n\n## Consejos para que te crean\n- **Habla como amiga, no como experta.** \"No sé cómo se llama esta tela, pero está bien suavecita\" vende más que un dato técnico.\n- **Ataca el dolor que la persona quiere resolver**, no las especificaciones. De un brasier, la gente quiere que no apriete, no marque y no se encaje.\n- **El hate da alcance.** Los videos más criticados suelen ser los que más venden, porque la conversación los viraliza.\n- **Para sacar ideas**, entra al perfil de una creadora que venda mucho, ordena por \"Popular\" y analiza solo sus primeros segundos.\n- **Pide guiones a ChatGPT con detalle:** manda la foto del producto y di qué tipo de video quieres, que el hook funcione en TikTok, qué problema resuelve y que termine mandando al carrito naranja.\n- Duración: de 15 segundos a un minuto. Sin portadas, descripción ni hashtags.\n- Puedes grabar muchos videos con el mismo outfit: el algoritmo los manda a audiencias distintas.\n- De cada producto haz de 3 a 5 videos antes de descartarlo.\n- Videos hechos con inteligencia artificial: prohibidos.\n\n## Cómo saber si hay descuento\nNadie te avisa. Antes de grabar, revisa producto por producto: si el precio está en rojo con el original tachado, hay descuento; abajo pueden aparecer cupones rosas o un letrero de oferta relámpago con \"termina en X horas\".\n\n## 📝 Tu tarea\n- Escribe 3 hooks para un producto, uno visual, uno hablado y uno de texto.\n- Recorta el silencio del inicio de tu video más reciente.\n@@ 6 | Clase 6 | Luz, cámara y Sold Out | Cómo grabar con calidad sin perfección\nUn buen producto con un buen guion no sirve si el video está oscuro, no se escucha o no se ve el producto. Esta clase es sobre la parte técnica.\n\nTikTok Shop califica la calidad de tus videos. Así como las infracciones te quitan puntos, **cada lunes te puede dar hasta 10 puntos** si tus videos son claros, se escuchan bien y se nota que están hechos con intención.\n\n## El punto medio\n- **No hagas anuncios.** Videos súper producidos, con muchas tomas, letreros y efectos, parecen publicidad y la gente los pasa.\n- **Tampoco videos descuidados.** Oscuros, con el celular mal puesto o sin que se vea nada.\n- **La meta:** que se sienta como una videollamada con una amiga, pero con buena luz, buen sonido y el producto a la mano. Lo \"casual\" puede ser intencional: acomodar el celular y luego sentarte, por ejemplo.\n- **La perfección no existe.** Si te equivocas, ríete y sigue: eso lo hace más real.\n\n## El producto es el protagonista\n- Debe aparecer en los **primeros 2 segundos** y estar **más cerca de la cámara que tu cara**.\n- **Muévelo todo el tiempo:** ábrelo, úntalo, acércalo, aléjalo, hazlo sonar. La meta es que la persona sienta que ya lo tocó.\n- Un robot revisa que el producto se vea. A una creadora la infraccionaron por vender fajas con ropa encima: no se veía la faja.\n- **Guarda las cajas.** Te sirven para mostrar caja y producto.\n- Aquí no se trata de \"vender sin vender\": desde el primer segundo se ve qué es, qué problema resuelve y cómo se usa.\n\n## Luz, sonido y equipo\n- **Luz de ventana, de frente a ti.** Muestra el color y la textura reales; el aro de luz borra detalles (te ves más bonita, pero se ve menos real). Nunca con la ventana atrás de ti.\n- **El fondo casi no importa**, porque los videos son cerrados en ti y el producto.\n- **Micrófono solo si hay mucho eco.** Apaga sonidos que venden, como abrir el empaque o tocar la tela.\n- **Limpia el lente** con tu playera antes de cada video.\n- El tripié es opcional. Muchas creadoras graban con la cámara frontal, directo desde TikTok.\n\n## Tomas y encuadre\n- **Sin cara:** mueve el celular alrededor del producto: de arriba, de frente, de lado, muy de cerca y completo.\n- **Contigo:** celular fijo, y el que se mueve es el producto.\n- Casi todo se puede grabar en **una sola toma**. Dos tomas también funcionan.\n\n## Edición\n- **Graba, edita y publica dentro de TikTok.** El editor es igual a CapCut y te ahorra mucho tiempo.\n- Solo recorta el silencio del inicio y los errores; si acaso, agrega una foto.\n- **Más videos le ganan a la perfección.** Mejor tres videos directos que uno editado durante una hora.\n\n## 📝 Tu tarea\n- Graba 3 videos con luz de frente y el producto en los primeros 2 segundos.\n- Publica sin editar más de 10 minutos.\n@@ 7 | Clase 7 | Mindset y la era del Live | Constancia, sistema de trabajo y lives\nLo difícil de TikTok Shop no es grabar; es sostenerlo. Esta clase habla de cómo organizarte, cómo lidiar con las críticas y cómo vender en vivo.\n\n## Ser visible incomoda\nCuando empiezas a publicar, alguien va a opinar: conocidos que dicen \"ahora vende chanclitas\" o desconocidos que comentan tu pelo. Casi siempre viene del desconocimiento o de la envidia, y habla más de la otra persona que de ti. Lo que duele es cuando tocan una inseguridad propia; ahí vale la pena trabajarlo.\n\nY un dato práctico: **el hate da alcance.** No borres los comentarios negativos por reflejo; a veces otras personas te defienden, esa conversación viraliza el video y trae ventas.\n\n## Un sistema que puedas sostener\n- **Publicar, observar, ajustar, repetir.** Con 10, 20 o 100 videos empiezas a ver qué vende, qué se viraliza y hasta en qué lugar de tu casa te conviene grabar.\n- **Sube la cantidad poco a poco:** 1 video a la semana → 1 al día → 3 → 5 → 10. Si de golpe subes 20, el algoritmo no lo sostiene y tú tampoco. Hay creadoras que graban unos 20 al día en unas 2 horas, pero empezaron con uno a la semana.\n- **Graba por bloques.** Un rato solo para investigar productos e ideas, otro solo para grabar (sin editar, sin WhatsApp, sin revisar estadísticas) y otro para editar y publicar.\n- **Busca tu mejor hora de energía.** La hora de publicar casi no importa: una alumna doctora graba y publica todo en la noche y está entre las mejores de México.\n- Puedes recomendar **todo lo que usas en tu vida diaria**, te dediques a lo que te dediques.\n- **Ten videos en borradores** para los días en que no puedas grabar. Un día sin subir no pasa nada; varios seguidos sí.\n\n## Cuando algo sale raro\n- **Un video con miles de vistas pero sin ventas es normal.** Repite ese hook, pero habla más de la oferta.\n- **Si el carrito no aparece**, espera unos minutos; si no, usa \"eliminar y volver a editar\" y agrégalo otra vez.\n- **Si el producto se agota**, no borres el video: el carrito vuelve cuando resurten.\n- No te paralices por algo chiquito. Pregúntale a ChatGPT, a soporte o a la cuenta de TikTok Shop México Creators.\n\n## Qué es vender en vivo\nEl live es la otra forma de vender, y hacia allá va el mercado: en China hay lives 24 horas con hasta un millón de personas. La gente puede ver el producto por todos lados, preguntarte en vivo y comprar ahí mismo, a veces con descuentos exclusivos del live. Hay creadoras que venden millones al mes solo en lives.\n\n## Cómo hacer tu live\n1. **Prepárate:** buena conexión, celular cargado o conectado, tripié, luz de frente, productos a la mano y lo básico de cada uno anotado.\n2. **Abre el live:** botón **+ → Live → canastita → agregar productos** (hasta unos 99). Pon arriba tu producto más vendido.\n3. **Arranca como si llevaras horas.** Nada de \"hola, ahorita empezamos\": la gente que entra no sabe cuánto llevas.\n4. **Fija el producto del que estás hablando** y mantenlo visible todo el tiempo.\n5. **Repite el ciclo sin parar:** hook → mostrar → demostrar → beneficios → dudas → oferta → \"los que ya lo agregaron, paguen su carrito\" → preguntas. La gente solo se queda 1 o 2 minutos, así que no te va a oír repetir.\n6. **Sube 2 o 3 videos del mismo producto antes del live.** Los videos llevan gente al live y el live impulsa los videos.\n\nEl algoritmo mide sobre todo tu **primera hora**: si hay ventas y movimiento, te sigue mandando gente.\n\n## Reglas de los lives\n- Nada de alcohol ni bebidas que lo parezcan.\n- No dejes la pantalla vacía, ni silencios largos, ni una imagen fija, ni muestres un producto distinto al fijado, ni uses audios pregrabados.\n- No te ausentes sin que haya movimiento en cámara (una base giratoria con productos sirve si tienes que pararte).\n- Un **moderador** (una amiga, tu pareja o tu segundo celular) puede fijar productos, bloquear gente y poner sonidos de aplausos cuando alguien compra.\n\n## Datos útiles\n- **Niveles:** hay 6, según tus ventas del mes. El nivel 5 es alrededor de $600,000 y el 6 alrededor de $2,000,000.\n- **Muestras:** al inicio te dejan pedir unas 5; en nivel 3, unas 10; más arriba, sin límite. Cuando te llega una, tienes **14 días** para hacerle video.\n- No puedes comprar en tu propia vitrina. Cómprale a otras creadoras: ellas ganan comisión y el favor regresa.\n- Si no sabes qué decir en un live, practica con lives de ejercicio o de lectura usando productos.\n\n## 📝 Tu tarea\n- Escribe tu calendario de la semana con tres bloques: investigar, grabar y publicar.\n- Sube tus videos en borradores para los días en que no puedas grabar.\n@@ 8 | Clase 8 | Las reglas del juego | Infracciones, apelaciones y retos\nLas infracciones son parte del juego, como las tarjetas amarillas en el fútbol. Aquí aprendes a evitarlas, a apelarlas y a ganar dinero extra con los retos.\n\n## El estado de tu cuenta\nEn TikTok Studio → TikTok Shop para creadores, arriba de tu nombre, ves si tu cuenta está \"en buen estado\". Se mide en puntos:\n- **200 a 1,000:** saludable.\n- **Alrededor de 150 a 199:** precaución; no hagas nada arriesgado.\n- **Menos de ~150:** en riesgo; conviene pausar la cuenta. Te pueden bloquear los videos de shop unos días o, en casos graves, cerrarla.\n\nUna infracción suele quitar entre 4 y 8 puntos; una **advertencia** no quita nada. Cada lunes TikTok da puntos por buenos videos y ventas, y las infracciones **se borran a los 90 días**. Para perder la cuenta necesitarías muchísimas.\n\n## Qué te puede infraccionar\n- **El producto:** que esté prohibido o parezca otra cosa (a una creadora le marcaron un masajeador como producto para adultos).\n- **Las promesas:** \"elimina\", \"cura\", \"adelgaza\", \"resultados garantizados en 7 días\".\n- **El contenido:** muy oscuro, una foto fija en lugar de video, o que no se vea bien el producto.\n- **Los derechos:** música, videos o identidad de otras personas, o \"dupes\" nombrando la marca cara.\n- **La compra:** descuentos o stock falsos, o mandar a la gente a WhatsApp o a otra página.\n- **Categorías delicadas:** salud, suplementos, pérdida de peso, aparatos médicos, alcohol y productos para adultos. Evita palabras como diabetes, estrés, ansiedad, tiroides o cáncer.\n\n## Cómo decirlo sin que te infraccionen\n- En vez de \"elimina el acné\": \"¿tienes granitos en la espalda o en las pompis? Cambia el jabón de tu regadera por este\".\n- En vez de \"te quita la ansiedad\": describe la situación: \"si en las noches no puedes dormir porque te quedas pensando…\".\n- En vez de prometer: \"está diseñado para…\", \"según la información del producto…\", \"en mi experiencia, noté…\".\n- Con suplementos, habla de la oferta más que del beneficio.\n- Pídele a ChatGPT palabras alternativas, o pásale las reglas de la comunidad para que tus guiones salgan seguros.\n\n## Qué hacer si te infraccionan\n1. **No borres el video.** Si lo borras, ya no puedes apelar.\n2. **Respira.** No decidas desde el miedo; a todas les pasa.\n3. **Lee la política** que te marcan y revisa el video para entender qué la causó.\n4. **Toma screenshots** de la infracción y 3 o 4 capturas del video (inicio, mitad y final).\n5. **Pídele a ChatGPT el texto de la apelación**, explicando tu caso y pidiendo revisión manual.\n6. **Apela siempre**, aunque creas que tienen razón. La primera infracción la pone un robot, y muchas veces un humano la quita.\n\n## Retos, campañas y tareas\nEn TikTok Shop para creadores → herramientas encuentras **Desafíos**, **Campañas** y **Tareas** (también salen como avisos). Te pagan por cumplir metas, por ejemplo:\n- 3 videos de ciertos productos → $150.\n- Publicar 21 videos en el mes → hasta $1,100.\n- Metas de ventas quincenales → hasta $25,000.\n\nLas metas cambian según tu nivel. Tienes que **unirte** al reto, pero los videos cuentan aunque no los hagas desde ahí, siempre que el producto participe. Además de dinero, te ayudan a agarrar ritmo.\n\n## Otras herramientas que sirven\n- **Aprende de creadores:** videos que ya vendieron mucho; ideal cuando te quedas sin ideas.\n- **Teleprompter**, **vincular productos** a videos que se quedaron sin carrito y **sets de productos** para tus lives.\n- **Academia:** cientos de videos oficiales con tutoriales.\n\n## Respuestas rápidas\n- Si hablaste de un descuento que era real cuando grabaste y te reportan, apela explicando la fecha.\n- Los giveaways en lives se negocian con la marca, y no se dice \"rifa\" ni \"sorteo\".\n- No transmitas el mismo live en dos cuentas.\n- Las agencias suelen quedarse con comisión de todas tus ventas; si firmas, que sea a prueba y sin que te quiten comisión.\n- Tu tarjeta para cobrar se agrega en Ganancias, en el ícono de tarjeta de arriba a la derecha (tarjeta o Mercado Pago).\n- Espera a tener tu primera cuenta en nivel 5 o 6 antes de abrir una segunda.\n\n## 📝 Tu tarea\n- Revisa el estado de tu cuenta en TikTok Studio y anota tus puntos.\n- Si tienes una infracción, redacta la apelación con las capturas. Si no tienes, reescribe un guion sin promesas.\n@@ 13 | Herramientas | Crecer tu cuenta | Cómo llegar a los 2,000 seguidores o arrancar desde cero\nEsta herramienta es para antes de TikTok Shop: cómo sumar seguidores con videos cortos que no venden, y cómo arrancar una cuenta nueva sin perder el ritmo.\n\n## Lo que sí funciona para crecer\n1. **Graba momentos de 6 a 10 segundos:** lo que estés haciendo, caminando, tomando café o escribiendo en tu libreta. La luz bonita ayuda, pero no es obligatoria.\n2. **Pon música en tendencia:** toca el audio de un video que te guste y elige \"usar audio\".\n3. **Agrega una frase** que genere identificación, curiosidad o conversación, con letra blanca sobre fondo negro, más o menos al centro.\n4. **Sube de 1 a 3 videos al día:** es un juego de números. Sube poco a poco: 1 a la semana, luego 1 al día, luego 3.\n5. **Sé constante:** la intermitencia es lo que TikTok castiga. Si subes tres días y luego una semana no, baja tus vistas.\n\n## Lo que no hace falta\n- No necesitas escoger un nicho ni un cliente ideal. Puedes recomendar lo que usas en tu vida diaria.\n- Los seguidores no ven tus videos de venta. Esos llegan a quien le interesa el producto. Los 2,000 solo son un requisito para abrir TikTok Shop.\n\n## Si necesitas un empujón\n- Puedes pagar entre $200 y $400 para promocionar tu video con más vistas. Suele dar un buen impulso.\n- Los lives de 15 o 20 minutos ayudan a conocer gente, pero no te quedes ahí todo el día.\n\n> Cada cuenta avanza a su ritmo. Lo que cuenta es no soltarlo.\n\n## 📝 Tu tarea\n- Graba 3 b-rolls hoy con la música y la frase que te gusten.\n- Escribe en tu hoja de avance cuántos videos subiste esta semana.\n@@ 12 | Herramientas | Medir tu avance | Una lista semanal con números para saber si vas bien\nRevisa esto cada lunes, con los números de la semana anterior. Anótalos en una hoja aparte para ver la tendencia.\n\n## Qué medir cada semana\n- **Videos subidos:** cuántos publicaste. Meta de la semana: la que te toca según la clase 7.\n- **Minutos grabando:** cuánto tiempo pasaste frente a la cámara.\n- **Productos en tu vitrina:** cuántos tienes. Meta de las primeras semanas: 20.\n- **Productos con video:** cuántos de tu vitrina ya tienen al menos un video.\n- **Ventas (pedidos):** cuántos pedidos salieron de tus videos.\n- **GMV:** tus ventas totales. Es lo que cuenta para subir de nivel.\n- **Comisión estimada:** lo que te toca, no el porcentaje.\n- **Estado de la cuenta:** tus puntos. Si bajan, revisa la clase 8 antes de seguir.\n- **Nivel:** del 1 al 6, según tus ventas del mes.\n- **Muestras pedidas y pendientes:** cuántas tienes y cuántas te faltan por grabar.\n\n## Cómo leer los números\n- Si subes videos y no vendes, repite el hook y cambia la oferta. Mira la clase 5.\n- Si vendes pero no subes, la constancia es lo que falta. Mira la clase 7.\n- Si tu estado de cuenta baja, deja de publicar riesgos y revisa la clase 8.\n\n> Un número solo no dice nada. Compara cada semana con la anterior.\n@@ 9 | Herramientas | Tu checklist antes del Post | Revísalo con cada video\nRevisa esto con cada video de venta. Si no cumple todo, súbelo de todos modos: nunca sabes cuál va a pegar.\n\n## Antes de publicar\n- Empieza sin silencio: recortaste el inicio.\n- Tiene al menos 2 de los 3 hooks: visual, hablado y texto.\n- El producto sale en los primeros 2 segundos, claro, de cerca y en movimiento.\n- Hablas de un solo problema, deseo u objeción.\n- Sabes si es TOFU, MOFU o BOFU.\n- Revisaste hoy si tiene descuento; si hablas de la oferta, es real, y no dices el precio ni el porcentaje exacto.\n- Cero promesas de resultados o de salud, sin marcas ajenas y sin mandar fuera de TikTok.\n- Luz de frente y se escucha bien.\n- Mandas al carrito naranja dos veces y explicas dónde está.\n- **La canastita amarilla con el producto está agregada.**\n\n## Rutina semanal sugerida\n- Bloque de investigación: descuentos, campañas, retos y videos que venden en \"Aprende de creadores\".\n- Bloque de grabación: varios productos con varios videos cada uno.\n- Bloque de edición y publicación dentro de TikTok.\n- Repite tus productos ganadores cada día y mete algunas muestras nuevas cada semana.\n- Revisa el estado de tu cuenta y apela cualquier infracción.\n@@ 10 | Herramientas | El diccionario Creator | Las palabras de TikTok Shop\nLas palabras que vas a escuchar todo el tiempo en TikTok Shop.\n\n- **Creadora / afiliada:** tú. Haces videos de productos de otros y ganas comisión.\n- **Seller:** dueño del producto y del stock.\n- **Vitrina (showcase):** los productos que puedes vender y por los que cobras comisión.\n- **Carrito naranja:** el botón del video por donde la gente compra.\n- **Mercado de productos:** buscador de productos con tus datos de creadora (comisión, stock, ventas).\n- **GMV:** tus ventas totales. Define tu nivel.\n- **Comisión estimada:** lo que te toca de esas ventas.\n- **Niveles 1 a 6:** rangos según tus ventas del mes; desbloquean alcance y muestras.\n- **Prueba piloto:** acceso anticipado con ~1,000 seguidores, con límites.\n- **B-roll:** los videos cortos con música y frase para crecer seguidores.\n- **Hook o gancho:** lo que detiene el scroll en los primeros 2 segundos.\n- **TOFU / MOFU / BOFU:** videos para presentar, para resolver una duda y para cerrar con la oferta.\n- **Muestra gratis:** producto que la marca te regala a cambio de un video (tienes 14 días para hacerlo).\n- **Muestra reembolsable:** la pagas y te la regresan al llegar a cierto número de ventas.\n- **Spark code:** código que le das a una marca para que ponga anuncios a tu video.\n- **Oferta relámpago:** descuento de pocas horas, ideal para videos BOFU.\n- **Estado de la cuenta:** tus puntos (sana arriba de 200).\n- **Apelar:** pedir que una persona revise una infracción.\n- **Faceless, voice over, sketch:** estilos de video: sin cara, con voz grabada después, y mini actuación.\n";
var FAQ_MD="## Empezar y seguidores | 1\n\n### ¿Necesito saber de TikTok o tener seguidores para empezar?\nNo. Solo necesitas compromiso y ganas de aprender. De hecho, quienes llegan sin saber nada tienen ventaja: no traen mañas de Instagram que haya que desaprender. Todo lo técnico se aprende picándole y, si algo no aparece, preguntándole a ChatGPT o buscándolo en YouTube.\n\n### ¿Cuántos seguidores necesito para vender?\nEn México, **2,000 seguidores**, ser mayor de edad y haber subido al menos un video en los últimos 180 días. En Estados Unidos son 5,000. Algunas cuentas entran antes en **prueba piloto** (desde unos 1,000), pero con límites: menos productos, un tope de videos al día y menos alcance. Aunque te dejen entrar en piloto, sigue creciendo hasta los 2,000.\n\n### ¿Cómo llego rápido a los 2,000 seguidores?\nCon videos cortos pensados para viralizar (b-rolls):\n1. Graba momentos de **6 a 10 segundos** de lo que sea: tu café, caminando, la carretera desde el coche.\n2. Ponle **música en tendencia**: toca el circulito del audio de un video que te guste y elige \"usar audio\".\n3. Agrega **una frase** que genere identificación, curiosidad o conversación, con la letra \"Classic\" en blanco con fondo negro.\n4. Sube **mínimo 3 al día**; si no avanzas, sube a 5 o 10.\nSe vale copiar frases y música de otras cuentas: en TikTok así funcionan las tendencias.\n\n### Llevo días subiendo videos y no crezco, ¿qué hago?\nPrimero revisa que tus videos estén bien hechos: cortos, con música en tendencia y una frase (no audios de reflexiones). Luego sube la cantidad a 5 o 10 al día. También puedes **pagar $200 a $400** para promocionar el video con más vistas, y entrar 15 o 20 minutos a lives o videos de \"te sigo y me sigues\". Y no pares: cada cuenta tiene su ritmo, y lo único que TikTok castiga es dejar de subir.\n\n### ¿Importa quién me siga?\nNo. Los videos de venta no se muestran a tus seguidores, sino a las personas interesadas en ese producto. Los 2,000 son solo un requisito. Si te siguen cuentas raras, ni las veas; cuando llegues a la meta hasta las puedes bloquear.\n\n### Me salió \"TikTok Shop te eligió para abrir tu tienda\", ¿lo acepto?\n**No.** Ese letrero (a veces dice \"90 días sin comisiones\") es para sellers, es decir, dueños de productos. Si lo aceptas, regresar a creadora es complicado: tendrías que escribir a soporte o abrir otra cuenta.\n\n## Tu cuenta, pagos y comisiones | 2\n\n### ¿Dónde encuentro todo lo de TikTok Shop?\nEn **Perfil → TikTok Studio → TikTok Shop para creadores**. A veces sale como botón grande y a veces más abajo, en los cuadritos. Ahí están tu vitrina, el mercado de productos, tus ganancias, muestras, retos y el estado de tu cuenta. Lo que está fuera de esa sección (programas de incentivos, regalos en lives) es TikTok normal.\n\n### Mi cuenta dice \"en revisión\" o \"rechazada\", ¿qué hago?\nNo pasa nada. Vuelve a intentar en 2 o 3 días desde el mismo lugar. Suele pasar cuando la cuenta creció muy rápido, porque TikTok revisa que no sea un bot. Tarde o temprano te aceptan.\n\n### ¿Qué necesito para verificar mi identidad?\nCURP, nombre y fecha de nacimiento **exactamente** como en tu identificación, una dirección donde te lleguen paquetes, tu cuenta bancaria y la constancia de situación fiscal. Hazlo con calma: si algo no coincide, se atora todo. Para dudas fiscales, pregúntale a tu contador.\n\n### ¿Cuándo y cómo me pagan?\nTikTok deposita **los miércoles de madrugada** en la cuenta que registraste. Pero no paga lo que vendiste esa semana: paga **15 días después de que el producto llegó a casa del cliente**, porque el cliente puede devolverlo. Por eso las primeras ganancias tardan unas semanas.\n\n### ¿Dónde pongo mi tarjeta para que me paguen?\nEn TikTok Shop para creadores → **Ganancias** → el ícono de tarjeta de arriba a la derecha. Puedes poner tu tarjeta de débito o Mercado Pago.\n\n### ¿Cuánto se gana por venta?\nLa comisión la pone cada marca, casi siempre entre 5% y 12% (lo común es alrededor de 8%). Ejemplo: un producto de $400 con 10% te deja $40 por venta; si ese video vende 50 en un día, ganaste $2,000. En la ficha de cada producto ves cuántos pesos exactos ganas.\n\n### ¿Qué es el GMV?\nTus **ventas totales** desde tu vitrina. Es lo que cuenta para subir de nivel. Tu ganancia real es la \"comisión estimada\". Por eso conviene tener productos caros (suben mucho el GMV) y baratos (se venden en volumen).\n\n### ¿Qué son los niveles?\nHay 6 niveles según lo que vendes al mes. Cada nivel te da más alcance, más muestras gratis y más apoyo. Como referencia, el nivel 5 es alrededor de $600,000 al mes y el 6 alrededor de $2,000,000. Si te llega \"ya pasaste a nivel 1\", ¡felicidades!, ya empezaste.\n\n### ¿Qué diferencia hay entre carrito y vitrina?\nEl **carrito** es para cuando tú compras algo. La **vitrina** es lo que tú vendes. Puedes tener cientos de productos en tu vitrina aunque no les hayas hecho video; a veces se venden solos porque TikTok se los ofrece a quien entra a tu perfil.\n\n### ¿Puedo comprar en mi propia vitrina?\nNo, TikTok no te deja. Compra en el mercado de productos o, mejor, a otra creadora: ella gana su comisión y el favor regresa.\n\n## Productos y muestras | 3\n\n### ¿Cómo sé si un producto vale la pena?\nRevisa seis cosas:\n1. **Ventas:** mira cuántos se han vendido. En TikTok, lo más vendido se sigue vendiendo.\n2. **Precio:** combina caros y baratos.\n3. **Comisión en pesos:** desliza la pestañita con flechitas de la ficha.\n4. **Reviews** y la sección \"Inspo de creadores\".\n5. **Que se te ocurran ideas** de video.\n6. **Tienda oficial y más de 100 en stock.** Si se agota, te quitan el carrito.\n\n### ¿Dónde busco productos?\nEn **Mercado de productos**, ordenando por \"más vendido\" o entrando a la campaña del momento (ahí vienen con descuentos). También puedes usar la lupa del \"Para ti\", escribir lo que buscas y abrir la pestaña **Tienda**.\n\n### ¿Cómo pido muestras gratis?\nEn la ficha del producto, si dice \"muestra gratis\", pícale, elige color y talla y envía la solicitud. La marca decide si te la aprueba. Al principio casi no las aprueban porque todavía no tienes ventas, así que conviene comprar tus primeros 3 a 5 productos. Con más nivel te dejan pedir más (unas 5 al inicio, unas 10 en nivel 3).\n\n### Ya me llegó una muestra, ¿cuánto tiempo tengo?\n**14 días** para hacerle video. Tu única obligación es grabarlo. En \"Gestionar muestras\" ves cuáles te faltan.\n\n### ¿Qué es una muestra reembolsable?\nLa pagas tú, y la marca te regresa el dinero cuando llegas a cierto número de ventas con ese producto.\n\n### Me llegó un producto roto o de mala calidad, ¿qué hago?\nAvísale al vendedor y no le hagas video. No vale la pena recomendar algo que no te convence.\n\n### ¿Tengo que tener el producto físicamente?\nSí, la regla dice que lo tengas. Además vende mucho más cuando lo muestras, lo abres y lo usas. Una foto fija del producto no cuenta como video de venta.\n\n## Hacer videos que vendan | 4\n\n### ¿Qué tipo de videos debo hacer?\nTres tipos, como un embudo:\n- **TOFU:** para quien no conoce el producto. Lo presentas completo (hasta 1 minuto).\n- **MOFU:** para quien ya lo vio y tiene una duda. Resuelves **una sola** objeción, como \"¿será original?\" (30 a 40 segundos).\n- **BOFU:** para quien ya está lista. **Solo hablas de la oferta** y mandas al carrito (15 a 30 segundos).\nCon un producto nuevo haz uno de cada tipo. Los BOFU son los que más cierran.\n\n### ¿Cómo hago un video BOFU?\nSolo si el producto tiene una **oferta real**. Empieza hablando de la oferta (\"le volvieron a bajar el precio\"), manda al carrito, crea urgencia (\"es por pocas horas\") y manda al carrito otra vez. Nada de ingredientes ni beneficios. Haz unos 5 del mismo producto: es más probable que uno pegue.\n\n### ¿Qué es un hook y cómo hago uno bueno?\nEs lo que detiene el scroll en los **primeros 2 segundos**. Nunca dejes silencio al inicio: recorta hasta que el video empiece casi cortando tu primera palabra. Usa al menos dos de estos tres: **visual** (mover el producto, abrir una caja, grabar en el coche), **hablado** (tu primera frase) y **texto en pantalla**. Hooks que funcionan: \"Si tu ___ se ve así, compra esto\", \"No vayas a comprar ___ si no sabes…\", \"Te vas a enojar si acabas de comprar esto\".\n\n### ¿Cuánto deben durar los videos?\nEntre 15 segundos y 1 minuto. Los BOFU, cortitos; los que presentan el producto, un poco más largos. No pasa nada si uno dura un poco más o menos.\n\n### ¿Cuántos videos subo al día?\nEmpieza con lo que puedas sostener (1 a 3 al día) y sube poco a poco a 5, 10 o más. No hay límite. Lo que TikTok castiga es la intermitencia, no la cantidad. De cada producto nuevo haz de 3 a 5 videos antes de descartarlo.\n\n### ¿Importa a qué hora publico?\nNo. Puedes subir todos juntos en la noche o repartirlos en el día; funciona igual. Graba a la hora en que tengas más energía.\n\n### ¿Cómo agrego el carrito naranja a mi video?\nDesde tu vitrina, entra al producto, desliza la flechita y pica **Crear → Cámara**. Si grabaste con la cámara normal, antes de publicar toca **Agregar enlace** y elige el producto. Antes de publicar, **revisa que aparezca la canastita amarilla**: un video de shop sin carrito es infracción.\n\n### No me aparece el carrito en el video, ¿qué hago?\nA veces tarda unos minutos. Si pasan 15 minutos y no sale, usa \"eliminar y volver a editar\", agrégalo otra vez y publica. Si el producto se agotó, el carrito desaparece; no borres el video, vuelve solito cuando resurten.\n\n### ¿Cómo sé si un producto tiene descuento?\nNadie te avisa: revisa producto por producto antes de grabar. Si el precio está en rojo con el original tachado, hay descuento. Abajo pueden salir cupones rosas o un letrero de oferta relámpago con \"termina en X horas\".\n\n### ¿Puedo decir el precio o el porcentaje de descuento?\nMejor no. Los precios y descuentos cambian de un día a otro, y si alguien ve tu video cuando ya cambió, te pueden reportar. Di \"trae descuentazo\" o \"menos de $200\".\n\n### ¿Pongo hashtags, descripción o portada?\nNo hacen diferencia. Solo usa hashtags cuando hay un desafío o la marca te lo pide.\n\n### Mi video tiene miles de vistas pero no vende, ¿por qué?\nEs normal. Una cosa es llamar la atención y otra cerrar la venta. Repite ese mismo hook, pero habla más de la oferta y manda al carrito con claridad. Hay videos de 200 vistas que venden mucho.\n\n## Grabar | 6\n\n### ¿Necesito aro de luz, micrófono o tripié?\nNo. La mejor luz es la **de una ventana, de frente a ti**: muestra el color y la textura reales. El micrófono solo si hay mucho eco, porque apaga sonidos que venden (abrir el empaque, la tela). El tripié es opcional.\n\n### ¿Edito en CapCut o en TikTok?\nGraba y edita **dentro de TikTok**: el editor es igual a CapCut y te ahorra tiempo. Solo recorta el silencio del inicio y los errores. Más videos le ganan a la perfección.\n\n### ¿Tengo que salir yo en los videos?\nNo necesariamente. Hay videos sin cara (solo el producto con mucho movimiento), con voz grabada después, mini actuaciones o hablando a cámara. Lo importante es que **el producto se vea claro** desde los primeros segundos.\n\n### ¿Pueden salir mis hijos en los videos?\nLos menores de edad no pueden vender ni salir vendiendo. Que se oigan de fondo no importa, y unas manitas armando un juguete sí se valen.\n\n### ¿Puedo grabar varios videos con la misma ropa?\nSí. El algoritmo los manda a personas distintas, así que nadie lo nota.\n\n## Lives | 7\n\n### ¿Cómo hago un live?\n1. Pica **+ → Live**, abre la canastita y agrega tus productos (el más vendido hasta arriba).\n2. Ten celular cargado, buena conexión, luz de frente y los productos a la mano.\n3. Arranca con tu producto ganador **como si llevaras horas vendiendo**.\n4. **Fija** el producto del que estás hablando y mantenlo visible.\n5. Repite el ciclo: mostrar, demostrar, beneficios, dudas, oferta, \"paguen su carrito\". La gente solo se queda 1 o 2 minutos.\nAntes del live, sube 2 o 3 videos de ese producto: te llevan gente.\n\n### ¿Qué está prohibido en un live?\nAlcohol (o algo que lo parezca), pantalla vacía, silencios largos, una imagen fija, mostrar un producto distinto al fijado, audios pregrabados y ausentarte sin que haya movimiento en cámara.\n\n### Hice mi primer live y no entró nadie\nEs normal en los primeros. Sigue haciéndolos. Si no sabes qué decir, practica con lives de ejercicio o de lectura usando productos.\n\n### ¿Hacer lives me baja las vistas de los videos?\nNo. Son algoritmos distintos y se impulsan entre sí: la gente ve tu video, ve que estás en vivo y entra, o te ve en vivo y después compra en el video.\n\n## Infracciones y retos | 8\n\n### Me pusieron una infracción, ¿qué hago?\n1. **No borres el video**: si lo borras ya no puedes apelar.\n2. Respira; a todas les pasa y casi siempre tiene solución.\n3. Lee qué política marcaron y revisa tu video.\n4. Toma screenshots de la infracción y 3 o 4 capturas del video.\n5. Pídele a ChatGPT el texto de la apelación, pidiendo revisión manual.\n6. **Apela siempre**: la pone un robot y muchas veces un humano la quita.\n\n### ¿Me pueden cerrar la cuenta por una infracción?\nEs muy difícil. Tu cuenta se mide en puntos: arriba de 200 está sana. Una infracción quita unos 4 a 8 puntos, una advertencia no quita nada, cada lunes te dan puntos por buenos videos y las infracciones se borran a los 90 días. Si alguna vez bajas mucho, pausa la cuenta un tiempo.\n\n### ¿Qué palabras no debo decir?\nNada que suene a promesa o a salud: \"elimina\", \"cura\", \"adelgaza\", \"resultados garantizados\", ni enfermedades como diabetes, estrés, ansiedad o cáncer. Tampoco nombres marcas ajenas para comparar ni mandes gente a WhatsApp o a otra página.\n\n### ¿Cómo hablo de un suplemento o una crema sin que me infraccionen?\nDescribe la situación en vez de prometer. En lugar de \"elimina el acné\": \"¿tienes granitos en la espalda? Cambia el jabón de tu regadera por este\". En lugar de \"quita la ansiedad\": \"si en las noches no puedes dormir porque te quedas pensando…\". Usa \"en mi experiencia…\" o \"está diseñado para…\". Con suplementos, habla sobre todo de la oferta.\n\n### ¿Qué son los retos y cómo participo?\nSon metas que TikTok paga: por ejemplo, 3 videos de ciertos productos por $150, o metas de ventas quincenales de hasta $25,000. Están en TikTok Shop para creadores → **Desafíos, Campañas y Tareas**. Tienes que **unirte**, pero los videos cuentan aunque no los hagas desde ahí, siempre que el producto participe.\n\n### ¿Me conviene una agencia?\nCon cuidado: muchas se quedan con comisión de todas tus ventas, no solo de lo que te ayudan. Si firmas, que sea a prueba por poco tiempo y sin que te quiten comisión.\n\n### ¿Abro una segunda cuenta?\nTodavía no. Concéntrate en una hasta llegar a nivel 5 o 6. Dos cuentas al mismo tiempo solo dividen tu energía.\n\n### Me da pena lo que digan de mis videos\nEs normal; ser visible incomoda. Los comentarios negativos casi siempre hablan más de quien los escribe que de ti. Y un dato: el hate da alcance, y los videos con más críticas suelen ser los que más venden.\n";

function md(src){
  var out="",list=null;
  esc(src).split("\n").forEach(function(raw){
    var l=raw.trim(),ul=l.match(/^[-*]\s+(.*)/),ol=l.match(/^\d+[.)]\s+(.*)/);
    if(ul||ol){var tag=ul?"ul":"ol";if(list!==tag){if(list)out+="</"+list+">";out+="<"+tag+">";list=tag;}out+="<li>"+inline((ul||ol)[1])+"</li>";return;}
    if(list){out+="</"+list+">";list=null;}
    if(l.indexOf("### ")===0)out+="<h4>"+inline(l.slice(4))+"</h4>";
    else if(l.indexOf("## ")===0)out+="<h3>"+inline(l.slice(3))+"</h3>";

    else if(l)out+="<p>"+inline(l)+"</p>";
  });
  if(list)out+="</"+list+">";
  return out;
}

function lessonBody(src){
  var parts=src.split(/^## /m),main=parts[0],tasks=[];
  parts.slice(1).forEach(function(p){
    var nl=p.indexOf("\n"),head=(nl<0?p:p.slice(0,nl)).trim(),rest=nl<0?"":p.slice(nl+1);
    var icon=startsIcon(head);
    if(icon)tasks.push({title:head.slice(icon.length).trim(),html:md(rest.trim())});else main+="\n## "+p;
  });
  return {html:md(main.trim()),tasks:tasks};
}
function L(id){for(var i=0;i<LESSONS.length;i++)if(LESSONS[i].id===id)return LESSONS[i];return null;}
var N=CFG.n,STEPS=[];for(var i=1;i<=N;i++)STEPS.push(i);
var ORDER=LESSONS.map(function(l){return l.id;});
var GROUPS=CFG.groups.map(function(g){var p=g[0].split(" · ");return {name:p.length>1?p[1]:g[0],pre:p.length>1?p[0]:"",ids:g[1]};});
var ACTS=GROUPS.filter(function(g){return g.ids.every(function(i){return i>=1&&i<=N;});});
var TOOLS=ORDER.filter(function(i){return i>N;});
var seen=new Set(store.get(CFG.key+"-seen",[])),notes=store.get(CFG.key+"-notes",{});
function saveSeen(){store.set(CFG.key+"-seen",Array.from(seen));}
function isStep(id){return id>=1&&id<=N;}
function nextUp(){if(!seen.has(0)&&!STEPS.some(function(i){return seen.has(i);}))return 0;for(var i=0;i<STEPS.length;i++)if(!seen.has(STEPS[i]))return STEPS[i];return null;}
function count(){return STEPS.filter(function(i){return seen.has(i);}).length;}
function stateOf(id){return seen.has(id)?"seen":(id===nextUp()?"next":"");}
function actOf(id){for(var i=0;i<ACTS.length;i++)if(ACTS[i].ids.indexOf(id)>=0)return ACTS[i];return null;}
function label(id){var x=L(id);if(!x)return "";if(id===0)return CFG.welcomeLabel||"Bienvenida";var m=x.title.match(/^([^·]{1,14}) · /);if(isStep(id)&&m)return m[1];return x.kicker;}
function ttl(x){return x.title.replace(/^[^·]{1,14} · /,"");}
function ctaText(){var n=nextUp();if(n===0)return CFG.ctaStart||"Empezar con la bienvenida";if(n===null)return "Repasar "+(CFG.repaso||"el curso");var l=label(n);return "Seguir con "+(/^Clase/.test(l)?"la ":"el ")+l;}
var CTX={ttl:ttl,L:L,LESSONS:LESSONS,N:N,STEPS:STEPS,ACTS:ACTS,TOOLS:TOOLS,GROUPS:GROUPS,seen:seen,stateOf:stateOf,nextUp:nextUp,count:count,esc:esc,label:label,ctaText:ctaText,cfg:CFG,reduce:reduce,actOf:actOf,open:function(id){openLesson(id);}};

/* ---------- page shell ---------- */
var mw=MENTOR.title.indexOf("mentor ")>=0||/mentor,/.test(MENTOR.title)?"mentor":"mentora";
var SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>';
var root=$("#root");
root.innerHTML='<div class="wrap"><header class="hero" id="hero"></header>'+
  '<div class="tabbar"><div class="tabs" role="tablist" aria-label="Secciones del curso">'+
  '<button class="tab" role="tab" id="tabP" aria-selected="true" aria-controls="progView" type="button">'+esc(CFG.tabProgram||"Programa")+'</button>'+
  '<button class="tab" role="tab" id="tabF" aria-selected="false" aria-controls="faqView" type="button">Preguntas</button>'+
  '<button class="tab" role="tab" id="tabM" aria-selected="false" aria-controls="mentorView" type="button">Tu '+mw+'</button></div></div>'+
  '<section id="progView" role="tabpanel" aria-labelledby="tabP"></section>'+
  '<section id="faqView" role="tabpanel" aria-labelledby="tabF" hidden><div class="faqv"><div><h2 class="sec-h">Preguntas</h2><p class="sec-p">'+esc(CFG.faqLead||"Las dudas que más salen en el equipo, con la clase que las responde.")+'</p></div>'+
  '<label class="sr" for="fq">Busca tu duda</label><div class="f-search">'+SEARCH+'<input id="fq" type="search" placeholder="'+esc(CFG.faqPh||"Busca tu duda")+'" autocomplete="off"></div><div class="f-chips" id="cats"></div><p class="f-count" id="fcount"></p><div id="faq"></div></div></section>'+
  '<section id="mentorView" role="tabpanel" aria-labelledby="tabM" hidden></section>'+
  (CFG.foot?'<footer class="foot">'+esc(CFG.foot)+"</footer>":"")+"</div>";

function renderHero(){$("#hero").innerHTML=SKIN.hero(CTX);var c=$("#cta");if(c)c.onclick=function(){var g=nextUp();if(g===null){setTab("P");$("#progView").scrollIntoView({behavior:"smooth"});}else openLesson(g);};$$("#hero [data-open]").forEach(wireOpen);}
function renderProgram(){$("#progView").innerHTML=SKIN.program(CTX);$$("#progView [data-open]").forEach(wireOpen);if(SKIN.mount)SKIN.mount(CTX,$("#progView"));}
function wireOpen(b){b.onclick=function(){openLesson(+b.getAttribute("data-open"),b);};}
function refresh(){renderHero();renderProgram();}

/* tabs */
var TABS={P:["#tabP","#progView"],F:["#tabF","#faqView"],M:["#tabM","#mentorView"]};
function setTab(t){Object.keys(TABS).forEach(function(k){$(TABS[k][0]).setAttribute("aria-selected",String(k===t));$(TABS[k][1]).hidden=k!==t;});}
Object.keys(TABS).forEach(function(k){$(TABS[k][0]).onclick=function(){setTab(k);};});

/* ---------- faq ---------- */
var norm=function(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");};
var STOP=new Set("que como para por con los las del una uno unos mis tus sus mas pero porque cuando donde esta este eso hay tengo puedo debo".split(" "));
function terms(s){return (norm(s).match(/[a-z0-9ñ]{3,}/g)||[]).filter(function(w){return !STOP.has(w);}).map(function(w){return w.length>5?w.slice(0,-1):w;});}
var FAQ=[],CATS=[];
FAQ_MD.split(/^## /m).filter(function(x){return x.trim();}).forEach(function(block){
  var lines=block.split("\n"),h=lines[0].split("|").map(function(x){return x.trim();});if(!h[0])return;CATS.push({cat:h[0],cls:+h[1]});
  lines.slice(1).join("\n").split(/^### /m).filter(function(x){return x.trim();}).forEach(function(qb){var i=qb.indexOf("\n");if(i<0)return;FAQ.push({cat:h[0],cls:+h[1],q:qb.slice(0,i).trim(),a:qb.slice(i+1).trim()});});
});
FAQ.forEach(function(f){f.n=norm(f.q+" "+f.a);});
function hl(html,ts){if(!ts.length)return html;return html.replace(/(>[^<]+<)/g,function(seg){var out=seg;ts.forEach(function(w){var re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").split("").map(function(ch){return ({a:"[aá]",e:"[eé]",i:"[ií]",o:"[oó]",u:"[uúü]",n:"[nñ]"})[ch]||ch;}).join("")+"[a-záéíóúñü]*)","gi");out=out.replace(re,"<mark>$1</mark>");});return out;});}
var fq=$("#fq"),faqEl=$("#faq"),fcount=$("#fcount"),curCat=null;
function isMentorCat(c){return /mentor/i.test(c);}
function renderCats(){var c=$("#cats");c.innerHTML="";[{cat:"Todas"}].concat(CATS).forEach(function(x){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=x.cat;b.setAttribute("aria-pressed",String((x.cat==="Todas"&&!curCat)||x.cat===curCat));b.onclick=function(){curCat=x.cat==="Todas"?null:x.cat;renderCats();renderFaq();};c.appendChild(b);});}
function renderFaq(){
  var qtxt=fq.value.trim(),ts=Array.from(new Set(terms(qtxt))),items=FAQ.filter(function(f){return !curCat||f.cat===curCat;});
  if(ts.length){items=items.map(function(f){return {f:f,s:ts.reduce(function(a,w){return a+(f.n.indexOf(w)>=0?(norm(f.q).indexOf(w)>=0?3:1):0);},0)};}).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;}).map(function(x){return x.f;});}
  faqEl.innerHTML="";
  var gs=ts.length?[[null,items]]:CATS.map(function(c){return [c.cat,items.filter(function(f){return f.cat===c.cat;})];}).filter(function(g){return g[1].length;});
  gs.forEach(function(g){var d=document.createElement("div");d.className="fgroup";if(g[0]){var h=document.createElement("h3");h.textContent=g[0];d.appendChild(h);}
    g[1].forEach(function(f,idx){var det=document.createElement("details");det.className="qa";var x=isMentorCat(f.cat)?null:L(f.cls);
      det.innerHTML="<summary><span>"+hl(">"+esc(f.q)+"<",ts).slice(1,-1)+'</span><i aria-hidden="true">+</i></summary><div class="ans">'+hl(md(f.a),ts)+(x?'<button class="btn go" type="button">Ver: '+esc(x.title)+"</button>":(isMentorCat(f.cat)?'<button class="btn go" type="button">Ir a Tu '+mw+"</button>":""))+"</div>";
      var go=det.querySelector(".go");if(go)go.onclick=function(){if(x)openLesson(f.cls);else setTab("M");};
      if(ts.length&&idx===0)det.open=true;d.appendChild(det);});faqEl.appendChild(d);});
  fcount.textContent=ts.length?(items.length?items.length+(items.length===1?" respuesta":" respuestas")+' para "'+qtxt+'"':'No hay una pregunta frecuente sobre "'+qtxt+'". Pregúntale a tu '+mw+"."):"";
}
var ft;fq.addEventListener("input",function(){clearTimeout(ft);ft=setTimeout(renderFaq,150);});

/* ---------- mentor ---------- */
(function(){
  var M=MENTOR,h='<div class="m-col"><div><h2 class="sec-h">'+esc(M.title)+'</h2><p class="sec-p">'+esc(M.intro)+"</p></div>"+
    '<ul class="m-can">'+M.can.map(function(c){return "<li><b>"+esc(c[0])+"</b><span>"+esc(c[1])+"</span></li>";}).join("")+"</ul>"+
    '<div class="m-dl"><a class="btn solid" href="'+CFG.zipName+'" download>Descargar '+(mw==="mentor"?"el mentor":"la mentora")+' (.zip)</a>'+(CFG.mdVar?'<a class="btn" href="'+CFG.mdName+'" download>Descargar las instrucciones (.md)</a>':"")+'</div><p class="m-note" id="dlMsg">'+esc(M.notes[0]||"")+"</p></div>"+
    '<div class="m-col"><h3 class="m-h">Cómo '+(mw==="mentor"?"instalarlo":"instalarla")+'</h3><ol class="m-steps">'+M.steps.map(function(s){return "<li><span>"+esc(s)+"</span></li>";}).join("")+"</ol>"+
    '<div class="m-prompts">'+M.prompts.map(function(p,i){return '<div class="m-prompt"><q id="mp'+i+'">'+esc(p)+'</q><button type="button" class="btn" data-copy="mp'+i+'">Copiar</button></div>';}).join("")+"</div>"+
    (M.notes[1]?'<p class="m-note">'+esc(M.notes[1])+"</p>":"")+(M.limits.length?'<div class="m-limits" aria-label="Límites">'+M.limits.map(function(s){return "<span>"+esc(s)+"</span>";}).join("")+"</div>":"")+"</div>";
  $("#mentorView").innerHTML='<div class="mentorv">'+h+"</div>";
  $$("[data-copy]").forEach(function(btn){btn.addEventListener("click",function(){var el=document.getElementById(btn.getAttribute("data-copy"));function selt(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="Seleccionado";}
    try{navigator.clipboard.writeText(el.textContent).then(function(){btn.textContent="Copiado";setTimeout(function(){btn.textContent="Copiar";},1600);},selt);}catch(e){selt();}});});
})();

/* ---------- reader sheet ---------- */
var cur=null;
function neighbours(id){var k=ORDER.indexOf(id);return {prev:ORDER[k-1],next:ORDER[k+1]};}
function where(x){if(x.id===0)return CFG.welcomeLabel||"Bienvenida";if(isStep(x.id)){var a=actOf(x.id);return label(x.id)+" de "+N+(a&&a.name!=="Clases"?", "+a.name:"");}return x.kicker;}
function sheetHTML(x){
  var b=lessonBody(x.body),nb=neighbours(x.id),s=seen.has(x.id),nx=nb.next!==undefined?L(nb.next):null;
  var num=isStep(x.id)?(SKIN.readerNum?SKIN.readerNum(x,CTX):String(x.id)):null;
  var turn=b.tasks.length?'<section class="turn"><h3>Tu turno</h3>'+b.tasks.map(function(t){return '<div class="task"><h4>'+esc(t.title)+"</h4>"+t.html+"</div>";}).join("")+
    '<label class="nb-l" for="nb">Tu cuaderno</label><textarea id="nb" placeholder="Escribe aquí tu ejercicio. Se guarda en este dispositivo."></textarea><span class="saved" id="nbs"></span></section>':"";
  return '<div class="grab" id="grab"><span class="where">'+esc(where(x))+'</span><button type="button" class="x" id="closeB">Cerrar</button></div><div class="scroll" id="scroll">'+
    '<div class="r-head'+(num?"":" nonum")+'">'+(num?'<span class="r-num" aria-hidden="true">'+esc(num)+"</span>":"")+'<p class="r-k">'+esc(isStep(x.id)?label(x.id):(x.id===0?(CFG.welcomeLabel||"Bienvenida"):x.kicker))+'</p><h1 class="r-title" id="rTitle">'+esc(ttl(x))+'</h1></div><p class="r-topic">'+esc(x.topic)+'</p><p class="r-intro">'+inline(esc(x.intro))+'</p><div class="lesson-body">'+b.html+"</div>"+turn+
    '<div class="r-foot"><div class="nav"><button class="btn" type="button" id="prevB" '+(nb.prev===undefined?"disabled":"")+'>Anterior</button><button class="btn solid" type="button" id="nextB" '+(nb.next===undefined?"disabled":"")+">Siguiente</button></div>"+
    (isStep(x.id)?'<button class="btn'+(s?" done":"")+'" type="button" id="seenB" aria-pressed="'+s+'">'+(s?"Completada ✓":"Marcar como completada")+"</button>":"")+
    (nx?'<p class="r-next">Sigue: '+esc(ttl(nx))+"</p>":"")+"</div></div>";
}
function openLesson(id,trigger){
  var x=L(id);if(!x)return;
  var fresh=!cur;
  if(fresh){
    var scrim=document.createElement("div");scrim.className="scrim";var sh=document.createElement("div");sh.className="sheet";sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");sh.setAttribute("aria-labelledby","rTitle");
    document.body.appendChild(scrim);document.body.appendChild(sh);document.body.classList.add("sheet-open");
    cur={scrim:scrim,sh:sh,trigger:trigger||document.activeElement};
    scrim.onclick=closeLesson;
  }
  cur.id=id;cur.sh.innerHTML=sheetHTML(x);
  var sh=cur.sh;
  if(fresh)requestAnimationFrame(function(){requestAnimationFrame(function(){sh.classList.add("on");cur&&cur.scrim.classList.add("on");});});
  $("#closeB",sh).onclick=closeLesson;var rt=$("#rTitle",sh);rt.setAttribute("tabindex","-1");rt.focus({preventScroll:true});
  var nb=neighbours(id);
  $("#prevB",sh).onclick=function(){openLesson(nb.prev);};
  $("#nextB",sh).onclick=function(){if((isStep(id)||id===0)&&!seen.has(id)){seen.add(id);saveSeen();refresh();}openLesson(nb.next);};
  var sb=$("#seenB",sh);if(sb)sb.onclick=function(){seen.has(id)?seen.delete(id):seen.add(id);saveSeen();var on=seen.has(id);sb.textContent=on?"Completada ✓":"Marcar como completada";sb.classList.toggle("done",on);sb.setAttribute("aria-pressed",String(on));refresh();};
  var ta=$("#nb",sh);if(ta){ta.value=notes[id]||"";var t;ta.oninput=function(){clearTimeout(t);t=setTimeout(function(){notes[id]=ta.value;store.set(CFG.key+"-notes",notes);$("#nbs",sh).textContent="Guardado en este dispositivo";},400);};}
  $("#scroll",sh).scrollTop=0;
  try{history.replaceState(null,"","#clase-"+id);}catch(e){}
  var g=$("#grab",sh),y0=null,dy=0,t0=0;
  g.addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;y0=e.clientY;dy=0;t0=performance.now();sh.classList.add("drag");try{g.setPointerCapture(e.pointerId);}catch(_){}});
  g.addEventListener("pointermove",function(e){if(y0==null)return;dy=e.clientY-y0;sh.style.transform="translateY("+(dy<0?dy*.15:dy)+"px)";});
  function end(){if(y0==null)return;var v=dy/Math.max(1,performance.now()-t0);sh.classList.remove("drag");sh.style.transform="";y0=null;if(dy>140||v>.5)closeLesson();}
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
}
function closeLesson(){
  if(!cur)return;var c=cur;cur=null;document.body.classList.remove("sheet-open");
  c.sh.classList.remove("on");c.scrim.classList.remove("on");setTimeout(function(){c.sh.remove();c.scrim.remove();},reduce?0:500);
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  var t=document.querySelector('#progView [data-open="'+c.id+'"]')||c.trigger;if(t&&t.focus)t.focus({preventScroll:false});
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&cur)closeLesson();});

/* ---------- boot ---------- */
renderCats();renderFaq();refresh();
var hm=(location.hash||"").replace("#",""),hh=hm.match(/clase-(\d+)/);
if(hh&&L(+hh[1]))openLesson(+hh[1]);else if(hm==="mentor"||hm==="mentora")setTab("M");else if(hm==="preguntas")setTab("F");
})();

</script>
