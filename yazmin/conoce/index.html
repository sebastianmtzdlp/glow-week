<!doctype html>
<html lang="es" data-base="../" data-page="conoce">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conoce a Yazmin · Farmasi</title>
<meta name="description" content="Conoce a Yazmin, consultora Farmasi, y cómo comprar o hacerte socia.">
<meta property="og:title" content="Conoce a Yazmin · Farmasi">
<meta property="og:description" content="Conoce a Yazmin, consultora Farmasi, y cómo comprar o hacerte socia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/tema.css">
<link rel="stylesheet" href="../../assets/tienda.css">
<script data-goatcounter="https://sebastianmtzdlp.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div id="hdr"></div>
<main id="main"><div class="empty">Cargando…</div></main>
<div id="ftr"></div>
<script src="../../assets/tienda.js"></script>
<script>
T.ready.then(t => {
  const { D, me } = t, { money, esc, link } = T;
  const M = Object.assign({ costo: 499, meta_monto: 2000, desc_default: 30 }, D.membresia || {});
  const ini = me.trim()[0] || "";
  const wa = t.wa(`Hola ${me}, quiero información para hacerme socia Farmasi.`);
  document.getElementById("main").innerHTML = `<div class="wrap">
    <div class="page-h"><div class="eyebrow">Conóceme</div><h1>Hola, soy ${esc(me)}</h1>
      <p>Consultora independiente Farmasi, del Team Nancy y Selene. Esta tienda es mi forma de que elijas con calma y me mandes tu pedido directo por WhatsApp.</p></div>
    <div class="about" style="margin-top:6px"><div class="av">${esc(ini)}</div><div>
      <div class="eyebrow">Cómo comprar</div>
      <ol class="steps" style="margin-top:12px">
        <li><b>Elige</b><span>Recorre la tienda o el catálogo y agrega lo que te guste.</span></li>
        <li><b>Envíame tu pedido</b><span>Con un toque me llega por WhatsApp con todo el detalle.</span></li>
        <li><b>Yo me encargo</b><span>Te confirmo existencias, pago y entrega.</span></li></ol></div></div>
    <section class="sec" id="socia"><div class="sec-h"><h2>Hazte socia</h2></div>
      <p style="color:var(--muted);max-width:60ch;margin-bottom:14px">Si compras seguido, ser socia te da precio especial y puedes vender si quieres. Es opcional.</p>
      <div class="perks">
        <div><svg class="i" viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="8" cy="8" r="1.5"/></svg><span><b>Precio de socia</b><br>Desde ${M.desc_default}% menos sobre el precio de venta; en algunos productos hasta 50%.</span></div>
        <div><svg class="i" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="1"/><path d="M12 8v12M3 12h18M12 8c-2-4-6-3-5 0M12 8c2-4 6-3 5 0"/></svg><span><b>Regalos y envío gratis</b><br>Al llegar a ${money(M.meta_monto)} en productos a precio de socia.</span></div>
        <div><svg class="i" viewBox="0 0 24 24"><path d="M3 12l5 5L21 6"/></svg><span><b>Membresía de ${money(M.costo)}</b><br>${esc(M.kits || "Al entrar hay kits de inicio a precio reducido.")}</span></div>
        <div><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c.8-3.500 3.500-5.500 7-5.500s6.200 2 7 5.500M17 5.500a3.500 3.500 0 0 1 0 6.500M19 14.700c1.700.8 2.700 2.600 3 5.300"/></svg><span><b>Equipo contigo</b><br>Te acompañamos en tus primeras ventas.</span></div>
      </div>
      <div style="margin-top:18px"><a class="btn wa" href="${wa}" target="_blank" rel="noopener">Quiero info por WhatsApp</a></div></section>
    <section class="sec faq"><div class="sec-h"><h2>Preguntas frecuentes</h2></div>
      <details><summary>¿Cómo pago?</summary><p>Después de que me mandas tu pedido te confirmo existencias y te paso las formas de pago disponibles.</p></details>
      <details><summary>¿Cuánto tarda mi pedido?</summary><p>Depende de tu ciudad y de la existencia. Al confirmar tu pedido te doy una fecha estimada.</p></details>
      <details><summary>¿El envío tiene costo?</summary><p>Se cotiza aparte, y es gratis cuando tu pedido llega a la meta que ves en la tienda.</p></details>
      <details><summary>¿Puedo cambiar o quitar productos?</summary><p>Sí, antes de pagar lo ajustamos juntas por WhatsApp.</p></details>
    </section>
    <div class="gift" style="margin-top:46px"><h2>¿Lista para elegir?</h2><p>Entra a la tienda y arma tu pedido.</p><a class="btn" href="${link("tienda/")}">Ir a la tienda</a></div>
  </div>`;
  T.gc("vista/conoce", "Conóceme");
});
</script>
</body></html>
