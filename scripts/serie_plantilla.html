<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<!-- Generada por scripts/eventos.py desde _data/eventos.json con scripts/serie_plantilla.html. No la edites a mano. -->
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITULO}} · Eventos · Mi Tienda Beauty</title>
<meta name="description" content="Todas las ediciones de {{TITULO}}.">
<meta property="og:title" content="{{TITULO}}">
<meta property="og:description" content="Todas las ediciones de {{TITULO}}.">
<meta property="og:url" content="https://mitienda.beauty/{{RUTA}}/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=IBM+Plex+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FFFFFF;--card:#fff;--ink:#262A4A;--muted:#6C7090;--line:#E6E8F0;--accent:#DB414C;--soft:#EEF0F8}
  *{box-sizing:border-box;margin:0}
  html{color-scheme:light;background:#fff}
  a,button{-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
  body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
  @media (min-width:900px){.wrap{max-width:860px;padding-top:30px}#list{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}#list h3,#list .past,#list .empty{grid-column:1/-1}}
  a.top{display:inline-block;margin:22px 0 8px;font-size:14px;color:var(--muted);text-decoration:none}
  .eb{font-size:15px;font-weight:600;color:#C8323F}
  h1{font-size:clamp(34px,7vw,56px);line-height:1.02;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px;text-wrap:balance}
  h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:30px 0 0}
  a.ev{display:flex;gap:14px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;transition:transform 160ms cubic-bezier(.23,1,.32,1),border-color 150ms ease}
  a.ev:active{transform:scale(.98)}
  @media (hover:hover) and (pointer:fine){a.ev:hover{border-color:#C9CDE0}}
  .cal{flex:none;width:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;background:var(--soft);border-left:4px solid var(--c,var(--accent))}
  .cal b{font:700 26px/1 'IBM Plex Mono',ui-monospace,monospace;color:var(--accent)}.cal span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .ev h2{font-size:18px;font-weight:800}.ev p{color:var(--muted);font-size:14px}
  .past a.ev{opacity:.7}
  .empty{color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:20px;padding:18px;margin-top:12px}
  a.back{display:block;margin-top:26px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <a class="top" href="/eventos/">← Todos los eventos</a>
  <div class="eb">Todas las ediciones</div><h1 id="nom"></h1>
  <div id="list"></div>
  <a class="back" href="/">← Volver a Mi Tienda Beauty</a>
</div>
<script id="serie" type="application/json">{{DATOS_JSON}}</script>
<script data-goatcounter="https://sebastianmtzdlp.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
(()=>{
  const S=JSON.parse(document.getElementById("serie").textContent), TZ="America/Mexico_City";
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const part=(d,o)=>new Intl.DateTimeFormat("es-MX",{timeZone:TZ,...o}).format(d);
  document.getElementById("nom").textContent=S.nombre;
  const now=new Date(), E=(S.ediciones||[]).map(e=>({...e,a:new Date(e.desde),b:new Date(e.hasta||e.desde)}));
  const card=e=>`<a class="ev" href="${esc(e.url)}"><div class="cal"${e.color?` style="--c:${esc(e.color)}"`:""}><b>${part(e.a,{day:"numeric"})}</b><span>${part(e.a,{month:"short"}).replace(".","")}</span></div>
    <div><h2>${esc(e.edicion||e.titulo)}</h2><p>${esc(part(e.a,{weekday:"long",day:"numeric",month:"long"}))}${e.lugar?" · "+esc(e.lugar):""}</p>${e.resumen?`<p>${esc(e.resumen)}</p>`:""}</div></a>`;
  const v=E.filter(e=>e.b>=now).sort((x,y)=>x.a-y.a), p=E.filter(e=>e.b<now).sort((x,y)=>y.a-x.a);
  document.getElementById("list").innerHTML="<h3>Próximas</h3>"+(v.length?v.map(card).join(""):'<p class="empty">Pronto anunciamos la siguiente edición.</p>')+(p.length?'<div class="past"><h3>Pasadas</h3>'+p.map(card).join("")+"</div>":"");
})();
</script>
</body>
</html>
