<style>
  :root{--bg:#FAF7F5;--card:#fff;--ink:#262A4A;--muted:#6C7090;--line:#E6E8F0;--accent:#DB414C;--tint:#FDEEF0;--soft:#EEF0F8;--c:var(--accent)}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 60px}
  a.top{display:inline-block;margin:22px 0 12px;font-size:14px;color:var(--muted);text-decoration:none}
  .hero{background:var(--c);color:#fff;border-radius:24px;padding:24px 20px}
  .hero .eb{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
  h1{font-size:34px;line-height:1.05;font-weight:800;margin:8px 0}
  .hero p{font-size:16px;opacity:.92}
  .st{display:inline-block;margin-top:14px;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.18)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}
  .row{display:flex;gap:12px;align-items:flex-start;font-size:15px}.row+.row{margin-top:10px}
  .row i{font-style:normal;flex:none;width:22px;text-align:center}.row small{display:block;color:var(--muted);font-size:13px}
  .txt p+p{margin-top:10px}.txt a{color:var(--accent)}
  ul{padding-left:0;list-style:none;margin-top:12px}li{position:relative;padding-left:22px;margin-top:6px}li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:800}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin-top:10px;font:inherit;font-size:16px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;background:var(--accent);color:#fff}
  .btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .btn{margin-top:10px}
  [hidden]{display:none!important}
  a.back{display:block;margin-top:22px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <a class="top" href="../">← Todos los eventos</a>
  <section class="hero" id="hero"><div class="eb" id="tipo"></div><h1 id="tit"></h1><p id="res"></p><span class="st" id="st"></span></section>
  <div class="card">
    <div class="row"><i>📅</i><div id="cuando"></div></div>
    <div class="row" id="lugarRow"><i>📍</i><div id="lugar"></div></div>
  </div>
  <div class="card txt" id="desc" hidden></div>
  <a class="btn" id="cta" hidden></a>
  <div class="two" id="calBtns"><a class="btn alt" id="gcal" target="_blank" rel="noopener">Google Calendar</a><button class="btn alt" id="ics">Calendario del cel</button></div>
  <a class="btn alt" id="share" target="_blank" rel="noopener">Compartir por WhatsApp</a>
  <a class="back" href="../../">← Volver a Mi Tienda Beauty</a>
</div>
<script id="evento" type="application/json">{"slug": "noche-de-brujas", "titulo": "Noche de Brujas", "tipo": "Venta", "desde": "2026-10-16T00:00:00-06:00", "hasta": "2026-10-25T23:59:59-06:00", "lugar": "En línea, en la tienda de tu consultora", "resumen": "Promos de Miedo: kits con hasta 50 % de descuento.", "descripcion": "Del 16 al 25 de octubre, los favoritos de maquillaje de Farmasi tienen descuento.\n\nElige a tu consultora, arma tu pedido en su tienda y le llega directo a su WhatsApp.", "puntos": ["Kits con hasta 50 % de descuento", "Tu pedido llega directo al WhatsApp de tu consultora", "Termina el 25 de octubre a las 11:59 p. m."], "boton": {"texto": "Elige a tu consultora", "url": "/"}, "color": "#4B2A6B"}</script>
<script data-goatcounter="https://sebastianmtzdlp.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
(()=>{
  const e=JSON.parse(document.getElementById("evento").textContent), $=id=>document.getElementById(id), TZ="America/Mexico_City";
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const part=(d,o)=>new Intl.DateTimeFormat("es-MX",{timeZone:TZ,...o}).format(d);
  const a=new Date(e.desde), b=new Date(e.hasta||e.desde), mismo=part(a,{dateStyle:"short"})===part(b,{dateStyle:"short"});
  const hora=d=>part(d,{hour:"numeric",minute:"2-digit"});
  const gc=(p,t)=>{const go=()=>{try{window.goatcounter.count({path:"eventos/"+e.slug+"/"+p,title:t,event:true})}catch(_){}};if(window.goatcounter&&window.goatcounter.count)go();else window.addEventListener("load",()=>setTimeout(go,300));};
  if(e.color) $("hero").style.setProperty("--c",e.color);
  $("tipo").textContent=e.tipo||"Evento"; $("tit").textContent=e.titulo; $("res").textContent=e.resumen||"";
  $("cuando").innerHTML=mismo
    ? `${esc(part(a,{weekday:"long",day:"numeric",month:"long",year:"numeric"}))}<small>${esc(hora(a))}${b>a?" a "+esc(hora(b)):""} · hora del centro de México</small>`
    : `Del ${esc(part(a,{day:"numeric",month:"long"}))} al ${esc(part(b,{day:"numeric",month:"long",year:"numeric"}))}<small>Termina el ${esc(part(b,{weekday:"long"}))} a las ${esc(hora(b))} · hora del centro de México</small>`;
  if(e.lugar) $("lugar").textContent=e.lugar; else $("lugarRow").hidden=true;

  const link=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  const ps=(e.descripcion||"").split(/\n\s*\n/).filter(x=>x.trim()).map(p=>"<p>"+link(p).replace(/\n/g,"<br>")+"</p>").join("");
  const li=(e.puntos||[]).length?"<ul>"+e.puntos.map(x=>"<li>"+link(x)+"</li>").join("")+"</ul>":"";
  if(ps||li){ $("desc").innerHTML=ps+li; $("desc").hidden=false; }
  if(e.boton&&e.boton.url){ $("cta").textContent=e.boton.texto||"Quiero ir"; $("cta").href=e.boton.url; $("cta").hidden=false; $("cta").onclick=()=>gc("boton",e.boton.texto||"Botón"); }

  // Estado y cuenta regresiva
  const falta=ms=>{const m=Math.max(0,Math.round(ms/6e4)),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mi=m%60;
    return d?`${d} día${d>1?"s":""}${h?` y ${h} h`:""}`:h?`${h} h ${mi} min`:`${mi} min`;};
  const tick=()=>{const n=new Date();
    $("st").textContent = n<a ? "Empieza en "+falta(a-n) : n<=b ? (mismo?"¡Está pasando ahora!":"¡Ya empezó! Termina en "+falta(b-n)) : "Este evento ya terminó";
    $("calBtns").hidden = n>b;};
  tick(); setInterval(tick,30000);

  // Agregar al calendario
  const utc=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const url="https://mitienda.beauty/eventos/"+e.slug+"/", det=(e.resumen?e.resumen+"\n\n":"")+url;
  $("gcal").href="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(e.titulo)+"&dates="+utc(a)+"/"+utc(b>a?b:new Date(+a+36e5))+"&details="+encodeURIComponent(det)+(e.lugar?"&location="+encodeURIComponent(e.lugar):"");
  $("gcal").onclick=()=>gc("calendario","Google Calendar");
  $("ics").onclick=()=>{
    const t=s=>String(s||"").replace(/[\\,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");
    const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//mitienda.beauty//eventos//ES","BEGIN:VEVENT","UID:"+e.slug+"@mitienda.beauty","DTSTAMP:"+utc(new Date()),
      "DTSTART:"+utc(a),"DTEND:"+utc(b>a?b:new Date(+a+36e5)),"SUMMARY:"+t(e.titulo),"DESCRIPTION:"+t(det),e.lugar?"LOCATION:"+t(e.lugar):"","URL:"+url,"END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
    const l=document.createElement("a"); l.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"})); l.download=e.slug+".ics"; l.click(); gc("calendario","Calendario del cel");
  };
  $("share").href="https://wa.me/?text="+encodeURIComponent(e.titulo+(e.resumen?" · "+e.resumen:"")+"\n"+url);
  $("share").onclick=()=>gc("compartir","WhatsApp");
})();
</script>
</body>
</html>
