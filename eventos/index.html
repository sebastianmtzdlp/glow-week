<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eventos · Mi Tienda Beauty</title>
<meta name="description" content="Talleres, mañanas y reuniones en persona del equipo Farmasi. Elige tu zona y aparta tu lugar.">
<meta property="og:title" content="Eventos · Mi Tienda Beauty">
<meta property="og:description" content="Talleres, mañanas y reuniones en persona del equipo Farmasi. Elige tu zona y aparta tu lugar.">
<meta property="og:url" content="https://mitienda.beauty/eventos/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--bg:#FAF7F5;--card:#fff;--ink:#262A4A;--muted:#6C7090;--line:#E6E8F0;--accent:#DB414C;--tint:#FDEEF0;--soft:#EEF0F8}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 60px}
  header{padding:34px 0 14px}.eb{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  h1{font-size:34px;line-height:1.05;font-weight:800;margin:8px 0}
  .lead{color:var(--muted);font-size:16px}
  h3{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 0}
  a.ev{display:flex;gap:14px;align-items:stretch;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}
  a.ev:hover{border-color:var(--accent)}
  .cal{flex:none;width:62px;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;background:var(--c,var(--accent))}
  .cal b{font-size:24px;line-height:1;font-weight:800}.cal span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .ev h2{font-size:18px;font-weight:800;line-height:1.2}.ev h2::after{content:" →";color:var(--accent)}
  .ev p{color:var(--muted);font-size:14px;margin-top:2px}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);margin-bottom:4px}
  .tag.on{background:var(--accent);color:#fff}
  .past a.ev{opacity:.7}.past .cal{background:#9A9DB5}
  .empty{color:var(--muted);font-size:15px;background:var(--card);border:1px dashed var(--line);border-radius:20px;padding:18px;margin-top:12px}
  .zonas{display:flex;gap:8px;overflow-x:auto;margin:16px -18px 0;padding:0 18px 4px;scrollbar-width:none}
  .zonas button{flex:none;font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .zonas button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
  #mapa{height:300px;border-radius:20px;margin-top:12px;border:1px solid var(--line);z-index:0}
  .ev .zn{font-weight:600;color:var(--ink)}
  a.back{display:block;margin-top:26px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="eb">Farmasi · Mi Tienda Beauty</div><h1>Eventos</h1><p class="lead">Talleres, mañanas y reuniones en persona. Elige tu zona y aparta tu lugar.</p></header>
  <div class="zonas" id="zonas" role="group" aria-label="Filtrar por zona"></div>
  <div id="mapa" hidden></div>
  <div id="list"><p class="empty">Cargando eventos…</p></div>
  <a class="back" href="../">← Volver a Mi Tienda Beauty</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script data-goatcounter="https://sebastianmtzdlp.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
(async()=>{
  const TZ="America/Mexico_City", esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const part=(d,o)=>new Intl.DateTimeFormat("es-MX",{timeZone:TZ,...o}).format(d);
  const dia=d=>part(d,{day:"numeric",month:"long"});
  const rango=(a,b)=>{const ka=part(a,{dateStyle:"short"}),kb=part(b,{dateStyle:"short"});
    if(ka===kb) return part(a,{weekday:"long",day:"numeric",month:"long"})+" · "+part(a,{hour:"numeric",minute:"2-digit"});
    return part(a,{month:"long"})===part(b,{month:"long"})?part(a,{day:"numeric"})+" al "+dia(b):dia(a)+" al "+dia(b);};
  let E=[];
  try{ E=(await (await fetch("../_data/eventos.json?v="+Date.now())).json()).eventos||[]; }catch(_){}
  const now=new Date(), ev=E.map(e=>({...e,a:new Date(e.desde),b:new Date(e.hasta||e.desde),href:"/eventos/"+(e.serie?e.serie+"/":"")+e.slug+"/"}));
  const vivos=ev.filter(e=>e.b>=now), zonas=[...new Set(vivos.map(e=>e.zona).filter(Boolean))].sort((x,y)=>x.localeCompare(y,"es"));
  let zona=new URLSearchParams(location.search).get("zona")||"";
  if(!zonas.includes(zona)) zona="";
  // Mapa (OpenStreetMap)
  let mapa=null, capa=null;
  if(window.L&&vivos.some(e=>e.mapa)){ document.getElementById("mapa").hidden=false;
    mapa=L.map("mapa",{scrollWheelZoom:false}); capa=L.layerGroup().addTo(mapa);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(mapa); }
  const card=(e,on)=>`<a class="ev" href="${esc(e.href)}"><div class="cal"${e.color?` style="--c:${esc(e.color)}"`:""}><b>${part(e.a,{day:"numeric"})}</b><span>${part(e.a,{month:"short"}).replace(".","")}</span></div>
    <div><span class="tag${on?" on":""}">${on?"Ahora · ":""}${esc(e.tipo||"Evento")}</span><h2>${esc(e.titulo)}</h2><p>${esc(rango(e.a,e.b))}</p><p>${e.zona?`<span class="zn">${esc(e.zona)}</span>`:""}${e.zona&&e.lugar?" · ":""}${esc(e.lugar||"")}</p>${e.resumen?`<p>${esc(e.resumen)}</p>`:""}</div></a>`;
  const pinta=()=>{
    const z=e=>!zona||e.zona===zona;
    const ahora=ev.filter(e=>e.a<=now&&now<=e.b&&z(e)).sort((x,y)=>x.b-y.b),
          prox=ev.filter(e=>e.a>now&&z(e)).sort((x,y)=>x.a-y.a),
          pas=ev.filter(e=>e.b<now&&z(e)).sort((x,y)=>y.b-x.b).slice(0,6);
    let h="";
    if(ahora.length) h+="<h3>Ahora</h3>"+ahora.map(e=>card(e,true)).join("");
    h+="<h3>Próximos</h3>"+(prox.length?prox.map(e=>card(e)).join(""):`<p class="empty">${zona?"Por ahora no hay eventos en "+esc(zona)+".":"Pronto anunciamos el siguiente evento."}</p>`);
    if(pas.length) h+='<div class="past"><h3>Ya pasaron</h3>'+pas.map(e=>card(e)).join("")+"</div>";
    document.getElementById("list").innerHTML=h;
    document.getElementById("zonas").innerHTML=zonas.length?["",...zonas].map(x=>`<button aria-pressed="${x===zona}" data-z="${esc(x)}">${esc(x||"Todas")}</button>`).join(""):"";
    document.querySelectorAll("#zonas button").forEach(bt=>bt.onclick=()=>{zona=bt.dataset.z; history.replaceState(null,"",zona?"?zona="+encodeURIComponent(zona):location.pathname); pinta();});
    if(mapa){ capa.clearLayers(); const pts=[...ahora,...prox].filter(e=>e.mapa);
      pts.forEach(e=>L.circleMarker(e.mapa,{radius:10,color:"#fff",weight:3,fillColor:e.color||"#DB414C",fillOpacity:1}).bindPopup(`<b>${esc(e.titulo)}</b><br>${esc(rango(e.a,e.b))}<br><a href="${esc(e.href)}">Ver evento</a>`).addTo(capa));
      if(pts.length===1) mapa.setView(pts[0].mapa,13); else if(pts.length) mapa.fitBounds(pts.map(e=>e.mapa),{padding:[30,30]}); else mapa.setView([19.4326,-99.1332],11); }
  };
  pinta();
})();
</script>
</body>
</html>
