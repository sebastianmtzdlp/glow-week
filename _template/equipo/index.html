<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITULO}} / {{NOMBRE_EQ}} · Mi Tienda Beauty</title>
<meta name="description" content="{{NOMBRE_EQ}} de Mi Tienda Beauty. {{BIENVENIDA}}">
<meta name="robots" content="index,follow">
<link rel="icon" href="../../favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0E1B17;--card:#16302A;--ink:#F4F7EE;--muted:#A9BDB4;--acc:#B6F26A;--acc-ink:#0E1B17;--line:#24453C;--sans:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F3F8F4;--card:#FFFFFF;--ink:#0E1B17;--muted:#4F655D;--acc:#2F7A3A;--acc-ink:#FFFFFF;--line:#D6E4DA}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  @media(min-width:900px){.wrap{max-width:1200px}}
  .top{border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;justify-content:space-between;align-items:center;height:52px;font-size:13px;color:var(--muted)}
  .top b{color:var(--ink);font-weight:700}
  .hero{padding:34px 0 22px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
  h1{font-size:clamp(40px,9vw,72px);line-height:.98;font-weight:800;letter-spacing:-.03em;margin:10px 0 12px}
  .lede{color:var(--muted);max-width:52ch;font-size:17px;margin:0 0 20px}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:var(--acc-ink);border-radius:14px;padding:14px 20px;font-weight:700;font-size:15px}
  h2{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:34px 0 14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
  .m{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px;min-height:150px}
  .m .av{width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-size:18px;margin-bottom:auto}
  .m .nm{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .m .ig{font-size:13px;color:var(--muted)}
  .m .go{font-size:13px;font-weight:700;color:var(--acc);margin-top:6px}
  .m.lead{border-color:var(--acc)}
  .empty{color:var(--muted);padding:12px 0}
  footer{margin-top:44px;padding:24px 0 34px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><span><b>Mi Tienda Beauty</b> / {{NOMBRE_EQ}}</span><a href="../../">Ver tienda</a></div></header>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">{{NOMBRE_EQ}}</div>
    <h1>{{TITULO}}</h1>
    <p class="lede" id="bienvenida">{{BIENVENIDA}}</p>
    <a class="btn" id="escribe" target="_blank" rel="noopener" href="#">Escríbele a {{TITULO}}</a>
  </section>
  <h2>Consultoras del equipo</h2>
  <div class="grid" id="miembros"></div>
  <p class="empty" id="vacio" hidden>Pronto verás aquí a las consultoras del equipo.</p>
</main>
<footer><div class="wrap">Consultoras independientes de Farmasi México. Tu consultora confirma precios y disponibilidad contigo por WhatsApp.</div></footer>
<script>
(async () => {
  const TEAM = "{{TEAM}}";
  const esc = t => String(t==null?"":t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let E = {consultoras:[]}, T = {};
  try { E = await (await fetch("../../_data/equipo.json?v=" + Date.now(), {cache:"no-store"})).json(); } catch(_){}
  try { T = (await (await fetch("../../_data/equipos.json?v=" + Date.now(), {cache:"no-store"})).json())[TEAM] || {}; } catch(_){}
  const lider = (E.consultoras||[]).find(c => c.slug === T.lider) || {};
  const miembros = (E.consultoras||[]).filter(c => (c.equipo||"") === TEAM);
  const wa = lider.whatsapp ? "https://wa.me/" + lider.whatsapp + "?text=" + encodeURIComponent("Hola " + (lider.nombre||"") + ", vi el sitio del equipo y quiero saber cómo empezar.") : "#";
  const btn = document.getElementById("escribe"); if (btn) btn.href = wa;
  document.getElementById("miembros").innerHTML = miembros.map(c => {
    const lead = c.slug === T.lider;
    return `<a class="m${lead ? " lead" : ""}" href="../../${esc(c.slug)}/"><span class="av">${esc((c.nombre||"?").charAt(0))}</span><span class="nm">${esc(c.nombre)}</span>${c.ig ? `<span class="ig">@${esc(c.ig)}</span>` : ""}<span class="go">${lead ? "Líder · " : ""}Ver su tablero →</span></a>`;
  }).join("");
  if (!miembros.length) document.getElementById("vacio").hidden = false;
})();
</script>
</body>
</html>
