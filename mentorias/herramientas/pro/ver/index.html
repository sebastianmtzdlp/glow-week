<!doctype html>
<html lang="es-MX" data-cuenta="h-pro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis planes Pro</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/mentorias/herramientas/base.css">
<style>
.entrar{max-width:520px;padding:44px 0 32px}
.entrar form{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.entrar input{flex:1 1 220px;font:500 20px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em}
.entrar .error{color:#B42318;margin:12px 0 0;min-height:1.3em}
.mios{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:24px -16px 0;padding:0 16px 4px}
.mios::-webkit-scrollbar{display:none}
.mios button,.mios a{flex:none;min-height:42px;padding:0 16px;border:1px solid #CFD2E0;border-radius:999px;background:#fff;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);transition:transform 160ms var(--ease)}
.mios button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.mios a{border-style:dashed;color:var(--muted)}
.mios button:active{transform:scale(.97)}
.libro{display:grid;gap:24px;padding:28px 0 0}
.libro > *{min-width:0}
.libro h1{font-size:clamp(36px,9.5vw,64px)}
.herr{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-top:16px}
.toc{border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:12px 0}
.toc summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.toc summary::-webkit-details-marker{display:none}
.toc summary::after{content:"+";font:400 20px/1 var(--mono);color:var(--muted)}
.toc[open] summary::after{content:"–"}
.toc ol{margin:10px 0 0;padding:0 0 0 1.5em;display:grid;gap:6px;font-size:15px}
.toc ol li::marker{font:400 12px var(--mono);color:var(--muted)}
.toc a{text-decoration:none}
.toc a:hover{text-decoration:underline}
.lectura{max-width:44em}
.cap{padding:8px 0 28px;border-bottom:1px solid var(--line);scroll-margin-top:16px}
.cap > h2{font-size:clamp(28px,7vw,40px);margin:24px 0 14px}
.cap-n{font:500 13px/1 var(--mono);color:var(--accent-ink);margin-top:20px}
.lectura h3{font:600 20px/1.25 var(--body);margin:26px 0 8px}
.lectura h4{font:600 17px/1.3 var(--body);margin:20px 0 6px}
.lectura p{margin:10px 0}
.lectura ul,.lectura ol{padding-left:1.25em;margin:8px 0}
.lectura li{margin:4px 0}
.lectura li::marker{color:var(--accent-ink)}
.lectura strong{font-weight:600}
.tabla-scroll{overflow-x:auto;margin:14px -16px;padding:0 16px}
.lectura table{border-collapse:collapse;font-size:14px;min-width:100%}
.lectura th{font:600 12px/1.3 var(--body);color:var(--muted);text-align:left;padding:8px 10px 8px 0;border-bottom:2px solid var(--ink);vertical-align:bottom}
.lectura td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.lectura td:first-child{font-weight:500}
.cargando{color:var(--muted);padding:24px 0}
@media (min-width:900px){
  .libro{grid-template-columns:260px 1fr;gap:56px;align-items:start}
  .libro .cabeza{grid-column:1 / -1}
  .toc{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
  .tabla-scroll{margin:14px 0;padding:0}
}
@media print{
  .barra,.mios,.herr,.toc,footer{display:none!important}
  .libro{display:block}
  .cap{break-inside:auto}
  .lectura table{font-size:9pt}
  body{font-size:11pt}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="barra"><a class="marca" href="/">EQUIPO SVH</a><a class="volver" href="/mentorias/herramientas/pro/">Herramientas Pro</a></div>

  <section class="entrar" id="entrar" hidden>
    <h1>Mis planes <em>Pro</em></h1>
    <p class="bajada">Escribe el código que te dimos al pagar.</p>
    <form id="fCodigo" autocomplete="off">
      <label class="sr" for="codigo">Tu código</label>
      <input id="codigo" type="text" placeholder="SVH-XXXX-XXXX" autocapitalize="characters" spellcheck="false">
      <button class="btn" type="submit">Abrir</button>
    </form>
    <p class="error" id="error" role="alert"></p>
    <p class="nota">¿Todavía no tienes uno? <a href="/mentorias/herramientas/pro/">Ve los planes</a>.</p>
  </section>

  <div id="dentro" hidden>
    <nav class="mios" id="mios" aria-label="Mis planes"></nav>
    <div class="libro" id="libro"></div>
  </div>
  <footer><p>Equipo SVH · mitienda.beauty · Tu código es personal. No es material oficial de Farmasi; lo que manda es tu Back Office.</p></footer>
</div>
<script src="/mentorias/herramientas/base.js"></script>
<script src="/mentorias/herramientas/pro/pro.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var q = new URLSearchParams(location.search), cod = (q.get("c") || PRO.codigo() || "").toUpperCase(), mios = [], actual = null;
  function entrar(msg){ $("dentro").hidden = true; $("entrar").hidden = false; $("codigo").value = cod; $("error").textContent = msg || ""; }
  function abre(c){
    $("error").textContent = "Revisando…";
    PRO.llama({accion:"abrir", codigo:c}).then(function(j){
      cod = c; PRO.codigo(c); mios = j.productos || [];
      $("entrar").hidden = true; $("dentro").hidden = false;
      var faltan = PRO.productos.filter(function(p){ return mios.indexOf(p.s) < 0; });
      $("mios").innerHTML = mios.map(function(s){ var p = PRO.busca(s); return p ? '<button type="button" data-p="'+s+'" aria-pressed="false">'+p.t+'</button>' : ''; }).join("") +
        (faltan.length ? '<a href="/mentorias/herramientas/pro/">Agregar otro plan</a>' : '');
      var pedido = q.get("p") || location.hash.slice(1).split("-cap")[0];
      libro(mios.indexOf(pedido) >= 0 ? pedido : mios[0]);
    }).catch(function(e){ entrar(e.message); });
  }
  function libro(s){
    actual = s; var p = PRO.busca(s);
    $("mios").querySelectorAll("button").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.p === s); });
    $("libro").innerHTML = '<p class="cargando">Abriendo ' + H.esc(p.t) + '…</p>';
    PRO.llama({accion:"abrir", codigo:cod, producto:s}).then(function(j){
      var caps = j.capitulos || [];
      $("libro").innerHTML = '<div class="cabeza"><h1>' + H.esc(p.t) + '</h1><div class="herr"><button class="btn2" type="button" id="imprimir">Imprimir</button><span class="nota" style="margin:0">' + caps.length + ' partes</span></div></div>' +
        '<details class="toc" id="toc"><summary>Contenido</summary><ol>' + caps.map(function(c){ return '<li><a href="#' + s + '-cap' + c.orden + '">' + H.esc(c.titulo) + '</a></li>'; }).join("") + '</ol></details>' +
        '<div class="lectura">' + caps.map(function(c, i){ return '<section class="cap" id="' + s + '-cap' + c.orden + '"><div class="cap-n">' + String(i + 1).padStart(2, "0") + '</div><h2>' + H.esc(c.titulo) + '</h2>' + c.html + '</section>'; }).join("") + '</div>';
      $("libro").querySelectorAll(".lectura table").forEach(function(t){ var w = document.createElement("div"); w.className = "tabla-scroll"; t.parentNode.insertBefore(w, t); w.appendChild(t); });
      if(matchMedia("(min-width:900px)").matches) $("toc").open = true;
      $("imprimir").onclick = function(){ window.print(); };
      var h = location.hash.slice(1); if(h && document.getElementById(h)) document.getElementById(h).scrollIntoView();
      H.cuenta("leer", s);
    }).catch(function(e){ $("libro").innerHTML = '<p class="cargando">' + H.esc(e.message) + '</p>'; });
  }
  $("mios").addEventListener("click", function(e){ var b = e.target.closest("[data-p]"); if(b){ history.replaceState(null, "", "?p=" + b.dataset.p); libro(b.dataset.p); } });
  $("fCodigo").addEventListener("submit", function(e){ e.preventDefault(); var c = $("codigo").value.trim().toUpperCase(); if(c) abre(c); });
  if(cod) abre(cod); else entrar();
})();
</script>
</body>
</html>
